name: pentu-daily

on:
  schedule:
    # UTC 10:00 = 北京时间 18:00
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and rebuild
        run: python3 fetch.py

      - name: Commit and push
        run: |
          git config user.name "pentu-daily-bot"
          git config user.email "pentu-daily-bot@users.noreply.github.com"
          git add -A
          git commit -m "daily update $(date -u +%F)" || echo "no changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
