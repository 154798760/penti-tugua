:~:text=【7】"}, {"n": 8, "t": "CHAMPS��:行，知道了，还有一跌", "b": "还有一跌", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【8】"}, {"n": 14, "t": "监管核心内容：从限制“卖芯片”转向限制“租算力”\n\r\n• 规则规定，全球任何地方的数据中心（包括通过网络互联、共享资源的多个数据", "b": "转向限制“租算力”\n\n• 规则规定，全球任何地方的数据中心（包括通过网络互联、共享资源的多个数据中心），如果向中国等受限国家（如总部或最终母公司位于中国或D:5国家组的公司）提供超过1200万aggregate TPP（总处理性能）的算力服务，相关服务商必须事先向美国商务部申请出口许可。\n\n• 1200万TPP的算力规模大致相当于约334张英伟达B200芯片或约758张H100芯片的算力总量（具体折算标准视芯片型号而定）。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【14】"}, {"n": 24, "t": "美国证券交易委员会（SEC）前主席根斯勒警告，人工智能（AI）热潮已形成泡沫，可能在2028年美国总统选举前破裂，并引发经济衰退", "b": "主席根斯勒警告，人工智能（AI）热潮已形成泡沫，可能在2028年美国总统选举前破裂，并引发经济衰退，但冲击程度预计不及2008年全球金融危机。\n他预测，一旦泡沫破裂，首当其冲的将是依赖大量借贷、向AI开发商出租算力的新型云计算公司，部分企业可能破产。大型科技公司则较有能力渡过危机。\n根斯勒认为，潜在经济冲击可能与2000年代初互联网泡沫破裂相当，但不会像2008年次贷危机般严重。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【24】"}, {"n": 25, "t": "化石燃料价格上涨和高耗能人工智能（AI）的普及，正推动各国加快推进建造新核电站的计划。截至今年10月中，全球在建核反应堆多达79", "b": "能（AI）的普及，正推动各国加快推进建造新核电站的计划。截至今年10月中，全球在建核反应堆多达79座，是40年来的新高。\n日经亚洲报道，总部设在伦敦的世界核协会的数据显示，2026年已有11座新核反应堆开工建设。若计入计划在15年内投入运行的反应堆，总数将达到201座。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【25】"}, {"n": 30, "t": "2008年黄仁勋的老照片，当年黄仁勋45岁，携女儿黄敏珊到京参加英伟达向汶川地震灾区捐赠爱心电脑教室的慈善活动。", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【30】"}, {"n": 31, "t": "台北101点灯力挺黄仁勋。Taiwan ❤️ Jensen。", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【31】"}, {"n": 34, "t": "在每一年的第一个交易日，买入前一年美股涨幅最高的股票，完整持有一年，然后在下一年的第一个交易日按照策略换手⋯⋯", "b": "一年美股涨幅最高的股票，完整持有一年，然后在下一年的第一个交易日按照策略换手⋯⋯\n那么这10年来，你的年化收益将是70.7%，吊打各路投资大佬。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【34】"}, {"n": 35, "t": "Anthropic一位名叫TaoLin的华人工程师表示:", "b": "Anthropic 一位名叫 Tao Lin 的华人工程师表示:\n还有约 1.3 年，也就是 2027 年底，Al 在智能方面会全面超越人类。\n他还特意强调，他说的全面指的编程、电影等所有领域，全方位的超越。\nAnthropic 这帮人怎么痢爱制造AI焦虑啊?! 他们是不是真的在公司内部看到\n什么? @", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【35】"}, {"n": 36, "t": "据熟悉内情的人士透露，黄仁勋所谓的“帝国式管控”甚至波及到了英伟达的员工食堂", "b": "谓的“帝国式管控”甚至波及到了英伟达的员工食堂\n他被指控强迫员工品尝牛胸肉（Brisket，用牛胸肉制作的烧烤菜肴）\n一位相关人士表示：\n\n“他不停地说：‘这个你一定要尝尝。’”\n\n\n\n“当时的气氛让人无法说出‘不喜欢’这种话。”\n（声明一下：这是段子）", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【36】"}, {"n": 37, "t": "@尹香武 · 腾讯的朋友跟我说。现在整个公司进入到了空前危机感的状态。原因是什么呢。原因是腾讯是以社交为整个商业的核心的。腾讯所", "b": "腾讯的朋友跟我说。现在整个公司进入到了空前危机感的状态。原因是什么呢。原因是腾讯是以社交为整个商业的核心的。腾讯所有的商业模式基本上都是建基于人和人的连接。现在腾讯发现的问题是，AI 大模型崛起之后，之前的那套模式遭遇到了挑战，而且苗头让整个公司感到非常不安。就是人和人之间的联系时长在减少，但是人和 AI 之间的联系在快速的增加，人利用 AI 以及跟 AI 对话逐渐地取代了人和人之间，以前人们看真人拍的视频，现在看 AI 生成的视频，AI 把人们的视觉焦点和时间正在慢慢地夺走了，这个趋势格外地清晰。但是腾讯在 AI 上的进展慢于字节跳动和阿里巴巴、Deep Seek。现在字节跳动，凭借 AI 优势以及抖音，也开始推广自己的抖音支付，正在向腾讯的小金库发动进攻。如果在 AI 上依然没有起色，腾讯就担心自己整个商业模式会被颠覆。腾讯现在必须寻找到适应新形式的新的商业模式了。\n \nJohn Kennedy今天谈到黄仁勋时说：“黄先生选择婚外情的这个决定，让这场性爱成为自特洛伊的海伦以来，代价最昂贵的一次。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【37】"}], "cult": []}}, {"date": "20261118", "label": "11月18日", "week": "周三", "id": "196828", "title": "黄仁勋被迫辞职后，所有负面消息都爆出来了", "cats": {"econ": [{"n": 7, "t": "11月17", "b": "11月17\n日，北京市统计局公布: 10\n月社会消费品零售总额 1270.88 亿\n元，同比\n1 月以来\n伊洛\n-12.1%,\n来最大单月跌幅\n下降 12.08%。这是 2025 年\n最大的单月跌幅。\n北京10月社零创2025年以", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【7】"}, {"n": 9, "t": "五家正在评估该笔融资的银行已展开内部讨论，考虑退出交易或不参与贷款，主要担忧交易可能违反美国新的出口管制规定。这笔融资由总部位于", "b": "开内部讨论，考虑退出交易或不参与贷款，主要担忧交易可能违反美国新的出口管制规定。这笔融资由总部位于新加坡的 AI 云服务商 Aolani Cloud 发起。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【9】"}, {"n": 22, "t": "英国近百万年轻人既没有工作，也没有上学或参加培训，青年就业问题日益严峻。英国政府委托撰写的一份报告呼吁，全面改革福利和就业支援制", "b": "没有上学或参加培训，青年就业问题日益严峻。英国政府委托撰写的一份报告呼吁，全面改革福利和就业支援制度，包括削减25岁以下青年的福利金，并要求长期失业的年轻人参加就业实习计划。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【22】"}, {"n": 25, "t": "2027年加拿大计划引入38万移民，15万留学生，22万工签…房价还得涨", "b": "I +       Government Gouvernement\nof Canada       du Canada\nOur levels targets for 2027\n‘The targets in the 2027-2029 Immigration Levels Plan build on our progress to slow population growth. At the\n‘same time, they help strengthen the Canadian economy and complement Canada's workforce with top global\ntalent.\nThis year's targets keep immigration levels stable, providing predictability for our partners and for Canadians.\na   DA   tt\nTemporary workers                         International students.                    Permanent residents\n220,000       150,000       380,000\nnew temporary workers in", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【25】"}, {"n": 29, "t": "11:29atlsg@_)", "b": "11:29                           atl sg @_)\n\u003c                Q\n计划经济时期，粮票、肉票可以购买同一类别\n下的多种商品，如何避免消费者偏好不同造成\n的结构性短缺?\n计划经济时期有粮票、肉票、油票、布票等各种票证。\n我有一个疑问: 这些票证并不是严格对应某一种具体商品\n的。\n比如粮票可以购买\n米、面粉、杂粮等，肉票也可能在一定\n范围内购买不同种  Silent 如果按照今天超市的\nSKU来计算，一种票证可能覆盖几十甚至上百种商品。\n那么问题来了:\n假设某城市有1000 人，每人每月10 斤粮票，总共发放1万斤\n粮票。\n计划供应3000斤大米、3000斤面粉、4000 斤玉米面。\n但消费者实际想购买的是6000斤大米、3000斤面粉、1000\n斤玉米面。\n虽然粮票总量和粮食供应总量完全一致，但大米仍然\n缺，玉米面却大量积压。\n如果通过进一步细分票证、限制每种商品的购买数量来解\n决，就需要越来越精细地管理商品，甚至细化到不同品种和\n规格。\n如果不细分，又如何解决不同商品之间的供需失衡?\n我的核心疑问是:\n名 写回答             只 邀请回答            O 好问题 1\n2. 如果消费者普遍偏好某一种商品，实际供应中如何处理?", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【29】"}, {"n": 30, "t": "@薛凯-又重名了", "b": "这几天经过各种媒体的科普，大家都知道黄仁勋只持有 3.58% 的英伟达股份，作为公司创始人和三十多年的执掌人，这个股份低吗？", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【30】"}], "soc": [{"n": 1, "t": "资本市场辟谣平台:国常会“不再频繁救市”表态系谣言", "b": "同花顺.实况\n2026-11-18 星期三 13:39\n资本市场辟谣平台: 国常会不再频\n繁救市\"表态系谣言\n据资本市场辟谣平台11月18日消息，近日互\n联网上传播关于“国常会上有人表态不会再频\n繁救市了\"相关信息 。经核查，该信息为谣\n言，系编造会议内容、牌曲炒作政策，严重扰\n乱资本市场预期，影响极其恶盆。(新华财经)\n国次嫩回\nBares Kk 4 SESAN\nts Ar 知识 ， 工具 . 信息 . 社区  sat\n@ 同花顺. 让 投资变得更简单", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【1】"}, {"n": 6, "t": "这次参加深圳的APEC会议的各国元首中，墨西哥总统克劳迪娅・辛鲍姆绝对是真亲民。", "b": "国元首中，墨西哥总统克劳迪娅・辛鲍姆绝对是真亲民。\n她之前已经卖掉了总统专机，用换来的钱建了两家公立医院。所以这次她是乘坐南方航空CZ8032航班来深圳的。而且，她坐的也不是公务舱，而是货真价实的普通座位！跟她同机的旅客证实她的座位是33B，普通经济舱，而且还是靠后的。要知道这趟墨西哥飞深圳的航班，航程长达21个小时。对于一个已经64岁的女性来说，在经济舱卷21个小时是相当辛苦的。这也是为什么为她举行的欢迎仪式是中巴车把她接到机场另一个地方举行的。\n辛鲍姆也是墨西哥历史上第一位货真价实的博士总统，毕业于墨西哥国立自治大学，获得能源工程博士学位。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【6】"}, {"n": 10, "t": "富士山只有7~9月两个月的登山季，其他时候都不开放普通游客登顶，因为天气条件不允许。这人好像还曾是国内救援队的成员，应该有不少登", "b": "季，其他时候都不开放普通游客登顶，因为天气条件不允许。这人好像还曾是国内救援队的成员，应该有不少登山知识，很难理解他为什么要这时候违规登山。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【10】"}, {"n": 12, "t": "这次被查实的四个造谣者，没有一个是千万粉丝的大V：赵某某在短视频平台评论区编造\"黑话涉拐\"谣言，徐某某用两个闲鱼账号自导自演\"A", "b": "个是千万粉丝的大V：赵某某在短视频平台评论区编造\"黑话涉拐\"谣言，徐某某用两个闲鱼账号自导自演\"A4纸偷窃\"，王某某、覃某某从境外搬运AI生成的\"葡萄涉色情\"视频，陈某某伪造\"钓鱼竿涉色情\"截图发到社交平台。但结果呢？\"黑话涉拐\"登上热搜引发社会恐慌，\"A4纸偷窃\"转发11万次，\"葡萄涉色情\"两条视频转发3.3万次，\"钓鱼竿涉色情\"引发数千人关注。\n粉丝少不是免责理由，流量小不代表损害小。法律面前，每个造谣者都要为自己的行为买单。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【12】"}, {"n": 14, "t": "国人这一生太苦了", "b": "800部红果短剧，\n剧名里最常出现的50个词\n样本800部.红果言网真人剧分类页\n2026年11月13日抓取\nSh 里家庭亲情 “ 金钱阶层 MER 里其他\n第1至25名                            第26至50名\nes 25      #2 UmmG\nys 22        ie | NG\na es 14               前夫 0S\n2 es 13                i | MS\nyi 13                mie ms\n28 ee 11                  Fi Gms\nxR = 0                  ae GS\nx) 10                  aug GS\n不服 G7                               TR 0S,\n5 7                                 AS A\n无政 G7                               世子\nBBY G7                               主母\nAS 9 6                                先生\nBe 9 6                                全场\n大做。 Eee 6", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【14】"}, {"n": 20, "t": "Trump在马尼拉答记者问🎙️", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【20】"}, {"n": 27, "t": "参议院56:44已是定局（民主党翻蓝九席：阿拉斯加、堪萨斯、德克萨斯、爱荷华、密西西比、俄亥俄、南卡罗莱纳、北卡罗莱纳、缅因州）", "b": "党翻蓝九席：阿拉斯加、堪萨斯、德克萨斯、爱荷华、密西西比、俄亥俄、南卡罗莱纳、北卡罗莱纳、缅因州）\n\n众议院还有七席未定，目前民主党257:171，已经平了2008年纪录，再多一席，即是史上最大优势", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【27】"}, {"n": 33, "t": "坍塌的桥体堵住航道", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【33】"}, {"n": 33, "t": "@兽爷 · 黄仁勋被迫辞职后，所有负面消息都爆出来了！", "b": "黄仁勋被迫辞职后，所有负面消息都爆出来了！", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【33】"}], "intl": [{"n": 2, "t": "中国国家主席习近平在中国深圳会见俄罗斯总统弗拉基米尔・普京时表示，中俄关系既“风雨不动安如山”，又“风物长宜放眼量”。", "b": "见俄罗斯总统弗拉基米尔・普京时表示，中俄关系既“风雨不动安如山”，又“风物长宜放眼量”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【2】"}, {"n": 3, "t": "11月18日，俄罗斯总统普京在深圳前海国际会议中心出席2026年亚太经合组织工商领导人峰会开幕式，并发表讲话。", "b": "深圳前海国际会议中心出席2026年亚太经合组织工商领导人峰会开幕式，并发表讲话。\n普京表示，亚太地区已成为全球经济中心，是全球主要的工业和技术枢纽，如今的现实已超过十多年前最乐观的预测，深圳体现了中国乃至整个亚洲的技术、经济和社会转型。\n他不具名批评那些试图遏制发展中国家的“昔日霸主”，称俄罗斯“有尊严”地经受住了前所未有的制裁压力。\n“一个更加公正、民主、平等的世界秩序正在确立，以往等级森严、高度集中的结构正让位于新型的、多向延展的横向联系。然而，这些不可阻挡的变化、世界经济重心的转移，并非总能得到恰当的认知。昔日的霸主们不是去适应这些机遇，而是违背公平竞争的逻辑，有时甚至与自身利益相悖，试图阻碍那些已经取得成功和进步的国家的发展。”\n普京认为，外界的压力反而成为俄罗斯的动力，欧元区等制裁方正在被对俄制裁反噬。“欧盟未能适应这些制裁，包括未能适应自愿放弃俄罗斯市场，以及切断了数十年来支撑其繁荣的廉价稳定的俄罗斯能源供应。”\n他强调，俄罗斯出口贸易货币结算结构发生巨大变化，美元和欧元的占比从2021年的85%降至了9%。“我们并没有放弃美元或欧元，而是被剥夺了使用这些货币的权利。坦白地说，那些剥夺我们使用这些货币权利的人已经为此付出了代价。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【3】"}, {"n": 4, "t": "特斯拉CEO马斯克将再度随美国总统特朗普访华，出席深圳APEC峰会。在社交媒体X上，有人发布了马斯克5月份访华的视频，并写道：“", "b": "总统特朗普访华，出席深圳APEC峰会。在社交媒体X上，有人发布了马斯克5月份访华的视频，并写道：“马斯克将重返中国，继续制造新的梗了。”\n\n对此，马斯克转发了这个帖子，并回复了一个哭笑的表情包。\n\n马斯克今年5月也曾随特朗普访华，当时也引发巨大关注。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【4】"}, {"n": 5, "t": "#APEC#亚太经济合作会议领袖代表、宏��集团创办人施振荣18日上午搭乘华航专机，约10时47分抵达深圳宝安国际机场，大陆方面", "b": "袖代表、宏��集团创办人施振荣18日上午搭乘华航专机，约10时47分抵达深圳宝安国际机场，大陆方面铺设红地毯迎接，并派出APEC高官程烈等人接机。\n施振荣与夫人叶紫华下机后，由台湾外交单位国际组织司司长孙俭元迎接，大陆方面则派出APEC高官程烈（同时身为大陆外交部国际经济司参赞）、广东省APEC筹委会代表方涛、深圳市APEC筹委会代表莫士龙等接机，并铺设红地毯表达欢迎。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【5】"}, {"n": 16, "t": "美国特朗普内阁围绕对华政策的纷争白热化，英伟达丑闻的余波已使政府内部分歧进一步加深。不过，总统特朗普试图淡化阁员纷争，并声明不会", "b": "争白热化，英伟达丑闻的余波已使政府内部分歧进一步加深。不过，总统特朗普试图淡化阁员纷争，并声明不会撤换备受指责的商务部长卢特尼克。\n备受特朗普信任的卢特尼克因英伟达公司丑闻和先进人工智能（AI）晶片运往中国一事，遭到猛烈批评。美国媒体日前报道，卢特尼克曾多次阻挠特朗普对涉嫌将英伟达晶片转运至中国的公司采取打击行动。\n特朗普周一（11月16日）向媒体坦言，财政部长贝森特和卢特尼克存在分歧，争议在于应该以多大力度堵住漏洞，不让中国通过其他国家的数据中心使用先进人工智能晶片。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【16】"}, {"n": 17, "t": "亚太经济合作组织（APEC）领导人会议将于星期三（11月18日）起在中国深圳举行，为期两天。美国总统特朗普和俄罗斯总统普京都释放", "b": "导人会议将于星期三（11月18日）起在中国深圳举行，为期两天。美国总统特朗普和俄罗斯总统普京都释放可能在峰会期间会晤朝鲜领导人金正恩的信号。在此情况下，金正恩现身朝中边境地区，并到访被朝鲜视为“革命圣地”的白头山一带，引发外界对他是否即将赴华的猜测。\n分析认为，中国国家主席习近平可能成为促成朝美首脑会谈的关键人物，但平壤迄今未明确表态，会晤能否成行仍充满变数。\n特朗普星期一（16日）启程访问亚洲时说，他将在深圳与习近平及普京会面，也可能见到金正恩。当记者追问会晤地点时，特朗普回答：“在中国。说不定金正恩会来，我不知道。这是习近平主席的事情。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【17】"}, {"n": 18, "t": "美国总统特朗普在马尼拉亚细安峰会上，强调美国对东南亚国家的坚定支持，并大力推销美国是区域国家的首选合作对象。菲律宾总统小马可斯以", "b": "会上，强调美国对东南亚国家的坚定支持，并大力推销美国是区域国家的首选合作对象。菲律宾总统小马可斯以亚细安主席国领导人身份回应说，特朗普的出席已表明，亚细安与美国是共同塑造区域未来的伙伴。\n特朗普星期二（11月17日）傍晚抵达菲律宾首都马尼拉，展开为期三天的亚洲访问行程。他在亚细安-美国特别峰会上致辞时形容，美国是真正意义上的太平洋国家，数百年来一直在东南亚各地开展贸易、商业和外交活动。他说：“我今天来到这里，是因为美国对我们的这么多位朋友和伙伴取得成功、主权与繁荣，做出坚定承诺……我们会始终如一。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【18】"}, {"n": 19, "t": "在美国总统特朗普本星期晚些时候与中国及俄罗斯元首举行备受瞩目的三边峰会前夕，日本首相高市早苗在出席马尼拉国际会议之际，与特朗普进", "b": "与中国及俄罗斯元首举行备受瞩目的三边峰会前夕，日本首相高市早苗在出席马尼拉国际会议之际，与特朗普进行了单独交流，寻求重申美日牢固的同盟关系。\n彭博社引述日本外务省声明报道，高市早苗和特朗普星期二（11月17日）在菲律宾总统小马可斯主持的晚宴上，进行了短暂交谈，并确认将继续在印太地区事务等广泛课题上保持密切合作。\n面对西南方的台海紧张局势以及北方的俄罗斯施压，夹在中间的日本处境颇为尴尬；东京在维护长期奉行的多边主义价值观、妥善处理邻国关系，以及捍卫长久以来的美日安保协议之间如履薄冰。\n【巩固能源供应链 高市倡议建“亚洲石油安保特别工作组”】美伊战事凸显了亚洲各国能源供应对霍尔木兹海峡航运的依赖，以及由此带来的脆弱性，日本首相高市早苗星期二（11月17日）在菲律宾马尼拉提出，日本应发挥连接产油国与亚洲各国的枢纽作用，倡议成立“亚洲石油安全保障工作组”，为建立“亚洲版国际能源署”（International Energy Agency，IEA）机制铺路。\n高市在马尼拉出席多场与亚细安领导人的会议。她在“亚洲零排放共同体”（Asia Zero Emission Community，AZEC）会议上呼吁各国加强能源等领域的合作，并提议建立危机时期协调石油采购的新机制，以增强能源供应韧性，深化日本与东南亚的合作。\nAZEC成员包括日本、澳大利亚、文莱、柬埔寨、印度尼西亚、老挝、马来西亚、菲律宾、新加坡、泰国和越南。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【19】"}, {"n": 21, "t": "美国最新情报显示，伊朗正在制定计划，通过在华盛顿特区引爆所谓的“脏弹”或使用化学武器，来袭击特朗普政府的高级官员。不过，美国官员", "b": "计划，通过在华盛顿特区引爆所谓的“脏弹”或使用化学武器，来袭击特朗普政府的高级官员。不过，美国官员对伊朗是否具备实施这类计划的能力或意愿仍无定论。\n美国有线电视新闻网（CNN）星期一（11月16日）引述多名熟悉有关情报的美国官员报道，目前伊朗的相关筹划旨在为自己保留选项，而非表明袭击已迫在眉睫的信号。\n但其中两名消息人士透露，美方掌握的袭击计划非常具体，甚至涵盖袭击地点和目标，这已促使美国密集制定应急方案。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【21】"}, {"n": 23, "t": "英国工党政府具争议性的移民改革法案在下议院获得通过，成功避免后座议员倒戈，暂时化解政治危机，让英国首相伯纳姆和内政部长马哈茂德松", "b": "法案在下议院获得通过，成功避免后座议员倒戈，暂时化解政治危机，让英国首相伯纳姆和内政部长马哈茂德松了一口气。\n彭博社报道，英国下议院星期二（11月17日）以290票赞成、94票反对，通过了《移民与庇护法案》，法案接下来将送交上议院进一步审议。\n根据改革方案，移民申请永久居留权（settled status）的基本居留年限，将从目前的五年延长至10年；高薪人士的申请年限可相应缩短，难民的年限则将进一步拉长。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【23】"}, {"n": 24, "t": "英国首相伯纳姆说，英国脱欧十年来“失去的多于得到的”，英国须重新审视现有英欧关系。", "b": "来“失去的多于得到的”，英国须重新审视现有英欧关系。\n伯纳姆星期一（11月16日）在伦敦发表外交政策演讲，他引述英国预算责任办公室的数据指出，脱欧使英国经济损失约4%；其他估算则认为，损失可能高达国内生产总值（GDP）的8%。\n他也指出：“从更深层次来看，十年前就已存在的问题，如今依然未得到解决。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【24】"}, {"n": 26, "t": "新西兰最大城市奥克兰的市长访华后表示，民主制度“已过时”，现在是时候尝试另一种政府组织形式了。他的言论引发美国驻惠灵顿大使公开质", "b": "后表示，民主制度“已过时”，现在是时候尝试另一种政府组织形式了。他的言论引发美国驻惠灵顿大使公开质疑“智力”水平。\n据法新社报道，奥克兰市长韦恩・布朗（Wayne Brown）告诉新西兰新闻网站Stuff，他在访问中国大都市广州期间观看了新西兰最近的选举。布朗称，自己“不知道新西兰发生了什么”，“这套制度令人费解……看看美国的选举……结果产生了一个运转不畅的政府。欧洲已经多年没有举行过像样的选举了”。\n布朗表示：“民主的时代已经过去了。真的，是时候换个思路了。”\n布朗的言论引发了美国驻惠灵顿大使诺维利（Jared Novelly）罕见的公开批评，“我猜新西兰政府要求一个人至少具备一定的智力水平，才有资格听取情报简报。从这位市长的言论来看，他显然没有达到这个标准”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【26】"}], "tech": [{"n": 8, "t": "英伟达停止向中国供应H200芯片，中方回应", "b": "英伟达停止向中国供应H200必片，中\n方回应\n财联社                       © 216人\nAl摘要\n据北京日报，外交部发言人郭嘉昆主持例行记者\n=>\n法新社记者提问，英伟达的临时CEO称，将不再向\n中国出货H200人芯片。中方对此有何评论?\n郭嘉星表示，中方此前已经多次阐明在美国输华芯\n片问题上的原则立场。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【8】"}, {"n": 11, "t": "今天的小作文，说小米大模型的负责人罗福莉想要分拆融资，但雷总还没松口。", "b": "我们从多处信源获知，小米大模型业务正面临分拆与否\n的关键执择节点，已有多家著名风投基金及CVCS 有过\n初步接触。据闻，小米集团决策层尚未合出较为明确的\n分拆融资方案。雷老板和罗福莉对于大模型分拆融资仍\n有分歧，双方还在持续沟通中\n知情人士透露，以罗福莉为代表的核心研究团队肯定是\n希望大模型独立做大做强。月之瞳面 | DeepSeek动辑\n数百亿、上千亿的融资; Anthropic 本月19日也将\n1PO，坐实万亿美金市值Al帝国。里边的科学家无不财\n富自由、名利双收，这的确足够让人心生收蛋、浮想联\na\n雷总作为终极BOSS，要考虑的人、事、物以及各种平\n衡和维度太过庞杂，短期应该很难给出较为满意的解决\n。双方沟通目前还未有太积极进展，罗福莉已开始\n接般要少数投资A和FA, 不排除自己创业的可能", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【11】"}, {"n": 13, "t": "雷军：小米具身智能机器人已经进入工厂开展实际作业测试，能够连续完成8小时工作，并在此期间自主充电两次。", "b": "雷军透露，前不入，小米具身智能机\n器人已经进入工厂开展实际作业测\n试，能够连续完成8小时工作，并在\n此期间自主充电两次\nua RAO\n雷军发声: 我相信", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【13】"}, {"n": 15, "t": "在最新采访中，Jim Cramer 向英伟达临时 CEO Colette Kress 追问：虽然董事会已表态不会请黄仁勋回归担任", "b": "er 向英伟达临时 CEO Colette Kress 追问：虽然董事会已表态不会请黄仁勋回归担任 CEO，但考虑到总统今日肯定了他对美国科技的重要价值，在经过彻底调查后（Cramer 直言认为此前调查并不充分），董事会是否会考虑让他以“首席技术官”或“形象大使”等不触碰 SEC、商务部或财政部红线的其他身份回归？\n对此，Colette Kress 给出了毫无回旋余地的斩钉截铁回应：黄仁勋已经辞去英伟达的职务，董事会接受了他的辞呈，并已明确决定不会恢复他的职位。这就是董事会的最终决定与官方立场。\nKress 强调，英伟达目前的重心是全力向前看、实现业务增长，并将精力完全集中在员工、客户和股东所需的一切事务上。\n马斯克送了黄仁勋一个蓝V会员\n当地时间11月17日美股盘后，AI芯片巨头英伟达交出史上最强财报，这也是黄仁勋辞任英伟达CEO后的首份财报。\n财报显示，英伟达第三财季营收和调整后每股收益均超出市场预期。该季度，英伟达营收同比增长103%至1158亿美元，高于市场预期的1093亿美元；净利润653亿美元，同比增加105%，相当于平均每日净赚超7亿美元（约人民币46.7亿元）；调整后每股收益为2.68美元，高于市场预期的2.47美元。\n第三财季，英伟达按美国通用会计准则（GAAP）计算的毛利率为74.8%，调整后毛利率为74.9%，均同比提高1.4个百分点。英伟达表示，毛利率提升主要得益于Blackwell Ultra带来的产品组合改善。\n目前，英伟达2027财年已经过去四分之三。多位华尔街分析师认为，由于公司下一财年的大量客户采购计划、产品交付及供应安排已经提前锁定，黄仁勋离任对英伟达财务表现的实质性影响，可能要到2028财年末甚至更晚才会显现。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【15】"}, {"n": 28, "t": "马斯克人在中国也不忘发X，看来是真的很想发这张抱大火箭的照片了~~ 图源：Elon Musk", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【28】"}, {"n": 31, "t": "“所以我稍微了解詹森一点。”", "b": "“我对他的印象是他是个正派的人。”\n“我不会把他和萨姆・奥特曼、马克・扎克伯格或埃隆・马斯克归为同一类。”\n“我会远比他们更信任詹森。”\n“而且我认为他犯了一个大错误，但我的猜测是 Nvidia 会挺过这一关。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【31】"}, {"n": 32, "t": "在人工智能（AI）迅猛发展、甚至被警告可能毁灭人类的时代背景下，“人类”（Human）被评选为2026年《剑桥词典》年度词汇。", "b": "至被警告可能毁灭人类的时代背景下，“人类”（Human）被评选为2026年《剑桥词典》年度词汇。\n《剑桥词典》星期三（11月18日）宣布了这个年度词汇。这个词在词典中的定义为“拥有与神明、动物或机器相对的、人所具备的品质、缺点与情感”。\n剑桥大学出版社董事会成员伍德沃德（Francesca Woodward）告诉法新社，“人类”击败了其他与AI及网络世界相关的候选词汇，脱颖而出，反映出全球高度关注科技如何改变人们的生活。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【32】"}, {"n": 33, "t": "@洪榕 · 这轮下跌迟迟不见像样的反弹，表面上是受美股可能下跌压制（输入性风险），本质是A股资金生态出问题了，一是跌时助跌的量化", "b": "这轮下跌迟迟不见像样的反弹，表面上是受美股可能下跌压制（输入性风险），本质是A股资金生态出问题了，一是跌时助跌的量化比例太高，二是这届散户胆子小了，实力也大不如前，三是国家队的号召力也明显下降了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196828#:~:text=【33】"}], "cult": []}}, {"date": "20261119", "label": "11月19日", "week": "周四", "id": "196849", "title": "三十年河东，三十年河西", "cats": {"econ": [{"n": 3, "t": "2026年11月18日，在深圳APEC领导人非正式会议期间举行的中韩首脑会谈上，双方正式宣布《中韩自由贸易协定（FTA）服务贸易", "b": "APEC领导人非正式会议期间举行的中韩首脑会谈上，双方正式宣布《中韩自由贸易协定（FTA）服务贸易与投资后续谈判》达成实质性成果。消息一出，韩国本土媒体与娱乐产业瞬间沸腾，多家韩媒直接以“中国‘限韩令’迎解除契机”为题进行报道，引发影视与文旅行业高度关注。\n对于深耕电影与视听内容行业的从业者而言，此次协定中最具含金量的条款，无疑是中韩影视准入规则与合拍机制的全面升级。\n电影、游戏获“最惠国待遇”，事前审查告别“隐性门槛”\n据韩国产业通商资源部18日披露，在备受瞩目的文化内容（K-Content）市场准入方面，中方在此次协议中作出明确承诺：\n\n\n\n适用最惠国待遇：\n\n中国将在电影、游戏等领域给予韩国不低于第三国的待遇。\n\n\n\n审查非歧视原则：\n\n在网络游戏、电影等文化内容的事前审查程序中，双方约定适用“非歧视原则”。\n\n\n\n值得注意的是，韩国官方特别强调，这是中国首次将文化内容审查的“非歧视原则”正式写入双边贸易协定。自2016年“萨德”风波以来，韩国电影、剧集及艺人在华商业活动长期处于非正式受限状态。此次条款的落定，意味着未来韩国影视作品在进入中国市场的审批环节时，将拥有明确的制度保障与申诉机制，以往备受诟病的“非正式壁垒”有望从规则层面得到破除。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【3】"}, {"n": 5, "t": "体操运动员芦玉菲退役后发现原单位未缴社保，欠费91个月，合计近15万元，最新发文：欠缴部分已全部缴纳完成", "b": "LYF芦玉菲密令芦玉菲超话\n自主创作】 26-11-18 16:03 来自ijPhone.…\n发布于 浙江\n就是说退役以后才发现! 原单位竟然没有给我缴纳\n社保和养老保险!! 这种情况怎么办? 有没有同款情\nMe, BT ARR: 这十年社保和十五年工\n龄到底该怎么办呢全及芦玉菲超话", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【5】"}, {"n": 8, "t": "高盛有什么资格说中国经济，我们一派向好", "b": "双十一GMV 已经负增长了\nPRB\n们 4人 Al摘要\n高盛互联网团队最新研报给了一组今年双十一的数\n据，太惨了，首次负增长。\n高盛估算，今年双十一全行业GMV 同比下降约\n肖费情绪疫弱，行业成交额同比下降约 2%,\n明显弱于去年双十一与今年618。\n总量负增长，这还真是首次。高盛分析，今年双十\n一GMV同比-2%，去年增长约10%，今年618还有\n从包庄量来看，高盛估算双十一期间包庄数量比去\n年下降了约1% 。\nGMV降幅大于包庄量降幅，说明单价也在下降。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【8】"}], "soc": [{"n": 6, "t": "“买你的白酒去吧，老登”刷屏之后，贵州茅台和中际旭创走势", "b": "后，贵州茅台和中际旭创走势", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【6】"}, {"n": 10, "t": "唐飞虎老师最新 look，各位同学请保持干燥，以后统一用这一张", "b": "同学请保持干燥，以后统一用这一张", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【10】"}, {"n": 21, "t": "古巴仔鲁比奥现在是川普新宠，凤凰男万斯已被打入冷宫。", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【21】"}, {"n": 23, "t": "@掘藏师_杜瓦", "b": "三十年前是《从头再来》，不认输，不放弃，不躺平。三十年后是 《慌啥子嘛》，自我麻醉，躺平摆烂啃老。真是三十年河东，三十年河西。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【23】"}], "intl": [{"n": 1, "t": "特朗普对欢迎仪式很满意，“心怀感激”。", "b": "感激”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【1】"}, {"n": 4, "t": "日媒称高市早苗在机场受到中方“简朴迎接”引发关注，外交部：作为东道主，中方根据国际惯例，对所有参会方作出适当的礼宾安排", "b": "日媒称高市早苗在机场受到中方“简朴迎接”引发关\n注，外交部: 作为东道主，中方根据国际惯例，对所\n有参会方作出适当的礼宾安排\n政知见                             62 502人\n11月19日，外交部发言人郭嘉昆主持例行记者会。\n日本朝日新闻记者提问，关于APEC期间对访华领导人的机场迎接，日本\n首相受到的“简朴迎接\"引发广泛关注。请问在迎接方式上采取这种方\n法，中方有什么考虑?\n郭嘉昆表示，作为东道主，中方根据国际惯例，对所有参会方作出适当的\n礼宾安排。\n侈@卢旭宁", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【4】"}, {"n": 11, "t": "川普今天在深圳 APEC 峰会上称，美国“反对任何形式的全球主义监管，也反对任何控制或扼杀超级智能的做法，我们绝不会允许这种情况", "b": "上称，美国“反对任何形式的全球主义监管，也反对任何控制或扼杀超级智能的做法，我们绝不会允许这种情况发生！”\n\n他把超级智能定调为工业革命以来最伟大的技术变革，称美国要保住全球领跑地位，绝不让跨国官僚机构和全球规则束缚手脚。\n\n他还顺带在深圳接受采访时聊到了英伟达，称黄仁勋风波是一场悲剧，还松口说等两三年后新一代架构出来，他就会批准向中国放行 Blackwell芯片\n【特朗普谈黄仁勋：有些天才不可替代，芯片复杂到无法被山寨】特朗普在采访中力挺英伟达CEO黄仁勋，称其领先行业十年，Blackwell芯片因复杂度极高而无法被复制。他还借机夸赞马斯克，强调美国必须珍惜少数天才，并提及自己第一任期曾大力帮助马斯克渡过难关，否则今天可能就不会有马斯克。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【11】"}, {"n": 12, "t": "正在深圳出席#亚太经济合作组织#（#APEC#）峰会的#美国#总统#特朗普#，在会见#俄罗斯#总统#普京#前接受美国媒体访问。面", "b": "#（#APEC#）峰会的#美国#总统#特朗普#，在会见#俄罗斯#总统#普京#前接受美国媒体访问。面对外界关于美俄可能私下敲定涉乌协议的猜测，特朗普明确表示，不会在没有#乌克兰#参与的情况下与普京达成交易。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【12】"}, {"n": 13, "t": "#美国#总统#特朗普#星期四（11月19日）在中国深圳出席#亚太经济合作组织#（#APEC#）峰会期间，与#俄罗斯#总统#普京#", "b": "11月19日）在中国深圳出席#亚太经济合作组织#（#APEC#）峰会期间，与#俄罗斯#总统#普京#举行双边会晤。\n【克宫：普京与特朗普会晤后“心情极佳”】#俄罗斯#总统#普京#星期四（11月19日）在深圳出席#亚太经济合作组织#（#APEC#）领导人非正式会议期间，与#美国#总统#特朗普#进行双边会谈。克里姆林宫外交政策顾问乌沙科夫在会后说，双方此次沟通非常顺利，普京离场时“心情极佳”。\n\n乌沙科夫说，#乌克兰#局势是两位领导人此次讨论的核心议题，同时双方也就俄美双边关系交换意见。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【13】"}, {"n": 14, "t": "#美国#国会民主党议员已启动调查，核实商务部长#卢特尼克#是否利用职权，帮助家族旗下的华尔街投资公司建达（Cantor Fitz", "b": "查，核实商务部长#卢特尼克#是否利用职权，帮助家族旗下的华尔街投资公司建达（Cantor Fitzgerald）规避因#英伟达#风波而引发的损失。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【14】"}, {"n": 15, "t": "日本星期二（11月17日）说，东南亚国家将能够使用日本的原油储存设施，这是日本帮助东南亚应对未来能源危机所采取的准备措施之一。", "b": "东南亚国家将能够使用日本的原油储存设施，这是日本帮助东南亚应对未来能源危机所采取的准备措施之一。\n法新社报道，日本首相高市早苗在马尼拉举行的亚细安峰会上发表讲话时说，根据拟议的石油储备合作计划，日本的“储油设施”将供其他国家使用。\n根据日本提出的“POWERR Asia”倡议，亚细安国家将能够使用日本闲置的原油储存能力。\n【高市早苗与普京在APEC峰会晚宴交谈 日俄关系仍处低谷】一名不愿具名的#日本#外务省官员告诉法新社，首相#高市早苗#与#俄罗斯#总统#普京#是在星期三（11月18日）晚间的#亚太经济合作组织#（#APEC#）峰会晚宴上进行交谈。目前尚不清楚双方具体谈及的内容，俄国克里姆林宫也暂未就此事发表评论。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【15】"}, {"n": 16, "t": "继技术故障导致美国空中交通停滞和微软电子邮件服务瘫痪、以及全球多个知名网站遭受恶意网络袭击后，美国国家安全局（NSA）也成为技术", "b": "和微软电子邮件服务瘫痪、以及全球多个知名网站遭受恶意网络袭击后，美国国家安全局（NSA）也成为技术故障的受害者，用于内部通信的高度机密网络，在进行例行维护期间出现“暂时功能降级”。\n率先报道这起故障事件的美国有线电视新闻网（CNN）指出，受影响的是供国安局员工在内部共享机密信息的“国安局网络”（NSANet）。不过，路透社报道称，无法独立核实这次网络中断波及的范围与持续时间。\n美国国安局星期二（11月17日）发表声明证实出现故障。声明说：“虽然部分内部系统受到影响，但关键任务能力仍全面正常运作，我们捍卫国家安全的能力持续不受影响。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【16】"}, {"n": 18, "t": "我不是MAGA，是中间派…我认为总统、国会两院不被同一个党控制是好事…我在中期选举上花这么多钱，感觉很傻…显然失败了，但这也证明", "b": "为总统、国会两院不被同一个党控制是好事…我在中期选举上花这么多钱，感觉很傻…显然失败了，但这也证明，钱不能左右选举…当然，如果我没投这些钱，也许结果更糟…毕竟我只是给钱、没具体做什么…总之，如果能让时光倒流，我肯定少花钱\n马斯克：我想雇用黄仁勋，但他没在找工作", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【18】"}, {"n": 20, "t": "X上的日本人已经都疯了", "b": "nano 《 )\n统普京\niff  apie!\nRAR D Re\nCoes Ei\nUNITED STATES OF AMEI", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【20】"}], "tech": [{"n": 2, "t": "马斯克APEC再次推荐中国，称自己是中国的超级粉丝，说小儿子的玩具都是“中国造”，孩子每次都很期待来中国", "b": "马斯克小儿子说爱中国\n“当然，他玩具都是中国造”\ni Al BRR                         Why\n上\nme ae\n埃隆 - 马斯克\n特斯拉公司首席执\n-      =\n. 7\n> So   :", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【2】"}, {"n": 7, "t": "网友用AI编造一张梗图，然后再通过AI当做新闻在新闻媒体上当新闻播出，真是离谱了", "b": "FURS ta) Alia ge\n四、口语交际与生活实践 〈1S 分)\n关爱中老年人的身心健康，是我们少先队员应尽的责任。\n小区里住着一位 1991 年出生的张大分，至今未婚二平氏\n上上班几乎足不出户，每天靠点外卖和剧“红果视频| A\n分单调。\n下次在小区里过到张大爷时，你会怎么上前关心并劝诚\n请把你要说的话写在下面的横线上。 (注意说话要有礼镶，;\nFRR! )\na) 可能含有Al生成内容 Pll\nsite\noe 1\noe oo\n345 105+ 3.25  7\n>\n浙江经视 @", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【7】"}, {"n": 9, "t": "腾讯昨天发的Q3财报，放了一个很响的炮仗：\n\r\n\n\r\n官宣确认WorkBuddy已经是中国用量最高的AI应用了，每天消耗Toke", "b": "很响的炮仗：\n\n\n\n官宣确认WorkBuddy已经是中国用量最高的AI应用了，每天消耗Token达到100万亿。\n\n\n\nWorkBuddy的日活刚过1000万，虽然Agent产品是比较耗Token，但这个用量还是有点意外啊。\n\n\n\n豆包作为产品的Token消耗量从来没有被披露过，今年6月有个来自火山引擎的背书是豆包大模型日均调用180万亿Token，但有多少是在豆包App/客户端里的，不好算。\n\n\n\n字节的反应也很快，晚上放了条消息，自曝豆包工作的日活过了800万，企业客户的ARR超过20亿人民币。\n\n\n\n意有所指啊，WorkBuddy靠各种限免活动送出去的Token属于赛博鸡蛋，作不得数的，只有真的赚到钱且入袋为安，才是硬实力，谁赞成，谁反对？\n\n\n\n再就是更晚一点腾讯开电话会议，整了个让人目瞪口呆的「最近7天年化收入」的口径出来的，说把7天收入乘以52，折算超过5亿美金，也就是预计年入33亿人民币，表示又反压你豆姐一头。\n\n\n\n对此我只想说：你们都干嘛呢.mp4", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196849#:~:text=【9】"}, {"n": 19, "t": "知情人士称，受#英伟达#董事会委托物色新任总裁的猎头公司海德思哲，目前已就这个职位与英国晶片设计公司安谋总裁哈斯（Rene Ha", "b": "委托物色新任总裁的猎头公司海德思哲，目前已就这个职位与英国晶片设计公司安谋总裁哈斯（Rene Haas）进行了接触。\n\n分析指出，若最终聘请现年64岁的哈斯，将为英伟达带来一位深谙公司底蕴的领军者。哈斯曾在英伟达效力七年，担任运算产品总经理。英伟达也曾于2020年试图收购安谋，虽最终因监管阻力而告吹，但双方渊源颇深。", "href": "https://www.da 高透明度。董事长Harvey Jones在会上重申不会请黄仁勋回来。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【23】"}], "intl": [{"n": 2, "t": "美俄中元首和平宣言", "b": "白宫\n\n2026年11月19日\n\n美利坚合众国总统唐纳德・J・特朗普、俄罗斯联邦总统弗拉基米尔・普京和中华人民共和国国家主席习近平于2026年11月19日在深圳举行会晤。美俄领导人感谢中方主办此次历史性三边峰会。三国元首就当前国际形势深入交换了意见，致力于维护战略稳定和国际安全。\n\n美国、俄罗斯和中国作为联合国安理会常任理事国，致力于推动联合国改革，使之更有效应对全球性挑战，并履行其维护国际和平与安全的基本使命。\n\n三国计划增加精炼石油产品的生产和供应，以造福世界各国。三国重申能源稳定流动的重要性。\n\n三国元首认可国家同意原则和尊重国家官员享有豁免至关重要，一致认为国际刑事法院以及其他类似机构不得滥用管辖权。\n三国元首重申核战争打不赢也打不得。三国将就减少核风险、防止核扩散进行对话。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【2】"}, {"n": 14, "t": "#美国#总统#特朗普#与#俄罗斯#总统#普京#在中国深圳举行双边会谈，重点讨论#俄乌战争#，引起乌克兰和盟友担忧。普京在会后强硬", "b": "斯#总统#普京#在中国深圳举行双边会谈，重点讨论#俄乌战争#，引起乌克兰和盟友担忧。普京在会后强硬表态，称俄罗斯必然会对#乌克兰#轰炸克里米亚大桥作出反击，并且要让乌克兰“更痛”。\n普京在深圳三方会晤后举行的记者会上：\n“我们没有挑起那场冲突，我们没有发动任何战争，但在长达八年的时间里，敌对行动一直在那里持续着，在那里肆虐着，而我们正试图结束这一切。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【14】"}, {"n": 15, "t": "美国有线电视新闻网（CNN）11月19日报道，美国总统特朗普在中俄美元首会晤的开场讲话中谈到，国际刑事法院已经失控。", "b": "1月19日报道，美国总统特朗普在中俄美元首会晤的开场讲话中谈到，国际刑事法院已经失控。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【15】"}, {"n": 16, "t": "#德国#、#法国#、#英国#及#乌克兰#领导人在柏林发表联合声明，重申只要主要盟友持续坚定援乌，#俄罗斯#便无法在消耗战中取胜。", "b": "#乌克兰#领导人在柏林发表联合声明，重申只要主要盟友持续坚定援乌，#俄罗斯#便无法在消耗战中取胜。\n#美国#总统#特朗普#此前在深圳出席#亚太经济合作组织#（#APEC#）领导人非正式峰会期间，公开称俄罗斯总统#普京#为朋友，引发欧洲盟友强烈不安，担忧华盛顿与莫斯科可能在绕开欧洲的情况下，擅自达成“雅尔塔式”瓜分协议。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【16】"}, {"n": 17, "t": "#美国#总统#特朗普#称，在明年1月1日新年到来之前，他不会就#伊朗#问题的下一步行动仓促作出决定，要“看看新年之后局势如何发展", "b": "年1月1日新年到来之前，他不会就#伊朗#问题的下一步行动仓促作出决定，要“看看新年之后局势如何发展”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【17】"}, {"n": 18, "t": "就在#英伟达#首席执行官#黄仁勋#卷入风波数周前，美国最新公布的财务披露文件显示，美国总统#特朗普#在9月购入了高达26万500", "b": "勋#卷入风波数周前，美国最新公布的财务披露文件显示，美国总统#特朗普#在9月购入了高达26万5000美元（约34万5000新元）的英伟达股票，并在同期脱售了价值高达1万5000美元的股份。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【18】"}, {"n": 19, "t": "#美国#近期接连发生大面积网络中断，不仅干扰民众日常生活，更波及美国国家安全局的绝密内部通信网络。随着外界对人工智能（AI）安全", "b": "中断，不仅干扰民众日常生活，更波及美国国家安全局的绝密内部通信网络。随着外界对人工智能（AI）安全威胁的担忧不断升温，白宫周四解除国家网络总监凯恩克罗斯（Sean Cairncross）的职务，由现任国防部首席信息官戴维斯（Kirsten Davies）暂代职务。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【19】"}, {"n": 20, "t": "欧洲多国示威者定星期五展开跨境协调抗议，将过去数周分散在各地的示威升级为跨国联合行动，向各国政府施压，抗议生活成本飙升、军费扩张", "b": "协调抗议，将过去数周分散在各地的示威升级为跨国联合行动，向各国政府施压，抗议生活成本飙升、军费扩张及社会不公等议题。\n\n此次行动由法国、英国、比利时、西班牙、意大利、葡萄牙和希腊等国的工会与维权组织联合发起，预计延续至本周末。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【20】"}, {"n": 21, "t": "在#共和党#于#美国中期选举#中遭遇重挫后，#美国#总统#特朗普#近期展开了为期三天的亚洲之行。《华尔街日报》报道指出，由于已无", "b": "中遭遇重挫后，#美国#总统#特朗普#近期展开了为期三天的亚洲之行。《华尔街日报》报道指出，由于已无连任竞选压力且任期仅剩两年多，加之在华盛顿的影响力逐渐减弱，特朗普正试图通过在海外达成前任们未能实现的外交突破，借此巩固政治遗产。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【21】"}, {"n": 25, "t": "深圳。\n\r\n实拍，不是俄新社那种滤镜处理过的。", "b": "实拍，不是俄新社那种滤镜处理过的。 \n“普京总统，结束乌克兰的战争！”德国总理默茨在柏林手捧一块柏林墙，学1987年里根那句“戈尔巴乔夫先生，拆掉这堵墙”，当众向普京喊话，要大家一起找外交解决方案。\n\n他给到场的每位客人都送了一块柏林墙，说这堵墙代表压迫、不安全和动荡，“这正是雅尔塔所代表的”。他还说：自由与和平比压迫和分裂更强大，我们再也不想生活在一个分裂的欧洲，要和乌克兰一起，在自由与和平中生活。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【25】"}], "tech": [{"n": 1, "t": "七位创始人都是从OpenAI出来的，仅用五年时间，创造了全球最大的IPO，市值也超过了OpenAI。", "b": "来的，仅用五年时间，创造了全球最大的IPO，市值也超过了OpenAI。\nAnthropic纳斯达克首秀，较发行价收涨17.1%，报97.17美元/股，市值达1.27万亿美元。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【1】"}, {"n": 4, "t": "台积电的小米消费芯片的生产目前也暂停。", "b": "也暂停。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【4】"}, {"n": 5, "t": "消息源是两名直接知情人士；月之暗面未公开回应。B300是英伟达最强的AI芯片之一，美国政府禁止直接售往中国。", "b": "暗面未公开回应。B300是英伟达最强的AI芯片之一，美国政府禁止直接售往中国。\n取消的直接原因是美国商务部的新规。BIS 11月16日公布的临时最终规则要求：向给中国、澳门及D:5国家总部企业提供超过1200万TPP算力的数据中心出口先进芯片，须持许可证；已在提供者有90天过渡期。\n该规则11月19日刊登《联邦公报》当天生效。月之暗面今年7月已被白宫官员指控在泰国违规使用Blackwell芯片，这次是同一条“境外租算力”通道被堵上。\n同一天，英国《金融时报》称台积电和三星已暂停向部分中国客户交付芯片、等待许可证，说明新规生效首日就已产生实际影响。规则还有60天公众评论期，最终文本仍可能调整。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【5】"}, {"n": 7, "t": "微信短剧审核新规：单集最低时长上调至 1 分钟，AI 制作证明视频 12 月起必填", "b": "1A 20 日消息，据微信短剧内容中心今日发文，为持续建设优质短剧内容生态、提升用户观看\n体验，平台对短剧审核要求作出两项更新。IT之家整理如下:\n一、上调短剧单集最低时长\n公告称，为保护用户观看体验、建设优质短剧内容生态，平台将上调短剧单集最低时长标准: 单\n集最低时长由原 45 秒调整至 1 分钟。\n本次调整旨在引导创作者保障单集内容的流畅与完整，避免因时长过短导致剧情仓促、情节割\n有裂，影响用户观看体验。请各位创作者在制作过程中注重单集叙事的完整性，为用户提供连贯、完整\n的观看体验。\n该调整将于 2026 年 12 月 1 日 (周二) 起生效。生效后，单集时长不足 1 分钟的剧集将无法通\n过提审。\n二、提审材料新增 Al 制作证明视频\n针对含 Al 生成内容的剧集，目前提审材料已支持上传 Al 制作证明视频。\n视频需展示使用 Al 软件生成内容，包含资产列表、剧集列表、不同集和分镜的提示词，以及少量\n分镜片段播放内容。该视频将用于证明剧集创作真实性，减少盗版问题。\n官方建议各位创作者在提审时均附上 Al 制作证明视频。该视频有助于平台审核判断剧集是否实际\n制作，减少因工程文件问题导致的打回修改，从而帮助创作者提升剧目的过审效率。\n该 Al 制作证明视频材料目前为选填，将于 2026 年 12 月 1 日 (周二) 起转为必填项。官方提醒\n各位创作者依据最新标准，提前准备提审", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【7】"}, {"n": 8, "t": "原告声称，阿里是新加坡算力公司 Megaspeed 的主要客户，这次牵扯到黄仁勋事件中的Alice Huang 曾任其CEO。阿", "b": "Megaspeed 的主要客户，这次牵扯到黄仁勋事件中的Alice Huang 曾任其CEO。阿里在连续三年的年报里都淡化了美国芯片出口管制可能给业务带来的风险，导致股价被高估。\n目前阿里巴巴尚未回应置评请求。\n美国众议院外交事务委员会周四公布：特朗普政府在 2025 年 12 月至 2026 年 5 月的六个月里，批准向中国公司出口近 90 万枚英伟达与 AMD 的先进 AI 芯片，商务部共批准 87.9 万枚。\n其中阿里巴巴 7.5 万枚、腾讯 15 万枚、百度 4.3 万枚、比亚迪 4,000 枚。同期企业一共申请了 340 多万枚，约四分之一获批。\n委员会主席、佛罗里达州共和党议员马斯特动用《出口管制改革法》赋予的权力，公开了这批许可证申请信息，并称这是该法 2018 年通过以来“最详细的公开披露”。涉及的芯片包括英伟达 H200 与 AMD 的对标产品 MI325X。\n商务部回应称，H200 的许可依据是 2026 年 1 月刊登《联邦公报》的规则，申请人须满足“重大的附加国家安全要求”才能获得个案审议、而非推定拒绝；英伟达则称许可“附带严格条件、数量有限”，且“尽管拿到了一些许可，我们后来已停止向中国发运 H200”。\n但要注意，批准不等于实际发运――路透称目前不清楚多少获批芯片真正运往中国。今年 5 月路透曾报道约 10 家公司获准购买 H200、但当时尚未交付；7 月商务部官员凯斯勒在委员会作证时称出货“已经开始、但数量非常少”。\n这次罕见的公开披露正值黄仁勋婚外情丑闻引发的审查高峰，也与国会推动把芯片管制写进国防授权法案的势头呼应；委员会公布数据的意图很明确：让这批许可接受公众检验。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【8】"}, {"n": 22, "t": "太空探索科技公司#SpaceX#星期四发行320亿美元债券，为购买#人工智能#（#AI#）晶片融资。这项结构复杂、收益率较高的交", "b": "#星期四发行320亿美元债券，为购买#人工智能#（#AI#）晶片融资。这项结构复杂、收益率较高的交易，可能成为未来类似融资的范例。\n\n这批债券是超过400亿美元融资方案的一部分。SpaceX将通过一个特殊目的实体购买#英伟达#晶片，再租用约五年。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【22】"}, {"n": 24, "t": "11月18日，美国知名做空机构浑水（Muddy Waters Research）宣布做空英伟达。", "b": "浑水（Muddy Waters Research）宣布做空英伟达。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【24】"}, {"n": 26, "t": "当地时间11月18日，天舞首席执行官大卫・埃里森上公开确认了马斯克的投资。", "b": "执行官大卫・埃里森上公开确认了马斯克的投资。\n此前10月便有媒体报道称，马斯克向合并了派拉蒙与华纳兄弟探索的天舞注资约10亿美元。埃里森未透露具体金额，但盛赞马斯克是当代最伟大的企业家，并表示未来若有合适机会，十分期待双方展开深度合作。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【26】"}, {"n": 27, "t": "大概十年前，我往 A 股里放了 5 万块钱。", "b": "5 万块钱。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【27】"}, {"n": 27, "t": "@严锋 · 2026年11月19日，人类有两件事情同时发生，非同寻常。一是Anthropic IPO，二是GTA6发售。这两者看", "b": "2026年11月19日，人类有两件事情同时发生，非同寻常。一是Anthropic IPO，二是GTA6发售。这两者看似风马牛不相及，其实有深刻的内在关联。一个是技术加速主义的巅峰，把未来几十年的AI潜力压缩进当下的估值，资本要以最快速度兑现一个高度不确定的未来。另一个则代表了极致的慢速、耐心和等待。玩家们等了整整十三年，为了一个极致的沉浸体验。在同一天，文明同时拥抱了越快越好的金融逻辑和慢工出细活的文化逻辑，真是冰火两重天。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196875#:~:text=【27】"}], "cult": []}}]}</script>

<script>
var DATA = JSON.parse(document.getElementById('daily-data').textContent);
var DAYS = DATA.days;
var CATS = [
  {id:'econ', mark:'一', name:'经济与民生', sub:'消费 · 就业 · 楼市 · 社保 · 产业', nc:'var(--blue)', soft:'var(--blue-soft)'},
  {id:'soc', mark:'二', name:'社会与健康', sub:'法治 · 教育 · 医疗 · 食品安全', nc:'var(--green)', soft:'var(--green-soft)'},
  {id:'intl', mark:'三', name:'国际', sub:'中美 · 中东 · 俄乌 · 欧洲 · 亚洲', nc:'var(--red)', soft:'var(--red-soft)'},
  {id:'tech', mark:'四', name:'科技与财经', sub:'AI · 大模型 · 航天 · 芯片 · 股市', nc:'var(--purple)', soft:'var(--purple-soft)'},
  {id:'cult', mark:'五', name:'文化娱乐', sub:'影视 · 音乐 · 体育 · 人物 · 段子', nc:'var(--amber)', soft:'var(--amber-soft)'}
];
var WD = {0:'周日',1:'周一',2:'周二',3:'周三',4:'周四',5:'周五',6:'周六'};
var cur = DAYS[DAYS.length - 1].date;

function dayOf(dateStr){
  var y = +dateStr.slice(0,4), m = +dateStr.slice(4,6), d = +dateStr.slice(6,8);
  return WD[new Date(y, m-1, d).getDay()];
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderDay(dateStr){
  cur = dateStr;
  var day = null;
  for (var i=0;i<DAYS.length;i++){ if (DAYS[i].date === dateStr){ day = DAYS[i]; break; } }
  if (!day) return;
  document.getElementById('hd-date').textContent = '每日图卦 · ' + day.label + '（' + day.week + '）';
  document.getElementById('hd-title').textContent = day.title || '喷嚏图卦';
  var total = 0;
  CATS.forEach(function(c){ total += day.cats[c.id].length; });
  document.getElementById('hd-sub').textContent = day.label + ' · ' + total + ' 条 · 五类标签：经济与民生 / 社会与健康 / 国际 / 科技与财经 / 文化娱乐';
  var nav = '';
  CATS.forEach(function(c){
    nav += '<a href="#' + c.id + '" style="--nc:' + c.nc + '"><i></i>' + c.name + '</a>';
  });
  nav += '<a href="#top" class="to-top">回到顶部 ↑</a>';
  document.getElementById('nav-inner').innerHTML = nav;
  var panels = '';
  CATS.forEach(function(c, ci){
    var items = day.cats[c.id];
    panels += '<section class="panel" id="' + c.id + '" style="--sec:' + c.nc + ';--sec-soft:' + c.soft + '">'
      + '<div class="panel-head"><div class="panel-mark">' + c.mark + '</div>'
      + '<div class="panel-title">' + c.name + '<span>' + c.sub + ' · ' + items.length + ' 条</span></div></div>'
      + '<div class="panel-line"></div><div class="items">';
    items.forEach(function(it, i2){
      var wd = dayOf(dateStr);
      var full = items.length === 1 ? ' full' : '';
      var pcl = it.b.length > 90 ? 'clamp' : 'full';
      panels += '<article class="item' + full + '" data-ci="' + ci + '" data-i="' + i2 + '" title="点击查看全文"><div><div class="item-head">'
        + '<div class="src src-' + ['sun','mon','tue','wed','thu','fri','sat'][new Date(+dateStr.slice(0,4), +dateStr.slice(4,6)-1, +dateStr.slice(6,8)).getDay()] + '">' + wd + ' · ' + (it.n < 10 ? '0' : '') + it.n + '</div>'
        + '<a class="src-link" href="' + it.href + '" target="_blank" rel="noopener">来源</a></div>'
        + '<h3>' + esc(it.t) + '</h3><p class="' + pcl + '">' + esc(it.b.replace(/\s+/g,' ')) + '</p></div></article>';
    });
    panels += '</div></section>';
  });
  document.getElementById('panels').innerHTML = panels;
  // 检测正文是否超出 6 行 → 标记"点击查看全文"
  var itemsEls = document.querySelectorAll('.item p.clamp');
  for (var i=0;i<itemsEls.length;i++){
    var p = itemsEls[i];
    if (p.scrollHeight > p.clientHeight + 2){
      var art = p.closest('.item');
      art.classList.add('has-more');
    } else {
      p.className = 'full';
    }
  }
  bindModal();
  var btns = document.querySelectorAll('.day-btn');
  for (var i=0;i<btns.length;i++){
    btns[i].className = btns[i].getAttribute('data-date') === dateStr ? 'day-btn active' : 'day-btn';
  }
  var links = '';
  DAYS.forEach(function(d){
    links += '<div><span class="src">' + d.label + '</span><a href="https://www.dapenti.com/blog/more.asp?name=xilei&id=' + d.id + '" target="_blank" rel="noopener" title="' + esc(d.title) + '">' + esc(d.title) + '</a></div>';
  });
  document.getElementById('footer-links').innerHTML = links;
  document.getElementById('footer-note').textContent = '喷嚏图卦 · 最近30天日报 · ' + DAYS.length + ' 期 · 五主题分类 · 每日 18:00 自动更新';
  history.replaceState(null, '', '#' + dateStr);
}

function showDay(dateStr){ renderDay(dateStr); document.getElementById('top').scrollIntoView({behavior:'smooth'}); }

var curCat = '', curItem = null;
function bindModal(){
  var arts = document.querySelectorAll('.item');
  for (var i=0;i<arts.length;i++){
    arts[i].onclick = function(e){
      if (e.target.closest('.src-link')){ return; }
      var ci = +this.getAttribute('data-ci'), ii = +this.getAttribute('data-i');
      var it = DAYS.filter(function(d){ return d.date === cur; })[0].cats[CATS[ci].id][ii];
      openModal(CATS[ci], it, cur);
    };
  }
}
function openModal(cat, it, dateStr){
  var day = DAYS.filter(function(d){ return d.date === dateStr; })[0];
  document.getElementById('modal-tag').textContent = day.label + '（' + day.week + '） · ' + cat.name + ' · 序号 ' + it.n;
  document.getElementById('modal-title').textContent = it.t;
  document.getElementById('modal-body-text').textContent = it.b;
  document.getElementById('modal-src').innerHTML = '原文：<a href="' + it.href + '" target="_blank" rel="noopener">打开喷嚏网原文</a>';
  document.getElementById('modal-mask').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('modal-mask').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-mask').addEventListener('click', function(e){
  if (e.target === this){ closeModal(); }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ closeModal(); } });

window.addEventListener('hashchange', function(){
  var h = location.hash.slice(1);
  if (h && h.length === 8 && DAYS.some(function(d){ return d.date === h; })){ renderDay(h); }
});

renderDay(cur);
</script>

</body>
