<style>
  :root{
    --paper:#F5F4EF; --card:#FFFFFF; --ink:#20242B; --ink-2:#5A5F68; --line:#E2E0D8;
    --blue:#2662B8; --green:#12805E; --red:#C0443B; --purple:#6A48B0; --amber:#B07A1E;
    --blue-soft:rgba(38,98,184,.06); --green-soft:rgba(18,128,94,.06);
    --red-soft:rgba(192,68,59,.06); --purple-soft:rgba(106,72,176,.06); --amber-soft:rgba(176,122,30,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
  .wrap{max-width:800px;margin:0 auto;padding:0 20px}
  a{color:inherit}
  ::selection{background:rgba(176,122,30,.25)}

  /* 报头 */
  .masthead{background:var(--ink);color:#F5F4EF}
  .masthead-inner{max-width:840px;margin:0 auto;padding:34px 20px 30px}
  .brand-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand{font-family:"Noto Serif SC",serif;font-weight:900;font-size:26px;letter-spacing:.12em}
  .brand .dot{color:var(--amber)}
  .slogan{font-size:13px;color:#A9AEBB;letter-spacing:.08em}
  .issue-date{font-size:13px;color:#8C93A3;letter-spacing:.2em;margin-top:6px}
  .issue-title{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(24px,4.6vw,36px);line-height:1.4;margin:16px 0 4px;color:#fff}
  .issue-sub{font-size:13px;color:#8C93A3}

  /* 日期切换 */
  .daybar{background:#1B1E24;border-top:1px solid rgba(255,255,255,.1)}
  .daybar-inner{max-width:840px;margin:0 auto;padding:12px 20px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#A9AEBB;border-radius:8px;padding:8px 6px 6px;cursor:pointer;font-family:inherit;transition:all .15s}
  .day-btn b{display:block;font-size:13px;font-weight:600;color:#E7E9EE}
  .day-btn span{font-size:11px;color:#8C93A3}
  .day-btn:hover{background:rgba(255,255,255,.14)}
  .day-btn.active{background:var(--amber);border-color:var(--amber);color:#20242B}
  .day-btn.active b{color:#20242B}
  .day-btn.active span{color:#20242B}

  /* 导航 */
  .section-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .nav-inner{max-width:840px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .nav-inner::-webkit-scrollbar{display:none}
  .nav-inner a{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink-2);padding:5px 12px;border-radius:999px;transition:all .15s}
  .nav-inner a:hover{background:var(--line);color:var(--ink)}
  .nav-inner a i{width:8px;height:8px;border-radius:50%;background:var(--nc)}
  .to-top{margin-left:auto;color:var(--ink-2);font-size:13px;text-decoration:none;padding:5px 10px;border:1px solid var(--line);border-radius:999px;flex-shrink:0}
  .to-top:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* 主题板块 */
  main{padding:36px 0 20px}
  section.panel{margin-bottom:56px;scroll-margin-top:64px}
  .panel-head{display:flex;align-items:center;gap:16px;margin-bottom:4px}
  .panel-mark{width:46px;height:46px;border-radius:10px;background:var(--sec);color:#fff;font-family:"Noto Serif SC",serif;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .panel-title{font-family:"Noto Serif SC",serif;font-weight:700;font-size:clamp(20px,3.2vw,24px);color:var(--sec)}
  .panel-title span{font-size:13px;color:var(--ink-2);font-family:"Noto Sans SC",sans-serif;font-weight:400;display:block;margin-top:2px}
  .panel-line{height:2px;background:var(--sec);opacity:.25;margin:14px 0 20px}

  /* 条目 */
  .items{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sec);border-radius:0 8px 8px 0;padding:12px 15px;transition:background .18s;break-inside:avoid;cursor:pointer;position:relative}
  .item:hover{background:var(--sec-soft)}
  .item-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .item-head .src{flex-shrink:0}
  .item .src{font-size:11.5px;font-weight:500;letter-spacing:.05em;opacity:.95}
  .item h3{font-family:"Noto Serif SC",serif;font-weight:700;font-size:14.5px;line-height:1.45;margin:2px 0 4px}
  .item p.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;font-size:12.8px;color:#4A4F58;line-height:1.6}
  .item p.full{font-size:12.8px;color:#4A4F58;line-height:1.6}
  .item.has-more::after{content:"… 点击查看全文";position:absolute;right:10px;bottom:6px;font-size:11px;color:var(--sec);background:linear-gradient(90deg,transparent,var(--card) 30%);padding:2px 6px 2px 14px;pointer-events:none}
  .item.has-more p.clamp{position:relative}
  .src-link{font-size:11px;color:var(--ink-2);text-decoration:none;white-space:nowrap;border-bottom:1px dashed var(--line);transition:color .15s,border-color .15s;position:relative;z-index:2}
  .src-link:hover{color:var(--sec);border-color:var(--sec)}
  .item.full{grid-column:1/-1}
  .src-mon{color:var(--blue)} .src-tue{color:var(--green)} .src-wed{color:var(--purple)} .src-thu{color:var(--red)}
  .src-fri{color:var(--amber)} .src-sat{color:#3E7D8C} .src-sun{color:#2F6B7A}

  /* 全文弹层 */
  .modal-mask{position:fixed;inset:0;background:rgba(20,22,28,.62);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .18s}
  .modal-mask.open{opacity:1;visibility:visible}
  .modal{background:var(--paper);max-width:640px;width:100%;max-height:82vh;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;transform:translateY(10px);transition:transform .18s}
  .modal-mask.open .modal{transform:translateY(0)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
  .modal-tag{font-size:12px;color:var(--sec);font-weight:600;letter-spacing:.06em}
  .modal-close{background:none;border:none;font-size:22px;line-height:1;color:var(--ink-2);cursor:pointer;padding:4px 8px;border-radius:6px}
  .modal-close:hover{color:var(--ink);background:var(--line)}
  .modal-body{overflow-y:auto;padding:18px 20px 22px}
  .modal h3{font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px;line-height:1.5;margin-bottom:12px}
  .modal p{font-size:14.5px;line-height:1.9;color:#33363D;white-space:pre-wrap;word-break:break-word}
  .modal-src{margin-top:16px;font-size:12.5px}
  .modal-src a{color:var(--sec);text-decoration:none;border-bottom:1px dashed var(--line)}

  /* 页脚 */
  footer{background:var(--ink);color:#A9AEBB;margin-top:20px}
  .footer-inner{max-width:840px;margin:0 auto;padding:30px 20px;font-size:13px;line-height:1.9}
  .footer-inner a{color:#F5F4EF;text-decoration:none}
  .footer-inner a:hover{color:var(--amber)}
  .footer-inner .src{color:#8C93A3}
  .footer-links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 18px;margin:10px 0 14px}
  .footer-links div{display:flex;align-items:baseline;gap:8px;min-width:0}
  .footer-links .src{flex-shrink:0}
  .footer-links a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.item,.nav-inner a,.day-btn{transition:none}}
  @media (max-width:720px){
    .daybar-inner{grid-template-columns:repeat(4,1fr)}
    .items{grid-template-columns:1fr}
    .footer-links{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
</style>

传、诱导消费、婚托婚骗等违法违规行为。完善婚介机构监督管理的政策措施，建立健全行业监管长效机制。支持各地发展公益婚恋服务平台，为青年提供交友渠道，助力婚介行业健康有序发展。\n \n我们1班王悦微：以我有限的生活经验来看，这五方面都不是影响结婚率的关键因素。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【11】"}, {"n": 12, "t": "重庆立法：艾滋病检测结果告知配偶为法定义务，医疗机构可代为告知。", "b": "ee PORE道                 sexe\n重庆立法: 艾滋病检测结果告知配偶为\n法定义务，医疗机构可代为告知\nOF REM + ASH           文章较长试试听\n据\"重庆人大\"微信公众号消息，9月23日下\n午，重庆市六届人大常委会第二十七次会\n议在圆满完成各项议程后闭幕。会议表决\n通过《重庆市智能网联汽车发展促进条\n例》《重庆市城市综合治理条例》《重庆\n市艾滋病防治条例》 (简称: 《条例》)\n《重庆市突发事件应对条例》。\n《条例》将于2026年12月1日起施行。其\n中， 《条例》创新咨询检测制度，医疗机\n构开展血液检测时，受检者未明确拒绝\n的，将艾滋病检测纳入检测项目。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【12】"}, {"n": 23, "t": "芝加哥大学气候影响实验室预测，今年强劲的厄尔尼诺现象可能持续至明年2月，全球因高温导致的死亡人数或将增加45万1000人。", "b": "今年强劲的厄尔尼诺现象可能持续至明年2月，全球因高温导致的死亡人数或将增加45万1000人。\n法新社报道，芝加哥大学气候影响实验室（Climate Impact Lab）星期三（9月23日）公布的预测显示，在今年6月至明年2月期间，发展中国家受高温致死效应的影响最为严重。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【23】"}, {"n": 27, "t": "请不要假装很努力，结果不会陪你演戏", "b": "ah\nHL) oes? Bal bs\nLeia “请不要假装很努力\n结果不会陪你演戏", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【27】"}, {"n": 31, "t": "@亲爱的卡玛2012", "b": "一位年长讲师抱着穿蓝底白星星连体衣的婴儿站在白板前讲课，白板上写着 SOCIAL IDENTITY THEORY（社会身份理论），课堂氛围轻松。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【31】"}, {"n": 32, "t": "城市电量比较", "b": "全国城市用电星\nhea 榜单\n按 2025 年全社会用电量排序\nae\n名次城市         全社会用电量。。 亮点 / 关键数据\nGB i海 。 2088.9 。 首败2000Z2 . 全国第一\n同比+5.3%         是纽约3.8倍 : 东京2.5倍\nGB ei 1957.5 。 地级市用电王 . 逼近上海\n同比+6.2%        相当于一个中小国家 . 工业强市\nGB aR 1667.6 。 地让市.西部用电第一城\n同比+3.1%        全国省市中排第23\n攻国 北京 。 1447.5 Be. Keim\n同比+4.2%      生产用电1094亿 ' 居民353亿\nGER i 1323.1 emo - Tween\n同比+3.3%           工业用电497.7亿\nQB ei 1272.2 。 科创之城. 用电高增\n同比+4.7%         数据中心34.5亿 . 充电69.4亿\n东莞 ”1221.6 。 地级市黑马\"制造之城\n同比+5.496       工业用电830.9亿 . 占近七成\nBAS 11475 wwe. toa\n同比+5.7%6        增速居直辖市前列\nGB 11425 sere\n同比+6.5%6        互联网数据用电+159.6%\nGTR 950.7 SRE - Tue\nLK +3.6%     工业用", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【32】"}], "intl": [{"n": 1, "t": "【习近平：#中国人民和美国人民都是伟大的人民#】#特朗普表示这是一次举世瞩目的访问##习主席访问美国#当地时间9月23日下午，国", "b": "都是伟大的人民#】#特朗普表示这是一次举世瞩目的访问##习主席访问美国#当地时间9月23日下午，国家主席习近平乘专机抵达华盛顿，应美国总统特朗普邀请，对美国进行国事访问。\n习近平和夫人彭丽媛抵达华盛顿安德鲁斯空军基地时，特朗普和夫人梅拉尼娅热情迎接。特朗普表示，很高兴在华盛顿接待习近平主席和彭丽媛女士，这是一次举世瞩目的访问。习近平主席是伟大的领导人，这是一个伟大的时刻。我期待同习近平主席深入交换意见，推动两国关系发展。\n\n美国儿童向习近平和彭丽媛献上鲜花。礼兵分列红毯两侧致敬，军乐团奏中美两国国歌，现场鸣放21响礼炮，战机飞越致敬。\n\n习近平发表书面讲话，代表中国人民向美国人民致以诚挚问候和良好祝愿。\n\n习近平指出，中国和美国都是伟大的国家，中国人民和美国人民都是伟大的人民。中美两国人民长期友好交往，双方利益深度交融，两国应该成为伙伴而不是对手，实现中华民族伟大复兴和让美国再次伟大，完全可以并行不悖、相互成就、造福世界。特朗普总统今年5月访问中国时，我们同意构建中美建设性战略稳定关系，为未来中美关系发展作出战略指引。中美双方应该相向而行，推动形成合作为主、竞争有度、分歧可控、和平可期的稳定关系，走出一条新时代中美两个大国正确相处之道。\n\n习近平强调，世界在发展，时代在变化，但中美两国和平共处的历史逻辑没有变，两国人民友好交往的良好愿望没有变，国际社会对中美两国的普遍期待没有变。我期待同特朗普总统就关乎两国关系和世界局势的重大问题深入交流，不断丰富中美建设性战略稳定关系内涵，拓展中美各领域交流合作空间。我也期待同美国各界人士广泛接触、厚植友谊。相信在双方共同努力下，这次访问一定会取得丰硕成果，为两国人民增进福祉，为世界和平增添希望。\n\n蔡奇、王毅等陪同人员同机抵达。\n\n先期抵达的中共中央政治局委员、国务院副总理何立峰，中国驻美国大使谢锋也到机场迎接。\n习近平乘车从机场赴下榻饭店途中，华侨华人和留学生代表聚集在道路两旁，挥舞中美两国国旗，热烈欢迎习近平主席到访。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【1】"}, {"n": 14, "t": "*78年前，联合国大会宣告，人人生而自由，在尊严和权利上一律平等；为实现这一目标，联合国承诺维护国际法、捍卫各国主权，并提供一个", "b": "人生而自由，在尊严和权利上一律平等；为实现这一目标，联合国承诺维护国际法、捍卫各国主权，并提供一个平台，让冲突能够通过合作化解，而非动辄诉诸武力。\n这些初衷是我们所有人共同签署的契约。但遗憾的是，如今我们必须承认，这份神圣盟约在实践中已然遭到背弃。\n联合国已经沦为一个毫无用处的组织，其唯一目的就是供养一群极度傲慢的寄生阶层，他们伪装成心怀善意的官僚。让我引用米塞斯的话说，好人是不会想着去控制人们的生活的。*\n他指责联合国放任混乱、暴力和恐怖主义蔓延，包庇独裁政权，而众多成员国持续投票反对以色列。\n米莱说，联合国打造出一头 “官僚巨兽”，试图决定各国公民应当如何生活。他专门提到新冠疫情，将强制封控形容为一场伪装成科学的全球社会控制实验，并称这正是阿根廷退出世界卫生组织（WHO）的原因。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【14】"}, {"n": 15, "t": "乌克兰总统泽连斯基在联合国大会期间的场边峰会上说，乌克兰已准备好根据埃及、印度和土耳其提出的建议，在黑海达成一项海上休战协议。", "b": "期间的场边峰会上说，乌克兰已准备好根据埃及、印度和土耳其提出的建议，在黑海达成一项海上休战协议。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【15】"}, {"n": 16, "t": "当地时间23日，乌克兰总统泽连斯基在纽约联合国大会发表讲话。", "b": "斯基在纽约联合国大会发表讲话。\n泽连斯基公开证实，此前被乌克兰俘虏的两名朝鲜士兵，如今已被移交韩国。\n\n\n\n“最近，我们向韩国遣送了两名朝鲜战俘。这些人可不容易活捉。其中一个人意识到自己要被俘虏时，试图自杀。但命运没有让他死。”他说。\n\n\n\n泽连斯基没有提供更多关于遣返的细节。乌克兰去年1月在俄罗斯库尔斯克地区抓获了这两名朝鲜士兵，他们是自朝鲜2024年加入俄乌战争以来，首批被活捉的朝鲜士兵。\n\n\n\n泽连斯基表示，如果朝鲜最高领导人金正恩能够促成他们与被俄罗斯扣押的乌克兰人质交换，他愿意把这些人移交给金正恩。\n\n\n\n此前韩国媒体报道称，这两名朝鲜战俘已表达了留在韩国的意愿。\n\n\n\n韩国外交部表示，出于对士兵及其家属安全的考虑，暂无法提供他们回国的具体时间等更多细节。\n\n\n\n6月，韩国方面曾宣布将接收所有为俄罗斯作战的朝鲜战俘，并反对将他们遣返回俄罗斯或朝鲜。\n\n\n\n演讲中，泽连斯基严词批评朝鲜派兵俄罗斯。“这简直太疯狂了。为什么要让朝鲜人在对乌克兰的战争中牺牲？金正恩把他们当成货币。而他从中也得到了回报。”\n\n\n\n据乌克兰和韩国方面估计，自2024年以来，朝鲜已向俄罗斯派遣了约14000至15000名士兵，以支持俄乌战争。其中大部分士兵被部署在俄罗斯库尔斯克地区，协助俄军击退了乌克兰军队的进攻。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【16】"}, {"n": 17, "t": "美国总统特朗普星期二威胁要摧毁伊朗，随即又释放出乐观信号，称两国官员当天在纽约举行了“非常好”的会谈。此次会谈重燃了美伊通过外交", "b": "伊朗，随即又释放出乐观信号，称两国官员当天在纽约举行了“非常好”的会谈。此次会谈重燃了美伊通过外交途径结束战争的希望。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【17】"}, {"n": 18, "t": "佩泽希齐扬星期三（9月23日）在联合国大会发表演讲时说：“我们是恐怖主义的受害者。我来自这样一个伊朗：我们受人尊敬的最高领袖在没", "b": "在联合国大会发表演讲时说：“我们是恐怖主义的受害者。我来自这样一个伊朗：我们受人尊敬的最高领袖在没有任何法律依据或正当理由的情况下遭到暗杀。我来自这样一个伊朗：那里曾发生过学校遭轰炸的惨剧。”\n他说，伊朗不会在与美国的战争中屈服，但主张通过外交手段结束冲突。“（美国总统特朗普）必须明白，面对制裁、加剧的施压和日益严重的霸凌行径，伊朗人民的抵抗只会愈发强烈。我们绝不会低头，也绝不会屈膝。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【18】"}, {"n": 19, "t": "赴美出席联合国大会的韩国总统李在明与美国总统特朗普在联大场边举行约30分钟会谈。双方同意保持密切沟通，推动重启朝美对话，特朗普也", "b": "在明与美国总统特朗普在联大场边举行约30分钟会谈。双方同意保持密切沟通，推动重启朝美对话，特朗普也再次表达与朝鲜对话的意愿。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【19】"}, {"n": 20, "t": "克里姆林宫发言人佩斯科夫说，对于美国邀请俄总统普京出席12月的二十国集团（G20）峰会一事，俄罗斯将予以考虑，并对美方的邀请表示", "b": "于美国邀请俄总统普京出席12月的二十国集团（G20）峰会一事，俄罗斯将予以考虑，并对美方的邀请表示感谢和赞赏。\n俄罗斯通讯社星期三（9月23日）报道，佩斯科夫说：“我们将做出决定，并通过外交渠道对此进行跟进协商。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【20】"}, {"n": 26, "t": "沃伦・巴菲特之子霍华德・巴菲特是乌克兰最坚定的民间支持者之一。俄乌战争全面爆发后，他曾二十多次前往乌克兰。其领导的霍华德・G・巴", "b": "霍华德·巴菲特的两张户外照片：身穿战术背心与头盔，分别手持相机和勘察工具，背景有标牌“81”与损毁的机械残骸。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【26】"}, {"n": 30, "t": "美国地区法官蒂莫西・凯利颁布临时令，恢复这些媒体在白宫采访资格，同时他们的法律挑战仍在进行中。他们的记者证是在没有“宪法上充分正", "b": "时令，恢复这些媒体在白宫采访资格，同时他们的法律挑战仍在进行中。他们的记者证是在没有“宪法上充分正当程序”的情况下被吊销的，因为这些记者在证件被没收数天后才被告知他们可以上诉。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【30】"}, {"n": 33, "t": "2005-2025年中美股市资金流总账", "b": "金流总账\n \n \n俄罗斯记者追着问泽连斯基：你什么时候去莫斯科？\n\n泽连斯基用俄语：坐导弹去。\n \n别人恐慌时我更恐慌，别人贪婪时我更贪婪。。。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【33】"}], "tech": [{"n": 2, "t": "据21世纪经济报道23日消息，9月22日，东风汽车总经理、党委副书记冯长军赴深圳，与华为创始人任正非及华为高层代表会谈。双方围绕", "b": "9月22日，东风汽车总经理、党委副书记冯长军赴深圳，与华为创始人任正非及华为高层代表会谈。双方围绕深化战略合作、产品技术协同创新等议题进行深入交流。\n任正非表示，造车之本在于安全与品质，华为愿发挥所长，与东风共同打造经得起市场检验的智能汽车产品。冯长军对此表示高度认同，强调安全与品质是智能汽车赢得市场信任的基础，东风与华为合作根基深厚，双方在生态建设领域仍有广阔拓展空间，可携手电网探索车网互动可持续商业模式，并在车载通信技术、汽车与智慧交通、智慧城市融合等方向挖掘合作落地场景。\n余承东首次公开表态：聚焦其余四界", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【2】"}, {"n": 13, "t": "炒美股学不到的知识", "b": "炒美股学不到的知识\nARK\nNBA, BA. PE. HE. am. A. DMR. DR,\n一致、卡位、上位、补位、反包、回封、排板、打板、\n扫板、普板、预期 、反转、强弱、高标、核心、杂毛、\n跟风、格局、逮辑、梯队、联动、博弈、止盈、止损、\nma. re. BIR. GR, Rha. HF. BF. Be.\niB. Hak. BOI. mK. Git, SR. EAR. MiR,\nBRM, BBA. i. HE. EA. MA. ME. A.\n回调、换手、接力、冰点、节点、起爆、反核、半路、\n低吸、炸板、首板、承接、修复、发酵、溢价、掉队、\n周期龙、补涨龙、卡位龙、日内龙、空间龙 、穿越龙、\n换手龙、伴生龙、撤退龙、冲天炮、打回封、隔夜单、\n一字板、T 字板、换手板、缩量板、放量板、大烂板、\n加速板、共振板、混沌期、主升期 、箱体震荡、\n平台突破、死亡换手、大长腿、超预期、不及预期、\n预期差、强更强 、弱转强 、强转弱、盈亏比、风报比、\n量价背离、一日游、龙回头、分歧转一致、一致转分层\n美股\n新高、阶段新高、历史新高", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【13】"}, {"n": 21, "t": "英国宣布组建一支新的军事太空中队，负责保护国家卫星。这是各国竞相发展军事太空能力的最新举措。", "b": "队，负责保护国家卫星。这是各国竞相发展军事太空能力的最新举措。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【21】"}, {"n": 22, "t": "食品公司康尼格拉品牌称，越来越多美国人开始询问人工智能该吃什么零食，这一趋势正推动高蛋白食品、浓郁口味以及针对特定健康目标而设计", "b": "多美国人开始询问人工智能该吃什么零食，这一趋势正推动高蛋白食品、浓郁口味以及针对特定健康目标而设计的产品需求增长。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195745#:~:text=【22】"}, {"n": 24, "t": "#小李子老马丁DDL德尼罗合影# 不是AI：莱昂纳多・迪卡普里奥、马丁・斯科塞斯、丹尼尔・戴-刘易斯、罗伯特・ 鲜战俘送往韩国的消息，此举违反了双方的保密协议。\n泽连斯基在联合国大会发言时说，乌克兰已将两名朝鲜战俘送往韩国，并称“很难活捉”朝鲜战俘。\n法新社报道，消息一出，韩国在野党痛批李在明政府，竟然让国人从一个外国领导人口中得知朝鲜战俘已被送抵韩国。\n李在明星期四（9月24日）在X平台发文说：“我不知道乌方为何违背协议公开此事，这非常令人失望。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195752#:~:text=【15】"}, {"n": 16, "t": "星巴克首席运营官格拉姆斯（Mike Grams）在致员工的信息中宣布，会在本周关闭北美地区250家门店，约占星巴克在美国和加拿大", "b": "ke Grams）在致员工的信息中宣布，会在本周关闭北美地区250家门店，约占星巴克在美国和加拿大1万8000家门店的1%。\n格拉姆斯说，公司确认部分门店无法持续提供星巴克希望为顾客和员工带来的体验，或者看不到实现预期财务表现的途径。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195752#:~:text=【16】"}, {"n": 18, "t": "亚洲开发银行警告，俄乌战争、中东冲突升级以及强厄尔尼诺现象正加剧亚洲物价压力，通胀料持续至2027年，促各国央行保持警惕。不过，", "b": "东冲突升级以及强厄尔尼诺现象正加剧亚洲物价压力，通胀料持续至2027年，促各国央行保持警惕。不过，人工智能热潮带动的电子产品需求和科技投资，预计将继续支撑东南亚经济增长。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195752#:~:text=【18】"}, {"n": 19, "t": "俄罗斯检察部门星期三（9月23日）说，在俄罗斯辽阔的西伯利亚克拉斯诺亚尔斯克边疆区，至少有六人过去一个月遭熊袭击身亡。检方指责当", "b": "日）说，在俄罗斯辽阔的西伯利亚克拉斯诺亚尔斯克边疆区，至少有六人过去一个月遭熊袭击身亡。检方指责当地官员未能控制熊的数量，因涉嫌玩忽职守而展开刑事调查。\n据俄罗斯自然资源部数据，自1990年以来，俄罗斯境内的棕熊数量已增加一倍以上，从约13万只增长至今年的近30万8000只。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195752#:~:text=【19】"}, {"n": 20, "t": "这名男子星期四（9月24日）在波兰南部城镇雅罗斯瓦夫（Jaroslaw）一家本笃会修女修道院行凶。", "b": "波兰南部城镇雅罗斯瓦夫（Jaroslaw）一家本笃会修女修道院行凶。\n地区检察官办公室说，这名凶徒31岁，是乌克兰公民，当天早些时候从德国进入波兰。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195752#:~:text=【20】"}], "tech": [{"n": 6, "t": "9月22日，字节跳动企业纪律与职业道德委员会发布中国大陆地区2026年3号通报，集中通报了2026年二季度内部违规违纪案例的处理", "b": "职业道德委员会发布中国大陆地区2026年3号通报，集中通报了2026年二季度内部违规违纪案例的处理结果。通报显示，共有114名员工因触犯公司红线被辞退，其中8人因涉嫌刑事犯罪被移交司法机关处理，6人因严重损害公司利益被提起民事诉讼。（中新经纬）", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195752#:~:text=【6】"}, {"n": 7, "t": "DeepSeek已经完成了70亿美金的B轮融资，估值达到750亿美金，成为中国身价最高的大模型厂商", "b": "IRF                         24 | on”\nDeepSeek完成75亿美元融资\n2026/09/24 14:26\n据了解，DeepSeek完成75亿美元融资，年化营收\n突破10亿美元。 (新浪财经)", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195752#:~:text=【7】"}, {"n": 14, "t": "卡尼并未详述这种军事威胁的具体细节，而是借用金融市场的术语描述相关风险。“我认为，身处这些职位，就有责任审视极端的‘尾部风险’（", "b": "细节，而是借用金融市场的术语描述相关风险。“我认为，身处这些职位，就有责任审视极端的‘尾部风险’（tail risk）。”\n尾部风险是指在投资组合中发生概率极低，但一旦发生就会造成灾难性损失的极端事件风险。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195752#:~:text=【14】"}, {"n": 17, "t": "Alphabet旗下谷歌信任与安全团队创办人本周呼吁放缓人工智能（AI）发展，并警告科技业正在重犯社交媒体时代的错误，可能对儿童", "b": "安全团队创办人本周呼吁放缓人工智能（AI）发展，并警告科技业正在重犯社交媒体时代的错误，可能对儿童造成更严重的伤害。\n谷歌前信任与安全副总裁西格尔（Tom Siegel）接受路透社访问时说，目前主要AI公司不断向儿童推出新功能，却没有建立足够的安全防护措施。\n他指出，这些公司可以立即采取一些措施来更好地保护年轻人，并列举从自杀、精神病到“认知卸载”（cognitive offloading）等风险。认知卸载指的是因依赖AI回答问题而导致批判性思维能力下降的现象。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195752#:~:text=【17】"}, {"n": 21, "t": "没人想到\"按摩店\"现在市值突破了1万亿美元。", "b": "了1万亿美元。\n从30亿到1万亿，333倍，12年。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195752#:~:text=【21】"}, {"n": 24, "t": "GPT发布前的新手凑数，以及GPT发布后的新手凑数", "b": "Before 2023                                                     After 2023\nExpert                    Novice", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195752#:~:text=【24】"}], "cult": [{"n": 3, "t": "亚运会乒乓球男团决赛，中国队2-3不敌日本队，八连冠终结，时隔36年再丢冠，日本队60年后再夺亚运会冠军。", "b": "上下拼接的乒乓球比赛对比图：上半为巴黎2024奥运赛场（日本选手庆祝、中国10分拿赛点），下半为爱知·名古屋2026亚运乒乓球男团决赛（王楚钦对张本智和计分板）。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195752#:~:text=【3】"}]}}, {"date": "20260926", "label": "9月26日", "week": "周六", "id": "195761", "title": "音乐真的没有什么作用", "cats": {"econ": [{"n": 2, "t": "大部分还是花在了饮食上了", "b": "2026年上半年\n中国人把钱都伦在哪了?\n一 全国居民消费支出结构一览 一一\n全国居民人均消费支出       同比增长           Ree\n‘Se  14,836 Xt     3.7%4        mh Lee Rit\n消费类别           人均支出〈元)       占人均消费支出比重\n回   cane         4,537=      30.6%\nna aa     3,135 21\nSee cane)            2,065%         13.9% |\n8    Gene woken       1,572%      oes\nBram 18302 305\nBie                        8802 5.9%\neamanms = gaye 57\na ies\"               470 32%\n每花100元，大约31 元花在食品烟酒，21元花在居住。\n数据为全国居民人均消费支出主要构成情况，反映平均水平，具体因地区、家庭情况而异。\n自  数据来源; 国家统计局 发布日期: 2026年7月15日\n《2026年上半年居民收入和消费支出情况》", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195761#:~:text=【2】"}, {"n": 4, "t": "几位经济学家的现场发言火药味很浓，直切当下宏观经济最核心的痛点：\n\r\n\n\r\n余永定：打破“中央账本洁癖”，宏观政策必须争分夺秒\n", "b": "浓，直切当下宏观经济最核心的痛点：\n\n\n\n余永定：打破“中央账本洁癖”，宏观政策必须争分夺秒\n\n\n\n“机不可失，时不再来，一万年太久，只争朝夕。” 他直言当前国内有效需求不足，不能因为过度担忧赤字而捆住手脚。中央政府账本干干净净，地方账本一塌糊涂，这种格局必须改变；中央杠杆率仅在30%左右，完全有空间大规模发债，追求“财政可持续”远比死守“静态收支平衡”重要得多。 \n\n\n\n姚洋：地方财政停摆引发“30万亿三角债”，机器快转不动了\n\n\n\n姚洋直接点破：地方财政枯竭，拖欠工程款和采购款，导致规模以上企业间形成了约30万亿元的“三角债”闭环。民企拿不到回款、现金流枯竭，连带裁员、收缩，整个微观循环被彻底卡死。他疾呼“中央发债救地方”是第一要务，不能再把钱沉淀到见效极慢的长线基建上，“用长期手段解决短期生死问题，长期我们都死掉了”。\n\n\n\n李迅雷：打破专项债“专款专用”的教条，优先化债清欠\n\n\n\n李迅雷指出，地方在清欠企业账款上面临硬指标考核。现实中各地已极难找到有现金流收益的优质新项目，专项债硬套“专款专用”只会造成资金闲置和财政支出放缓。他呼吁彻底放开限制，允许地方直接把专项债额度用于债务置换和清还民企欠款。\n\n\n\n林毅夫：效仿2000年银行剥离坏账，中央该下场兜底\n\n\n\n过去地方举债大量是为了配合稳增长基建，还不上最终仍会变成银行坏账，兜兜转转还是要财政买单。林毅夫建议借鉴当年成立四大AMC剥离四大行坏账的模式：甄别债务属性，将合规的基建债务由中央集中置换承接，给地方干部卸下包袱，让地方真正轻装上阵、重启增长活力。\n\n\n\n从多位学者的集中呼吁可以看出，宏观政策思路的呼声正在发生关键转向：\n\n\n\n1. 从“严控地方杠杆”转向“中央主动加杠杆”：地方信用与扩张空间已逼近极限，唯有中央信用的强力介入才能破局。\n\n2. 从“铺摊子搞投资”转向“修复微观资产负债表”：当前最紧迫的不是继续造路修桥，而是打通企业间的欠款链条，把现金流重新注入实体，救活民营经济与消费预期。\n\n\n\n一句话总结：中央下场直接印钱，承接地方债\n@山野老头二代:问题不在于谁兜底，问题在于能不能控制住不乱花，没有收益的投资不如发钱。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195761#:~:text=【4】"}], "soc": [{"n": 1, "t": "对外经贸大学官方公布：我校退休教师、全国家喻户晓的音乐家刘欢，于2026年9月25日上午9时52分在上海不幸病逝，享年63岁。", "b": "勾“ 让告| 沉痛悼念我国著名音乐家刘…\nnews.uibe.edu.cn\nIll\n让 告 | 沉痛悼念我国著名音乐家刘欢\n老师\n发布时间: 2026-09-26 。。 浏览次数: 3768 次\n我们沉痛宣告: 我校退休教师、全国家喻户\n晓的音乐家刘欢, 于2026年9月25日上午9时52\n分在上海不幸病逝, 享年63岁。\n刘欢, 1963年8月出生于天津, 1991年7月来\n校工作, 担任艺术教研室教师、副教授, 2023年9\n月退休.。 从教三十余载, 他深耕音乐美育讲台, 曾\n多次获得学校教学表彰。2011年受聘为第三届校\n董会董事。\n刘欢老师主讲的《西方音乐史》是我校美育\n经典课程, 课堂座无虚席, 深受学生喜爱, 影响了\n一代代贸大学子。他为我校校歌《UIBE之歌》作\n曲, 以激扬深情的旋律承载校训精神, 每每在学\n校重大典礼活动上唱响, 成为全体贸大人共同的\n精神印记。\n刘欢老师集音乐教育、音乐创作和歌唱于一\n身, 学贯中西, 师德高尚, 毕生致力于音乐事业，\n为高校音乐教育发展作出了重要贡献。 他的离\n去, 是我校的重大损失, 也是中国音乐界的重大\n损失。\n遵照刘欢老师生前遗愿 丧事从简, 不成立\n治丧委员会, 不举行遗体告别仪式和追悼会。\n斯人已逝, 教泽长存。 我们深切缅怀刘欢老\n对外经济贸易大学\n2026年9月26日", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195761#:~:text=【1】"}, {"n": 6, "t": "交强险经营亏损两百多亿", "b": "损230亿元\n大河财立方   |       关注\n险参保机动车3.86亿辆，经营亏\naa\n文*约1分钟            112人听过\n【大河财立方消息】国家金融监督管理总局9\n月24日\n消息，2025年交强险覆盖面持续扩\n大，参保机动车数量达3.86亿辆，同比增长\n3.8%。其中，汽车参保数量共计3.47亿辆，\n同比增长3.9%。风险保障能力有效加强，当\n年交强险保障金额达76.8万亿元，同比增长\n3.4%。当年赔付支出2524亿元，同比增长\n11.6%，保障民生作用明显提升。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195761#:~:text=【6】"}, {"n": 8, "t": "醒悟的从来不是道理，而是南墙", "b": "风险全给   a\nValuations for newer Chinese companies are much higher\neee\n5 2026\n原本由风投承担的技术失\n败、持续亏损和商业化风险正被提前转移至股票市场; 公开市场\n因此不仅承担成熟企业定价功能，也开始充当高风险科技企业的\n长期融资渠道。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195761#:~:text=【8】"}, {"n": 19, "t": "战场上可以宣布胜利，可收银台前没人替你买单", "b": "Kevin 722829                                                                  ~\n4小时前 2&4 iPhone 18 Pro\n我昨天在家附近买的一车杂货100多元，美国攻打伊朗后，油价涨了不少，物价也\n跟着张，30年房贷利率突破7%6。在我看来，川普政府对伊朗的军事行动是失败\n的，缺乏清晰的整体战略。\n为什么打，打到什么程度，最后如何收场?》嘴上说“马上结束\"，却迟迟看不到明确\n一个超级大国，沦为与伊朗斗嘴皮的境地，让人耻笑。\n美国人关心的是油价、菜价和房贷，不是谁的狠话更响。物价压不下来，战争又迟\n迟收不了场，共和党中期选举必败。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195761#:~:text=【19】"}], "intl": [{"n": 3, "t": "9月24日晚的白宫国宴上，主桌上美方除了特朗普夫妇外，还有马斯克、黄仁勋夫妇、苏姿丰夫妇和库克。", "b": "上美方除了特朗普夫妇外，还有马斯克、黄仁勋夫妇、苏姿丰夫妇和库克。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195761#:~:text=【3】"}, {"n": 9, "t": "泰国度假胜地芭堤雅遭遇持续强降雨，市区多处道路严重积水，三名外籍男游客涉水而行时不慎坠入湍急的排水道，其中两人获救，另有一人失踪", "b": "雨，市区多处道路严重积水，三名外籍男游客涉水而行时不慎坠入湍急的排水道，其中两人获救，另有一人失踪。当局已展开搜救，他们的身份和国籍尚未得到官方确认。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195761#:~:text=【9】"}, {"n": 10, "t": "在美国寻求俄乌重启和平谈判之际，美国总统特朗普本周再次鼓励乌克兰总统泽连斯基，亲自到莫斯科与俄总统普京见面，尽管泽连斯基已经多次", "b": "美国总统特朗普本周再次鼓励乌克兰总统泽连斯基，亲自到莫斯科与俄总统普京见面，尽管泽连斯基已经多次拒绝。彭博社报道，泽连斯基本周在纽约联合国大会与特朗普会晤时，直接回绝了特朗普的这个提议。知情人士称，特朗普一再提出这个建议，令泽连斯基颇为恼火。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195761#:~:text=【10】"}, {"n": 11, "t": "北约高级指挥官说，针对一系列明显与俄罗斯有关的破坏活动及其他事件，北约正在加强情报共享；联盟应保持冷静和自信，确信有能力应对俄罗", "b": "显与俄罗斯有关的破坏活动及其他事件，北约正在加强情报共享；联盟应保持冷静和自信，确信有能力应对俄罗斯构成的 以结合最新形势，加强交流、深入探讨、寻求共识。（外交部网站）", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195775#:~:text=【1】"}, {"n": 12, "t": "在此之前，印度国家气象局预测，由于今年的年度季风雨季降雨量不足，恐将严重威胁当地农民的生计。气象局指出，今年异常强劲的厄尔尼诺气", "b": "由于今年的年度季风雨季降雨量不足，恐将严重威胁当地农民的生计。气象局指出，今年异常强劲的厄尔尼诺气候现象导致了异常的降雨模式。\n位于印度西部的马哈拉施特拉邦拥有1亿3000万人口，是印度主要的农业邦，盛产棉花、大豆、甘蔗和豆类。马哈拉施特拉邦首府孟买则是印度的金融和商业中心。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195775#:~:text=【12】"}, {"n": 14, "t": "伊朗是通过调解方卡塔尔，向美国提出重开霍尔木兹海峡的方案，条件是在包括黎巴嫩在内的各条战线停火七天。这期间，美国须解除对伊朗的港", "b": "提出重开霍尔木兹海峡的方案，条件是在包括黎巴嫩在内的各条战线停火七天。这期间，美国须解除对伊朗的港口封锁、解冻资金，并给予石油制裁豁免，伊朗则在停火第七天重开海峡，之后与美国针对核问题等展开谈判。\n不过，《华尔街日报》星期五（9月25日）引述美国官员报道，特朗普告诉幕僚，他很怀疑伊朗会信守承诺，并称在11月中期选举后很可能恢复对伊朗的军事打击。\n官员透露，美国已告知伊朗和调解方，特朗普无意解除海上封锁。美方认为，经济压力终将迫使伊朗签署一份有利于美国和波斯湾阿拉伯国家的协议。\n【特朗普拒绝和平协议 伊朗坚持通过外交解决冲突】尽管美国总统特朗普拒绝了伊朗关于停火七天以重开霍尔木兹海峡的提议，伊朗仍然坚持认为，只有通过外交途径才能解决和美国与以色列的冲突，使大家走出僵局。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195775#:~:text=【14】"}, {"n": 15, "t": "美国总统特朗普说，他已批准了适用于小汽车和卡车的新燃油效率标准，并称这将降低新车价格。美国交通部长达菲则称，星期一将是“美国汽车", "b": "用于小汽车和卡车的新燃油效率标准，并称这将降低新车价格。美国交通部长达菲则称，星期一将是“美国汽车工人迎来重大胜利的日子”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195775#:~:text=【15】"}, {"n": 16, "t": "泰国首都曼谷连续两天暴雨引发严重洪涝，市政府星期六（9月26日）宣布首都所有50个区为洪水灾区。在伦敦访问的泰国首相阿努廷也提前", "b": "重洪涝，市政府星期六（9月26日）宣布首都所有50个区为洪水灾区。在伦敦访问的泰国首相阿努廷也提前结束行程，返国处理灾情。\n从星期四（24日）至星期六下午，曼谷降雨量已接近300毫米。连绵不断的降雨导致曼谷的运河水位上涨，浑浊的河水涌入周边的民宅、餐馆、商店和巷弄。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195775#:~:text=【16】"}, {"n": 18, "t": "美国国务卿鲁比奥日前说，特朗普和罗德里格斯也讨论了重组委内瑞拉庞大主权债务的问题，以及政治过渡。", "b": "和罗德里格斯也讨论了重组委内瑞拉庞大主权债务的问题，以及政治过渡。\n罗德里格斯星期三（23日）在联合国大会发表讲话时承诺，委内瑞拉将举行选举，作为向“全面民主”过渡的一部分。她也称，政府已开始与部分反对派展开对话，但没有公布选举日期。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195775#:~:text=【18】"}, {"n": 22, "t": "起因是韩国一位网友的祖父去世了，然后把祖父遗物屏风上不认识的汉字发出来，被发现是苏轼、韦应物的诗词", "b": "eS\n22eeRRmm\n纪由《\n从出生起就看到的屏风，但爷爷没告诉我含义就\npg a |= eae eA二\n评价此翻译: 只 吕\ntb\n人\n加\nET td OA", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id 若伊朗发展核武器，它也会这么做。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195807#:~:text=【13】"}, {"n": 14, "t": "教宗星期六（9月26日）乘坐教宗座驾沿香榭丽舍大道前往弥撒地点，沿途信众挥舞白色和黄色旗帜，高喊“良十四世”、“教宗万岁”等口号", "b": "宗座驾沿香榭丽舍大道前往弥撒地点，沿途信众挥舞白色和黄色旗帜，高喊“良十四世”、“教宗万岁”等口号。人群从协和广场一直延伸至凯旋门，绵延约2.2公里。\n42岁的帕姆布也是到场信众，她希望教宗再次为和平发声。教宗良十四世今年批评伊朗战争后，曾受到美国总统特朗普斥责。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195807#:~:text=【14】"}, {"n": 16, "t": "距离#美国#11月3日#中期选举#还有六个多星期，美国媒体称，选民对总统#特朗普#的严重不满宛如一股汹涌暗流，正将全美各地的#共", "b": "举#还有六个多星期，美国媒体称，选民对总统#特朗普#的严重不满宛如一股汹涌暗流，正将全美各地的#共和党#候选人拖入险境，并且对此前共和党认为稳操胜券的席位产生严重威胁，几个传统红州都面临摇摆风险。\n记者：“你已经和伊朗开战6个月了。”\n特朗普：“嗯，我们在越南待了21年。”\n记者：“所以你欺骗美国人说你会在两天内结束，然后是10天，然后是一个月，而现在我们已经半年过去了。”\n特朗普：“安静。你是个假记者。”\n记者：“你必须向公民道歉。你是个连环骗子。”\n特朗普：“滚出去。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195807#:~:text=【16】"}, {"n": 17, "t": "苏珊・B・格拉瑟在《纽约客》中写道，共和党人在中期选举前与川普决裂并不奇怪。 “问题是，今天的共和党候选人在将政党变成个人崇拜邪", "b": "写道，共和党人在中期选举前与川普决裂并不奇怪。 “问题是，今天的共和党候选人在将政党变成个人崇拜邪教十年后，很难逃离川普。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195807#:~:text=【17】"}, {"n": 18, "t": "伊朗禁止无亲属关系男女在公共场合身体接触，舞台也不例外。但剧团回应称，手机拍摄角度造成两人距离过近的错觉，并且剧中这一幕里的两个", "b": "合身体接触，舞台也不例外。但剧团回应称，手机拍摄角度造成两人距离过近的错觉，并且剧中这一幕里的两个角色其实是兄妹，因此按照伊斯兰教法，两人之间的身体接触并不属于被禁止的行为。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195807#:~:text=【18】"}, {"n": 21, "t": "9月23日，为乌克兰作战的中国籍战士谭震被俄罗斯军队俘虏，遭受酷刑后被斩首。他将被埋葬在日托米尔军人公墓。荣耀属于英雄。", "b": "54 0KPEMH POSBIAYBANGH\nIMEH Mixing Mh BATANGig\nTHU\nM4        CaBiTta naM?HTP\nA             Perera rise iY\nbP eee cr es od\n4          In Loving Memory        当\n%            Chinese Drone Operator of the            WM\n54th Separate Reconnaissance Battalion of Ukraine\neS eee\n一 牺牲于 2026年9月23日一  cy\n下\nyy — Fallen on September 23, 2026 —_”\nee pee ee", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195807#:~:text=【21】"}, {"n": 22, "t": "重新去看了《北京欢迎你》和《我和你》的视频，深深感觉那个世界已经不在了，甚至有点震撼说那个世界竟然曾经出现过", "b": "和你》的视频，深深感觉那个世界已经不在了，甚至有点震撼说那个世界竟然曾经出现过", "href": "https:/ n评价此翻译: 中 加\n01:30 - 2026/9/30 - 280 RAG\nQO v99 tl 2301 OY 24m P23 oF", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【22】"}, {"n": 23, "t": "女装商家近期大规模给衣服缝上“防拆带”――一条长达2.4米、剪断即不可退货的显眼丝带――这并非刁难顾客，而是被畸高的退货率和“穿", "b": "防拆带”――一条长达2.4米、剪断即不可退货的显眼丝带――这并非刁难顾客，而是被畸高的退货率和“穿完就退”的白嫖行为逼出的物理防御。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【23】"}], "intl": [{"n": 10, "t": "伊朗革命卫队一名发言人星期二（9月29日）称美国总统特朗普是“大骗子”，指责他向美国民众隐瞒有关伊朗核计划，以及伊朗封锁海湾地区", "b": "9月29日）称美国总统特朗普是“大骗子”，指责他向美国民众隐瞒有关伊朗核计划，以及伊朗封锁海湾地区能源运输成效的真相。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【10】"}, {"n": 11, "t": "俄罗斯总统普京周一（9月29日）签署政令，将俄军规模增加1万5500人，至244万1630人。", "b": "）签署政令，将俄军规模增加1万5500人，至244万1630人。\n这是今年以来，普京第四次发布此类命令。政令没有说明增兵的原因。此前普京分别在3月、6月和7月扩大军队规模。自3月以来，俄军总兵力累计增加了4万7860人。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【11】"}, {"n": 12, "t": "美国总统特朗普在距中期选举仅剩几周之际又作出争议举动。特朗普政府利用纳税人资金投放三则宣传广告，遭两党强烈批评，并引发关于合法性", "b": "几周之际又作出争议举动。特朗普政府利用纳税人资金投放三则宣传广告，遭两党强烈批评，并引发关于合法性的质疑。\n这三则广告上周面向全美电视观众播出，都以“由美国政府付费”的声明结尾。特朗普在其中一则广告中强调，“美国永远不会成为共产主义国家”，背景声反复唱着“爱我”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【12】"}, {"n": 13, "t": "美国总统特朗普星期二（9月29日）发布了一份他与一众科技公司巨头共同签署的文件。特朗普政府将这份文件定性为一项人工智能协议。", "b": "日）发布了一份他与一众科技公司巨头共同签署的文件。特朗普政府将这份文件定性为一项人工智能协议。\n路透社报道，特朗普在他自家的社媒平台Truth Social发布这份仅有一页的文件，并形容这份文件具有“道义约束力”。\n特朗普发布“超级智能协定”，署名美国拼错了。。。\n午宴座次凸显马斯克与黄仁勋在美国科技界的地位。\n刚刚，特朗普于白宫举办“超级人工智能午宴”。在座位安排上，特朗普居于主位，马斯克、黄仁勋被安排分居他的左右两侧，这也象征着二人当下在美国AI、芯片领域举足轻重的分量。\n此次“超级AI午宴”几乎集齐了美国头部AI、芯片、云大厂：微软、亚马逊、Meta、谷歌、英伟达、AMD、博通、OpenAI、Anthropi的Boss们全部到场，同时还有白宫内阁官员、国会代表、投资机构。\n午宴的核心议题为美国人工智能监管政策与AI产业发展。\n#特朗普签署行政令正式将AI更名为SI#\n马斯克在将SI称为AI后意识到自己的错误\n\n马斯克：请原谅我\n\n特朗普：谢谢你\n\n特朗普感谢马斯克纠正口误", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【13】"}, {"n": 15, "t": "英国首相伯纳姆发表出任执政工党党魁以来的首次演讲，宣布包括住房在内一系列关键问题的政策。他号召英国人团结一致，并承诺带领国家走上", "b": "党魁以来的首次演讲，宣布包括住房在内一系列关键问题的政策。他号召英国人团结一致，并承诺带领国家走上新道路、让人民重燃希望。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【15】"}, {"n": 16, "t": "韩国军方星期二（9月29日）首次确认，西部前线非军事区爆炸现场发现的朝军地雷是人为埋设，且爆炸点及新发现的地雷均位于军事分界线以", "b": "次确认，西部前线非军事区爆炸现场发现的朝军地雷是人为埋设，且爆炸点及新发现的地雷均位于军事分界线以南。若最终确认由朝军所为，将涉及违反《朝鲜停战协定》，但是否蓄意针对韩军仍待调查。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【16】"}, {"n": 18, "t": "东京的雨季通常在6月，但今年整个夏季都频繁出现强降雨，东京周边地区也发生严重洪灾。这轮连续降雨是自1886年有记录以来持续时间最", "b": "个夏季都频繁出现强降雨，东京周边地区也发生严重洪灾。这轮连续降雨是自1886年有记录以来持续时间最长的一次。\n日本气象厅官员经田正幸说，本月特殊的天气形势部分是因为厄尔尼诺现象令太平洋海域气温升高导致。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【18】"}, {"n": 21, "t": "美国。2026年9月29日正式上线了America.gov网站：", "b": "== America.gov                        >\nHello, America\nWhatever you need from\ngovernment, start here.\namerica.gov", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【21】"}, {"n": 25, "t": "移民后你周围的邻居", "b": "移民后你周围的邻居\n在美国，你的邻居:\nMMB SPU Mle 6 MRSS eee\nHMSSSS Ee Sve ee wee ee es\nBe 42eanHMUeXrs a waesseaos wl\n在英国，你的邻居:\nBERBER EES SS we es 6s eS oS es\nBE SREMMMSSSSSssssese\nen国\n在加拿大，你的邻居:\n区工世工世三区工区区工区二工区三世\nIE 上本是本本国二二工二二王\nSSSecsctlvitt icles MPM wmeEewmls\n在新西兰，你的邻居:\n各\nBREVBRRaReespReananarse\nBRE R WERE AH! awa hs\nBRRPRVRBaRaeBevpanpAsyavea\n在澳大利亚，你的邻居:\nET th te tn tr th te tH tH th tn KR\nKKK QGQUVBEMBRVYE@OSBEE\nVALE AS Bev,aBusze~.wsrn", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【25】"}], "tech": [{"n": 5, "t": "董少鹏：通过深化制度改革 消除减持恐惧、共谋套利、箱体收割 市场红红火火的局面就可以重现 中国股市超越美国股市并非梦想", "b": "BS: 通过深化制度改革 RRM\n惧、共谋套利、箱体收割 市场红红火火\n的局面就可以重现 中国股市超越美国股\n市并非梦想\n2026-09-27 18:40 星期日                                            69 约2分钟\n资深财经评论员董少鹏发文指出，中国股民近五年很不\n容易，中国股市近五年也很不容易。大家都希望中国股\n市能够在国际上站得住，经得起评头论足，经得起风\n雨。近些年中国股市的确积累了一些新的矛盾，需要加\n快调整和解决。越是在这个时刻，越应该坚持真理，尊\n重市场本身的规律。\n本质上，当前市场暴露出的投资者受损的一系列问题，\n是诚信问题和监管问题，为此，就要从失信惩戒、违法\n秆戒两方面下手，依法严厉打击各类欺诈问题，不能手\n软，不能讲情，不能法不责众。从宏观制度上，必须高\n度重视供需失衡问题，即二级市场筹码供给多、资金入\n市少的问题，IPO价格总体偏高、限售股股东强烈希望\n绕道套取利益问题，保荐机构与上市公司共谋套取二级\n市场投资者利益问题。尤其需要检讨现行限售制度，要\n让供需市场化调节，硬撮住是危险的。\n通过深化制度改革，消除减持丽惧、共谋套利、箱体收\n割，投融资双方相互信任，可以公平博弈，监管只打不\n公平，不管正常博穿，实现白菜白菜价、鲍鱼鲍鱼价，\n市场红红火火的局面就可以重现，甚至可以比历史上任\n何时期都好。中国股市运越荧匮", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【5】"}, {"n": 9, "t": "受市场对美国通胀前景和美联储加息预期的影响，美国30年期国债收益率星期二（9月29日）盘中显著升高，一度触及5.623%，为20", "b": "息预期的影响，美国30年期国债收益率星期二（9月29日）盘中显著升高，一度触及5.623%，为2002年6月以来最高水平。\n此外，作为房贷、车贷、信用卡利率定价基准的美国10年期国债收益率盘中一度冲高至5.297%；而与联邦基金利率紧密挂钩的2年期美债收益率则呈现窄幅震荡态势。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【9】"}, {"n": 20, "t": "Ai 代理能干什么？怎么用？", "b": "Muse 是 Meta 2026 年 9 月推出的个人 AI 代理，不是只会聊天的 Meta AI。它能自己打开浏览器、连你的邮箱和日历、帮你把事情做完。广告里那句就是它的卖点：盯航班、订酒店餐厅、管邮件，你去度假。\n \n能做什么？日常代办：\n\n• 查航班、订机票（对接 500+ 航司）、订酒店、订餐厅（OpenTable 等）\n\n• 读、起草、发送邮件；整理收件箱\n\n• 填表、约时间、客服沟通、砍账单\n\n• 网购比价、下单（支付走 Stripe Link，一笔一确认，它看不到完整卡号）\n\n\n\n未来不久，muse可以：\n\n• 你丢一个目标给它（健身、卖车、旅行），它会拆计划、盯进度、主动推进文件和内容\n\n• 读/写 PDF、Word、表格，生成图片、行程单、播客类成品\n\n• 需要新工具时，可以自己搭简单工具\n\n和普通聊天机器人的差别：它有一台独立的云端电脑和浏览器，关 App 后还能继续干活；发邮件、付钱这类敏感操作会先问你。\n\n\n\n怎么用：在 Chat 里像跟人说话一样下任务，越具体越好。例如：“下周五纽约飞迈阿密，经济舱，预算 $300 以内，先给我三个航班选项，不要直接下单。”\nai代理和普通聊天机器人的差别：它有一台独立的云端电脑和浏览器，关 App 后还能继续干活；发邮件、付钱这类敏感操作会先问你。\n目前 AI代理app只支持美国市场，在欧洲和亚洲暂时无法使用。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【20】"}, {"n": 25, "t": "傅蔚冈 · 看中了一件羽绒服一直没下单，这两天亏的应该够买好多件了。生活中抠抠搜搜，股市类挥金入土。", "b": "看中了一件羽绒服一直没下单，这两天亏的应该够买好多件了。生活中抠抠搜搜，股市类挥金入土。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【25】"}], "cult": [{"n": 8, "t": "25岁网红博主患癌去世", "b": "她表示 :“自己每天基本在12点到2点间睡觉; 一天吃2顿饭，中间间隔时间长; 不爱\n喝水，一天2杯咖啡，一周喝3-4次奶茶，平时吃外卖或下馆子。”\n\\  Ce RRS NACH", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【8】"}, {"n": 19, "t": "26日下午约3点，\u003c纽约时报> 游戏部门总监 ，40岁的 Jonathan McKinsey 在加州旧金山湾区都柏林市的 Dub", "b": "纽约时报中文网人                                                        Go\n@nytchinese\n& Show translation\n湾区夫妇被控枪杀跨性别女婿: MHRERS—BRLAE, WER\n妻子的父母张守勇 〈音) 和陈诗丽〈音)。记录显示他与麦子婚姻破裂，他\n曾指控妻子以及岳父母因其跨性别身份虐待他。\n一对湾区夫妇被控枪杀跨性别女姬\nFrom cn.nytimes.com\n2:00 PM - Sep 29, 2026 - 39.6K Views", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【19】"}]}}]}</script>

      var full = items.length === 1 ? ' full' : '';
      var pcl = it.b.length > 90 ? 'clamp' : 'full';
      panels += '<article class="item' + full + '" data-ci="' + ci + '" data-i="' + i2 + '" title="点击查看全文"><div><div class="item-head">'
        + '<div class="src src-' + ['sun','mon','tue','wed','thu','fri','sat'][new Date(+dateStr.slice(0,4), +dateStr.slice(4,6)-1, +dateStr.slice(6,8)).getDay()] + '">' + wd + ' · ' + (it.n < 10 ? '0' : '') + it.n + '</div>'
        + '<a class="src-link" href="' + it.href + '" target="_blank" rel="noopener">来源</a></div>'
        + '<h3>' + esc(it.t) + '</h3><p class="' + pcl + '">' + esc(it.b.replace(/\s+/g,' ')) + '</p></div></article>';
    });
    panels += '</div></section>';
  });
  document.getElementById('panels').innerHTML = panels;
  // 检测正文是否超出 6 行 → 标记"点击查看全文"
  var itemsEls = document.querySelectorAll('.item p.clamp');
  for (var i=0;i<itemsEls.length;i++){
    var p = itemsEls[i];
    if (p.scrollHeight > p.clientHeight + 2){
      var art = p.closest('.item');
      art.classList.add('has-more');
    } else {
      p.className = 'full';
    }
  }
  bindModal();
  var btns = document.querySelectorAll('.day-btn');
  for (var i=0;i<btns.length;i++){
    btns[i].className = btns[i].getAttribute('data-date') === dateStr ? 'day-btn active' : 'day-btn';
  }
  var links = '';
  DAYS.forEach(function(d){
    links += '<div><span class="src">' + d.label + '</span><a href="https://www.dapenti.com/blog/more.asp?name=xilei&id=' + d.id + '" target="_blank" rel="noopener" title="' + esc(d.title) + '">' + esc(d.title) + '</a></div>';
  });
  document.getElementById('footer-links').innerHTML = links;
  document.getElementById('footer-note').textContent = '喷嚏图卦 · ' + DAYS[0].label + ' – ' + DAYS[DAYS.length-1].label + ' 日报 · ' + DAYS.length + ' 期 · 五主题分类 · 每日 18:00 自动更新';
  history.replaceState(null, '', '#' + dateStr);
}

function showDay(dateStr){ renderDay(dateStr); document.getElementById('top').scrollIntoView({behavior:'smooth'}); }

var curCat = '', curItem = null;
function bindModal(){
  var arts = document.querySelectorAll('.item');
  for (var i=0;i<arts.length;i++){
    arts[i].onclick = function(e){
      if (e.target.closest('.src-link')){ return; }
      var ci = +this.getAttribute('data-ci'), ii = +this.getAttribute('data-i');
      var it = DAYS.filter(function(d){ return d.date === cur; })[0].cats[CATS[ci].id][ii];
      openModal(CATS[ci], it, cur);
    };
  }
}
function openModal(cat, it, dateStr){
  var day = DAYS.filter(function(d){ return d.date === dateStr; })[0];
  document.getElementById('modal-tag').textContent = day.label + '（' + day.week + '） · ' + cat.name + ' · 序号 ' + it.n;
  document.getElementById('modal-title').textContent = it.t;
  document.getElementById('modal-body-text').textContent = it.b;
  document.getElementById('modal-src').innerHTML = '原文：<a href="' + it.href + '" target="_blank" rel="noopener">打开喷嚏网原文</a>';
  document.getElementById('modal-mask').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('modal-mask').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-mask').addEventListener('click', function(e){
  if (e.target === this){ closeModal(); }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ closeModal(); } });

window.addEventListener('hashchange', function(){
  var h = location.hash.slice(1);
  if (h && h.length === 8 && DAYS.some(function(d){ return d.date === h; })){ renderDay(h); }
});

renderDay(cur);
</script>
