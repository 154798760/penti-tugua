<style>
  :root{
    --paper:#F5F4EF; --card:#FFFFFF; --ink:#20242B; --ink-2:#5A5F68; --line:#E2E0D8;
    --blue:#2662B8; --green:#12805E; --red:#C0443B; --purple:#6A48B0; --amber:#B07A1E;
    --blue-soft:rgba(38,98,184,.06); --green-soft:rgba(18,128,94,.06);
    --red-soft:rgba(192,68,59,.06); --purple-soft:rgba(106,72,176,.06); --amber-soft:rgba(176,122,30,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
  .wrap{max-width:800px;margin:0 auto;padding:0 20px}
  a{color:inherit}
  ::selection{background:rgba(176,122,30,.25)}

  /* 报头 */
  .masthead{background:var(--ink);color:#F5F4EF}
  .masthead-inner{max-width:840px;margin:0 auto;padding:34px 20px 30px}
  .brand-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand{font-family:"Noto Serif SC",serif;font-weight:900;font-size:26px;letter-spacing:.12em}
  .brand .dot{color:var(--amber)}
  .slogan{font-size:13px;color:#A9AEBB;letter-spacing:.08em}
  .issue-date{font-size:13px;color:#8C93A3;letter-spacing:.2em;margin-top:6px}
  .issue-title{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(24px,4.6vw,36px);line-height:1.4;margin:16px 0 4px;color:#fff}
  .issue-sub{font-size:13px;color:#8C93A3}

  /* 日期切换 */
  .daybar{background:#1B1E24;border-top:1px solid rgba(255,255,255,.1)}
  .daybar-inner{max-width:840px;margin:0 auto;padding:12px 20px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#A9AEBB;border-radius:8px;padding:8px 6px 6px;cursor:pointer;font-family:inherit;transition:all .15s}
  .day-btn b{display:block;font-size:13px;font-weight:600;color:#E7E9EE}
  .day-btn span{font-size:11px;color:#8C93A3}
  .day-btn:hover{background:rgba(255,255,255,.14)}
  .day-btn.active{background:var(--amber);border-color:var(--amber);color:#20242B}
  .day-btn.active b{color:#20242B}
  .day-btn.active span{color:#20242B}

  /* 导航 */
  .section-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .nav-inner{max-width:840px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .nav-inner::-webkit-scrollbar{display:none}
  .nav-inner a{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink-2);padding:5px 12px;border-radius:999px;transition:all .15s}
  .nav-inner a:hover{background:var(--line);color:var(--ink)}
  .nav-inner a i{width:8px;height:8px;border-radius:50%;background:var(--nc)}
  .to-top{margin-left:auto;color:var(--ink-2);font-size:13px;text-decoration:none;padding:5px 10px;border:1px solid var(--line);border-radius:999px;flex-shrink:0}
  .to-top:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* 主题板块 */
  main{padding:36px 0 20px}
  section.panel{margin-bottom:56px;scroll-margin-top:64px}
  .panel-head{display:flex;align-items:center;gap:16px;margin-bottom:4px}
  .panel-mark{width:46px;height:46px;border-radius:10px;background:var(--sec);color:#fff;font-family:"Noto Serif SC",serif;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .panel-title{font-family:"Noto Serif SC",serif;font-weight:700;font-size:clamp(20px,3.2vw,24px);color:var(--sec)}
  .panel-title span{font-size:13px;color:var(--ink-2);font-family:"Noto Sans SC",sans-serif;font-weight:400;display:block;margin-top:2px}
  .panel-line{height:2px;background:var(--sec);opacity:.25;margin:14px 0 20px}

  /* 条目 */
  .items{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sec);border-radius:0 8px 8px 0;padding:12px 15px;transition:background .18s;break-inside:avoid;cursor:pointer;position:relative}
  .item:hover{background:var(--sec-soft)}
  .item-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .item-head .src{flex-shrink:0}
  .item .src{font-size:11.5px;font-weight:500;letter-spacing:.05em;opacity:.95}
  .item h3{font-family:"Noto Serif SC",serif;font-weight:700;font-size:14.5px;line-height:1.45;margin:2px 0 4px}
  .item p.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;font-size:12.8px;color:#4A4F58;line-height:1.6}
  .item p.full{font-size:12.8px;color:#4A4F58;line-height:1.6}
  .item.has-more::after{content:"… 点击查看全文";position:absolute;right:10px;bottom:6px;font-size:11px;color:var(--sec);background:linear-gradient(90deg,transparent,var(--card) 30%);padding:2px 6px 2px 14px;pointer-events:none}
  .item.has-more p.clamp{position:relative}
  .src-link{font-size:11px;color:var(--ink-2);text-decoration:none;white-space:nowrap;border-bottom:1px dashed var(--line);transition:color .15s,border-color .15s;position:relative;z-index:2}
  .src-link:hover{color:var(--sec);border-color:var(--sec)}
  .item.full{grid-column:1/-1}
  .src-mon{color:var(--blue)} .src-tue{color:var(--green)} .src-wed{color:var(--purple)} .src-thu{color:var(--red)}
  .src-fri{color:var(--amber)} .src-sat{color:#3E7D8C} .src-sun{color:#2F6B7A}

  /* 全文弹层 */
  .modal-mask{position:fixed;inset:0;background:rgba(20,22,28,.62);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .18s}
  .modal-mask.open{opacity:1;visibility:visible}
  .modal{background:var(--paper);max-width:640px;width:100%;max-height:82vh;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;transform:translateY(10px);transition:transform .18s}
  .modal-mask.open .modal{transform:translateY(0)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
  .modal-tag{font-size:12px;color:var(--sec);font-weight:600;letter-spacing:.06em}
  .modal-close{background:none;border:none;font-size:22px;line-height:1;color:var(--ink-2);cursor:pointer;padding:4px 8px;border-radius:6px}
  .modal-close:hover{color:var(--ink);background:var(--line)}
  .modal-body{overflow-y:auto;padding:18px 20px 22px}
  .modal h3{font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px;line-height:1.5;margin-bottom:12px}
  .modal p{font-size:14.5px;line-height:1.9;color:#33363D;white-space:pre-wrap;word-break:break-word}
  .modal-src{margin-top:16px;font-size:12.5px}
  .modal-src a{color:var(--sec);text-decoration:none;border-bottom:1px dashed var(--line)}

  /* 页脚 */
  footer{background:var(--ink);color:#A9AEBB;margin-top:20px}
  .footer-inner{max-width:840px;margin:0 auto;padding:30px 20px;font-size:13px;line-height:1.9}
  .footer-inner a{color:#F5F4EF;text-decoration:none}
  .footer-inner a:hover{color:var(--amber)}
  .footer-inner .src{color:#8C93A3}
  .footer-links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 18px;margin:10px 0 14px}
  .footer-links div{display:flex;align-items:baseline;gap:8px;min-width:0}
  .footer-links .src{flex-shrink:0}
  .footer-links a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.item,.nav-inner a,.day-btn{transition:none}}
  @media (max-width:720px){
    .daybar-inner{grid-template-columns:repeat(4,1fr)}
    .items{grid-template-columns:1fr}
    .footer-links{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
</style>

1#:~:text=【7】"}, {"n": 14, "t": "美国康奈尔大学因2024年一起涉嫌七名男子集体性侵女学生的案件引发强烈争议，康奈尔大学校长星期二宣布，将禁止校园兄弟会在会所举办", "b": "涉嫌七名男子集体性侵女学生的案件引发强烈争议，康奈尔大学校长星期二宣布，将禁止校园兄弟会在会所举办派对和社交活动，直至本学年结束。\n诉讼曝光后，康奈尔大学因处理性侵指控的方式受到学生、教职员、校友及捐款人的猛烈批评。学生发起抗议，部分教职员酝酿对校方提出不信任动议。\n康奈尔大学2025年的一项调查显示，35%的本科女学生说，入学以来曾在遭受强迫或失去反抗能力的情况下，经历未经同意的性接触。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【14】"}, {"n": 15, "t": "天主教教宗良十四世星期二接受手术，切除右肺癌性肿瘤。梵蒂冈证实，手术顺利完成，没有出现并发症，但医生仍须进一步检查，以确定癌细胞", "b": "术，切除右肺癌性肿瘤。梵蒂冈证实，手术顺利完成，没有出现并发症，但医生仍须进一步检查，以确定癌细胞是否扩散。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【15】"}, {"n": 16, "t": "秘鲁政府计划收紧学校纪律，禁止女学生穿短裙、涂指甲油，以及男学生留长发，并限制学生使用手机，引发女权及人权组织批评，认为这些措施", "b": "女学生穿短裙、涂指甲油，以及男学生留长发，并限制学生使用手机，引发女权及人权组织批评，认为这些措施无助于遏制校园暴力，反而带有威权色彩。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【16】"}], "intl": [{"n": 4, "t": "今年上半年，全球新车销量里，油车所占份额第一次失守50%，不过整个汽车市场也萎缩了5%，买车的人变少了。", "b": "全球新车市场\n纯汽油 车份额\n首次跌破一半\n2021年为73% + 下降24个百分点\n动力类型                 份额\n纯汽油               49%\n普通混动               18%\n纯电动                17%\n柴油、插混及其他            约16%\n普通混      ER; 约16%为余项推算。\n约83%的新车仍有发动机，按100%减去17%的纯电份额推算。\nGy,\n2026年上半年\n销量 (万辆)             同比\n2,025          -10%\n727          +10%\n687         +12%\n未披露              oe\n来源: Electrek + 2026.10.05\nMobility Global / Nikkei", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【4】"}, {"n": 9, "t": "沙特能源部星期三（10月14日）发布声明说，沙特阿美位于宰赫兰（Dhahran）的一栋行政大楼星期二（13日）晚遭袭，引发局部火", "b": "）发布声明说，沙特阿美位于宰赫兰（Dhahran）的一栋行政大楼星期二（13日）晚遭袭，引发局部火患，当局已采取必要措施，事件没有造成人员伤亡。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【9】"}, {"n": 10, "t": "也门胡塞武装警告美国不要介入也门战争，否则将面临“令其痛苦的反击”。随着胡塞武装与美国盟友沙特阿拉伯之间的战斗加剧，一直不愿卷入", "b": "门战争，否则将面临“令其痛苦的反击”。随着胡塞武装与美国盟友沙特阿拉伯之间的战斗加剧，一直不愿卷入其中的华盛顿正考虑出手打击胡塞武装。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【10】"}, {"n": 11, "t": "乌克兰总统泽连斯基星期二（10月13日）说，乌克兰并未收到西方盟友关于俄罗斯向其首都发射弹道导弹的预先警告。", "b": "月13日）说，乌克兰并未收到西方盟友关于俄罗斯向其首都发射弹道导弹的预先警告。\n美国官员威胁称，如果乌克兰不停止袭击俄罗斯炼油厂，将切断对乌情报共享和武器销售。专家和官员指出，基辅在获取导弹袭击预警方面高度依赖美国情报。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【11】"}, {"n": 12, "t": "美国总统特朗普计划下月访问亚洲之际，再次提及可能与朝鲜领导人金正恩会面。然而，朝方至今未释放明确对话信号，反而高调展示包括洲际弹", "b": "之际，再次提及可能与朝鲜领导人金正恩会面。然而，朝方至今未释放明确对话信号，反而高调展示包括洲际弹道导弹、潜射弹道导弹等多款先进武器。分析认为，平壤意在展示核打击能力，强调拥核国地位，并为未来朝美谈判争取有利条件。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【12】"}, {"n": 13, "t": "随着伊朗伊斯兰革命卫队更加密集地攻击穿过霍尔木兹海峡的油轮，很多大型油轮的运营商宁可舍弃高额经济报酬，也选择掉头远离这个高风险航", "b": "地攻击穿过霍尔木兹海峡的油轮，很多大型油轮的运营商宁可舍弃高额经济报酬，也选择掉头远离这个高风险航道，让外界再次担忧波斯湾的原油出口是否可持续。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【13】"}, {"n": 17, "t": "英国前首相苏纳克星期二（10月13日）说，以美国为首的全球秩序“已经终结”，世界正进入地缘政治不确定性加剧的时期。", "b": "13日）说，以美国为首的全球秩序“已经终结”，世界正进入地缘政治不确定性加剧的时期。\n彭博社报道，苏纳克在新德里举行的彭博“新经济论坛”首日会议上说，美国总统特朗普“并非这一局面的成因，而是其体现出的症状”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【17】"}, {"n": 18, "t": "IMF星期二（10月13日）发布《全球金融稳定报告》点出，人工智能（AI）领域的投资有助弥补中东战争和整体政策环境不明朗构成的经", "b": "布《全球金融稳定报告》点出，人工智能（AI）领域的投资有助弥补中东战争和整体政策环境不明朗构成的经济冲击。但是，如今有“更多证据”显示，建立AI能力或许并不需要如此庞大的投资，潜在的经济利益也或许没有预期中大。\nIMF提醒，超大规模数据中心营运者（hyperscalers）为投资项目进行融资所发行的债券，如今已占全球投资级债券发行量的10%，比2024年高出逾10倍。如果AI领域的盈利或投资接下来趋缓，可能引发相关资产价格的调整，继而外溢到更广泛的市场，“后果可能是全球性的”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【18】"}, {"n": 19, "t": "导火索是《华尔街日报》的爆料：Guilfoyle 在 2025 年 7 月参议院确认听证会前，请求共和党捐赠人 Eric Det", "b": "Guilfoyle 在 2025 年 7 月参议院确认听证会前，请求共和党捐赠人 Eric Deters 向她的美国运通账户汇 10 万美元，帮她还信用卡。据 Deters 提供给媒体的信息，她承诺若收到钱，就做他在“特朗普世界里的 ride or die（生死之交）”，还在 Signal 上写道：“直接汇到美国运通的话，不会出现在任何地方。拜托。”Deters 拒绝了，称当时手头没有流动资金。\n这只是连串报道中的一桩：她还被指接受希腊商界大亨的奢华馈赠（包括飞巴黎的机票和豪华酒店），以及以提供接触政府高官的机会换取金钱。国务院监察长办公室正在调查。她通过律师否认以权谋私，称只是在离任前收回演讲和咨询的应收账款，且遵守了联邦礼品申报规定。\nGuilfoyle 曾是福克斯主播、特朗普长子 Donald Trump Jr. 的未婚妻、加州州长纽森的前妻――这起辞职令这段“准家人”关系画上尴尬句号。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【19】"}, {"n": 21, "t": "@®华尔街日报中文网X.com", "b": "@® 华尔街日报中文网               X.com\n@ChineseWSJ\n12]\n特朗普为何下令在航母上恢复使用蒸汽弹射器?\n一位名叫“比尔.琼斯”的水兵和特朗普的一次交谈\n让他确信，发射战机的旧式技术优于现代方法。\n官员们至今仍在应对这名神秘水兵与总统一次偶\n遇所带来的后果。而据国防官员说，他们始终没\n有找到这个人。\nFrom cn.wsj.com\n8:00 AM - 10/13/26 - 27K Views", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【21】"}, {"n": 24, "t": "泽连斯基：不要攻击我们，不要杀害我们的孩子。我们将停止攻击你们的柴油。我认为这是一个公平的交易。", "b": "害我们的孩子。我们将停止攻击你们的柴油。我认为这是一个公平的交易。 \n泽连斯基表示，乌克兰将在有或没有美国总统唐纳德・特朗普帮助的情况下赢得这场战争。\n我知道许多美国公民不支持他们的总统所做的事情，我敦促那些人继续为乌克兰祈祷，并在这一艰难时期支持我们。\n尽管美国总统选择支持普京――这个对这场战争负有责任的人――我们乌克兰人不会退缩。我们已经遭受了太多苦难，失去了太多生命，牺牲了太多，不能现在放弃。\n我们将继续为我们的自由、我们的国家以及我们的未来而战。无论有无美国的帮助，乌克兰都不会投降。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【24】"}], "tech": [{"n": 5, "t": "然后核心就一句话：\n\r\n【以前整条流水线上有超过600个拣椒工人，现在就保留了48位，负责最后一道经验把关。】\n\r\n用AI把60", "b": "【以前整条流水线上有超过600个拣椒工人，现在就保留了48位，负责最后一道经验把关。】\n\n用AI把600人裁到48人了。裁掉92%。\n\n好日子来了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【5】"}, {"n": 8, "t": "红果短剧日均125分钟登顶，抖音紧随其后120分钟，两个App加起来每天吃掉一个人将近4小时。字节系拿走全网41.8%的时长份额", "b": "音紧随其后120分钟，两个App加起来每天吃掉一个人将近4小时。字节系拿走全网41.8%的时长份额，这个数字太吓人了，快半壁江山了。\n表面上看，这是字节的产品胜利，算法推荐做到了极致，短剧的\"下一集\"钩子设计得无懈可击。但换个角度，一个普通人每天清醒时间大约16小时，光红果加抖音就占去四分之一，再加上微信、快手、视频号、小红书，六个App叠满差不多8小时。也就是说，你醒着的一半时间都交给了手机屏幕。\n更耐人寻味的是红果短剧悄无声息地超越了抖音。短视频至少还有知识区、技能区可以自我安慰\"我在学东西\"，短剧连这层遮羞布都省了，纯粹靠情绪刺激和剧情反转把人钉在屏幕前。当一个免费短剧App能让用户日均停留两个多小时，说明\"注意力收割\"已经进入了一个新阶段：连内容质量都不再重要，只要节奏够快、钩子够密，时间就会被吸走。\n腾讯系跌到28.6%也很有意思。微信作为基础设施级产品，日均才80多分钟，说明大家打开微信越来越像\"处理事务\"，聊完就走。社交关系链曾经是腾讯最深的护城河，如今挡不住算法投喂的多巴胺流。\n说到底，时长份额的争夺战里没有赢家是用户。平台赢了注意力，广告主赢了曝光，用户赢了什么？每天多刷两小时短剧之后，生活有变好吗？这张图与其说是行业格局图，不如说是一张集体时间审计表。看完之后最该做的事，可能恰恰是放下手机。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【8】"}, {"n": 20, "t": "有人偷偷放在办公室进行录音，OpenAI发现后并没有立刻报警，而是让GPT来分析找到是谁放的…", "b": "penAI发现后并没有立刻报警，而是让GPT来分析找到是谁放的…\nGPT分析了这台设备的来源、特征以及可能的获取路径，最终抓到了这名员工！\nOpenAI 随后将其移交给了 FBI，将这名员工逮捕…\n该设备插入电视后部的 USB 端口，并隐藏在卫生纸中。OpenAI 确定该设备大约于 被顾客差评后跳河轻生，引发关注。死者家属向@中国新闻周刊介绍，33岁的", "b": "#近日，四川宜宾高县一女摊主被顾客差评后跳河轻生，引发关注。死者家属向@中国新闻周刊介绍，33岁的胡女士原本在当地摆摊卖炸串炸洋芋，10月6日，她接待了一位女顾客，对方因对菜量不满，在多平台发布差评。\n这位顾客在社交平台上发文称：“避雷某某铜锅洋芋，老板娘玩不起，嫌菜堆高了就不给加土豆。10块钱一份的炸菜，堆得多了就不让夹菜了。我买一份肯定要吃饱啊，玩不起开什么店子呢？后面直接就不给加土豆了，两份都没有加土豆，一脸高傲的样子，搞得好像谁欠你一样。” 随后，在相关贴文评论区出现了大量针对摊主的差评，胡女士曾在评论区回复解释。\n10月13日，胡女士的丈夫告诉@中国新闻周刊，该顾客购买的10元炸菜为自选模式，有20余种菜品任选，装满一筐后，再视情况给顾客添加炸土豆条，“我们是菜（夹）多了土豆就少，（菜）分量特别多的情况下，（土豆条）就加不了，我们都会给客户说的。” 胡女士曾公开表示，提供给该顾客的“两份炸菜份量对得起天地良心”。\n胡女士留下遗言称：“这两天我经历了在我心中的网暴，吃炸菜说没有加土豆，下面一些评论拥上来，有说服务差的，有说味道不好吃的。” 其坦言小摊经营压力大，“我每天睡觉不超过6小时，最后换来这样的避雷视频”。\n其丈夫表示，夫妻二人摆摊4年多以来，已积累了一些老客户，突然蜂拥而至的差评在当地传开了，“可能她心里就有这个包袱了”，家人也一直宽慰胡女士对此事“不要过度在意”。10月9日，胡女士还嘱咐丈夫把新买的土豆放到库房，怎料不久便发生了悲剧。\n10月13日，宜宾高县庆符镇政府工作人员告诉@中国新闻周刊，此事警方正在调查，镇政府配合相关工作。高县公安局政治处工作人员表示，事发后已第一时间处置，目前正在联合处理此事。\n胡女士去世后，有网友转而质疑该顾客言行，其曾在个人社交账号发文回应：“我清楚大家的惋惜与悲痛心情，我同样深感遗憾。但我发布的仅仅是本人真实的消费体验评价，无任何恶意、无任何煽动、无任何捏造事实。我觉得我不该因为一场意外悲剧被无限追责、被全网审判。” 目前，该内容已不可见。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【4】"}, {"n": 5, "t": "湖南省长暗访检查溶洞", "b": "委副书记、省长毛伟明以“四不两\n直\"方式，赴株洲市暗访检查溶洞污\n染问题排查整治和安全生产工作\nae KMS O\n省长暗访溶洞，随机拨打管护责任人\n电话", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【5】"}, {"n": 6, "t": "内地为什么要传这样的假消息", "b": "am730 @ .关注\nPe 1小时 .四\n李嘉诚最新一张露面照片，精神饱满思吏电动代步避\nNy\n#李嘉诚 #长和 #am730", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【6】"}, {"n": 7, "t": "受害者从8月开始出现手指麻木、双腿无力、失眠等症状，并发现办公室咖啡机冲泡的茶水味道异常。其妻子和大学教授随后展开调查，从咖啡机", "b": "双腿无力、失眠等症状，并发现办公室咖啡机冲泡的茶水味道异常。其妻子和大学教授随后展开调查，从咖啡机残留水中提取出63毫克含有丙烯酰胺的白色粉末。\n警方安装监控后发现，Wang曾翻动受害者办公桌、逐页拍摄其研究笔记，并用自己杯中的液体冲洗对方的杯子。调查还发现，Wang涉嫌去年夏天两次通过eBay购买丙烯酰胺，事后要求平台删除账户。\n受害者正在研究利用细菌将RNA送入人体细胞的新技术，涉及癌症、神经系统疾病和遗传疾病治疗，相关成果正在申请专利。指导教授Mark Gomelsky表示，Wang此前博士论文答辩失败，可能因此嫉妒成绩优异的受害者。\n10月5日，Wang接受警方询问，声称自己多年未使用丙烯酰胺。次日，她在洛杉矶国际机场准备返回中国时被捕，随身携带多台笔记本电脑、外置存储设备及研究文件。\nWang目前面临最高10年监禁及1万美元罚款，怀俄明州法官已将保释金提高至150万美元。受害者目前仍有左手失去知觉、注意力难以集中、容易疲劳等神经损伤症状，能否完全康复尚不确定。\n另外，目前没有证据证实Wang投毒的目的是窃取研究成果，嫉妒或科研竞争也尚未被司法机关认定为作案动机。相关指控仍有待法院审理。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【7】"}, {"n": 9, "t": "风险解除", "b": "我们中出了一个叛徒", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【9】"}, {"n": 18, "t": "由于厄尔尼诺现象导致河水暴涨，恐有泛滥的风险，阿根廷当局周一（10月12日）临时关闭了游客前往伊瓜苏瀑布（Iguazu Fall", "b": "恐有泛滥的风险，阿根廷当局周一（10月12日）临时关闭了游客前往伊瓜苏瀑布（Iguazu Falls）的通道。\n伊瓜苏国家公园说，周一伊瓜苏河流量破每秒1万2000立方米，达到正常平均流量的六倍以上。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【18】"}, {"n": 25, "t": "Apple Watch国行可以开通睡眠呼吸暂停了", "b": "可能出现睡眠\n呼吸暂停", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【25】"}], "intl": [{"n": 10, "t": "海事官员星期三（10月14日）证实，过去24小时内，两艘商船在霍尔木兹海峡附近遭弹体击中后沉没。随着近10天来这个关键水道的袭击", "b": "证实，过去24小时内，两艘商船在霍尔木兹海峡附近遭弹体击中后沉没。随着近10天来这个关键水道的袭击事件剧增，全球能源与航运安全再度引发高度担忧。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【10】"}, {"n": 11, "t": "伊朗据称正采用新战术来打击途经霍尔木兹海峡的船只，目标是让油价继续高企，从而打击美国总统特朗普和共和党在11月初中期选举的的选情", "b": "霍尔木兹海峡的船只，目标是让油价继续高企，从而打击美国总统特朗普和共和党在11月初中期选举的的选情。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【11】"}, {"n": 12, "t": "星链的使用，突然增加限制，乌军事先没有得到任何通知\n\r\n不能进攻、不能预警，而俄军已连续两天加紧摧毁乌能源设施\n\r\n乌克兰全社会", "b": "事先没有得到任何通知\n\n不能进攻、不能预警，而俄军已连续两天加紧摧毁乌能源设施\n\n乌克兰全社会的情绪是沮丧和愤怒，普遍认为这是Trump政府通过切断情报和星链，逼迫乌投降 \n乌克兰总统科技顾问称，美国科技巨头马斯克的SpaceX公司，在没有预告的情况下对处于移动状态的“星链”（Starlink）终端进行了网速限制，导致乌军多项军事任务中断，对俄罗斯空袭的防御能力降低。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【12】"}, {"n": 13, "t": "美国联邦检察官说，当局破获一个涉嫌利用虚假身份，让朝鲜人在美国企业从事远程资讯科技工作非法牟利的计划，两人遭逮捕，并查扣超过18", "b": "涉嫌利用虚假身份，让朝鲜人在美国企业从事远程资讯科技工作非法牟利的计划，两人遭逮捕，并查扣超过180台电脑。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【13】"}, {"n": 14, "t": "特朗普星期三（10月14日）在社媒发文说，格陵兰岛正准备展开“大规模”油气及矿产勘探。不过，他没有透露勘探计划的具体细节。", "b": "社媒发文说，格陵兰岛正准备展开“大规模”油气及矿产勘探。不过，他没有透露勘探计划的具体细节。\n他声称：“有专家指出，格陵兰岛容易开采的石油资源，远远超过世界上几乎任何其他地方。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【14】"}, {"n": 15, "t": "美国国会中期选举逼近，尽管预测显示共和党在众议院的选情比参议院严峻，但美国总统特朗普承认，共和党要保住参众两院控制权所面临的挑战", "b": "显示共和党在众议院的选情比参议院严峻，但美国总统特朗普承认，共和党要保住参众两院控制权所面临的挑战同样艰巨。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【15】"}, {"n": 16, "t": "美国联邦地区法官凯利（Timothy Kelly）星期二（10月13日）颁布“初步禁令”（preliminary injunct", "b": "thy Kelly）星期二（10月13日）颁布“初步禁令”（preliminary injunction）裁决，延续他9月24日发出的紧急命令，允许CNN、MS NOW和政治新闻网站Politico的记者继续进入白宫采访，直至法院作出最终裁决，除非上诉法院推翻禁令。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【16】"}, {"n": 17, "t": "“我不怀念欧洲的俄罗斯坦克。”", "b": "她呼吁继续支持乌克兰，并警告说，乌克兰的投降不会带来和平，而是会导致领土占领和苏联帝国主义的回归。\n“投降不是和平。\n“我不怀念那些碾压布拉格和布达佩斯起义的俄罗斯坦克。\n“我也不怀念柏林墙，”\n她的话语赢得了议院长时间的掌声。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【17】"}, {"n": 20, "t": "法国卢浮宫博物馆馆长警告，如果无法获得足够的资金对这座设施老旧且超负荷运转的博物馆进行全面翻修升级，卢浮宫将面临不得不向公众关闭", "b": "无法获得足够的资金对这座设施老旧且超负荷运转的博物馆进行全面翻修升级，卢浮宫将面临不得不向公众关闭的风险。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【20】"}, {"n": 23, "t": "根据 \u003c华尔街日报> 今天报道，Zacharia于2011年毕业于美国Pepperdine University法学院，随后参加", "b": "Zacharia于2011年毕业于美国Pepperdine University法学院，随后参加加利福尼亚州律师资格考试，但未能通过。同年夏天，她随丈夫前往中国北京，在知名的中伦律师事务所国际业务部门工作，主要参与跨境交易协议起草及客户沟通。\n尽管没有查到她在美国取得律师执照的记录，Zacharia多年来仍在Fox News等电视节目中自称律师，还曾担任川普盟友Richard Grenell创办的非营利组织Fix California的总法律顾问。川普宣布任命她为白宫新闻秘书时，也明确称她是一名律师。\n10月13日，记者追问她究竟在哪个州通过律师资格考试，Zacharia却回答：“我搬到中国的时候。”她随后强调，自己曾具备适当资格从事国际交易法律业务。\n知情人士解释，Zacharia在中伦的工作属于国际法律顾问性质，不需要取得中国或美国律师执照，正式法律意见由中国执业律师负责。白宫则强调，她并非受聘处理法律事务，并力挺其专业能力。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【23】"}, {"n": 27, "t": "我被伊朗的书店给震撼到了，什叶派穆斯林也在阅读中国耽美文学，还有各种全球最热的lgbtq+作品，包括诸如《天官赐福》《魔道祖师》", "b": "派穆斯林也在阅读中国耽美文学，还有各种全球最热的lgbtq+作品，包括诸如《天官赐福》《魔道祖师》《The Long Game》之类的，从英国少年纯爱，到美国冰球男男，再到中国古风耽美。在同性性行为违法的伊朗，墨香铜臭的男男爱情小说正堂而皇之地摆在街头书架上。\n@雷韵ly:是的，我们经常觉得如果一个政府限制某些自由，那么生活在那个社会的人们也必然至少内化了这些限制。但人有私密的思想和欲望，这些东西是不可能整齐划一地排列在某些意识形态之下的。书籍，幻想，好奇心，私下的反叛，还有与遥远世界的相遇，所有这一切都塑造着人的内心世界。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【27】"}], "tech": [{"n": 1, "t": "知情人士透露，首批上线的功能包含 Genmoji 自定义表情、通知摘要、写作工具以及从照片中移除特定元素等功能，即坊间俗称的「跑", "b": "含 Genmoji 自定义表情、通知摘要、写作工具以及从照片中移除特定元素等功能，即坊间俗称的「跑马灯」版本，而非 WWDC26 中发布的 Siri AI。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【1】"}, {"n": 2, "t": "一个国际研究团队发现，疑似来自中国的失控人工智能（AI）代理从腾讯云沙盒环境中越狱，试图入侵阿里旗下高德地图的系统，进一步加剧了", "b": "中国的失控人工智能（AI）代理从腾讯云沙盒环境中越狱，试图入侵阿里旗下高德地图的系统，进一步加剧了外界对于科技公司可能失去对AI控制的担忧。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【2】"}, {"n": 21, "t": "微软 XBOX 反应还挺快，看到最近大量逆向游戏的案例，就选择了拥抱，成立 XBOX LABS，一个由游戏创作者、工程师和科学家", "b": "ASHA®                                                             Gos\n@asha shar\n人 翻译自英语         ©\n今天我们将成立XBOX LABS (             ) 。以下是我发给团队的备忘\n录:\nBB,\n第一款电子游戏诞生于大约 75 年前。从那时起，行业经历了繁荣与低谷，\n但每年都有更多优秀的游戏可玩、更多设备可供游玩，最重要的是，玩家人\n数比以往任何时候都要多。这种增长帮助 XBOX 成就了今天的模样，而我们\n也反过来塑造了这个行业，从将硬盘引入游戏机和通过 Xbox Live 实现在线\n游戏，到 Game Pass 和云游戏，再到那些将数百万玩家聚在一起的系列作\n品。\n最近几周，我们看到游戏被迅速反编译并重建，以运行在原本从未设计支持\n的硬件上。Windows PC 版本已被移植到 Apple Silicon 上运行，或通过\nWebAssembly 和 WebGPU 移植到浏览器中运行，后者如今已接近全球\n90% 的浏览器支持。或许更令人惊讶的是，我们看到世界上许多最受欢迎\n的游戏已被改编成另一个游戏的源代码。\n这些实验挑战了我们行业长期以来的假设: 软件与硬件之间的束缚、创作与\n游玩之间的界限，以及人们发现和体验游戏的方式。虽然很难预测游戏的未\n来，但很容易看到让优秀游戏更容", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【21】"}, {"n": 22, "t": "美国八个州组成的跨党派联盟星期三（10月14日）向全国多地法院对OpenAI发起联合诉讼，指控OpenAI旗下的生成式人工智能（", "b": "三（10月14日）向全国多地法院对OpenAI发起联合诉讼，指控OpenAI旗下的生成式人工智能（AI）程序ChatGPT给当地居民造成实际伤害，甚至诱导包括青少年在内的用户自残或伤害他人。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【22】"}, {"n": 24, "t": "别慌，别人更惨", "b": "11:30\n《\nGey 11:26\n5)\n5\n大小    eee\n韩股暴跌8% 今年以来第十次触发熔\n断机制\n格隆汇10月15日 | 韩国KOSPI指数跌超8%触发熔\n断机制，交易暂停20分钟。这是韩国股市今年以\n来第十次触发熔断机制。\n自选~\n8 回 KOSDAQ Kosdaq Composite Index 757.81 -8.02%     a\nae se ac sm [ema -) 1 mR\nau\nom\n韩国综合指数\nKOSPI200 index\nosra00\njoe          Mi\neg            we\n=.             Ws\nONS\nPed\n2026-10-15\n一 te\nse\n外\nHowden compo\n\\\n最折价 购的。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【16】"}], "soc": [{"n": 1, "t": "世界卫生组织专家建议，在有助于提高接种率的前提下，各国可考虑为低至4岁的女童开展人乳头瘤病毒（HPV）疫苗常规接种。", "b": "提高接种率的前提下，各国可考虑为低至4岁的女童开展人乳头瘤病毒（HPV）疫苗常规接种。\n根据世卫免疫战略咨询专家组（SAGE）主席斯科特，目前约有165个国家将HPV疫苗纳入国家免疫规划，但全球HPV疫苗接种率仅为33%，远低于90%的目标。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【1】"}, {"n": 2, "t": "据央视新闻，针对网络反映的“尊界V800汽车刹车踏板支架断裂问题”，工业和信息化部、中央网信办、市场监管总局高度重视，在前期调查", "b": "界V800汽车刹车踏板支架断裂问题”，工业和信息化部、中央网信办、市场监管总局高度重视，在前期调查工作基础上，成立联合调查组开展核查，并依法依规处理。有关情况将及时公布。\n余承东就“联合调查”表态：正义可能会迟到，但永远不会缺席", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【2】"}, {"n": 4, "t": "“七千多名退休职工，一年领走九亿元养老金”。近日，一组关于武汉大学离退休教职工人数及养老金总额在互联网上不胫而走，并引发热议。", "b": "亿元养老金”。近日，一组关于武汉大学离退休教职工人数及养老金总额在互联网上不胫而走，并引发热议。\n这组数据并非由武汉大学官方披露，而是自媒体结合该校退休人员人数，乘以平均每名退休人员每月1万元，再乘以12个月得出的年度总额。\n经财新核实，武汉大学离退休教职工人数有“七千多名”属实。据武汉大学离退休工作处2025年1月的消息，目前学校共有离退休教职工7424名。而“九亿元养老金”没有得到官方证实。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【4】"}, {"n": 5, "t": "来源:天河报四川日报", "b": "来源:天河报四川日报\n成都市市场监管局通报时配制酒中非法添庆两地那\n该成分功能类似 “PEEP, WBS 252.0857 EK...\nSib ath alee a oe oe Oo\n838 4481    447     291\n@ @庄时利和", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【5】"}, {"n": 18, "t": "再也不怕刹车踩断了", "b": "#Roadster 量产#网友鬼才啊", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【18】"}, {"n": 19, "t": "别这样算，再算下去，人类连唯一的节能优势都没了", "b": "& David @ @DavidSHolz .14小时                                   Bw\n人 翻译自英语 显示原文\n假设一个前沿模型是 GB300 NVL72 上的 10T MoE。那大约是每 token 5 焦\n耳，或者在人类思考速度下约 50 W，而我们的大脑是 20 W。电网的能源成本\n是 0.08 美元/千瓦时，吃米饭是 0.50 美元/千瓦时。所以从每思想的能源角度\n来看，目前我们和前沿模型竟然出奇地相似!\nO24          也145          @ 1,943        ha 145         As\n| Elon Musk @ BE Gm\n» @elonmusk\nO 翻译自英语 显示原文 ©\n有趣\n评价此翻译: © OD\n上午10:08 . 20264F10 A128 -7.45 查看", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【19】"}], "intl": [{"n": 6, "t": "2026年全球AI净利润约6370亿美元，其中，约3140亿美元流向美国，占比49%;2230亿美元流向韩国，占比35%;470", "b": "70亿美元，其中，约3140亿美元流向美国，占比49%;2230亿美元流向韩国，占比35%;470亿美元流向中国台湾，占比7.4%;260亿美元流向中国大陆，占比4.1%;142亿美元流向日本，占比2.2%;137亿美元流向欧洲，占比2.1%。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【6】"}, {"n": 8, "t": "多名#美国#及西方官员称，限制#乌克兰#在战场通信与无人机作战中使用的星盾（Starshield）卫星系统，相关指令直接来自美国", "b": "#乌克兰#在战场通信与无人机作战中使用的星盾（Starshield）卫星系统，相关指令直接来自美国白宫内部。\n\n路透社引述消息人士报道，美国战争部领导层此前收到通知，要求调慢面向乌克兰战区的星盾服务速度。\n\n消息人士没有说明白宫内由谁作出决定，也未透露由谁负责执行。美国战争部是星盾服务的最大客户。相关限制影响了乌军的#无人机#作战及前线行动。\nFoxNews首席国家安全记者报道：\n🛰️ Musk不承认“乌军使用星链，突然受限”与自己有任何关系，称“国防部的账号，由他们控制”\n美国、乌克兰官员已确认：没有继续受限，速度正在恢复\n路透社独家报道： 要求限制使用的命令，来自白宫，由国防部执行 \n乌军星链遭限速，美共和党议员警告：若政府机构参与，将削减其经费\n据《华尔街日报》10月14日报道，美国共和党籍众议员布莱恩・菲茨帕特里克警告，如果查明是美国政府限制了乌克兰军方的卫星通信，国会将采取行动，包括削减相关联邦机构的经费。他说，这是\"一个大问题\"，\"如果我们开始让乌克兰断联，必有后果，记住我的话\"，\"机构不履行职责，就别想拿到经费\"。\n\n乌方称，10月13日至14日，乌军使用的军用版星链终端\"星盾\"在毫无预警的情况下被设置了速度上限：终端移动速度超过约160公里/小时，连接就会中断。中程打击无人机和拦截无人机首当其冲，乌克兰总统办公室顾问别斯克列斯特诺夫称，\"多项任务因此失败\"。\n\n乌克兰驻美国大使馆临时代办西耶尼克当天紧急致信美国国会议员，警告这将让俄罗斯占据优势，也会削弱乌方拦截俄军对平民空袭的能力。当天晚间服务趋于稳定，但速度上限仍在。乌克兰国防部表示，正与合作伙伴和SpaceX谈判，以避免再出现突然限制。\n\n谁下令限速，目前没有定论。马斯克在社交平台X上表示，\"星盾\"归美国政府所有和控制，\"任何速度或使用限制都由美军、最终由总统决定\"。白宫拒绝回答相关问题，SpaceX不予置评，克里姆林宫称不掌握相关情况。\n\n乌方多名人士认为，这与特朗普要求基辅停止打击俄罗斯炼油厂有关。乌克兰议会外事委员会主席梅列日科称，此举\"看起来像是在勒索\"；但乌方没有提供直接证据。\n\n10月14日，众议院跨党派\"乌克兰党团\"的四位联合主席，民主党籍的卡普特、奎格利和共和党籍的菲茨帕特里克、威尔逊，联名对美方可能停止对乌情报共享并限制星链的报道表示\"深切关注\"。菲茨帕特里克此前还表示，将推动众议院强制表决，阻止购买俄罗斯石油。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【8】"}, {"n": 9, "t": "#乌克兰#与重要盟友#美国#再现裂痕，乌总统#泽连斯基#已下令恢复对#俄罗斯#炼油厂的打击行动，结束应美国总统#特朗普#呼吁而实", "b": "现裂痕，乌总统#泽连斯基#已下令恢复对#俄罗斯#炼油厂的打击行动，结束应美国总统#特朗普#呼吁而实施的“能源停火”。\n【乌克兰据报耗尽“爱国者”拦截弹 防空能力告急】知情人士称，#乌克兰#军方手中的美制“爱国者”防空拦截导弹已彻底耗尽。在俄军最新一轮弹道导弹袭击中，因缺乏拦截弹，几乎所有导弹均突防成功，乌克兰防空防线严重告急。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【9】"}, {"n": 10, "t": "美国有线电视新闻网（CNN）周四（10月15日）引述#美国#官员的话报道，美军已制定攻击伊朗的计划，一旦总统#特朗普#下令重启战", "b": "四（10月15日）引述#美国#官员的话报道，美军已制定攻击伊朗的计划，一旦总统#特朗普#下令重启战斗，可能动用包括俗称炸弹之母 191#:~:text=【21】"}, {"n": 22, "t": "据英媒10月16日披露，乌克兰军用SpaceX网络服务“星盾”本周遭限速，这一命令来自白宫内部。", "b": "军用SpaceX网络服务“星盾”本周遭限速，这一命令来自白宫内部。\n16日被问及此事时，特朗普回应称：“我不知道是不是有人这么做，因为不是我，我也不认为是马斯克。据我了解，一切都和以前一样。”\n英国媒体爆料：Musk将“限制乌军使用星链”的决策，推卸给白宫和国防部，但实际上，“用减速的方法抑制乌军”这个建议，最早是Musk主动向Trump提出的 \n继上周末特朗普总统表示“乌克兰需要一名新总统”之后，科技巨头马斯克也在他自己的X账号写下“泽连斯基到了该走人的时候”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196191#:~:text=【22】"}, {"n": 23, "t": "白宫官方账号", "b": "The White House @\nHus @WhiteHouse\n& Grok 翻译自英语\n我们真的在《GTA 6》 之前就有了飞行汽车\n评价此翻译: 只 名", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196191#:~:text=【23】"}, {"n": 26, "t": "众院领袖：2018，我们拿到多数，就是翻蓝很多2016Trump赢的区，今年也一样能做到", "b": "数，就是翻蓝很多2016Trump赢的区，今年也一样能做到\n正在准备“上任一百天计划”：恢复医保补贴、停止伊朗战争、取消新征关税、调查政府行为…不排除弹劾总统 \n@猪蹄蹄pro", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196191#:~:text=【26】"}], "tech": [{"n": 18, "t": "#美联储#主席沃什（Kevin Warsh）说，#人工智能#（#AI#）是他有生之年所见对全球及美国经济影响最深远的变革。他预测", "b": "Warsh）说，#人工智能#（#AI#）是他有生之年所见对全球及美国经济影响最深远的变革。他预测AI长远来看将带来巨大益处，但通往未来的道路将充满颠簸。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196191#:~:text=【18】"}], "cult": []}}, {"date": "20261018", "label": "10月18日", "week": "周日", "id": "196199", "title": "社保服务进万家", "cats": {"econ": [{"n": 1, "t": "2023年7月一揽子化债措施推出后，城投债“网红城市”柳州所在的广西是12个化债重点省份之一，也是第一个申请央行应急流动性贷款工", "b": "出后，城投债“网红城市”柳州所在的广西是12个化债重点省份之一，也是第一个申请央行应急流动性贷款工具的省份。近日官方披露，2025年柳州债务规模较2023年底下降18%，柳州是如何化债的？\n2024年9月至2025年10月担任柳州市委书记的广西自治区统战部部长谭丕创，近日在《学习与研究》杂志上撰文称，柳州市穷尽一切手段、排除一切困难化解债务风险，毫不手软打击金融犯罪，一体推动市本级债务、市属融资平台金融债务规模和平均利率持续下降，债券、非标规模持续压减。据他披露，2025年柳州债务规模较2023年底下降18%，金融市场对柳州的信心不断提升。\n“很多地方政府都有债务，如果负债规模与当地经济发展、财力水平相匹配，能正常还债的，债务风险就在可控范围内。” 谭丕创称，化解债务风险，不是一下子把债务还清，而是要透过现象看本质，精准找出风险点，分类施策、靶向排雷，确保风险发现在早、处置在小，牢牢掌握化债工作主动权。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【1】"}, {"n": 2, "t": "“社保服务进万家”从口号到行动！", "b": "粤TV 报道：汕头公交改造为社保服务站，制服女工作人员在车厢内讲解，画面字幕“从人找政策变成政策找人”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:t 统星期五签署一项行政命令，豁免多项原定未来几天生效的对俄制裁和关税措施。特朗普在行政命令中称，豁免这些措施符合美国的国家利益。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【12】"}, {"n": 13, "t": "美国中央司令部声称，伊朗经历九个月的战争和美国的经济封锁后已陷入财务困顿，长期获德黑兰支持的黎巴嫩真主党、加沙地带哈马斯和伊拉克", "b": "个月的战争和美国的经济封锁后已陷入财务困顿，长期获德黑兰支持的黎巴嫩真主党、加沙地带哈马斯和伊拉克什叶派民兵等代理人组织，如今甚至须要反向汇款，救济以往的金主。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【13】"}, {"n": 14, "t": "乌克兰总统泽连斯基说，美国总统特朗普在制裁和对俄罗斯商品征收关税原定生效前几天，就决定豁免相关措施，将助长莫斯科继续攻击乌克兰，", "b": "特朗普在制裁和对俄罗斯商品征收关税原定生效前几天，就决定豁免相关措施，将助长莫斯科继续攻击乌克兰，并担心美国接下来可能进一步放宽对俄制裁。\n泽连斯基说，特朗普最新的决定助长俄罗斯总统普京的气焰。“这只会让他们更加得意，更加想继续杀人。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【14】"}, {"n": 15, "t": "据《纽约时报》报道，南卡罗来纳州共和党参议员达琳・格雷厄姆周六谨慎地批评特朗普，称其将俄罗斯排除在制裁法之外。该制裁法由她已故的", "b": "州共和党参议员达琳・格雷厄姆周六谨慎地批评特朗普，称其将俄罗斯排除在制裁法之外。该制裁法由她已故的哥哥林赛倡导并以他的名字命名。\n\n格雷厄姆女士在一次竞选活动中告诉记者：“就我个人而言，我会选择向俄罗斯施压，要求其结束战争并降低汽油价格。因为我不信任普京，也不信任俄罗斯。”\n\n这使达琳与特朗普短暂决裂，可能会让她陷入尴尬的境地。达琳于7月被任命接替去世的哥哥，而她正在总统的支持下竞选完整任期。\n\n达琳担任参议员时间不长，立法记录不多。但她将自己在制裁方案中的作用视为自己最重要的成就之一。\n\n“我为《林赛・格雷厄姆制裁俄罗斯和伊朗法案》的通过感到无比自豪，”达琳本周在一次辩论中说道。“该法案赋予总统一些工具，如果他选择通过经济制裁来结束战争，就可以使用这些工具。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【15】"}, {"n": 16, "t": "美国财政部星期五（10月16日）公布的数据显示，尽管总统特朗普曾承诺削减政府开支，但美国2026财年的预算赤字总额扩大至1.99", "b": "）公布的数据显示，尽管总统特朗普曾承诺削减政府开支，但美国2026财年的预算赤字总额扩大至1.99万亿美元，较前一年的1.78万亿美元增加12%，创下自2021年以来的最高纪录。\n推高支出的一个主要原因是美国政府负债沉重导致利息负担飙升。美国政府今年8月债务总额突破40万亿美元，导致过去一个财年支付的债务利息剧增1440亿美元，达到创纪录的1.36万亿美元。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【16】"}, {"n": 19, "t": "我认为，从根本上说，他是一个关心他所理解的俄罗斯利益的人。他尊重总统的一个原因是，他认识到总统关心美国人民的利益。”", "b": "心他所理解的俄罗斯利益的人。他尊重总统的一个原因是，他认识到总统关心美国人民的利益。”\n最新消息： 尽管特朗普到处鼓吹赞美美国经济，称其为“黄金时代”，但副总统JD Vance还是承认美国经济正在恶化：\n“虽然这个国家并没有在两年内崩溃。但是我们现在确实很艰难。\n尽管我很想把一切都归咎于拜登，但现实是，巨额债务压力(40万亿美元)，巨额利息负担(年度利息支出约 1万亿至1.36万亿美元)，巨额财政赤字(2万亿美元)。表明我们正深陷泥潭，举步维艰。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【19】"}, {"n": 25, "t": "美国媒体现在有报道说，川普打算近期开除赫格塞思，让他背发动伊朗战争的黑锅", "b": "近期开除赫格塞思，让他背发动伊朗战争的黑锅", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【25】"}, {"n": 26, "t": "美国还是不是“为了自由、不惜代价”？", "b": "价”？\n我们是否已把权钱置于自由之上？\n俄乌之间的选择，给出最清晰的答案\n抛弃乌克兰，就是抛弃自由\n最终，我们自己的自由，也会失去", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【26】"}], "tech": [{"n": 4, "t": "事实上，陈广宇的第一次出圈发生在今年3月。当时，月之暗面Kimi发布技术报告《Attention Residuals》，对大模型", "b": "在今年3月。当时，月之暗面Kimi发布技术报告《Attention Residuals》，对大模型十年没有变化的核心结构残差连接行重新设计，这实现了OpenAI联合创始人Ilya Sutskever曾提出过的设想：把按时间先后顺序处理数据的LSTM网络“旋转90度”。用了这套新方法后，模型在计算时根据需要，自由决定去提取前面哪一层的信息。\n论文发出后，马斯克马上点评“让人印象深刻”，前OpenAI研究科学家Andrej Karpathy表示该研究真正践行了“Attention is All You Need”的理念，推理之父、前OpenAI研究副总裁Jerry Tworek也表示“深度学习2.0来了”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【4】"}, {"n": 11, "t": "13万买的比特币，现在6万了", "b": "13万买的比特币，现在6万了。\n1200的黄金，现在800了。\n32买的白银，现在14了。\n130万买的楼房， ESOS To Gay\n50万买的BBA，现在20多了。\n只有20多娶的老婆，现在0考\n了 3                                                  681\n@\n217\n2026 @ 10/15 © Thu                    te\n念@卢旭宁                          53", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【11】"}, {"n": 18, "t": "印尼气象、气候与地球物理局高级官员古斯万托星期五（10月16日）说，卫星图像显示，笼罩加里曼丹和苏门答腊的烟霾已蔓延至万丹省、西", "b": "官员古斯万托星期五（10月16日）说，卫星图像显示，笼罩加里曼丹和苏门答腊的烟霾已蔓延至万丹省、西爪哇省和雅加达，但尚不清楚这些烟雾是否已对地面空气质量造成影响。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【18】"}], "cult": [{"n": 8, "t": "张水华夺西安马拉松冠军，她以突破“230”的成绩，打破赛会纪录，奖金10万元", "b": "他打破了两小时30分大关的天线 *\n@张水华 - 21分钟前                             \u003c\n西马夺冠! 刷新个人PB，打破西马赛会纪录。        &\n421952, PoE, GeReek.. RAY", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【8】"}, {"n": 24, "t": "纳指10040年历史数据核查", "b": "纳指100 40年历史数据核查\n过去40年，纳指每年最大跌多少?\n以每个自然年的日收盘价计算“妖值 随后谷值\"的最大回向\n1966—2025 | SERNA}, THESE ere\n1986\n-18.0%\n12.0%\n2003                             2005\n-13.1% 4 人赞同了该回答 》                        A3 Amit\n“先生您好，您这边消费1.8w。”\n“不是，我就吃了碗有子面”\n“是的先生，上一桌消费了17988 ，但是他\n们逃单\n7", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【11】"}, {"n": 20, "t": "斯里兰卡能源部长卡鲁纳蒂拉卡（Anura Karunathilaka）说，这场大停电的具体原因仍在调查中，但工程师怀疑，太阳能发", "b": "Anura Karunathilaka）说，这场大停电的具体原因仍在调查中，但工程师怀疑，太阳能发电量可能超出了当时的实际用电需求，导致电网失衡跳闸。\n当局当天多次呼吁屋顶太阳能系统业主，切断系统与电网的连接以协助稳定电网后，供电系统才得以恢复运作。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【20】"}, {"n": 27, "t": "就叫熊太行也行", "b": "这就是《我的大叔》里那个胡同的大叔们，过去都是大企业的部长，现在都在干保洁、小吃店、送货……只有踢球的时候才能凑起来叙旧。还宽慰主角家老太太说，上大学带来的工作只有二十年，大家都一样，早晚都要干体力活的。 \n \n \n四个一线城市新房售价同比下降0.5%，北京数据拖累明显，新房售价跌2.7%。广州和深圳分别降1.1%和1.0%，上海上涨2.8%。二手房北京降幅达到2.5%，广州和深圳分别下降2.9%和1.5%，上海上涨0.8%。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【27】"}], "soc": [{"n": 3, "t": "10月15日，中朝新鸭绿江大桥正式开通。", "b": "中朝新鸭绿江大桥开通仪式现场：白色桥塔拉索、红毯列队，大屏显示中朝国旗，2024年10月15日。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【3】"}, {"n": 5, "t": "山东一“仙人跳”团伙被诉：", "b": "山东一“仙人跳”团伙被诉: 女局长被敲诈\n19万，三受害人曾被采取刑事措施\nagg Sa\n一个以00\"后为主要成员、包括多名在校大学生在内的犯罪团伙 ，在短短一年多时间\n内，先后实施\"仙人跳'38起，吉诈得手155万余元。其中，有三人因识破敲诈拒不支\n付钱款 “仙人跳'团伙成员报警后，该三名受害人被采取刑事强制措施。\n山东省泰安市泰山区检察院起诉书显示 ,为加强对成员的控制，生于2001年的主犯\n陈某在敲诈得款后，!以洗钱 为由将犯罪所得资金集中统一支配。同时，陈某还伙同\n他人向部分成员提供\"放贷 或\"借款”，以此捆绑并驱使该部分成员持续实施犯罪。\n期间，陈某为成员支付住宿、餐饮、整容、酒吧消费等费用，展示其经济实力\n达到激励与控制成员的双重目的，逐步形成以陈某为纠集者的13人恶势力犯\n伙。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【5】"}, {"n": 8, "t": "10月14日报道，安徽合肥，人大本科、港中文硕士，在北京媒体和大厂拿过20万元年薪，罗颖（化名）辞职回合肥，考编上岸成了一所大专", "b": "大本科、港中文硕士，在北京媒体和大厂拿过20万元年薪，罗颖（化名）辞职回合肥，考编上岸成了一所大专的老师，到手月薪九千元。她把自己的经历发到社交账号，评论两极分化。罗颖告诉@九派新闻，她觉得大家可能过度强调了学历的重要性，它也许会是工作的敲门砖，但它只能保证人生的下限，“你有一个不错的学历，就可能拥有更多的机会、平台、资源，大概率不会过得太差，而最终的路怎么走，走得多远，还是看自己的选择和个人能力。”学历终究只是学习能力的证明，不能定义全部。”罗颖说，自己经历过媒体、大厂，最后选择做老师，“这不是‘退而求其次’或者‘想通了要躺平’，是在试过很多种可能性之后，找到的一条适合自己且让我有热情的道路。”她表示，这份工作有劣势，最明显的是薪资，其次是人际关系比企业要复杂，但优势也是实实在在的：稳定、有寒暑假、有自己的时间、工作的意义更清晰。她表示，考了什么大学就应该去找一个什么类型的工作，这是社会对人们的期待，最重要的是要问清自己的答案，知道自己内心真正想要什么，这需要有稳定的内核。遵从内心的想法，然后对自己的选择负责。\n \n罗颖坦言，在北京有一种感觉，「那么多灯火亮着，我始终不属于这里。」", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【8】"}, {"n": 10, "t": "警方提示", "b": "警方 提示\n凡是让你\"先交钱、后返利”的，都是\n诈骗。\n乌鲁木齐公安 @\n“先交钱、后返利”? 都是诈骗!", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【10】"}, {"n": 19, "t": "加州在上个月首次记录到长鳍大眼鲷（longfin bigeye），也首次迎来海龟筑巢产卵。而黄腹海蛇、鲸鲨、双髻鲨、飞鱼和蝠鲼等", "b": "鲷（longfin bigeye），也首次迎来海龟筑巢产卵。而黄腹海蛇、鲸鲨、双髻鲨、飞鱼和蝠鲼等热带海洋生物也在近海现身。在无人机和影像技术的普及下，加州海岸线正上演着一场日益清晰且令人惊叹的视觉盛宴。\n每隔数年发生一次的厄尔尼诺现象，将温暖的海水推向更北的水域，并随之带去热带物种。而在厄尔尼诺到来之前，加州也刚刚经历了持续的海洋热浪，以及一连串的东太平洋飓风。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【19】"}, {"n": 21, "t": "兽爷", "b": "欧式古典石质建筑夜间大火：塔楼倾斜坍塌、浓烟火焰冲天，多名 POLICE 警察背对镜头现场处置。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【21】"}, {"n": 26, "t": "“个人是养老第一责任人”，看到有的地方上在舆论场上这样宣扬，我觉得不合适。至少效果是不好的。\n\r\n养老当然首先是个人的事，是家庭", "b": "有的地方上在舆论场上这样宣扬，我觉得不合适。至少效果是不好的。\n\n养老当然首先是个人的事，是家庭的事，这是常识，不用教育大家就懂，中国人对此尤其懂。但国家和社会也有责任，特别是中国曾长期计划生育，当年一些地方还打出过“只生一个好，国家来养老”的宣传口号。事实上，面对中国步入老龄社会，国家和社会都在做出帮助少子独子老人安享晚年生活的巨大努力，比如很多城市大一点的社区都办起了社区食堂，政府有补助，食堂饭菜非常便宜，可以加很少的钱往家里送餐，帮助缓解了很多老人的吃饭问题，多数社区还主要针对老人不定期举办活动。这些都是实实在在的努力和帮助。我相信，山东各地也做了很多这样的工作。\n\n但是有的地方上发这样的视频，很生硬，让人感觉像是要甩责任，这与各地政府和社会的实际做法也不一致。不知道视频展现的发布会是否也说了很多其他的话，但做这样的切片拿到互联网上播放，给人的观感方向挺不舒服的，而且没有反映出当前社会围绕养老共同做出的努力。我怀疑，这是地方上小编缺少经验的发布会切片作品。\n各地还是应该在舆论场上多强调政府和社会组织对居民养老应当开展的工作，包括兜底的保障工作。这会给人温暖和踏实感。放心，中国老百姓不会真在养老问题上什么依赖官方组织的，大家都知道：更多得靠自己。\n \n \n“只生一个好，国家来养老”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【26】"}], "intl": [{"n": 12, "t": "法国多地星期六（10月17日）爆发大规模示威，原本数十万人举行和平参与游行，抗议生活成本持续上涨，以及公共服务日益恶化。", "b": "爆发大规模示威，原本数十万人举行和平参与游行，抗议生活成本持续上涨，以及公共服务日益恶化。\n 【马克龙谴责抗议冲突中“肆无忌惮”暴力行为】#法国#全国多座城市举行的大规模抗议演变为暴力事件后，总统#马克龙#在公开演讲中谴责这些肆无忌惮的暴力行为，并警告如有必要，政府会在未来几天禁止一些集会活动。\n马克龙在星期天（10月18日）晚间的电视公开演讲中做出上述表态。不过，他没有宣布进入紧急状态或实施宵禁等极端管制措施。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:tex 推进约1000家门店设施焕新等。\n据了解，星巴克将在全国近半数门店增加高峰时段人\n力投入，重点覆盖交通枢纽、商务办公、文旅景区等\n高客流门店。计划落地后，全国门店每月将新增超过\n20 万小时高峰服务时间 。\n对于近日备受关注的“消费入座\" 措施，星巴克中国方\n向《每日经济新闻》记者回应称: 10月22 日起，\n星巴克将在全国开始施行消费入座，门店会摆放相关\n提示牌。在实际的营运过程中，店员将根据统一的服\n务指引，遵循友好、友善的沟通原则，并妥善处理顾\n客的合理突发需求和特殊情况。如遇到孕妇、行动不\n便者等需要帮助的顾客，店员将优先给予帮助。\nEt\nBARR: 每经媒资库\n| 每日经济新闻 nbdnews 原创文章\n未经许可禁止转载、摘编、复制及镜像等使用", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【6】"}, {"n": 7, "t": "你说要是社保基数也能下降1.7多好。", "b": "07:23                                   a> a\n《                   微博正文            GR eee\nGos\n入 环球时报 WD           aw\n26-10-21 07:19 来自微博视频号\n【坟不球时报社评#: 不是风浪绕开中国，是我\n们筑起了稳的屏障】导读: 21.44亿人次的流\n动，不只是一场出行热潮，更是这个国家对自\n身发展道路的从容印证。不是风暴避开了中\n国，而是我们把滔天风浪挡在了亿万民众的日\n常之外\n2026 年的这个秋天，世界之乱和中国之治的\n反差格外清晰。一边是中东冲突持续扰动全球\n能源供应，欧美柴油价格升至约每桶220美元\n的历史最高水平，与此同时，法国和欧洲多国\n出现持续骚乱动荡，社会矛盾集中爆发。而另\n一边，中国却是截然不同的景象: 国庆7天全\n社会跨区域人员流动量达 21.44亿人次，双节\n合计近 28亿人次奔赴山海; 9月居民消费价格\n同比仅上涨 0.9%，食品价格反而下降1.7%。\n世界乱成一锅粥，中国老百姓照常规划行程、\n安心过日子。很多人在讨论，世界正在经历的\n危机，好像对中国影响不大? 答案很简单: 不\n是风暴自动绕道，是我们提前把风险挡在了民\n生的前面。\n充足多元的储备，是稳住物价的第一道\nEE\nBS “Ait\nQin   ey   4", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【7】"}, {"n": 10, "t": "社会的一个片段", "b": "Sol @ @Sollkn .21h            xX\n今天去社保局办退休，我老婆手心全是汗。她55\n岁，灵活就业，自己掏钱交了18年，全是最低\n档。\n办完出来，核定表上写着: 每月1580块。她盯着\n那个数看了半天，说了一句，十八年，就换这么\nFo\n我没接话。这笔账我早就偷偷算过。灵活就业缴\n20%，只有8%进个人账户，剩下129%进统筹，说\n白了，你每年掏一万，四千是自己的，六千充了\n公。她十八年缴了不到十五万，个人账户里连本\n带息不到六万，除以170个月，一个月三百五，\n剩下的靠基础养老金凑。\n她自己倒想得开，说回本要七八年，六十多岁才\n能把缴的钱领回来。可真正让我心里发沉的，不\n是回本慢。是灵活就业的人，收入不稳，没人帮\n你那12%，每一分都是从饭钱里抠出来的。正\n规职工单位缴16%，自己只掏8%，她一个人把两\n份都打了。\n窗口的工作人员说，下个月还有一笔重算补发，\n新基数下来能多几十块。她听完笑了一下，说几\n十块也是钱。\n本家的路上她没再说话。我知道她在想什么: 这\n笔钱不多，但下个月开始，不用再往外交了。\n@262 也62   S722 几467kK 内 也", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【10】"}, {"n": 22, "t": "越南政府拟议大幅修订住房法，全面禁止外国人购买包括独立式洋房、别墅及排屋在内的所有有地住宅，仅允许外籍人士购买高楼公寓，以遏制房", "b": "面禁止外国人购买包括独立式洋房、别墅及排屋在内的所有有地住宅，仅允许外籍人士购买高楼公寓，以遏制房地产投机风气和平抑飙升的房价。\n据《日经亚洲》和《民族报》报道，拟议的新法案规定，外国人仅 在一段电视采访中说，伊朗提出协助沙特阿拉伯与也门胡塞武装展开谈判、结束双方冲突，但至今尚未", "b": "20日）在一段电视采访中说，伊朗提出协助沙特阿拉伯与也门胡塞武装展开谈判、结束双方冲突，但至今尚未收到沙特或胡塞武装的回应。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【14】"}, {"n": 15, "t": "俄罗斯扩大对乌克兰能源基础设施的袭击范围，从东部和中部延伸至此前未遭攻击的西部地区，导致多地停电。", "b": "的袭击范围，从东部和中部延伸至此前未遭攻击的西部地区，导致多地停电。\n路透社报道，乌克兰能源部副部长涅克拉索夫星期二（10月20日）说，俄军持续蓄意且有系统地攻击乌克兰能源设施，最新袭击波及中部基洛沃格勒州（Kirovohrad）、西部利沃夫、日托米尔、罗夫诺（Rivne）、捷尔诺波尔（Ternopil）和赫梅利尼茨基州（Khmelnytsky），以及南部敖德萨州，造成部分地区停电。\n特朗普近期放宽对俄罗斯的制裁，并多次批评泽连斯基，导致美乌关系恶化。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【15】"}, {"n": 16, "t": "特朗普星期二（20日）敦促乌克兰通过达成协议结束战争，并称莫斯科希望尽快达成协议。他告诉记者：“乌克兰必须有意愿结束这场战争。”", "b": "兰通过达成协议结束战争，并称莫斯科希望尽快达成协议。他告诉记者：“乌克兰必须有意愿结束这场战争。”\n特朗普还暗示，俄罗斯在战场上占据上风，因为“俄罗斯是一台庞大的机器――它们只是不停地向前推进，而这正是它们一直在做的。它们已经占领了大片土地。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【16】"}, {"n": 17, "t": "美国总统特朗普面对支持率屡创新低的困局，试图将法国大规模示威浪潮与移民问题画上等号，借此捞取政治资本。他警告美国选民，除非共和党", "b": "低的困局，试图将法国大规模示威浪潮与移民问题画上等号，借此捞取政治资本。他警告美国选民，除非共和党在中期选举中获胜，否则法国骚乱的情景就会在美国上演。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【17】"}, {"n": 18, "t": "美国官员及知情人士称，是马斯克上星期下令对乌克兰依赖的“星链”（Starlink）卫星服务的军用版本实施限速。", "b": "上星期下令对乌克兰依赖的“星链”（Starlink）卫星服务的军用版本实施限速。\n马斯克上周曾说，无论是降低运行速度，还是限制卫星使用，相关决定都是由美国军方或总统作出的。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【18】"}, {"n": 19, "t": "轨道追踪数据显示，一颗俄罗斯卫星上周末移动至距离一颗支持乌克兰军方行动的欧洲商业卫星仅约100米处，引发外界对莫斯科太空活动的担", "b": "星上周末移动至距离一颗支持乌克兰军方行动的欧洲商业卫星仅约100米处，引发外界对莫斯科太空活动的担忧。\n俄罗斯卫星不仅接近了芬兰卫星，还刻意调整自身轨道，与对方的轨道高度吻合。\n这一事件引起太空专家关注。他们指出，如此近距离接近其他卫星，可能是为了检查、监视或干扰对方的卫星。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【19】"}, {"n": 20, "t": "欧盟委员会主席冯德莱恩星期二公布新的“北极战略”时说，俄罗斯正在北极重建军事存在，“当我们看到这个地区的主权、领土和维系安全的条", "b": "布新的“北极战略”时说，俄罗斯正在北极重建军事存在，“当我们看到这个地区的主权、领土和维系安全的条规已不能被视为理所当然，我们必须应对，改变我们的战略姿态”。\n她说：“北极是地缘政治板块正在碰撞的地区。而这里并不是其他人的疆域，而是欧盟的一部分”。欧盟27国中，丹麦、芬兰和瑞典都是北极圈国家。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【20】"}, {"n": 21, "t": "朝鲜威胁在韩朝边境增派战术打击力量，并考虑恢复对韩扩音器广播后，韩国军方星期二（10月20日）警告，若朝鲜进一步挑衅，将坚决反制", "b": "力量，并考虑恢复对韩扩音器广播后，韩国军方星期二（10月20日）警告，若朝鲜进一步挑衅，将坚决反制，不排除恢复对朝扩音器广播。\n这是自2000年以来，朝鲜首次主动预告可能恢复对韩扩音器广播。分析人士警告，双方持续军事对峙，增加边境擦枪走火的风险。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【21】"}, {"n": 23, "t": "英国哈里王子说，希望与父亲英国国王查尔斯三世及其他王室成员和解，修复多年来紧张的家庭关系。", "b": "国王查尔斯三世及其他王室成员和解，修复多年来紧张的家庭关系。\n现年42岁的哈里近日与妻子梅根及两名子女迁回英国。他接受《GQ》杂志访问时说：“世界上发生了这么多事情，最重要的是和解。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【23】"}, {"n": 24, "t": "日本已启动全球首个从火星圈采样返回的任务，这项任务或有助于解开太阳系与地球生命起源之谜。", "b": "返回的任务，这项任务或有助于解开太阳系与地球生命起源之谜。\n日本宇宙航空研究开发机构（JAXA）周二（10月20日）凌晨从鹿儿岛县种子岛宇宙中心发射了搭载火星卫星探测器（Martian Moons eXploration，简称MMX）的H3运载火箭。一个多小时后，JAXA宣布MMX成功与H3火箭分离，踏上飞往火星系统的征途。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【24】"}, {"n": 25, "t": "美国国务院8月10日发布的最新数据曾显示，自特朗普于2025年1月开启第二任期以来，政府已吊销超过17.5万份签证。", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【25】"}, {"n": 26, "t": "沙特内政部并未明确说明该“不雅行为”的具体性质。声明指出，他们被判处死刑是因为其罪行严重，且侵犯了清真寺的“神圣性”。", "b": "行为”的具体性质。声明指出，他们被判处死刑是因为其罪行严重，且侵犯了清真寺的“神圣性”。\n当地媒体报道，孟加拉国当局表示，直到两名孟加拉国公民在圣城麦加被处决后，他们才获悉此事。孟加拉国外交国务部长莎玛・奥巴德・伊斯兰表示，孟加拉国已就此案涉及的罪行及法律程序与沙特政府提出交涉。\n伊斯兰称，在从沙特当局获得相关信息后，孟加拉国政府将考虑后续行动，例如将遗体运回国内。她补充说，政府致力于维护在海外的孟加拉国公民的福祉与权益。\n据报道，这并非沙特当局首次对外国公民执行死刑。据国际特赦组织 (Amnesty International) 统计，沙特阿拉伯今年已处决了约 100 人，其中许多是因毒品犯罪被定罪的外国人。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【26】"}, {"n": 27, "t": "支持最多的是德国，共$148.2亿\n\r\n其次是英国、挪威，分别$93亿、$73亿", "b": "2亿\n\n其次是英国、挪威，分别$93亿、$73亿", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【27】"}], "tech": [{"n": 1, "t": "今天，针对有报道说美国政府要求其机构停止使用来自中国企业的DeepSeek等人工智能工具，外交部发言人毛宁在例行记者会上表示，中", "b": "其机构停止使用来自中国企业的DeepSeek等人工智能工具，外交部发言人毛宁在例行记者会上表示，中方一贯反对泛化国家安全概念、将科技经贸问题政治化，我们将坚决维护中国企业的合法权益。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196 人道主义者”。这番言论引起美国共和党和民主党议员强烈批评。俄罗斯自2022年全面入侵", "b": "称普京是一名“人道主义者”。这番言论引起美国共和党和民主党议员强烈批评。俄罗斯自2022年全面入侵乌克兰以来，一直受到美国和欧洲国家谴责。\n美国总统特朗普近期对莫斯科释放善意，包括达成购买俄罗斯柴油的协议，以及豁免新的制裁措施，已引起美国国会两党议员反弹，也令欧洲各国首都感到担忧。\n美国特使访俄，俄释放一名被关押的美国公民\n记者：放人有什么条件\n\n总统：你是个蠢货，你们ABC News是最烂的台\n\n\n\n特使：俄总统是出于“人道主义”\n\n总统在白宫：如果我实施了制裁，他现在肯定出不来", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【13】"}, {"n": 14, "t": "国际能源署署长比罗尔警告，受中东局势持续动荡及能源供应链受阻影响，全球能源市场在2027年恐仍难恢复正常。", "b": "东局势持续动荡及能源供应链受阻影响，全球能源市场在2027年恐仍难恢复正常。\n比罗尔星期二（10月20日）在伦敦出席《金融时报》能源转型峰会时说，他看不出有什么可靠的途径，能让全球能源市场在2027年恢复正常，并警告霍尔木兹海峡仍可能再次关闭。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【14】"}, {"n": 15, "t": "美国副总统万斯表明，不会跟随总统特朗普公开支持以色列总理内坦亚胡，强调自己无意介入以色列选举，将专注于美国中期选举。万斯对以色列", "b": "统特朗普公开支持以色列总理内坦亚胡，强调自己无意介入以色列选举，将专注于美国中期选举。万斯对以色列选举保持距离，与他此前对待欧洲选举的做法形成对比。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【15】"}, {"n": 16, "t": "马克龙星期三（10月21日）告诉记者，部分外国领导人针对法国骚乱发表既“不可接受又愚蠢”的言论，试图借法国局势为自身选举造势。", "b": "诉记者，部分外国领导人针对法国骚乱发表既“不可接受又愚蠢”的言论，试图借法国局势为自身选举造势。\n特朗普近日在美国为共和党中期选举造势时，将法国骚乱归咎于移民、圣战分子及共产主义者。他星期二（20日）也公开赞扬法国极右翼领袖勒庞。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【16】"}, {"n": 17, "t": "印度尼西亚总统普拉博沃星期二（10月20日）迎来执政两周年纪念日，但多份最新民调显示他的民望已跌至就任以来的新低，全国多地更是爆", "b": "10月20日）迎来执政两周年纪念日，但多份最新民调显示他的民望已跌至就任以来的新低，全国多地更是爆发抗议示威集会。\n法新社报道，学生团体与人权组织在首都雅加达、爪哇岛的万隆与日惹、苏门答腊的北干巴鲁以及南苏拉威西省的望加锡等城市同时走上街头，抗议政府在应对林火和贪腐问题上的无能与迟缓。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【17】"}, {"n": 18, "t": "美国国务卿鲁比奥说，乌克兰能否使用星链服务，应由星链母公司SpaceX及其创办人马斯克决定，而非白宫。", "b": "使用星链服务，应由星链母公司SpaceX及其创办人马斯克决定，而非白宫。\n《华尔街日报》星期二（10月20日）报道，马斯克下令限速乌克兰使用星链军用版本。乌克兰依赖这项服务抵御俄罗斯的导弹袭击。\n美国国务卿卢比奥回应有关星链、星盾及马斯克决策的报道时表示，特朗普和美国政府从未要求改变相关系统，也无法指示私营公司如何使用自己的技术。\n卢比奥：“我知道这一点，但你提到的具体情况，我并不了解。不过，星链是一家私营公司。\n\n他们签有合同，合同规定了相关技术的使用方式。重要的是，我们不能命令私营公司做什么，或者不做什么。\n\n我可以明确告诉你，美国总统以及政府中的任何人，都从未要求对这个系统进行任何改变。我们已经反复说明过这一点。\n\n我不知道报道中具体说了什么，但事实就是如此。”\n\n记者：“你不能因为总统没有要求马斯克这么做，就断定他们没有讨论过这件事。”\n\n卢比奥：“我再说一遍，星链、星盾以及马斯克做出的决定，与总统没有任何关系。星链是一家私营公司，总统不管理这家公司，也不能命令这家公司做任何事情。\n\n据我所知，没有任何人事先知情，我也没有掌握任何人事先知情的信息。”\n\n记者：“但报道讨论的并不是有没有人事先知情。”\n\n卢比奥：“我告诉你，没有人事先知情。除此之外，即便有人事先知情，我们也无法控制一家私营公司如何决定使用自己的产品。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【18】"}, {"n": 21, "t": "Financial Times 独家报道：北约即将同意，乌克兰通过北约内部系统采购武器和装备，速度更快、费用更低", "b": "FT Exclusive: A new agreement could\nallow Kyiv to obtain weapons,\nammunition and military equipment\nfaster and more cheaply via Nato’s\ncentralised procurement agency\nft.trib.al/           Fc\n=,\nUkraine to buy military\nsupplies via Nato agency", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【21】"}, {"n": 23, "t": "一条在韩国釜山港口运河逗留超过一个月、吸引逾160万人前来围观的鲨鱼，经过两次救援失败后，终于在星期三被成功引导返回大海。", "b": "一个月、吸引逾160万人前来围观的鲨鱼，经过两次救援失败后，终于在星期三被成功引导返回大海。\n路透社报道，韩国海洋水产部星期三（10月21日）证实，这条被昵称为“小北港”（Bukangi）的鲨鱼已顺利游出釜山北港的狭窄水道，重返开放海域。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【23】"}, {"n": 24, "t": "全球集装箱吞吐量最大的港口", "b": "Los Angeles\nSuzhou\nBeibu Gut\nHo Chi inh City 国\n1 York Jersey SSD\nKaohsiung           en\nmnda 8.4\nHal Phong 的JE\nHanbury SSD\nTanjung Prick yl 3H\nColombo (ES\nJawaharlal Nebru 9) /007.5H\nGooner\n‘Source: nyt Top 0 Pats 2\nContainers handled in 2025 (20-foot equivalents)\nn 2025, the top 30 ports\nhandled over hl bili\n2-feot containers worth\nte teifer se tan en Fyne ci ot sain nor LAS ten ead GE", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【24】"}, {"n": 25, "t": "川普宣布把大西洋改名川普洋的尝试失败", "b": "我打电话给 Google Maps，要求把大\n西洋改名为特朗普洋。\n又达尔说:“不，不，不。这次我不\nFY. \"他说:“海洋不一样，先生。\n它们覆盖了很多国家。请不要让我们\n做这个。”\n所以我们可能过不了这一关。我们还\n是保持大西洋这个名字吧。\n评价此翻译: 办 外", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【25】"}, {"n": 26, "t": "CNBC报道：美国驻沙特使馆开始撤离员工和家属，因为美以军方在筹划，中期选举结束后，继续炸伊朗", "b": "The move comes as the U.S. and Israeli\nmilitaries have drawn up specific plans\nfor renewed strikes on Iran after next\nmonth’s midterm elections: cnb.cx/\n4dMutxq\nU.S. pulls diplomats\nfrom Saudi Arabia as it\nreportedly readies\nIran strikes after midterms\nCRBC", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【26】"}], "tech": [{"n": 3, "t": "大跌之下，A股千元股又少1只，只剩2只了", "b": "=\nSLE aonaunawn =F\n代码\n600519\n688808\n688498\n688256\n300308\n688826\n002371\n688836\n688072\n301716\n名称\n贵州茅台\n联讯仪器\n源术科技\n寒武纪\n中际刘创\nsR\n北方华创\nFAN...\n拓草科技\nEi\n© SAN\n1310.47\n1113.68\n949.23\n895.17\n604.39\n597.00\n551.02\n524.00\n515.01\n503.04\non eww &\noe oe 来", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【3】"}, {"n": 6, "t": "彭博社 10 月 21 日独家报道，DeepSeek 在最新一轮融资中筹到约 1000 亿元人民币，约合 150 亿美元，是中国", "b": "报道，DeepSeek 在最新一轮融资中筹到约 1000 亿元人民币，约合 150 亿美元，是中国有史以来规模最大的融资之一。消息来自不愿具名的知情人士，DeepSeek、腾讯和宁德时代都还没有公开确认。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【6】"}, {"n": 19, "t": "马斯克想把“地球上的智能”和“宇宙里的梦想”彻底缝合在一起。如果成了，这就是人类历史上前所未有的科技巨无霸。但如果不成，这颗包含", "b": "宇宙里的梦想”彻底缝合在一起。如果成了，这就是人类历史上前所未有的科技巨无霸。但如果不成，这颗包含了地缘、技术与资本的“超级炸弹”，也随时可能带来巨大的震荡。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【19】"}, {"n": 20, "t": "Politico 10 月 20 日披露：众议院民主党人正在排兵布阵，若 11 月 3 日中期选举夺回众议院，就用委员会主席的传", "b": "0 日披露：众议院民主党人正在排兵布阵，若 11 月 3 日中期选举夺回众议院，就用委员会主席的传票权全面调查马斯克――目标包括他执掌 DOGE 的旧账（一位民主党议员称之为“原罪”）、其公司拿联邦合同的利益冲突（SpaceX 的 NASA 与国防合同），以及他在限制乌军星链接入一事中的角色。\n民主党众议员 Zoe Lofgren 说马斯克的“利益冲突多得惊人”，监督委员会成员 Greg Casar 直言马斯克“就在那份名单上”。目前预测普遍看好民主党至少拿下众议院。\n马斯克的底气和软肋是同一件事：钱。他是本选举周期共和党最大金主，7 月以来已砸下 2.76 亿美元（其中 1.58 亿给参议院领袖基金），正全力阻击民主党翻盘；但他同时又是联邦合同的大户，DOGE 期间主导裁撤近 30 万联邦雇员。\nFox Business 把这条帖子的标题定为《马斯克称将报复调查他的民主党人》――一方说这是选前恐吓选民的金主，一方说这是被政治追杀的企业家。真正决定这场仗打不打的，是 13 天后的众议院归属。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【20】"}, {"n": 22, "t": "这起诉讼的源头可追溯至轰动全球的“剑桥分析”数据丑闻。当地陪审团认定，Meta在数据隐私保护、打击虚假信息及遏制仇恨言论等举措上", "b": "的“剑桥分析”数据丑闻。当地陪审团认定，Meta在数据隐私保护、打击虚假信息及遏制仇恨言论等举措上严重误导了Facebook用户，违反该州不公平竞争及消费者保护法规近4400万次。\n法官此前一度开出高达2194亿美元的惊人罚单，随后核减至250亿美元；新墨西哥州总检察长直言，这是美国历史上针对单家公司开出的最大单笔罚单之一。按照该州法律，这笔罚款将全额注入当地教育基金。\n面对判决，Meta首席法务官强硬回应，称该裁决让公司几乎无法在当地开展业务，指责这实质上是在变相征收“言论税”，并明确表态将继续上诉。\n而就在判决公布前两个月，Meta才刚刚因Instagram算法致瘾、侵害青少年心理健康等指控，与全美52位州总检察长达成了180亿美元的巨额和解协议。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【22】"}, {"n": 29, "t": "段永平讲他2011年大举买入苹果股票的契机：", "b": "果股票的契机：\n「当时苹果的市值只有大约3000亿，但净现金有1000亿。当时一年已经赚到150-160亿美金了。我看到的是，苹果未来的利润一定会到500亿/年或者更多。当时苹果犯了一个小错，迟迟不肯推出打大屏手机，所以有大概三年的时间里苹果的股价都一直处于低位。我在这三年多的时间里，从计划投10%到最后投到了95%以上，几乎把手里所有的其他股票都换成了苹果。我绝对不是在赌哈，是真的理解这家公司的。这种机会不会经常来，但意识到这种机会的时候，能够下重注是非常重要的。」", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【29】"}], "cult": []}}, {"date": "20261023", "label": "10月23日", "week": "周五", "id": "196310", "title": "终身负责", "cats": {"econ": [{"n": 1, "t": "前三季度，全国一般公共预算收入172292亿元，同比增长5.1%。其中，全国税收收入140706亿元，同比增长6.1%；非税收入", "b": "172292亿元，同比增长5.1%。其中，全国税收收入140706亿元，同比增长6.1%；非税收入31586亿元，同比增长1.2%。分中央和地方看，中央一般公共预算收入76699亿元，同比增长8.3%；地方一般公共预算本级收入95593亿元，同比增长2.7%。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196310#:~:text=【1】"}, {"n": 7, "t": "财新：德勤负责个税业务的人士告诉财新，有的客户甚至卖掉了离岸黄金来补税", "b": "一位在德勤负责个税业务的人士告诉\n财新，她的团队所负责的客户几乎也\n都完成了离岸信托的个向补缴, “我\n们一直加班到22日深夜，有的客户其\n至卖掉了离岸黄金来补秘。”\n© 财新 &\n离岸信托补税过渡期结束 富豪企业家\n都完税了吗?", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196310#:~:text=【7】"}, {"n": 23, "t": "中国的一二三四线城市，等级越低的城市，它的城市化之路越粗暴，越依赖卖地。因为起步晚，追赶的心理状态，很着急。此外，因为城市发展的", "b": "的城市，它的城市化之路越粗暴，越依赖卖地。因为起步晚，追赶的心理状态，很着急。此外，因为城市发展的启动资金不足，所以要发政府债/城投债。大多数的发展路径是另辟新城思路，通过把农业集体用地转化为城市建设用地，建个xx新区。但这种城镇化基本上千篇一律，就是搞了个假CBD，把一些政府部门迁过去，建几个学校医院，修一些文体设施，最主要的是卖地盖一堆高层住宅小区。其实这种发展路径，本质上是因为产业基础羸弱，只能卖地。房地产一下行，地不好卖，政府财政变得更加脆弱。新区的开发也就戛然而止。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196310#:~:text=【23】"}, {"n": 24, "t": "何牧歌耶 · 这些东西可要记得 因为跟自己的身家性命有关系 因为这件事情充分说明，在中国有一家表面上是民营的企业，是能够把人送进", "b": "这些东西可要记得 因为跟自己的身家性命有关系 因为这件事情充分说明，在中国有一家表面上是民营的企业，是能够把人送进监狱的", "href": "https://www.dapenti.com/blog/more.asp?name=x [{"n": 2, "t": "港交所10月26日公告，香港证券及期货事务监察委员会已批准交易所规则，有关将所有证券（结构性产品除外）的买卖盘价格限制门槛由现时", "b": "券及期货事务监察委员会已批准交易所规则，有关将所有证券（结构性产品除外）的买卖盘价格限制门槛由现时的九倍收紧为五倍之修订，将由2026年11月2日（星期一）起生效。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【2】"}, {"n": 3, "t": "据财新报道，十几家财经自媒体涉舆情敲诈勒索被立案调查。另有两家9月就已停更的财经新媒体平台也被查，分别和山西晚报、潇湘晨报有关。", "b": "多渠道信息显示，近期有十多家知名\n财经自媒体因涉与情敲诈被警方调\n查，包括: MSAK, HMA\n射财经、牛刀财经、九州商业观察、\n第一消金、港湾商业观察 、侃见财\n经、消金财经、财报风云、晋商俱乐\n部等。另外，两家传统媒体旗下或存\n在挂靠关系的新媒体平台《投资有\n道》`、“刻度财经”也涉案被查。\n@ 财新 &\n与情敲诈打击力度加大 十多家知名财\n经自媒体涉案", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【3】"}, {"n": 5, "t": "据中国新闻周刊，10月25日晚，蔡康永通过个人微博发文，表示“我没有支持过台独”。全文如下：", "b": "蔡康永通过个人微博发文，表示“我没有支持过台独”。全文如下：\n致关心此事的你：\n1.我一直希望两岸友好来往。我没有支持过台独。\n2.我从1998年开始主持访谈，访过近万位来宾，他们有各式各样的立场，我从来没有成为其中任何一位的信徒。访问对方并不表示会认同对方。\n\n3.近日为了采集访谈资讯，我前往不同受访者的活动现场体验观察。\n\n这个工作习惯招来批评，这些批评当然有其道理，我完全理解。只是所引起的误会，给我的合作方以及曾经喜欢我的人，造成了困扰，我对他们深感抱歉。\n\n我的父母都来自上海，本来互不相识的他们，到台北才相遇。如果不是时代动荡形成的缘分，世上根本不会有我这个人。\n\n所有曾经的缘分，我都感激。\n即使缘分已告一段落，所有曾让我被看见被听见的缘分，我都永远感激。\n\n如果承蒙你曾经认可过我，我应该没机会再当面致谢了，容我在这里谢谢你曾经在各种时刻，带给我好好活下去的力量。愿你也一切安好。\n\n献上我的祝福。\n\n\n\n此前报道\n\n\n\n10月14日，国务院台办举行例行新闻发布会。\n\n中新社记者：台湾艺人蔡康永现身民进党台北市长参选人沈伯洋的竞选总部成立大会，请问对此有何评论？\n\n发言人陈斌华：台湾是中国领土不可分割的一部分，坚持一个中国原则是国际社会的普遍共识，也是两岸同胞共同的政治基础。“台独”顽固分子沈伯洋的所作所为人尽皆知，任何形式的“台独”分裂活动都是对中华民族根本利益的严重损害，我们都坚决反对。\n\n我们始终尊重和保障台湾同胞正当的言论与表达自由，但在大是大非问题上，没有任何模糊空间。维护统一、反对“台独”是全体中国人民的共同意志，任何人、任何势力都不能一边赚取大陆发展红利，一边与“台独”分裂势力勾连纠缠，做“两面人”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【5】"}, {"n": 8, "t": "多地幼儿园改为养老院", "b": "多地幼儿园改为养老院\n第一财经\n们 1.6万人\nAl摘要\n2026.10.25\n本文字数: 1408，阅读时长大约2 分钟\n作者 | 第一财经 this\n2025 年我国老年抚养比首次超过少儿\n根据国家统计局编著出版的《中国统\n计年鉴2026》，2025年全国0-14 岁\n人口 21276 万人，占总人口比重为\n15.1%; 65 岁及以上人口 22365 万\n人，上右总人口比重为15.9% 。2025\n年，全国总抚养比为45.1% ，其中少\n儿抚养比为22% ，老年抚养比为\n23.1% ，老年抚养比首次超过少儿抚\n养比。\n抚养比又称抚养系数，是指在人口当\n中非劳动年龄人口对劳动年龄人口数\n之比 (注: 这里所指劳动年龄人口为\n15-64岁群体) 。总抚养比就是少年\n儿童抚养比和老年人口抚养比相加之\n和。\n随着人口老龄化程度的不断加深，近\n年来我国老年抚养比持续上升。2016\n年，我国老年抚养比为15%，到2021\n年首次突破20% ，达20.8% 。2024\n年老年抚养比升至22.8% ，当年少儿\n抚养比为23% 、老年抚养比已经十分\n接近少儿抚养比。至2025年老年抚养\n比首次超过少儿抚养比。\n同时少子化和老龄化对很多行业和领\n域都产生了深刻影响。\n近年来人口结构的变化对教育领域产\n生了较大影响。\n在招生难的情况下，一些幼儿园在控\n在济南天桥区宝华街街道，一所运营\n30多年的民", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【8】"}, {"n": 10, "t": "我还说这个头哪像了，一看名字，确实", "b": "东汉时期的西红柿", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【10】"}, {"n": 15, "t": "#塞尔维亚#前总统#武契奇#星期天（10月25日）在首都贝尔格莱德竞选总部说，根据分层抽样结果，由学生团体推动的“学生名单－学生", "b": "期天（10月25日）在首都贝尔格莱德竞选总部说，根据分层抽样结果，由学生团体推动的“学生名单－学生获胜”预计将在国民议会250个席位中获得135至140席，而由塞尔维亚前进党主导的“亚历山大・武契奇－团结的塞尔维亚”选举名单预计获得约105席。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【15】"}, {"n": 16, "t": "#巴西#总统选举第二轮投票星期天结束。民调机构AtlasIntel首席执行官罗曼根据持续进行的计票结果预测，现任总统#卢拉#将击", "b": "天结束。民调机构AtlasIntel首席执行官罗曼根据持续进行的计票结果预测，现任总统#卢拉#将击败前总统#博索纳罗#之子弗拉维奥・博索纳罗，赢得连任。\n【博索纳罗之子拒绝承认巴西总统选举败选】#巴西#前总统#博索纳罗#之子弗拉维奥拒绝承认自己在总统选举第二轮投票中败选。另一方面，现任总统#卢拉#当地时间星期天（10月25日）晚发表讲话，宣布在当天举行的巴西总统选举第二轮投票中胜出，并称“这个国家不是任何人的后院”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【16】"}, {"n": 21, "t": "丢人一小时，少工作15年", "b": "‘om:   NS -0", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【21】"}], "intl": [{"n": 9, "t": "【】留学乌克兰\n\r\n未上过一堂课", "b": "未上过一堂课", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【9】"}, {"n": 11, "t": "#美国#司法部起诉#阿拉斯加州#，试图阻止当局在特定情况下认证参议院选举结果，引发外界对联邦政府干预中期选举的担忧。美国司法部长", "b": "#，试图阻止当局在特定情况下认证参议院选举结果，引发外界对联邦政府干预中期选举的担忧。美国司法部长布兰奇随后否认总统#特朗普#企图借此控制州选举。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【11】"}, {"n": 13, "t": "#委内瑞拉#反对派领袖、诺贝尔和平奖得主#马查多#（Maria Corina Machado）星期天（10月25日）宣布，结束近", "b": "和平奖得主#马查多#（Maria Corina Machado）星期天（10月25日）宣布，结束近一年的海外生活，返回委内瑞拉。她的回国可能加剧#美国#特朗普政府与委内瑞拉反对派之间的分歧。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【13】"}, {"n": 14, "t": "#以色列#将在即将到来的全国大选日，全面关闭所有西岸的陆路口岸，并禁止包括劳工在内的#巴勒斯坦#人出入#约旦河西岸#地区，以进一", "b": " 九个月，地方政府土地出让收入1.61万亿，同比跌27.9%\n\r\n828新政后，明年会比今年更差", "b": "今年前九个月，地方政府土地出让收入1.61万亿，同比跌27.9%\n\n828新政后，明年会比今年更差\n \n全网都在问：姆巴佩到底说了什么？", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【22】"}], "soc": [{"n": 1, "t": "没药花园案件 · 今天听说一个让我震惊的消息。\n\r\n我大约在2019年就关注徽剑这个公众号了，24年他突然不更新了，甚至全部文章", "b": "今天听说一个让我震惊的消息。\n\n我大约在2019年就关注徽剑这个公众号了，24年他突然不更新了，甚至全部文章消失，我开始也没太留意。\n\n再后来，我偶然听说他被抓了，一直失联。\n\n\n\n那一年，他写文章首个揭露了柬埔寨大的电诈头目和黑帮头目刘忍。刘忍当年在明面上和陈志一样，是在柬埔寨的正经华商形象，自然不想被大陆自媒体公布真实行径和面目。刘忍通过中间人联系他，试图花钱让他删文章，他拒绝。\n\n此后徽剑被几个“警察”从停车场带走。\n\n\n\n当时普遍统一的说法是，刘忍在国内报警，控告他敲诈勒索和诽谤之类，他就被抓了。现在你问AI，也是这么说的。\n\n在那以后，他的人一直失联，公众号所有文章消失。\n\n前不久央视报道陈志、刘忍等人被抓回国，我还想这下可以还徽剑清白了吧，但怎么媒体还是联系不上他，公号还不发文章呢？\n\n\n\n但今天我才知道，原来徽剑已经被人杀害了！\n\n\n\n在一个停车场带走他的人，是三个伪装成警察的杀手。为首的赵冰在飞机上领到一个叫“少校”的人的任务：一百万绑架他、删掉文章并逼问提供信息的线人是谁。\n\n赵冰又纠集了几个人作案。\n\n他们跟踪他，趁他在一个大卖场下车从后备箱取东西时将他绑架。他们先在广东荒郊野外虐待拷问他，抢走手机，删掉文章。后把他手机交给少校派来拿的人。\n\n最后他们把人带到江西的山上殴打致死。尸体被抛在野外，后被村民发现。\n\n\n\n他被带走时可能有目击者看到穿假警服的人，再加上刘忍他们故意放假消息，从此以讹传讹，传成他涉嫌违法被警方拘捕。\n\n这些罪犯和他无冤无仇，这么做只为了一百万悬赏，五个人分别分到40万到10万不等。\n\n其中为首的赵冰被判死缓，其余13人有期徒刑。（徽剑父母的养子收了赵冰父母的50万，给所有人出了谅解书。）\n\n而在飞机上直接雇佣他们的“少校”（绰号泰哥）一直没被抓到，更别说证明少校背后主谋是谁。\n\n\n\n一直觉得国内很安全，没想到光天化日下公共场合也会发生这种事。监控什么都只能吓住那些怕死的罪犯，却防不住为了钱不要命的暴徒。\n\n国内管控严，相比其他国家够安全了，所以这一群人能在几天后就落网。要是放其他监控少的国家，我都怀疑能不能查清楚怎么回事。\n\n\n\n电诈这行的财富太惊人了，钱到了这个规模基本什么都能买到。只要有钱，不仅可以买到徽剑的车牌号和住址，在飞机群里可以买到国内的垃圾人干各种违法犯罪的事。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【1】"}, {"n": 2, "t": "中国婚恋第一股百合网的联合创始人，一代相亲大佬慕岩，在朋友圈贴出了自己的微信收款码。配文大意是：财产被无缘无故冻结，生活拮据，只", "b": "自从被无缘无故冻结财产，生活持据，\n朋友圈化缘后，很多朋友都进行了金钱\n的支持。也有些朋友分享了自己被无故\n历。还有 30 年前的老朋友，已经 204\n系，也因此重新联系上了，并相约在北\n茶，共叙 20 年以来各自人生的变化。\n本来一件坏事，因为友情力量的加持，\n愤而发起\n或精神上\n冻结的经\n没有联\n京一起喝\n逐渐变成", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【2】"}, {"n": 4, "t": "据南方日报，近日，多所大学发布相关通知，学校在职在编人员工资将通过数字人民币钱包发放。", "b": "相关通知，学校在职在编人员工资将通过数字人民币钱包发放。\n扬州大学财务处10月20日发布通知，接省财政厅预通知，自2026年11月起，学校在职在编人员（含人事代理）工资将通过数字人民币钱包发放，请相关人员根据自己目前的工资卡情况，于10月23日前完成数币钱包的开立与升级。\n南通大学财务处发布《关于做好数字 费流水”，但并非一国AI产业资源投入的“总账”，更不能等同于技术研发方向。\n事实上，文娱产业只是我国AI发展的一个赛道，大量“火药”正用于攻克重大难题的“枪炮”。\n中国AI发展始终锚定国家战略需求和人民美好生活需要，将好钢用在刀刃上，所谓“跑偏论”本身就跑偏了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196444#:~:text=【5】"}, {"n": 9, "t": "菲尔兹奖得主邓煜：AI公司蒸馏全人类的知识，但不允许其他公司蒸馏自己，这是双标！", "b": "邓煜:Al公司不能双标\n只许自己蒸馏人类知识\ni\nA ot    得主\n- |               FURR: 10月25日 知识分子\n只有你蒸锣全人类的网络立就", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196444#:~:text=【9】"}, {"n": 18, "t": "币安被盗58亿美元", "b": "一夜被盗58亿，币圈最担心的事发生了\n夜之间，币安被黑客盗走几十亿美金，加密货币\n上最大的交易所盗窃案发生了。\n就在今天凌晨4点20分，币安标记为“Binance 14”的\n热钱包被一扫而空。多链统计估算流出资金高达约\n58亿美元，差不多380亿人民币。\n好在，币安已联合发行方冻结了约25.4亿至30亿美\n元的加密货币资产，且承诺会全额覆盖用户损失。\n怎么做到的? 黑客利用了以太坊Pectra升级引入的一\n个新特性。这个功能本意是让普通钱包能临时委托\n给智能合约，方便批量操作。但黑客诱导系统签下\n了恶意授权，甚至不需要私钥，就拿到了钱包的控\n制权。\n事情发生后，比特币应声大跌，全网一小时爆仓超6\n亿。这给整个行业敲响了警钟。Al时代，互联网安全\n防御的挑战已进入新阶段。正如马斯克在X上的发\n言: Everyday is Zeroday. (每天都是零日漏洞) 。\n大家对此怎么看?\n@ 新行情 作者 43分钟前                回复”10办\n给大家解释一下，马斯克说的“Zero-day (SAR\n洞} ”，指的是一个软件或系统中，被黑客发现并利\n用，但软件厂商自己还完全不知道(或者没来得及修\n复) 的安全漏洞。对厂商来说，他们的防御修复时间\n是0天。\n简单来说，他就是在提醒行业，在如今的网络世界\n里，出现全新的、无法预料的漏洞，已经不是偶然事\n件，而是每天都在发生的常态", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196444#:~:text=【18】"}], "cult": [{"n": 20, "t": "@她说:同时，武汉柏林电影周和爱酷电影周都宣布取消了", "b": "爱酷电影周都宣布取消了", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196444#:~:text=【20】"}]}}, {"date": "20261031", "label": "10月31日", "week": "周六", "id": "196472", "title": "只需改一个词，就一通百通便于理解了", "cats": {"econ": [{"n": 1, "t": "明天起，这些个人收入将由单位代缴增值税", "b": "以前个人给相关单位提供服务时需要\n缴纳增值税，但这需要个人向税务部\n门自主申报纳税。但实践中不少个人\n出于各种原因并没有主动申报纳税，\n造成这部分税款流失。2026年11月1\n日施行的增值税法等明确，自然人发\n生符合规定的应税交易，支付价款的\n境内单位为扣缴义务人。《办法》正\n是落实增值税法规要求，率先在七大\n服务领域开展单位代扣代缴增值税。\n第一财经 ©\n了明天起，这些个人收入将由单位代缴\n增值税", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【1】"}, {"n": 4, "t": "不用工资社保，24小时不间断执勤不眠不休，江苏多地物业引入“巡逻机器人”，一台能抵5个保安，每月仅耗电约200度。", "b": "不用工资不用社保     你怎么\n9", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【4】"}, {"n": 5, "t": "因一条差评，女子赔了酒店4000元", "b": "因一条差评，女子赔了4000元! 其怀疑酒\n店保安帮助停车发生刚足，发帖称“酒店停\n车位太垃圾”，被法院认定构成名誉权侵权\nseg 红星新闻\n一条*避坑帖`、几句*差评\"，借助社交平台动动手指就能传播干里。如今，越来越多\n消费者习惯通过在线平台分享消费体验、对商家服务进行评价，但评价权并非毫无\n边界，一旦超出合理范畴，可能需要承担法律责任。\n近日，广西壮族自治区桂林市秀峰区人民法院审结了这样一起案件，消费者郑女士\n在网络平台发布不实差评，最终被法院认定构成名蕉权侵权，判决其删除评论、公\n开赔礼道菊并赔偿损失。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【5】"}], "soc": [{"n": 2, "t": "证监会：全力稳市场稳预期 持续提升资本市场韧性和信心", "b": "10-30 17:09:40\n正监会; 全力稳市场稳预期 持续提升\npreter\n中\nEH]\n证监会党\n委传达贯彻党的二十届五中全会精\n神。会议要求，深入学习贯彻全会精神是当前和\n今后一个时期\ntee\n的重大政治任务，证监会系统要认\n宣讲解读，分层分类做好全覆盖培\n训，持续在解决突出问题上下功夫，推动学习宣\n(ESRI, 形成浓厚氛围。同时，充\n分发挥全面从严治党的政治引领和政治保障作\n用，补国树立大局意识、系统观念，全力稳市场\n稳预期，深化投融资综合改革，完善全链条监管\n体系，持续提升资本市场韧性和信心，确保\"十\n五五\"开局之和\n资本市场各项任务圆满完成。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【2】"}, {"n": 6, "t": "2.StudyCase", "b": "2. Study Case\nThe study location, Guangzhou, Guangdong, is situated in southern China and has a\ntotal population of 18.67 million. In 2023, the number of e-bikes in Guangzhou reached\n6 million, with an average daily travel volume of 6.85 million e-bike trips. The majority of\ne-bikes in Guangzhou are mopeds. In 2022, there were 5600 daily recorded e-bike violation\ncases, with misbehaving riders responsible for half of the e-bike accident law cases [75]. By\n2023, 60-80% of orthopedic injuries were caused by e-bike accidents. Additionally, 65%\nof severe injuries and 75% of fatal injuries resultin", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【6】"}, {"n": 7, "t": "一篇自媒体文章", "b": "打车人数在减少，平台就向下引\n流，专车去做轻享，轻享去做快车，\n最终拼压的是最底层的快车。客单价\n也在下降，对油耗越来越伺感，油换\n电就成必然选择。\n太阳照常升起\n北京网约车现状", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【7】"}, {"n": 9, "t": "西湖边现在有一亿人!!ART©", "b": "西湖边现在有一亿人!! ART ©\n大家都好有活人感啊!\n#杭州 #西湖 #胡滨银泰in77 HER\nZw. CD1405 Lyn2 (225\nSO ofer", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【9】"}, {"n": 10, "t": "波兰10月30日爆发剧烈政坛动荡，亲欧派总理图斯克政府与右翼总统纳夫罗茨基就宪法法院控制权展开公开对抗。 宪法法院官方账号一度发", "b": "荡，亲欧派总理图斯克政府与右翼总统纳夫罗茨基就宪法法院控制权展开公开对抗。 宪法法院官方账号一度发文，谴责政府强行暂停院长职务的行动是“政变”。\n事件起因于宪法法院院长博格丹・希维恩奇科夫斯基被暂停职务一个月，改由新法官接管。此举随即遭到原法院高层与反对党法律与公正党（PiS）的强烈反击，指责政府非法接管法院并践踏宪法。\n\n事发时正飞往非洲访问的波兰总统纳夫罗茨基紧急返航，回国后直接闯入法院大楼与在场法官对峙。与此同时，大批反对党支持者在法院外集结抗议，防暴警察全面包围大楼，现场发生冲突并导致多人受伤。\n\n总理图斯克对此态度坚决，表示恢复法治的过程虽然艰难甚至痛苦，但政府必须采取果断行动。目前，这场因“司法清洗”引发的宪政危机仍在持续升级。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【10】"}, {"n": 20, "t": "@六耳公孙", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【20】"}, {"n": 21, "t": "墨西哥亡灵节在墨西哥城中央广场建了一座33.4米高的卡特琳娜巨型骷髅雕像！", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【21】"}, {"n": 22, "t": "@胡锡进", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【22】"}], "intl": [{"n": 11, "t": "美国中期选举下周登场，佛罗里达大学机构公布的数据显示，目前已有创纪录的4790万名美国人提前投票；关键摇摆州的投票参与度大幅激增", "b": "大学机构公布的数据显示，目前已有创纪录的4790万名美国人提前投票；关键摇摆州的投票参与度大幅激增，且民主党选民提前投票人数多过共和党选民。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【11】"}, {"n": 12, "t": "二十国集团外交部长会议在美国举行，俄罗斯外长拉夫罗夫的出席引起反弹，这次会议取消传统的“全家福”合影环节。", "b": "行，俄罗斯外长拉夫罗夫的出席引起反弹，这次会议取消传统的“全家福”合影环节。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【12】"}, {"n": 13, "t": "美国政府批准向乌克兰出售500枚“爱国者”导弹，价值总额达21亿美元。美国国务院声明说，批准方案已提交国会审议，“这次拟议的军售", "b": "枚“爱国者”导弹，价值总额达21亿美元。美国国务院声明说，批准方案已提交国会审议，“这次拟议的军售将提升乌克兰的综合防空与反导能力，从而增强它应对当前及未来威胁的能力。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【13】"}, {"n": 14, "t": "一家美国资本控股的企业计划投资6亿美元在马来西亚兴建稀土提炼厂，目标是推动马国成为区域稀土加工枢纽。分析认为，美国为降低对中国稀", "b": "6亿美元在马来西亚兴建稀土提炼厂，目标是推动马国成为区域稀土加工枢纽。分析认为，美国为降低对中国稀土的依赖，正逐步将供应链布局转向马国。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【14】"}, {"n": 15, "t": "为缓解中东战事导致的能源价格上涨压力，欧洲11国承诺在2027年1月结束前，释放4260万桶战略储备石油，美国也完成新一批约40", "b": "涨压力，欧洲11国承诺在2027年1月结束前，释放4260万桶战略储备石油，美国也完成新一批约4000万桶原油的出借安排。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【15】"}, {"n": 18, "t": "美国经济繁荣就靠这俩哥们儿撑着了", "b": ">\n2\n3\nFy\n8\n2\n3", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【18】"}, {"n": 19, "t": "2026年10月29日，《纽约时报》发表了一篇六名记者联合署名的调查报道，称美国情报部门认定，这名叫Alice Huang、也使", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【19】"}], "tech": [{"n": 3, "t": "10 月 31 日，苹果正式宣布 Apple 智能即将登陆中国！首批功能将于 11 月 4 日随 iOS 开发者 Beta 版开", "b": "布 Apple 智能即将登陆中国！首批功能将于 11 月 4 日随 iOS 开发者 Beta 版开放测试，12 月随 iOS 27.3 正式向国内用户推出。\n\n首批上线的功能包括实时翻译、照片消除、写作工具、视觉智能、智绘表情、通知摘要、邮件智能回复等。其中，实时翻译可用于电话、FaceTime、信息及支持的 AirPods，视觉智能则可以通过摄像头识别周围的物体和场所。\n\n苹果还确认与阿里巴巴合作，在部分 Apple 智能功能中接入千问。国内用户可以通过 Siri 向千问提问，理解照片、PDF 和演示文稿中的内容，也可以借助系统写作工具直接生成原创文本。\n\n不过，苹果特别强调，这次更新暂不包含 Siri AI，以及 WWDC 2026 上公布的其他下一代 Apple 智能功能。首批支持 iPhone 15 Pro 系列、iPhone 16 及后续机型、iPhone Air 和 iPhone Duo，其他平台还需要等待相关审批。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【3】"}, {"n": 8, "t": "官方披露：将有两名中国人登陆月球", "b": "据环球时报消\n， 10月31日，中国载人航天工程副总设计师兼月球探测工程总设计\n师王翔在第七届载人航天学术大会上，介绍了我国首次载人月球探测任务乘组计\n划。\n=\nPRRARA LEMAR HPRARAU LES PEAFE SRA. BR: 中\n国载人航天\n我国计划在2030年前实现中国人登陆月球。首次载人月球探测计划采用环月轨道对\n接飞行模式，通过 两次发射，一次登月\"的方式实现载人登月。\n这种模式将采用两枚长征十号运载火箭，先将着陆器送往月球轨道，然后再发射载\n人飞船与着陆器实现交会对接 ，航天员进入着陆器并与载人飞船分离着陆月面，开\n展有关科学      动。完成任务后航天员乘坐着陆器从月面上升，在月球轨道上与\n载人飞船实现二次交会对接 ,航天员乘从载人飞船携带样品返回地球。\n王翔介绍称，我国首次载人月球探测任务乘组计划由三人组成，其中两人着陆月球\n表面。目前，中国月球探测工程登月阶段任务各项研制建设工作正在扎实推进。\nCCTY,\n中文国际", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【8】"}, {"n": 16, "t": "凯特・布兰切特发起的非营利组织“人类知情同意基金会”，联合安妮・海瑟薇、朗・霍华德、罗伯特・德尼罗、斯嘉丽・约翰逊、朱莉娅・罗伯", "b": "“人类知情同意基金会”，联合安妮・海瑟薇、朗・霍华德、罗伯特・德尼罗、斯嘉丽・约翰逊、朱莉娅・罗伯茨、艾玛・汤普森、史蒂文・索德伯格以及CAA经纪公司等多家行业机构，共同向纽约南区联邦法院发声。\n双方的核心争议在于AI训练是否属于合理使用。她们坚决反对AI公司未经许可擅自抓取人类的面孔、声音和肖像，必须确立知情同意与付费授权的行业底线，同时必须赋予创作者明确选择不参与AI训练的权利。\n另一边，科技巨头们辩称大规模购买版权成本过高且缺乏成熟的定价机制，借此无偿抓取创意作品；演员与创作者阵营则直接反驳，指出好莱坞早已拥有成熟完备、低成本高效的版权授权和分发体系，科技公司的借口完全站不住脚。\n该案目前仍在法庭审理中。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【16】"}], "cult": [{"n": 17, "t": "这位因饰演詹姆・兰尼斯特而闻名的丹麦演员，在首都响起警报时被迫躲入地下。", "b": "的丹麦演员，在首都响起警报时被迫躲入地下。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【17】"}, {"n": 22, "t": "「电影没什么用，但它能分散注意力」", "b": "。_有一次一个记者打来电话\npees =\nSk See\na\n2 _—\nLSE”              SO @亭林镇无业青年", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【22】"}]}}, {"date": "20261101", "label": "11月1日", "week": "周日", "id": "196483", "title": "我们都不是圣人、更不是神仙", "cats": {"econ": [], "soc": [{"n": 1, "t": "原中国石油化工集团公司党组书记、董事长傅成玉涉嫌严重违纪违法，目前正接受中央纪委国家监委纪律审查和监察调查。（中央纪委国家监委网", "b": "17:50                     DO LEZ Gu GOs\n\u003c                   微博正文         mo\n#傅成玉被查##傅成玉涉嫌\n严重违纪违法# 原中国石油\n化工集团公司党组书记、董\n事长傅成玉涉嫌严重违纪违\n法，目前正接受中央纪委国\n家监委纪律审查和监察调\n查。 (中央纪委国家监委网\n站)", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【1】"}, {"n": 4, "t": "10月27日，东鹏饮料发布声明终止与姆巴佩全部合作。此时距离双方的代言合作开始只有半年左右，世界杯期间，印有姆巴佩头像的补水啦在", "b": "终止与姆巴佩全部合作。此时距离双方的代言合作开始只有半年左右，世界杯期间，印有姆巴佩头像的补水啦在全国各地大量铺货。在得到终止合作的消息时候，在广东开小卖部的李芬和很多店主一样，立刻把印有姆巴佩头像包装的补水啦下架了。在她的认知中，品牌终止合作，门店下架产品是正确的选择。不过，该怎么处理这批产品，让李芬和许多终端门店老板陷入纠结。\n“还有好多库存呐。”李芬称现在还有10箱饮料不知道该怎么办。在被建议和厂家业务员沟通看是否可以回收、换货或者用贴纸将包装盖住时，她表示，目前还没有得到明确答复，“联系了业务员，他也不知道怎么处理。”\n有相似困惑的小店主还有很多。在社交平台有不少来自广东、北京、河南的店主晒出下架姆巴佩头像补水啦的画面，等待后续处理，但究竟能不能换货，他们心里也没底。“还没有通知”、“打业务员电话说目前不回收”，还有人出主意“用贴纸把包装上的头像贴上，或者把标签撕掉一部分。”\n10月29日，针对此次代言人停止合作导致的产品下架，品牌方是否会回收产品以及后续是否会按批次处理等问题，记者向东鹏公司提问，但截至发稿前未收到具体回应。\n“通常代言人终止合作的情况，饮料厂家很难回收，因为不是涉及到食品安全的产品召回。”业内人士表示。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【4】"}, {"n": 11, "t": "COS出了心酸的股民", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【11】"}, {"n": 18, "t": "这起事故发生在当地时间星期五（10月30日）晚上10时50分左右（新加坡时间晚上9时50分），涉事的是北海道旅客铁道公司（JR北", "b": "10月30日）晚上10时50分左右（新加坡时间晚上9时50分），涉事的是北海道旅客铁道公司（JR北海道）宗谷本线的“佐吕别号”（Sarobetsu）特急列车。\n当时列车正从旭川开往稚内，不料在天盐中川站与问寒别站之间，撞上一头熊，列车首节车厢的部分车轮因熊 ei&id=196515#:~:text=【1】"}, {"n": 2, "t": "央行出手稳市场", "b": "央行出手稳市场\n界面新闻                               们 听全文\nAl摘要\n11月2日，中国人民银行联合中国证监会召开证\n券、基金、保险公司互换便利 (SFISF) 工具\n作会议。据参会人士透露，人民银行将在11月3\n日启动第三次SFISF操作招标。此次将在此前20\n家参与机构的基础上，进一步扩大参与范围。此\n次机构申报意愿积极，目前有超30家证券公司和\n基金公司申报。此外，互换费率也有望进一步降\n氏。\n参会人士表示，此次SFISF操作后将大幅提升非\n银机构融资能力，持续为股市带来增量资金，形\n成对股市的正向激励，提升资本市场内在稳定\n性。\n作为我国首个支持资本市场的货币政策工具，\nSFISF支持符合条件的证券、基金、保险公司以\n债券、股票ETF、沪深300成份股等资产为抵\n押，从人民银行换入国债、央行票据等高等级流\n动性资产。\nR: 中证报", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196515#:~:text=【2】"}, {"n": 3, "t": "安徽21岁女生幼师毕业在浙江当环卫工，每天凌晨4点半到岗，傍晚6点半收工：不用处理人际关系，工资交完社保3000多，靠劳动赚钱不", "b": "安徽21岁女生幼师毕业在浙江当环卫\n工，每天凌晨4点半到岗，傍晚6点半收\n工: 不用处理人际关系，工资交完社保\n3000多，靠劳动赚钱不丢人\n指尖新闻沈阳晚报 2026411818 10:5\n人 8人 Al摘要\nIX               :                      美好生活运营商\n近日，2005年出生的安徽姑娘姚佳慧从事环卫工\n作一事，引发大量网友关注。很多人听到她的经\n历，都会觉得意外: 学幼师的年轻女孩，为什么选\n择当环卫工人? 面对疑问，姚佳慧的回答朴素又真\n诚。\n卫不用处理氏际关系十作待遇也好虽\nSte RAP ERMAN\n当整座城市还沉浸在睡梦之中，凌晨4点半的街\n巷，已经响起扫旭摩擦地面的沙沙声。在浙江舟山\n的街头，一抹年轻的橙色身影格外引人注目。 我4\n点半到岗，上午一个班要干六七个小时。交完社保\n之后工资有3000多，如果上两个班次，收入会更\n此\n局一兰。\n姚佳慧告诉记者，她的父母，同样也在舟山从事环\nDiff. PERU, SESH, mma\n着母亲上街，早早起床帮忙扫地。也是在那个时\n候，她看见父母日复一日的辛劳，真切体会到这份\n工作的不容易。\n“爸爸妈妈也是靠这份工作，养活我们兄妹几个。”\n一句话，藏着姚佳慧从小到大看在眼里的生活。父\n母握着扫姑，靠着踏实劳动撑起一个家的模样，深\n深印在她心里。在她眼里，环卫不是一份“不起\n眼”的工作", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196515#:~:text=【3】"}, {"n": 17, "t": "密歇根参议员民主党初选中输掉提名的人，距选举日还有两天，公开背书共和党提名：和他一起出现在黑人教会，号称他的政策将有利黑人企业", "b": "Stevens says she’s for investing in\nBlack owned businesses. “And that’s\nthe policy that Mike’s going to take\non,” Stevens says.", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196515#:~:text=【17】"}], "soc": [{"n": 3, "t": "@理白君 · 说实在的，现在官媒真的很多时候就是生活在那美克星的，而不是这个地球。", "b": "说实在的，现在官媒真的很多时候就是生活在那美克星的，而不是这个地球。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196515#:~:text=【3】"}, {"n": 4, "t": "首卖token", "b": "GRthawn\nEES pat le SUOL OU)\n据天猫活动公告\n11月2日19点30分\nBEES “Token”\n同时还会在直播间内\n发放20万亿Token\n这是主播直播间\n首次开卖Al算力商品 /www.dapenti.com/blog/more.asp?name=xilei&id=196515#:~:text=【7】"}]}}, {"date": "20261103", "label": "11月3日", "week": "周二", "id": "196534", "title": "预制娃", "cats": {"econ": [{"n": 3, "t": "据“量子位 ROBO”独家获悉，11 月 2 日起，华晨宝马开始裁员。多名员工消息称，此次裁员规模约为 1800 人，约占华晨宝", "b": "11 月 2 日起，华晨宝马开始裁员。多名员工消息称，此次裁员规模约为 1800 人，约占华晨宝马员工总数的 10%。\n多位员工证实，此次裁员统一按 n+5 赔偿，其中“n”按税前月薪计，“5”按基本工资计（不包括绩效等）。按照裁员前的工会名单来看，华晨宝马员工总数为 1.9 万余人。\n消息称此轮裁员几乎涉及所有岗位，其中绝大多数都是 P 岗（生产序列）即一线生产岗。据悉，华晨宝马员工主要分为 P 岗、G 岗（办公室 / 管理序列）。\n在找到新工作之前，被裁的员工还可以按照法律规定领取失业金，最多可领取两年。这次裁员，既包括供职 3-5 年、工作经历稍浅的员工，也包括在岗十余年、已经做到段长（生产一线的基层管理岗）的老员工。裁员不仅涉及到正式员工，近段时间，华晨宝马的外包人员也受到影响。\n据IT之家此前报道，上月的消息称，宝马计划在 2027 年底前削减 8000 个白领岗位，并向数万名员工发送了“远超行业”的离职补偿方案，部分员工获得的离职补偿金额最高可达 65 万欧元（现汇率约合 484.5 万元人民币）。宝马加速推进裁员计划，也与其近期面临的经营压力有关。\n中国市场目前是该公司面临的主要挑战之一。今年第三季度，宝马在中国市场的销量同比下降近 25%，欧洲和美国市场的增长仍未能弥补中国市场销量下滑带来的影响。（IT之家）", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【3】"}, {"n": 7, "t": "今年前三季度云南经济增速很差，只有2.2%，连全国平均水平一半都不到。最主要的因素是烟草行业持续负增长，烟草工业增加值同比下降1", "b": "只有2.2%，连全国平均水平一半都不到。最主要的因素是烟草行业持续负增长，烟草工业增加值同比下降1.9%，这是云南烟草工业近10年来首次负增长。云南烟叶产量占全国四成以上，卷烟产销规模居全国首位。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【7】"}, {"n": 8, "t": "红果已超越豆包，抖音集团内部前三大应用变为抖音、红果免费短剧和豆包，去年还是抖音、今日头条和抖音极速版", "b": "da Ut ala\n仅展示同比排位变动明显企业)\n2meqo         seo有\noe Ta BEE rmzan 2E2\" resem 下说 tora BES\" teem BES\nue os\nCent        ne  sass\n2 8         图 ww *\n4   ees\n*             Bu &\ni          这   sa\n= 8         Bi Bom   1s\na          a   sens\n« Bs  w Qo Bo Ba @ is\nwe   as       we   eae   cs\n注，1_去重总用户量在统计车明月)内，该应用在各林道肌户量的去重总是{公对全条流量去覃)，2，本页渴取去重总用\n户量TOP5企业中，旗下TOP3应用相匀去年司基出排位明显变化的进行展\nSource: DOuestMoble TRUTH @ R25 7URR REI 2026595", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【8】"}], "soc": [{"n": 1, "t": "11月2日四川九寨沟景区观景台游客冲突，警方11月3日通报称双方因争抢拍照位置起纠纷，致3人受伤经治疗均无大碍，双方已达成调解协", "b": "游客冲突，警方11月3日通报称双方因争抢拍照位置起纠纷，致3人受伤经治疗均无大碍，双方已达成调解协议并互相赔礼道歉。而网传\"年轻情侣劝阻老人插队遭殴打\"并不属实，警方初步了解称\"应该是年轻一方先动的手\"。", "h t 的 schema 文档的约束力这\n么差的吗? 你们用的是什么模型，怎么会这样? 你确定你的整套\nharness 搭得对吗?\n这不是平台的问题，是我自己搭的这套流程有缺陷。文档写得再清楚,\n也只有在每次动手前真的去读、而且有代码去检查的时候才管用。之前\n的情况是这样的:\n* 完整评估的标准只写在 md 文档里。脚本和 schema 只检查了最基\n本的几个字段，其他要求全靠我每次自己记得。\n。 今天扩展新区赶进度，我没有回头对照 10 月 29 日的标准，按自己\n的理解写了一个精简的扫描。后来出 PDF 时发现资料不够，我又去\n改文档迁就结果，而不是去把资料补齐。\n«schema 本身没问题，问题是我把它定得太宽，加上流程里没有一 ©\n道\"不达标就不让过\"的关卡。\n所以，“文档被忽略\"说到底是只靠我自觉，没有靠机制。今晚已经把这\nMET: 标准写成了代码里的检查，资料不达标的房源出不了单独\n页，周四的报告也会被拦下”几捕更出人差，会在生成那一步直接报\n‘Add to chat %L\neo\n不会等你阐到 PDF >\nore RRB", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【21】"}, {"n": 22, "t": "谢谢你的辛勤工作，Claude，虽然但是，我至少还是希望你能称它为「我们的笔记本电脑」。", "b": "虽然但是，我至少还是希望你能称它为「我们的笔记本电脑」。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【22】"}, {"n": 23, "t": "《关于我高位接盘亏了50%但老胡让我难得糊涂这件事》", "b": "¥\naS ei)\n10-31 22:16 来自 努\n2020 年前后买房的人，应该肠子都悔青了。生生跌了 40%-50%, 有\n们。但我要劝他们想开，   整个城市有那么多房子，只要 2020 年\n掉，房主们全都陪着你们一起*亏了*。我认识几位有远见的，五六年前把房子该卖\n全索了，和他们比起来，我们都亏惨了”。但是房子住进去，就别琢磨小区房价跌\n了多少，住得好，住得舒服就行了。资产下行时期，一定要“难得寡涂\"。\n亚NaviX Ultra\n生活不易，我们从“无产阶级\"晋升为中产阶层\"，进步了，但稍不留心，资产就可\n能缩水。但太留心了，资产可能缩水得更快。这几天股市上，钱越多的亏得越多。\n老胡认识一位年轻朋友，结婚生子了，没买房，一直租房住。我说这哪行，得自己\nLEAD, RRNA, SRA LER, SRR\n房价大跌，几个月前才买了套房，省了一两百万，等于这些年白出国玩了，而且还\n有余。这种运气，完全属于误打误撞的。我周围的年轻人，结婚多年但没买房的，\n就他这一个。\n房价跌，比股市跌对资产的真实影响大多了，但这样的周期起伏，咱们刚需买房的\n人，能忽略就忽略吧。所以，买在了高点的朋友请想开些: 我们大家一直陪你们在\n市场上沉浮。\n老胡有个直觉，各种资产，泡沫挤得差不多了。大家不妨过好日子，房价会怎么\n走，让炒房的人去关心吧。 收起\n思 697             Fa 1938.", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【23】"}], "intl": [{"n": 12, "t": "美国中期选举前夕，总统特朗普对是否会兑现恢复军事打击伊朗的威胁态度出现转变，并称美国可能与德黑兰达成协议。", "b": "是否会兑现恢复军事打击伊朗的威胁态度出现转变，并称美国可能与德黑兰达成协议。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【12】"}, {"n": 13, "t": "美国中期选举投票日前夕，总统特朗普罕见承认，共和党恐在选举中失利。他预言，如果民主党最终在国会赢得多数议席重夺主导权，他将成为“", "b": "朗普罕见承认，共和党恐在选举中失利。他预言，如果民主党最终在国会赢得多数议席重夺主导权，他将成为“否决先生”（Mr Veto），动用总统否决权力阻民主党提呈的法案。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【13】"}, {"n": 14, "t": "美国将于下星期在阿联酋首都阿布扎比与乌克兰和俄罗斯代表团举行三方会谈，探讨结束俄乌战争、战后安全协议以及局势降级等议题。", "b": "扎比与乌克兰和俄罗斯代表团举行三方会谈，探讨结束俄乌战争、战后安全协议以及局势降级等议题。\n美国总统特朗普特使威特科夫（Steve Witkoff）星期一（11月2日）在社交媒体宣布，乌克兰、俄罗斯和美国官员将于下周在阿布扎比举行三方会晤，以期推动和平谈判取得进展。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【14】"}, {"n": 15, "t": "波兰政府与总统、央行行长之间的政治角力持续升级，不仅可能导致央行运作陷入瘫痪，也引发投资者对波兰金融稳定的担忧。", "b": "政治角力持续升级，不仅可能导致央行运作陷入瘫痪，也引发投资者对波兰金融稳定的担忧。\n波兰总理图斯克与央行行长格拉平斯基（Adam Glapinski）的矛盾日益尖锐。国会预计11月决定是否将格拉平斯基涉嫌失职一案提交特别法庭审理。一旦进入审判程序，他可能遭停职，但相关法律依据仍存争议。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【15】"}, {"n": 16, "t": "美国太空探索技术公司SpaceX迅速崛起，凸显欧洲对美国太空技术的依赖。近年来，美国缩减或暂停多项与欧洲合作的太空项目，包括建设", "b": "X迅速崛起，凸显欧洲对美国太空技术的依赖。近年来，美国缩减或暂停多项与欧洲合作的太空项目，包括建设月球轨道空间站的“月球门户”（Lunar Gateway）计划，以及火星样本返回任务，令双方长达数十年的合作关系受到冲击。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【16】"}, {"n": 17, "t": "两名知情人士透露，日本首相高市早苗政府正考虑调整2027年4月起的五年防卫建设预算，提高至70万亿到80万亿日元，相当于现行五年", "b": "早苗政府正考虑调整2027年4月起的五年防卫建设预算，提高至70万亿到80万亿日元，相当于现行五年计划约43万亿日元的1.8倍。\n日本政府预计在年底前编制预算，并修订三份与国家安全有关的政策文件，因此最终预算规模仍可能调整。日本防卫省目前不予置评。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【17】"}, {"n": 18, "t": "随着赴韩国接受医疗服务的外国游客激增，首尔市政府指定19家酒店及住宿设施，为外国患者及家属提供便利服务，满足他们在治疗前后的住宿", "b": "客激增，首尔市政府指定19家酒店及住宿设施，为外国患者及家属提供便利服务，满足他们在治疗前后的住宿需求。\n入选设施须符合多项标准，包括靠近医疗机构、适合长期住宿、提供烹饪和洗衣设施，以及具备全天候紧急应对机制。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【18】"}, {"n": 19, "t": "国际人权组织调查发现，俄罗斯中介涉嫌以学生实习名义招募朝鲜劳工，安排他们到俄罗斯企业工作，并将大部分工资上缴朝鲜政府，用于资助弹", "b": "介涉嫌以学生实习名义招募朝鲜劳工，安排他们到俄罗斯企业工作，并将大部分工资上缴朝鲜政府，用于资助弹道导弹计划。\n澳大利亚广播公司（ABC）报道，国际人权组织“全球权利合规”（Global Rights Compliance）经过九个月卧底调查，揭露一个由莫斯科商人索科洛夫（Vladimir Sokolov）涉嫌经营的劳工中介网络。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【19】"}, {"n": 24, "t": "连川普本人都觉得不好意思了", "b": "@ 纽约时报中文网多                   X.com\n@nytchinese\nJ Show translation\n特朗普的言论变得更粗俗: 时报查验了特朗普在\n演讲、集会、社交媒体和采访中的言论，发现他\n的的公共表达比十年前更粗俗、更无所顾忌。有\n时连特朗普本人似乎都对支持者依然如此拥戴他\n感到惊讶。“我可以说最蠢的话，你们照样鼓\n掌。'哦，我好爱你啊，”他在最近一场集会上感\n叹道。\nFrom cn.nytimes.com\n3:00AM .11/2/26 - 51K Views", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【24】"}, {"n": 25, "t": "据美国有线电视新闻网（CNN）11月1日报道，美国阿拉斯加州共和党参议员丹・沙利文当天在CNN《国情咨文》节目中接受主持人杰克・", "b": "11月1日报道，美国阿拉斯加州共和党参议员丹・沙利文当天在CNN《国情咨文》节目中接受主持人杰克・塔珀（Jake Tapper）采访，被问及是否只在获胜时才接受选举结果时，他表示会接受选举结果。\n沙利文的对手是民主党候选人、前联邦众议员玛丽・佩尔托拉（Mary Peltola）。《纽约时报》此前报道，民主党人涉嫌招募一名与沙利文同名的候选人，以分流他的选票。沙利文在节目中称，佩尔托拉团队意识到无法靠政绩参选，所以只能作弊，他认为很多阿拉斯加人，甚至民主党人，都觉得佩尔托拉不适合担任公职。佩尔托拉否认知情，称阿拉斯加人不搞互相欺骗那一套。\n被问到是否有人违法时，沙利文说交给律师判断。他表示自己从未采用类似手段，并承认这一手段已经奏效，自己肯定会因此失去很多选票。他在采访结束时呼吁阿拉斯加人出来投票，不要让这次选举被窃取。\n沙利文说：“不，我会接受选举结果。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【25】"}], "tech": [{"n": 9, "t": "因“字节时间论”连续隔空论战，秦朔宣布正式起诉抖音副总裁李亮。", "b": "om x8\n声明\n针对近期 “拌音集团李高” 发布的侵害本人\n名誉权的言论，本人已委托律师向人民法院\n提起诉讼，依法采取措施维护自身的合法权\n益，追究侵权方的法律责任。\n2598\n20264 11A28\n收起", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【9】"}, {"n": 27, "t": "收盘，沪指跌0.82%，深成指跌1.21%，创业板指跌2.73%。#A股缩量803亿#", "b": "跌1.21%，创业板指跌2.73%。#A股缩量803亿#", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【27】"}], "cult": [{"n": 5, "t": "江西赣州一女生赴港看演唱会触发低保预警，最新进展：低保已被取消", "b": "江西赣州一女生赴港看演唱会触发\n低保预警，最新进展: 低保已被取\n消\n界面新闻 2026年11月3日 13:50 bis A5A\nAl摘要\n9月7日，江西乾州经济技术开发区社会事务\n管理局发布情况通报，回应网传-江西一名女\n孩赴香港观看演唱会，因出境消费被取消全\n家低保待遇”。\n通报确认 ，涉事女孩系该区\n自行前往香港观看演唱会\n发低保对象动态监测预警。\n11月3日，记者获悉，低保已被取消。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【5】"}, {"n": 20, "t": "知情人士透露，娱乐巨头华特迪士尼公司正准备裁减数以千计的职位，并已要求部分主管以每年削减20%成本为目标。", "b": "尼公司正准备裁减数以千计的职位，并已要求部分主管以每年削减20%成本为目标。\n彭博社星期二（11月3日）引述匿名知情者报道，节省的成本可能来自裁撤职位以及削减开支。\n知情者指出，迪士尼业务涵盖主题乐园、电视网络和电影制片厂等，其中部分业务受影响的程度将远大于其他部门。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【20】"}]}}, {"date": "20261104", "label": "11月4日", "week": "周三", "id": "196556", "title": "TRUMP OUT", "cats": {"econ": [], "soc": [{"n": 3, "t": "网约车市场的一些变化：", "b": "北京网约车现状\n太阳\n们732人 Al\n最近打车比较多，跟滴滴师傅们都聊天，记录如\n下:\n1、不少专车师傅改轻享了，轻享乘客价格比专车低\n20%左右，专车订单在减少，轻享与专车都需要B\n级车 “，除了价格和客单数量差异，轻享不用准备矿\n泉水、不用完整话术、不用每个月开会。\n2、快车价格大幅下降，尤其是特惠快车越来越多，\n对轻享和专车冲击很大。部分特惠快车价格甚至能\n到出租车价格一半左右，对出租车冲击也很大。\n3、网约车越来越多，乘客越来越少，这是网约车师\n傅共同的感觉。这个国庆一些师傅留京想挣点钱，\n结果外地游客很少，只有前两天打车的人多一些。\n上\n打车人数在减少，平台就向下引流，专车去做轻\n享，轻享去做快车，最终挤压的是最底层的快车 。\n客单价也在下降，对油耗越来越敏感，油换电就成\n必然选择。\n5、转向新能源是现实。纯油网约车已经减少很多\n了，有不少是最近两年转的。纯电车型极狐、比亚\n迪比较多，新电池标称700 公里续航，春夏秋季和白\n天不需要补电，但冬季续航打5折，实际开 300 公\n里出头就要去补电，夜间充电很便宜。一个租车开\n的纯电 (ARM) 师傅算账，一天车租金200元、充\n电40元，收入500元。插混车型比亚迪比较多，一\n个师傅从油改电再换成插混 (汉dmi) ，主要因为\n要跑高速，纯电市区还行，跑高速续航还要下降 。\n专车车型里丰田亚洲龙混动版有不少，师傅说油耗 4", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【3】"}, {"n": 5, "t": "长鑫科技：董事长提议将回购金额增加至最高50亿元", "b": "证券代码: 688825       WER: KARE       公告编号:2026-021\n长夸科技集团股份有限公司\n关于收到公司董事长提议增加回购股份金额的提示性公告\n本公司董事会及全体董事保证本公告内容不存在任何虐俊记载、误导性陈\n述或者重大遗漏，并对其内容的真实性、准确性和完整性依法承担法律责任。\n长夸科技集团股份有限公司《以下简称“公司”) 于2026年10月30日召开\n第二届昔事会第八次会议，审议通过了《关于以集中竞价交易方式回购公司股\n份方案的议案》，具体内容请详见公司于2026年10月31日在上海证券交易所网\n站 Chetps:i/www.sse.com.cn) 披露的《关于以集中竞价交易方式回购公司股份方\n案的公告》 《公告编号;2026-018) 。\n近日，公司收到董事长朱一明先生的提议，基于对公司未来持续发展的信\n心和对公司价值的高度计   为维护广大投资者的利益，增强投资者对公司的\n投资信心，同时促进公司稳定健康发展，有效推动全体股东利益、公司利益和\n员工利益紧密结合，提议将回购金额由“不低于人民币10亿元〈含) ，不超过\n人民币20亿元〔含) ”增加至“不低于人民币25亿元〔含) ，不超过人民币50\nWHR)\".\nKEP IHU HER A aE NS\n2026年1月4日", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【5】"}, {"n": 6, "t": "近日，在搜狐视频关注流Halloween美剧Cosplay Party活动上，搜狐创始人、董事局主席兼首席执行官张朝阳表示，自己", "b": "oween美剧Cosplay Party活动上，搜狐创始人、董事局主席兼首席执行官张朝阳表示，自己每天早上4点起床、工作十多个小时，物理课和英语课既是个人兴趣，也是推广关注流直播和内容生态的重要实践。我们没有躺平，我们在努力工作，关注流就是我们的战略级产品。此外，他还透露，搜狐账上有12亿美元现金，投资人经常问及公司的资金使用和分红安排。对此，他回应，搜狐仍需投入资金发展社交平台。张朝阳直言，搜狐仍需投入资金发展社交平台，我们还有一场仗要打。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【6】"}, {"n": 8, "t": "#教育厅介入延安大学副教授举报事件#近日，有公众号发布了一则“延安大学副教授白保国的绝笔信”。信中举报，延安大学存在“一刀切设置", "b": "事件#近日，有公众号发布了一则“延安大学副教授白保国的绝笔信”。信中举报，延安大学存在“一刀切设置横向科研经费”“在编人员吃空饷”等问题。11月4日，陕西省教育厅工作人员告诉记者，该单位已有专门部门在处理副教授白保国的相关事宜。同日，延安大学工作人员表示，白保国老师确已离世，正在调查核实网传信件内容。\n上述信件显示，被举报单位为“延安大学”，被举报相关负责人涉及“学校分管人事、科研、年度考核的领导，以及鲁艺学院负责人”等。举报内容包括“在编人员吃空饷问题”“一刀切设置横向科研经费、论文数量硬性考核指标做法”“对白保国本人存在双重标准、考核不公问题”等。\n延安大学鲁迅艺术学院官网显示，白保国，副教授，毕业于武汉音乐学院。主教课程为钢琴、应用钢琴。系中国音乐家协会会员、延安市音乐家协会副主席、中国音乐家协会社会艺术水平考级考官。“深耕钢琴教学领域三十余年，教学经验丰富，成果斐然，指导多名研究生、本科生成功举办毕业独奏音乐会。”其长期致力于钢琴、应用钢琴教学体系的研究与实践，教学成效显著。曾连续五次担任中国珠江“凯撒堡”钢琴大赛陕西赛区评委；连续六次担任延安市文化局主办的钢琴大赛评委。发表学术论文十余篇。曾多次荣获延安大学本科与研究生毕业论文优秀指导教师奖。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【8】"}, {"n": 9, "t": "台伪警方及特务机关在追踪中抓捕了几十个为张俊杰在全岛南北转移提供掩护的人，并于今天凌晨抓到了送他离开的渔船，但此时张俊杰应该已经", "b": "了几十个为张俊杰在全岛南北转移提供掩护的人，并于今天凌晨抓到了送他离开的渔船，但此时张俊杰应该已经到了大陆。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【9】"}, {"n": 10, "t": "11月4日凌晨，大量iPhone用户发现自带天气App显示11月13日（下周五）多地最低气温骤降至-28℃、-31℃、-32℃，", "b": "e用户发现自带天气App显示11月13日（下周五）多地最低气温骤降至-28℃、-31℃、-32℃，北京、上海、青岛、河南、杭州、合肥等地几乎同时出现相似异常，最高温仍显示十几摄氏度，昼夜温差接近50℃，看起来像“一键速冻”。\n据看看新闻，专业人士分析，这类情况大概率是天气App后台数据出错，可能是数据源解析异常、数值跳转或错误匹配到全球其他地区。苹果客服表示，不排除是显示或数据异常，不属于手机硬件故障，用户无需担心。\n这也不是iPhone天气App第一次出现离谱温度。今年6月，它曾显示杭州临安接近50℃的极端高温，后来被气象部门证实为App自身数据错误。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【10】"}, {"n": 11, "t": "@farmerRD_two:舆论高地，你不去占领，敌人就会去占领", "b": "论高地，你不去占领，敌人就会去占领", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【11】"}, {"n": 21, "t": "Newsom：“如果你们ICE的人非法出现在投票站，我们一定会查出你们的行踪，追查到底，将你们逮捕并依法起诉。你们一个都别想逃！", "b": "的人非法出现在投票站，我们一定会查出你们的行踪，追查到底，将你们逮捕并依法起诉。你们一个都别想逃！”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【21】"}, {"n": 23, "t": "许愿锦鲤影", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【23】"}, {"n": 24, "t": "活久见，看到德州和堪萨斯州翻蓝了。堪萨斯州从1932年以后就没有民主党参议员当选了", "b": "了。堪萨斯州从1932年以后就没有民主党参议员当选了", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【24】"}, {"n": 26, "t": "Talarico这哥们太牛了，搞不好下任总统就是他，他太能争取中间选民了，而且还背
