<style>
  :root{
    --paper:#F5F4EF; --card:#FFFFFF; --ink:#20242B; --ink-2:#5A5F68; --line:#E2E0D8;
    --blue:#2662B8; --green:#12805E; --red:#C0443B; --purple:#6A48B0; --amber:#B07A1E;
    --blue-soft:rgba(38,98,184,.06); --green-soft:rgba(18,128,94,.06);
    --red-soft:rgba(192,68,59,.06); --purple-soft:rgba(106,72,176,.06); --amber-soft:rgba(176,122,30,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
  .wrap{max-width:800px;margin:0 auto;padding:0 20px}
  a{color:inherit}
  ::selection{background:rgba(176,122,30,.25)}

  /* 报头 */
  .masthead{background:var(--ink);color:#F5F4EF}
  .masthead-inner{max-width:840px;margin:0 auto;padding:34px 20px 30px}
  .brand-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand{font-family:"Noto Serif SC",serif;font-weight:900;font-size:26px;letter-spacing:.12em}
  .brand .dot{color:var(--amber)}
  .slogan{font-size:13px;color:#A9AEBB;letter-spacing:.08em}
  .issue-date{font-size:13px;color:#8C93A3;letter-spacing:.2em;margin-top:6px}
  .issue-title{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(24px,4.6vw,36px);line-height:1.4;margin:16px 0 4px;color:#fff}
  .issue-sub{font-size:13px;color:#8C93A3}

  /* 日期切换 */
  .daybar{background:#1B1E24;border-top:1px solid rgba(255,255,255,.1)}
  .daybar-inner{max-width:840px;margin:0 auto;padding:12px 20px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#A9AEBB;border-radius:8px;padding:8px 6px 6px;cursor:pointer;font-family:inherit;transition:all .15s}
  .day-btn b{display:block;font-size:13px;font-weight:600;color:#E7E9EE}
  .day-btn span{font-size:11px;color:#8C93A3}
  .day-btn:hover{background:rgba(255,255,255,.14)}
  .day-btn.active{background:var(--amber);border-color:var(--amber);color:#20242B}
  .day-btn.active b{color:#20242B}
  .day-btn.active span{color:#20242B}

  /* 导航 */
  .section-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .nav-inner{max-width:840px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .nav-inner::-webkit-scrollbar{display:none}
  .nav-inner a{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink-2);padding:5px 12px;border-radius:999px;transition:all .15s}
  .nav-inner a:hover{background:var(--line);color:var(--ink)}
  .nav-inner a i{width:8px;height:8px;border-radius:50%;background:var(--nc)}
  .to-top{margin-left:auto;color:var(--ink-2);font-size:13px;text-decoration:none;padding:5px 10px;border:1px solid var(--line);border-radius:999px;flex-shrink:0}
  .to-top:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* 主题板块 */
  main{padding:36px 0 20px}
  section.panel{margin-bottom:56px;scroll-margin-top:64px}
  .panel-head{display:flex;align-items:center;gap:16px;margin-bottom:4px}
  .panel-mark{width:46px;height:46px;border-radius:10px;background:var(--sec);color:#fff;font-family:"Noto Serif SC",serif;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .panel-title{font-family:"Noto Serif SC",serif;font-weight:700;font-size:clamp(20px,3.2vw,24px);color:var(--sec)}
  .panel-title span{font-size:13px;color:var(--ink-2);font-family:"Noto Sans SC",sans-serif;font-weight:400;display:block;margin-top:2px}
  .panel-line{height:2px;background:var(--sec);opacity:.25;margin:14px 0 20px}

  /* 条目 */
  .items{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sec);border-radius:0 8px 8px 0;padding:12px 15px;transition:background .18s;break-inside:avoid;cursor:pointer;position:relative}
  .item:hover{background:var(--sec-soft)}
  .item-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .item-head .src{flex-shrink:0}
  .item .src{font-size:11.5px;font-weight:500;letter-spacing:.05em;opacity:.95}
  .item h3{font-family:"Noto Serif SC",serif;font-weight:700;font-size:14.5px;line-height:1.45;margin:2px 0 4px}
  .item p.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;font-size:12.8px;color:#4A4F58;line-height:1.6}
  .item p.full{font-size:12.8px;color:#4A4F58;line-height:1.6}
  .item.has-more::after{content:"… 点击查看全文";position:absolute;right:10px;bottom:6px;font-size:11px;color:var(--sec);background:linear-gradient(90deg,transparent,var(--card) 30%);padding:2px 6px 2px 14px;pointer-events:none}
  .item.has-more p.clamp{position:relative}
  .src-link{font-size:11px;color:var(--ink-2);text-decoration:none;white-space:nowrap;border-bottom:1px dashed var(--line);transition:color .15s,border-color .15s;position:relative;z-index:2}
  .src-link:hover{color:var(--sec);border-color:var(--sec)}
  .item.full{grid-column:1/-1}
  .src-mon{color:var(--blue)} .src-tue{color:var(--green)} .src-wed{color:var(--purple)} .src-thu{color:var(--red)}
  .src-fri{color:var(--amber)} .src-sat{color:#3E7D8C} .src-sun{color:#2F6B7A}

  /* 全文弹层 */
  .modal-mask{position:fixed;inset:0;background:rgba(20,22,28,.62);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .18s}
  .modal-mask.open{opacity:1;visibility:visible}
  .modal{background:var(--paper);max-width:640px;width:100%;max-height:82vh;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;transform:translateY(10px);transition:transform .18s}
  .modal-mask.open .modal{transform:translateY(0)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
  .modal-tag{font-size:12px;color:var(--sec);font-weight:600;letter-spacing:.06em}
  .modal-close{background:none;border:none;font-size:22px;line-height:1;color:var(--ink-2);cursor:pointer;padding:4px 8px;border-radius:6px}
  .modal-close:hover{color:var(--ink);background:var(--line)}
  .modal-body{overflow-y:auto;padding:18px 20px 22px}
  .modal h3{font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px;line-height:1.5;margin-bottom:12px}
  .modal p{font-size:14.5px;line-height:1.9;color:#33363D;white-space:pre-wrap;word-break:break-word}
  .modal-src{margin-top:16px;font-size:12.5px}
  .modal-src a{color:var(--sec);text-decoration:none;border-bottom:1px dashed var(--line)}

  /* 页脚 */
  footer{background:var(--ink);color:#A9AEBB;margin-top:20px}
  .footer-inner{max-width:840px;margin:0 auto;padding:30px 20px;font-size:13px;line-height:1.9}
  .footer-inner a{color:#F5F4EF;text-decoration:none}
  .footer-inner a:hover{color:var(--amber)}
  .footer-inner .src{color:#8C93A3}
  .footer-links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 18px;margin:10px 0 14px}
  .footer-links div{display:flex;align-items:baseline;gap:8px;min-width:0}
  .footer-links .src{flex-shrink:0}
  .footer-links a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.item,.nav-inner a,.day-btn{transition:none}}
  @media (max-width:720px){
    .daybar-inner{grid-template-columns:repeat(4,1fr)}
    .items{grid-template-columns:1fr}
    .footer-links{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
</style>

: "克里姆林宫外交政策助理乌沙科夫星期三（10月21日）说，普京当天在圣彼得堡与美国特使威特科夫会谈近三小时，表明俄方原则上愿意下个", "b": "星期三（10月21日）说，普京当天在圣彼得堡与美国特使威特科夫会谈近三小时，表明俄方原则上愿意下个月重启旨在结束俄乌战争的谈判。这将是三方自今年2月以来首次恢复和谈。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【11】"}, {"n": 12, "t": "特朗普的“让美国再次伟大”（MAGA Inc）超级政治行动委员会至今已为中期选举投入超过3亿美元，并通过直接拨款或其他政治行动委", "b": "AGA Inc）超级政治行动委员会至今已为中期选举投入超过3亿美元，并通过直接拨款或其他政治行动委员会，把最多资金投向得克萨斯州、密歇根州和俄亥俄州的参议院选战。\n这三个席位对共和党能否继续掌控参议院至关重要。共和党目前在参议院以53席对47席占多数。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【12】"}, {"n": 13, "t": "威特科夫感谢普京释放哈伯德，并称普京是一名“人道主义者”。这番言论引起美国共和党和民主党议员强烈批评。俄罗斯自2022年全面入侵", "b": "称普京是一名“人道主义者”。这番言论引起美国共和党和民主党议员强烈批评。俄罗斯自2022年全面入侵乌克兰以来，一直受到美国和欧洲国家谴责。\n美国总统特朗普近期对莫斯科释放善意，包括达成购买俄罗斯柴油的协议，以及豁免新的制裁措施，已引起美国国会两党议员反弹，也令欧洲各国首都感到担忧。\n美国特使访俄，俄释放一名被关押的美国公民\n记者：放人有什么条件\n\n总统：你是个蠢货，你们ABC News是最烂的台\n\n\n\n特使：俄总统是出于“人道主义”\n\n总统在白宫：如果我实施了制裁，他现在肯定出不来", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【13】"}, {"n": 14, "t": "国际能源署署长比罗尔警告，受中东局势持续动荡及能源供应链受阻影响，全球能源市场在2027年恐仍难恢复正常。", "b": "东局势持续动荡及能源供应链受阻影响，全球能源市场在2027年恐仍难恢复正常。\n比罗尔星期二（10月20日）在伦敦出席《金融时报》能源转型峰会时说，他看不出有什么可靠的途径，能让全球能源市场在2027年恢复正常，并警告霍尔木兹海峡仍可能再次关闭。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【14】"}, {"n": 15, "t": "美国副总统万斯表明，不会跟随总统特朗普公开支持以色列总理内坦亚胡，强调自己无意介入以色列选举，将专注于美国中期选举。万斯对以色列", "b": "统特朗普公开支持以色列总理内坦亚胡，强调自己无意介入以色列选举，将专注于美国中期选举。万斯对以色列选举保持距离，与他此前对待欧洲选举的做法形成对比。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【15】"}, {"n": 16, "t": "马克龙星期三（10月21日）告诉记者，部分外国领导人针对法国骚乱发表既“不可接受又愚蠢”的言论，试图借法国局势为自身选举造势。", "b": "诉记者，部分外国领导人针对法国骚乱发表既“不可接受又愚蠢”的言论，试图借法国局势为自身选举造势。\n特朗普近日在美国为共和党中期选举造势时，将法国骚乱归咎于移民、圣战分子及共产主义者。他星期二（20日）也公开赞扬法国极右翼领袖勒庞。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【16】"}, {"n": 17, "t": "印度尼西亚总统普拉博沃星期二（10月20日）迎来执政两周年纪念日，但多份最新民调显示他的民望已跌至就任以来的新低，全国多地更是爆", "b": "10月20日）迎来执政两周年纪念日，但多份最新民调显示他的民望已跌至就任以来的新低，全国多地更是爆发抗议示威集会。\n法新社报道，学生团体与人权组织在首都雅加达、爪哇岛的万隆与日惹、苏门答腊的北干巴鲁以及南苏拉威西省的望加锡等城市同时走上街头，抗议政府在应对林火和贪腐问题上的无能与迟缓。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【17】"}, {"n": 18, "t": "美国国务卿鲁比奥说，乌克兰能否使用星链服务，应由星链母公司SpaceX及其创办人马斯克决定，而非白宫。", "b": "使用星链服务，应由星链母公司SpaceX及其创办人马斯克决定，而非白宫。\n《华尔街日报》星期二（10月20日）报道，马斯克下令限速乌克兰使用星链军用版本。乌克兰依赖这项服务抵御俄罗斯的导弹袭击。\n美国国务卿卢比奥回应有关星链、星盾及马斯克决策的报道时表示，特朗普和美国政府从未要求改变相关系统，也无法指示私营公司如何使用自己的技术。\n卢比奥：“我知道这一点，但你提到的具体情况，我并不了解。不过，星链是一家私营公司。\n\n他们签有合同，合同规定了相关技术的使用方式。重要的是，我们不能命令私营公司做什么，或者不做什么。\n\n我可以明确告诉你，美国总统以及政府中的任何人，都从未要求对这个系统进行任何改变。我们已经反复说明过这一点。\n\n我不知道报道中具体说了什么，但事实就是如此。”\n\n记者：“你不能因为总统没有要求马斯克这么做，就断定他们没有讨论过这件事。”\n\n卢比奥：“我再说一遍，星链、星盾以及马斯克做出的决定，与总统没有任何关系。星链是一家私营公司，总统不管理这家公司，也不能命令这家公司做任何事情。\n\n据我所知，没有任何人事先知情，我也没有掌握任何人事先知情的信息。”\n\n记者：“但报道讨论的并不是有没有人事先知情。”\n\n卢比奥：“我告诉你，没有人事先知情。除此之外，即便有人事先知情，我们也无法控制一家私营公司如何决定使用自己的产品。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【18】"}, {"n": 21, "t": "Financial Times 独家报道：北约即将同意，乌克兰通过北约内部系统采购武器和装备，速度更快、费用更低", "b": "FT Exclusive: A new agreement could\nallow Kyiv to obtain weapons,\nammunition and military equipment\nfaster and more cheaply via Nato’s\ncentralised procurement agency\nft.trib.al/           Fc\n=,\nUkraine to buy military\nsupplies via Nato agency", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【21】"}, {"n": 23, "t": "一条在韩国釜山港口运河逗留超过一个月、吸引逾160万人前来围观的鲨鱼，经过两次救援失败后，终于在星期三被成功引导返回大海。", "b": "一个月、吸引逾160万人前来围观的鲨鱼，经过两次救援失败后，终于在星期三被成功引导返回大海。\n路透社报道，韩国海洋水产部星期三（10月21日）证实，这条被昵称为“小北港”（Bukangi）的鲨鱼已顺利游出釜山北港的狭窄水道，重返开放海域。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【23】"}, {"n": 24, "t": "全球集装箱吞吐量最大的港口", "b": "Los Angeles\nSuzhou\nBeibu Gut\nHo Chi inh City 国\n1 York Jersey SSD\nKaohsiung           en\nmnda 8.4\nHal Phong 的JE\nHanbury SSD\nTanjung Prick yl 3H\nColombo (ES\nJawaharlal Nebru 9) /007.5H\nGooner\n‘Source: nyt Top 0 Pats 2\nContainers handled in 2025 (20-foot equivalents)\nn 2025, the top 30 ports\nhandled over hl bili\n2-feot containers worth\nte teifer se tan en Fyne ci ot sain nor LAS ten ead GE", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【24】"}, {"n": 25, "t": "川普宣布把大西洋改名川普洋的尝试失败", "b": "我打电话给 Google Maps，要求把大\n西洋改名为特朗普洋。\n又达尔说:“不，不，不。这次我不\nFY. \"他说:“海洋不一样，先生。\n它们覆盖了很多国家。请不要让我们\n做这个。”\n所以我们可能过不了这一关。我们还\n是保持大西洋这个名字吧。\n评价此翻译: 办 外", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【25】"}, {"n": 26, "t": "CNBC报道：美国驻沙特使馆开始撤离员工和家属，因为美以军方在筹划，中期选举结束后，继续炸伊朗", "b": "The move comes as the U.S. and Israeli\nmilitaries have drawn up specific plans\nfor renewed strikes on Iran after next\nmonth’s midterm elections: cnb.cx/\n4dMutxq\nU.S. pulls diplomats\nfrom Saudi Arabia as it\nreportedly readies\nIran strikes after midterms\nCRBC", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【26】"}], "tech": [{"n": 3, "t": "大跌之下，A股千元股又少1只，只剩2只了", "b": "=\nSLE aonaunawn =F\n代码\n600519\n688808\n688498\n688256\n300308\n688826\n002371\n688836\n688072\n301716\n名称\n贵州茅台\n联讯仪器\n源术科技\n寒武纪\n中际刘创\nsR\n北方华创\nFAN...\n拓草科技\nEi\n© SAN\n1310.47\n1113.68\n949.23\n895.17\n604.39\n597.00\n551.02\n524.00\n515.01\n503.04\non eww &\noe oe 来", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【3】"}, {"n": 6, "t": "彭博社 10 月 21 日独家报道，DeepSeek 在最新一轮融资中筹到约 1000 亿元人民币，约合 150 亿美元，是中国", "b": "报道，DeepSeek 在最新一轮融资中筹到约 1000 亿元人民币，约合 150 亿美元，是中国有史以来规模最大的融资之一。消息来自不愿具名的知情人士，DeepSeek、腾讯和宁德时代都还没有公开确认。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【6】"}, {"n": 19, "t": "马斯克想把“地球上的智能”和“宇宙里的梦想”彻底缝合在一起。如果成了，这就是人类历史上前所未有的科技巨无霸。但如果不成，这颗包含", "b": "宇宙里的梦想”彻底缝合在一起。如果成了，这就是人类历史上前所未有的科技巨无霸。但如果不成，这颗包含了地缘、技术与资本的“超级炸弹”，也随时可能带来巨大的震荡。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【19】"}, {"n": 20, "t": "Politico 10 月 20 日披露：众议院民主党人正在排兵布阵，若 11 月 3 日中期选举夺回众议院，就用委员会主席的传", "b": "0 日披露：众议院民主党人正在排兵布阵，若 11 月 3 日中期选举夺回众议院，就用委员会主席的传票权全面调查马斯克――目标包括他执掌 DOGE 的旧账（一位民主党议员称之为“原罪”）、其公司拿联邦合同的利益冲突（SpaceX 的 NASA 与国防合同），以及他在限制乌军星链接入一事中的角色。\n民主党众议员 Zoe Lofgren 说马斯克的“利益冲突多得惊人”，监督委员会成员 Greg Casar 直言马斯克“就在那份名单上”。目前预测普遍看好民主党至少拿下众议院。\n马斯克的底气和软肋是同一件事：钱。他是本选举周期共和党最大金主，7 月以来已砸下 2.76 亿美元（其中 1.58 亿给参议院领袖基金），正全力阻击民主党翻盘；但他同时又是联邦合同的大户，DOGE 期间主导裁撤近 30 万联邦雇员。\nFox Business 把这条帖子的标题定为《马斯克称将报复调查他的民主党人》――一方说这是选前恐吓选民的金主，一方说这是被政治追杀的企业家。真正决定这场仗打不打的，是 13 天后的众议院归属。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【20】"}, {"n": 22, "t": "这起诉讼的源头可追溯至轰动全球的“剑桥分析”数据丑闻。当地陪审团认定，Meta在数据隐私保护、打击虚假信息及遏制仇恨言论等举措上", "b": "的“剑桥分析”数据丑闻。当地陪审团认定，Meta在数据隐私保护、打击虚假信息及遏制仇恨言论等举措上严重误导了Facebook用户，违反该州不公平竞争及消费者保护法规近4400万次。\n法官此前一度开出高达2194亿美元的惊人罚单，随后核减至250亿美元；新墨西哥州总检察长直言，这是美国历史上针对单家公司开出的最大单笔罚单之一。按照该州法律，这笔罚款将全额注入当地教育基金。\n面对判决，Meta首席法务官强硬回应，称该裁决让公司几乎无法在当地开展业务，指责这实质上是在变相征收“言论税”，并明确表态将继续上诉。\n而就在判决公布前两个月，Meta才刚刚因Instagram算法致瘾、侵害青少年心理健康等指控，与全美52位州总检察长达成了180亿美元的巨额和解协议。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【22】"}, {"n": 29, "t": "段永平讲他2011年大举买入苹果股票的契机：", "b": "果股票的契机：\n「当时苹果的市值只有大约3000亿，但净现金有1000亿。当时一年已经赚到150-160亿美金了。我看到的是，苹果未来的利润一定会到500亿/年或者更多。当时苹果犯了一个小错，迟迟不肯推出打大屏手机，所以有大概三年的时间里苹果的股价都一直处于低位。我在这三年多的时间里，从计划投10%到最后投到了95%以上，几乎把手里所有的其他股票都换成了苹果。我绝对不是在赌哈，是真的理解这家公司的。这种机会不会经常来，但意识到这种机会的时候，能够下重注是非常重要的。」", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【29】"}], "cult": []}}, {"date": "20261023", "label": "10月23日", "week": "周五", "id": "196310", "title": "终身负责", "cats": {"econ": [{"n": 1, "t": "前三季度，全国一般公共预算收入172292亿元，同比增长5.1%。其中，全国税收收入140706亿元，同比增长6.1%；非税收入", "b": "172292亿元，同比增长5.1%。其中，全国税收收入140706亿元，同比增长6.1%；非税收入31586亿元，同比增长1.2%。分中央和地方看，中央一般公共预算收入76699亿元，同比增长8.3%；地方一般公共预算本级收入95593亿元，同比增长2.7%。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196310#:~:text=【1】"}, {"n": 7, "t": "财新：德勤负责个税业务的人士告诉财新，有的客户甚至卖掉了离岸黄金来补税", "b": "一位在德勤负责个税业务的人士告诉\n财新，她的团队所负责的客户几乎也\n都完成了离岸信托的个向补缴, “我\n们一直加班到22日深夜，有的客户其\n至卖掉了离岸黄金来补秘。”\n© 财新 &\n离岸信托补税过渡期结束 富豪企业家\n都完税了吗?", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196310#:~:text=【7】"}, {"n": 23, "t": "中国的一二三四线城市，等级越低的城市 赚取大陆发展红利，一边与“台独”分裂势力勾连纠缠，做“两面人”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【5】"}, {"n": 8, "t": "多地幼儿园改为养老院", "b": "多地幼儿园改为养老院\n第一财经\n们 1.6万人\nAl摘要\n2026.10.25\n本文字数: 1408，阅读时长大约2 分钟\n作者 | 第一财经 this\n2025 年我国老年抚养比首次超过少儿\n根据国家统计局编著出版的《中国统\n计年鉴2026》，2025年全国0-14 岁\n人口 21276 万人，占总人口比重为\n15.1%; 65 岁及以上人口 22365 万\n人，上右总人口比重为15.9% 。2025\n年，全国总抚养比为45.1% ，其中少\n儿抚养比为22% ，老年抚养比为\n23.1% ，老年抚养比首次超过少儿抚\n养比。\n抚养比又称抚养系数，是指在人口当\n中非劳动年龄人口对劳动年龄人口数\n之比 (注: 这里所指劳动年龄人口为\n15-64岁群体) 。总抚养比就是少年\n儿童抚养比和老年人口抚养比相加之\n和。\n随着人口老龄化程度的不断加深，近\n年来我国老年抚养比持续上升。2016\n年，我国老年抚养比为15%，到2021\n年首次突破20% ，达20.8% 。2024\n年老年抚养比升至22.8% ，当年少儿\n抚养比为23% 、老年抚养比已经十分\n接近少儿抚养比。至2025年老年抚养\n比首次超过少儿抚养比。\n同时少子化和老龄化对很多行业和领\n域都产生了深刻影响。\n近年来人口结构的变化对教育领域产\n生了较大影响。\n在招生难的情况下，一些幼儿园在控\n在济南天桥区宝华街街道，一所运营\n30多年的民", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【8】"}, {"n": 10, "t": "我还说这个头哪像了，一看名字，确实", "b": "东汉时期的西红柿", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【10】"}, {"n": 15, "t": "#塞尔维亚#前总统#武契奇#星期天（10月25日）在首都贝尔格莱德竞选总部说，根据分层抽样结果，由学生团体推动的“学生名单－学生", "b": "期天（10月25日）在首都贝尔格莱德竞选总部说，根据分层抽样结果，由学生团体推动的“学生名单－学生获胜”预计将在国民议会250个席位中获得135至140席，而由塞尔维亚前进党主导的“亚历山大・武契奇－团结的塞尔维亚”选举名单预计获得约105席。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【15】"}, {"n": 16, "t": "#巴西#总统选举第二轮投票星期天结束。民调机构AtlasIntel首席执行官罗曼根据持续进行的计票结果预测，现任总统#卢拉#将击", "b": "天结束。民调机构AtlasIntel首席执行官罗曼根据持续进行的计票结果预测，现任总统#卢拉#将击败前总统#博索纳罗#之子弗拉维奥・博索纳罗，赢得连任。\n【博索纳罗之子拒绝承认巴西总统选举败选】#巴西#前总统#博索纳罗#之子弗拉维奥拒绝承认自己在总统选举第二轮投票中败选。另一方面，现任总统#卢拉#当地时间星期天（10月25日）晚发表讲话，宣布在当天举行的巴西总统选举第二轮投票中胜出，并称“这个国家不是任何人的后院”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【16】"}, {"n": 21, "t": "丢人一小时，少工作15年", "b": "‘om:   NS -0", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【21】"}], "intl": [{"n": 9, "t": "【】留学乌克兰\n\r\n未上过一堂课", "b": "未上过一堂课", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【9】"}, {"n": 11, "t": "#美国#司法 译", "cats": {"econ": [{"n": 5, "t": "江苏面向0-3婴幼儿家庭发放健康服务消费券", "b": "江苏面向0-3婴幼儿家庭发放健康服\n务消费券\n江苏新闻 2026年10月26日 21:08 江苏\n们 听全文 Al摘要\n为贯彻落实省政府办公厅《关于紧抓当前提质增\n效推动经济持续向新向优向好发展的若干政策措\n施》，优化 一老一小\"服务水平，近日，江苏面\n向0-3岁婴幼儿家庭发放健康服务消费券。\n记者从江苏省卫生健康委获悉，消费券发放对象\n为2023年9月1日及以后出生的婴幼儿家庭，每张\n消费券面值100元，每消费满200元可使用1张，\n每名婴幼儿限使用3张消费券。消费券适用范围包\n括全日托、半日托的托育服务消费，以及婴幼儿\n喂养指导、运动感统训练”、能力发展促进、养育\n照护指导等婴幼儿早期发展服务消费。\n婴幼儿家长可通过登录*苏服办”\"APP或*苏银生\n江苏新闻@             Hao 局\n@ 59个朋友关注    赞 133    1 Ske\n一全:oh一一", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【5】"}, {"n": 22, "t": "兽爷 · 今年前九个月，地方政府土地出让收入1.61万亿，同比跌27.9%\n\r\n828新政后，明年会比今年更差", "b": "今年前九个月，地方政府土地出让收入1.61万亿，同比跌27.9%\n\n828新政后，明年会比今年更差\n \n全网都在问：姆巴佩到底说了什么？", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【22】"}], "soc": [{"n": 1, "t": "没药花园案件 · 今天听说一个让我震惊的消息。\n\r\n我大约在2019年就关注徽剑这个公众号了，24年他突然不更新了，甚至全部文章", "b": "今天听说一个让我震惊的消息。\n\n我大约在2019年就关注徽剑这个公众号了，24年他突然不更新了，甚至全部文章消失，我开始也没太留意。\n\n再后来，我偶然听说他被抓了，一直失联。\n\n\n\n那一年，他写文章首个揭露了柬埔寨大的电诈头目和黑帮头目刘忍。刘忍当年在明面上和陈志一样，是在柬埔寨的正经华商形象，自然不想被大陆自媒体公布真实行径和面目。刘忍通过中间人联系他，试图花钱让他删文章，他拒绝。\n\n此后徽剑被几个“警察”从停车场带走。\n\n\n\n当时普遍统一的说法是，刘忍在国内报警，控告他敲诈勒索和诽谤之类，他就被抓了。现在你问AI，也是这么说的。\n\n在那以后，他的人一直失联，公众号所有文章消失。\n\n前不久央视报道陈志、刘忍等人被抓回国，我还想这下可以还徽剑清白了吧，但怎么媒体还是联系不上他，公号还不发文章呢？\n\n\n\n但今天我才知道，原来徽剑已经被人杀害了！\n\n\n\n在一个停车场带走他的人，是三个伪装成警察的杀手。为首的赵冰在飞机上领到一个叫“少校”的人的任务：一百万绑架他、删掉文章并逼问提供信息的线人是谁。\n\n赵冰又纠集了几个人作案。\n\n他们跟踪他，趁他在一个大卖场下车从后备箱取东西时将他绑架。他们先在广东荒郊野外虐待拷问他，抢走手机，删掉文章。后把他手机交给少校派来拿的人。\n\n最后他们把人带到江西的山上殴打致死。尸体被抛在野外，后被村民发现。\n\n\n\n他被带走时可能有目击者看到穿假警服的人，再加上刘忍他们故意放假消息，从此以讹传讹，传成他涉嫌违法被警方拘捕。\n\n这些罪犯和他无冤无仇，这么做只为了一百万悬赏，五个人分别分到40万到10万不等。\n\n其中为首的赵冰被判死缓，其余13人有期徒刑。（徽剑父母的养子收了赵冰父母的50万，给所有人出了谅解书。）\n\n而在飞机上直接雇佣他们的“少校”（绰号泰哥）一直没被抓到，更别说证明少校背后主谋是谁。\n\n\n\n一直觉得国内很安全，没想到光天化日下公共场合也会发生这种事。监控什么都只能吓住那些怕死的罪犯，却防不住为了钱不要命的暴徒。\n\n国内管控严，相比其他国家够安全了，所以这一群人能在几天后就落网。要是放其他监控少的国家，我都怀疑能不能查清楚怎么回事。\n\n\n\n电诈这行的财富太惊人了，钱到了这个规模基本什么都能买到。只要有钱，不仅可以买到徽剑的车牌号和住址，在飞机群里可以买到国内的垃圾人干各种违法犯罪的事。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【1】"}, {"n": 2, "t": "中国婚恋第一股百合网的联合创始人，一代相亲大佬慕岩，在朋友圈贴出了自己的微信收款码。配文大意是：财产被无缘无故冻结，生活拮据，只", "b": "自从被无缘无故冻结财产，生活持据，\n朋友圈化缘后，很多朋友都进行了金钱\n的支持。也有些朋友分享了自己被无故\n历。还有 30 年前的老朋友，已经 204\n系，也因此重新联系上了，并相约在北\n茶，共叙 20 年以来各自人生的变化。\n本来一件坏事，因为友情力量的加持，\n愤而发起\n或精神上\n冻结的经\n没有联\n京一起喝\n逐渐变成", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【2】"}, {"n": 4, "t": "据南方日报，近日，多所大学发布相关通知，学校在职在编人员工资将通过数字人民币钱包发放。", "b": "相关通知，学校在职在编人员工资将通过数字人民币钱包发放。\n扬州大学财务处10月20日发布通知，接省财政厅预通知，自2026年11月起，学校在职在编人员（含人事代理）工资将通过数字人民币钱包发放，请相关人员根据自己目前的工资卡情况，于10月23日前完成数币钱包的开立与升级。\n南通大学财务处发布《关于做好数字人民币钱包开通及11月份工资数币发放工作的通知》：各位教职工：接省财政厅通知，自2026年11月起全校在编人员、人事代理人员工资将通过数币钱包发放。请相关人员于10月30日前完成数币钱包的开立与升级（工资、绩效分两张卡发放，两张均需开立）。\n江苏师范大学记财处发布《关于统计报送数币钱包信息的通知》：为贯彻落实国家关于推进数字人民币试点工作的部署要求，进一步优化工资发放流程、提升发放质效、保障资金运行安全，根据上级主管部门统一工作部署，我校将稳步推进在职人员工资数字人民币（以下简称“数币”）发放工作。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【4】"}, {"n": 7, "t": "中央广播电视总台相关方面证实，针对姆巴佩的涉华严重负面行为，央视已经从昨晚开始，全面叫停涉及西甲和姆巴佩的赛事播出，涉及姆巴佩的", "b": "针对姆巴佩的涉华严重负面行为，央视已经从昨晚开始，全面叫停涉及西甲和姆巴佩的赛事播出，涉及姆巴佩的广告也已全部下架。 (澎湃新闻)", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【7】"}, {"n": 7, "t": "老徐时评 · 姆巴佩到底说了什么，让这么多中国的合作伙伴解除合同了？网上找了半天没找到，看来不是简单的言论，肯定涉及到政治或者外", "b": "姆巴佩到底说了什么，让这么多中国的合作伙伴解除合同了？网上找了半天没找到，看来不是简单的言论，肯定涉及到政治或者外交层面了，严重到已经不能再传播了。姆巴佩在中国应该是完了，别想再从中国挣钱了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【7】"}, {"n": 8, "t": "广电总局发布新规：要求有线电视实现开机看全屏直播功能，不得播放开机广告，设立免费专区，11月27日起施行。", "b": "有线广播电视运营服务提供者应当在\n有线广播电视交互界面首页设立免费\n专区，对优质免费内容进行重点推\n荐，精简收费栏目数量，明示节目收\n费信息，规范应用专区运营和订购支\n付管理。\nwll, 每日经济新闻 ©\n广电总局发布新规: 要求有线电视实\n现开机看全屏直播功能，不得播放…", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【8】"}, {"n": 9, "t": "李大霄：养生式救市才能够持续、细水长流，救市就是要长期有子弹", "b": "源时 AS10824 Fate\n—", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【9】"}, {"n": 10, "t": "上一代人摸鱼，究竟有多疯狂？", "b": "最近看到一个很魔幻的论调，叫做上一代人特别能\n吃苦。\n那个，不是的，上一代人摸鱼也很疯狂的。\n几十年前济南火柴三， : "@李清晨 · 不知道有些抵制日本品牌的人到底能有多坚定，国内医疗机构使用的很多器械都是日本的，最著名的比如奥林巴斯（奥林巴斯株式", "b": "不知道有些抵制日本品牌的人到底能有多坚定，国内医疗机构使用的很多器械都是日本的，最著名的比如奥林巴斯（奥林巴斯株式会社Olympus Corporation）的胃镜、肠镜、腹腔镜，这帮人要不连带这些医疗机构一并抵制了呢，那可是真为国家做贡献了。 \n \n@心在松谷:政治就是空气，谁能远离。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196444#:~:text=【25】"}], "tech": [{"n": 5, "t": "评论文章说，关于中美人工智能发展，近期网上流传一组对比：中国55%Token（词元）消耗流向AI（人工智能）短剧与视频生成，美国", "b": "展，近期网上流传一组对比：中国55%Token（词元）消耗流向AI（人工智能）短剧与视频生成，美国58%消耗在编程、研发、企业自动化，并据此下结论――中国再次把“火药”做成了“烟花”，“AI发展跑偏了”。\n且不论数据来源是否可靠权威，忽略总量、口径、样本等差异，做简单机械的数字对比就得出结论，难免武断。\n更何况，词元消耗的流向，虽可一定程度反映市场的“消费流水”，但并非一国AI产业资源投入的“总账”，更不能等同于技术研发方向。\n事实上，文娱产业只是我国AI发展的一个赛道，大量“火药”正用于攻克重大难题的“枪炮”。\n中国AI发展始终锚定国家战略需求和人民美好生活需要，将好钢用在刀刃上，所谓“跑偏论”本身就跑偏了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196444#:~:text=【5】"}, {"n": 9, "t": "菲尔兹奖得主邓煜：AI公司蒸馏全人类的知识，但不允许其他公司蒸馏自己，这是双标！", "b": "邓煜:Al公司不能双标\n只许自己蒸馏人类知识\ni\nA ot    得主\n- |               FURR: 10月25日 知识分子\n只有你蒸锣全人类的网络立就", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196444#:~:text=【9】"}, {"n": 18, "t": "币安被盗58亿美元", "b": "一夜被盗58亿，币圈最担心的事发生了\n夜之间，币安被黑客盗走几十亿美金，加密货币\n上最大的交易所盗窃案发生了。\n就在今天凌晨4点20分，币安标记为“Binance 14”的\n热钱包被一扫而空。多链统计估算流出资金高达约\n58亿美元，差不多380亿人民币。\n好在，币安已联合发行方冻结了约25.4亿至30亿美\n元的加密货币资产，且承诺会全额覆盖用户损失。\n怎么做到的? 黑客利用了以太坊Pectra升级引入的一\n个新特性。这个功能本意是让普通钱包能临时委托\n给智能合约，方便批量操作。但黑客诱导系统签下\n了恶意授权，甚至不需要私钥，就拿到了钱包的控\n制权。\n事情发生后，比特币应声大跌，全网一小时爆仓超6\n亿。这给整个行业敲响了警钟。Al时代，互联网安全\n防御的挑战已进入新阶段。正如马斯克在X上的发\n言: Everyday is Zeroday. (每天都是零日漏洞) 。\n大家对此怎么看?\n@ 新行情 作者 43分钟前                回复”10办\n给大家解释一下，马斯克说的“Zero-day (SAR\n洞} ”，指的是一个软件或系统中，被黑客发现并利\n用，但软件厂商自己还完全不知道(或者没来得及修\n复) 的安全漏洞。对厂商来说，他们的防御修复时间\n是0天。\n简单来说，他就是在提醒行业，在如今的网络世界\n里，出现全新的、无法预料的漏洞，已经不是偶然事\n件，而是每天都在发生的常态", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196444#:~:text=【18】"}], "cult": [{"n": 20, "t": "@她说:同时，武汉柏林电影周和爱酷电影周都宣布取消了", "b": "爱酷电影周都宣布取消了", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196444#:~:text=【20】"}]}}, {"date": "20261031", "label": "10月31日", "week": "周六", "id": "196472", "title": "只需改一个词，就一通百通便于理解了", "cats": {"econ": [{"n": 1, "t": "明天起，这些个人收入将由单位代缴增值税", "b": "以前个人给相关单位提供服务时需要\n缴纳增值税，但这需要个人向税务部\n门自主申报纳税。但实践中不少个人\n出于各种原因并没有主动申报纳税，\n造成这部分税款流失。2026年11月1\n日施行的增值税法等明确，自然人发\n生符合规定的应税交易，支付价款的\n境内单位为扣缴义务人。《办法》正\n是落实增值税法规要求，率先在七大\n服务领域开展单位代扣代缴增值税。\n第一财经 ©\n了明天起，这些个人收入将由单位代缴\n增值税", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【1】"}, {"n": 4, "t": "不用工资社保，24小时不间断执勤不眠不休，江苏多地物业引入“巡逻机器人”，一台能抵5个保安，每月仅耗电约200度。", "b": "不用工资不用社保     你怎么\n9", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【4】"}, {"n": 5, "t": "因一条差评，女子赔了酒店4000元", "b": "因一条差评，女子赔了4000元! 其怀疑酒\n店保安帮助停车发生刚足，发帖称“酒店停\n车位太垃圾”，被法院认定构成名誉权侵权\nseg 红星新闻\n一条*避坑帖`、几句*差评\"，借助社交平台动动手指就能传播干里。如今，越来越多\n消费者习惯通过在线平台分享消费体验、对商家服务进行评价，但评价权并非毫无\n边界，一旦超出合理范畴，可能需要承担法律责任。\n近日，广西壮族自治区桂林市秀峰区人民法院审结了这样一起案件，消费者郑女士\n在网络平台发布不实差评，最终被法院认定构成名蕉权侵权，判决其删除评论、公\n开赔礼道菊并赔偿损失。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【5】"}], "soc": [{"n": 2, "t": "证监会：全力稳市场稳预期 持续提升资本市场韧性和信心", "b": "10-30 17:09:40\n正监会; 全力稳市场稳预期 持续提升\npreter\n中\nEH]\n证监会党\n委传达贯彻党的二十届五中全会精\n神。会议要求，深入学习贯彻全会精神是当前和\n今后一个时期\ntee\n的重大政治任务，证监会系统要认\n宣讲解读，分层分类做好全覆盖培\n训，持续在解决突出问题上下功夫，推动学习宣\n(ESRI, 形成浓厚氛围。同时，充\n分发挥全面从严治党的政治引领和政治保障作\n用，补国树立大局意识、系统观念，全力稳市场\n稳预期，深化投融资综合改革，完善全链条监管\n体系，持续提升资本市场韧性和信心，确保\"十\n五五\"开局之和\n资本市场各项任务圆满完成。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【2】"}, {"n": 6, "t": "2.StudyCase", "b": "2. Study Case\nThe study location, Guangzhou, Guangdong, is situated in southern China and has a\ntotal population of 18.67 million. In 2023, the number of e-bikes in Guangzhou reached\n6 million, with an average daily travel volume of 6.85 million e-bike trips. The majority of\ne-bikes in Guangzhou are mopeds. In 2022, there were 5600 daily recorded e-bike violation\ncases, with misbehaving riders responsible for half of the e-bike accident law cases [75]. By\n2023, 60-80% of orthopedic injuries were caused by e-bike accidents. Additionally, 65%\nof severe injuries and 75% of fatal injuries resultin", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【6】"}, {"n": 7, "t": "一篇自媒体文章", "b": "打车人数在减少，平台就向下引\n流，专车去做轻享，轻享去做快车，\n最终拼压的是最底层的快车。客单价\n也在下降，对油耗越来越伺感，油换\n电就成必然选择。\n太阳照常升起\n北京网约车现状", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【7】"}, {"n": 9, "t": "西湖边现在有一亿人!!ART©", "b": "西湖边现在有一亿人!! ART ©\n大家都好有活人感啊!\n#杭州 #西湖 #胡滨银泰in77 HER\nZw. CD1405 Lyn2 (225\nSO ofer", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【9】"}, {"n": 10, "t": "波兰10月30日爆发剧烈政坛动荡，亲欧派总理图斯克政府与右翼总统纳夫罗茨基就宪法法院控制权展开公开对抗。 宪法法院官方账号一度发", "b": "荡，亲欧派总理图斯克政府与右翼总统纳夫罗茨基就宪法法院控制权展开公开对抗。 宪法法院官方账号一度发文，谴责政府强行暂停院长职务的行动是“政变”。\n事件起因于宪法法院院长博格丹・希维恩奇科夫斯基被暂停职务一个月，改由新法官接管。此举随即遭到原法院高层与反对党法律与公正党（PiS）的强烈反击，指责政府非法接管法院并践踏宪法。\n\n事发时正飞往非洲访问的波兰总统纳夫罗茨基紧急返航，回国后直接闯入法院大楼与在场法官对峙。与此同时，大批反对党支持者在法院外集结抗议，防暴警察全面包围大楼，现场发生冲突并导致多人受伤。\n\n总理图斯克对此态度坚决，表示恢复法治的过程虽然艰难甚至痛苦，但政府必须采取果断行动。目前，这场因“司法清洗”引发的宪政危机仍在持续升级。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【10】"}, {"n": 20, "t": "@六耳公孙", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【20】"}, {"n": 21, "t": "墨西哥亡灵节在墨西哥城中央广场建了一座33.4米高的卡特琳娜巨型骷髅雕像！", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【21】"}, {"n": 22, "t": "@胡锡进", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【22】"}], "intl": [{"n": 11, "t": "美国中期选举下周登场，佛罗里达大学机构公布的数据显示，目前已有创纪录的4790万名美国人提前投票；关键摇摆州的投票参与度大幅激增", "b": "大学机构公布的数据显示，目前已有创纪录的4790万名美国人提前投票；关键摇摆州的投票参与度大幅激增，且民主党选民提前投票人数多过共和党选民。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【11】"}, {"n": 12, "t": "二十国集团外交部长会议在美国举行，俄罗斯外长拉夫罗夫的出席引起反弹，这次会议取消传统的“全家福”合影环节。", "b": "行，俄罗斯外长拉夫罗夫的出席引起反弹，这次会议取消传统的“全家福”合影环节。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【12】"}, {"n": 13, "t": "美国政府批准向乌克兰出售500枚“爱国者”导弹，价值总额达21亿美元。美国国务院声明说，批准方案已提交国会审议，“这次拟议的军售", "b": "枚“爱国者”导弹，价值总额达21亿美元。美国国务院声明说，批准方案已提交国会审议，“这次拟议的军售将提升乌克兰的综合防空与反导能力，从而增强它应对当前及未来威胁的能力。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【13】"}, {"n": 14, "t": "一家美国资本控股的企业计划投资6亿美元在马来西亚兴建稀土提炼厂，目标是推动马国成为区域稀土加工枢纽。分析认为，美国为降低对中国稀", "b": "6亿美元在马来西亚兴建稀土提炼厂，目标是推动马国成为区域稀土加工枢纽。分析认为，美国为降低对中国稀土的依赖，正逐步将供应链布局转向马国。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【14】"}, {"n": 15, "t": "为缓解中东战事导致的能源价格上涨压力，欧洲11国承诺在2027年1月结束前，释放4260万桶战略储备石油，美国也完成新一批约40", "b": "涨压力，欧洲11国承诺在2027年1月结束前，释放4260万桶战略储备石油，美国也完成新一批约4000万桶原油的出借安排。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【15】"}, {"n": 18, "t": "美国经济繁荣就靠这俩哥们儿撑着了", "b": ">\n2\n3\nFy\n8\n2\n3", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【18】"}, {"n": 19, "t": "2026年10月29日，《纽约时报》发表了一篇六名记者联合署名的调查报道，称美国情报部门认定，这名叫Alice Huang、也使", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【19】"}], "tech": [{"n": 3, "t": "10 月 31 日，苹果正式宣布 Apple 智能即将登陆中国！首批功能将于 11 月 4 日随 iOS 开发者 Beta 版开", "b": "布 Apple 智能即将登陆中国！首批功能将于 11 月 4 日随 iOS 开发者 Beta 版开放测试，12 月随 iOS 27.3 正式向国内用户推出。\n\n首批上线的功能包括实时翻译、照片消除、写作工具、视觉智能、智绘表情、通知摘要、邮件智能回复等。其中，实时翻译可用于电话、FaceTime、信息及支持的 AirPods，视觉智能则可以通过摄像头识别周围的物体和场所。\n\n苹果还确认与阿里巴巴合作，在部分 Apple 智能功能中接入千问。国内用户可以通过 Siri 向千问提问，理解照片、PDF 和演示文稿中的内容，也可以借助系统写作工具直接生成原创文本。\n\n不过，苹果特别强调，这次更新暂不包含 Siri AI，以及 WWDC 2026 上公布的其他下一代 Apple 智能功能。首批支持 iPhone 15 Pro 系列、iPhone 16 及后续机型、iPhone Air 和 iPhone Duo，其他平台还需要等待相关审批。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196472#:~:text=【3】"}, {"n": 8, "t": "官方披露：将有两名中国人登陆月球", "b": "据环球时报消\n， 10月31日，中国载人航天工程副总设计师兼月球探测工程总设计\n师王翔在第七届载人航天学术大会上，介绍了我国首次载人月球探测任务乘组计\n划。\n=\nPRRARA LEMAR HPRARAU LES PEAFE SRA. BR: 中\n国载人航天\n我国计划在2030年前实现中国人登陆月球。首次载人月球探测计划采用环月轨道对\n接飞行模式，通过 两次发射，一次登月\"的方式实现载人登月。\n这种模式将采用两枚长征十号运载火箭，先将着陆器送往月球轨道，然后再发射载\n人飞船与着陆器实现交会对接 ，航天员进入着陆器并与载人飞船分离着陆月面，开\n展有关科学      动。完成任务后航天员乘坐着陆器从月面上升，在月球轨道上与\n载人飞船实现二次交会对接 有人出主意“用贴纸把包装上的头像贴上，或者把标签撕掉一部分。”\n10月29日，针对此次代言人停止合作导致的产品下架，品牌方是否会回收产品以及后续是否会按批次处理等问题，记者向东鹏公司提问，但截至发稿前未收到具体回应。\n“通常代言人终止合作的情况，饮料厂家很难回收，因为不是涉及到食品安全的产品召回。”业内人士表示。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【4】"}, {"n": 11, "t": "COS出了心酸的股民", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【11】"}, {"n": 18, "t": "这起事故发生在当地时间星期五（10月30日）晚上10时50分左右（新加坡时间晚上9时50分），涉事的是北海道旅客铁道公司（JR北", "b": "10月30日）晚上10时50分左右（新加坡时间晚上9时50分），涉事的是北海道旅客铁道公司（JR北海道）宗谷本线的“佐吕别号”（Sarobetsu）特急列车。\n当时列车正从旭川开往稚内，不料在天盐中川站与问寒别站之间，撞上一头熊，列车首节车厢的部分车轮因熊被卷入而脱轨。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【18】"}, {"n": 20, "t": "乌军继续袭击俄炼油厂", "b": "—\na is 5   oe\na, si           7\nad\n=            ;                    @ okReE=", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【20】"}, {"n": 21, "t": "据政治新闻网（POLITICO）10月30日报道，纽约市前市长布隆伯格本周再向多场众议院、参议院和州长选举投入近3600万美元。", "b": "）10月30日报道，纽约市前市长布隆伯格本周再向多场众议院、参议院和州长选举投入近3600万美元。此前他已在上周宣布投入8000万美元。\n其中，布隆伯格向与民主党领导层关系密切的超级政治行动委员会“众议院多数派政治行动委员会”（House Majority PAC）捐款1600万美元，并向他参与创立的控枪组织“每个城镇争取枪支安全”（Everytown for Gun Safety）捐款1200万美元，这笔钱同样用于众议院选举。\n他还向几位知名的全州性候选人捐款，包括佐治亚州州长候选人凯沙・兰斯・博顿斯（Keisha Lance Bottoms）250万美元、得克萨斯州联邦参议员候选人詹姆斯・塔拉里科（James Talarico）250万美元，以及堪萨斯州联邦参议员候选人亚当・汉密尔顿（Adam Hamilton）200万美元。\n布隆伯格是民主党最重要的超级金主之一，曾参加美国总统竞选。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【21】"}, {"n": 24, "t": "红果短剧现已横行台湾。", "b": "Bi\nes  flowzen61       i\n发现一个奇特的现象\n为什么前阵子台湾随便一个\n店家 人物 或包装\n出现一个简体字就可以\n让一间店甚至一个人的事业\n瞬间倒闭垮台\n然后现在满街都再看红果\n完全没人褒话? ? ?\n©O250 Qs De B2\nA]\narnick0119\n(+) BUREBHSHER, BR-BR, SES\n那种低智商的东西\n现在他们整天看红果\nHSB USRa\n红果我只学到，规矩不能壤，吃了不烧心\nO12 Q3 OD Bi\ni 4 flowzen61\nRe RaMAT ARIAT...\nO04 Q3 G B&B     IRR @/te", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【24】"}, {"n": 25, "t": "Trump在海湖庄园，回答了记者几个问题🎤", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xile ://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【12】"}, {"n": 13, "t": "国际评级机构惠誉星期五（10月30日）维持法国A+的主权信用评级，但把评级展望从“稳定”下调至“负面”，并对法国巨额债务的偿债成", "b": "30日）维持法国A+的主权信用评级，但把评级展望从“稳定”下调至“负面”，并对法国巨额债务的偿债成本表达深切担忧。\n惠誉预测，作为欧盟第二大经济体，法国的债务占国内生产总值（GDP）的比重将从2025年的近115.7%，攀升至2028年的124%。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【13】"}, {"n": 14, "t": "美国将于星期二（11月3日）举行中期选举，提前投票的人数创下历史新高，达到约4790万人，超越2022年中期选举创下的4590万", "b": "行中期选举，提前投票的人数创下历史新高，达到约4790万人，超越2022年中期选举创下的4590万人纪录。关键摇摆州的投票率大幅攀升，且提前投票的民主党选民多过共和党选民。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【14】"}, {"n": 15, "t": "德国数万人星期六（10月31日）在全国34个城市示威，要求改善教育、降低生活成本，并反对强制兵役制度。大部分示威和平进行，但金融", "b": "）在全国34个城市示威，要求改善教育、降低生活成本，并反对强制兵役制度。大部分示威和平进行，但金融中心法兰克福爆发骚乱，蒙面暴徒洗劫商店，并向执法人员投掷汽油弹。\n这场示威由名为“Z世代当家”（Gen Z regelt）的团体发起，遍及柏林、法兰克福和慕尼黑等城市，是今年欧洲多国爆发Z世代主导抗议浪潮的最新一波。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【15】"}, {"n": 16, "t": "美国针对伊朗实施的海上封锁、全面经济制裁以及对陆路出口通道的阻挠，已使伊朗经济陷入瘫痪，让伊朗政权面对更大的压力。", "b": "面经济制裁以及对陆路出口通道的阻挠，已使伊朗经济陷入瘫痪，让伊朗政权面对更大的压力。\n美国新闻网站Axios获取的美国财政部最新评估报告显示，自今年8月美国财政部对伊朗实施“经济孤立行动”以来，伊朗货币里亚尔已大幅贬值约四分之一，今年9月的通货膨胀率高达90％，远高于2025年初约35%的水平。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【16】"}, {"n": 17, "t": "美国联邦调查局和特勤局等执法机构正在追查全球最大加密货币交易所币安（Binance）遭网络攻击盗走历来最大笔的63亿美元加密货币", "b": "构正在追查全球最大加密货币交易所币安（Binance）遭网络攻击盗走历来最大笔的63亿美元加密货币，是否由朝鲜黑客所为。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【17】"}, {"n": 19, "t": "日本11月1日起全面推行出境退税新规，取消长期实行的“店内即时免税”模式，改为由旅客购物时先支付含税价款，出境时完成核验手续后再", "b": "税新规，取消长期实行的“店内即时免税”模式，改为由旅客购物时先支付含税价款，出境时完成核验手续后再获退税。分析指出，日本此前实行的“店内现场退税”制度在全球较为少见，但其便利性一直是吸引外国游客消费的重要因素。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196483#:~:text=【19】"}, {"n": 22, "t": "#全球最赚钱公司中国占七席#", "b": "图看懂\n美最赚钱公司TOP10对比!\n数据更新至: 2026年8月17日 (2025财年净利润)\nEDU\n排名 AAS «HI (亿元人民而)\n@ ”中国工商银行 3,658 cx\n中国建设银行 3,359 zz\n中国农业银行 2,852 “元\n四 。 中国银行        2,488 2x\n中国                           72 oRcnes\n@elonmusk\nee\n“FF 1:10 - 20264108308 - 132.65 查看", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196515#:~:text=【18】"}], "cult": [{"n": 7, "t": "吕齐1925年8月出生，祖籍山东，北京人民艺术剧院一级演员。他因在电视剧《编辑部的故事》中饰演“陈主编”一角而被广大观众熟知。此", "b": "东，北京人民艺术剧院一级演员。他因在电视剧《编辑部的故事》中饰演“陈主编”一角而被广大观众熟知。此外，他还在电影《霸王别姬》中饰演戏班关师傅，展现了深厚的表演功底。吕齐不仅是优秀的影视演员，更是杰出的话剧表演艺术家，曾在北京人艺参演《雷雨》《李白》《野人》等多部经典话剧。\n吕齐曾说：“演员的每一场演出，都应当是一次认真的体验，而不应当是一次简单的重复。”已故著名表演艺术家、濮存昕的父亲苏民曾为吕齐题过一首诗： “轻送幽默若无痕，与君交游似饮醇。声音褒贬品滋味，偏君创作总醉人。”著名演员何冰也曾在一档节目中大谈对吕齐的敬佩：“虽然吕齐不是名气最大的演员，但是在我心里他是最棒的演员之一。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196515#:~:text=【7】"}]}}, {"date": "20261103", "label": "11月3日", "week": "周二", "id": "196534", "title": "预制娃", "cats": {"econ": [{"n": 3, "t": "据“量子位 ROBO”独家获悉，11 月 2 日起，华晨宝马开始裁员。多名员工消息称，此次裁员规模约为 1800 人，约占华晨宝", "b": "11 月 2 日起，华晨宝马开始裁员。多名员工消息称，此次裁员规模约为 1800 人，约占华晨宝马员工总数的 10%。\n多位员工证实，此次裁员统一按 n+5 赔偿，其中“n”按税前月薪计，“5”按基本工资计（不包括绩效等）。按照裁员前的工会名单来看，华晨宝马员工总数为 1.9 万余人。\n消息称此轮裁员几乎涉及所有岗位，其中绝大多数都是 P 岗（生产序列）即一线生产岗。据悉，华晨宝马员工主要分为 P 岗、G 岗（办公室 / 管理序列）。\n在找到新工作之前，被裁的员工还可以按照法律规定领取失业金，最多可领取两年。这次裁员，既包括供职 3-5 年、工作经历稍浅的员工，也包括在岗十余年、已经做到段长（生产一线的基层管理岗）的老员工。裁员不仅涉及到正式员工，近段时间，华晨宝马的外包人员也受到影响。\n据IT之家此前报道，上月的消息称，宝马计划在 2027 年底前削减 8000 个白领岗位，并向数万名员工发送了“远超行业”的离职补偿方案，部分员工获得的离职补偿金额最高可达 65 万欧元（现汇率约合 484.5 万元人民币）。宝马加速推进裁员计划，也与其近期面临的经营压力有关。\n中国市场目前是该公司面临的主要挑战之一。今年第三季度，宝马在中国市场的销量同比下降近 25%，欧洲和美国市场的增长仍未能弥补中国市场销量下滑带来的影响。（IT之家）", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【3】"}, {"n": 7, "t": "今年前三季度云南经济增速很差，只有2.2%，连全国平均水平一半都不到。最主要的因素是烟草行业持续负增长，烟草工业增加值同比下降1", "b": "只有2.2%，连全国平均水平一半都不到。最主要的因素是烟草行业持续负增长，烟草工业增加值同比下降1.9%，这是云南烟草工业近10年来首次负增长。云南烟叶产量占全国四成以上，卷烟产销规模居全国首位。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【7】"}, {"n": 8, "t": "红果已超越豆包，抖音集团内部前三大应用变为抖音、红果免费短剧和豆包，去年还是抖音、今日头条和抖音极速版", "b": "da Ut ala\n仅展示同比排位变动明显企业)\n2meqo         seo有\noe Ta BEE rmzan 2E2\" resem 下说 tora BES\" teem BES\nue os\nCent        ne  sass\n2 8         图 w  697             Fa 1938.", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【23】"}], "intl": [{"n": 12, "t": "美国中期选举前夕，总统特朗普对是否会兑现恢复军事打击伊朗的威胁态度出现转变，并称美国可能与德黑兰达成协议。", "b": "是否会兑现恢复军事打击伊朗的威胁态度出现转变，并称美国可能与德黑兰达成协议。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【12】"}, {"n": 13, "t": "美国中期选举投票日前夕，总统特朗普罕见承认，共和党恐在选举中失利。他预言，如果民主党最终在国会赢得多数议席重夺主导权，他将成为“", "b": "朗普罕见承认，共和党恐在选举中失利。他预言，如果民主党最终在国会赢得多数议席重夺主导权，他将成为“否决先生”（Mr Veto），动用总统否决权力阻民主党提呈的法案。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【13】"}, {"n": 14, "t": "美国将于下星期在阿联酋首都阿布扎比与乌克兰和俄罗斯代表团举行三方会谈，探讨结束俄乌战争、战后安全协议以及局势降级等议题。", "b": "扎比与乌克兰和俄罗斯代表团举行三方会谈，探讨结束俄乌战争、战后安全协议以及局势降级等议题。\n美国总统特朗普特使威特科夫（Steve Witkoff）星期一（11月2日）在社交媒体宣布，乌克兰、俄罗斯和美国官员将于下周在阿布扎比举行三方会晤，以期推动和平谈判取得进展。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【14】"}, {"n": 15, "t": "波兰政府与总统、央行行长之间的政治角力持续升级，不仅可能导致央行运作陷入瘫痪，也引发投资者对波兰金融稳定的担忧。", "b": "政治角力持续升级，不仅可能导致央行运作陷入瘫痪，也引发投资者对波兰金融稳定的担忧。\n波兰总理图斯克与央行行长格拉平斯基（Adam Glapinski）的矛盾日益尖锐。国会预计11月决定是否将格拉平斯基涉嫌失职一案提交特别法庭审理。一旦进入审判程序，他可能遭停职，但相关法律依据仍存争议。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【15】"}, {"n": 16, "t": "美国太空探索技术公司SpaceX迅速崛起，凸显欧洲对美国太空技术的依赖。近年来，美国缩减或暂停多项与欧洲合作的太空项目，包括建设", "b": "X迅速崛起，凸显欧洲对美国太空技术的依赖。近年来，美国缩减或暂停多项与欧洲合作的太空项目，包括建设月球轨道空间站的“月球门户”（Lunar Gateway）计划，以及火星样本返回任务，令双方长达数十年的合作关系受到冲击。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【16】"}, {"n": 17, "t": "两名知情人士透露，日本首相高市早苗政府正考虑调整2027年4月起的五年防卫建设预算，提高至70万亿到80万亿日元，相当于现行五年", "b": "早苗政府正考虑调整2027年4月起的五年防卫建设预算，提高至70万亿到80万亿日元，相当于现行五年计划约43万亿日元的1.8倍。\n日本政府预计在年底前编制预算，并修订三份与国家安全有关的政策文件，因此最终预算规模仍可能调整。日本防卫省目前不予置评。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【17】"}, {"n": 18, "t": "随着赴韩国接受医疗服务的外国游客激增，首尔市政府指定19家酒店及住宿设施，为外国患者及家属提供便利服务，满足他们在治疗前后的住宿", "b": "客激增，首尔市政府指定19家酒店及住宿设施，为外国患者及家属提供便利服务，满足他们在治疗前后的住宿需求。\n入选设施须符合多项标准，包括靠近医疗机构、适合长期住宿、提供烹饪和洗衣设施，以及具备全天候紧急应对机制。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【18】"}, {"n": 19, "t": "国际人权组织调查发现，俄罗斯中介涉嫌以学生实习名义招募朝鲜劳工，安排他们到俄罗斯企业工作，并将大部分工资上缴朝鲜政府，用于资助弹", "b": "介涉嫌以学生实习名义招募朝鲜劳工，安排他们到俄罗斯企业工作，并将大部分工资上缴朝鲜政府，用于资助弹道导弹计划。\n澳大利亚广播公司（ABC）报道，国际人权组织“全球权利合规”（Global Rights Compliance）经过九个月卧底调查，揭露一个由莫斯科商人索科洛夫（Vladimir Sokolov）涉嫌经营的劳工中介网络。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【19】"}, {"n": 24, "t": "连川普本人都觉得不好意思了", "b": "@ 纽约时报中文网多                   X.com\n@nytchinese\nJ Show translation\n特朗普的言论变得更粗俗: 时报查验了特朗普在\n演讲、集会、社交媒体和采访中的言论，发现他\n的的公共表达比十年前更粗俗、更无所顾忌。有\n时连特朗普本人似乎都对支持者依然如此拥戴他\n感到惊讶。“我可以说最蠢的话，你们照样鼓\n掌。'哦，我好爱你啊，”他在最近一场集会上感\n叹道。\nFrom cn.nytimes.com\n3:00AM .11/2/26 - 51K Views", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【24】"}, {"n": 25, "t": "据美国有线电视新闻网（CNN）11月1日报道，美国阿拉斯加州共和党参议员丹・沙利文当天在CNN《国情咨文》节目中接受主持人杰克・", "b": "11月1日报道，美国阿拉斯加州共和党参议员丹・沙利文当天在CNN《国情咨文》节目中接受主持人杰克・塔珀（Jake Tapper）采访，被问及是否只在获胜时才接受选举结果时，他表示会接受选举结果。\n沙利文的对手是民主党候选人、前联邦众议员玛丽・佩尔托拉（Mary Peltola）。《纽约时报》此前报道，民主党人涉嫌招募一名与沙利文同名的候选人，以分流他的选票。沙利文在节目中称，佩尔托拉团队意识到无法靠政绩参选，所以只能作弊，他认为很多阿拉斯加人，甚至民主党人，都觉得佩尔托拉不适合担任公职。佩尔托拉否认知情，称阿拉斯加人不搞互相欺骗那一套。\n被问到是否有人违法时，沙利文说交给律师判断。他表示自己从未采用类似手段，并承认这一手段已经奏效，自己肯定会因此失去很多选票。他在采访结束时呼吁阿拉斯加人出来投票，不要让这次选举被窃取。\n沙利文说：“不，我会接受选举结果。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【25】"}], "tech": [{"n": 9, "t": "因“字节时间论”连续隔空论战，秦朔宣布正式起诉抖音副总裁李亮。", "b": "om x8\n声明\n针对近期 “拌音集团李高” 发布的侵害本人\n名誉权的言论，本人已委托律师向人民法院\n提起诉讼，依法采取措施维护自身的合法权\n益，追究侵权方的法律责任。\n2598\n20264 11A28\n收起", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【9】"}, {"n": 27, "t": "收盘，沪指跌0.82%，深成指跌1.21%，创业板指跌2.73%。#A股缩量803亿#", "b": "跌1.21%，创业板指跌2.73%。#A股缩量803亿#", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196534#:~:text=【27】"}], "cult": [{"n": 5, "t": "江西赣州一女生赴港看演唱会触发低保预警，最新进展：低保已被取消", "b": "江西赣州一女生赴港看演唱会触发\n低保预警，最新进展: 低保已被取\n消\n界面新闻 2026年11月3日 13:50 bis A5A\nAl摘要\n9月7日，江西乾州经济技术开发区社会事务\n管理局发布情况通报，回应网传-江西一名女\n孩赴香港观看演唱会 m/blog/more.asp?name=xilei&id=196556#:~:text=【5】"}, {"n": 6, "t": "近日，在搜狐视频关注流Halloween美剧Cosplay Party活动上，搜狐创始人、董事局主席兼首席执行官张朝阳表示，自己", "b": "oween美剧Cosplay Party活动上，搜狐创始人、董事局主席兼首席执行官张朝阳表示，自己每天早上4点起床、工作十多个小时，物理课和英语课既是个人兴趣，也是推广关注流直播和内容生态的重要实践。我们没有躺平，我们在努力工作，关注流就是我们的战略级产品。此外，他还透露，搜狐账上有12亿美元现金，投资人经常问及公司的资金使用和分红安排。对此，他回应，搜狐仍需投入资金发展社交平台。张朝阳直言，搜狐仍需投入资金发展社交平台，我们还有一场仗要打。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【6】"}, {"n": 8, "t": "#教育厅介入延安大学副教授举报事件#近日，有公众号发布了一则“延安大学副教授白保国的绝笔信”。信中举报，延安大学存在“一刀切设置", "b": "事件#近日，有公众号发布了一则“延安大学副教授白保国的绝笔信”。信中举报，延安大学存在“一刀切设置横向科研经费”“在编人员吃空饷”等问题。11月4日，陕西省教育厅工作人员告诉记者，该单位已有专门部门在处理副教授白保国的相关事宜。同日，延安大学工作人员表示，白保国老师确已离世，正在调查核实网传信件内容。\n上述信件显示，被举报单位为“延安大学”，被举报相关负责人涉及“学校分管人事、科研、年度考核的领导，以及鲁艺学院负责人”等。举报内容包括“在编人员吃空饷问题”“一刀切设置横向科研经费、论文数量硬性考核指标做法”“对白保国本人存在双重标准、考核不公问题”等。\n延安大学鲁迅艺术学院官网显示，白保国，副教授，毕业于武汉音乐学院。主教课程为钢琴、应用钢琴。系中国音乐家协会会员、延安市音乐家协会副主席、中国音乐家协会社会艺术水平考级考官。“深耕钢琴教学领域三十余年，教学经验丰富，成果斐然，指导多名研究生、本科生成功举办毕业独奏音乐会。”其长期致力于钢琴、应用钢琴教学体系的研究与实践，教学成效显著。曾连续五次担任中国珠江“凯撒堡”钢琴大赛陕西赛区评委；连续六次担任延安市文化局主办的钢琴大赛评委。发表学术论文十余篇。曾多次荣获延安大学本科与研究生毕业论文优秀指导教师奖。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【8】"}, {"n": 9, "t": "台伪警方及特务机关在追踪中抓捕了几十个为张俊杰在全岛南北转移提供掩护的人，并于今天凌晨抓到了送他离开的渔船，但此时张俊杰应该已经", "b": "了几十个为张俊杰在全岛南北转移提供掩护的人，并于今天凌晨抓到了送他离开的渔船，但此时张俊杰应该已经到了大陆。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【9】"}, {"n": 10, "t": "11月4日凌晨，大量iPhone用户发现自带天气App显示11月13日（下周五）多地最低气温骤降至-28℃、-31℃、-32℃，", "b": "e用户发现自带天气App显示11月13日（下周五）多地最低气温骤降至-28℃、-31℃、-32℃，北京、上海、青岛、河南、杭州、合肥等地几乎同时出现相似异常，最高温仍显示十几摄氏度，昼夜温差接近50℃，看起来像“一键速冻”。\n据看看新闻，专业人士分析，这类情况大概率是天气App后台数据出错，可能是数据源解析异常、数值跳转或错误匹配到全球其他地区。苹果客服表示，不排除是显示或数据异常，不属于手机硬件故障，用户无需担心。\n这也不是iPhone天气App第一次出现离谱温度。今年6月，它曾显示杭州临安接近50℃的极端高温，后来被气象部门证实为App自身数据错误。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【10】"}, {"n": 11, "t": "@farmerRD_two:舆论高地，你不去占领，敌人就会去占领", "b": "论高地，你不去占领，敌人就会去占领", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【1 2475           内\nb", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【31】"}, {"n": 32, "t": "A-Promised-Land1", "b": "1\n川普终于耗尽了自己的政治资源，接下来，他的那些草台班子同党、权钱交易的政治盟友，都会纷纷跳船。这些人以利相交，人品败坏，一旦发现形势逆转，会开启丑陋的互咬模式，接下来会有一场好戏。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【32】"}], "intl": [{"n": 1, "t": "友情提醒：不是最终数字，但结果已定。", "b": "已定。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【1】"}, {"n": 1, "t": "白饭如霜 · #特朗普惨败#感觉世界好像回到了一点正常的轨道上，做得好有正反馈，做的不好有负反馈。\n\r\n当年怎么把他选上去的人，", "b": "#特朗普惨败#感觉世界好像回到了一点正常的轨道上，做得好有正反馈，做的不好有负反馈。\n\n当年怎么把他选上去的人，现在就怎么把他选下来，当年选他，是为了发泄自己对民主党的不满，一旦选上，他就成为不满的对象了。\n\n只能说选票是个好东西，在社会治理方面真是无本万利。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【1】"}, {"n": 13, "t": "《给阿公的战书》", "b": "—_-\"\n请 我理解了半天，又理解了半天\n两个男生，潮汕独子\n(前面有6个姐姐)\nand\n山东长子(九代单传+\n刚考上公) 想在一起\nBAABASS\n06844 ©422 Gis7 2,390\na 拍成电影可以横扫欧洲三大电影节了\n@43840 Qu D2 6o2", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【13】"}, {"n": 14, "t": "当地时间11月3日，美国举行中期选举，最新计票结果显示，民主党同时获得了国会参众两院的控制权。美国总统特朗普向民主党发出祝贺。\n", "b": "期选举，最新计票结果显示，民主党同时获得了国会参众两院的控制权。美国总统特朗普向民主党发出祝贺。\n\n特朗普在接受哥伦比亚广播公司（CBS）新闻频道的电话采访中，祝贺民主党人在中期选举中获胜。特朗普说：“我向民主党人表示祝贺，并期待与你们合作，为我们国家的利益而努力。”\n面对美国中期选举民主党大幅领先基本锁定胜局的情况，#特朗普#表示：“我没有出现在选票上，如果我在，我们会以压倒性优势获胜！”\n\n然而他在接受媒体采访时又说：“我完全愿意接受这些结果，我们会与民主党人合作，而且我们期待与他们合作。我们或许能找到解决办法。” \n中期选举结果估计对川普很不利，川普对福克斯新闻都破口大骂", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【14】"}, {"n": 15, "t": "当地时间11月3日，美国正在进行中期选举计票，据美国独立选举分析机构Decision Desk HQ预测，民主党将夺回对众议院的", "b": "行中期选举计票，据美国独立选举分析机构Decision Desk HQ预测，民主党将夺回对众议院的控制权，结束长达四年的少数党地位。\n《国会山报》称，这一变化将对明年美国政府的运作产生直接影响，阻碍现任总统特朗普的立法议程，众议院和特朗普政府未来可能将就移民执法、政府支出、全球关税和伊朗战争等问题发生更多冲突。\n民主党誓言要对特朗普及其核心圈子展开一系列详尽的调查，其中包括爱泼斯坦丑闻、驱逐移民暴力事件以及特朗普不断增长的个人和家庭财务状况。\n民主党的胜利将使民主党人哈基姆・杰弗里斯成为美国历史上第一位黑人众议长。杰弗里斯在中期选举前夕说：“新一届国会将向全国民众承诺，从第一天起，我们将追究所有骗子的责任。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【15】"}, {"n": 16, "t": "美国媒体预测，民主党人波特姆斯在中期选举中当选佐治亚州州长，成为美国历史上首位黑人女性州长。", "b": "在中期选举中当选佐治亚州州长，成为美国历史上首位黑人女性州长。\n美国有线电视新闻网（CNN）和美国全国广播公司（NBC News）都预测，波特姆斯（Keisha Lance Bottoms）在星期二（11月3日）的中期选举中，击败共和党对手杰克逊（Rick Jackson），赢得佐治亚州州长职位。\n她的胜选也意味着，佐治亚州州长一职在由共和党掌控20多年后，重新回到民主党手中。这对总统特朗普而言是一次打击。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【16】"}, {"n": 17, "t": "欧洲至少九个国家的超市疑遭网络攻击，比利时、爱沙尼亚、芬兰、爱尔兰、意大利、卢森堡、荷兰、葡萄牙和瑞典的超市称他们的制冷系统出现", "b": "攻击，比利时、爱沙尼亚、芬兰、爱尔兰、意大利、卢森堡、荷兰、葡萄牙和瑞典的超市称他们的制冷系统出现故障，温度在夜间升高，迫使部分零售商丢弃食品。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【17】"}, {"n": 18, "t": "朝鲜劳动党总务部长金与正罕见就美国指控朝鲜黑客窃取63亿美元加密资产发表谈话，斥责有关指控是“严重政治挑衅”，并警告将重新审视美", "b": "美国指控朝鲜黑客窃取63亿美元加密资产发表谈话，斥责有关指控是“严重政治挑衅”，并警告将重新审视美国的敌对态度。分析认为，金与正亲自回应，既意在阻止国际社会进一步施压，也可能借此向华盛顿传递外交信号。\n尽管金与正高调否认朝鲜涉案，英国《金融时报》3日报道，涉案的黑客正通过拆分转账、兑换币种及去中心化金融（DeFi）平台等方式，展开复杂洗钱行动。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【18】"}, {"n": 19, "t": "布什比最初估算这段路程大约需要五年才能走完，但他深知这并不现实。“我们猜测需要12年多，而且是多出不少。但我们做梦也没想到，竟然", "b": "五年才能走完，但他深知这并不现实。“我们猜测需要12年多，而且是多出不少。但我们做梦也没想到，竟然是28年。”\n布什比的旅途纵贯南美洲、北美洲、亚洲、欧洲，他穿越丛林、荒漠与极地冰原，也踏过白令海峡冰面，并先后横渡里海、英吉利海峡，以纯人力方式完成跨洲跨国行进。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【19】"}, {"n": 20, "t": "日本北海道海边近日出现一座特别的电话亭，里面的黑色转盘电话没有连接任何线路，却能让失去亲人的民众拨出思念，向逝者倾诉未说出口的话", "b": "的电话亭，里面的黑色转盘电话没有连接任何线路，却能让失去亲人的民众拨出思念，向逝者倾诉未说出口的话。\n这座名为“海之电话”（Umi no Denwa）的电话亭，星期天（11月1日）在北海道罗臼町启用，主要供2022年知床半岛观光船沉没事故的遇难者家属使用。那场事故造成20名乘客和船员死亡，另有六人至今下落不明。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【20】"}, {"n": 22, "t": "民主党人Keisha Lance Bottoms（凯莎・兰斯・博特姆斯，前亚特兰大市长）击败了共和党候选人Rick Jackso", "b": "e Bottoms（凯莎・兰斯・博特姆斯，前亚特兰大市长）击败了共和党候选人Rick Jackson，当选佐治亚州第84任州长。\n一百多年前这地方还是美国棉花种植园核心区，黑人女性基本只能在种植园里伺候人，《乱世佳人》里那种端茶倒水、端屎端尿的角色就是写的佐治亚。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【22】"}, {"n": 25, "t": "2/3犹太裔美国人投给了民主党", "b": "Political Polls @ @PpollingNumbers .1小时\noe 6580#:~:text=【12】"}, {"n": 13, "t": "美国副总统万斯今晨发了一条长帖（约600多字），把共和党在中期选举惨败的主要责任推给“与伊朗的战争”，同时为2028年可能的总统", "b": "（约600多字），把共和党在中期选举惨败的主要责任推给“与伊朗的战争”，同时为2028年可能的总统竞选做铺垫。\n媒体普遍解读这是Vance在公开撇清与伊朗战争的责任（他之前公开支持过战争，但有报道称私下反对），把主要锅甩给战争决策和相关政策（包括对以色列关系），把自己定位成更“美国优先”、反干预的声音，为未来与Trump保持距离、争夺MAGA继承权做准备。\nPolitico等报道称他亲自起草了这篇帖子，并事先告知白宫，川普方面表示“没问题”。\n但是民主党则呛声，比如纽约市长马姆达尼就表示，万斯这则帖子好像他自己不是川普政府的一员，而是一名政治评论员。万斯也要负起自己的责任。\n【共和党痛失国会控制权 白宫恐迎人事大换血】在此次选举中，民主党重夺国会两院主导权，多名由特朗普亲自背书的关键候选人也遭选民否决。\n就连被视作潜在政治接班人的副总统万斯，也公开将失利归咎于伊朗战事，释放出刻意切割的信号。\n党内分析认为，一旦党内确信特朗普对基本盘选民的号召力正在减弱，类似的自保之举势必更加普遍。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【13】"}, {"n": 14, "t": "美国总统特朗普说，尽管伊朗战争拖累共和党选情、痛失国会控制权，但他坚信这场战事依然完全值得。", "b": "拖累共和党选情、痛失国会控制权，但他坚信这场战事依然完全值得。\n特朗普星期三（11月4日）在华盛顿面对媒体询问时说：“关于伊朗，我们必须采取行动，而且我们仍在继续这么做。”\n他坚称，为了阻止德黑兰拥有核武器，这场战事不可避免。“就这场战争而言，我所做的决定不会有任何改变。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【14】"}, {"n": 15, "t": "美国中期选举结果揭晓，共和党遭遇惨重挫败。面对国会选情崩盘，共和党内部迅速出现问责声浪，并集中指向战争部长赫格塞斯。", "b": "遇惨重挫败。面对国会选情崩盘，共和党内部迅速出现问责声浪，并集中指向战争部长赫格塞斯。\n美国有线电视新闻网（CNN）引述国会消息人士报道，众议院最快将于下周复会时，就弹劾这位五角大楼一把手的动议举行全院表决。\n本次选举被共和党内部战略人士定性为“2008年级别的严重失利”，不仅痛失多处关键席位，更重挫该党未来数年的立法主导权。外界普遍认为，对伊朗军事行动直接冲击民调底线，通胀压力与中东战事久拖不决，引发选民强烈的反弹情绪。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【15】"}, {"n": 16, "t": "民主党在美国中期选举中全面收复参众两院失地，终结了行政与立法机关由单一党派把持的格局。由于不满白宫在未获授权下涉足海外冲突并推行", "b": "参众两院失地，终结了行政与立法机关由单一党派把持的格局。由于不满白宫在未获授权下涉足海外冲突并推行单边制裁，据路透社梳理， 新一届国会多数党计划自明年1月起，围绕五大核心领域全面重塑美国外交政策走向。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【16】"}, {"n": 17, "t": "美国中期选举结果出炉，共和党大败。对此，日本政府内部虽有“早有预料”的冷静看法，但也传出不安的声音，并正密切关注特朗普政权的后续", "b": "败。对此，日本政府内部虽有“早有预料”的冷静看法，但也传出不安的声音，并正密切关注特朗普政权的后续动向。有报道透露，目前高市政府最关心的，是特朗普总统在即将于中国举行的亚太经合组织（APEC）会议上将扮演何种角色，以及他会否为转移国内政局混乱的视线，而大打“中俄牌”。\n要求匿名的一位日本前外长做出严峻评估，认为此次败选“不仅会导致特朗普丧失号召力，美国在国际社会的影响力恐怕也会随之下降”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【17】"}, {"n": 18, "t": "面对民 西兰失业率从上一季度的5.5%攀升至5.7%，创下", "b": "4日）公布的最新数据显示，截至9月的第三季度，新西兰失业率从上一季度的5.5%攀升至5.7%，创下2015年以来的11年最高纪录。同期就业人数环比萎缩0.1%。这一表现显著逊于市场及新西兰央行此前维持在5.5%的预期。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【21】"}, {"n": 28, "t": "民主党已经在计划，取消Trump对加拿大新征的关税，尤其在密歇根、缅因、阿拉斯加等与加拿大贸易活跃的州，有足够共和党支持，有可能", "b": "Democrats Are Hatching a Plan to\nReverse Trump’s Canada Tariffs\nIn states such as Michigan, Maine and\nAlaska, peeling back the tariffs also\nhas drawn support from some\nRepublicans\nFrom wsj.com", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【28】"}, {"n": 36, "t": "消费不好的原因找到了", "b": "人们开始怀念煤老板了个\n当年人人都骂煤老板为富不仁，钱来得太容易\n但煤老板发财以后，又是买房又是买车\n连KTV、饭店、司机、保姆，甚至情人都能跟着发财\n现在倒好，煤老板不行了，轮到科技新贵登场。\n这些人身价几十亿、几百亿美元\n穿着同一件T恤，吃着工作餐，平常没什么开销\n钱一分不往外流，却热衷搞什么离岸信托\n最大的消费，可能是买显卡、建数据中心\n以前一个煤老板发大财，一批人跟着发小财\n现在一家巨头赚钱，转手就流进另一家巨头\nAl造出了吓人的财富，但对普通人没有喻毛线用\n工作岗位没多出来，消费也没多出来。\n煤老板至少会多请几个保姆、阿姨\n科技新贵特么的，连三姐都想换成机器人", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【36】"}], "soc": [{"n": 2, "t": "2026年11月4日凌晨5时许，陕西省商南县城区发生一起刑事案件，致3人死亡、2名出警人员受伤。犯罪嫌疑人孙某军（男，41岁，商", "b": "陕西省商南县城区发生一起刑事案件，致3人死亡、2名出警人员受伤。犯罪嫌疑人孙某军（男，41岁，商南县十里坪镇人）作案后逃离现场。案件发生后，陕西省市县公安机关全力侦查搜捕，11月6日10时许，在县城外深山一废弃房屋中发现孙某军尸体。经勘验，系自杀身亡。目前，案件正在进一步侦办中。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【2】"}, {"n": 3, "t": "被撤销全国政协委员资格两天后，女高官余艳红官宣落马。11月6日，中央纪委国家监委网站发布消息称，国家卫生健康委员会原党组成员，国", "b": "女高官余艳红官宣落马。11月6日，中央纪委国家监委网站发布消息称，国家卫生健康委员会原党组成员，国家中医药管理局原党组书记、局长余艳红涉嫌严重违纪违法，主动投案，目前正接受中央纪委国家监委纪律审查和监察调查。\n至此，2026年中央纪委国家监委已公布58名中管干部落马的消息。此外，余艳红还是中共二十大以来继李微微、赵金云、刘慧、王莉霞、乌兰、王峻、张世平、包惠、俞小平、鲁昕之后被查的第11名女高官。\n今年2月27日，余艳红被免去国家中医药管理局局长职务。\n公开信息显示，余艳红现年64岁（1962年10月生），湖南邵阳人，1978年9月考入衡阳医学院（南华大学前身之一）医疗系医疗专业，1983年8月毕业后成为衡阳医学院第二附属医院妇产科医师，两年后的1985年8月又考上湖南医科大学（中南大学前身之一）医疗系妇产科学专业硕士研究生。1988年8月硕士毕业后，余艳红进入第一军医大学第一附属医院（2004年更名为南方医科大学附属南方医院）工作，从妇产科医师逐步晋升为主任。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【3】"}, {"n": 4, "t": "11月5日，最高法院、最高检察院联合发布六起依法惩治新型、隐性职务犯罪典型案例。财新检索比对发现，其中不具名披露的案例三“张某某", "b": "院联合发布六起依法惩治新型、隐性职务犯罪典型案例。财新检索比对发现，其中不具名披露的案例三“张某某受贿、利用影响力受贿案”，被告人职务、任职经历、涉案金额、审理法院以及起诉和宣判时间等，均与早前通报的中国光大银行原党委副书记、副行长张华宇受贿、利用影响力受贿案吻合。\n张华宇曾在退休前夕辞职，中央纪委国家监委曾在“双开”的通报中称他是“提前筑巢”“逃逸式辞职”腐败的典型。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【4】"}, {"n": 7, "t": "蔚来李斌再次警告：车重增加两成 路面损耗增至2.07倍", "b": "【蔚来李斌再次警告: 车重增加两成 路面损耗\n增至2.07倍】11月5日，在2026世界互联网大会\n:乌镇咖荟:汽车夜话论坛上，蔚来创始人、董寻\n长、CEO李斌与吉利控股集团董事长李书福同\n台对话，这是双方9月28日达成充换电全面战略\n合作后的首次公开对话。这次对话议题集中于动\n力电池寿命与补能路线，在此期间，李试再度谈\n及整车重量问题。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【7】"}, {"n": 10, "t": "营哑人每月被水滴保扣费200多，连扣5年，水滴保", "b": "营哑人每月被水滴保扣费200多，连扣5年，水滴保\nBS: 已和解，正加急退款\n超角度                         们 听全文\n近日有网友发帖称，摆摊时候过来一个跑摩滴的营哑人，让帮他查查\n话费，又说有人从他账户每个月扣200多走。这位网友帮他关闭了自动\n扣费，然后找到了所谓的张海德扣他费用的平台。\n网友发布的截图显示是“水滴保险经纪”\"在扣款。\n-204.00\n2026298 v\n©  水滴保\n2026485 ~\n水滴保\nPP     Somer  mH > OM", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【10】"}, {"n": 11, "t": "花3152万装摄像头监测拾头率等数据", "b": "花3152万装摄像头监测拾头率等数据\n有没有必要”是否经过论证?\n网友质疑决策是否合法合规\n南京大学回应不能避重就轻\n南京大学通知启用智慧教室系统\n这套系统把课堂学习拆解为\n抬头、低头、人入座、出勤等冰冷的数据维度\n项目中标金额3152余万元\n覆盖仙林校区 113 间教室\n争议发酵后校方关停抬头率统计功能\n否认数据绑定学业考核\n回 As: 问法 共18集\nae ，查一下招投标流程 6&0!\n一一。\nDime: 医国 ne? DO\n1604 168 5696) @洛师傅", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【11】"}, {"n": 14, "t": "忆往昔", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【14】"}, {"n": 16, "t": "72岁董明珠逛商场，试穿六千块的羊绒大衣，直呼太便宜了谁都要来买喽", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【16】"}, {"n": 23, "t": "有人说图二这个著名的文物彩窗是对今天会面的一个预言~", "b": "对今天会面的一个预言~", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【23】"}, {"n": 29, "t": "Trump私法部“调查”哈佛等大学的部门负责人，提出辞职", "b": ": =\nHarmeet Dhillon, controversial head of Justice Department's Ci\na               Pd\nFrom cbsnews.com", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【29】"}, {"n": 31, "t": "Muse简直太强了。X上的视频下载很麻烦，我直接截图给它，让它下载到本地，翻译并加中文字幕，它很快就给弄好了――这中间剥夺了多少", "b": "下载很麻烦，我直接截图给它，让它下载到本地，翻译并加中文字幕，它很快就给弄好了――这中间剥夺了多少人赖以生存的工作？", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【31】"}, {"n": 33, "t": "今天是李沧东《可能的爱》上线Netflix平台的日子", "b": "2   le Ke uve\nTee 4%\nAN SELECT THEATERS O\nae                    ie           7", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【33】"}, {"n": 35, "t": "“另请高明”“群众都希望您出来主持工作。”", "b": "主持工作。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【35】"}, {"n": 37, "t": "@开心鸭 · @珠��大寨主", "b": "三十年前落户休斯顿的家族长辈曾经谆谆教导我“民主制度就是最不坏的制度，即使一帮混蛋在一起投票也不会选出最大的混蛋当领袖”，现在他正在怒斥德州来了太多“外人”才变蓝了，他们根本不该有投票权。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【37】"}], "intl": [{"n": 18, "t": "美国总统特朗普星期四（11月5日）声称，美国即将与俄罗斯就乌克兰问题乃至“整个欧洲”达成一项重大协议。", "b": "日）声称，美国即将与俄罗斯就乌克兰问题乃至“整个欧洲”达成一项重大协议。\n美国第一夫人梅拉妮亚此前在白宫主持一场史无前例的会议，促成俄罗斯与乌克兰两国官员面对面会谈。特朗普随后更透露，自己在白宫临时闭门会见了俄罗斯总统普京的特使德米特列耶夫（Kirill Dmitriev），但并未会见同在白宫的乌克兰代表。\n特朗普此番言论与举动，立即加剧了基辅与欧洲盟友对华盛顿可能向克里姆林宫妥协、削减在欧洲驻军并扩大俄罗斯地缘影响力的深层忧虑。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【18】"}, {"n": 19, "t": "据印尼多家媒体报道，警方星期一（11月2日）披露，自9月下旬以来已接获五起报案，累计确认至少58名印尼公民沦为受害人，涉案者甚至", "b": "（11月2日）披露，自9月下旬以来已接获五起报案，累计确认至少58名印尼公民沦为受害人，涉案者甚至包含退役国民军军人和警察。警方已在多地逮捕包括两名俄罗斯籍和一名乌克兰籍在内的13名犯罪嫌疑人，另有一人在逃。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【19】"}, {"n": 20, "t": "主打终身环游世界的美国奥德赛号游轮因燃油资金耗尽将约200名长住乘客遗弃在柬埔寨后，已于星期三（11月4日）凌晨悄然离开柬埔寨西", "b": "游轮因燃油资金耗尽将约200名长住乘客遗弃在柬埔寨后，已于星期三（11月4日）凌晨悄然离开柬埔寨西哈努克港，部分航海追踪网站显示此船正开往新加坡。\n西哈努克省旅游局向媒体证实，游轮启航时未搭载任何乘客，船上仅有约50名船员。目前仍有约100名受影响乘客滞留在柬埔寨，其余乘客和大部分船员则大多已搭乘航班飞往本区域其他国家。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【20】"}, {"n": 22, "t": "随着地缘政治局势日益紧张，美国、日本、澳大利亚和印度组成的“四方安全对话”（Quad）近年密集举行联合操演。自星期四（11月5日", "b": "、日本、澳大利亚和印度组成的“四方安全对话”（Quad）近年密集举行联合操演。自星期四（11月5日）起，四国在东京以东海域展开一连八天、代号为“马拉巴尔”（Malabar）的联合军演，以维护“自由的印太区域”为首要目标。\n“马拉巴尔”军演始于1992年，创立之初以海上救援及联合反恐为主，随后规模不断扩大，并向联合作战演训迈进。日本于2007年首度参与，而今年的演习则在美日两军共同驻扎的横须贺军港拉开序幕。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【22】"}, {"n": 25, "t": "美国总统特朗普所属的共和党在周二（11月3日）的中期选举中惨败后，欧洲极右翼政治人物纷纷开始与他保持距离，但他们大多避免直接批评", "b": "二（11月3日）的中期选举中惨败后，欧洲极右翼政治人物纷纷开始与他保持距离，但他们大多避免直接批评特朗普本人。\n2024年特朗普赢得第二个总统任期后，欧洲极右翼领导人曾大力宣扬他们与特朗普在意识形态上的紧密联系，当中一些人之后还访问了华盛顿，并获得共和党大金主、亿万富豪马斯克的支持。但随着共和党在选举中遭受重挫，他们的立场有了明显的改变。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【25】"}, {"n": 26, "t": "在共和党中期选举惨败后，外媒传美国国务卿鲁比奥将要辞职并备战下届总统选举。对此，鲁比奥当地时间11月5日予以否认，并表示将会为特", "b": "美国国务卿鲁比奥将要辞职并备战下届总统选举。对此，鲁比奥当地时间11月5日予以否认，并表示将会为特朗普工作到其总统任期结束。\nRubio：没打算辞职，不知道谣言是哪传出来的，很喜欢现在的工作，会一直做到任期结束…不想谈2028，如果Vance决定竞选总统，会第一个出来支持他", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【26】"}, {"n": 32, "t": "发现一个反贼！就是美国大使馆", "b": "10:04         als @\n美国驻华大使馆                                U.S. Embassy Beijing\njee WHITE HOUSE\nBikes:\n我们必须让美国始终伟大有\n信仰。自由。自由权。\n留  BEricO\nOamicn.e TO FO OD\n2952 8751 1065 1680", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【32】"}, {"n": 34, "t": "CNN：美国参议院外交关系委员会要求马斯克保留有关乌克兰“星链”被限制的文件，以备可能展开的调查。", "b": "会要求马斯克保留有关乌克兰“星链”被限制的文件，以备可能展开的调查。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【34】"}], "tech": [{"n": 1, "t": "美国中期选举结果引发对人工智能（AI）扩张降温的极度恐慌，触发华尔街科技股星期四（11月5日）遭遇近两年来最惨烈的单日抛售狂潮。", "b": "（AI）扩张降温的极度恐慌，触发华尔街科技股星期四（11月5日）遭遇近两年来最惨烈的单日抛售狂潮。以科技股为主的纳斯达克综合指数重挫逾5.5%，市值单日蒸发约2.5万亿美元，包括苹果、英伟达与特斯拉在内的“科技七巨头”，单日市值累计损失高达1万亿美元。\n标普500指数星期四闭市下跌4.3%，创下2025年4月以来的最大单日跌幅；道琼斯工业平均指数也大跌超过3.4%，悉数抹平了选后的全部涨幅。作为避险资产的美国10年期国债收益率则应声滑落至4.83%，创下9月以来的新低。\n川普痛心疾首", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【1】"}, {"n": 6, "t": "第一财经：韩红爱心基金会，三季度月捐收入下滑超40%", "b": "韩红爱心基金会，三季度月捐收入\n下滑超40%\n第一财经 202    13 上海 们285人\nAI摘要\n近日，据韩红爱心慈善基金会官方账号，基金会\n公布2026年1-9月月捐数据。\n数据详情显示，1-9月韩红基金会\"月捐收入超\n4.33亿元，支出超1.6亿元。数据还披露了1-6月\n月捐收入超3.33亿元，1-3月月捐收入超1.65亿\nToo\n从月捐收入看，2026年三季度，韩红基金会月捐\n收入较一、二季度出现明显下滑，跌幅超40% 。\n此前报道: PRWLROKMBRSSRARA", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【6】"}, {"n": 9, "t": "但斌：“AI时代就此落幕”概率极小", "b": "但试 Wap                       A\n26:  6 08:13 366 iPhone 17 Pro Max\n发布于     8\n一觉醒来，美股一片*\"血雨腥风\"，市场似乎在提前计价\n民主党这份《禁止人工超级智能法案》草案 。\n但以常识判断，这类法案真正落地的概率其实很低。问\n了在美国的朋友，他的看法如下: “这更多是标题党。\n国议员每年会抛出成千上万份议案，绝大多数最终都无\n法通过，提案和生效立法完全是两回事。\n个开放的社会，本就如同自由市场，各类观点都可以\n拿出来公开辩论、充分竞争，最终交由事实、罗辑与实\n践去检验…”\n此次的下跌，冲击感起比当年贸易战来袭的时候。彼时\n很多人觉得美国完了，现在不少声音又觉得AlI完了。可\n以承认这是一次阶段性的冲击，但就此判定Al时代就此\n落幕，我认为概率极小。\n放到投资上，核心就是分清议题炒作和确定性政策落\n地。Al长期的产业趋势，不会被一份激进提案轻易改\n写; 只是市场短期情绪，总是容易被抓人眼球的消息牵\n动。\n备注: 本文只是一点对投资的感悟，不构成投资建议，\nABM, MIA. AM, MAIC. AR\n资、加杠杆。适度分散投资也很重要。\n和违规处昼开比非法研究核器! 美\nGRERMMMMAIE: TAB\nSM2O% MMR, ALAA NANT,", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【9】"}, {"n": 13, "t": "大概率是真的", "b": "3亿播放只分两万\n美元，短剧出海的\n降本神话已翻篇\n10月22日，一篇行业报道把AI短剧出海的分\n账数字摆到了桌面上。\niH\n工坊CEO邓成业提到，万次播放收丛从约\n30美元， 又降到几美元。更刺眼的是另一个案例 :\n一个海外国队拿到3亿播放量，收入约2万美元，随\n后国队解散。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【13】"}, {"n": 17, "t": "李睿-lrmax:这纪念品完成度一般，非要打分的话，九十几吧", "b": "度一般，非要打分的话，九十几吧", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【17】"}, {"n": 24, "t": "塔拉里科周三接受 CNN 采访时被问到是否会接马斯克的电话，他回答：“就像我说的，我会跟任何人合作。”这位民主党人周二以约 59", "b": "时被问到是否会接马斯克的电话，他回答：“就像我说的，我会跟任何人合作。”这位民主党人周二以约 59% 对 39% 的得票击败共和党对手肯・帕克斯顿，赢得得州参议员席位；马斯克的大手笔投入最终未能阻止得州翻蓝。\n塔拉里科的这番表态最早出现在上周日 NBC 的一档采访中，当时胜负尚未揭晓。他的原话是：“在马斯克开始花 2 亿美元对付我、开始对联邦政府搞鲁莽裁员之前，我一直是他的粉丝。我是 SpaceX 和特斯拉的大粉丝。他是一位伟大的商业领袖、企业家和创新者，我希望他专注于这些事。但我不喜欢他试图买下得州这个参议员席位，不喜欢他用财富影响我们的政治体制。界限就划在这里。”他同时强调，在科技与创新领域，“只要对得州有利，我就会跟他合作”。\n马斯克近年已把 SpaceX 和特斯拉的总部都迁到了得州，星舰基地与超级工厂雇佣着成千上万得州人，一位得州参议员与他结下死仇，于州于己都没有好处。\n值得注意的是，塔拉里科的橄榄枝并不只伸向马斯克――他在同一场采访中还说，当选后的第一件事就是与在电视上骂他是“怪胎”的泰德・克鲁兹坐下来谈谈，甚至开玩笑说要送克鲁兹一件印着“我是塔拉怪胎”的 T 恤。从牧师、教师出身的塔拉里科一路走来主打的就是弥合分歧的形象，而这次胜选后的连番示好，正在把这种姿态变成他在参议院的招牌。\n \n中期选举进行时，马斯克持续疯狂攻击德州参议员竞选者Talarico。Talarico在德州胜选之后，马斯克把骂他的几十条帖子全部删掉了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【24】"}, {"n": 30, "t": "刚刚当选美国历史上首位穆斯林联邦参议员的 Abdul El-Sayed 声称：美国应该全面暂停前沿 AI 研发，不必太担心中国追", "b": "邦参议员的 Abdul El-Sayed 声称：美国应该全面暂停前沿 AI 研发，不必太担心中国追上来。\nSayed表示，中国AI只是美国AI的模仿和抄袭者，就像是被快艇拖着的划水者。美国快，中国进步也会很快，美国停止开发前沿大模型了，中国也会停止自动停止进步的。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【30】"}], "cult": [{"n": 12, "t": "近日，演员黄渤在接受采访称长时间接不到好戏，就会有疲劳感#黄渤说已经很久没接到好戏#。今年几乎已经没戏了，又想到有多少人工作是为", "b": "间接不到好戏，就会有疲劳感#黄渤说已经很久没接到好戏#。今年几乎已经没戏了，又想到有多少人工作是为了果腹，而自己从事自己喜欢的职业，又有什么好抱怨的。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【12】"}, {"n": 27, "t": "1963年，他凭借导演首作获得威尼斯电影节好评，此后却长期与审查制度发生冲突。其最具争议的作品《罗马帝国艳情史》因制片方擅自修改", "b": "威尼斯电影节好评，此后却长期与审查制度发生冲突。其最具争议的作品《罗马帝国艳情史》因制片方擅自修改影片并加入额外成人内容，引发了持续多年的创作权纠纷。巴拉斯的职业生涯横跨欧洲实验电影、历史情色史诗与女性欲性解放。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【27】"}]}}, {"date": "20261107", "label": "11月7日", "week": "周六", "id": "196614", "title": "让我提醒你几件事，叛徒", "cats": {"econ": [{"n": 5, "t": "企业主动提前还贷1800万，钱打进账户后，银行却以“内部层层审批”为由，拖近两月才扣，多收10万的利息，法院：超出时间的计息，全", "b": "企业主动提前还贷1800万，钱打进账\n户后，银行却以“内部层层审批”为由，\n拖近两月才扣，多收10万的利息，法\n院: 超出时间的计息，全额返还\n齐鲁晚报             们 25人\nAl摘要\n企业主动还钱，钱都打进账户了，银行以需要内部层\n层审批\"为由一直未予扣划。近日，武汉市江汉区人民\n法院就该案作出生效判决: 某银行在超出合理审批期限\n外多计收的10万余元利息需全额返还涉事企业。\nBANRARAT (8, FRBBAS)) 是一家扎根\n武汉的高新技术企业，这家主营软件开发的专精特新企\n业，常年为能源、通信和领域的600余家客户提供数字技\n术服务，经营一直保持稳健态势。\n2023年10月，刘训公司与某银行签订《小企业授信\n务额度借款合同》，约定借款额度2800万元，用于业\n务资金周转。借期最长为一年，年利率为3.4% ，提前\n还款须经贷款人审批。2024年10月至11月，该公司提\n取全部2800万元借款额度，某银行依约共分16笔将贷\n款发放到位，期限均为一年。\n2025年下半年，随着项目回款集中到账，讲讲公司现\n金流变得宽裕，管理层第一时间就想到了提前归还部分\n“第一次提前还款的流程特别顺畅，我们达成共识后当\n天便把资金转进去，第二天银行就完成了扣收。”赛讲\n公司相关负责人表示。\n正是基于这次顺利的合作体验，双方很快敲定了剩余\n1800 万元贷款本息于8月提前结清的方案。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【5】"}, {"n": 11, "t": "11块买套房", "b": "浙江一男子花11元拍走黑龙江准岗一套60多平房屋，拍卖公司: 买\n家还需支付2000元左右契税，不是法拍房，房屋市价4万多\n您关心的 。\n就是江苏新闻关注的\n11月5日，一套位于黑龙江礁元的房产在拍卖平台以11元拍出，引发关注。\n11月5日，拍卖公司刘经理告诉记者，这套房子原价4万多元，是平台搞的\"双十一活动，\n除了11元的购房费用，买家还需要支付两千元左右的契税，再无其他费用。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【11】"}, {"n": 24, "t": "日本卫生劳动部星期五（11月6日）公布的最新数据显示，9月份名义工资同比大幅攀升4.6%，创下近30年的最大增幅。", "b": "日）公布的最新数据显示，9月份名义工资同比大幅攀升4.6%，创下近30年的最大增幅。\n强劲的薪金增长数据进一步印证日本正逐步摆脱长达数十年的通缩与工资停滞怪圈。市场普遍预期，这将为日本中央银行于12月上调基准利率铺平道路。\n据彭博社报道，官方统计显示，日本9月份基本工资增长3.7%；在剔除花红、加班费及样本扭曲因素后，全职员工的工资更录得3.1%的创纪录涨幅。此外，扣除房租影响后的实际现金收入同比增2.2%，较8月份修正后的1.6%增幅进一步提速，远超经济师此前预估的1.3%。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【24】"}], "soc": [{"n": 1, "t": "#多方回应保定一在建大桥坍塌#11月7日，有多位网友在短视频平台发布消息，称河北省保定市南三环沧榆高速段的高架桥发生垮塌，现场疑", "b": "11月7日，有多位网友在短视频平台发布消息，称河北省保定市南三环沧榆高速段的高架桥发生垮塌，现场疑有人员受伤。\n视频显示，通车的路段上方有桁架桥坍塌到路面，桥体钢结构发生变形，现场可见有车辆受损，其中一辆红色货车车头变形严重，路面散落碎片，道路通行受阻。\n视频拍摄者称事发地为河北省保定市南三环沧榆高速段，倒塌的桥体钢结构为正在建设的南三环，现场疑有人受伤。\n11月7日13时许，新黄河记者致电辖区交警大队，工作人员表示，目前高速路段还没有通车，桥还在路上塌着，在等吊车处理。保定市应急管理局工作人员表示，刚发生的事情，工作人员已前往现场处置，是否有人员受伤还在核查中。\n公开信息显示，南三环作为保定市重点民生工程、城市路网提质升级核心项目，南三环项目起点位于南二环与东三环交叉处，途经莲池区、清苑区，终点对接西三环南延路段。该路全长21.8公里，按照双向六车道一级公路标准建设。项目采用分段建设模式，其中莲池区段2.1公里，清苑区段19.7公里，全线涵盖道路、桥梁、绿化、交安、照明等配套工程，建成后将极大完善保定南部主干路网体系。截至11月5日，南三环还在建设中，全线贯通已进入倒计时。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【1】"}, {"n": 4, "t": "5名子女2001年约定每月给父母20元赡养费，20多年后已难维持，年过七旬的老夫妻起诉要求“涨价”；法院：子女每人每年支付700", "b": "5名子女2001年约定每月给父母20元购\n养费，20多年后已难维持，年过七旬的\n老夫妻起诉要求“涨价”; AR: 子女每\n人每年支付7000元\n成都日报 202    7       QREX\nAl摘要\n一纸分家协议定下每月20元购养费，时隔二十余年，\n物价、医疗支出早已今非车比。\n近日，一起购养纠纷在四川广安法院宣判: 一对年过\n七旬的老夫妻，因早年约定的峰养费用难以维持生活\n就医所需，将五名子女诉至法庭。广安法院在尊重原\n有家庭约定的基础上，结合现实情况上调购养费，以\n司法力量守护孝老美德。\n王某某、夏某某夫妇今年均已七十有余，一共养育五\n个子女。早在2001年，一家人签下分家协议，约定四\n个儿子每人每月给付购养费20元。\n寺光流转二十余载，二老年岁渐长，常年饱受慢性病\n困扰，日常用药、就医开销不断增加。伴随着物价持\n续上涨，当年定下的购养费早已不足以支撑基本生\n活\n五名子女虽都具备赂养能力，却就购养费标准无法达\n成一致，无奈之下，二老走上法庭。\n承办法官审理后认为，当年的分家协议出自一家人真\n实意愿，应当予以尊重，但购养义务并非一成不变。\n购养费标准应当结合老人实际需求、健康状况、当地\n生活水平以及子女经济条件动态调整，不能固守多年\n前的旧约定。\n综合各项因素，广安法院依法作出判决，五名子女自\n2025年起，每人每年向两位老人支付购养费七干余\n元。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【4】"}, {"n": 7, "t": "招老师不发工资，还要求全日制普通院校本科以上学历，学校提供跟岗位及教育教学资源，无薪酬待遇…… 校方：考虑不周全，已停止招募，未", "b": "11月4日，山西省太原市万柏林区育华小学发布招\n募跟岗教师信息，引发关注。招聘信息显示，该岗\n位从社会招募，无薪酬，食宿需自理。\n潇湘晨报晨视频记者注意到，招募信息显示，跟岗\n教师岗从社会招募人员，并非在校生实习项目。被\n招募者需取得本科及以上毕业证、学位证，拥有小\n学及以上教师资格证等证书，日常参与备课、磨\n课、班级管理、课后服务、校园活动组织等工作，\n招聘岗位涉及语文、数学、英语等。\n小      主要工作内容\n参与备课、听课、磨课、试教、作\n业批改、班级管理、课后服务、校园活\n动组织等教育教学相关工作。\nws\ny           待遇与保障\n无薪酬待遇。\n2.跟岗期间须遵守学校各项管理制度。\n5.学校可以安排校内午休，请自行解决\n食宿问题。\nYA", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【7】"}, {"n": 12, "t": "割不完的韭菜多5", "b": "割不完的韭菜多          5\n@alpinekaka\n2000年前后，新加坡的高中来中国几个高\n考大省的重点初中搞选拔，把最拔尖的学生\n挑走，给一百多万的奖学金，代价是毕业后\n得给新加坡服务若干年。这批人后来大多留\n在了新加坡。\n浙江省政府看出门道以后，是全国最早叫停\n26年11月3日, 17:47 - 838K 查看次数\nO37 了记121 Sas4k 内649 吧\n相关“                 查看引用 >\nLuZhang@Ogjanglo3.… :3天 SG\n十几年前我在某高考大省读省重点高\n中，新加坡来我们学校招人，班主任告\n诉我们说新加坡大学也就那样，排名高\n是因为说英语，实际水平不如普通一\nA; 如果觉得自己考不上一本，就去报\n名试试，不然就安心准备月考。当时信\n息闭塞，我们都信以为真，没人报名，\n结果后面发现教师子女全都报名了。\n013    1110    9 921   A Ss", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【12】"}, {"n": 13, "t": "别说我看见好东西不和你们说。我已经下单了，4块钱，后天我们那单元电梯就会出现这道符。", "b": "已经下单了，4块钱，后天我们那单元电梯就会出现这道符。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【13】"}, {"n": 27, "t": "共和党众议院高层，给各委员会发函：抓紧时间，为以后应付民主党的调查做准备", "b": "288 Guoon Howe omcs Bone\n‘Winsmorie OC 20518\n(202) 2252018\nSTEVE SCALISE\n[MAJORITY LEADER\nCongress of the Gnited States\nHouse of Representatives\n‘Washington, BE 20515-6502\nNovember 5. 2026\nDespite all of your great work in committee and the work of our conference, we were\nunable to defy history. Unfortunately, that means we need to begin preparing for\nHouse Democrats to control the committee gavels next Congress. Although they ran\n‘on affordability, it is clear the main focus of their new majority will be retribution and\nunleashing countless witch hunts under the guise of “oversight.”\nHouse De", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【27】"}, {"n": 33, "t": "他需要一个城楼，还需要一个斯诺", "b": "纽约客这期的封面太应景了", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【33】"}], "intl": [{"n": 3, "t": "刘修洪在采访中讲述了他在妙瓦底看到的一幕：有个20多岁的中国男孩，被迫自己挖坑后跳进坑里，被其他人活埋，过程中，这男孩骂了一句：", "b": "看到的一幕：有个20多岁的中国男孩，被迫自己挖坑后跳进坑里，被其他人活埋，过程中，这男孩骂了一句：“强哥，我恨你，我做鬼也不会放过你。”\n四川绵竹38岁男子刘修洪，被认识十几年的朋友以去泰国收生意回款为由诱骗出境。落地曼谷后，他上车被拉往达府，之后被人控制，遭蒙眼持枪胁迫，强行偷渡送入缅甸妙瓦底电诈园区。\n但由于他年龄偏大，被嫌弃“不好转手卖掉”，当成搭售赠品流转。到了园区后他被逼背数百页诈骗话术，不愿配合就遭受殴打。好在他学过四年中医，靠给园区老板把脉看病，才减少了皮肉之苦。\n最终，他姐姐赶往泰国多方奔走求助，联系使领馆和当地警方，同时借助网络舆论施压，最终花费三十多万通过救援队赔付给园区，刘修洪才被园区释放。\n@蘸盐:回国也不一定安全。建议管住嘴巴，少揭批电诈。要不然被跨境盒出住址和生活轨迹，被跨境买凶定点清除了，凶手最多判个死缓，“他不过是把你踢晕抛弃野外，你自己高血压也要负次要责任”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【3】"}, {"n": 14, "t": "美国总统特朗普在美俄乌三方会谈临近之际会见俄总统特使德米特里耶夫，并称解决俄乌战争的相关协议有望很快达成，而且可能涵盖整个欧洲。", "b": "临近之际会见俄总统特使德米特里耶夫，并称解决俄乌战争的相关协议有望很快达成，而且可能涵盖整个欧洲。德米特里耶夫早前在白宫参加由美国第一夫人梅拉尼娅主持的会议，俄乌两国代表罕见面对面会谈；之后，特朗普临时闭门会见德米特里耶夫，但并未与同在白宫的乌方代表会面。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【14】"}, {"n": 15, "t": "美国民主党在中期选举大获全胜，过去两年受益于特朗普政府支持的人工智能产业，恐将面临更严格的监管。其中，数据中心扩建计划首当其冲，", "b": "过去两年受益于特朗普政府支持的人工智能产业，恐将面临更严格的监管。其中，数据中心扩建计划首当其冲，全美约一半的拟议扩建规模可能受到更严厉的审查。据彭博社报道，原本被科技企业视为投资理想地点的得克萨斯州和俄亥俄州，在这次中期选举后均将由民主党州长主政。随着民众日益担忧数据中心大量耗水耗电、推高电费，新任州长可能收紧审批，甚至暂停新项目建设。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【15】"}, {"n": 16, "t": "美国民主党正筹划在明年掌控国会后，推动撤销特朗普政府的部分关税措施，首个目标是取消对加拿大商品加征的关税。", "b": "后，推动撤销特朗普政府的部分关税措施，首个目标是取消对加拿大商品加征的关税。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【16】"}, {"n": 17, "t": "美国共和党在中期选举中痛失国会两院控制权后，党内随即掀起互相指责的浪潮，而矛头主要指向特朗普政府。总统特朗普的盟友和政治策略师纷", "b": "两院控制权后，党内随即掀起互相指责的浪潮，而矛头主要指向特朗普政府。总统特朗普的盟友和政治策略师纷纷呼吁他改组白宫人事并重整纪律，同时放弃伊朗战争和关税等被认为导致了此次惨败的政策。\n资深共和党策略师费赫里形容，本届中期选举结果对特朗普来说是巨大的灾难。费赫里告诉路透社：“他需要彻底整顿白宫。从现在开始的每一天，他会越来越像跛脚鸭。”\n一些党内元老也公开抨击共和党。得克萨斯州参议员科宁在《华尔街日报》发表评论，批评共和党犯下一连串原本可避免的政治错误，包括支持丑闻缠身的帕克斯顿在初选中挑战他，并最终代表共和党竞选得州参议员。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【17】"}, {"n": 18, "t": "中期选举大败后川总开铡的第一人是自己的幕僚长苏珊苏茜・怀尔斯。继任者是斯蒂芬・米勒，他是少数仍在位的一任幕僚，也是一号亲信。此前", "b": "是自己的幕僚长苏珊苏茜・怀尔斯。继任者是斯蒂芬・米勒，他是少数仍在位的一任幕僚，也是一号亲信。此前下台的国安部长曾公开表示她都是按川总和米勒的指示做事。\n白宫最后一个正常人苏西怀尔斯也走了，更加右翼极端的米勒当上了白宫大总管", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【18】"}, {"n": 19, "t": "原先表明会接受中期选举结果的美国总统特朗普改口，转而抨击选举舞弊。但随着民主党的胜利势头持续扩大，多数评论认为特朗普即使不接受选", "b": "国总统特朗普改口，转而抨击选举舞弊。但随着民主党的胜利势头持续扩大，多数评论认为特朗普即使不接受选举结果，也无法掀起波澜或逆转局面。目前，连密西西比州都出现民主党可能赢得参议院席位的爆冷情况。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【19】"}, {"n": 20, "t": "美国因田纳西州死刑犯Christa Pike处决失败，使死刑问题再度受到关注之际，加州州长纽森（Gavin Newsom）5日宣", "b": "ta Pike处决失败，使死刑问题再度受到关注之际，加州州长纽森（Gavin Newsom）5日宣布对该州所有死刑犯全面减刑，将548名死囚的刑期改为终身监禁且不得假释。#加州对所有死刑犯减刑#\nCNN报道，正考虑角逐2028年白宫大位的纽森在一封致加州居民的公开信中表示，「我今天的决定是在我身为民选官员，公开反对国家实施死刑近30年后做出。」加州是全美死刑犯人数最多的州，上次执行至今已经过20年，纽森早在近8年前宣布暂停执行死刑。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【20】"}, {"n": 21, "t": "世界卫生组织估计，全球有四分之一11至17岁的青少年几乎不进行任何体育活动，每周运动时间甚至不足一小时。世卫警告，这会显著增加健", "b": "一11至17岁的青少年几乎不进行任何体育活动，每周运动时间甚至不足一小时。世卫警告，这会显著增加健康风险。\n世卫星期三（11月4日）在《柳叶刀全球健康》发表的研究报告，汇集140个国家和地区的数百项人口调查，涉及超过320万名青少年。\n每四名11至17岁的青少年中就有一人说，在过去一周内没有任何一天达到活跃标准，即进行至少60分钟中等至高强度的体育活动。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【21】"}, {"n": 22, "t": "驻日本冲绳美军星期五（11月6日）宣布，将对全体驻冲绳美军人员实施的宵禁措施延长一个月，直至12月7日，延长措施适用于低军衔军人", "b": "日）宣布，将对全体驻冲绳美军人员实施的宵禁措施延长一个月，直至12月7日，延长措施适用于低军衔军人。\n今年10月初，冲绳县那霸市发生一起美军士兵涉嫌抢劫杀害一名日本女性的案件，涉事美军士兵随后被警方逮捕。事件发生后，驻冲绳美军宣布，从10月9日起实施为期30天的宵禁，并加强对军事基地出入口的监控。\n共同社报道，根据宵禁规定，所有驻冲绳美军人员不得在每日零时至凌晨5时外出。然而，在宵禁措施生效期内的10月31日凌晨，一名美国海军陆战队士兵因涉嫌酒后驾车被逮捕。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【22】"}, {"n": 23, "t": "美国总统特朗普推动的巨型凯旋门计划，星期四（11月5日）获国家首都规划委员会以8票对4票通过，但一名联邦法官星期五（6日）凌晨随", "b": "计划，星期四（11月5日）获国家首都规划委员会以8票对4票通过，但一名联邦法官星期五（6日）凌晨随即颁令，禁止政府在14天内动工。\n凯旋门高76米，拟建于弗吉尼亚州阿灵顿国家公墓的附近。建成后，凯旋门将比不包括基座的自由女神像高出约30米。\n反对者认为，这座拱门规模过于庞大，与周边天际线格格不入，也会破坏首都地区多处地标之间经过精心设计的视线景观，尤其是林肯纪念堂与阿灵顿国家公墓之间的视线。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【23】"}, {"n": 25, "t": "布林肯在中期选举结果出来后，这位前国务卿在社交账号上写了一段话。他说，“美国人在国际上怎么行事，最终会原封不动地落到自家餐桌上。", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【25】"}, {"n": 28, "t": "美国科技行业持续流失就业岗位：上个月整体就业人数减少了9000人，过去一年累计减少了7.3万人。岗位减少的状况已接近2024年科", "b": "400k\n300k|\n200k|\n400k\nok\n100k\nYear-on-Year Change in US Tech Employment\nEmployment Growth in the Tech Sector Has Been Noticeably Weak\nIMI Software Publishers.\nCustom Computer Programming Services\nComputing Infrastructure, Data Processing, Web Hosting, & Related\nIl Computer Systems Design Services\n恒 Web Search Portals and All Other Information Services\nStreaming Services, Social Networks, & Related\n[= Total Tech Employment Growth\n2020                                    202\nDate\nGraph created by @JosephPoltan using BLS data", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【28】"}, {"n": 29, "t": "在大鹅做生意，就是这个下场", "b": "8:16\n国 Sul “Cutt G5):\ni Se BI eh XS ee OQ.\n普京签署法令\nRESET\n, OA Sean) v\n普京签置法念接篇目并\n产，该集团是俄最大\nS @讲远辑做投次                    S @引延明", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【29】"}, {"n": 30, "t": "美国宣布制裁与柬埔寨太子集团有关联的数十家企业及个人，以及一个涉嫌诈骗美国人的马达加斯加网络诈骗团伙，以打击跨国网络诈骗和洗钱活", "b": "关联的数十家企业及个人，以及一个涉嫌诈骗美国人的马达加斯加网络诈骗团伙，以打击跨国网络诈骗和洗钱活动。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【30】"}, {"n": 32, "t": "特朗普：不准把椭圆形办公室改成正方形；如果有人要改，无论我在哪里，你们都给我打电话，我会回来阻止", "b": "RANT ARAN, ARR MR AA REE A\n形办公室从椭圆形改成正方形，就必\n须提交国会审议。他说:“和希望国会\n议员们足够明智，不会允许这种事情\n第一财经 @           aves\n特朗普: 不准把椭圆形办公室改成正 5° -\n方形; 如果有人要改，无论我在哪…\n=", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【32】"}, {"n": 34, "t": "著名的美国政治策略家里克・威尔逊，《林肯计划》的创始人之一，对贾里德・库什纳关于“欧洲安全新架构”的声明作出了回应。", "b": "逊，《林肯计划》的创始人之一，对贾里德・库什纳关于“欧洲安全新架构”的声明作出了回应。\n“让我提醒你几件事，叛徒”，列出了六点指控。\n“首先，‘欧洲安全架构’――这是俄罗斯元首使用的表达。我们已经有这样的架构了。它叫北约。其次，你一如既往地把这场战争的受害者和侵略者放在同一板子上。侵略者是俄罗斯。第三，俄语中的‘根本原因’意味着‘照我们的办’，你很清楚这一点。”\n但第四点尤其重要：“一个字也没提到撤出俄罗斯狗屎军队、被占领土、战俘或被偷走的乌克兰儿童。奇怪，对吧？”\n最后两点：“这是拉夫罗夫给你写的”和“去他妈的普京，去他妈的俄罗斯，去他妈的你”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【34】"}], "tech": [{"n": 2, "t": "国家广播电视总局：部署开展新一轮微短剧低俗化同质化专项治理工作。", "b": "新一轮专项治理聚焦两个方面的突出\n问题，内容创作方面，深化治理儿童\nRAR. RETR. Row. FE\n金主义、严重违背家庭伦理道德等低\n俗不良内容; 治理未按要求备案审核\n声”问题，规范AI微短剧创作。\nMy 国家广播电视总局 人        wi\n家广播电视总局部署开展新一轮微\n短剧专项治理工作", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【2】"}, {"n": 9, "t": "台湾宜兰知名寺庙“东林寺”近日被指涉嫌洗钱及侵占善款。据报道，住持张清羽及其已出家的儿子张维夫长期骗取信众捐款并挪用寺庙财产，总", "b": "14098868                           20k\na          7 Q\nUps FS 8002 Pane\n台湾东林寺主持父子涉嫌侵吞 |\nSe Sadat\nde    C136: ub   pai v\nQ 大家都在搜，东林寺住持张清羽身份       >\n友善评论，文明发言\na  ay", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【9】"}, {"n": 10, "t": "网传余承东不再直管汽车业务，近一个月未更新汽车内容（新浪科技）", "b": "11-07 13:26:30                                 人@) 102.09万 阅读\n网传余承东不再直管汽车业务，近一\n个月未更新汽车内容\n近日，有消息称“余承东不再直接管理华为汽车\n业务\"。有博主援引前华为车BU老员工话语称:\n“自从老余 (RAR) 不直管车业务后，车BU的\n领导们对业务、产品都不太关心，他们关心的是\n其他东西，变得很官估。\"”值得注意的是，近一\n个月以来，余承东的社交平台已未发布任何关于\n汽车的内容，近期车企密集公布销量时，他也未\n像往常一样发布鸿蒙智行相关战报。在此之前，\n2025年4月，余承东曾卸任华为智能汽车解决方\n案BU董事长一职，转任独立公司“引望\"副董事\n长，不再负责车BU技术方案的日常运营。 (新\n浪科技)", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【10】"}, {"n": 26, "t": "AMD CEO: 市场短视，没办法…长期看好AI，会影响到生活的方方面面…接受速度很快，Muse四十五天内用户超过一千万…AMD", "b": "AMD CEO @          :\"The market can\nbe short-sighted, but it is what it is.\"\nLong-term, AMD's CEO believes in Al\ndemand and that computing and\nintelligence will affect every aspect of\nour daily lives.\nfinance\nyghoo!         AMD TOPS ESTIMATES AS Al CHIP DEMAND SOARS", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【26】"}, {"n": 31, "t": "\u003c金融时报>援引知情人士报道，美国官员今年根据情报撰写的备忘录称，黄仁勋曾与英伟达客户、新加坡Megaspeed公司高管Alic", "b": "oS Pee |", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【31】"}], "cult": [{"n": 6, "t": "据报道，近日，一位开通了爱奇艺白金会员的用户通过平板上的爱奇艺App观看电视剧时，将电视剧投屏至安装了奇异果App的电视观看。结", "b": "白金会员的用户通过平板上的爱奇艺App观看电视剧时，将电视剧投屏至安装了奇异果App的电视观看。结果临近剧情大结局的关键情节，屏幕上下左右突然飞入大量带着“CS扫描王”标识的弹幕，直接打断了正常的观剧节奏。几分钟后，在同一集里这一情况又出现了一次，其他剧集里则没有出现，两段广告加起来有大约20秒长。该用户事后发帖吐槽，称这是年度最恶心的广告，平台选择了一种最影响观看体验的方式，强行污染了用户的观看感受。\n不过，广告投放商CS扫描王则向媒体表示“委屈”，否认干扰与公司有关。其客服人员直称，公司正常在爱奇艺平台上投放广告，至于如何操作这个广告，则并不清楚，因此建议咨询平台方。\n而随着事件发酵，奇异果客服回应声称，会员在广告方面的特权主要是减免观看点播内容前的部分贴片广告，此次出现的内容属于“弹幕广告”，不包含在会员广告权益内。该客服表示，平台会管控商业弹幕出现的数量和频率，后续将持续优化产品体验，如果用户遇到上述广告，可按遥控器返回键、拖动进度条或进行屏蔽操作。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【6】"}, {"n": 8, "t": "张艺谋导演认为AI等新技术带来的一个最明显的改变就是─技术平权，AI等新技术让普通人动手拍一部电影变得容易。", "b": "的一个最明显的改变就是─技术平权，AI等新技术让普通人动手拍一部电影变得容易。\n短视频/短剧/AI漫剧对观众的精力争抢很厉害，张艺谋导演在出行途中飞机场/高铁火车站经常能看到大姐一直在刷短视频/短剧/AI漫剧，所以新一代的导演面临的挑战也很现实，如何用电影争夺观众的精力，是坚持“手搓”拍电影还是用AI制作长片。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【8】"}]}}, {"date": "20261108", "label": "11月8日", "week": "周日", "id": "196623", "title": "星空与圆月是公平的，它会一直陪着抬头望见月亮的人", "cats": {"econ": [{"n": 10, "t": "你在哪个格子呢？", "b": "一同房房租占收入(% )\n你的城市，把你放在哪个格子里\n100 个城市.月薪和房租一交叉，分成四种活法\n咬牙硬撑          | 给房东打工\naR £5000 - 15         ‘I >5000- Wal >15%-17 98\nao \u003c9: 2088       ;\n少\nao            “00            5000            000\n月可支配收入(元/月)\n|B 5000-9 :15% 26 98", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【10】"}, {"n": 21, "t": "日本首相高市早苗在年初众议院选战中承诺的食品消费税减税方案，星期五（11月6日）终于在众院获得通过。法案的核心内容是，从2027", "b": "战中承诺的食品消费税减税方案，星期五（11月6日）终于在众院获得通过。法案的核心内容是，从2027年4月起，两年内将食品消费税率从目前的8%降至1%。政府也计划为中低收入受雇者提供补助金配套，以缓解通胀带来的生活压力。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【21】"}, {"n": 22, "t": "“黄金时代”是骗局",
