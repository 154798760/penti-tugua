:~:text=【31】"}], "intl": [{"n": 2, "t": "11月6日，美国、英国、德国、法国、澳大利亚、加拿大、意大利、日本、荷兰和新西兰对外发表联合声明，对乱港分子黄之锋因串谋勾结案被", "b": "法国、澳大利亚、加拿大、意大利、日本、荷兰和新西兰对外发表联合声明，对乱港分子黄之锋因串谋勾结案被判刑予以谴责。严重干涉中国内政！", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【2】"}, {"n": 13, "t": "也门胡塞武装当局称，沙特阿拉伯领导的多国联军空袭也门首都萨那以东一座村庄，造成至少33人死亡、39人受伤，死伤者包括多名妇女和儿", "b": "领导的多国联军空袭也门首都萨那以东一座村庄，造成至少33人死亡、39人受伤，死伤者包括多名妇女和儿童。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【13】"}, {"n": 15, "t": "美军周五（11月6日）宣布悬赏2000万美元（约2565万新元），征集有关伊朗核计划的情报。与此同时，美军对伊朗发动新一轮军事打", "b": "2000万美元（约2565万新元），征集有关伊朗核计划的情报。与此同时，美军对伊朗发动新一轮军事打击。\n美军中央司令部在社交媒体平台X发文说，任何人若提供有关伊朗核设施、设备和科研人员等的情报，除了可获得高额奖金，也可获得重新安置，以确保人身安全。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【15】"}, {"n": 16, "t": "临近中期选举时，特朗普的支持率跌至执政以来的个人低点，并接近历任美国总统的最低水平，这使他对自己的政治与宣传团队感到不满。一名知", "b": "跌至执政以来的个人低点，并接近历任美国总统的最低水平，这使他对自己的政治与宣传团队感到不满。一名知情人士透露，特朗普已声言，随着民主党重新掌握国会权力，白宫须采取更具进攻性的姿态。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【16】"}, {"n": 17, "t": "白宫国家经济委员会主任哈塞特星期五（11月6日）接受彭博电视访问时说，特朗普政府的经济政策奏效，无须改变。他认为，民主党在选举中", "b": "期五（11月6日）接受彭博电视访问时说，特朗普政府的经济政策奏效，无须改变。他认为，民主党在选举中获胜并不表示选民否定特朗普的供给侧政策，这些措施让12万美国民众投入到新厂房的建设。\n哈塞特说，特朗普确实担心“他凝聚的正面动力如今可能被取得更大权力的民主党翻转”。但他相信，民主党人“要推翻创造出强劲就业市场的各个伟大政策将困难重重，因为总统将行使否决权”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【17】"}, {"n": 18, "t": "当地时间11月7日，美国总统特朗普宣布，他已邀请美国终极格斗冠军赛（UFC）总裁达纳・怀特担任白宫新闻秘书一职。知情人士透露，怀", "b": "朗普宣布，他已邀请美国终极格斗冠军赛（UFC）总裁达纳・怀特担任白宫新闻秘书一职。知情人士透露，怀特拒绝了特朗普的邀请。\n“我很高兴地宣布，伟大的达纳・怀特，一位斗士，已被邀请担任美国新闻秘书一职。”特朗普社交媒体平台“真实社交”上发文写道。\n据美国有线电视新闻网（CNN）报道，特朗普助手称，特朗普此举只是在开玩笑。但消息发布之际，特朗普仍在寻找新的新闻秘书。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【18】"}, {"n": 19, "t": "美国民主党在中期选举中大胜，年轻选民的支持成为关键，也带动社交媒体兴起“千禧世代乐观主义”怀旧潮，让人回想起2008年奥巴马当选", "b": "轻选民的支持成为关键，也带动社交媒体兴起“千禧世代乐观主义”怀旧潮，让人回想起2008年奥巴马当选总统时的乐观氛围。\n法新社报道，紧身牛仔裤、猫头鹰项链等都是2000年代末至2010年代初的流行文化象征。如今，相关怀旧视频和贴文在社交媒体广泛传播，部分浏览量达数十万次。\n对目前18岁至29岁的Z世代而言，星期二（11月3日）的选举胜利，让他们首次感受到上一代千禧世代在2008年奥巴马当选美国总统时的兴奋情绪。\n两个世代都在美国深陷海外冲突、国内经济前景不明朗的背景下参与政治，而年轻选民也在两次选举中扮演关键角色。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【19】"}, {"n": 20, "t": "欧洲多地周五（11月6日）再接获连环炸弹恐吓，爱尔兰、英国和保加利亚的媒体机构也收到威胁电邮，显示恐吓目标可能正从民航领域扩大至", "b": "获连环炸弹恐吓，爱尔兰、英国和保加利亚的媒体机构也收到威胁电邮，显示恐吓目标可能正从民航领域扩大至其他领域 。\n往返里斯本、罗马、布拉格和索菲亚等地的11趟航班日前受到炸弹威胁，部分客机被破改道降落，匈牙利更出动战斗机护航。涉事飞机均已降落，当局至今未发现任何爆炸装置，也无人受伤。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【20】"}, {"n": 23, "t": "本月起，韩国国会正式启动明年度预算审议，文化体育观光部长官崔辉永将引入暂称“青年文化体育通行证”作为政府草案的“核心课题”加以提", "b": "预算审议，文化体育观光部长官崔辉永将引入暂称“青年文化体育通行证”作为政府草案的“核心课题”加以提及。\n据政界2日消息，崔长官前一天通过题为《文化现场的声音，将努力纳入明年度预算》的Facebook文章介绍称：“这是一项旨在扩大经济困难青年群体享受文化的机会，帮助青年成长为能动性文化消费主体的制度。”\n崔长官特别强调：“将从明年起每年向19~34岁所有青年发放补贴，首都圈居民10万韩元、非首都圈15万韩元，可用于演出、展览、电影、图书等文化领域以及体育观赛”，“同时加强各文化艺术领域的创作与制作支持，帮助艺术家更频繁地登上舞台，并细致反映旨在缩小地区间文化差距的各类定制化项目。”\n崔长官还表示：“明年预算案中投入最大力度的部分是构建‘艺术人社会安全网’。”他说明称：“为使自由职业艺术人也能享有与普通职场人水平相当的稳固安全网，相关预算从今年的345亿韩元大幅增至明年的966亿韩元”，“具体而言，工伤保险支持对象从今年的4400人大幅扩大至3.9万人，保险费支持比例也从50%提高至全额（100%）。”\n接着他表示：“国民年金支持对象和综合健康体检支持范围也将扩大，艺术人生活稳定资金和全租资金贷款预算也一并增加。”\n崔长官表示：“还准备了用于进一步推动风靡全球的K文化全球扩散的预算”，“将以文化艺术政策咨询委员会传达的现场迫切声音为指南针，为让艺术人、创作者以及全体国民都真正需要的明年度预算在国会获得通过而竭尽全力。”\n此前，文体部于9月3日编制并向国会提交了总规模9.6345万亿韩元的2027年度预算案，其中包括内容政策金融2.2万亿韩元、青年文化体育通行证7925亿韩元等。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【23】"}, {"n": 24, "t": "一名朝鲜脱北者称，自己17岁抵达韩国后，", "b": "一名朝鲜脱北者称，自己17岁抵达韩国后，\n第一次接触自由，竟然一度想回朝鲜。\n“他们给我做了分班测试，我发现自己需要\n和7岁的小孩一起学习。我甚至不知道什么\n是大洲，也不知道非洲在哪里。”\n在韩国的适应中心，她从零开始学习使用\nATM、乘公交车、坐电梯。\n“我真的以为，ATM里面有人在把钱递给\n你。当你去购物时，有10条不同的裤子可以\n选择。而在朝鲜，是政权蔡你作决定。自由\n很难。我当时甚至想，只要有最基本的食物\n吃，我就愿意回朝鲜。”\nRogan 惊讶地问她为什么。\n“因为我不习惯思考。思考对我来说很难。\n我以前从来不需要自己思考。你就不能直接\n告诉我该做什么吗?”因为我非常擅长服从命\n> ”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【24】"}, {"n": 25, "t": "特朗普政府官员斯蒂芬・米勒的舅舅大卫・格洛瑟接受美国有线电视新闻网采访时，批评米勒在移民问题上虚伪。他指出，米勒家族正是依靠亲属", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【25】"}, {"n": 27, "t": "少谈点主义，多谈点民生", "b": "RAR Oo           X.com\neee ©ChineseWSJ\nShow translation\nHAE RUS 在这场对特朗普构成重大挫败的中期\n选举中，民主党赢得了国会两院控制权、过半数\n州的州长职位等诸多胜利。在此过程中，该党做\n到了多年来一直难以做到的一点: 统一竞选主\n张，聚焦生活成本问题。\nFrom cn.wsj.com", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【27】"}], "tech": [{"n": 5, "t": "这款神奇的戒指名为Brainkey即沃智能指环，微信小店相关链接显示其价格为2699元，相关简介中写道该戒指可“重塑平衡本能，脑", "b": "ey即沃智能指环，微信小店相关链接显示其价格为2699元，相关简介中写道该戒指可“重塑平衡本能，脑科学研究转化高级复合微磁材料，辅助前庭系统平衡感知和神经信号传导，助力身体平衡协调表现”。不过该产品被不少人质疑缺乏科学依据。猎豹移动董事长傅盛发视频公开质疑该指环，并称“江湖骗术层出不穷”。\n目前相关公开信息显示，Brainkey即沃智能指环为物产中大数字安全科技（浙江）有限公司产品。天眼查app显示，该公司成立于2024年，2026年4月起该公司曾多次申请“brainkey ring”、“brainkey”、“即沃”等在内的多个商标，目前仍处于等待实质审查阶段。不过蓝鲸新闻记者发现该公司于今年4月登记著作权“KRing APP(ios版）（V1.0）。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【5】"}, {"n": 7, "t": "余承东近一个月没发汽车了，网传他不再直管汽车业务……然后，他就发汽车相关的微博了", "b": "华为常务董事、产品投资评审委员会主任、终端BG董事长\n2026/11/07 15:17\n享界V8 全国试驾1\nrT\n验，期待听到大家\n请期待!\n启，欢迎带上家人一起体\n风真实反馈 会发布会临近，语", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【7】"}, {"n": 9, "t": "@星环Star:花钱用Seedance模型做视频；传到平台还得花钱去投流，不然没人看；至于投流效果，这东西是黑盒，你也不知道它的", "b": "ance模型做视频；传到平台还得花钱去投流，不然没人看；至于投流效果，这东西是黑盒，你也不知道它的算法是什么样的，最后靠播放激励赚到的钱说不定还没有前期投入来的高，平台全流程吃干抹净", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【9】"}, {"n": 11, "t": "好消息传来，任泽平去美国了", "b": "重磅利好来了\n知名反指、网红经济学家去美国了\n哈哈哈，A股大利好、美股大利空\n《         详情\n= eee\nCh ARMA, FERENMeS>\nSores", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【11】"}, {"n": 12, "t": "这起事件星期六（11月7日）发生在克拉科夫中央集市广场（Main Market Square）附近。", "b": "生在克拉科夫中央集市广场（Main Market Square）附近。\n波兰私营电视台TVN24最初引述当地消防局的消息报道，枪击案造成两人死亡、至少10人受伤。不过，波兰警方随后证实，死亡人数已升至至少五人。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【12】"}, {"n": 14, "t": "欧洲反对人工智能（AI）数据中心无序扩张的抗议浪潮全面升级。数百名环保及气候正义示威者星期五（11月6日）强行闯入微软位于荷兰阿", "b": "心无序扩张的抗议浪潮全面升级。数百名环保及气候正义示威者星期五（11月6日）强行闯入微软位于荷兰阿姆斯特丹的一处大型数据中心工地，阻止施工以抗议大型数据中心建设。\n \n今天美国科技股大跌，跟民主党胜选确实有一定的关系，因为民主党要推动严格限制AI算力中心修建的法案。\n哦对了，谷歌今天（11月5日）刚刚宣布了一项170亿美元的计划。说谷歌正在调整数据中心的建设方式：尽量选在人口稀少的地区，同时承担自身用电及新增基础设施的成本，减少对当地居民的影响。这算不算是乡亲们的一次胜利", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【14】"}], "cult": [{"n": 30, "t": "电影《可能的爱》里，赵汝贞的角色是一名纪录片导演。在李沧东的推荐下，她特地研究了美国纪录片大师弗雷德里克・怀斯曼的作品。赵汝贞在", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【30】"}, {"n": 31, "t": "李沧东导演电影的烂番茄新鲜度一览", "b": "览\n《绿鱼》 NA\n\n《薄荷糖》 83%\n\n《绿洲》 90%\n\n《密阳》 94%\n\n《诗》 100%\n\n《燃烧》 95%\n\n《可能的爱》 100%", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【31】"}, {"n": 31, "t": "骑桶人 · 《持械入宋》也不准用真实朝代名了。", "b": "《持械入宋》也不准用真实朝代名了。\n不准用真实地名、人名、朝代名，以及使用各种网络用语替代一些禁用字，这是真正的历史虚无和文化虚无主义。这是大问题，大家想一下，再过二十年，三十年，五十年，还有人能弄明白这些代称和隐语的本义吗？更不用说一两百年了。当代人所创造的文化将无法进入文化史中，无法成为中华文明的一部分，而当代史也将因为语言的错位和难解而消散。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【31】"}]}}, {"date": "20261109", "label": "11月9日", "week": "周一", "id": "196653", "title": "她不一样，她懂显卡", "cats": {"econ": [{"n": 2, "t": "经国务院批准，自2026年11月10日13时01分起，在2个月内继续暂停实施24%的对美加征关税税率，保留10%的对美加征关税税", "b": "中华人民共和国财政部                       关税司\nMinistry of Finance of the People's Republic of China                                     [人力公主)\nOm: 首页>政策布下和六伯\n国务院关税税则委员会关于调整对原产于美国的进口商品加征关税措施的公告\n税委会公告2026年第6号\nNGS SMELT EAMONN, RAE 《中华人民共和国关税法》、世中华人民共和国竹关法》》、世中华人民\n共和国对外贸易法》等和健生灿和国际法基本原则，经国务院批准，自2026年11月10日 NO, HT 《国务院关种税风委员会\n关于对原产于美国的进口商品加征关税的公告》《笠委会公告2025年第4号 ) AEM. Ee ARREST MOORE\n对美加征关税税幸，保留10的对美加征关税税车.\nRae\n20205 1S", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【2】"}, {"n": 3, "t": "2026年10月，中国CPI同比0.7%，预期0.8%，前值0.9%;中国PPI同比5.7%，预期5.4%，前值5%。PPI和C", "b": "比0.7%，预期0.8%，前值0.9%;中国PPI同比5.7%，预期5.4%，前值5%。PPI和CPI剪刀差为5%，较上月扩大了0.9个百分点。\nPPI创近几年新高，加上人民币升值，用更高的价格出口到海外市场，赚取更多外汇，今年贸易顺差要突破历史新高了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【3】"}, {"n": 5, "t": "云南省代省长刘奇凡，到企业现场征集工作建议和需求清单：各级政府要积极主动向企业请教、请企业支招", "b": "23:21                          Pa\n\u003c\n云南省代省长刘奇几，到企业现\n场征集工作建议和需求清单: 各\n级政府要积极主动向企业请教、\n请企业支招\n政事儿\n们 18人 Al摘要", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【5】"}, {"n": 6, "t": "中国启动对3万座寺庙财务大检查", "b": "中国启动对3万座寺庙财务大\n检查\n十关注\n一场覆盖全国3.35万座寺院、9000余座道\n观的财务大检查已全面铺开，矛头直指缠\n绕宗教场所多年的商业化。\n这不是一次例行的账目核对，而是一次对\n“寺庙究竟是道场还是生意\"的大追查。\n企业或个人承包经营寺庙、以分红提成方\n式介入场所运作、将宗教场所打包进商业\n资产，这些行为在法规层面早已被禁\n但在地方执行端，监管的放松曾为资本留\n下了余地。\n此次检查明确要求，已承包的必须清退，\n上市融资的通道必须切断。与之同步收紧\n的，是场所内部的财务透明度，年收入达\n到一定规模的场所须引入第三方审计，功\n德箱与电子收款统一归口，住持亲属不得\n参与经营，收支须定期向信众公示。\n打开网易新闻 查看更多图片 >\n检查不仅查账，还查教职人员的对外投资\n与持股情况、社交媒体账号背后的商业关\n联。\n当一位僧人的身份同时到加上公司股权持\n有者和网络意见领袖的角色时，宗教身份\n与商业身份的边界便已模糊到无法自我澄\n3s\nIB o\n将这条链条上的每一个节点建档留痕，意\n味着治理的对象从孤立的场所账目，扩展\n到了以信仰为资源、以人情与股权为纽带\n的隐性利益网络。\n推动这场检查的力量，来自积累多年的公\n众不满与治理滞后之间的落差。\n名山古刹被承包后僧人沦为\"员工”、头香\n拍出天价、假僧假道拦路敛财，这些现象\n反复消耗着信众的善意。\n信众捐出一百元是出于自愿的护持，被诱\n导扫", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【6】"}, {"n": 9, "t": "据21世纪经济报道消息，11月5日至10日，第九届中国国际进口博览会在上海举行。会上，一系列重磅科技亮相。上海微电子装备集团携自", "b": "5日至10日，第九届中国国际进口博览会在上海举行。会上，一系列重磅科技亮相。上海微电子装备集团携自主研发的新一代前道干式扫描投影光刻机SSC800、SSB800（模型）亮相中国馆，展示我国前道光刻装备自主化的阶段性成果。据悉，目前国产前道干式光刻机成像性能已与国际同类领先产品水平相当，套刻精度、生产效率紧密追赶国际标杆。在售的SSC800系列KrF与SSB800系列I-line机型，基于自研双工件台平台，均搭载国产自主大NA物镜，关键曝光成像指标对标国际标杆。SSC800整体性能跻身行业第一梯队。基于全栈自主可控技术底座，关键零部件国产化率突破90%，已实现定型与规模化量产，填补国内空白。多台设备已在国内头部逻辑、存储量产线长期稳定运行，累计支持产线流片超千万片，设备有效运行率超92%。（21世纪经济报道）", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【9】"}, {"n": 22, "t": "Cybertruck 居然这就停产了，特斯拉要把产能让给无人驾驶出租车Cybercab。这款曾被寄予年销25万辆期望的皮卡，实际", "b": "» @elonmusk\nq  | Elon Musk @ B                            订阅 )\nS FA Grok 翻译自英语\n特斯拉将于明年年中左右在德克萨斯超级工厂逐步减\n少Cybertruck的生产，以腾出空间增加Cybercab的生\nine\n评价此翻译: ob FD\n10:30 - 2026/11/6 .287万 次查看", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【22】"}, {"n": 29, "t": "黄仁勋当时还有一个「私心」，这是他在和Lex Fridman吃饭时说的，上大学时自己经济比较拮据，所以经常蹭Lori Mills", "b": "是他在和Lex Fridman吃饭时说的，上大学时自己经济比较拮据，所以经常蹭Lori Mills的生活费打游戏⋯⋯\n他俩在毕业5年后结婚，还一起进了一家3D绘图公司，但在生了孩子之后，因为找不到合适的托管，Lori Mills就离职当了全职家庭主妇，后来就是黄仁勋创办英伟达的故事了。\nLori Mills早年曾给自己设定过一张人生计划表――「22岁工作、25岁结婚、30岁生孩子」――她也差不多实现了这个愿望，当然结婚40年后丈夫劈腿这个计划很显然没被考虑进去过。\n根据信托安排，黄仁勋所持英伟达股份绝大部分都是夫妻共同持有，所以如果离婚都不需要涉及到分割财产，她在字面意思上就是800多亿美金的资产身价，可以直接空降全球女性富豪榜Top 3。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【29】"}], "soc": [{"n": 1, "t": "记者从山西省相关部门获悉，山西太原市迎泽区柳巷街道豪生国际公寓火灾已致14人死亡。11月8日16时59分，该公寓发生火灾。", "b": "太原市迎泽区柳巷街道豪生国际公寓火灾已致14人死亡。11月8日16时59分，该公寓发生火灾。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【1】"}, {"n": 7, "t": "北京励骏酒店停业，改为养老院。", "b": "又一家北京的五星级酒店倒闭。\n北京励骏酒店宣告停业，改为养老院。很多外地的朋友\n可能不入\n道励骏酒店有多厉害。\n这家励骏酒店，是北京奥运会接待外宾的酒店，地处长\n安街北例\n黎欧式风格。妥受的豪华五星级酒店，为什么倒闭了\nNe? 原因\n很多。\n现在这栋楼被平安人寿拿下了，用于做高端养老院。你\n有没有发现，这是皇城根最\n近有北京\n要的地段，附近的资源极\n说明养老特别看重周边的配套资源。金宝街附\n各大医院、各大高端医疗。可惜了，励骏酒店\n刚建成 18 年，就宣告破产了。\n@ 地点\n北京励骏酒\n=p}", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【7】"}, {"n": 10, "t": "近段时间，一位来自江苏的90后村医在网上发了一张医院的宣传标语，在网上引发热议。该标语写道：“如果你有任何不满意，请不要骂老村医", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【10】"}, {"n": 12, "t": "据看看新闻11月9日消息，张雪机车在米兰展出，机油盖、水箱盖、油箱盖，能拆的全被薅走了，零件被偷，连油箱锁、后视镜都没放过。", "b": "机车在米兰展出，机油盖、水箱盖、油箱盖，能拆的全被薅走了，零件被偷，连油箱锁、后视镜都没放过。\n张雪之前还提醒别的中国展商：“你要注意下，周末两天的时候0元购很多，像你这种没带锁的，可能一下就给你摸走了。”\n两个月前，张雪团队的大巴还在意大利被偷，6名成员的背包被盗，1人护照丢失，连车手签名照也丢了，报警至今没有回应。\n从大巴到展车，张雪团队在意大利接连被偷。网友感慨：还是国内治安好，素质高。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【12】"}, {"n": 19, "t": "柬埔寨加紧打击电信网络诈骗活动，在过去一年多的时间里，取缔了972个据点，并遣返2万3760名涉案外籍人员。", "b": "在过去一年多的时间里，取缔了972个据点，并遣返2万3760名涉案外籍人员。\n新华社报道，柬埔寨打击网络诈骗委员会星期六（11月7日）发文告，宣布上述在2025年7月至今年10月间的打击电诈成果。\n在这些大规模执法行动中，当局吊销了18家赌场的营业执照，并暂停另外10家赌场的执照。共有5032名嫌犯被起诉，目前处于审前羁押状态。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【19】"}, {"n": 23, "t": "戈培尔来了", "b": "Wi  ex                      STEPHEN MILLER\nDEPUTY CHIEF FOR POLICY AND HOMELAND SECURITY ADVISOR", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【23】"}, {"n": 26, "t": "她不一样，她懂显卡", "b": "小黄到底哪里好\n看了小黄照片，长相平平呀，怎么就拿下黄仁勋\n呢?\n我们看看她的经历 :\n1) 4年媒体。\n她简历上写着在湖南卫视、央视当过记者，攒了约4\n年媒体资历。后来湖南卫视回应没听过这个人。但\n它的功能很明确，   个高认可度的身份，拿到进\n入下一个圈子的叙事资本。\n2) 金融8年。\n她转进金融业后，先后做了汇丰私人银行总裁助\n理、某证券业务线副总裁、上海和照投资执行董\n事。私行助理让她近距离看富豪怎么运作，券商副\n总裁给了她正式身份，私募执行董事则让她开始直\n接础资本配置。8年下来，她掌握了金融圈的语言和\n人脉。\n3) 在私募阶段，她挂上了上海和四投资执行董事兼\n基金经理的头衔，并开始沾半导体和Al的边。外媒也\n质疑过: 她并没有半导体背景，却能快速进入这个\n行业担任高管。但这一步的意义在于，她把自己从\n泛金融的人，变成了芯片圈里的人。\n4) 她最终落脚在新加坡数据中心公司Megaspeed，\n担任董事总经理 (Managing Director) ，前后大约\n8个月。Megaspeed是英伟达在东南亚的大买家\n一，2024年6月到2026年2月，其马来西亚关联公司\n采购了至少48亿美元含英伟达芯片的设备。她不需\n要制造偶遇，作为英伟达头部客户的决策层，她天\n然就有商务理由跟英伟达管理层打交道。\n5) 台北国际电脑展期间，她在酒吧跟科技业高层聚\n会，当场放话“我能把Jens", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【26】"}, {"n": 30, "t": "纽约客这期封面牛逼了", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【30】"}], "intl": [{"n": 8, "t": "当地时间11月6日，欧盟委员会初步认定，TikTok推荐机制因让用户“越刷越想刷”而违反《数字服务法案》（DSA），除非TikT", "b": "初步认定，TikTok推荐机制因让用户“越刷越想刷”而违反《数字服务法案》（DSA），除非TikTok母公司字节跳动能够解决该问题，否则TikTok明年或将面临最高可达其全球年营收总额约6%的罚款。\n欧盟称，TikTok的推荐系统存在所谓的“兔子洞效应”（rabbit‑hole effect），通过持续推送同质化内容，用户越来越深陷其中、难以脱身。欧盟称，用户与某一类内容互动越多，TikTok一级入口“推荐”（For You）就会推送越多同类内容。\n欧盟的初步调查结果表明，算法设计在形成“兔子洞效应”时可能起到重要作用，“该算法利用用户互动行为信息，例如观看、点赞视频，为用户推送个性化内容。”\n欧盟举例，如果用户无休止地刷到伤感、孤独、身材外貌这类易诱发负面情绪的内容，该机制就会带来危害，对用户心理健康造成负面影响，弱势成年群体与未成年人（vulnerable adults and minors）尤其容易受到伤害，包括加重忧虑情绪、身材焦虑、降低自信，或是加剧已有的进食障碍与心理疾病。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【8】"}, {"n": 15, "t": "美国总统特朗普回应英伟达首席执行长黄仁勋涉及婚外情及外国情报机构疑云时说，黄仁勋是个“好人”，但他尚未与黄仁勋讨论有关指控。路透", "b": "行长黄仁勋涉及婚外情及外国情报机构疑云时说，黄仁勋是个“好人”，但他尚未与黄仁勋讨论有关指控。路透社报道，特朗普星期天（11月8日）说：“我没有和他谈过这件事。我只知道他是个好人，但你永远不知道究竟发生什么。我希望一切都好。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【15】"}, {"n": 16, "t": "美国国会尚未换届，总统特朗普已先发制人，指控即将接掌国会两院的民主党人涉嫌“敲诈”，并下令司法部展开调查。同时，他提拔主导强硬移", "b": "先发制人，指控即将接掌国会两院的民主党人涉嫌“敲诈”，并下令司法部展开调查。同时，他提拔主导强硬移民政策的米勒出任白宫幕僚长，也招致两党议员猛烈抨击。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【16】"}, {"n": 17, "t": "彭博社报道，俄罗斯官方机密数据遭黑客窃取，显示自2022年2月全面入侵乌克兰以来，俄方已有近40万人在战争中丧生，远高于俄罗斯政", "b": "遭黑客窃取，显示自2022年2月全面入侵乌克兰以来，俄方已有近40万人在战争中丧生，远高于俄罗斯政府公开承认的数字。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【17】"}, {"n": 18, "t": "以色列国会共有120席，组成多数政府须取得至少61席。", "b": "数政府须取得至少61席。\n根据选举结果，内坦亚胡领导的利库德集团赢得27席，是国会最大单一政党，但其联盟仅取得53席，未达过半门槛。\n埃森科特领导的正直党则赢得21席，成为第二大党。他所属的四党联盟横跨中左翼至右翼阵营，共取得48席。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【18】"}, {"n": 21, "t": "饱受物价上涨、学贷沉重与就业压力困扰的美国年轻选民，在本届中期选举中大幅转向民主党。美联社选民调查显示，与2024年总统大选比较", "b": "力困扰的美国年轻选民，在本届中期选举中大幅转向民主党。美联社选民调查显示，与2024年总统大选比较，18至29岁选民本次中期选举向众议院民主党候选人倾斜的幅度超过20个百分点，居各年龄段选民之首；曾在两年前把总统特朗普送回白宫的青年，部分改投民主党，部分放弃投票。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【21】"}], "tech": [{"n": 4, "t": "“所谓中国间谍的论调纯属捕风捉影，污蔑抹黑。”", "b": "11月9日，外交部发言人郭嘉昆主持\n例行记者会。法新社记者提问，英伟\n达CEO黄仁勋周日承认与一名女子存\n在婚外情，英伟达已对黄仁勋启动调\n查。此前，美国官员称该女子为中国\n情报机构工作。中国外交部能否就此\n事作出回应?” 这起事件是否会影响下\n周中美元首在深圳的会晤?\n对此，郭嘉昆表示: “我们此前已就\n此作出回应，所谓中国间谍的论调纯\n有外媒记者追问，这是否意味着中国\n外交部否认该女子为中国情报机构工\n作的报道?\n“所谓中国间谍的论调纯属捕风提\n影，污荐抹黑。”郭嘉昆说。\nH\n”\nANS)\n美官员称与黄仁勋婚外情女子为中\n情报机构工作，外交部回应", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【4】"}, {"n": 14, "t": "当地时间11月8日，英伟达CEO黄仁勋发布一封公司内部信，承认出轨并向妻子和家人道歉。他同时表示，愿意配合有关“国家安全问题”的", "b": "O黄仁勋发布一封公司内部信，承认出轨并向妻子和家人道歉。他同时表示，愿意配合有关“国家安全问题”的调查。英伟达董事会发布声明表示，正在调查是否有外国情报机构以黄仁勋为目标，并表达对黄仁勋的信任。\n美媒此前报道称，黄仁勋与新加坡数据中心公司Megaspeed International的前高管Alice Huang有婚外情。黄仁勋上个月接受采访时称，他与这位女士的互动是正常的商业来往，“一切都完全正常，没有任何异常之处”。\n黄仁勋声明全文：\n我欠我的家人以及你们所有人一个道歉。我对我的妻子不忠，我的行为伤害了她和我们的孩子。我的所作所为没有任何借口，我深感抱歉。\n在我的一生中，我的家人给予了我爱和支持，他们理应得到我的诚实和忠诚。然而，我却辜负了他们，破坏了我们共同建立的生活。我愿为我的所作所为和造成的伤害承担全部责任，并接受随之而来的批评。\n致我的妻子和家人：我爱你们。我知道道歉无法弥补我所犯下的错，我希望我们的家庭能够愈合，也希望随着时间的推移，我能重新赢得你们的信任。\n致我在英伟达的同事们，包括那些与我共事数十年的伙伴们、董事会成员、合作伙伴以及全球各地的股东们：你们值得我做得更好。领导英伟达是我毕生的荣幸，我的责任是为你们服务，不辜负你们的信任，但我辜负了这份责任。我将全力以赴，努力重新赢得你们的信任。\n针对新闻报道中提出的国家安全问题，英伟达董事会已启动独立调查。我支持这项调查，并将全力配合。我热爱我的国家和公司，我致力于保护英伟达并维护美国的国家安全，我为自己身为美国人而感到自豪和感恩。\n我的家人无需为我的选择承担任何责任，我本人对此负责。请尊重他们的隐私。\n英伟达董事会声明全文：\n鉴于近期有报道称英伟达首席执行官黄仁勋成为外国情报机构的目标，英伟达董事会决定启动一项独立调查。一个由独立董事组成的委员会将在外部独立律师的协助下监督此次调查。\n董事会将美国国家和经济安全置于首位，这对于英伟达及其股东的利益至关重要。尽管董事会没有理由相信国家安全或英伟达的机密信息遭到泄露，但董事会的调查将审查所有可用信息。黄仁勋全力支持此次审查，并承诺予以配合。董事会对黄仁勋及其领导团队充满信心，并将在适当的时候提供进一步的最新信息。\n英伟达美股夜盘跌近6%", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【14】"}, {"n": 20, "t": "全球人工智能热潮爆发，印度尼西亚�Q淡岛也大肆规划数码工业园区，数据中心如雨后春笋般涌现。民众最初对工业入驻满心期待，然而还未尝", "b": "亚�Q淡岛也大肆规划数码工业园区，数据中心如雨后春笋般涌现。民众最初对工业入驻满心期待，然而还未尝到科技发展的甜头，就先因数据中心这个“吞水巨兽”而陷入水供短缺或中断困境，日常做饭洗澡都成难题。除了印尼，近年来致力发展成区域数据中心枢纽的马来西亚，也面临类似问题。由于运营商的选址越来越逼近住宅区，柔佛州民众也一度因数据中心建设引发的粉尘污染和山洪问题举行抗议。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【20】"}, {"n": 24, "t": "AMD 的游戏收入下降了 40%，至 7.73 亿美元，而总收入则创下纪录的 134 亿美元，增长了 97%。", "b": "%，至 7.73 亿美元，而总收入则创下纪录的 134 亿美元，增长了 97%。\nAMD 计划明年将数据中心业务翻一番多，PC 游戏玩家显然不再是优先考虑对象了，我们完蛋了  ...", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【24】"}, {"n": 25, "t": "经过一上午对线，终于确认，这位黄乐就是曾经和我一个办公室的黄乐……\n\r\n当年就看出她不简单，没想到能如此不简单。看看人家，看看自", "b": "黄乐就是曾经和我一个办公室的黄乐……\n\n当年就看出她不简单，没想到能如此不简单。看看人家，看看自己，啧啧，小径遛弯的心情也没了。 \n \n马斯克在社群平台X转发一则评论黄仁勋婚外情风波的贴文，并写下「我认同」。\n那则贴文写道：「1，黄仁勋是这一代最杰出的创业家之一。2，他做了一件极其愚蠢的事。3，这件事对美国不利。4，但我猜，他并没有恶意。5，错误不能用错误补救，而我相信，黄仁勋对美国在AI领域的领先地位而言，是无可取代的。」", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【25】"}, {"n": 27, "t": "AI 竞争的胜局最后属于会拿筷子的", "b": "子的\n这家饭馆也是拼了", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【27】"}, {"n": 28, "t": "“很多年以后，当星链铺满太空，突然同时转向，那一瞬太阳的光辉映出那个名字……”等一下，B300你在写什么，住手……", "b": "马斯克对wb词条作出如下感慨\nElon Musk O88              、\n注\n有利- @elonmusk\n和 显示翻译 ©\nChinese X is ia\n26421198, 11:13 -3.9M 查看次数\nDrow tease Oak Plame 08\nCy DB ts >\n黄仁勋承认出轨\n黄仁勋出轨马斯克…国", "href": "https://ww 出力。\n看起来很完美把? 大家都没什么意见。o\n结果不到一年，我姥姥就跟我大田闵翻了。\n原因很简单，我姥姥天天说自己不舒服，从\n我六田和盟妈都是大夫，看病还是比较容易\n的，随时带着老太太去医院就能检查，三:\n这种事每周都在我姥姥跟我大田之间上演。\n就好像狼来了一样，再孝顺的孩子也架不住\n老人一周去医院做次全身检查啊。\n我姥姥也是能察言观色的人，折腾了几个月\n之后，看出来我大田不耐烦了。\n然后就天天往楼下小诊所跑。\n一个月八干多退休金全送哪里去了，今天买\n个艾灸贴，明天贴个三伏贴。\n到了最后，一个月八干多不够花了，还要跟\n好话说尽，根本没用。后来开始争吵，冷\n战。再到最后我姥姥偷偷给我妈打电话，哭\n哭啼啼的抱怨我大盟。\n开始我妈还把我大田说了一顿", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196676#:~:text=【23】"}], "soc": [{"n": 3, "t": "据指尖新闻披露，11月9日中午的陕西西咸新区沣东城市广场，正是办事群众进进出出的时段。11点23分左右，一台黄色履带式挖掘机径直", "b": "的陕西西咸新区沣东城市广场，正是办事群众进进出出的时段。11点23分左右，一台黄色履带式挖掘机径直开上政务服务中心1号楼门前的广场台阶，在大厅门口停下，机械臂上的液压剪对准门头雨棚一侧开始了强拆。。。\n陕西警方通报一政务服务中心门头遭挖掘机破坏：嫌疑人胡某某（男，47岁）已被采取刑事强制措施，无人员受伤，该政务中心已恢复正常。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196676#:~:text=【3】"}, {"n": 4, "t": "#杭州警方通报男子伤人事件#  #杭州一男子致2人死亡后畏罪自杀# ：57岁男子临街店铺致2人死亡，被围捕时畏罪自杀", "b": "©\noF Tt ai ik\n2026年11月8日12时54分，我局接报辖区临平\n街道菜临街店铺内发生一起刑事案件，造成2人死\n=\n经公安机关全力侦查，迅速锁定犯罪嫌疑人\n为纪某某〈男，57岁，临平人) 。当日23时许\n纪某某在被围捕时豚罪自杀，经送医抢救无效死\n亡。案件正在进一步侦办中。\n杭州市公安局临平区分局\n2026年11月9日\n@ @RWsyYHP", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196676#:~:text=【4】"}, {"n": 5, "t": "国家发改委：对很多家庭来说，一边照顾老人、一边照料孩子，压力实实在在，千方百计解决“养老愁、托育难”等问题是我们工作的重中之重", "b": "国家发改委: 对很多家庭来说，一边照\n顾老人、一边照料孩子，压力实实在\n£, FABRA FER, HA’ S\n问题是我们工作的重中之重\n政事儿\nM65A Al摘要\n11月10日，国家发展改革委奋进“十五五\"系列新闻\n发布会，介绍增进民生福社有关情况。\n国家发改委社会发展司副司长黄玮茹说，对很多家\n庭来说，一边要照顾老人、一边要照料孩子，压力\n实实在在。千方百计解决他们“养老愁、托育难”\n等急难愁盼问题，是我们当前和今后一段时期保障\n和改善民生工作的重中之重。 “TAA Me (A\n要》就优化养老和托育服务供给、提升保障水平进\n行了总体部署，近期，经国务院同意，国家发改委\n联合相关部门印发了《“\"一老一小\"服务体系建设实\n施方案》，进一步细化提出了13条任务举措。后\n续，我们将抓好贯彻落实，加快完善覆盖城乡、布\n局合理、价格可接受、质量有保障的普惠养老和托\n育服务，进一步提升人民群众获得感、幸福感、安\n改善养老和托育机构条件，扩大优质资源供给。\n2026年，我们已经下达中央预算内投资140亿元，\n支持各地新建改扩建了一批养老、托育服务设施，\n建设了超10万个护理型养老床位”和超3万个托\n位，并通过超长期特别国债资金支持公办养老机构\n更新约11万台 (套) 设备。下一步，我们将统筹各\n类资金渠道继续加大支持力度。“一老”方面，重点\n推进老旧养老机构改造升级和设备更新，推动养老\n机构护", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196676#:~:text=【5】"}, {"n": 6, "t": "网红“985海归教授”李泽被指卷款2000万跑路，天津大学发声", "b": "网红“98 :~:text=【25】"}], "tech": [{"n": 1, "t": "美国食品药品监督管理局（FDA）数据显示，服用该类药物人群中，每年每10万人约出现6例非动脉炎性前部缺血性视神经病变（NAION", "b": "）数据显示，服用该类药物人群中，每年每10万人约出现6例非动脉炎性前部缺血性视神经病变（NAION）病例。FDA要求Ozempic、Zepbound等重磅GLP‑1药物的生产企业新增相关警示标注；该眼部病症可造成永久性视力丧失。FDA于周一发布安全通报称，GLP‑1药物可能提升患上NAION的风险，该病症会引发部分失明。已有患者起诉药企，指控药物导致自身视力受损；诺和诺德、礼来等主要药企正在应诉，表示现有研究尚未证实GLP‑1药物会诱发NAION。礼来发言人表示，患者安全是公司首要考量，正在评估FDA的最新要求，将很快作出回应。同样拥有获批GLP‑1产品的诺和诺德、赛诺菲暂未置评。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196676#:~:text=【1】"}], "cult": [{"n": 11, "t": "看到一个在印尼旅居的博主，干起了收号的兼职生意，太tm有生意头脑了：\n\r\n他骑摩托车去各个农村，挨个找大爷大妈们开200美金的C", "b": "了收号的兼职生意，太tm有生意头脑了：\n\n他骑摩托车去各个农村，挨个找大爷大妈们开200美金的Claude Pro，面对面过完KYC，当场现金结算酬劳，然后把这批Claude Pro加价卖给有需求的中国买家⋯⋯", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196676#:~:text=【11】"}, {"n": 26, "t": "@严锋 · 塞尔达传说时之笛重制版发售才4天，各模拟器小组就开足马力，你追我赶，热火朝天。光Lichii模拟器主线相关的构建迭代", "b": "塞尔达传说时之笛重制版发售才4天，各模拟器小组就开足马力，你追我赶，热火朝天。光Lichii模拟器主线相关的构建迭代就达到了数十个，目前已能在Windows、macOS、Linux多个平台完美运行。这种速度在模拟器的历史上前所未有。这背后都是AI的力量，AI这是要一统游戏平台，千秋万代啊。 \n \n最近对社保的追缴确实挺严格的。我有两家乙方都被追缴了不少钱，有一家补缴之后就裁员了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196676#:~:text=【26】"}]}}, {"date": "20261111", "label": "11月11日", "week": "周三", "id": "196693", "title": "无论资本主义如何定义我们", "cats": {"econ": [{"n": 7, "t": "今年1-10月贸易顺差干到了10426亿美元，是历年同期首次破万亿。", "b": "中国历年1-10月累计货物贸易顺差 2017-2026年\nBEER: EOE                     制图; TIME HORIZON . 公众号TimeHorizonX\n单位: 亿美元，柱项A/Y为同比 (%) ; 2026年首次在前10个月突破1万亿美元\n均为海关1-10月累计值，往年为修订后数据 2026年为初什\n12000 - Mam 最新值 (本期亦为峰值\n438\n10426\n2017% 20188 2019% 2020% 2021% 2022 2023% 2024 2025% 2026", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【7】"}, {"n": 9, "t": "北京现在的社保费用，个人+企业，大概是税前工资的37%", "b": "分项 (基数8000)\n个人每月 (全部从工资扣)\n。养老: 8000 x 8% = 640\n*。 失业: 8000 x 0.5% = 40\n。 医疗: 8000 x 2% +3 =163\n村- 个人社保合计: 84370/A\n单位每月 (公司承担)\n。 养老: 8000 x16% = 1280\n。 失业: 8000 x0.5% = 40\n。 医疗 (含生育): 8000 x9.8% =784\n。 工伤 (0.2%举例): 8000 x0.2% = 16\n& 单位社保合计: 21207/A\n五险合计 d=196693#:~:text=【23】"}, {"n": 28, "t": "星球商业评论", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【28】"}, {"n": 30, "t": "白老师说黄小姐是前同事，然后就进了小黑屋。", "b": "啊\n@自在'吴铬 四\n白老师说黄小姐是前同事，然后就进了小\n哑巴", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【30】"}], "intl": [{"n": 6, "t": "2000 vs2024，部分国家成年人吸烟率的对比。全球范围内下滑了14.5%，中国是4.3%。", "b": "Tobacco use fell in every country shown\nsince 2000, but barely in France and Indonesia\nShare of adults (15+) who use any tobacco, 2000 vs 2024, WHO estimates.\nSolocted countries. Change in porcontage points (pts).\n2000 WB 2026\n@ wors                       -Asp SE india                        -aalpte\n2000 IE 340x                   2000 557x\nED 02                         2 ED 20\n2 united kingdom        -25.4pts united states          22.8 pts\n2000 ND 30.2%                 2000 NE 30.6%\nso Be                              2 ND 10x\n© Japan                                 于 cermany", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【6】"}, {"n": 12, "t": "俄罗斯与乌克兰经美国斡旋，于阿联酋首都阿布扎比展开新一轮会谈，这是美俄乌三方自今年2月以来的首次会晤。美国呼吁俄乌与欧洲之间建立", "b": "联酋首都阿布扎比展开新一轮会谈，这是美俄乌三方自今年2月以来的首次会晤。美国呼吁俄乌与欧洲之间建立新的安全架构，以结束战争，实现长期和平。\n俄方此前表明，不希望欧洲参与阿布扎比会谈。法国则强调，若不解决欧洲安全问题，乌克兰就不可能实现持久和平，而解决这个问题需要欧洲各方参与。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【12】"}, {"n": 13, "t": "德国总理默茨星期二（11月10日）说，所有欧盟成员国都必须支持乌克兰，对基辅的支持不能被削弱。", "b": "日）说，所有欧盟成员国都必须支持乌克兰，对基辅的支持不能被削弱。\n路透社报道，默茨希望从2028年开始实施的新一轮欧盟预算能够重点增加国防开支、提升竞争力，同时确保所有欧盟成员国都支持乌克兰。去年，多个成员国不给乌克兰提供一笔新的贷款。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【13】"}, {"n": 14, "t": "美国众议院共和党人采取一致行动，投票反对针对战争部长赫格塞斯的弹劾努力。", "b": "投票反对针对战争部长赫格塞斯的弹劾努力。\n综合路透社和法新社报道，众议院星期二（11月10日）以211票赞成、204票反对的结果，将赫格塞斯弹劾动议移交给由共和党掌控的众议院司法委员会审议。\n【赫格塞斯抨击对其弹劾是“一场闹剧”】这是赫格塞斯自今年5月以来首次在五角大楼举行新闻发布会。他说，此前针对美国总统特朗普的弹劾尝试均以失败告终，并补充说：“这一次也会失败。”\n他还说：“这不是爱国主义，而是蓄意破坏。”\n谈及美伊战争，赫格塞斯说：“我支持我们开展的每一项军事行动。我为执行这些行动感到自豪，而且如果有需要，我明天还会再次这样做。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【14】"}, {"n": 15, "t": "美国总统特朗普说，联邦调查局正对英伟达首席执行官黄仁勋婚外情事件展开调查。美国国会两党议员要求获得更多相关信息，以评估这起间谍疑", "b": "对英伟达首席执行官黄仁勋婚外情事件展开调查。美国国会两党议员要求获得更多相关信息，以评估这起间谍疑云对国家安全可能构成的威胁。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【15】"}, {"n": 16, "t": "日本在二战末期曾遭受广岛和长崎原子弹轰炸之害，战后出于和平主义立场出台了“无核三原则”，即不拥有、不制造、不引进核武器。然而，日", "b": "原子弹轰炸之害，战后出于和平主义立场出台了“无核三原则”，即不拥有、不制造、不引进核武器。然而，日本执政联盟自民党与日本维新会于星期二（11月10日）召开会议，在商讨年底修订《国家安全保障战略》时，以周边核威慑等安保形势日益严峻为由，讨论松绑三原则。\n消息指出，自民党虽对全面松绑持慎重态度，但正考虑在“例外情况”下放宽“不引进”原则，即允许搭载核巡航导弹的美国核动力潜艇入驻。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【16】"}, {"n": 17, "t": "正在日本访问的越南国家主席苏林星期一（11月9日）同日本首相高市早苗举行会谈。双方签署核能合作备忘录，计划于2040年后在越南建", "b": "星期一（11月9日）同日本首相高市早苗举行会谈。双方签署核能合作备忘录，计划于2040年后在越南建设新一代核反应堆。到时，越南将成为东南亚首个采用日本核能技术的国家。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【17】"}, {"n": 22, "t": "尽管美国总统特朗普此前表态愿意接受中期选举的结果，但共和党惨败失去国会两院控制权后，他改口再次抛出并无根据的“选举舞弊”指控。", "b": "接受中期选举的结果，但共和党惨败失去国会两院控制权后，他改口再次抛出并无根据的“选举舞弊”指控。\n他写道：“有一些提前投票的‘灌票’数量庞大到根本没法赢，不管多少人出来投票都没用。全都是机器在搞鬼，机器可比选民重要多了！”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【22】"}], "tech": [{"n": 2, "t": "数据显示，这家公司的财务规模在2024年出现巨大变化，总资产短时间内暴增。超速国际曾是英伟达的客户。这家公司此前因涉嫌协助中国获", "b": "2024年出现巨大变化，总资产短时间内暴增。超速国际曾是英伟达的客户。这家公司此前因涉嫌协助中国获取受美国出口管制的先进人工智能（AI）晶片，受到美国当局关注。\n彭博社星期二（11月10日）引述消息人士报道，新加坡警方曾扣留黄乐问话，并限制她离开新加坡。\n黄乐（Alice Huang）是谁？她老公又是谁？ 据《财新网》的报道，黄乐是黄仁勋的绯闻对象，黄乐的老公叫康伟，二人共同主导和熙投资；康伟因涉操纵上市股票被上海公安采取刑事强制措施。\n《财新网》 今天报导指出，黄乐于2008年步入金融行业，先后任职汇丰（香港）私人银行部、中信证券金融市场管理委员会证券金融业务线担任初级职位，履历不显。转折发生于2015年11月，30岁出头的黄乐摇身一变成为「和熙投资」的内核股东、高层，职业生涯自此推开了另一扇大门。\n2025年初，黄乐与康伟向中国投资人寻求投资，计划在东南亚兴建一座大型数据中心，两人保证「绝对有办法拿到辉达（Nvidia）绘图处理器（GPU）」，还说阿里巴巴也是该计划的客户之一。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【2】"}, {"n": 18, "t": "Anthropic 拟发行 825,000,000 股A类普通股。其中新发行 801,351,354 股，部分现有股东出售 23", "b": "25,000,000 股A类普通股。其中新发行 801,351,354 股，部分现有股东出售 23,648,646 股。\n预计本次公开发行价格区间为每股 70 美元至 78 美元，最高将募集 644 亿美元，IPO 的目标估值最高为 1.02 万亿美元，低于此前市场预期。\nAnthropic 还将通过一项独立的私募配售交易，向谷歌、英伟达、AMD、博通、美光科技、微软和台积电等基石投资者募集 260 亿美元。\n计入基石投资后，Anthropic此次发行的募资总额最高将达 904 亿美元。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【18】"}, {"n": 19, "t": "挪威驻巴西利亚大使馆星期一（11月9日）宣布，挪威将向巴西亚马逊基金捐赠约3亿5000万雷亚尔（约8140万新元），以肯定全球最", "b": "1月9日）宣布，挪威将向巴西亚马逊基金捐赠约3亿5000万雷亚尔（约8140万新元），以肯定全球最大雨林亚马逊雨林的森林砍伐率出现“历史性下降”。\n路透社报道，巴西国家空间研究院上个月公布的数据显示，截至今年7月的12个月内，亚马逊雨林的森林砍伐面积降至有记录以来的最低水平。\n挪威大使馆在声明中说，这笔捐款是基于巴西取得的成果，也进一步巩固了两国的长期合作关系。\n挪威气候与环境部长奥斯兰在声明中说：“巴西取得的成果令人瞩目，不仅对巴西，对全世界也具有重要意义。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【19】"}, {"n": 24, "t": "感觉比绿卡严格", "b": "DY Anthropic 改白名单制: 中国大陆及港澳不在名单\n内，11 月 12 日生效\nAnthropic 发布《支持地区政策》，将产品可用范围改\n为白名单制: Claude.ai、Claude Code、Cowork、\nAPI，以及经云平台和授权经销商提供的 Claude 模型，\n仅在名单所列的 185 个国家和地区可用，未列入者一\n律不支持。\n政策的三条禁止比名单本身更严: 人身处不支持地区\n时使用即违规，包括支持地区公司的员工出差; 在不\n支持地区注册或设总部的实体及其人员使用违规，不\n论人是否在支持地区;被不支持地区主体直接或间接\n多数持股或控制的公司，其人员同样违规。\n名单含中国台湾，乌克兰则排除克里米亚、顿涅茨克、赫尔松、?3\n卢甘斯克、扎波罗热五个地区; 中国大陆、香港、澳门均不在\n列。但伊拉克、利比亚、索马里、苏丹、巴勒斯坦等国在列，可\n见它并非照抄美国制裁名单，而是 Anthropic 自身的合规口径;\n属地和附属地随母国计入，如波多黎各按美国处理。      入\n侈@差评君", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【24】"}, {"n": 25, "t": "Anthropic路演PPT里最值得看的就是这张“AI能力扩展曲线”图，展示 AI 在任务复杂度和时间跨度上的快速进步，也说明智", "b": "最值得看的就是这张“AI能力扩展曲线”图，展示 AI 在任务复杂度和时间跨度上的快速进步，也说明智能推向前沿，并覆盖高价值、高影响领域。\n1）从24年的相对基础的能力：如查找事实、修bug、图像识别；\n\n2）到25年-26年的代码重构、多步工作流、深度研究、自主编程、智能体工作流、自动化风险分析、安全漏洞评估、监管申报起草、保护关键开源软件）等。\n\n3）现在以致未来进入更高阶、更长周期、更接近真实世界影响的任务包括：工业设计与工艺验证、自主网络防御、药物发现、先进疾病检测与诊断、自主软件开发、机器人系统与物理自动化、个性化教育、专家级金融与法律建议、供应链自动化。\n为什么说这这张图最值得看，因为它意味着AI进入的应用场景越多、说明采用是在不断扩散，自然商业化也在进一步加速。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【25】"}, {"n": 26, "t": "截至目前，英伟达（NVIDIA）CEO黄仁勋的妻子洛莉・黄（Lori Huang）并未针对近期婚外情风波发表任何正式的公开声明，", "b": "私生活进入公容视野，今天，     简短地\n打破:       默。我的丈夫背叛了我，他在\n公开前告诉了我，我感谢他，至少给了我\n这点尊重。但无论道歉多诬公开， 都无法\n让信任一夜恢复，即便信任还有可能，修\n复也只能私下慢慢来有人间我 : 是否相\n信那些针对黄女士的指控 ? 我不知道真\n相，电视上发表评论的人也是。国家安全\nFale > QAR > WE A Ba\n理，而不是专栏作家。黄仁动必须完整回\n答每个问题，诚实作答，不找藉口。我不\n会加入对黄女士的残酷围攻，她究竟做过\n什么 ? 没做过什么 ? 应该由证据认定，而\n不是新闻标题。给英传达的每一位同事，\n你们创造了非凡的成就，一个人的过错，\n不会贬低你们的付出，请继续做下去 ! 我\n们的婚姻能否继续，由黄仁动、孩子们和\n我来决定，这不该交给民调决定。我只有\n一个请求，请给我的家人时间和私人空间\n来悲伤，去思考和做决定\nStatement from Jensen\nHuang's wife, Lori, about her\nhusband’s cheating!!\nga) AUR eee 四 作\n20 «64", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【26】"}, {"n": 29, "t": "张雪改口，53号冠军车拍卖款不再捐给韩红基金会：", "b": "张雪改口，53号冠军车拍卖秋不再捐给韩红\n基金会: 发生了一些事，我内心是有质疑\n的; 此前曾许诺“拍卖冠军赛车捐给韩红基\n£2\"\nQ amir                           关注\n张雪改口了 | 冠军车拍卖款不再捐给韩红基金会。张雪11月10日发视频宣布将\n在22日的嘉年华活动中， 拍卖53号冠军赛车。“所有款项我们全部用于资助中国\n小车手成长。”\n他还解释 ,“之前我有许诺过就是把我们真实的赛车拍卖，用于捐款给某某营善\n基金会，但是后面发生了一些事情，其实我内心是有些质疑的。”\n年5月，张雪曾公开说将拍卖德比斯驾驶的53号车，所得款项将捐给韩红基金\nyd >", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【29】"}], "cult": [{"n": 27, "t": "情况就是这么一个情况�r(��_�濉�)�q", "b": "你是说在世界上所有经典名著、音乐、电影几\n乎都唾手可得的现在，结果人们最终选择了持\n音跟红果吗?\n26年11月10日, 0:04 . 129K 查看次数\nGDitee 1133 Sa2sk 内lo &", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【27】"}, {"n": 28, "t": "@Super滚筒:《阿嬷》票房20亿豆瓣9.3，《密档》票房2000万豆瓣6.7，然后他得了最佳导演，金鸡奖的含金量嗷", "b": "@M大王叫我来巡山:也不是第一回了\n@sven_shi:确实也是很典型的小圈子。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【28】"}, {"n": 31, "t": "《可能的爱》中，赵汝贞饰演的纪录片导演嫁给富有的丈夫，却想保有独立的创作身份。李沧东在最近一次访谈中说，自己拍电影同样离不开资本", "b": "录片导演嫁给富有的丈夫，却想保有独立的创作身份。李沧东在最近一次访谈中说，自己拍电影同样离不开资本，这次合作网飞就是例子。他觉得自己和这个角色就像彼此映照的镜子，都在依靠资金的同时努力保住自己发创作的机会。他还透露，自己曾有几次想拍纪录片，但最终都没有拍成。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【31】"}]}}, {"date": "20261112", "label": "11月12日", "week": "周四", "id": "196707", "title": "黄仁勋再传婚外情，英伟达董事会拟将其罢免", "cats": {"econ": [{"n": 8, "t": "离岸信托征税的同时，网店查税也没拉下", "b": "没拉下", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【8】"}, {"n": 9, "t": "腾讯把司庆日办成了裁员预告这事儿闹得还挺大的，鹅厂终于打算清理那些把公司当成养老院的人了吗⋯⋯", "b": "儿闹得还挺大的，鹅厂终于打算清理那些把公司当成养老院的人了吗⋯⋯", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【9】"}, {"n": 20, "t": "战争期间，超过80座能源设施遭到袭击，主要位于科威特、卡塔尔和巴林，其中三分之一遭受严重破坏。", "b": "到袭击，主要位于科威特、卡塔尔和巴林，其中三分之一遭受严重破坏。\n除了能源基础设施遭受破坏，战争也冲击旅游业和房地产等其他领域，导致这些行业未来数年的增长放缓。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【20】"}, {"n": 25, "t": "给大家讲个笑话", "b": "给大家讲个笑话\n为了防止大家焦虑，给大家讲个笑话，2019年160\n万买的房子，现在同户型挂牌价30多万，银行贷款\n还有100万萝萝轴\nQ 猜你想搜 朗基香颂天府\n22 说点什么   GD 4932 Ly 1333) 1431", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【25】"}, {"n": 28, "t": "吸取了WTO的教训，每一条都是有针对性的", "b": "第五次申请加入CPTPP\nCPTPP全称是\n全面进步与跨太平洋伙伴关系协定\nWTO解散了 WTO的时代结束了\nCPTPP是WTO的升级款\nCPTPP的加入要求更严格更严谨\n加入这个贸易组织有2000多项条款\n加入CPTPP的条件:\n1 . 工会独立 与政府脱钩\n2 . 不对国企企业进行任何补贴和扶持\n国企 民企 私企公平竞争\n3. 外资服务器可留在本国\n4. 公务员财产公开\n加入CPTPP的要求:\n1 . 稳定和透明的政治体制\n2. 开放且自由的经济环境\n3. 具备长远的市场潜力值\n4. 良好的劳工生活工作权益\n5 . 其余会员国的一致同意", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【28】"}], "soc": [{"n": 5, "t": "11月11日，记者获悉，中国共产党党员，原四川长虹电子集团有限公司党委书记、董事局主席倪润峰同志因病医治无效，于2026年11月", "b": "产党党员，原四川长虹电子集团有限公司党委书记、董事局主席倪润峰同志因病医治无效，于2026年11月11日15时55分在绵阳市中心医院逝世，享年82岁。\n倪润峰，男，汉族，中共党员，1944年2月出生，山东荣成人。他将长虹打造成“中国彩电大王”，为中国彩电业走向世界奠定了良好基础。在他的带领下，长虹率先在国内掌握机芯技术、多功能遥控等彩电核心技术，推动了中国大屏幕彩电的普及，打破了外资品牌对中国彩电市场的垄断。（四川日报）", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【5】"}, {"n": 6, "t": "首都医科大学一名学生被电信诈骗180万", "b": "x    &  Hema                            关注\n首都医科大学一学生被电诈180万\n近日，首都医科大学面向全体师生发布了一则反诈通报，\n通报显示该校一名学生章遇冒充公检法形式的电信网络诈\n骗，线上线下累计转付近180万元。经警方紧急止付拦截\n37万元，实际损失142万余元。#反诈开学第一课 HAR #\n社会 OARS #大学生 #首都医科大学 HED\n共 34 条评论\n&  momo\nta有180万为什么要学医啊\n49分钟前 北京\n1or D5          @osies", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【6】"}, {"n": 7, "t": "近期，部分比亚迪“大唐”车主在网络上反映，车辆疑似存在前后轮辋装反的问题。11月11日，比亚迪发表致歉声明，确认部分车辆轮辋错装", "b": "网络上反映，车辆疑似存在前后轮辋装反的问题。11月11日，比亚迪发表致歉声明，确认部分车辆轮辋错装。\n用户担忧上述问题会带来安全隐患。比亚迪称，经专项检测，错装不影响车辆操控，无行驶安全风险。比亚迪提出，将为这部分车辆安排免费检测并对轮辋进行调换，期间会为车主提供代步车或交通费用补偿，相关车辆将重新起算整车质保。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【7】"}, {"n": 10, "t": "唉，亚洲父母", "b": "当亚洲小孩向亚洲父母报成绩:\n前三名以外\n第一名不代表什么\n你现在不能骄做更不能自满\n更重要的是你下次还能不能\nDHARBR—?  fiaww leet\nBisse\n= “Bae E aT                                   Pee eras\n- BF:\n7:\n- 准备进厂吧", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【10】"}], "intl": [{"n": 1, "t": "中共中央政治局委员、外交部长王毅11日同美国国务卿鲁比奥通电话。双方就中美关系及两国元首互动深入交换意见，通话是积极和建设性的。", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【1】"}, {"n": 2, "t": "中国驻美国大使谢锋10日晚表示，近年来，中国、美国和世界发生了重大深刻变化，两国关系也经历波折起伏，但中美关系互利共赢的本质特征", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【2】"}, {"n": 11, "t": "西方情报机构评估，尽管经历数月空袭，伊朗目前每月仍能制造约50枚弹道导弹，大概是战前产能的一半。", "b": "空袭，伊朗目前每月仍能制造约50枚弹道导弹，大概是战前产能的一半。\n彭博社报道，自战争初期以来，美国一直声称伊朗武器库存和重建能力已遭到严重削弱。美国战争部长赫格塞斯星期二（11月10日）在讲话中重申，伊朗80%的工业基础已被摧毁。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【11】"}, {"n": 12, "t": "伊朗最高国家安全委员会秘书雷扎伊指出，伊朗不会让一点浓缩铀运出境，若美国对伊朗发动新的打击，必将招致后果。", "b": "伊指出，伊朗不会让一点浓缩铀运出境，若美国对伊朗发动新的打击，必将招致后果。\n雷扎伊星期三（11月11日）在接受黎巴嫩亲伊朗的“广场”电视台（Al Mayadeen TV）采访时称，伊方已告知俄罗斯，浓缩铀将留在伊朗境内供自己使用。伊朗需要用浓缩铀设计以核能为动力的船舶和潜艇。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【12】"}, {"n": 13, "t": "美国斡旋的俄罗斯和乌克兰第二天谈判已结束，乌方称有望在年底前达成冲突解决方案，俄方也称双方在一些问题上达成共识。", "b": "谈判已结束，乌方称有望在年底前达成冲突解决方案，俄方也称双方在一些问题上达成共识。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【13】"}, {"n": 14, "t": "白宫法律顾问沙夫（Will Scharf）致信众议院监督委员会准主席、民主党籍众议员加西亚（Robert Garcia），指责民", "b": "charf）致信众议院监督委员会准主席、民主党籍众议员加西亚（Robert Garcia），指责民主党人企图利用国会调查程序恐吓并骚扰政府官员。信中指，任何旨在阻挠行政官员履职、或意在恐吓施压的滥权调查，都可能越界构成犯罪。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【14】"}, {"n": 15, "t": "西班牙最大的两个工会劳工总联盟（UGT）和工人委员会（CCOO）支持星期三（11月11日）的罢工，两个工会合计代表超过100万名", "b": "（UGT）和工人委员会（CCOO）支持星期三（11月11日）的罢工，两个工会合计代表超过100万名工人。此外，因租金上涨和驱逐租客问题而感到愤怒的租户协会也参与其中。\n这是西班牙自2012年欧元区债务危机期间，工人为反对紧缩措施而罢工以来，首次举行全国大罢工。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【15】"}, {"n": 16, "t": "在英伟达首席执行官黄仁勋深陷“间谍门”婚外情丑闻并传出恐遭董事会罢免之际，美国参议院两名民主党高层要求特朗普政府妥善保存所有涉及", "b": "间谍门”婚外情丑闻并传出恐遭董事会罢免之际，美国参议院两名民主党高层要求特朗普政府妥善保存所有涉及英伟达对华晶片出口及黄仁勋相关事件的记录，显示国会正为启动深入调查铺路。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【16】"}, {"n": 17, "t": "沙特阿拉伯向石油输出国组织报告称，沙特上个月原油产量增长26%，升至战争爆发前以来的最高水平。沙特引领地区原油产量复苏，而供应回", "b": "称，沙特上个月原油产量增长26%，升至战争爆发前以来的最高水平。沙特引领地区原油产量复苏，而供应回升正推动油价走低。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【17】"}, {"n": 18, "t": "韩国持续面对低生育率冲击，明年小学新生人数预计首次跌破30万人，创历史新低。", "b": "小学新生人数预计首次跌破30万人，创历史新低。\n随着2020年冠病疫情期间出生的“冠病宝宝”陆续入学，各地学校合并、关闭的速度料将加快。教育界担忧，废校潮可能进一步加剧地方人口流失，形成恶性循环。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【18】"}, {"n": 19, "t": "这是近期欧洲各地遭遇的一系列威胁和网络攻击事件中的最新一起，此前受影响的目标包括超市、血库、空中交通系统和电视台。", "b": "胁和网络攻击事件中的最新一起，此前受影响的目标包括超市、血库、空中交通系统和电视台。\n法国星期二（10日）召见伊朗大使，指德黑兰发动一场网络攻击，导致上周数百家超市的冷藏设备瘫痪。伊朗外交部则驳斥这些指控，称“毫无根据且充满敌意”，并否认伊朗革命卫队参与这些攻击。\n一些欧洲官员也担心，这些虚假威胁可能是某种“混合型”破坏行动的一部分。许多人将此类行动归咎于俄罗斯，认为是俄罗斯针对那些向乌克兰提供援助的国家。莫斯科则否认与此事有关。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【19】"}, {"n": 21, "t": "当时不是都在传川普不会离开白宫，会发动暴力抵抗拜登入主白宫就职。但实际刚刚相反，川普虽然指责拜登窃取了选举，那是明面上的，实际刚", "b": "会发动暴力抵抗拜登入主白宫就职。但实际刚刚相反，川普虽然指责拜登窃取了选举，那是明面上的，实际刚刚相反，川普是个美国人，他知道美国的文化和传统。\n拜登写道：「但他却在这里用温暖的语气送上祝福，听起来就像个老朋友。」\n川普对他说：「乔，你知道吗？要不是政治，我相信我们会是好朋友。」\n这封信使用川普招牌的黑色签字笔，写在白宫信纸上。川普在信中没有批评拜登，也没有挑战选举结果，反而以近乎诗意的笔调，写下他在白宫工作的经验，对拜登给予肯定并献上祝福。\n来看看这封信的原文怎么写的：\n\n\n\n『亲爱的乔：\n每天来椭圆形办公室上班，是超乎想像的福分。每一面墙、每一座雕像、每一幅美丽的画作，以及这个神奇地方的每个角落，都回荡着历史。每一道楼梯、每一条走廊、每一扇门，都通往另一扇门、另一段记忆，也通往美国光辉故事中的另一个转折点。\n我希望你每天都花点时间，好好想想自己身在何处，以及在你之前的那些人，那些形塑人类历史进程的巨人。你现在有机会选择自己在历史上的地位，我知道你会忠于自己，也忠于美国人民。\n许多总统来来去去，只是以共和党人或民主党人的身分执政。他们大多没有改变历史，只是被历史无情的浪潮推着走。这不会发生在你身上，因为我知道你多么爱美国人民。\n你不仅与过去相连，肩上还承载着整个国家的希望与梦想。这个事实的分量永远不会离开你，它是你每个决定的锚。\n你的力量、你最深的能量泉源，来自你知道有千千万万的人依靠着你。他们的抱负与期望，就是你在这里的原因，有这么多人期盼你成功。\n愿上帝保佑你和吉儿，愿上帝保佑美国！\n诚挚的，\n唐纳 』", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【21】"}], "tech": [{"n": 3, "t": "英伟达首席执行官黄仁勋因被揭发涉及两段婚外情，且其中一名对象疑似为中国间谍，公司董事会正准备将他罢免。", "b": "涉及两段婚外情，且其中一名对象疑似为中国间谍，公司董事会正准备将他罢免。\n英伟达董事会最快将于当地时间星期三（11月11日）召开会议，商讨并决定黄仁勋的去留。\n【涉间谍案传闻后 黄仁勋再被曝与直属副总裁发生婚外情】据《纽约时报》等多家媒体报道，英伟达（Nvidia）首席执行官黄仁勋在陷入涉华间谍案风波后，又被曝出曾与该公司一名直接向其汇报的高级管理人员存在不正当关系。\n多名英伟达前员工透露，涉事高管为48岁的英伟达医疗健康业务副总裁金伯利・鲍威尔（Kimberly Powell）。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【3】"}, {"n": 4, "t": "将英伟达首席执行官黄仁勋介绍给其婚外情对象黄乐的，竟是与黄仁勋相识十年的中国商人康伟，而康伟正是黄乐的丈夫。", "b": "其婚外情对象黄乐的，竟是与黄仁勋相识十年的中国商人康伟，而康伟正是黄乐的丈夫。\n知情人士透露，在长达两年的时间里，康伟似乎不仅默许了妻子与黄仁勋的恋情，甚至还公开谈论两人的亲密关系。康伟有时还会半开玩笑地向商业伙伴介绍，称妻子是黄仁勋的私人助理。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【4】"}, {"n": 22, "t": "Wow！今早看纽约时报重磅，黄仁勋还有另一段婚外情！和他自己公司下属………难怪他公开信写的是承认自己“unfaithful to", "b": "仁勋还有另一段婚外情！和他自己公司下属………难怪他公开信写的是承认自己“unfaithful to my wife”，而不是具体的某一段。毕竟，十次一百次也是unfaithful🤪\n\n提炼一下要点：\n\n1. 黄仁勋被曝另一段婚外情：据5名前英伟达员工透露，黄仁勋还曾与英伟达医疗健康业务副总裁 Kimberly Powell 发展婚外关系。这段关系此前从未被媒体报道。\n\n2. 双方均已婚，存在上下级关系：黄仁勋现年63岁，Powell现年48岁，两人各自都有婚姻。Powell是黄仁勋的下属，涉及企业管理中的利益冲突及职场行为规范问题。\n\n3. 酒店亲密视频曝光：今年3月英伟达在圣何塞举行年度开发者大会期间，两人被目击在附近一家酒店举止亲密。一名旁观者用手机拍下视频，但《纽约时报》尚未看到该视频。\n\n4. 安保人员试图控制视频外流：据知情人士透露，黄仁勋的安保人员发现有人拍摄后，将对方带到一旁，并提出让其签署保密协议（NDA）。\n\n5. Powell在英伟达身居要职：她2008年加入英伟达，2016年晋升为高级总监，2017年底成为医疗健康业务副总裁，负责推动英伟达芯片技术在医疗、高等教育等领域的应用。\n\n6. 公司内部早已流传相关传闻：5名消息人士称，黄仁勋与Powell的关系在英伟达内部一直有人讨论。\n\n7. 英伟达已启动调查：在黄仁勋承认此前与另一名女性有婚外情后，英伟达董事会本月委托知名律师事务所 Wachtell, Lipton, Rosen & Katz 展开调查。\n\n8.黄仁勋拒绝回应新爆料：记者周三电话询问他与Powell的关系时，他表示：「我认为你不应该直接找我谈这件事。」随后挂断电话。英伟达未发表评论，Powell也暂未回应。\n\n9.类似高管丑闻并非个例：报道提及英特尔前CEO Brian Krzanich曾因承认与员工有婚外关系而于2018年辞职；麦当劳前CEO Steve Easterbrook则因违反公司规定，与多名员工发生关系，于2019年被解职。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【22】"}, {"n": 23, "t": "因为出轨丑闻，英伟达CEO黄仁勋或遭公司董事会罢免。有网友呼吁美国富豪马斯克雇佣黄仁勋，马斯克回应说：“那将是我的荣幸。”", "b": "4   zerohedge @ @zerohedge- 2h                xX\nElon please hire Jensen\ni 350K\nElon Musk @ X                              X.com\nr        @elonmusk\nThat would be an honor\n5:22 PM - 11/11/26 - 32K Vi@ess", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【23】"}, {"n": 24, "t": "英伟达公司内部气氛\"令人沉重\"。许多在公司任职多年的老员工长期将黄仁勋视为近乎无懈可击的精神偶像与引路人，眼下正难以接受这一现实", "b": "据CNBC11日援引知情人士透露，黄\n仁勋于周一返回英伟达位于加利福尼\n亚州圣克拉拉的总部，主持了与高层\n管理人员的例行晨会。\n据报道，黄仁勋在会议伊始就提及出\n轨一事，向员工表达赤意，随后迅速\n将议程转向日常业务 ，全程未开放提\n问环节。周二，他同样在办公室出\n现，继续参加各项会议一一此时距公\n司季度财报发布仅剩一周。\n员工向CNBC形容公司内部气氛\"令人\n沉重\"。多名员工对CNBC表示感到震\n惊。知情人士还透露，许多在公司任\n由多年的老员工长期将黄仁勋视为近\n乎无懈可击的精神偶像与引路人，眼\n下正难以接受这一现实。\n外情曝光后黄位|", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【24】"}, {"n": 26, "t": "07:44aul全国王)", "b": "07:44                       aul 全 国王)\n\u003c\n共 黄仁勋或被罢免! 英伟达回调是布局机会?\nt% Q  ay\n黄仁勋再曝新婚外情，董事会据悉准备\n罢免! 英伟达盘后大跌8%\n华尔街见闻13分钟前\n英伟达(NVDA.US)                              173.730\n1.5倍做空NVDA ETF-.… (NVDS.US)             25.600\n2倍做多NVDA ETF-T-... (NVDX.US)              11 460\n@ 4分钟\n42.87% 曙\n444%\n全\n黄仁勋与公司医疗业务副总裁Kimberly Powell存在婚\n外情，两人均已婚，并有目击者被要求签署保密协\n议。消息经《纽约时报》披露后，英伟达美股盘后跌\n3%; 随后《华尔街日报》报道董事会\nE筹划将其解\n职，股价进一步重挫傅8%。AMD、博通盘后则上涨\n约3%。\n英伟达CEO黄仁勋正面临新一轮个人行为方面的质\n疑，报道称公司董事会正筹划将其解职，这一消息\n令全球最重要的人工智能芯片供应商面临潜在的领\n导层剧变。\n11月11日美股盘后，据《纽约时报》援引五名曾在英\n人汪汪人THn册1 LR RHEE Ast hth\n22\no Size                  加|\ne 8B             5\n自选", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【26】"}, {"n": 27, "t": "年内辞职或被罢免的概率，81%\n\r\n年内离婚的概率，18%\n\r\n年内被批捕的概率，5%\n\r\n年内入职新公司的概率，12%\n\r\n年", "b": "年内离婚的概率，18%\n\n年内被批捕的概率，5%\n\n年内入职新公司的概率，12%\n\n年内入职SpaceX的概率，8%\n\n\n\n还有关于英伟达下一任CEO人选（2年内）的开盘：\n\n\n\n开发出Cuda的英伟达副总裁Ian Buck，25%\n\n英伟达首席财务官Colette Kress，22%\n\n黄仁勋（不下台），17%\n\n现担任Arm公司CEO的Rene Haas，3%\n\n英伟达销售负责人Jay Puri，3%\n\n英伟达首席技术官Michael Kagan，2%\n\n英伟达供应链负责人Debora Shoquist，2%\n\n现担任AMD公司CEO的苏姿丰，2%\n\n黄仁勋的女儿MadisonnHuang，2%\ 业可以来到台北。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196733#:~:text=【4】"}, {"n": 8, "t": "可怜的黄仁勋", "b": "。 RBH Ym @               +H)\n26-11-13 11:10 来自 努比亚NaviX Ultra\n发布于北京\n黄仁勋辞职了，美国国会则要出台收紧\n芯片出口的的新法令，以后英伟达对中\n国出口 Al 心片会更难了，中国对此一定\n要有充分思想准备。\n把这种收紧变成中国加紧发展国产半导\n体的战鼓吧。 中国GPU 产能近年有进展，\n很大程度是逼出来的，更大的进步大概\n需要严厉的封锁逼出来。先进必片全产\n业链的每一个环节都是如此。\nMA, MA, MA.\n也要通过一些渠道警告外部势力: Alig\n中国太甚。台湾岛是世界先进芯片代工\n中心，英伟达的大多数先进芯片都是台\n积电代工生产的，而台湾就在中国大陆\n的旁边。如果算力竞争走向极端化摊牌，\n外部力量想勒紧中国的膀子，那么他们\n要当心中国捏碎他们的睾丸。\n黄仁勋辞职 ，9.0万新讨论", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196733#:~:text=【8】"}, {"n": 12, "t": "美国中期选举计票接近尾声，共和党又一传统票仓爆冷翻蓝，多家媒体预测民主党在密西西比险胜，进一步扩大在参议院的优势。民主党明年掌控", "b": "党又一传统票仓爆冷翻蓝，多家媒体预测民主党在密西西比险胜，进一步扩大在参议院的优势。民主党明年掌控参众两院后，预计将寻求削减特朗普政府高达1.5万亿美元的国防预算。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196733#:~:text=【12】"}, {"n": 13, "t": "俄罗斯总统普京说，俄乌在领土问题上的解读不同，莫斯科反对在战后维和方案中允许西方军队进入乌克兰，并称俄方将把这视为战争的延续。", "b": "题上的解读不同，莫斯科反对在战后维和方案中允许西方军队进入乌克兰，并称俄方将把这视为战争的延续。\n在都柏林参加欧洲政治共同体峰会的泽连斯基星期四提醒欧洲领导人，要警惕美俄就欧洲新的安全安排展开的讨论。他说：“这不仅关乎对乌克兰的安全保障。事实上，这更多是关于欧洲与俄罗斯之间某种新的安全框架。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196733#:~:text=【13】"}, {"n": 14, "t": "路透社报道，特朗普希望实现特金会，寻求重启与金正恩的谈判；但美韩官员认为两人今年会面的可能性不大。韩国总统府高官星期四（11月1", "b": "会，寻求重启与金正恩的谈判；但美韩官员认为两人今年会面的可能性不大。韩国总统府高官星期四（11月12日）说，朝美是否会在峰会前后接触仍难以预测，韩政府正与美方保持沟通。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196733#:~:text=【14】"}, {"n": 23, "t": "老黄不出我判断，自己宣布从Nvidia卷铺盖走人了，总裁、CEO全辞！全部不留。由公司财务长柯蕾丝（Colette Kress ", "b": "idia卷铺盖走人了，总裁、CEO全辞！全部不留。由公司财务长柯蕾丝（Colette Kress 图二）为临时CEO，如果涉及国安，这事还没完。搞笑的是有些群解读为这是民主党对华人的“迫害”，自己发展出一套涉及种族的话术，对美国一无所知却十分热衷锐评。\n为什么昨天我说，老黄大概率玩完，是因为在美国大企业里，发生这种睡下属、睡客户的事，除极个别案例外，CEO基本必须下台走人。\n我举个例子，英特尔前首席执行官科再奇（Brian Krzanich），一个IT届的传奇人物，在2018年 日辞去职位，当时他58岁，被发现曾与员工有一段情，记住是曾经，已经结束了，结果被告发，然后CEO和董事会成员资格都被拿掉了。\n2019年，时任麦当劳首席执行官的伊斯特布鲁克（Steve Easterbrook）遭到董事会解除职务，原因是与与一名麦当劳员工发生双方同意的亲密关系，这违反麦当劳公司政策。\n他最初获得约4,180万美元离职补偿，但2020年，麦当劳接获匿名线索后重新调查，指控他在任内还与至少另外三名员工有亲密关系，并隐瞒相关事实。麦当劳提告追讨离职补偿，后来他同意返还约1.05亿美元的现金与股票奖酬。\n在更早的2005年，飞机制造巨擘波音公司找回来救火、重塑公司道德形象的回锅首席执行官史东赛佛（Harry Stonecipher），被揭发与一名女性高管有婚外情。董事会认为其行为损害了领导道德威信，强制要求其辞职。\n此外，美国最大3C连锁业者百思买（Best Buy）前首席执行官唐恩（Brian Dunn）在2012年4月因与29岁女性女下属发生婚外情而辞职下台，当时他52岁。\n私情伤害公司的商业利益和企业形象，董事会绝对难以接受。\n这样的例子还有很多很多…\n那些人无法理解一个顶级富豪，公司创始人睡个客户下属算多大个事，就自然联想到是被“种族”迫害，对一无所知的事很热衷难免闹笑话。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196733#:~:text=【23】"}], "tech": [{"n": 1, "t": "黄仁勋近期卷入婚外情风波后，宣布辞职。英伟达董事会星期四（11月12日）宣布这一消息，结束此前数日围绕黄仁勋未来去向的种种猜测。", "b": "布辞职。英伟达董事会星期四（11月12日）宣布这一消息，结束此前数日围绕黄仁勋未来去向的种种猜测。黄仁勋在担任首席执行官33年后宣布辞职。\n英伟达公司指出，现任执行副总裁兼首席财务官克雷斯（Colette Kress）已同意担任临时首席执行官。英伟达盘前交易股价随即暴跌逾10%。\n【黄仁勋辞职英伟达暴跌 分析：AI硬件供应链协作或放缓】受访分析师指出，英伟达估值反映黄仁勋的战略愿景、产业人脉与执行能力，他突然离任将显著冲击英伟达股价；也可能拖累英伟达决策速度，人工智能（AI）硬件供应链或因此面临更大不确定性影响。\n【消息：黄仁勋被曝曾与第二名员工有染】路透社从两名知情人士获悉，被迫离职的英伟达首席执行官黄仁勋，曾与公司另一名员工有过亲密关系。\n\n此前两起事件涉及的女性分别是被美国情报部门怀疑为间谍的黄乐，以及英伟达医疗保健业务副总裁鲍威尔（Kimberly Powell）。这是第三起。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196733#:~:text=【1】"}, {"n": 2, "t": "据知情人士透露，他此前数周一直否认婚外情、力争保住职位，但到了周三深夜已经彻底垮掉，一改往日事事掌控的作风，嘴边挂着“随便吧”“", "b": "否认婚外情、力争保住职位，但到了周三深夜已经彻底垮掉，一改往日事事掌控的作风，嘴边挂着“随便吧”“我不在乎”。\n\n转折点是 11 月 6 日，\u003c金融时报>援引美国官员的话说，他和 Alice Huang 是恋爱关系。随后英伟达总法律顾问 Tim Teter 上门当面质问，黄仁勋承认了。Teter 坚持要求董事会采取行动，董事会第二天宣布由 Wachtell Lipton 律所展开调查。周三\u003c纽约时报>又曝出他与医疗业务副总裁 Kimberly Powell 有染，董事会当晚召开远程会议，一直开到深夜，最后黄仁勋别无选择，只能辞职，从此与英伟达彻底切割。\n\n据和他聊过的人说，他痛骂自己是“一坨屎”（“piece of shit”），说已经不在乎自己会怎样，只担心妻子，也不想“毁了”那几位被卷进来的女性的生活。接下来几周，他预计要到国会作证。\nTrump：昨天和黄通过话，他觉得生不如死，一直在说“对不起老婆、对不起家人”\n朱元璋废了胡惟庸之后就这样。。。\n\u003c华尔街日报>：在黄仁勋因两段婚外情辞职、英伟达CFO Colette Kress接任临时CEO之前，两人就已在公司的经营战略和融资政策上产生明显分歧。今年8月，黄仁勋曾在内部会议上严厉批评Kress，称她只是一个负责财务汇报的CFO，无法帮助自己制定战略和作出决策。当时，英伟达正面临大型云计算客户寻求替代芯片、巨额采购承诺以及融资风险不断累积等问题。\n今年以来，黄仁勋的女婿Nico Caprez积极推动英伟达向新兴云计算企业和数据中心开发商提供融资担保，以换取营收分成，并刺激芯片销售。Kress则对担保风险、投资回报率等问题提出质疑，并试图约束Caprez。英伟达一度考虑为OpenAI在俄亥俄州的数据中心项目提供2500亿美元融资担保，消息曝光后，公司市值单日蒸发2500亿美元。Kress随后将最初拟定的资金承诺削减了一半。8月底，英伟达暂停部分融资交易，10月进一步收紧融资支持。\n与此同时，黄仁勋对公司估值持续下降感到不满，并开始反思过度依赖少数大型客户的经营模式。如今，曾被黄仁勋质疑缺乏战略决策能力的Kress，不仅要应对婚外情丑闻引发的联邦及内部调查，还要处理英伟达激进扩张留下的财务风险，以及整个AI产业可能面临的下行压力。\n纽时披露黄仁勋自己选了Paul Weiss律所来做辩护，这家律所专精商务刑事辩护，常接硬刚司法部、证监会、国会调查的委托，合伙人里就有前美国司法部长，以及多名联邦检察官。\n最著名的胜诉案例，是2019年替埃克森美孚打赢了16亿美金索赔案，以及2015年帮对冲基金大佬Anthony Chiasson推翻了监禁78个月的内幕交易罪。\n从风格来看，这家律所是典型的华尔街做派，诉讼强硬但也懂得变通，讲究实际成果而非场面表现，口碑还蛮好的，说是懂得根据客户利益决定抗辩还是谈判，能拿到最优解的大结果。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196733#:~:text=【2】"}, {"n": 16, "t": "在英伟达成立以来，首次出现掌舵人更迭的关键过渡期，董事会将稳定大局的重任交给了已服务公司逾十年的老将克雷斯手中。", "b": "人更迭的关键过渡期，董事会将稳定大局的重任交给了已服务公司逾十年的老将克雷斯手中。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196733#:~:text=【16】"}, {"n": 17, "t": "马来西亚警方加强打击非法挖掘加密货币。霹雳州警方突击涉嫌非法挖掘比特币的民宅；雪兰莪州警方则公开碾压挖矿机，以儆效尤。", "b": "密货币。霹雳州警方突击涉嫌非法挖掘比特币的民宅；雪兰莪州警方则公开碾压挖矿机，以儆效尤。\n据《东方日报》报道，霹雳警方星期二（11月10日）与国家能源公司（简称国能）展开联合突击行动，捣破一处涉嫌非法挖掘比特币的民宅，起获48台比特币挖矿机及其他相关设备。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196733#:~:text=【17】"}, {"n": 20, "t": "英伟达前首席执行官黄仁勋已被传唤，将于下月就其涉嫌与被指是中国间谍的黄乐有染一事，在美国参议院委员会作证。", "b": "唤，将于下月就其涉嫌与被指是中国间谍的黄乐有染一事，在美国参议院委员会作证。\n美国商务部长卢特尼克也已被传唤，将于12月出席参议院银行委员会听证会。他目前正因向中国出口敏感的英伟达人工智能（AI）晶片而接受审查。\n南卡罗来纳州的共和党参议员斯科特（Tim Scott）星期四致信黄仁勋和卢特尼克，要求两人在参议院银行委员会前作证。斯科特在X平台发文说：“近期的报道引发了人们对我们国家安全以及美国敏感技术保护的严重担忧。美国人民有权知道真相。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196733#:~:text=【20】"}, {"n": 22, "t": "马斯克在这个帖子下面回复道：真言", "b": "言 \n段永平谈一种可能：英伟达能不能请黄仁勋做顾问，就像个影子CEO", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196733#:~:text=【22】"}, {"n": 25, "t": "塔勒布老爷子黑天鹅理论又一次显得闪闪发光", "b": "5 Nassim Nicholas Taleb @ @                                          cm\nDid it hit you that a centibillionaire, Jensen Huang, is less free than a\nrandom plumber?\n你有没有意识到，身价千亿的黄仁勋，其自由程度甚至不如一个普通的水管\n工?\nfo}                    1702               © 5,885                                    As", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196733#:~:text=【25】"}, {"n": 26, "t": "英伟达一个内部\"意见箱\"帖子已吸引逾1600条评论，其中绝大多数明确支持恢复黄仁勋的CEO职位。与此同时，另有数百名员工联名签署", "b": "吸引逾16 64岁的二十届中央委员王忠林官宣落马。11月13日，中央纪", "b": "委员浮上水面：卸任湖北省委书记近半年后，64岁的二十届中央委员王忠林官宣落马。11月13日，中央纪委国家监委网站公布：十四届全国人大环境与资源保护委员会副主任委员王忠林涉嫌严重违纪违法，目前正接受中央纪委国家监委纪律审查和监察调查。\n湖北当地的知情人士称，王忠林11月6日于北京被有关部门带走调查，其儿女、女婿同步被查。与此同时，王忠林的王姓秘书亦被要求配合调查。“他到湖北之后，湖北很多工程项目都被山东的建筑企业包揽了。”前述知情人士称，这也成为王忠林被调查的方向之一。另有两消息人士称，与王忠林存在特定关系的一名胡姓女性亦在近期被调查，该名女性就职于湖北当地媒体，亦是山东籍人士。\n \n昨天王忠林落马，这张图片快速流传。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196741#:~:text=【4】"}, {"n": 5, "t": "浙江多地试点“潮汐学校”，防止学龄人口变化导致校园闲置", "b": "浙江多地试点“潮汐学校”，防止学龄人口\n变化导致校园闲置\n近日，浙江省教育厅在官网发布《浙江省“十五五”教育事业发展规划》 ,其中提\n出，持续优化全省城乡中小学布局，盆全与常住人口变化趋势相协调的教育资源配置\n机制，因地制家探索“潮汐学校”等跨学段资江      享模式，提高校园校舍利用效\n形涯新闻注意到，目前，杭州萧山区、人金华义乌市正加速推进“潮汐学校”这一弹性\n化教育资源配置新模式的试点，其中义乌已率先落地两所“潮汐学校”并在今年秋季\n投用。\n所请“潮汐学校”，是一种借监潮汐涨落规律的新型学校建设模式，其核心在于“集\n约建设、弹性使用”。 学校在规划建设初期即按高标准建设并预留弹性空间 ，可根据\n各学段学位裔求“排浪式”变动的特点，动态调配学位资源，以应对学龄人口波动带\n来的学位压力。例如，在初中入学高峰期间，优先用于满足初中学位需求 ; 待高峰过\n后，逐步转换为高中学位供给，从而实现“一校两用、灵活适配”.\n据浙江省教育厅官方微信公众号“教育之江”，在1月上旬召开的2026年全国教育工\n作会议上，浙江省教育厅党组书记、厅长陈春雪围绕“加强资源前脆性布局，平稳有\n序应对基础教育学龄人口渐次达峰”作交流发言时表示 ，为应对“学前阶段和小学阶\n段学龄人口已达峰，初中阶段和高中阶段学龄人口仍在持续增加”的学龄人口变化 ，\n该省将打通使用各学段教育资源，探索建设“潮汐学校” ,缓解初", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196741#:~:text=【5】"}, {"n": 8, "t": "这个标题太伤害我们普通人了", "b": "记F\n全证券最\n黄仁勋，将失去超1亿美元未归\n其净资产0.07%\n念@卢旭宁\n属股权奖励! 占", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196741#:~:text=【8】"}, {"n": 13, "t": "爱尔兰警方在欧洲政治共同体峰会领导人用餐地点附近，发现一个爆炸装置，军方已拆除。路透社报道，参加欧洲政治共同体峰会的领导人星期四", "b": "领导人用餐地点附近，发现一个爆炸装置，军方已拆除。路透社报道，参加欧洲政治共同体峰会的领导人星期四（11月12日）在都柏林梅里恩广场附近的国家美术馆共进晚餐。爱尔兰警方隔天接到报案称，广场另一侧某建筑内发现可疑装置。爱尔兰陆军拆弹专家星期五（13日）将装置拆除。据悉，这个爆炸装置虽然简陋，但仍然可爆。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196741#:~:text=【13】"}, {"n": 15, "t": "让黄仁勋回归的请愿书，一众大佬都签字了，地址：standwithjensen.com", "b": "中\nEts\na\n站\n《>\n语\nStand with Jensen\nseat [EE\n我们要求 NVIDIA 董事会:\n让黄仁勋回归\n在独立调查完成并有明确证据证明将他免职符合公\n司利益之前。\n签署信件               先阅读此文\nPost #standwithjensen\n#bringjensenback on X!\nFollow our account @TheJensenLetter!\nstandwithjensen.com \n产科、妇科和产前护理受到特别严重的冲击。\n在巴尔赫省，又一项荒谬的规定被引入：医生被禁止用姓名称呼女性患者。相反，他们必须使用通用的称呼形式，即使在处方上也是如此。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【15】"}], "soc": [{"n": 1, "t": "【#钧评# 在境外平台亵渎英烈就不会被追究？算盘打错了】近日，杭州互联网法院当庭宣判一起境外网络侵害英烈权益民事公益诉讼案。20", "b": "就不会被追究？算盘打错了】近日，杭州互联网法院当庭宣判一起境外网络侵害英烈权益民事公益诉讼案。2024年10月至2025年2月间，高某在境外社交平台持续发帖，肆意诋毁陈祥榕、刘胡兰、董存瑞、邱少云等英雄烈士，相关侮辱言论累计浏览量达数万次，传播范围较广，社会影响恶劣。高某心存侥幸，以为藏身境外网络空间，就能规避监管、脱离法治约束，显然打错了算盘。案发后，办案机关依法对境外平台上的侵权内容取证，高某也被抓获归案，法院最终判令其公开赔礼道歉、承担赔偿责任。此次案件再次释放鲜明信号：捍卫英烈荣光，不存在网络盲区。境外平台绝非历史虚无主义的自留地，更不是抹黑英烈的法外之地。无论何人、身处何地、使用哪类网络平台，只要侵害英烈名誉荣誉、伤害民族共同情感，都必将受到法律严肃追责。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【1】"}, {"n": 2, "t": "央视曝光校园举报乱象：有家长举报“老师一定要生孩子吗？能不能保证新老师不怀孕？”", "b": "央视曝光校园举报乱象: 有家长举报\n“老师一定要生孩子吗? 能不能保证新\n老师不怀孕? ”\n新京报                  们66人\nAl摘要\n11月15日，央视新闻《朝闻天下》报道校园举报乱\n象: 家校共育，核心是育人，是双向协同，不是单\n向摊派。厘清家校权责边界，一方面要杜绝把学校\n9责任转嫁给家长。另一方面，也要守护好学校和\n一线教师正常履职的空间。近年来，部分不实、非\n理性举报，让不少学校和一线教师陷入困扰。\n节目中提到新京报此前报道目\"九月前两周，收到\n近40封举报信”，被误解的老师和不敢沟通的家长\n中的内容: 原班主任体产假，学校安排新教师接\n任，有家长因此提出质疑，在举报中提出, “老师\n一定要生孩子吗? 能不能保证新老师不怀孕? “\n衔接 |\n*?台北 小雨 19，\n据新京报此前报道，曾经的小学班主任陈昱表示，\n近两年来，每估开学季，针对老师的举报就多起\n来。今年9月初的一周里，平均每天都会接到四五\n封举报信件。全校有近6000名学生，90多个班。\n在过去，一年收到四五封举报信，就已经\"非常可\nMAT”.\n学校让学生轮流打扫厕所，本意是通过劳动教育孩\n子。家长没和老师沟通，直接举报: 这么小的孩子\n就干脏活累活, “老师不能干吗? 没钱请保洁\n吗?“。原来的班主任体产假换了新老师，家长担\n心影响孩子成绩，举报信里说, “老师一定要生孩\n子吗? 能不能保证新", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【2】"}, {"n": 3, "t": "“我们不招斤斤计较的员工”，女子称因拒绝给HR带咖啡被取消面试，目前该岗位已被举报关闭，平台：已将此问题记录上报", "b": "-我们不招斤斤计较的员工 ，女子称\n中国新闻周刊\n695A AI摘要\n因拒绝给HR带咖啡被取消面试，目\n前该岗位已被举报关闭，平台 :\n将此问题记录上报\n11月15日，江苏昆山，有求职者发帖吐槽求职遭\n遇，称她在BOSS直聘\"对接昆山\n一家公司的\n面\n试，到达后被HR发消息命令 你先点两杯喝的，\nEAB BB ist\n我要不带咖啡因的\"，并\n公司不招斤斤计较的员工。\n下报销。求职者\n拒绝之后，HR才改口称咖啡钱可以报销，还扬话\ndn\nBe\n串", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【3】"}, {"n": 7, "t": "凤姐：“我终于过上了无人打扰的生活，我感到真的很幸运，为了这个目标我努力了很多年。\"", "b": "(& FERRO                              Gon\nSS @menghuantanggi2\n我终于过上了无人打扰的生活，我感到真的很幸运，为了这个目标我努力了\n很多年。\n我32岁的时候，刚做了近视眼手术，准备去加州旅行。\n我朋友听说了我要去机场后，说他们正好去机场附近，可以顺道送\n我。\n我拖着行李箱在唐人街的旅馆外面等了她二十分钟。\n就是在这20分钟里，附近的路人拍下了我的照片，传到了网站上。标题\n是:“凤姐无家可归，在纽约的唐人街流浪- \"配的就是那张我拖着行李箱的\n照片。\n那张照片和新闻一时间传遍了中国的网站，直到五六年后都还能在网上", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【7】"}, {"n": 14, "t": "匈牙利当局正扩大调查前总理欧尔班盟友涉嫌贪腐的案件，调查人员近期在全国各地的森林、谷仓和仓库中，起获总值近2000万美元的藏匿现", "b": "班盟友涉嫌贪腐的案件，调查人员近期在全国各地的森林、谷仓和仓库中，起获总值近2000万美元的藏匿现金，标志着调查工作取得重大突破。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【14】"}, {"n": 16, "t": "现在是1991年以来，麻疹传播最严重的时期，主要因为反疫苗势力强大，包括卫生部长本人", "b": "最严重的时期，主要因为反疫苗势力强大，包括卫生部长本人\n2026迄今，已确诊5400多例、已死亡十人", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【16】"}], "intl": [{"n": 9, "t": "俄罗斯与乌克兰经美国斡旋，在阿联酋首都阿布扎比进行新一轮会谈后，乌克兰总统泽连斯基透露，美国谈判代表曾提出一项设想，探讨乌克兰是", "b": "联酋首都阿布扎比进行新一轮会谈后，乌克兰总统泽连斯基透露，美国谈判代表曾提出一项设想，探讨乌克兰是否可能从东部的顿巴斯地区撤军，以换取加入北约（NATO）的资格。\n泽连斯基重申了基辅不愿从本国领土撤军的立场。不过他也说，如果乌克兰能获得一套全面的安全配套，内容涵盖安全保障、建立一支强大且资金充足的乌克兰军队，以及重建资金，他会将这个问题付诸全民公投决定。\n据德国《图片报》爆料，俄罗斯在阿布扎比会谈中要求芬兰退出北约。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【9】"}, {"n": 10, "t": "此前，欧洲盟国担心美国可能从欧洲撤出多达2万5000名士兵。但知情人士说，由于美国对北约成员国增加国防开支的做法持积极态度，如今", "b": "洲撤出多达2万5000名士兵。但知情人士说，由于美国对北约成员国增加国防开支的做法持积极态度，如今更有可能采取规模较小的裁军方案。\n知情人士还说，五角大楼领导层已经意识到，美军在中东地区投射军事力量，在很大程度上依赖部署在欧洲的部队。\n其中一名知情人士说，盟国目前预计，美军在欧洲的总兵力将减少约5000人。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【10】"}, {"n": 11, "t": "马克龙在社交媒体上说：“那些想要限制对乌克兰援助的人，归根结底是希望迫使乌克兰接受不公正的和平，并由此将这种结果强加给整个欧洲。", "b": "要限制对乌克兰援助的人，归根结底是希望迫使乌克兰接受不公正的和平，并由此将这种结果强加给整个欧洲。”\n“这是一种失败主义心态，也是下一场战争的导火索。法国绝不能采取这样的立场。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【11】"}, {"n": 18, "t": "特朗普本计划将东波托马克公园（East Potomac Park）改造成面向职业高尔夫球手的锦标赛级球场，如今他再次遭遇挫折。", "b": "East Potomac Park）改造成面向职业高尔夫球手的锦标赛级球场，如今他再次遭遇挫折。\n在一份长达30页的裁决书中，美国联邦地区法院法官雷耶斯（Ana Reyes）暂时叫停联邦政府推进关闭公园的计划。根据计划，公园原定于星期天（15日）关闭。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【18】"}, {"n": 19, "t": "阿加斯加民主党再赢下一个参议员名额，玛丽・佩尔托拉成为首位当选美国参议院的阿拉斯加原住民", "b": "ee ee ee\nBNO BNO News @             X.com\nNEWS! @BNONews\nJUST IN: Democrat Mary Peltola wins U.S.\nsenate race in Alaska - NBC\n20:59 - 14/11/2026 - 269K Views\nSorer", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【19】"}, {"n": 20, "t": "据美联社（AP）11月12日报道，特朗普周四称赞密西西比州当选联邦参议员斯科特・科洛姆（Scott Colom），肯定他在中期选", "b": "道，特朗普周四称赞密西西比州当选联邦参议员斯科特・科洛姆（Scott Colom），肯定他在中期选举最后几天争取了一些铁杆“让美国再次伟大”支持者，这是共和党总统少有地公开对一名民主党人表示赞赏。上个月，特朗普前往密西西比州科林斯为共和党联邦参议员辛迪・海德-史密斯（Cindy Hyde-Smith）助选时，曾贬称科洛姆是“马克思主义激进分子”“冒牌货”，以及“假装成温和派的无耻骗子”。\n但周四在斯蒂芬・A・史密斯（Stephen A. Smith）的播客《直言不讳》（Straight Shooter）上，特朗普承认，科洛姆跑到他的集会上去结识其最坚定的支持者，显示了胆量。他说：“我前几天听说了，我在那儿开集会，排队的人有10英里长，他就在那条队上拉票，跟队里每个人说自己干得有多好。这一点我很给他肯定。”科洛姆当时沿着等候入场的队伍走，介绍自己并询问他们的关切。这位43岁的检察官竞选期间批评特朗普的政策，尤其是推高油价的对伊战争和给该州农场主带来麻烦的关税，但不对总统或其选民作人身攻击。美联社周三宣布他胜出。他将成为该州自重建时期以来的首位黑人联邦参议员。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【20】"}, {"n": 21, "t": "美国共产党全国委员会委员：我们要向中国共产党学习（中国日报）", "b": "WAY os\n我们要向中国共产党学习\n社会主义论坛时表示，应该向中…\norm an ep” em OD\n3855 13万 2262 = 159\n>", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【21】"}, {"n": 23, "t": "纽约时报写黄仁勋皮衣文那个印度记者，被骂锁推了", "b": "969 posts\nAsking hard questions about\npolitics and culture, money and power.\nSubscribe today ar theink\nAnand Giridharadas @ 6\n@AnandWrites\nMAN IN THE MIRROR, my new book on a subway tragedy that divided America and\nilluminated its workings, is out 9/29/26.\n© NewYork @ penguinrandomhouse.com/books/747118/m...\n€) Joined March 2009 >\n11.3K Following 603.4K Followers\nThese posts are\nprotected\nOnly approved followers can see @AnandWrites’s\nposts. To request access, click Follow. Learn more", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【23】"}, {"n": 26, "t": "国安鹰派一直想削弱黄对政策的影响，Rubio抓住机会、改写情报部门的“怀疑”，向白宫交备忘录，称“已证实”", "b": "响，Rubio抓住机会、改写情报部门的“怀疑”，向白宫交备忘录，称“已证实”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【26】"}], "tech": [{"n": 8, "t": "科技巨头微软星期六（11月14日）说，造成混乱的大规模系统故障基本结束，目前已“恢复服务”。", "b": "日）说，造成混乱的大规模系统故障基本结束，目前已“恢复服务”。\n法新社报道，微软在社交媒体平台X上发文称：“我们已完成针对此次事件根本问题的处理工作，并恢复了其余受影响客户和地区的服务。”\n微软前一天说，已“全面恢复”Outlook电子邮件及其他服务，并指出，此次重大服务中断源于技术故障，“与网络攻击或人工智能和代理无关”。\n根据网络服务监测网站Downdetector的数据，微软星期四发生的故障波及全球，导致微软旗下产品在美洲、欧洲、亚洲和非洲至少74个国家和地区无法正常使用。\n故障期间，部分上班族在社交媒体上开玩笑，庆祝自己终于不用回复邮件。有人调侃微软不必急着修复系统，最好等到星期一再恢复，还有人把Microsoft 365戏称为Microsoft 364。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【8】"}, {"n": 12, "t": "英伟达前首席执行官黄仁勋因婚外情陷谍报风波请辞，引发与英伟达深度合作的韩国企业界高度关注。", "b": "情陷谍报风波请辞，引发与英伟达深度合作的韩国企业界高度关注。\n从三星电子、SK海力士的高带宽存储器供应，到现代汽车集团的自动驾驶与机器人业务，乃至韩企规模庞大的半导体投资计划，恐怕都会因英伟达新管理层战略调整而生变。\n虽说现有合同短期内不至于受冲击，但黄仁勋一手构建的韩美“AI伙伴同盟”能否延续，备受考验。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【12】"}, {"n": 13, "t": "路透社引述知情者和英伟达内部文件报道，英伟达前首席执行官黄仁勋在婚外情丑闻曝光前，曾就他与出轨对象黄乐的关系误导公司高层。\n\r\n", "b": "件报道，英伟达前首席执行官黄仁勋在婚外情丑闻曝光前，曾就他与出轨对象黄乐的关系误导公司高层。\n\n今年10月，黄仁勋曾两次向包括法律顾问蒂特（Tim Teter）和首席行销总监瓦贡菲尔德（Alison Wagonfeld）在内的高层发信息，称他和黄乐的互动属于正常商务往来。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【13】"}, {"n": 17, "t": "调查发现，AI科技本身带来的潜在风险和AI领域迅猛的投资增长，是受访者的首要关切。", "b": "在风险和AI领域迅猛的投资增长，是受访者的首要关切。\n87%的受访者认为AI是金融体系面临的一项显著风险，他们的担忧包括网络攻击、与复杂的AI相关融资有关的风险，以及AI领域盈利放缓可能引发市场全面回调。在此前于5月份发布的调查中，仅50%受访者将AI列为风险因素。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【17】"}, {"n": 22, "t": "1993 年，黄仁勋 30 岁。他和 Chris Malachowsky、Curtis Priem 在圣何塞一家 Denny’s", "b": "他和 Chris Malachowsky、Curtis Priem 在圣何塞一家 Denny’s 餐厅的卡座讨论了创立英伟达的计划。\n2023 年，黄仁勋 60 岁。圣何塞那家 Denny’s 餐厅在黄仁勋当年坐过的卡座边设立了一块纪念牌，上面写着：“催生了一家价值 1 万亿美元公司的卡座”。一开始只是简单地把牌子放在那里，后来还专门又做了画框，配上了黄仁勋来访的照片。\n2026 年，黄仁勋 63 岁。在他辞职的第二天，那家 Denny’s 餐厅拆除了纪念牌。此事曝光后，餐厅又表示将把纪念牌挂回去。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【22】"}, {"n": 24, "t": "属于黄仁勋的世界名画了，连餐厅都上了", "b": "都上了 \n@哈瓦洛hawalo \n我在英伟达内部的消息人士告诉我，还会爆出更多黑料。\n@庄时利和:那黄仁勋确实很过分了，再查查他的钉钉考勤打卡吧，搞不好经常迟到早退", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【24】"}, {"n": 25, "t": "据美国消费者新闻与商业频道（CNBC）11月14日报道，英伟达两大股东周五联名致信董事会，呼吁“以缓慢、审慎、周密的程序”决定未", "b": "NBC）11月14日报道，英伟达两大股东周五联名致信董事会，呼吁“以缓慢、审慎、周密的程序”决定未来领导层，并考虑“黄仁勋可能回归”。联名信由Altimeter Capital首席执行官布拉德・格斯特纳（Brad Gerstner）在社交平台X上公布，Atreides Management的加文・贝克（Gavin Baker）也在信上署名。截至6月30日，两家机构合计持有约21.3亿美元英伟达股票。黄仁勋于本月12日辞去总裁、首席执行官和董事职务。报道称，他是在多起婚外情传闻和董事会独立调查中辞职的，其中一起涉及间谍和国家安全问题；公司未说明原因。\n联名信说，过渡期将由担任首席财务官13年、周四出任临时首席执行官的科莱特・克雷斯（Colette Kress）“得力领导”，但创始人“有权获得审慎程序，避免在全部事实查清前被仓促替换”。信中并未要求立即恢复其职务。埃隆・马斯克（Elon Musk）周五表示已签署要求其复职的请愿书；网上Stand with Jensen请愿号称逾10万签名，含5000多名现任员工。马斯克周六还说，没有黄仁勋，“关键交易将会丢掉”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【25】"}, {"n": 27, "t": "#星舰第15次试飞#摄影师 John Kraus：第 15 次试飞中，42 号飞船返回得克萨斯州星舰基地，星舰首次被发射塔夹住回", "b": "ohn Kraus：第 15 次试飞中，42 号飞船返回得克萨斯州星舰基地，星舰首次被发射塔夹住回收！拍下这样一张照片，我梦想了好多年……今天它成真了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【27】"}], "cult": [{"n": 5, "t": "侯孝贤导演的《童年往事》由于技术原因，取消在香港的两场放映", "b": "The Time to Live and the Time to Die                放映场次\n1月22日 14:30           y\n125128 14:00        iH     i", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【5】"}, {"n": 6, "t": "11月15日，2026年南昌马拉松鸣枪开跑，曾被称为“最快女护士”的张水华以2小时31分58秒的成绩，获得女子全程项目冠军。据悉", "b": "én", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196752#:~:text=【6】"}]}}, {"date": "20261116", "label": "11月16日", "week": "周一", "id": "196786", "title": "无话可说", "cats": {"econ": [{"n": 2, "t": "汽车消费真惨。", "b": "中MK\n前\n2026-11-16 10:00:28 星期一\n[国家统计局: 10月份社会消费品零售总\n额46463亿元 同比增长0.4%]\n财联社11月16日电，国家统计局发布数据显示，1一\n10月份，社会消费品零售总额416464亿元，同比增\n长1.0%。其中，除汽车以外的消费品零售额383811\n亿元，增长2.8%。10月份，社会消费品零售总额464\n63亿元，同比增长0.4%。其中，除汽车以外的消费\n品零售额43162亿元，增长2.5%。\n按消费类型分，1一10月份，商品零售额369261亿元\n，同比增长0.9%; 餐饮收入47203亿元，增长2.2%\n。10月份，商品零售额41228亿元，同比 中俄美元首会晤将在深圳举行#。外交部发言人毛宁表示，这是中俄美三国元首历史上首次面对面会晤，将围绕维护世界和平、", "b": "将在深圳举行#。外交部发言人毛宁表示，这是中俄美三国元首历史上首次面对面会晤，将围绕维护世界和平、促进大国关系战略稳定深入交换意见，具有开创性意义。\n中俄美都是联合国创始会员国和安理会常任理事国。历史上，三国曾并肩赢得世界反法西斯战争的胜利。当前形势下，三国肩负着合作应对全球性挑战、促进世界和平稳定的重要责任。中俄美加强沟通、管控分歧、稳定关系，符合三国利益，也是国际社会的期待，有利于稳定世界局势、推动对话合作。 \n【外交部：各方应携手促进人工智能发展和治理 不应当搞封闭排他小圈子】财联社11月16日电，外交部发言人毛宁主持例行记者会。有记者问：据报道，美国和9个国家共同签署了有关人工智能的相关宣言。请问中方认为这是否会影响接下来的中美元首会晤？毛宁表示，中方一贯认为人工智能是全人类的共同财富，在这个领域不应当以意识形态划线或者是搞封闭排他的小圈子，各方应当携手促进人工智能的发展和治理，推动人工智能服务全人类。关于中美元首会晤双方保持着沟通。 (央视新闻)", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196786#:~:text=【1】"}, {"n": 12, "t": "英国《金融时报》星期天（11月15日）引述知情人士报道，黄仁勋的几名硅谷盟友已着手游说董事会让他复职。", "b": "15日）引述知情人士报道，黄仁勋的几名硅谷盟友已着手游说董事会让他复职。\n【黄仁勋据传计划重掌英伟达 公司股价有望上涨】美国时间星期天（11月15日）晚上，追踪英伟达股价、在Hyperliquid区块链上交易的永续期货合约上涨超过3%。纳斯达克100指数期货（Nasdaq 100 futures）一度上涨约0.9%，随后回吐部分涨幅。\n\nKCM Trade首席市场分析师沃特勒（Tim Waterer）指出，黄仁勋是英伟达的代名词，因此市场对黄仁勋可能重返英伟达一事，作出正面反应。\n黄辞职的当天，NVDA📉4%，纳斯达克📉0.4% \n【摩根大通分析师：#英伟达AI算力合约份额从83%降至39%#】财联社11月16日电，摩根大通资产管理市场与投资策略主席迈克尔・切巴莱斯特在前一日发布的报告中称，OpenAI、Anthropic这类前沿AI实验室已经敲定、未来将采购的算力基础设施里，英伟达GPU占比仅39%。而2023至2025年，英伟达在AI芯片整体收入中的份额曾达到83%，这预示着它在下一代算力基础设施中的占比可能大幅萎缩。竞争对手博通的定制芯片份额位居第二，达24%；谷歌张量处理器（TPU）占16%，AMD GPU占15%，亚马逊Trainium芯片占6%。这一结构说明，谷歌、亚马逊、微软等曾经的英伟达客户，或是和博通合作自研芯片，或是选择性价比更高的AMD处理器。OpenAI在2025年10月宣布与博通合作，开发10吉瓦的定制AI加速器，同时敲定从AMD采购6吉瓦算力的GPU。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196786#:~:text=【12】"}, {"n": 14, "t": "贝森特的话说得特别直白。他公开在电视节目里放话，称英伟达需要大刀阔斧的领导层变革，要求董事会从公司外部寻找继任者，而不是从现有管", "b": "在电视节目里放话，称英伟达需要大刀阔斧的领导层变革，要求董事会从公司外部寻找继任者，而不是从现有管理团队里提拔。比换人更严厉的，是贝森特对英伟达合规问题的公开质疑。他直接追问，公司是否明知故犯，违反高端芯片出口管制规定，并通过违规销售虚增营收，同时要求董事会和外部法律顾问在10天内给出正式解释。\n贝森特的质疑还指向英伟达的财务披露。在中国市场销售受限之际，英伟达此前报告的新加坡收入大幅飙升，一度占据公司总营收的五分之一以上。值得注意的是，英伟达已于2025年11月停止单独披露新加坡收入，并调整统计口径，改以客户总部所在地而非账单地址作为依据。这一历史遗留的财务疑点，如今成了监管层紧盯不放的突破口。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196786#:~:text=【14】"}, {"n": 15, "t": "美国众议院共和党议员穆伦纳尔（John Moolenaar）说，英伟达（Nvidia）前首席执行官黄仁勋已同意就他与涉嫌黄乐（A", "b": "John Moolenaar）说，英伟达（Nvidia）前首席执行官黄仁勋已同意就他与涉嫌黄乐（Alice Huang）的关系，向美国国会议员闭门作证，但具体日期尚未敲定。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196786#:~:text=【15】"}, {"n": 17, "t": "按照俄方设想，这一人选还必须获得普京的认可。此前特朗普女婿库什纳在莫斯科与俄总统会面后称，普京愿“尝试”让欧洲参与谈判。", "b": "得普京的认可。此前特朗普女婿库什纳在莫斯科与俄总统会面后称，普京愿“尝试”让欧洲参与谈判。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196786#:~:text=【17】"}, {"n": 18, "t": "意大利数据保护局宣布，查明脸书母公司、美国科技巨头Meta平台（Meta Platforms）在未事先告知或征得用户同意的情况下", "b": "母公司、美国科技巨头Meta平台（Meta Platforms）在未事先告知或征得用户同意的情况下，擅自读取安卓系统用户的照片和视频，决定对公司处以8亿零500万欧元的巨额罚款。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196786#:~:text=【18】"}, {"n": 20, "t": "日本的新移民政策把日语能力列为审核标准之一，促使有意申请长居日本的外国人一窝蜂抢报官方主办的“日本语能力测试”（JLPT）。日媒", "b": "审核标准之一，促使有意申请长居日本的外国人一窝蜂抢报官方主办的“日本语能力测试”（JLPT）。日媒调查显示，由于考场名额有限，这场突如其来的报考热潮，导致许多急需该证书求职的留学生被拒之门外。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196786#:~:text=【20】"}, {"n": 21, "t": "巴西传奇球星罗纳尔迪尼奥（Ronaldinho）重出江湖，46岁的他上星期天（11月15日）代表意大利第三级联赛球队拉文纳（Ra", "b": "naldinho）重出江湖，46岁的他上星期天（11月15日）代表意大利第三级联赛球队拉文纳（Ravenna）上阵，助球队在德比战中以2比0击败福尔利（Forli）。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196786#:~:text=【21】"}, {"n": 23, "t": "英国首相将在伦敦金融城发表演讲，为本周英国与欧盟达成“重置”协议铺路。", "b": "为本周英国与欧盟达成“重置”协议铺路。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196786#:~:text=【23】"}], "tech": [{"n": 4, "t": "这个论文还获得了两项国家自然科学基金、两项湖南省自然科学基金，再加上医院的新进员工科研启动基金。", "b": "学基金、两项湖南省自然科学基金，再加上医院的新进员工科研启动基金。\n图里的小鼠肉瘤，其实是虾滑", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196786#:~:text=【4】"}, {"n": 9, "t": "近日，硅谷老牌风投Menlo Ventures合伙人Deedy Das在社交平台晒出一张全球AI公司估值与营收排行榜。CNMO科", "b": "Ventures合伙人Deedy Das在社交平台晒出一张全球AI公司估值与营收排行榜。CNMO科技注意到，截至11月14日，全球估值超过100亿美元、公开年化营收达到1亿美元以上的未上市AI公司共有30家。\n榜单显示，头部\"双寡头\"断层效应进一步拉大。OpenAI以约1.25万亿美元估值继续领跑，Anthropic以约9650亿美元紧随其后，两家与其他竞争对手拉开明显距离。\n不过按年化营收排名，位置已经对调：Anthropic超过了OpenAI。2025年底，OpenAI年化营收约200亿美元，Anthropic仅90亿美元；而进入2026年，截至9月底OpenAI年化营收约500亿美元，10月底Anthropic已冲到810亿美元，短短十个月增长约8倍。今年第三季度，Anthropic实现营收约170亿美元，OpenAI约为100亿美元。\n中国公司中，DeepSeek以890亿美元估值排名第五，年化营收约10亿美元；月之暗面以500亿美元估值位居第七，收入同样约10亿美元。值得注意的是，两者的动态市盈率分别为89倍和50倍。整体来看，30家公司中有23家来自美国，中国有2家入围，其余5家来自加拿大、法国、德国、英国和瑞典。\n \n算力类企业中，Crusoe估值309亿美元、收入约20亿美元；Fluidstack估值180亿美元。数据基础设施方面，VAST Data估值300亿美元、收入约20亿美元；Scale AI估值290亿美元、2025年收入约10亿美元。推理服务平台方面，Baseten估值300亿美元、收入约6亿美元；Fireworks AI估值175亿美元、Modal估值157.5亿美元、fal估值160亿美元。\n应用层中，Cognition凭借AI编程智能体Devin估值480亿美元；ElevenLabs估值220亿美元；Perplexity估值210亿美元。垂直行业中，法律AI公司Harvey估值155亿美元，已进入美国前100大律所的80%；企业客服智能体Sierra估值158亿美元；医疗AI平台OpenEvidence估值150亿美元。（手机中国）", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196786#:~:text=【9】"}, {"n": 10, "t": "11月16日，华为云召开发布会，推出首款�N腾原生具身世界模型CloudRobo-WM1.2，该模型权重、推理、代码将开源。模型", "b": "构建\nE23F4CloudRobo-WM1.2RStt Hii et Wiz\n+2 Kh NOK MF KEE MRE RO Ne FM mR MM 关\nCe ed", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196786#:~:text=【10】"}, {"n": 13, "t": "#英伟达机器人工程师宣布辞职# 英伟达机器人工程师Darrell Dai（戴达瑞）宣布辞职，此前黄仁勋离职，他对公司处理的方式表", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196786#:~:text=【13】"}, {"n": 22, "t": "据财联社报道，美国芯片巨头英特尔遭股东提起诉讼。这些股东指控其隐瞒了个人电脑（PC）销售长期放缓所带来的影响，从而对他们构成欺诈", "b": "尔遭股东提起诉讼。这些股东指控其隐瞒了个人电脑（PC）销售长期放缓所带来的影响，从而对他们构成欺诈。PC销售放缓近期曾导致该公司股价单日暴跌约29%。\n据第一财经报道，这起诉讼发生在英特尔股价大幅下跌之后。10月30日，英特尔股价单日下跌28.6%，市值蒸发约1400亿美元。而在10月29日，英特尔公布了第三季度财报，并给出低于市场预期的第四季度业绩指引，同时警告PC市场疲软至少将持续至2027年上半年。\n原告将诉讼矛头指向英特尔7月23日至10月29日期间的信息披露，认为公司管理层没有充分披露PC需求放缓和库存积压对经营业绩的影响，也没有充分说明公司在数据中心芯片需求增长背景下面临的供应限制。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196786#:~:text=【22】"}, {"n": 24, "t": "马斯克吐槽英伟达董事会构成，看了看，卖Taco的，卖可乐的，卖药的，几个投资机构的，一个航空航天和机械教授。也难怪黄仁勋被扫地出", "b": "\u003c\n16:21 2\n帖子\nee\n‘A. Brooke Seawell -venture partie st\nNEA an former Synopsys CFO.\n‘Aut Shah ~ Former Chie information\n‘73 Data fcr a Lay\neA. Stevens -wanagnne Parmerof\nGayatri Sarkar @ @GS VCactivist .1天\nNVIDIA board credentials.\nNo wonder Jensen got fired.\na\noO\n全\noan                 wee\nG     a\n‘Tench Coxe - Vertue capitalist end former managing\n p?name=xilei&id=196808#:~:text=【3】"}, {"n": 5, "t": "360称：经初步了解，公司内审发现该员工涉嫌经济问题，立即向公安机关报案，目前该员工正在接受有关部门调查。公司一贯要求全体员工严", "b": "发现该员工涉嫌经济问题，立即向公安机关报案，目前该员工正在接受有关部门调查。公司一贯要求全体员工严格遵守法律法规和公司制度，对贪腐及其他违法违规行为持零容忍态度，一经查实，绝不姑息。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【5】"}, {"n": 9, "t": "中国市场，一直没有大起大落，太稳健了", "b": "稳健了", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【9】"}, {"n": 11, "t": "悬浮魔术破解攻略", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【11】"}, {"n": 27, "t": "在马尼拉的黎刹广场，抗议示威活动已开始。配备防暴盾牌和警棍的警察立即封锁了黎刹广场前方的道路，以防抗议者的激进行动。", "b": "动已开始。配备防暴盾牌和警棍的警察立即封锁了黎刹广场前方的道路，以防抗议者的激进行动。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【27】"}, {"n": 29, "t": "果然，要小心会在公开场合放出你“原生状态”照片的朋友。", "b": "“原生状态”照片的朋友。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【29】"}, {"n": 32, "t": "“詹姆斯・邦德是影史最具传奇色彩的角色之一，能够接过007这个身份，是我一生至高的荣幸。我由衷感谢丹尼斯、艾米、大卫、塔尼娅以及", "b": "彩的角色之一，能够接过007这个身份，是我一生至高的荣幸。我由衷感谢丹尼斯、艾米、大卫、塔尼娅以及亚马逊米高梅工作室所有人对我的信任。说这个角色是梦想成真，都不足以形容我的心情。我无比期待和这支优秀团队开启这次合作、投入接下来的创作。”\n导演丹尼斯・维伦纽瓦补充道：\n“首先，我想向所有参与本次选角的优秀演员致以诚挚谢意。我们见到了一众极具实力的人选，但邦德只能有一位。我欣喜地欢迎罗伯特・帕丁森成为我们的新任007。他身上拥有邦德那种跨越时代的内核，同时又能带来全新的气质。我已经迫不及待要开拍了。”\n制片人艾米・帕斯卡与大卫・海曼补充道：“邦德这个角色的传奇，交到罗伯特・帕丁森手上大可放心。他作为演员敢于突破、自带自嘲式的风趣，并且总能不断重塑自我，这些特质让他成为适配我们这个时代的完美邦德。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【32】"}, {"n": 33, "t": "真是触目惊心的一张图… 假如这个研究大致准确，那么除非通过强制性政策或大规模移民（这两者都完全没有民意基础），人口下降/老龄化问", "b": "个研究大致准确，那么除非通过强制性政策或大规模移民（这两者都完全没有民意基础），人口下降/老龄化问题就基本无解，而且只会愈演愈烈。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【33】"}], "intl": [{"n": 6, "t": "一个来中国参会的日本人 Claude 被封号了。。。", "b": "Lr) 吉川真人四深世> g\n我的Claude账户也被暂停了。在APEC峰会中，请务必就这个问题进行讨\n论。\nPAIY biden\nKL wD sarr1\nAnthropic 1181\nTome\nClaude", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【6】"}, {"n": 12, "t": "一名印度尼西亚政府高级官员透露，当地警方已于今年初应美国联邦调查局要求，针对新加坡公司超速国际（Megaspeed）的印尼子公司", "b": "当地警方已于今年初应美国联邦调查局要求，针对新加坡公司超速国际（Megaspeed）的印尼子公司展开调查和搜查，以追查晶片相关公司购买的英伟达晶片流向。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【12】"}, {"n": 13, "t": "美国晶片巨头英伟达前首席执行长黄仁勋辞职后，支持他复职的声浪持续扩大，不仅获得特斯拉首席执行长马斯克及美国总统特朗普声援，台湾也", "b": "黄仁勋辞职后，支持他复职的声浪持续扩大，不仅获得特斯拉首席执行长马斯克及美国总统特朗普声援，台湾也掀起挺黄热潮。不过，据三名知情人士透露，英伟达董事会目前无意让黄仁勋重掌公司。\nTrump今天表达“支持黄复职”后，媒体��访九名共和党议员（包括外事委、金融委高层），全部反对，并认为是个“糟糕的主意” \n川普今天早上谈到财长贝森特和商务部长Lutnick的矛盾：\n川普：“这是两种不同的观点。一方想与中国保持友好，另一方则想与中国闹翻。”\n记者：“但贝森特部长认为，是Lutnick推迟了将 MegaSpeed 列入该威胁名单。”\n川普：“不，他可能是推迟了，但他之所以这么做是因为。。。如果你不推迟它，如果你真的采取了行动，你可能会和中国闹翻。我们现在和中国的关系非常好。我理解双方的立场。我会做出决定，但我非常了解双方的想法。”\n【#黄仁勋X账号删除CEO头衔#　只保留英伟达创办人】在要求黄仁勋复职的网络连署来到近19万之际，根据TechFlow，黄仁勋在社交平台X上的简介已悄悄变更，仅保留英伟达创办人的字样，删除原有执行长头衔。另有网友指出，原本有的公司相关标志也已经撤下。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【13】"}, {"n": 16, "t": "泽连斯基星期一（11月16日）在社交媒体发文称，美国总统特使威特科夫和总统特朗普的女婿库什纳参加当天的线上磋商，欧洲方面则派出所", "b": "在社交媒体发文称，美国总统特使威特科夫和总统特朗普的女婿库什纳参加当天的线上磋商，欧洲方面则派出所有后续将参与对俄谈判的代表，包括法国、德国、英国、意大利和波兰以及欧盟机构代表，此外还有一名北约代表参加磋商。\n【80亿欧元！#欧盟批准创纪录援乌款项#】据德新社11月16日报道，欧盟16日批准向饱受战争蹂躏的乌克兰支付近80亿欧元（约合88亿美元）的援助款项，这是欧盟迄今向该国拨付的最大单笔款项。\n根据欧盟一份声明，批准这笔援助是在乌克兰完成司法、反腐败和能源等领域改革之后作出的。\n声明称，这笔资金旨在促进“稳定、复苏和现代化，维持（乌克兰）公共行政运转，并支持其改革努力”。\n乌克兰总统弗拉基米尔・泽连斯基感谢欧盟和欧盟委员会主席乌尔苏拉・冯德莱恩批准该款项。\n泽连斯基在社交平台X上写道：“我感谢欧洲每一位促成如此有力举措的人。乌克兰的财政韧性是保障我们欧洲共同安全的关键。”\n此外，欧盟委员会在一份新闻稿中表示，已拨付17.1亿欧元军事援助，用于购买无人机、弹药和防空系统。\n冯德莱恩说：“我们将继续坚定不移地支持乌克兰，正如自俄乌冲突第一天以来的每一天一样。”\n她说：“我们将继续致力于实现公正持久的和平，维护乌克兰的主权、领土完整和欧洲的安全。”\n乌克兰面临严重的财政困难。泽连斯基10月份表示，尽管自2022年2月俄乌冲突爆发以来，欧盟已动员超过2350亿欧元的预算和军事援助，但乌克兰在2027年还需要额外700亿欧元。\n欧盟委员会预计将在本月底下一届欧盟峰会之前提出一项新的乌克兰支持贷款提案。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【16】"}, {"n": 17, "t": "虽然造成的破坏较轻，但仍引起俄方官员的愤怒。自俄罗斯于2022年2月对乌克兰发动攻势以来，克里米亚大桥一直是乌克兰的主要打击目标", "b": "方官员的愤怒。自俄罗斯于2022年2月对乌克兰发动攻势以来，克里米亚大桥一直是乌克兰的主要打击目标。\n基辅方面说，乌方采取的报复打击，是对莫斯科此前针对乌克兰城市及能源基础设施发动导弹和无人机袭击的正当回击。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【17】"}, {"n": 18, "t": "金正恩视察了三池渊机场改建工程、旅游铁路和滑雪度假村，并对当地酒店、旅馆和住宅的建设情况表示满意。他也登上白头山，查看重建的缆车", "b": "、旅游铁路和滑雪度假村，并对当地酒店、旅馆和住宅的建设情况表示满意。他也登上白头山，查看重建的缆车站和天池周边工程。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【18】"}, {"n": 19, "t": "分析认为，此举可能意在淡化冷战时期社会主义国家的象征色彩，也反映领导人金正恩试图摆脱前任领导人的政治遗产，塑造有别于金日成、金正", "b": "时期社会主义国家的象征色彩，也反映领导人金正恩试图摆脱前任领导人的政治遗产，塑造有别于金日成、金正日时代的国家认同，进一步强化韩朝“敌对两国”的政策路线。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【19】"}, {"n": 20, "t": "伊朗外交部副部长加里巴巴迪说，在战争结束且美国满足伊朗提出的条件之前，伊朗不会允许国际原子能机构核查人员进入本国受损核设施。", "b": "在战争结束且美国满足伊朗提出的条件之前，伊朗不会允许国际原子能机构核查人员进入本国受损核设施。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【20】"}, {"n": 21, "t": "日本和美国正就更新为期五年的驻日美军经费分摊协定进行磋商。据报特朗普政府提出高达3万亿日元的要求，约为现行水平的三倍，日方是否会", "b": "日美军经费分摊协定进行磋商。据报特朗普政府提出高达3万亿日元的要求，约为现行水平的三倍，日方是否会全盘接受成为关注焦点。据日美外交相关人士透露，日方不会完全满足美方要求，最终金额可能在1.5万亿日元左右。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【21】"}, {"n": 22, "t": "美国最大银行摩根大通星期一出现技术故障，导致部分客户的交易处理时间延长，但客户仍可正常使用账户及资金。", "b": "技术故障，导致部分客户的交易处理时间延长，但客户仍可正常使用账户及资金。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【22】"}, {"n": 23, "t": "美国与九个伙伴国家包括印度、新加坡和英国等，承诺保护敏感技术和关键基础设施。各国签署宣言，同意构建一个安全框架，以保护对于人工智", "b": "加坡和英国等，承诺保护敏感技术和关键基础设施。各国签署宣言，同意构建一个安全框架，以保护对于人工智能供应链极其重要的关键技术、软件、知识材料和零部件。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【23】"}, {"n": 26, "t": "在利沃夫一座安葬乌克兰阵亡将士的公墓纪念。\n\r\n加文・纽森宣布，加利福尼亚州正向乌克兰运送救命医疗援助物资：", "b": "的公墓纪念。\n\n加文・纽森宣布，加利福尼亚州正向乌克兰运送救命医疗援助物资：\n1,100万块绷带。\n\n1,300多张病床。\n\n一座拥有50张床位的医疗站。\n\n伤口护理包和发电机。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196808#:~:text=【26】"}, {"n": 28, "t": "德国地狱笑话，只是这次受伤的是德国人", "b": "Pirat Nation @ © ba\n@Pirat Nation\n微软电子邮件中断延迟了德国主题公园酒店的氯气安全警报，导致 15 名客\n人出现呼吸问题。\n一个故障系统向 Ling Bao 酒店 (Phantasialand 的一部分) 的泳池中和泵入\n了过多氯气。该泳池的警报系统依赖电子邮件警报，但由于\nOutlook/Exchange 中断，这些警报从未到达。\n四名客人被送入医院，泳池暂时关闭。\n评价此翻译: 只 名\n上午6:00 - 2026年11月15日 . 24.7万查看",
