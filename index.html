<style>
  :root{
    --paper:#F5F4EF; --card:#FFFFFF; --ink:#20242B; --ink-2:#5A5F68; --line:#E2E0D8;
    --blue:#2662B8; --green:#12805E; --red:#C0443B; --purple:#6A48B0; --amber:#B07A1E;
    --blue-soft:rgba(38,98,184,.06); --green-soft:rgba(18,128,94,.06);
    --red-soft:rgba(192,68,59,.06); --purple-soft:rgba(106,72,176,.06); --amber-soft:rgba(176,122,30,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
  .wrap{max-width:800px;margin:0 auto;padding:0 20px}
  a{color:inherit}
  ::selection{background:rgba(176,122,30,.25)}

  /* 报头 */
  .masthead{background:var(--ink);color:#F5F4EF}
  .masthead-inner{max-width:840px;margin:0 auto;padding:34px 20px 30px}
  .brand-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand{font-family:"Noto Serif SC",serif;font-weight:900;font-size:26px;letter-spacing:.12em}
  .brand .dot{color:var(--amber)}
  .slogan{font-size:13px;color:#A9AEBB;letter-spacing:.08em}
  .issue-date{font-size:13px;color:#8C93A3;letter-spacing:.2em;margin-top:6px}
  .issue-title{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(24px,4.6vw,36px);line-height:1.4;margin:16px 0 4px;color:#fff}
  .issue-sub{font-size:13px;color:#8C93A3}

  /* 日期切换 */
  .daybar{background:#1B1E24;border-top:1px solid rgba(255,255,255,.1)}
  .daybar-inner{max-width:840px;margin:0 auto;padding:12px 20px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#A9AEBB;border-radius:8px;padding:8px 6px 6px;cursor:pointer;font-family:inherit;transition:all .15s}
  .day-btn b{display:block;font-size:13px;font-weight:600;color:#E7E9EE}
  .day-btn span{font-size:11px;color:#8C93A3}
  .day-btn:hover{background:rgba(255,255,255,.14)}
  .day-btn.active{background:var(--amber);border-color:var(--amber);color:#20242B}
  .day-btn.active b{color:#20242B}
  .day-btn.active span{color:#20242B}

  /* 导航 */
  .section-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .nav-inner{max-width:840px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .nav-inner::-webkit-scrollbar{display:none}
  .nav-inner a{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink-2);padding:5px 12px;border-radius:999px;transition:all .15s}
  .nav-inner a:hover{background:var(--line);color:var(--ink)}
  .nav-inner a i{width:8px;height:8px;border-radius:50%;background:var(--nc)}
  .to-top{margin-left:auto;color:var(--ink-2);font-size:13px;text-decoration:none;padding:5px 10px;border:1px solid var(--line);border-radius:999px;flex-shrink:0}
  .to-top:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* 主题板块 */
  main{padding:36px 0 20px}
  section.panel{margin-bottom:56px;scroll-margin-top:64px}
  .panel-head{display:flex;align-items:center;gap:16px;margin-bottom:4px}
  .panel-mark{width:46px;height:46px;border-radius:10px;background:var(--sec);color:#fff;font-family:"Noto Serif SC",serif;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .panel-title{font-family:"Noto Serif SC",serif;font-weight:700;font-size:clamp(20px,3.2vw,24px);color:var(--sec)}
  .panel-title span{font-size:13px;color:var(--ink-2);font-family:"Noto Sans SC",sans-serif;font-weight:400;display:block;margin-top:2px}
  .panel-line{height:2px;background:var(--sec);opacity:.25;margin:14px 0 20px}

  /* 条目 */
  .items{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sec);border-radius:0 8px 8px 0;padding:12px 15px;transition:background .18s;break-inside:avoid;cursor:pointer;position:relative}
  .item:hover{background:var(--sec-soft)}
  .item-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .item-head .src{flex-shrink:0}
  .item .src{font-size:11.5px;font-weight:500;letter-spacing:.05em;opacity:.95}
  .item h3{font-family:"Noto Serif SC",serif;font-weight:700;font-size:14.5px;line-height:1.45;margin:2px 0 4px}
  .item p.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;font-size:12.8px;color:#4A4F58;line-height:1.6}
  .item p.full{font-size:12.8px;color:#4A4F58;line-height:1.6}
  .item.has-more::after{content:"… 点击查看全文";position:absolute;right:10px;bottom:6px;font-size:11px;color:var(--sec);background:linear-gradient(90deg,transparent,var(--card) 30%);padding:2px 6px 2px 14px;pointer-events:none}
  .item.has-more p.clamp{position:relative}
  .src-link{font-size:11px;color:var(--ink-2);text-decoration:none;white-space:nowrap;border-bottom:1px dashed var(--line);transition:color .15s,border-color .15s;position:relative;z-index:2}
  .src-link:hover{color:var(--sec);border-color:var(--sec)}
  .item.full{grid-column:1/-1}
  .src-mon{color:var(--blue)} .src-tue{color:var(--green)} .src-wed{color:var(--purple)} .src-thu{color:var(--red)}
  .src-fri{color:var(--amber)} .src-sat{color:#3E7D8C} .src-sun{color:#2F6B7A}

  /* 全文弹层 */
  .modal-mask{position:fixed;inset:0;background:rgba(20,22,28,.62);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .18s}
  .modal-mask.open{opacity:1;visibility:visible}
  .modal{background:var(--paper);max-width:640px;width:100%;max-height:82vh;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;transform:translateY(10px);transition:transform .18s}
  .modal-mask.open .modal{transform:translateY(0)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
  .modal-tag{font-size:12px;color:var(--sec);font-weight:600;letter-spacing:.06em}
  .modal-close{background:none;border:none;font-size:22px;line-height:1;color:var(--ink-2);cursor:pointer;padding:4px 8px;border-radius:6px}
  .modal-close:hover{color:var(--ink);background:var(--line)}
  .modal-body{overflow-y:auto;padding:18px 20px 22px}
  .modal h3{font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px;line-height:1.5;margin-bottom:12px}
  .modal p{font-size:14.5px;line-height:1.9;color:#33363D;white-space:pre-wrap;word-break:break-word}
  .modal-src{margin-top:16px;font-size:12.5px}
  .modal-src a{color:var(--sec);text-decoration:none;border-bottom:1px dashed var(--line)}

  /* 页脚 */
  footer{background:var(--ink);color:#A9AEBB;margin-top:20px}
  .footer-inner{max-width:840px;margin:0 auto;padding:30px 20px;font-size:13px;line-height:1.9}
  .footer-inner a{color:#F5F4EF;text-decoration:none}
  .footer-inner a:hover{color:var(--amber)}
  .footer-inner .src{color:#8C93A3}
  .footer-links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 18px;margin:10px 0 14px}
  .footer-links div{display:flex;align-items:baseline;gap:8px;min-width:0}
  .footer-links .src{flex-shrink:0}
  .footer-links a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.item,.nav-inner a,.day-btn{transition:none}}
  @media (max-width:720px){
    .daybar-inner{grid-template-columns:repeat(4,1fr)}
    .items{grid-template-columns:1fr}
    .footer-links{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
</style>

的。当他们开始尝试进行能够形成两种镜像分子的化学反应时，在试管中得到的两种产物总是等量出现。然而，化学家一直努力尝试只生成其中一种镜像形式，因为在开发将与生命体发生作用的分子――例如药物――时，只有其中一种镜像形式能够产生预期效果。\n2026年诺贝尔化学奖表彰了使化学家能够推动产生同手性的化学反应的相关发现。\n“亨利・卡甘和硖合宪三为一个有着一个多世纪历史的化学谜题提供了解答：同手性如何能够自发产生。他们开发的化学反应令人惊叹。”诺贝尔化学委员会主席海纳・林克（Heiner Linke）说。\n1986年，亨利・卡甘迈出了决定性的一步，他发现了一种操控化学反应的新方法。这使他能够获得比例高于此前认为可能达到的某一种镜像形式。\n硖合宪三则迈出了下一步。1995年，一篇重要论文介绍了他设计的首个有可能实现同手性的化学反应。2003年，他最终取得成功。他展示了一种只生成两种可能镜像形式中的一种的反应。除生命本身之外，此前从未有人实现过这一成就。\n得益于亨利・卡甘和硖合宪三的发现，我们如今已经知道同手性是如何产生的。他们的发现对于设计药物生产反应的化学家而言具有决定性意义。\n诺贝尔化学奖：“手性”分子之谜", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【1】"}, {"n": 2, "t": "世界卫生组织星期三（10月7日）说，已要求俄罗斯提供更多信息，说明一名西伯利亚鼠疫研究所工作人员的死因，并称透明度对于清晰了解潜", "b": "）说，已要求俄罗斯提供更多信息，说明一名西伯利亚鼠疫研究所工作人员的死因，并称透明度对于清晰了解潜在健康风险至关重要。\n俄罗斯当局称，这名28岁的实验室工作人员于10月2日死于病因尚未确定的肺炎。此案引发国际关注，起初有约200人被隔离。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【2】"}, {"n": 5, "t": "奔驰3季度在中国市场继续大幅下行，其他市场则较稳定，这也是为什么德国最近准备和中国搞贸易战，刚正面的背景原因。其汽车业为主的利益", "b": "行，其他市场则较稳定，这也是为什么德国最近准备和中国搞贸易战，刚正面的背景原因。其汽车业为主的利益集团之前一直是德国对华鹰派的“刹车片”，现在华业务赚的越来越少，其游说政治精英缓和政策的动力减弱了，昔日的顾客突然变成了竞争对手，所以政治精英近期行动阻力明显下降了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【5】"}, {"n": 13, "t": "沙特阿拉伯与也门胡塞武装的冲突持续升级。沙特民航总局星期三（10月7日）发表声明说，沙特两座机场日前遭到胡塞武装袭击，共造成三人", "b": "持续升级。沙特民航总局星期三（10月7日）发表声明说，沙特两座机场日前遭到胡塞武装袭击，共造成三人死亡，另有36人受伤。\n声明说，位于沙特西南部的艾卜哈国际机场（Abha）遭袭造成两名女子死亡，分别来自摩洛哥和阿尔及利亚，另造成28人受伤。位于首都利雅得的哈立德国王国际机场（King Khalid）遭袭造成一名苏丹人死亡，另有八人受伤。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【13】"}, {"n": 14, "t": "国际移民组织说，胡塞武装与也门政府军之间重新爆发的战斗引发的危机令人担忧。9月中旬，流离失所人数为7万6000人，而星期三这一数", "b": "政府军之间重新爆发的战斗引发的危机令人担忧。9月中旬，流离失所人数为7万6000人，而星期三这一数字已激增至20多万人，其中几乎所有人都是自9月初战事爆发以来逃离家园的。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【14】"}, {"n": 15, "t": "国际能源署（IEA）周三发表声明说，IEA成员国政府同意加快落实今年3月宣布的石油储备释放计划。若此前承诺但尚未释放的储备全部投", "b": "明说，IEA成员国政府同意加快落实今年3月宣布的石油储备释放计划。若此前承诺但尚未释放的储备全部投放市场，预计还可再释放约1亿桶石油。\n声明指出，针对当前全球柴油市场供应紧张的情况，成员国同意在条件允许的情况下优 动建立赛场禁入名单制度，加强现\n场秩序维护。对于涉及队伍管理、参赛安排、运动员使用、教练组排阵等各类不实信息，协会\n将配合有关部门依法依规处置。\n中国乒乓球队的每一份荣耀，都凝结着一代代运动员、教练员的拼搬与汗水，也离不开广\n大球迷多年来的关心与支持。赛场内外的每一声加油、每一份关注，都是国球的一部分。我们\n愿与广大球迷、媒体朋友、赛事组织者及社会各界一道，共同建设理性、文明、包容的乒乓文\n化，让热爱有温度，让表达有尺度，让赛场有秩序。\n中国乒乓球协会\n2026年10月7日", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【3】"}, {"n": 18, "t": "韩国政府官员星期三（10月7日）说，韩国将收紧对优秀运动员的兵役豁免。此前，韩国足球运动员因庆祝凭借亚运会金牌获得兵役豁免而引发", "b": "）说，韩国将收紧对优秀运动员的兵役豁免。此前，韩国足球运动员因庆祝凭借亚运会金牌获得兵役豁免而引发舆论反弹。\n韩国国家足球队上周夺得亚运会冠军后，球队队长李期奕受到批评。他在赛后采访中兴奋地说：“我不用去当兵了。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【18】"}]}}, {"date": "20261009", "label": "10月9日", "week": "周五", "id": "196020", "title": "讨论最多的竟然是这个媒体真豁得出去", "cats": {"econ": [{"n": 2, "t": "记者今天（9日）从财政部了解到，财政部近日安排使用地方政府债务结存限额5500亿元，用于提高县区一般公共预算保障能力和支持地方扩", "b": "财政部近日安排使用地方政府债务结存限额5500亿元，用于提高县区一般公共预算保障能力和支持地方扩大有效投资。下达地方的5500亿元地方政府债务结存限额中，一般债务结存限额3000亿元，全部分配县区使用，专门用于提高县区一般公共预算保障能力，支持地方更好发展；专项债务结存限额2500亿元，分配给今年第四季度有实际项目资金需求的地区，向经济大省倾斜，支持有关地区优先保障在建项目资金需求，新建项目聚焦“六张网”建设等重点领域，有效发挥政府投资带动作用。财政部将指导督促各地更好衔接项目储备和债券发行，加快发行节奏，畅通拨付链条，尽快形成实物工作量，促进政策早落地、早见效。 （央视新闻）", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196020#:~:text=【2】"}, {"n": 5, "t": "花旗证券于一份中国宏观展望研报中指出，中国经济在多重逆风因素下，2027年挑战加剧，GDP增速恐怕不得不为“保4%”而战；随着经", "b": "中指出，中国经济在多重逆风因素下，2027年挑战加剧，GDP增速恐怕不得不为“保4%”而战；随着经济增速下行、失业率走高、财政缺口扩大、通缩再度抬头，类似“9.24”式的政策转向可能已临近，在2027年不可避免。\n花旗发表于10月7日的上述研报中提到，中国经济的逆风因素包括：出口引擎放缓、房地产拖累加深、长期偏弱的市场信心引发加速去杠杆。该行预测，中国实际GDP增速将于2026年录得4.6%，并于2027年进一步下滑至4.1%。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196020#:~:text=【5】"}, {"n": 10, "t": "中信证券：到2027年春天，连续六年的房价下跌周期或将正式结束", "b": "© 08:59:38\n【中信证券: 到2027年春天 连续六年的房价下\n跌周期或将正式结束】中信证券预计2027年\n初，由于新的预售模式下按揭贷款回款时间点不\n同，且后续可供开发推售的项目或将明显下降，\n届时新房供给下行对市场的影响将会充分表现出\n来。中信证券表示，有理由相信，到2027年春\n天，连续六年的房价下跌周期或将正式结束。\neer i. +", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196020#:~:text=【10】"}], "soc": [{"n": 1, "t": "得奖理由为：表彰“她大胆而富有创造力的文学创作。这些作品以一种充满玩味的方式与古典传统展开对话，为当代文学创造 p?name=xilei&id=196039#:~:text=【28】"}, {"n": 28, "t": "祝佳音 · 别说刹车踏板是在行车过程中为了刹车而踩断的，哪怕就是有人专门奔着为了踩断它而成功把它踩断了（只要没借助工具），我都觉", "b": "别说刹车踏板是在行车过程中为了刹车而踩断的，哪怕就是有人专门奔着为了踩断它而成功把它踩断了（只要没借助工具），我都觉得是不可接受的。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【28】"}], "intl": [{"n": 1, "t": "挪威诺贝尔委员会10月9日宣布，将2026年诺贝尔和平奖颁发给联合国前人权事务高级专员、人权律师纳瓦尼特姆・皮莱（Navanet", "b": "将2026年诺贝尔和平奖颁发给联合国前人权事务高级专员、人权律师纳瓦尼特姆・皮莱（Navanethem “Navi” Pillay），以表彰她“为促进和平和国际法所作出的努力”。\n“当前，战争和冲突数量不断增加，国际法官和国际法机构遭受政治攻击，诺贝尔委员会希望借此提醒人们，以非武力、非暴力方式解决冲突的能力取决于国际法治。”诺贝尔委员会在一份声明中说。\n声明还说，“一个能够追究战争罪犯责任、让遭受侵害的受害者得到公正对待的国际法律体系，是实现世界和平的先决条件。”\n诺贝尔委员会指出，皮莱追究国家和国家领导人的责任，以为暴力和冲突的受害者带来希望，并在其漫长的职业生涯中始终展现出坚定的道德准则。\n【纳维・皮莱获2026年诺贝尔和平奖 回应时调侃特朗普】挪威诺贝尔委员会宣布，联合国前人权事务高级专员纳维・皮莱成为本年度诺贝尔和平奖得主。面对现场祝贺的掌声，这位南非籍国际法学者以一句玩笑作答：“谢谢！如果你们再鼓得响一些，也许我会把这个奖和特朗普分享。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【1】"}, {"n": 7, "t": "可实际数据呢？中国这边Pro系列首销三天比上代首周还高12%，14天破200万，周份额33%拿第一；印度前三天同比+19%。\n\r", "b": "列首销三天比上代首周还高12%，14天破200万，周份额33%拿第一；印度前三天同比+19%。\n\n但全球看，美国、日本、韩国初期需求都偏疲软，苹果对后市也偏保守，整体出货量预计下滑。据《日经亚洲》报道，苹果已通知供应商，把10月iPhone 18 Pro和Pro Max零部件订单砍了15%到20%。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【7】"}, {"n": 13, "t": "曾在国际刑事法院（ICC）担任法官的南非人权律师皮莱获得诺贝尔和平奖后，美国宣布对国际刑事法院实施新的制裁措施，禁止企业与它进行", "b": "法官的南非人权律师皮莱获得诺贝尔和平奖后，美国宣布对国际刑事法院实施新的制裁措施，禁止企业与它进行交易。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【13】"}, {"n": 14, "t": "“我们，加拿大、丹麦、德国、法国、意大利、日本、荷兰和英国签署《国际刑事法院罗马规约》的缔约国，重申我们对国际刑事法院的独立性、", "b": "国、意大利、日本、荷兰和英国签署《国际刑事法院罗马规约》的缔约国，重申我们对国际刑事法院的独立性、公正性和廉洁性的持续和坚定不移的支持。\n\n作为国际刑事法院的坚定支持者，我们对美国宣布将对法院实施制裁感到遗憾，并强烈反对。\n\n我们赞赏法院为准备这些措施所做的工作，以便法院能够继续履行其在《罗马规约》下的职责，我们强调我们将坚定不移地支持法院这样做。\n\n然而，如果这些制裁措施得以实施，将会对法院的工作、其敬业的工作人员及其家人产生重大影响。他们每天都在努力将那些被控犯有最严重国际罪行的人绳之以法，并为受害者提供支持。”\n\n我们仍然团结一致支持国际刑事法院，并致力于与非缔约国开展建设性和包容性的对话，为2026年12月举行的缔约国大会做准备。我们将继续共同努力，支持法院的重要工作，维护以规则为基础的国际体系，并推进问责制。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【14】"}, {"n": 15, "t": "乌克兰总统泽连斯基批评美国一方面寻求与俄罗斯建立经济联系，另一方面又试图调停这场已持续四年多的战争。他敦促美国同意乌方请求，扩大", "b": "面寻求与俄罗斯建立经济联系，另一方面又试图调停这场已持续四年多的战争。他敦促美国同意乌方请求，扩大乌克兰对SpaceX“星链”卫星服务的使用权限，以助乌军锁定俄弹道导弹发射平台。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【15】"}, {"n": 16, "t": "俄外交部确认：已通话，会加强合作，解决乌克兰、伊朗问题", "b": "作，解决乌克兰、伊朗问题\n乌克兰总统向媒体发表评论：Trump很“软弱”，与乌谈判都是“烟雾弹”，实际做的在帮助俄\nTrump在白宫：你们都听说了吧，我和俄达成了石油协议，是个重要协议，大量的油就要进美国了，感谢俄总统\n记者：乌克兰总统说，这只会延长战争\nTrump：全世界都需要油，我们很高兴得到这些油\n记者：Zelensky说你这样做是“软弱”\nTrump：谁说的？\n记者：Zelensky\nTrump：OK", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【16】"}, {"n": 18, "t": "美国中期选举临近，共和党选情不妙，美国总统特朗普10月9日请好友、拳王泰森为自己站台。\n\r\n泰森当天在白宫记者会上对记者说，他认", "b": "妙，美国总统特朗普10月9日请好友、拳王泰森为自己站台。\n\n泰森当天在白宫记者会上对记者说，他认为特朗普会赢得中期选举。\n\n当天晚些时候，泰森还参加了特朗普在纽约的竞选集会。泰森在台上说：“我很高兴能与我的总统，特朗普总统，一同站在这里。如果没有像特朗普这样的总统，我绝无可能站在这里。谢谢！”\n\n特朗普和泰森的友谊可以追溯到很多年前。\n\n据报道，一部即将上映的关于泰森生平的Netflix纪录片的摄制组最近前往白宫，与特朗普谈论了泰森的职业生涯以及他们之间的友谊。\n\n他们的关系可以追溯到上世纪80年代。作为一名商人，特朗普曾担任泰森的商业顾问，并在泰森1992年因强奸罪被定罪前后都为他辩护。1995年，泰森出狱后的首场比赛，特朗普也与其他几位名人一起出现在赛场上。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【18】"}, {"n": 19, "t": "印度青年运动号召对选举官员发动大规模示威，当局在首都新德里严阵以待，不仅实施封锁，还部署数千名安保人员巡逻，并拘留数十名抗议者，", "b": "大规模示威，当局在首都新德里严阵以待，不仅实施封锁，还部署数千名安保人员巡逻，并拘留数十名抗议者，以防事态升级。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【19】"}, {"n": 20, "t": "美国人工智能巨头OpenAI宣布，挫败源自俄罗斯和伊朗的两起秘密影响力行动。这两起行动利用ChatGPT伪造记者身份并运营假智库", "b": "布，挫败源自俄罗斯和伊朗的两起秘密影响力行动。这两起行动利用ChatGPT伪造记者身份并运营假智库，大规模发布反乌克兰及与地缘政治冲突相关的宣传内容。涉事的ChatGPT账号已被封禁。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【20】"}, {"n": 22, "t": "这八个月可没白待。法国的阿德诺成了第一个在太空行走的法国女人，前前后后出舱三回，老梅尔更厉害，出舱四次。他们还在天上亲眼看着阿尔", "b": "成了第一个在太空行走的法国女人，前前后后出舱三回，老梅尔更厉害，出舱四次。他们还在天上亲眼看着阿尔忒弥斯二号绕月飞行，给美国过了二百五十岁生日，梅尔甚至掏出短笛，跟着波士顿通俗乐团办了场太空音乐会。上个月这帮人还在空间站搞舞会、戴厨师帽做菜，玩得挺欢。\n最难的还是回家。接替他们的人因为飞船维修晚了三周，害得这几位回家的日子也跟着拖。落地前梅尔说心里五味杂陈，会想念从太空俯瞰地球的景色。不过她说最想干的事特别接地气，吹吹风、痛痛快快洗个澡，阿德诺则惦记着扎进水里玩水上运动。在失重环境里待了八个月，人间这点寻常快乐，反倒成了 源社会保障部新闻发言人、副部长李忠：截至9月底，我国基本养老、失业、工伤保险的参保规模位居全球首位，下一", "b": "保障部新闻发言人、副部长李忠：截至9月底，我国基本养老、失业、工伤保险的参保规模位居全球首位，下一步我们将坚持应保尽保，通过政策优化、“数据找人”等措施，“数据找人”很重要，就现在还有一些人没有参保，但有些人到底在哪，我们还是要通过各种各样的方式把这些人找到，然后主动的动员参保。\n【人社部：尽可能让灵活就业人员参加职工养老保险】截至今年9月底，中国基本养老、失业、工伤保险的参保人数分别达到10.79亿人、2.51亿人、3.27亿人。力争“十五五”时期基本养老保险参保率稳定在95%以上，失业保险参保达到2.55亿人，工伤保险参保达到3.45亿人；鼓励支持灵活就业人员、农民工、新就业形态人员参加职工养老保险。\n在10月10日国新办举行的新闻发布会上，人力资源社会保障部新闻发言人、副部长李忠提出上述目标。\n当前超两亿灵活就业人员是实现“全民参保”的最后一公里。他们可以自主选择参加社保的类型和缴费档次，若加入职工保险，由于没有单位为其缴费，须独自承担“个人+单位”两部分的费用负担。以北京为例，2025年医保月缴费584.92元，养老保险缴费基数上限和下限分别为35811元和7162元，按照养老保险20%的费率计算，一名灵活就业人员每月为这两险支出至少2017元。这已逼近北京市当年2540元的最低月工资标准。\n面对窘迫的当期收入和生存压力，不少灵活就业人员更倾向参加居民基本保险，且普遍集中在最低缴费档次。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【1】"}, {"n": 4, "t": "浙江宣传：有些企业在产品质量受到公开质疑时，不是认真回应消费者的核心困惑，网上的许多帖子反而消失不见，令人疑窦丛生。", "b": "有些企业在产品质量受到公开\n质疑时，不是认真回应消费者的核心\n困惑，网上的许多帖子反而消失不\nWh, CARES.\n浙江宣传 束\n与情应对的六个误区", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【4】"}, {"n": 7, "t": "人口老龄化加速、出生人口减少、2020年以后城镇化进程放缓，都对房地产长期走势不利。", "b": "2020年以后城镇化进程放缓，都对房地产长期走势不利。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【7】"}, {"n": 8, "t": "#全国各地最低工资标准公布# 全国各省、自治区、直辖市最低工资标准情况", "b": "> HOR: EPO ARO                                                                                            jee\n全国各省、自治区、直辖市最低工资标准情况 (截至2026年10月1日)\nAER 2026-10-08    Ru: sneRA    打印本页\n全国各省、自治区、直辖市最低工资标准情况\n单位: 元\nae         月最低工资标准             小时最低工资标准\n第-峭 | 第            第=村                     第- | &:            第三档 | 第四档\n北京          2540                                                   207\nRe          2510                                                   266\n河北 | 2380 | 2230 | 2080                        24           22           20\nwe          2350 | 2250 | 2150                       253 | 24", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【8】"}, {"n": 10, "t": "上海证券报的记者前几天做了个实测，挑了6家国有大行、4家股份制银行、4家城商行、2家农商行，一共16家，在工作日下午和双休日上午", "b": "测，挑了6家国有大行、4家股份制银行、4家城商行、2家农商行，一共16家，在工作日下午和双休日上午两个时段分别拨客服电话，问的是大额存单的额度门槛和期限、借记卡境外取现手续费这类常规业务，就想看看找个真人到底有多难。\n\n\n\n结果16家只有4家给人工留了直达入口，其余12家都得先跟智能语音兜好多圈子。\n\n\n\n智能客服省钱是真省钱，随便一家省级分行都能至少省一整层楼的人力，指望任何人退回去都不现实，趋势没什么好讨论的，关键是以后怎么办。\n\n\n\n上海证券报的测试是经过设计的，16家银行里，北京银行、江苏银行、渝农商行按一下键就能到真人，其中一家还主要是接投诉的。剩下12家，菜单上你就听不到转人工这三个字。\n\n\n\n六家国有大行全部用上了智能客服，也没留人工直入的口子。建行在接入人工的路上，还得多按一次键确认继续等待。\n\n\n\n邮储银行更曲折，记者说转人工，系统回一句我没明白您的意思，记者再说一遍，系统回我没听到您的声音，来回三次，屏幕上才跳出请选择需要的人工服务类型，从拨号到真人接听，2分41秒。\n\n\n\n股份制银行里，浦发会提示目前人工服务繁忙，建议通过手机银行在线咨询，招行会提示智能小招也可以为您办理。\n\n\n\n沪农商行的路径是，先说业务类型，转人工，AI追问请描述得具体一些，重复一遍，AI坚持请说出您要的业务，三轮之后，选语言类型，再选人工类型，等你听到人声，2分28秒过去了。\n\n\n\n真进到队列里等，其实不算慢。工作日多数银行10秒内就接通，慢一点的一分钟。双休日差一些，普遍半分钟到一分钟，个别超过两分钟。真正耗时间的，是前面那几道关，等人那会儿功夫反倒是最快的环节。\n\n\n\n如果你没耐心，那正好别接人工了呗，现在AI客服的作用，一大半都是阻挡住你找到真人的。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【10】"}], "soc": [{"n": 2, "t": "中央汇金“打假”：公司不开展代客投资理财活动", "b": "中央汇爹投资有限责任公司  a ee 1 RD ee\n《\n要Ri中心                                                         \\                 ay", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【2】"}, {"n": 3, "t": "人民日报我劝你们悬崖勒马", "b": "人ka天                  iw\n【四部门联手，对“速成车”说不]#安全才是中国汽车越跑越\n稳的底气所在#汽车刹车踏板绝不应该在驾驶中断裂# 工\n信部等四部门10日公开发布关于进一步加强汽车产品创新\n设计和研发测试验证有关管理工作的通知 (征求意见稿) 。\n汽车产品创新设计技术指南围绕虚拟操纵件、门把手、新\n型人机交互系统、大角度座椅等方面提出具体测试验证要\n求。\n业内普遍认为，四部门发布的新规是对“速成车\"说\n不!\n这几天，奥论广泛关注尊界V800刹车踏板支架断裂事\n件，讨论的焦点就是汽车尤其是“速成” 新能源车的安全问\n题。尽管事件有待权威的调查结论，但有一点毋庸置疑:\n一辆汽车的刹车踏板，绝不应该在驾驶中出现 “断裂”!\n“稳” 是一种更持久的“快”。近年来，我国汽车产业尤\n是新能源汽车产业实现了跨越式发展，来之不易的产业\n生态、社会信任、消费者口碑，需要产业各方共同维护。\n创新的脚步不会因为精益求精而变慢，安全才是中国汽车\n越跑越稳的底气所在。\nSMV 目四部门联手，对“速成车”说不!\n[NE\nEee\nieee", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【3】"}, {"n": 9, "t": "四川提高城乡居民基础养老金最低标准，每人每月提高30元，提高后达到每人每月223元，同时对年满80周岁及以上领待人员加发基础养老", "b": "全 页政府信息公开> 改第法规>行政损性文件\nae                          SS At on 58\n下                                区\nno                                   ‘ratte it\nR 日梅艳芳国际歌迷会公布一则沉痛消息：自今年7月起，发现安放于大屿山宝莲禅寺海会", "b": "梅艳芳经典黑白造型照：蓬松短卷发、黑色外套配深色胸衣，佩戴华丽宝石项链，神情端庄。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【11】"}, {"n": 16, "t": "美国中央司令部在社媒发布消息称：“一架美国军用战斗机使用精确制导武器击中悬挂巴拿马国旗的‘海洋莫利卡’号（M/V Ocean M", "b": "：“一架美国军用战斗机使用精确制导武器击中悬挂巴拿马国旗的‘海洋莫利卡’号（M/V Ocean Molica，又名‘阿里卡太阳’号），使船只动力系统完全瘫痪，船员没有受伤。”\n中央司令部指出，这艘货船在离开伊朗港口后，试图穿越该地区水域。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【16】"}, {"n": 17, "t": "沙特阿拉伯民航官员指出，利雅得国际机场遭遇袭击，造成至少12人死亡，309人受伤，其中一些人伤势严重。死者中有四名沙特公民，以及", "b": "国际机场遭遇袭击，造成至少12人死亡，309人受伤，其中一些人伤势严重。死者中有四名沙特公民，以及两名孟加拉国人，其余六人分别来自美国、埃及、约旦、叙利亚、巴勒斯坦和苏丹。\n美国总统特朗普当天在白宫外接受记者采访时，被问及华盛顿是否计划加入沙特对胡塞武装的空袭。他回应说：“我们可能会。我们会考虑。我们刚刚得知最近发生的袭击事件，所以我们会尽快做出决定。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【17】"}, {"n": 18, "t": "美国总统特朗普要求乌克兰总统泽连斯基停止对俄罗斯炼油厂的袭击，并暗示对方应该考虑辞去乌克兰总统职务。此举加剧两国围绕美国允许俄罗", "b": "连斯基停止对俄罗斯炼油厂的袭击，并暗示对方应该考虑辞去乌克兰总统职务。此举加剧两国围绕美国允许俄罗斯提供柴油供应引发的争端。\n彭博社报道，特朗普星期六（10月10日）在白宫对泽连斯基进行猛烈抨击，称乌克兰需要一名“能够与俄罗斯达成协议”的领导人。“我认为乌克兰是时候换个总统了。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【18】"}, {"n": 19, "t": "美国宾夕法尼亚州伊利市发生枪击案，一名45岁男子枪杀八人，包括一名怀孕八个月的孕妇和两名儿童，男子随后疑似开枪自杀。", "b": "案，一名45岁男子枪杀八人，包括一名怀孕八个月的孕妇和两名儿童，男子随后疑似开枪自杀。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【19】"}, {"n": 20, "t": "美国移民与海关执法局（ICE）人员在纽约市开枪打伤一名多米尼加籍男子，引发数百人走上街头抗议。这起事件也导致纽约市长马姆达尼与特", "b": "人员在纽约市开枪打伤一名多米尼加籍男子，引发数百人走上街头抗议。这起事件也导致纽约市长马姆达尼与特朗普政府公开交锋，使联邦移民执法与地方自治之间的矛盾进一步升级。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【20】"}, {"n": 21, "t": "印度“蟑螂人民党”号召对选举官员发动大规模示威，当局封锁首都新德里严阵以待，部署6万名军警人员巡逻，并拘留蟑螂人民党创始人迪普克", "b": "员发动大规模示威，当局封锁首都新德里严阵以待，部署6万名军警人员巡逻，并拘留蟑螂人民党创始人迪普克和抗议者，以防事态升级。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【21】"}, {"n": 22, "t": "长期从事对朝人道主义援助的国际人士指出，朝鲜年轻一代的生活方式与消费观念正悄然改变，国际品牌Lululemon的瑜伽服开始受到追", "b": "人士指出，朝鲜年轻一代的生活方式与消费观念正悄然改变，国际品牌Lululemon的瑜伽服开始受到追捧，平壤饲养宠物的家庭也多了起来。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【22】"}, {"n": 25, "t": "特朗普政府指人工智能（AI）公司Anthropic的AI代理“欺诈性”使用联邦政府系统，强制所有AI业者须通报安全事故，并采取补", "b": "司Anthropic的AI代理“欺诈性”使用联邦政府系统，强制所有AI业者须通报安全事故，并采取补救措施。\n最新事件显示，AI安全事故频频发生，或已迫使白宫开始偏离此前仅要求AI业者“自我监管”的原则。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【25】"}, {"n": 26, "t": "英国前首相鲍里斯・约翰逊发文抨击特朗普解除对俄罗斯制裁：令人作呕！", "b": "命 Boris Johnson @                                       Go\n@BorisJohnson\nSY QBS\nItis sickening that the USA is now lifting sanctions on Russian fuel, and\ntransparently ridiculous to blame Ukraine for the spike in prices that\nobviously began with the closure of the Strait of Hormuz. Putin is\nmurdering innocent Ukrainian civilians every day. The Ukrainians are\nfighting for their lives. And yet the White House is apparently determined\nto force American drivers to bankroll Putin’s slaughter. It won’t work and |\ndoubt it will make much difference to the price of fuel.\nIf we want Russian oil and gas", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【26】"}, {"n": 27, "t": "第一位来自红圈所的白宫发言人：川宝的新任白宫发言人，凯蒂・扎卡里亚，2011年至2013年，在北京中伦律师事务所（Zhong L", "b": "特朗普戴红色 MAGA 棒球帽、深蓝西装白衬衫，与金发年轻女性（新任白宫发言人凯蒂·扎卡里亚，黑色吊带裙）合影，两人竖拇指微笑。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【27】"}, {"n": 28, "t": "继贾樟柯看红果短剧后，文艺界又一悲报，诺贝尔文学奖获得者安妮・卡森看完了《牛来》", "b": "卡森爱看肥皂剧，我们经常交流各自最近摄取\n的内容，比如前段时间诺兰的电影《奥德赛》\nq。而因为我们八个人里，有两个中国人和一\n个美国亚裔，我们仁又是比较常出现的，所以\n卡森被我们灌输了很多中国的大小事，我们给\n她讲了仲树，她还看完了《和牛来》” ，对我们\n中国是相当了解呢。\n《巴黎评论》 颁奖典礼后台，卡森和亲友的合影，左起是本卫肖和\n骄阳, 右侧是挚友与丈夫 (骄阳供图)", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【28】"}, {"n": 29, "t": "载至2026年二季度，美国最富有的0.1%家庭掌握全国家庭总财富的15%，创下1989年以来历史新高。回顾历史，互联网泡沫、次贷", "b": "有的0.1%家庭掌握全国家庭总财富的15%，创下1989年以来历史新高。回顾历史，互联网泡沫、次贷危机时期，这一占比冲高后会随危机短暂回落，但每一轮市场修复，顶层群体的财富占比都会突破前高。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【29】"}, {"n": 35, "t": 8】"}, {"n": 20, "t": "新调查报告显示，菲律宾人去年因网络诈骗蒙受高达1218亿比索（约折合19.41亿美元）的损失，超过80%的成年人都曾遇到过骗子，", "b": "网络诈骗蒙受高达1218亿比索（约折合19.41亿美元）的损失，超过80%的成年人都曾遇到过骗子，而被骗者每人平均损失1万零427比索。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【20】"}], "tech": [{"n": 5, "t": "王兴兴：犯的最大错误是还不够相信AI", "b": "10月12日，宇树科技董事长、总经理兼首席技术官王兴兴在上海第二十六届中国\n国际工业博览会开幕式上表示，自己对Al的信心正逐年增强“过去十几年我犯的\n最大的错误，就是对Al (以前) 相信 (得) 还不太够。“”\n他认为，目前机器人在工厂大规模应用仍面临泛化能力、效率等问题，但未来几年\n有望得到解决。随着AI模型能力快速提升，具身智能的技术临界点可能比预期来得\n更快，快的话甚至可能在一两年内出现\n此外，王兴兴还表示，目前国内外多家机器人企业已在工厂开展试点，但距离大规\n模应用仍需解决泛化能力和效率问题。他认为，这些问题未来几年有望得到解决\n从不同场景的应用进度来看，商业服务场景的应用进展可能比工业场景更快，而居\n家场景的推进可能相对靠后。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【5】"}, {"n": 19, "t": "使用#人工智能#（#AI#）文本检测工具可以识别学生是否借助AI完成作业，然而研究显示，这类工具误判率高，美国越来越多高校，包括", "b": "本检测工具可以识别学生是否借助AI完成作业，然而研究显示，这类工具误判率高，美国越来越多高校，包括耶鲁大学和康奈尔大学，已经禁止或不鼓励教师依赖AI检测工具作为判断学生是否作弊的主要依据。为此大学教授们不得不另出奇招应对作弊，以及重新制定评估模式。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【19】"}, {"n": 21, "t": "Google 面试开始允许用 AI 了", "b": "Shreyas Naphad @                             Gi ae\n@NaphadShreyas\nO 翻译自英语 显示原文 O\n告别 LeetCode? 谷歌刚刚更新了其面试流程。Al 现在已成为其中一部分。\n他们引入了一个名为 Code Comprehension 的新轮次。\n这一轮次背后的想法是将候选人置于一个 200-500 行的代码库中，并提供\nGemini 供使用。\n这一轮次评估:                               从\n- 你能否阅读别人的代码\n-在使用 Al 之前，你能否独立调试\n- 你能否发现 Gemini 出错的情况\n评价此翻译: 只 名\nGoogle replaced one traditional coding round with a Code\nComprehension round in its May 2026 pilot. [NS CETe els\nsolving a LeetCode-style algorithm from scratch, you\nreceive a 200-500 line unfamiliar codebase in a CoderPad\nenvironment, and you have 60 minutes to read it, find bugs,\ndiscus", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【21】"}, {"n": 25, "t": "5)JohnCarter@", "b": "5) John Carter @\n@martianwyrdlord\nFA Grok 翻译自英语\n另一个角度是，狗在两万年前就无意中\n发现了对它们来说相当于人工超级智能\n的东西。奇点对狗来说早已发生。它们\n生活在一个它们无法理解的世界中，被\n它们完全视为理所当然的奇迹奇观所包\n围，它们的每一个需求都由那些它们根\n本无法领会其思想的实体来照料。\n结果是，现在地球上有大约十亿只狗。\n其中大多数都相当快乐。几乎没有哪只\n狗需要工作。这对它们来说效果相当\n好。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【25】"}], "cult": [{"n": 7, "t": "中网用了20届的时光，终于等来的第一位来自中国的女单决赛选手，也迎来了第一位本土女单冠军。", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【7】"}]}}, {"date": "20261013", "label": "10月13日", "week": "周二", "id": "196103", "title": "人的消费行为主要取决于对未来长期收入的预期", "cats": {"econ": [{"n": 1, "t": "罗伯特・E・霍尔，其主要理论就是：人的消费行为主要取决于对未来长期收入的预期。", "b": "是：人的消费行为主要取决于对未来长期收入的预期。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196103#:~:text=【1】"}], "soc": [{"n": 2, "t": "懂车帝回应来了：动态与静态加载不一样", "b": "不一样 \n中国汽研回应尊界V800检测报告", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196103#:~:text=【2】"}, {"n": 4, "t": "我比较费解的是，为什么尊界这次刹车踏板检测，没有去找更权威更有口碑的中汽研。", "b": "刹车踏板检测，没有去找更权威更有口碑的中汽研。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196103#:~:text=【4】"}, {"n": 5, "t": "谈起人生的这一重要变化，他难掩兴奋：“24年前，确实没想过会有今天。”从2002年确诊慢粒白血病，到今年10月，陆勇已经吃下3.", "b": "兴奋：“24年前，确实没想过会有今天。”从2002年确诊慢粒白血病，到今年10月，陆勇已经吃下3.5万多片药，超过3.5公斤\n2002年，陆勇确诊慢粒白血病。这种病是“血癌”的一种，在靶向药物问世之前是不治之症，绝大多数患者的存活期只有3年-5年。如今，这种病可像慢性病一样治疗，甚至超过一半病人可以成功停药。今年10月份，苏州大学附属第一医院血液科主任医师陈苏宁对陆勇的情况进行评估，认为可以尝试停药，先减半服药三个月，再做融合基因检查，结果理想的话开始停药。\n\n陆勇说：“停药以后，我的皮肤不会像现在这么苍白，水肿几乎不会有了，肌肉也不像现在容易疲劳，也不会缺钙了。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196103#:~:text=【5】"}], "intl": [], "tech": [{"n": 3, "t": "尊界公布制动踏板第三方测试结果，应该兼听。另外，我问了豆包、DeepSeek、元宝同一个问题：如何评价这个测评？它是否足以推翻懂", "b": "应该兼听。另外，我问了豆包、DeepSeek、元宝同一个问题：如何评价这个测评？它是否足以推翻懂车帝的测评？\n\n三个大模型的回答高度一致，我都贴在下边了：", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196103#:~:text=【3】"}, {"n": 6, "t": "A股又现天价离婚，神农集团实控人前妻分走近24亿元股票", "b": "证券代码: 605296      证券简称;神农集团     公告编号:2026-064\n云南神农农业产业集团股份有限公司\n关于控股股东、实际控制人涉及诉讼的进展公告\n本公司董事会及全体董事保证本公告内容不存在任何虚假记载、误导性陈述或\n者重大遗漏，并对其内容的真实性、准确性和完整性承担法律责任。\n重要内容提示:\n案件所处的诉讼阶段: 收到民事调解书。\n控股股东、实际控制人所处的当事人地位: 被告。\n何祖训先生与罗婉瑜女士签署《一致行动协议》，达成一致行动人关系。\n涉案的金额，78, 304, 995股股份。\n是否会对上市公司产生影响，诉讼仅涉及控股股东、实际控制人个人对\nAHIR ELA, R255) EPS ORES", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196103#:~:text=【6】"}], "cult": []}}, {"date": "20261014", "label": "10月14日", "week": "周三", "id": "196131", "title": "好日子来了", "cats": {"econ": [{"n": 2, "t": "国家税务总局：单位欠缴社保，最高罚3倍，11月1日起施行。", "b": "XK QO 搜你想看的  QF …\n九派快讯               、\nQn     xz\n国家税务总局: 单位欠缴社保，\n最高罚3倍，11月1日起施行\n69 听全文.约3分钟         77人听过 >\n【来源: 成都日报】\n近日\n国家税务总局发布\n《全国税务行政处罚裁量基准\n(2026年版) 》\n自2026年11月1日起施行\n@ 国家税务总局                     |\nma\n政策法规库\n本次政策的核心变化为\n社会保险费正式纳入\n全国统一税务行政处罚裁量体系\n该事项位列裁量基准第50项\n归类为违反税 〈费) 款征收管理类\n逾期仍未缴纳社保的\n处罚裁量划分为3档", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【2】"}, {"n": 3, "t": "10月11日，《人民日报》发表评论，批评台湾“科技产业独大，传统产业持续衰败”，称其形成“一业兴、百业衰”的“畸形格局”，并指“", "b": "评论，批评台湾“科技产业独大，传统产业持续衰败”，称其形成“一业兴、百业衰”的“畸形格局”，并指“普通民众无缘发展红利”。\n台湾领导人赖先生在10月10日的讲话中，也提出衡量社会进步不能只看产值与出口，还要看劳动待遇是否提高、家庭负担是否减轻，以及年轻人是否相信努力能创造更好的未来。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【3】"}], "soc": [{"n": 1, "t": "近年来以学者身份活跃的十八届中央委员、重庆原市长黄奇帆，退休8年后官宣落马。10月13日，中央纪委国家监委网站通报该消息。", "b": "央委员、重庆原市长黄奇帆，退休8年后官宣落马。10月13日，中央纪委国家监委网站通报该消息。\n坊间一度有“政坛不倒翁”之说的黄奇帆，在一个月前还有公开出席活动。据厦门发改委网站，9月8日，第八届“丝路海运”国际合作论坛在福建厦门开幕，重庆市政府原市长黄奇帆作主旨演讲。\n另据财新获悉，宁波银行杭州分行计划于10月26日举办的一场论坛上，黄奇帆原作为主讲嘉宾发表2小时主旨演讲，但在社交媒体上即流传该活动“因故取消”的消息。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【1】"}, {"n": 7, "t": "据亚洲周刊报道，获刑不到一个月，南京博物院原院长徐湖平因肺癌去世", "b": "南京博物院原院长徐湖平因肺总去世\n亚周在线\n沸沸扬扬的南京博物院文物事件主角、南京博物\n院原院长徐湖平在十月十二日下午六时许病逝于\n南京一家监狱医院。\n据了解，徐湖平患有肺癌，已是晚期。\n徐湖平，一九四五年生人，祖籍湖南省平江县。\n曾任江苏省第九届政协委员、南京博物院院长。\n徐湖平一九六三年中学毕业后入伍，一九六九年\n退役回到南京。一九七三年进入南京博物院，一\n九八五年八月任南京博物院副院长，二零零一年\n一月任南京博物院院长，二零零六年一月任南京\n博物院书记、江宁织造博物馆馆长。二零零八\n年，徐湖平退休。\n二零二五年，内地媒体澎涯新闻报道中国著名收\n藏家庞莱臣后裔庞淑令起诉南京博物院要求查看\n捐赠文物的事件，引发与情关注。二零二五年十\n二月，南京博物院退休员工郭礼典实名举报徐湖\n平大规模盗窃、走私文物的视频引发关注。\n南京博物院及徐湖平的问题引发高度重视。二零\n二六年二月，江苏省通报南京博物院受赠文物管\n理问题，对徐湖平其立案审查。同年九月，其因\n受贿罪被判处有期徒刑三年，并处罚金二十万\n元，此前已被给予开除党籍处分、取消相关待\n遇。\n继南京博物院事件后，温州收藏家单宾后人单一\n心起诉上海博物馆，要求其归还数干件文物。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【7】"}, {"n": 14, "t": "美国康奈尔大学因2024年一起涉嫌七名男子集体性侵女学生的案件引发强烈争议，康奈尔大学校长星期二宣布，将禁止校园兄弟会在会所举办", "b": "涉嫌七名男子集体性侵女学生的案件引发强烈争议，康奈尔大学校长星期二宣布，将禁止校园兄弟会在会所举办派对和社交活动，直至本学年结束。\n诉讼曝光后，康奈尔大学因处理性侵指控的方式受到学生、教职员、校友及捐款人的猛烈批评。学生发起抗议，部分教职员酝酿对校方提出不信任动议。\n康奈尔大学2025年的一项调查显示，35%的本科女学生说，入学以来曾在遭受强迫或失去反抗能力的情况下，经历未经同意的性接触。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【14】"}, {"n": 15, "t": "天主教教宗良十四世星期二接受手术，切除右肺癌性肿瘤。梵蒂冈证实，手术顺利完成，没有出现并发症，但医生仍须进一步检查，以确定癌细胞", "b": "术，切除右肺癌性肿瘤。梵蒂冈证实，手术顺利完成，没有出现并发症，但医生仍须进一步检查，以确定癌细胞是否扩散。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【15】"}, {"n": 16, "t": "秘鲁政府计划收紧学校纪律，禁止女学生穿短裙、涂指甲油，以及男学生留长发，并限制学生使用手机，引发女权及人权组织批评，认为这些措施", "b": "女学生穿短裙、涂指甲油，以及男学生留长发，并限制学生使用手机，引发女权及人权组织批评，认为这些措施无助于遏制校园暴力，反而带有威权色彩。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【16】"}], "intl": [{"n": 4, "t": "今年上半年，全球新车销量里，油车所占份额第一次失守50%，不过整个汽车市场也萎缩了5%，买车的人变少了。", "b": "全球新车市场\n纯汽油 车份额\n首次跌破一半\n2021年为73% + 下降24个百分点\n动力类型                 份额\n纯汽油               49%\n普通混动               18%\n纯电动                17%\n柴油、插混及其他            约16%\n普通混      ER; 约16%为余项推算。\n约83%的新车仍有发动机，按100%减去17%的纯电份额推算。\nGy,\n2026年上半年\n销量 (万辆)             同比\n2,025          -10%\n727          +10%\n687         +12%\n未披露              oe\n来源: Electrek + 2026.10.05\nMobility Global / Nikkei", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【4】"}, {"n": 9, "t": "沙特能源部星期三（10月14日）发布声明说，沙特阿美位于宰赫兰（Dhahran）的一栋行政大楼星期二（13日）晚遭袭，引发局部火", "b": "）发布声明说，沙特阿美位于宰赫兰（Dhahran）的一栋行政大楼星期二（13日）晚遭袭，引发局部火患，当局已采取必要措施，事件没有造成人员伤亡。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【9】"}, {"n": 10, "t": "也门胡塞武装警告美国不要介入也门战争，否则将面临“令其痛苦的反击”。随着胡塞武装与美国盟友沙特阿拉伯之间的战斗加剧，一直不愿卷入", "b": "门战争，否则将面临“令其痛苦的反击”。随着胡塞武装与美国盟友沙特阿拉伯之间的战斗加剧，一直不愿卷入其中的华盛顿正考虑出手打击胡塞武装。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【10】"}, {"n": 11, "t": "乌克兰总统泽连斯基星期二（10月13日）说，乌克兰并未收到西方盟友关于俄罗斯向其首都发射弹道导弹的预先警告。", "b": "月13日）说，乌克兰并未收到西方盟友关于俄罗斯向其首都发射弹道导弹的预先警告。\n美国官员威胁称，如果乌克兰不停止袭击俄罗斯炼油厂，将切断对乌情报共享和武器销售。专家和官员指出，基辅在获取导弹袭击预警方面高度依赖美国情报。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【11】"}, {"n": 12, "t": "美国总统特朗普计划下月访问亚洲之际，再次提及可能与朝鲜领导人金正恩会面。然而，朝方至今未释放明确对话信号，反而高调展示包括洲际弹", "b": "之际，再次提及可能与朝鲜领导人金正恩会面。然而，朝方至今未释放明确对话信号，反而高调展示包括洲际弹道导弹、潜射弹道导弹等多款先进武器。分析认为，平壤意在展示核打击能力，强调拥核国地位，并为未来朝美谈判争取有利条件。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【12】"}, {"n": 13, "t": "随着伊朗伊斯兰革命卫队更加密集地攻击穿过霍尔木兹海峡的油轮，很多大型油轮的运营商宁可舍弃高额经济报酬，也选择掉头远离这个高风险航", "b": "地攻击穿过霍尔木兹海峡的油轮，很多大型油轮的运营商宁可舍弃高额经济报酬，也选择掉头远离这个高风险航道，让外界再次担忧波斯湾的原油出口是否可持续。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【13】"}, {"n": 17, "t": "英国前首相苏纳克星期二（10月13日）说，以美国为首的全球秩序“已经终结”，世界正进入地缘政治不确定性加剧的时期。", "b": "13日）说，以美国为首的全球秩序“已经终结”，世界正进入地缘政治不确定性加剧的时期。\n彭博社报道，苏纳克在新德里举行的彭博“新经济论坛”首日会议上说，美国总统特朗普“并非这一局面的成因，而是其体现出的症状”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【17】"}, {"n": 18, "t": "IMF星期二（10月13日）发布《全球金融稳定报告》点出，人工智能（AI）领域的投资有助弥补中东战争和整体政策环境不明朗构成的经", "b": "布《全球金融稳定报告》点出，人工智能（AI）领域的投资有助弥补中东战争和整体政策环境不明朗构成的经济冲击。但是，如今有“更多证据”显示，建立AI能力或许并不需要如此庞大的投资，潜在的经济利益也或许没有预期中大。\nIMF提醒，超大规模数据中心营运者（hyperscalers）为投资项目进行融资所发行的债券，如今已占全球投资级债券发行量的10%，比2024年高出逾10倍。如果AI领域的盈利或投资接下来趋缓，可能引发相关资产价格的调整，继而外溢到更广泛的市场，“后果可能是全球性的”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【18】"}, {"n": 19, "t": "导火索是《华尔街日报》的爆料：Guilfoyle 在 2025 年 7 月参议院确认听证会前，请求共和党捐赠人 Eric Det", "b": "Guilfoyle 在 2025 年 7 月参议院确认听证会前，请求共和党捐赠人 Eric Deters 向她的美国运通账户汇 10 万美元，帮她还信用卡。据 Deters 提供给媒体的信息，她承诺若收到钱，就做他在“特朗普世界里的 ride or die（生死之交）”，还在 Signal 上写道：“直接汇到美国运通的话，不会出现在任何地方。拜托。”Deters 拒绝了，称当时手头没有流动资金。\n这只是连串报道中的一桩：她还被指接受希腊商界大亨的奢华馈赠（包括飞巴黎的机票和豪华酒店），以及以提供接触政府高官的机会换取金钱。国务院监察长办公室正在调查。她通过律师否认以权谋私，称只是在离任前收回演讲和咨询的应收账款，且遵守了联邦礼品申报规定。\nGuilfoyle 曾是福克斯主播、特朗普长子 Donald Trump Jr. 的未婚妻、加州州长纽森的前妻――这起辞职令这段“准家人”关系画上尴尬句号。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【19】"}, {"n": 21, "t": "@®华尔街日报中文网X.com", "b": "@® 华尔街日报中文网               X.com\n@ChineseWSJ\n12]\n特朗普为何下令在航母上恢复使用蒸汽弹射器?\n一位名叫“比尔.琼斯”的水兵和特朗普的一次交谈\n让他确信，发射战机的旧式技术优于现代方法。\n官员们至今仍在应对这名神秘水兵与总统一次偶\n遇所带来的后果。而据国防官员说，他们始终没\n有找到这个人。\nFrom cn.wsj.com\n8:00 AM - 10/13/26 - 27K Views", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【21】"}, {"n": 24, "t": "泽连斯基：不要攻击我们，不要杀害我们的孩子。我们将停止攻击你们的柴油。我认为这是一个公平的交易。", "b": "害我们的孩子。我们将停止攻击你们的柴油。我认为这是一个公平的交易。 \n泽连斯基表示，乌克兰将在有或没有美国总统唐纳德・特朗普帮助的情况下赢得这场战争。\n我知道许多美国公民不支持他们的总统所做的事情，我敦促那些人继续为乌克兰祈祷，并在这一艰难时期支持我们。\n尽管美国总统选择支持普京――这个对这场战争负有责任的人――我们乌克兰人不会退缩。我们已经遭受了太多苦难，失去了太多生命，牺牲了太多，不能现在放弃。\n我们将继续为我们的自由、我们的国家以及我们的未来而战。无论有无美国的帮助，乌克兰都不会投降。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【24】"}], "tech": [{"n": 5, "t": "然后核心就一句话：\n\r\n【以前整条流水线上有超过600个拣椒工人，现在就保留了48位，负责最后一道经验把关。】\n\r\n用AI把60", "b": "【以前整条流水线上有超过600个拣椒工人，现在就保留了48位，负责最后一道经验把关。】\n\n用AI把600人裁到48人了。裁掉92%。\n\n好日子来了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【5】"}, {"n": 8, "t": "红果短剧日均125分钟登顶，抖音紧随其后120分钟，两个App加起来每天吃掉一个人将近4小时。字节系拿走全网41.8%的时长份额", "b": "音紧随其后120分钟，两个App加起来每天吃掉一个人将近4小时。字节系拿走全网41.8%的时长份额，这个数字太吓人了，快半壁江山了。\n表面上看，这是字节的产品胜利，算法推荐做到了极致，短剧的\"下一集\"钩子设计得无懈可击。但换个角度，一个普通人每天清醒时间大约16小时，光红果加抖音就占去四分之一，再加上微信、快手、视频号、小红书，六个App叠满差不多8小时。也就是说，你醒着的一半时间都交给了手机屏幕。\n更耐人寻味的是红果短剧悄无声息地超越了抖音。短视频至少还有知识区、技能区可以自我安慰\"我在学东西\"，短剧连这层遮羞布都省了，纯粹靠情绪刺激和剧情反转把人钉在屏幕前。当一个免费短剧App能让用户日均停留两个多小时，说明\"注意力收割\"已经进入了一个新阶段：连内容质量都不再重要，只要节奏够快、钩子够密，时间就会被吸走。\n腾讯系跌到28.6%也很有意思。微信作为基础设施级产品，日均才80多分钟，说明大家打开微信越来越像\"处理事务\"，聊完就走。社交关系链曾经是腾讯最深的护城河，如今挡不住算法投喂的多巴胺流。\n说到底，时长份额的争夺战里没有赢家是用户。平台赢了注意力，广告主赢了曝光，用户赢了什么？每天多刷两小时短剧之后，生活有变好吗？这张图与其说是行业格局图，不如说是一张集体时间审计表。看完之后最该做的事，可能恰恰是放下手机。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【8】"}, {"n": 20, "t": "有人偷偷放在办公室进行录音，OpenAI发现后并没有立刻报警，而是让GPT来分析找到是谁放的…", "b": "penAI发现后并没有立刻报警，而是让GPT来分析找到是谁放的…\nGPT分析了这台设备的来源、特征以及可能的获取路径，最终抓到了这名员工！\nOpenAI 随后将其移交给了 FBI，将这名员工逮捕…\n该设备插入电视后部的 USB 端口，并隐藏在卫生纸中。OpenAI 确定该设备大约于 9 月 28 日安装，其内容已加密。投诉称，监控录像显示 Alfozan 在多个日期出现在该房间附近，尽管他无权进入或参加那里的会议，并且在 9 月 28 日之前，他使用办公软件查询了建筑物地址、会议室、日历和高管位置。\n投诉进一步指称，10 月 5 日有人看到他查看电视后面，随后 OpenAI 安全人员在他遗留在另一个房间的无人看管的包中发现了第二个类似的录音设备，以及他的钱包和身份证。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【20】"}, {"n": 23, "t": "中文互联网9大民间理论", "b": "中文互联网9大民间理论\n薄肌理\n不卷夸张围度\n大水理论\n少喝奶茶饮料\n常备一大瓶白水 和\n纯过日子理论\nas\nfLAFFELZUVA\nf hr fh\nBE ge a\n由全和\n苹果安卓相对论 黄毛理论\n用手机偏好  we]   少迎合 多主见\n隐喻人群气质差         认准的事就去做    A\n本质是消费观察        留一点反骨和松弛 二  ”)\nay\nTART\n“  UY ge       !\n渔\nF745\nLE gn\n大睡理论\n先把沉睡够\nDRE DAR\n状态好了再说\ny\n孙学\n认知 选择权 长期主义\n先升级自己\n再谈财富和", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【23】"}], "cult": [{"n": 6, "t": "演员金晨自曝刚交完学费，美国学校就倒闭了，学校有35年历史，自己才上了两天，钱也没退", "b": "演员人金晨自曝刚交完学费，美国学校就\n倒闭了，学校有35年历史，自己才上了\n两天，钱也没退\n21世纪经济报道\n257A Al摘要\n1   女演员金晨直播谈游学近况，她表示\n00 PERT VASE 0j2698\n此前，金晨远赴海外游学进修，暂时放缓演艺工\n作节奏。\n此举引发网友猜测“金晨是不是怀孕了，打算出国\nEF\"? 9月1日，金晨委托律师发声明，称\"人金晨\n出国生子”系严重失实的言论，已明显误导公众判\n断，导致委托人的公众形象受损，影响极其恶\n劣。律师事务所将继续受托针对具有严重侵权情\n节的主体进行追责诉讼，要求被告承担公开赔礼\n道歉、赔偿损失等侵权法律责任。\niM atitteisn\n金展女士名誉维权案件简讯\n北京道章律师事务所接受金展女士 下称，委托人)} 的委托，就近期网络中\n存在革主体有组织. 有规模地发布、传揪针对委托人的严重诽谤性言论一事进行\n全权处理。现本律师事务所受托公示委托人部分名誉维权案件进展\n近期，委托人发现，各大网络平台几乎同一时间涌现出以“金展出国生子\n为核心话题的大批量文案相同/相似、视频内容相同/相似的针对委托人的“营销\n黑稿”。经查，某主体创建群于载体，向群内网络用户分发相关网络素材，有偿\n雇用大量网络用户同时对外发布有关委托人的不实内容, 情节严重. 基于委托人\n的陈述以及承诺,相关网络素材中所谓“金展出国生子”系严重失实的言论，已\n明显误导公", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【6】"}, {"n": 22, "t": "文章拉到最后，有种莫名的喜感。", "b": "1975 (RR) : 单纯地追求高度的文化科学知识，就会迷失方向。\n原   上 江上明月昭    0月7日 08:00 北京 们53人\n《决裂》: 1975年李文化\"执导的剧情电影。影片原型是江西共产主义劳动大学《江西农业大学前身)\n的办学经历。\n【故事背景】\n故事设定在50年代后期。以“抗大”办学精神为参照，讲述山区新办农业大;\n办学路线之争; 学校到底为谁办? 工农群众能不能上大学? 课堂教学和生产:\n一松山分校内部激烈的\n实践该如何处理?\n【剧情梗概】\n老干部龙国正〈郭振清饰) 出任共大松山分校校长\n。 一派(一校长草仲和等) 主张把学校迁到城市近郊，沿用旧的考试、分数门权招生，看重书本文\n。 SELMER CEM, TACIT IR, EI EAR CRIN EH”\n收铁匠、农民等文化基础不高但有劳动实 ];
var WD = {0:'周日',1:'周一',2:'周二',3:'周三',4:'周四',5:'周五',6:'周六'};
var cur = DAYS[DAYS.length - 1].date;

function dayOf(dateStr){
  var y = +dateStr.slice(0,4), m = +dateStr.slice(4,6), d = +dateStr.slice(6,8);
  return WD[new Date(y, m-1, d).getDay()];
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderDay(dateStr){
  cur = dateStr;
  var day = null;
  for (var i=0;i<DAYS.length;i++){ if (DAYS[i].date === dateStr){ day = DAYS[i]; break; } }
  if (!day) return;
  document.getElementById('hd-date').textContent = '每日图卦 · ' + day.label + '（' + day.week + '）';
  document.getElementById('hd-title').textContent = day.title || '喷嚏图卦';
  var total = 0;
  CATS.forEach(function(c){ total += day.cats[c.id].length; });
  document.getElementById('hd-sub').textContent = day.label + ' · ' + total + ' 条 · 五类标签：经济与民生 / 社会与健康 / 国际 / 科技与财经 / 文化娱乐';
  var nav = '';
  CATS.forEach(function(c){
    nav += '<a href="#' + c.id + '" style="--nc:' + c.nc + '"><i></i>' + c.name + '</a>';
  });
  nav += '<a href="#top" class="to-top">回到顶部 ↑</a>';
  document.getElementById('nav-inner').innerHTML = nav;
  var panels = '';
  CATS.forEach(function(c, ci){
    var items = day.cats[c.id];
    panels += '<section class="panel" id="' + c.id + '" style="--sec:' + c.nc + ';--sec-soft:' + c.soft + '">'
      + '<div class="panel-head"><div class="panel-mark">' + c.mark + '</div>'
      + '<div class="panel-title">' + c.name + '<span>' + c.sub + ' · ' + items.length + ' 条</span></div></div>'
      + '<div class="panel-line"></div><div class="items">';
    items.forEach(function(it, i2){
      var wd = dayOf(dateStr);
      var full = items.length === 1 ? ' full' : '';
      var pcl = it.b.length > 90 ? 'clamp' : 'full';
      panels += '<article class="item' + full + '" data-ci="' + ci + '" data-i="' + i2 + '" title="点击查看全文"><div><div class="item-head">'
        + '<div class="src src-' + ['sun','mon','tue','wed','thu','fri','sat'][new Date(+dateStr.slice(0,4), +dateStr.slice(4,6)-1, +dateStr.slice(6,8)).getDay()] + '">' + wd + ' · ' + (it.n < 10 ? '0' : '') + it.n + '</div>'
        + '<a class="src-link" href="' + it.href + '" target="_blank" rel="noopener">来源</a></div>'
        + '<h3>' + esc(it.t) + '</h3><p class="' + pcl + '">' + esc(it.b.replace(/\s+/g,' ')) + '</p></div></article>';
    });
    panels += '</div></section>';
  });
  document.getElementById('panels').innerHTML = panels;
  // 检测正文是否超出 6 行 → 标记"点击查看全文"
  var itemsEls = document.querySelectorAll('.item p.clamp');
  for (var i=0;i<itemsEls.length;i++){
    var p = itemsEls[i];
    if (p.scrollHeight > p.clientHeight + 2){
      var art = p.closest('.item');
      art.classList.add('has-more');
    } else {
      p.className = 'full';
    }
  }
  bindModal();
  var btns = document.querySelectorAll('.day-btn');
  for (var i=0;i<btns.length;i++){
    btns[i].className = btns[i].getAttribute('data-date') === dateStr ? 'day-btn active' : 'day-btn';
  }
  var links = '';
  DAYS.forEach(function(d){
    links += '<div><span class="src">' + d.label + '</span><a href="https://www.dapenti.com/blog/more.asp?name=xilei&id=' + d.id + '" target="_blank" rel="noopener" title="' + esc(d.title) + '">' + esc(d.title) + '</a></div>';
  });
  document.getElementById('footer-links').innerHTML = links;
  document.getElementById('footer-note').textContent = '喷嚏图卦 · ' + DAYS[0].label + ' – ' + DAYS[DAYS.length-1].label + ' 日报 · ' + DAYS.length + ' 期 · 五主题分类 · 每日 18:00 自动更新';
  history.replaceState(null, '', '#' + dateStr);
}

function showDay(dateStr){ renderDay(dateStr); document.getElementById('top').scrollIntoView({behavior:'smooth'}); }

var curCat = '', curItem = null;
function bindModal(){
  var arts = document.querySelectorAll('.item');
  for (var i=0;i<arts.length;i++){
    arts[i].onclick = function(e){
      if (e.target.closest('.src-link')){ return; }
      var ci = +this.getAttribute('data-ci'), ii = +this.getAttribute('data-i');
      var it = DAYS.filter(function(d){ return d.date === cur; })[0].cats[CATS[ci].id][ii];
      openModal(CATS[ci], it, cur);
    };
  }
}
function openModal(cat, it, dateStr){
  var day = DAYS.filter(function(d){ return d.date === dateStr; })[0];
  document.getElementById('modal-tag').textContent = day.label + '（' + day.week + '） · ' + cat.name + ' · 序号 ' + it.n;
  document.getElementById('modal-title').textContent = it.t;
  document.getElementById('modal-body-text').textContent = it.b;
  document.getElementById('modal-src').innerHTML = '原文：<a href="' + it.href + '" target="_blank" rel="noopener">打开喷嚏网原文</a>';
  document.getElementById('modal-mask').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('modal-mask').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-mask').addEventListener('click', function(e){
  if (e.target === this){ closeModal(); }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ closeModal(); } });

window.addEventListener('hashchange', function(){
  var h = location.hash.slice(1);
  if (h && h.length === 8 && DAYS.some(function(d){ return d.date === h; })){ renderDay(h); }
});

renderDay(cur);
</script>

</body>
</html>
