<style>
  :root{
    --paper:#F5F4EF; --card:#FFFFFF; --ink:#20242B; --ink-2:#5A5F68; --line:#E2E0D8;
    --blue:#2662B8; --green:#12805E; --red:#C0443B; --purple:#6A48B0; --amber:#B07A1E;
    --blue-soft:rgba(38,98,184,.06); --green-soft:rgba(18,128,94,.06);
    --red-soft:rgba(192,68,59,.06); --purple-soft:rgba(106,72,176,.06); --amber-soft:rgba(176,122,30,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
  .wrap{max-width:800px;margin:0 auto;padding:0 20px}
  a{color:inherit}
  ::selection{background:rgba(176,122,30,.25)}

  /* 报头 */
  .masthead{background:var(--ink);color:#F5F4EF}
  .masthead-inner{max-width:840px;margin:0 auto;padding:34px 20px 30px}
  .brand-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand{font-family:"Noto Serif SC",serif;font-weight:900;font-size:26px;letter-spacing:.12em}
  .brand .dot{color:var(--amber)}
  .slogan{font-size:13px;color:#A9AEBB;letter-spacing:.08em}
  .issue-date{font-size:13px;color:#8C93A3;letter-spacing:.2em;margin-top:6px}
  .issue-title{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(24px,4.6vw,36px);line-height:1.4;margin:16px 0 4px;color:#fff}
  .issue-sub{font-size:13px;color:#8C93A3}

  /* 日期切换 */
  .daybar{background:#1B1E24;border-top:1px solid rgba(255,255,255,.1)}
  .daybar-inner{max-width:840px;margin:0 auto;padding:12px 20px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#A9AEBB;border-radius:8px;padding:8px 6px 6px;cursor:pointer;font-family:inherit;transition:all .15s}
  .day-btn b{display:block;font-size:13px;font-weight:600;color:#E7E9EE}
  .day-btn span{font-size:11px;color:#8C93A3}
  .day-btn:hover{background:rgba(255,255,255,.14)}
  .day-btn.active{background:var(--amber);border-color:var(--amber);color:#20242B}
  .day-btn.active b{color:#20242B}
  .day-btn.active span{color:#20242B}

  /* 导航 */
  .section-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .nav-inner{max-width:840px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .nav-inner::-webkit-scrollbar{display:none}
  .nav-inner a{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink-2);padding:5px 12px;border-radius:999px;transition:all .15s}
  .nav-inner a:hover{background:var(--line);color:var(--ink)}
  .nav-inner a i{width:8px;height:8px;border-radius:50%;background:var(--nc)}
  .to-top{margin-left:auto;color:var(--ink-2);font-size:13px;text-decoration:none;padding:5px 10px;border:1px solid var(--line);border-radius:999px;flex-shrink:0}
  .to-top:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* 主题板块 */
  main{padding:36px 0 20px}
  section.panel{margin-bottom:56px;scroll-margin-top:64px}
  .panel-head{display:flex;align-items:center;gap:16px;margin-bottom:4px}
  .panel-mark{width:46px;height:46px;border-radius:10px;background:var(--sec);color:#fff;font-family:"Noto Serif SC",serif;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .panel-title{font-family:"Noto Serif SC",serif;font-weight:700;font-size:clamp(20px,3.2vw,24px);color:var(--sec)}
  .panel-title span{font-size:13px;color:var(--ink-2);font-family:"Noto Sans SC",sans-serif;font-weight:400;display:block;margin-top:2px}
  .panel-line{height:2px;background:var(--sec);opacity:.25;margin:14px 0 20px}

  /* 条目 */
  .items{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sec);border-radius:0 8px 8px 0;padding:12px 15px;transition:background .18s;break-inside:avoid;cursor:pointer;position:relative}
  .item:hover{background:var(--sec-soft)}
  .item-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .item-head .src{flex-shrink:0}
  .item .src{font-size:11.5px;font-weight:500;letter-spacing:.05em;opacity:.95}
  .item h3{font-family:"Noto Serif SC",serif;font-weight:700;font-size:14.5px;line-height:1.45;margin:2px 0 4px}
  .item p.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;font-size:12.8px;color:#4A4F58;line-height:1.6}
  .item p.full{font-size:12.8px;color:#4A4F58;line-height:1.6}
  .item.has-more::after{content:"… 点击查看全文";position:absolute;right:10px;bottom:6px;font-size:11px;color:var(--sec);background:linear-gradient(90deg,transparent,var(--card) 30%);padding:2px 6px 2px 14px;pointer-events:none}
  .item.has-more p.clamp{position:relative}
  .src-link{font-size:11px;color:var(--ink-2);text-decoration:none;white-space:nowrap;border-bottom:1px dashed var(--line);transition:color .15s,border-color .15s;position:relative;z-index:2}
  .src-link:hover{color:var(--sec);border-color:var(--sec)}
  .item.full{grid-column:1/-1}
  .src-mon{color:var(--blue)} .src-tue{color:var(--green)} .src-wed{color:var(--purple)} .src-thu{color:var(--red)}
  .src-fri{color:var(--amber)} .src-sat{color:#3E7D8C} .src-sun{color:#2F6B7A}

  /* 全文弹层 */
  .modal-mask{position:fixed;inset:0;background:rgba(20,22,28,.62);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .18s}
  .modal-mask.open{opacity:1;visibility:visible}
  .modal{background:var(--paper);max-width:640px;width:100%;max-height:82vh;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;transform:translateY(10px);transition:transform .18s}
  .modal-mask.open .modal{transform:translateY(0)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
  .modal-tag{font-size:12px;color:var(--sec);font-weight:600;letter-spacing:.06em}
  .modal-close{background:none;border:none;font-size:22px;line-height:1;color:var(--ink-2);cursor:pointer;padding:4px 8px;border-radius:6px}
  .modal-close:hover{color:var(--ink);background:var(--line)}
  .modal-body{overflow-y:auto;padding:18px 20px 22px}
  .modal h3{font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px;line-height:1.5;margin-bottom:12px}
  .modal p{font-size:14.5px;line-height:1.9;color:#33363D;white-space:pre-wrap;word-break:break-word}
  .modal-src{margin-top:16px;font-size:12.5px}
  .modal-src a{color:var(--sec);text-decoration:none;border-bottom:1px dashed var(--line)}

  /* 页脚 */
  footer{background:var(--ink);color:#A9AEBB;margin-top:20px}
  .footer-inner{max-width:840px;margin:0 auto;padding:30px 20px;font-size:13px;line-height:1.9}
  .footer-inner a{color:#F5F4EF;text-decoration:none}
  .footer-inner a:hover{color:var(--amber)}
  .footer-inner .src{color:#8C93A3}
  .footer-links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 18px;margin:10px 0 14px}
  .footer-links div{display:flex;align-items:baseline;gap:8px;min-width:0}
  .footer-links .src{flex-shrink:0}
  .footer-links a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.item,.nav-inner a,.day-btn{transition:none}}
  @media (max-width:720px){
    .daybar-inner{grid-template-columns:repeat(4,1fr)}
    .items{grid-template-columns:1fr}
    .footer-links{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
</style>
</head>

应用仍面临泛化能力、效率等问题，但未来几年\n有望得到解决。随着AI模型能力快速提升，具身智能的技术临界点可能比预期来得\n更快，快的话甚至可能在一两年内出现\n此外，王兴兴还表示，目前国内外多家机器人企业已在工厂开展试点，但距离大规\n模应用仍需解决泛化能力和效率问题。他认为，这些问题未来几年有望得到解决\n从不同场景的应用进度来看，商业服务场景的应用进展可能比工业场景更快，而居\n家场景的推进可能相对靠后。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【5】"}, {"n": 19, "t": "使用#人工智能#（#AI#）文本检测工具可以识别学生是否借助AI完成作业，然而研究显示，这类工具误判率高，美国越来越多高校，包括", "b": "本检测工具可以识别学生是否借助AI完成作业，然而研究显示，这类工具误判率高，美国越来越多高校，包括耶鲁大学和康奈尔大学，已经禁止或不鼓励教师依赖AI检测工具作为判断学生是否作弊的主要依据。为此大学教授们不得不另出奇招应对作弊，以及重新制定评估模式。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【19】"}, {"n": 21, "t": "Google 面试开始允许用 AI 了", "b": "Shreyas Naphad @                             Gi ae\n@NaphadShreyas\nO 翻译自英语 显示原文 O\n告别 LeetCode? 谷歌刚刚更新了其面试流程。Al 现在已成为其中一部分。\n他们引入了一个名为 Code Comprehension 的新轮次。\n这一轮次背后的想法是将候选人置于一个 200-500 行的代码库中，并提供\nGemini 供使用。\n这一轮次评估:                               从\n- 你能否阅读别人的代码\n-在使用 Al 之前，你能否独立调试\n- 你能否发现 Gemini 出错的情况\n评价此翻译: 只 名\nGoogle replaced one traditional coding round with a Code\nComprehension round in its May 2026 pilot. [NS CETe els\nsolving a LeetCode-style algorithm from scratch, you\nreceive a 200-500 line unfamiliar codebase in a CoderPad\nenvironment, and you have 60 minutes to read it, find bugs,\ndiscus", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【21】"}, {"n": 25, "t": "5)JohnCarter@", "b": "5) John Carter @\n@martianwyrdlord\nFA Grok 翻译自英语\n另一个角度是，狗在两万年前就无意中\n发现了对它们来说相当于人工超级智能\n的东西。奇点对狗来说早已发生。它们\n生活在一个它们无法理解的世界中，被\n它们完全视为理所当然的奇迹奇观所包\n围，它们的每一个需求都由那些它们根\n本无法领会其思想的实体来照料。\n结果是，现在地球上有大约十亿只狗。\n其中大多数都相当快乐。几乎没有哪只\n狗需要工作。这对它们来说效果相当\n好。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【25】"}], "cult": [{"n": 7, "t": "中网用了20届的时光，终于等来的第一位来自中国的女单决赛选手，也迎来了第一位本土女单冠军。", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【7】"}]}}, {"date": "20261013", "label": "10月13日", "week": "周二", "id": "196103", "title": "人的消费行为主要取决于对未来长期收入的预期", "cats": {"econ": [{" \n近日\n国家税务总局发布\n《全国税务行政处罚裁量基准\n(2026年版) 》\n自2026年11月1日起施行\n@ 国家税务总局                     |\nma\n政策法规库\n本次政策的核心变化为\n社会保险费正式纳入\n全国统一税务行政处罚裁量体系\n该事项位列裁量基准第50项\n归类为违反税 〈费) 款征收管理类\n逾期仍未缴纳社保的\n处罚裁量划分为3档", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【2】"}, {"n": 3, "t": "10月11日，《人民日报》发表评论，批评台湾“科技产业独大，传统产业持续衰败”，称其形成“一业兴、百业衰”的“畸形格局”，并指“", "b": "评论，批评台湾“科技产业独大，传统产业持续衰败”，称其形成“一业兴、百业衰”的“畸形格局”，并指“普通民众无缘发展红利”。\n台湾领导人赖先生在10月10日的讲话中，也提出衡量社会进步不能只看产值与出口，还要看劳动待遇是否提高、家庭负担是否减轻，以及年轻人是否相信努力能创造更好的未来。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【3】"}], "soc": [{"n": 1, "t": "近年来以学者身份活跃的十八届中央委员、重庆原市长黄奇帆，退休8年后官宣落马。10月13日，中央纪委国家监委网站通报该消息。", "b": "央委员、重庆原市长黄奇帆，退休8年后官宣落马。10月13日，中央纪委国家监委网站通报该消息。\n坊间一度有“政坛不倒翁”之说的黄奇帆，在一个月前还有公开出席活动。据厦门发改委网站，9月8日，第八届“丝路海运”国际合作论坛在福建厦门开幕，重庆市政府原市长黄奇帆作主旨演讲。\n另据财新获悉，宁波银行杭州分行计划于10月26日举办的一场论坛上，黄奇帆原作为主讲嘉宾发表2小时主旨演讲，但在社交媒体上即流传该活动“因故取消”的消息。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【1】"}, {"n": 7, "t": "据亚洲周刊报道，获刑不到一个月，南京博物院原院长徐湖平因肺癌去世", "b": "南京博物院原院长徐湖平因肺总去世\n亚周在线\n沸沸扬扬的南京博物院文物事件主角、南京博物\n院原院长徐湖平在十月十二日下午六时许病逝于\n南京一家监狱医院。\n据了解，徐湖平患有肺癌，已是晚期。\n徐湖平，一九四五年生人，祖籍湖南省平江县。\n曾任江苏省第九届政协委员、南京博物院院长。\n徐湖平一九六三年中学毕业后入伍，一九六九年\n退役回到南京。一九七三年进入南京博物院，一\n九八五年八月任南京博物院副院长，二零零一年\n一月任南京博物院院长，二零零六年一月任南京\n博物院书记、江宁织造博物馆馆长。二零零八\n年，徐湖平退休。\n二零二五年，内地媒体澎涯新闻报道中国著名收\n藏家庞莱臣后裔庞淑令起诉南京博物院要求查看\n捐赠文物的事件，引发与情关注。二零二五年十\n二月，南京博物院退休员工郭礼典实名举报徐湖\n平大规模盗窃、走私文物的视频引发关注。\n南京博物院及徐湖平的问题引发高度重视。二零\n二六年二月，江苏省通报南京博物院受赠文物管\n理问题，对徐湖平其立案审查。同年九月，其因\n受贿罪被判处有期徒刑三年，并处罚金二十万\n元，此前已被给予开除党籍处分、取消相关待\n遇。\n继南京博物院事件后，温州收藏家单宾后人单一\n心起诉上海博物馆，要求其归还数干件文物。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【7】"}, {"n": 14, "t": "美国康奈尔大学因2024年一起涉嫌七名男子集体性侵女学生的案件引发强烈争议，康奈尔大学校长星期二宣布，将禁止校园兄弟会在会所举办", "b": "涉嫌七名男子集体性侵女学生的案件引发强烈争议，康奈尔大学校长星期二宣布，将禁止校园兄弟会在会所举办派对和社交活动，直至本学年结束。\n诉讼曝光后，康奈尔大学因处理性侵指控的方式受到学生、教职员、校友及捐款人的猛烈批评。学生发起抗议，部分教职员酝酿对校方提出不信任动议。\n康奈尔大学2025年的一项调查显示，35%的本科女学生说，入学以来曾在遭受强迫或失去反抗能力的情况下，经历未经同意的性接触。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【14】"}, {"n": 15, "t": "天主教教宗良十四世星期二接受手术，切除右肺癌性肿瘤。梵蒂冈证实，手术顺利完成，没有出现并发症，但医生仍须进一步检查，以确定癌细胞", "b": "术，切除右肺癌性肿瘤。梵蒂冈证实，手术顺利完成，没有出现并发症，但医生仍须进一步检查，以确定癌细胞是否扩散。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【15】"}, {"n": 16, "t": "秘鲁政府计划收紧学校纪律，禁止女学生穿短裙、涂指甲油，以及男学生留长发，并限制学生使用手机，引发女权及人权组织批评，认为这些措施", "b": "女学生穿短裙、涂指甲油，以及男学生留长发，并限制学生使用手机，引发女权及人权组织批评，认为这些措施无助于遏制校园暴力，反而带有威权色彩。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【16】"}], "intl": [{"n": 4, "t": "今年上半年，全球新车销量里，油车所占份额第一次失守50%，不过整个汽车市场也萎缩了5%，买车的人变少了。", "b": "全球新车市场\n纯汽油 车份额\n首次跌破一半\n2021年为73% + 下降24个百分点\n动力类型                 份额\n纯汽油               49%\n普通混动               18%\n纯电动                17%\n柴油、插混及其他            约16%\n普通混      ER; 约16%为余项推算。\n约83%的新车仍有发动机，按100%减去17%的纯电份额推算。\nGy,\n2026年上半年\n销量 (万辆)             同比\n2,025          -10%\n727          +10%\n687         +12%\n未披露              oe\n来源: Electrek + 2026.10.05\nMobility Global / Nikkei", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【4】"}, {"n": 9, "t": "沙特能源部星期三（10月14日）发布声明说，沙特阿美位于宰赫兰（Dhahran）的一栋行政大楼星期二（13日）晚遭袭，引发局部火", "b": "）发布声明说，沙特阿美位于宰赫兰（Dhahran）的一栋行政大楼星期二（13日）晚遭袭，引发局部火患，当局已采取必要措施，事件没有造成人员伤亡。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【9】"}, {"n": 10, "t": "也门胡塞武装警告美国不要介入也门战争，否则将面临“令其痛苦的反击”。随着胡塞武装与美国盟友沙特阿拉伯之间的战斗加剧，一直不愿卷入", "b": "门战争，否则将面临“令其痛苦的反击”。随着胡塞武装与美国盟友沙特阿拉伯之间的战斗加剧，一直不愿卷入其中的华盛顿正考虑出手打击胡塞武装。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【10】"}, {"n": 11, "t": "乌克兰总统泽连斯基星期二（10月13日）说，乌克兰并未收到西方盟友关于俄罗斯向其首都发射弹道导弹的预先警告。", "b": "月13日）说，乌克兰并未收到西方盟友关于俄罗斯向其首都发射弹道导弹的预先警告。\n美国官员威胁称，如果乌克兰不停止袭击俄罗斯炼油厂，将切断对乌情报共享和武器销售。专家和官员指出，基辅在获取导弹袭击预警方面高度依赖美国情报。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【11】"}, {"n": 12, "t": "美国总统特朗普计划下月访问亚洲之际，再次提及可能与朝鲜领导人金正恩会面。然而，朝方至今未释放明确对话信号，反而高调展示包括洲际弹", "b": "之际，再次提及可能与朝鲜领导人金正恩会面。然而，朝方至今未释放明确对话信号，反而高调展示包括洲际弹道导弹、潜射弹道导弹等多款先进武器。分析认为，平壤意在展示核打击能力，强调拥核国地位，并为未来朝美谈判争取有利条件。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【12】"}, {"n": 13, "t": "随着伊朗伊斯兰革命卫队更加密集地攻击穿过霍尔木兹海峡的油轮，很多大型油轮的运营商宁可舍弃高额经济报酬，也选择掉头远离这个高风险航", "b": "地攻击穿过霍尔木兹海峡的油轮，很多大型油轮的运营商宁可舍弃高额经济报酬，也选择掉头远离这个高风险航道，让外界再次担忧波斯湾的原油出口是否可持续。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【13】"}, {"n": 17, "t": "英国前首相苏纳克星期二（10月13日）说，以美国为首的全球秩序“已经终结”，世界正进入地缘政治不确定性加剧的时期。", "b": "13日）说，以美国为首的全球秩序“已经终结”，世界正进入地缘政治不确定性加剧的时期。\n彭博社报道，苏纳克在新德里举行的彭博“新经济论坛”首日会议上说，美国总统特朗普“并非这一局面的成因，而是其体现出的症状”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【17】"}, {"n": 18, "t": "IMF星期二（10月13日）发布《全球金融稳定报告》点出，人工智能（AI）领域的投资有助弥补中东战争和整体政策环境不明朗构成的经", "b": "布《全球金融稳定报告》点出，人工智能（AI）领域的投资有助弥补中东战争和整体政策环境不明朗构成的经济冲击。但是，如今有“更多证据”显示，建立AI能力或许并不需要如此庞大的投资，潜在的经济利益也或许没有预期中大。\nIMF提醒，超大规模数据中心营运者（hyperscalers）为投资项目进行融资所发行的债券，如今已占全球投资级债券发行量的10%，比2024年高出逾10倍。如果AI领域的盈利或投资接下来趋缓，可能引发相关资产价格的调整，继而外溢到更广泛的市场，“后果可能是全球性的”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【18】"}, {"n": 19, "t": "导火索是《华尔街日报》的爆料：Guilfoyle 在 2025 年 7 月参议院确认听证会前，请求共和党捐赠人 Eric Det", "b": "Guilfoyle 在 2025 年 7 月参议院确认听证会前，请求共和党捐赠人 Eric Deters 向她的美国运通账户汇 10 万美元，帮她还信用卡。据 Deters 提供给媒体的信息，她承诺若收到钱，就做他在“特朗普世界里的 ride or die（生死之交）”，还在 Signal 上写道：“直接汇到美国运通的话，不会出现在任何地方。拜托。”Deters 拒绝了，称当时手头没有流动资金。\n这只是连串报道中的一桩：她还被指接受希腊商界大亨的奢华馈赠（包括飞巴黎的机票和豪华酒店），以及以提供接触政府高官的机会换取金钱。国务院监察长办公室正在调查。她通过律师否认以权谋私，称只是在离任前收回演讲和咨询的应收账款，且遵守了联邦礼品申报规定。\nGuilfoyle 曾是福克斯主播、特朗普长子 Donald Trump Jr. 的未婚妻、加州州长纽森的前妻――这起辞职令这段“准家人”关系画上尴尬句号。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【19】"}, {"n": 21, "t": "@®华尔街日报中文网X.com", "b": "@® 华尔街日报中文网               X.com\n@ChineseWSJ\n12]\n特朗普为何下令在航母上恢复使用蒸汽弹射器?\n一位名叫“比尔.琼斯”的水兵和特朗普的一次交谈\n让他确信，发射战机的旧式技术优于现代方法。\n官员们至今仍在应对这名神秘水兵与总统一次偶\n遇所带来的后果。而据国防官员说，他们始终没\n有找到这个人。\nFrom cn.wsj.com\n8:00 AM - 10/13/26 - 27K Views", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【21】"}, {"n": 24, "t": "泽连斯基：不要攻击我们，不要杀害我们的孩子。我们将停止攻击你们的柴油。我认为这是一个公平的交易。", "b": "害我们的孩子。我们将停止攻击你们的柴油。我认为这是一个公平的交易。 \n泽连斯基表示，乌克兰将在有或没有美国总统唐纳德・特朗普帮助的情况下赢得这场战争。\n我知道许多美国公民不支持他们的总统所做的事情，我敦促那些人继续为乌克兰祈祷，并在这一艰难时期支持我们。\n尽管美国总统选择支持普京――这个对这场战争负有责任的人――我们乌克兰人不会退缩。我们已经遭受了太多苦难，失去了太多生命，牺牲了太多，不能现在放弃。\n我们将继续为我们的自由、我们的国家以及我们的未来而战。无论有无美国的帮助，乌克兰都不会投降。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【24】"}], "tech": [{"n": 5, "t": "然后核心就一句话：\n\r\n【以前整条流水线上有超过600个拣椒工人，现在就保留了48位，负责最后一道经验把关。】\n\r\n用AI把60", "b": "【以前整条流水线上有超过600个拣椒工人，现在就保留了48位，负责最后一道经验把关。】\n\n用AI把600人裁到48人了。裁掉92%。\n\n好日子来了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【5】"}, {"n": 8, "t": "红果短剧日均125分钟登顶，抖音紧随其后120分钟，两个App加起来每天吃掉一个人将近4小时。字节系拿走全网41.8%的时长份额", "b": "音紧随其后120分钟，两个App加起来每天吃掉一个人将近4小时。字节系拿走全网41.8%的时长份额，这个数字太吓人了，快半壁江山了。\n表面上看，这是字节的产品胜利，算法推荐做到了极致，短剧的\"下一集\"钩子设计得无懈可击。但换个角度，一个普通人每天清醒时间大约16小时，光红果加抖音就占去四分之一，再加上微信、快手、视频号、小红书，六个App叠满差不多8小时。也就是说，你醒着的一半时间都交给了手机屏幕。\n更耐人寻味的是红果短剧悄无声息地超越了抖音。短视频至少还有知识区、技能区可以自我安慰\"我在学东西\"，短剧连这层遮羞布都省了，纯粹靠情绪刺激和剧情反转把人钉在屏幕前。当一个免费短剧App能让用户日均停留两个多小时，说明\"注意力收割\"已经进入了一个新阶段：连内容质量都不再重要，只要节奏够快、钩子够密，时间就会被吸走。\n腾讯系跌到28.6%也很有意思。微信作为基础设施级产品，日均才80多分钟，说明大家打开微信越来越像\"处理事务\"，聊完就走。社交关系链曾经是腾讯最深的护城河，如今挡不住算法投喂的多巴胺流。\n说到底，时长份额的争夺战里没有赢家是用户。平台赢了注意力，广告主赢了曝光，用户赢了什么？每天多刷两小时短剧之后，生活有变好吗？这张图与其说是行业格局图，不如说是一张集体时间审计表。看完之后最该做的事，可能恰恰是放下手机。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【8】"}, {"n": 20, "t": "有人偷偷放在办公室进行录音，OpenAI发现后并没有立刻报警，而是让GPT来分析找到是谁放的…", "b": "penAI发现后并没有立刻报警，而是让GPT来分析找到是谁放的…\nGPT分析了这台设备的来源、特征以及可能的获取路径，最终抓到了这名员工！\nOpenAI 随后将其移交给了 FBI，将这名员工逮捕…\n该设备插入电视后部的 USB 端口，并隐藏在卫生纸中。OpenAI 确定该设备大约于 9 月 28 日安装，其内容已加密。投诉称，监控录像显示 Alfozan 在多个日期出现在该房间附近，尽管他无权进入或参加那里的会议，并且在 9 月 28 日之前，他使用办公软件查询了建筑物地址、会议室、日历和高管位置。\n投诉进一步指称，10 月 5 日有人看到他查看电视后面，随后 OpenAI 安全人员在他遗留在另一个房间的无人看管的包中发现了第二个类似的录音设备，以及他的钱包和身份证。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【20】"}, {"n": 23, "t": "中文互联网9大民间理论", "b": "中文互联网9大民间理论\n薄肌理\n不卷夸 其终究比政权复杂", "cats": {"econ": [{"n": 8, "t": "2026量化行业高质量发展大会10月15日在上海举行", "b": "2026量化行业高质量发展大会10月15\n日在上海举行\n国\n格隆汇10月15日 | 今日，以“智驱前沿数启\n金融\"为主题的\"2026量化行业高质量发展\n大会\"在上海徐汇西岸举行。来自\n国内顶尖\n量化机构、科技领军企业的超300位嘉宾参\n会，围绕Al技术应用、前沿大模型、GPU\n算力升级等前沿议题展开深度对话，共同\n探讨证券行业发挥“金融+技术\"优势、助力\n新质生产力发展的路径，树立行业创新典\n范与社会责任标杆。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【8】"}, {"n": 19, "t": "泰国长期依赖来自邻国缅甸、柬埔寨和老挝的外籍劳工，但泰柬纷争与缅甸动乱等地缘问题正在压缩这些外来劳动力资源，影响到农业、制造业和", "b": "寨和老挝的外籍劳工，但泰柬纷争与缅甸动乱等地缘问题正在压缩这些外来劳动力资源，影响到农业、制造业和建筑业的运作，迫使曼谷政府积极从南亚地区开拓新的外劳来源。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【19】"}, {"n": 26, "t": "关于社保，这位博主的几点提议", "b": "2026/10/11 16:13  44769 2055 32h\n最近关于社保的争议很大，我有几点\nHEIN:\n第一，社保缴纳基数应与实际工资一\n致，或者，应降社保最低缴纳基数和\n城市的最低工资一致，而非按照虚高\n的最低缴纳基数缴纳，特别是中小企\n业职员、灵活就业者应该如此。\n现在的社保基数太高、太贵了，老百\n姓社保负担太重，交不起了; 企业用\n人负担也重，特别是现金流薄弱一点\n的中小企业，不敢招人、用不起\nAo\n比如我们这，最低工资为2540元一\n月，但最低社保基数为7270元，相\nERX.\n一个人即使工资只有五干，也要按七\n千多缴，扣掉社保个税等，到手的可\n支配资金更少了，拿什么来消费和人生\n活? 这无论对个人生活，还是对社会\n经济发展、鼓励促进消费，都是不利\n的。\n职工每月至少要交2000多，灵活就\n业社保最低也要交2000多，没有工\n稳定工作、稳定收入、收入不高的\n人，根本承受不住。\n特别是，灵活就业者，数量本来就庞\n大，工资收入本来就不稳定、也不\n高，对高昂的灵活就业社保真的望而\n却步，交几个月可以，长期交几十年\n真交不起。\n对于灵活就业者的最低社保基数，应\n该降低到当地最低工资标准，减轻灵\n活就业者负担，或者设置由低到高多\n个档次，一两百、五六百、七八百、\n一和干多、两千多这样，让灵活就业者\n都可以根据收入情况自主选择交多\n少、交什么档位。\n第二，中小企业是吸纳就业人员", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【26】"}], "soc": [{"n": 3, "t": "库克、李彦宏、马化腾登上新闻联播，参加清华经管学院顾问委员会 2026 年会。", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【3】"}, {"n": 4, "t": "#警方调查炸串摊主被差评后轻生#近日，四川宜宾高县一女摊主被顾客差评后跳河轻生，引发关注。死者家属向@中国新闻周刊介绍，33岁的", "b": "#近日，四川宜宾高县一女摊主被顾客差评后跳河轻生，引发关注。死者家属向@中国新闻周刊介绍，33岁的胡女士原本在当地摆摊卖炸串炸洋芋，10月6日，她接待了一位女顾客，对方因对菜量不满，在多平台发布差评。\n这位顾客在社交平台上发文称：“避雷某某铜锅洋芋，老板娘玩不起，嫌菜堆高了就不给加土豆。10块钱一份的炸菜，堆得多了就不让夹菜了。我买一份肯定要吃饱啊，玩不起开什么店子呢？后面直接就不给加土豆了，两份都没有加土豆，一脸高傲的样子，搞得好像谁欠你一样。” 随后，在相关贴文评论区出现了大量针对摊主的差评，胡女士曾在评论区回复解释。\n10月13日，胡女士的丈夫告诉@中国新闻周刊，该顾客购买的10元炸菜为自选模式，有20余种菜品任选，装满一筐后，再视情况给顾客添加炸土豆条，“我们是菜（夹）多了土豆就少，（菜）分量特别多的情况下，（土豆条）就加不了，我们都会给客户说的。” 胡女士曾公开表示，提供给该顾客的“两份炸菜份量对得起天地良心”。\n胡女士留下遗言称：“这两天我经历了在我心中的网暴，吃炸菜说没有加土豆，下面一些评论拥上来，有说服务差的，有说味道不好吃的。” 其坦言小摊经营压力大，“我每天睡觉不超过6小时，最后换来这样的避雷视频”。\n其丈夫表示，夫妻二人摆摊4年多以来，已积累了一些老客户，突然蜂拥而至的差评在当地传开了，“可能她心里就有这个包袱了”，家人也一直宽慰胡女士对此事“不要过度在意”。10月9日，胡女士还嘱咐丈夫把新买的土豆放到库房，怎料不久便发生了悲剧。\n10月13日，宜宾高县庆符镇政府工作人员告诉@中国新闻周刊，此事警方正在调查，镇政府配合相关工作。高县公安局政治处工作人员表示，事发后已第一时间处置，目前正在联合处理此事。\n胡女士去世后，有网友转而质疑该顾客言行，其曾在个人社交账号发文回应：“我清楚大家的惋惜与悲痛心情，我同样深感遗憾。但我发布的仅仅是本人真实的消费体验评价，无任何恶意、无任何煽动、无任何捏造事实。我觉得我不该因为一场意外悲剧被无限追责、被全网审判。” 目前，该内容已不可见。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【4】"}, {"n": 5, "t": "湖南省长暗访检查溶洞", "b": "委副书记、省长毛伟明以“四不两\n直\"方式，赴株洲市暗访检查溶洞污\n染问题排查整治和安全生产工作\nae KMS O\n省长暗访溶洞，随机拨打管护责任人\n电话", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【5】"}, {"n": 6, "t": "内地为什么要传这样的假消息", "b": "am730 @ .关注\nPe 1小时 .四\n李嘉诚最新一张露面照片，精神饱满思吏电动代步避\nNy\n#李嘉诚 #长和 #am730", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【6】"}, {"n": 7, "t": "受害者从8月开始出现手指麻木、双腿无力、失眠等症状，并发现办公室咖啡机冲泡的茶水味道异常。其妻子和大学教授随后展开调查，从咖啡机", "b": "双腿无力、失眠等症状，并发现办公室咖啡机冲泡的茶水味道异常。其妻子和大学教授随后展开调查，从咖啡机残留水中提取出63毫克含有丙烯酰胺的白色粉末。\n警方安装监控后发现，Wang曾翻动受害者办公桌、逐页拍摄其研究笔记，并用自己杯中的液体冲洗对方的杯子。调查还发现，Wang涉嫌去年夏天两次通过eBay购买丙烯酰胺，事后要求平台删除账户。\n受害者正在研究利用细菌将RNA送入人体细胞的新技术，涉及癌症、神经系统疾病和遗传疾病治疗，相关成果正在申请专利。指导教授Mark Gomelsky表示，Wang此前博士论文答辩失败，可能因此嫉妒成绩优异的受害者。\n10月5日，Wang接受警方询问，声称自己多年未使用丙烯酰胺。次日，她在洛杉矶国际机场准备返回中国时被捕，随身携带多台笔记本电脑、外置存储设备及研究文件。\nWang目前面临最高10年监禁及1万美元罚款，怀俄明州法官已将保释金提高至150万美元。受害者目前仍有左手失去知觉、注意力难以集中、容易疲劳等神经损伤症状，能否完全康复尚不确定。\n另外，目前没有证据证实Wang投毒的目的是窃取研究成果，嫉妒或科研竞争也尚未被司法机关认定为作案动机。相关指控仍有待法院审理。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【7】"}, {"n": 9, "t": "风险解除", "b": "我们中出了一个叛徒", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【9】"}, {"n": 18, "t": "由于厄尔尼诺现象导致河水暴涨，恐有泛滥的风险，阿根廷当局周一（10月12日）临时关闭了游客前往伊瓜苏瀑布（Iguazu Fall", "b": "恐有泛滥的风险，阿根廷当局周一（10月12日）临时关闭了游客前往伊瓜苏瀑布（Iguazu Falls）的通道。\n伊瓜苏国家公园说，周一伊瓜苏河流量破每秒1万2000立方米，达到正常平均流量的六倍以上。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【18】"}, {"n": 25, "t": "Apple Watch国行可以开通睡眠呼吸暂停了", "b": "可能出现睡眠\n呼吸暂停", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【25】"}], "intl": [{"n": 10, "t": "海事官员星期三（10月14日）证实，过去24小时内，两艘商船在霍尔木兹海峡附近遭弹体击中后沉没。随着近10天来这个关键水道的袭击", "b": "证实，过去24小时内，两艘商船在霍尔木兹海峡附近遭弹体击中后沉没。随着近10天来这个关键水道的袭击事件剧增，全球能源与航运安全再度引发高度担忧。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【10】"}, {"n": 11, "t": "伊朗据称正采用新战术来打击途经霍尔木兹海峡的船只，目标是让油价继续高企，从而打击美国总统特朗普和共和党在11月初中期选举的的选情", "b": "霍尔木兹海峡的船只，目标是让油价继续高企，从而打击美国总统特朗普和共和党在11月初中期选举的的选情。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【11】"}, {"n": 12, "t": "星链的使用，突然增加限制，乌军事先没有得到任何通知\n\r\n不能进攻、不能预警，而俄军已连续两天加紧摧毁乌能源设施\n\r\n乌克兰全社会", "b": "事先没有得到任何通知\n\n不能进攻、不能预警，而俄军已连续两天加紧摧毁乌能源设施\n\n乌克兰全社会的情绪是沮丧和愤怒，普遍认为这是Trump政府通过切断情报和星链，逼迫乌投降 \n乌克兰总统科技顾问称，美国科技巨头马斯克的SpaceX公司，在没有预告的情况下对处于移动状态的“星链”（Starlink）终端进行了网速限制，导致乌军多项军事任务中断，对俄罗斯空袭的防御能力降低。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【12】"}, {"n": 13, "t": "美国联邦检察官说，当局破获一个涉嫌利用虚假身份，让朝鲜人在美国企业从事远程资讯科技工作非法牟利的计划，两人遭逮捕，并查扣超过18", "b": "涉嫌利用虚假身份，让朝鲜人在美国企业从事远程资讯科技工作非法牟利的计划，两人遭逮捕，并查扣超过180台电脑。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【13】"}, {"n": 14, "t": "特朗普星期三（10月14日）在社媒发文说，格陵兰岛正准备展开“大规模”油气及矿产勘探。不过，他没有透露勘探计划的具体细节。", "b": "社媒发文说，格陵兰岛正准备展开“大规模”油气及矿产勘探。不过，他没有透露勘探计划的具体细节。\n他声称：“有专家指出，格陵兰岛容易开采的石油资源，远远超过世界上几乎任何其他地方。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【14】"}, {"n": 15, "t": "美国国会中期选举逼近，尽管预测显示共和党在众议院的选情比参议院严峻，但美国总统特朗普承认，共和党要保住参众两院控制权所面临的挑战", "b": "显示共和党在众议院的选情比参议院严峻，但美国总统特朗普承认，共和党要保住参众两院控制权所面临的挑战同样艰巨。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【15】"}, {"n": 16, "t": "美国联邦地区法官凯利（Timothy Kelly）星期二（10月13日）颁布“初步禁令”（preliminary injunct", "b": "thy Kelly）星期二（10月13日）颁布“初步禁令”（preliminary injunction）裁决，延续他9月24日发出的紧急命令，允许CNN、MS NOW和政治新闻网站Politico的记者继续进入白宫采访，直至法院作出最终裁决，除非上诉法院推翻禁令。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【16】"}, {"n": 17, "t": "“我不怀念欧洲的俄罗斯坦克。”", "b": "她呼吁继续支持乌克兰，并警告说，乌克兰的投降不会带来和平，而是会导致领土占领和苏联帝国主义的回归。\n“投降不是和平。\n“我不怀念那些碾压布拉格和布达佩斯起义的俄罗斯坦克。\n“我也不怀念柏林墙，”\n她的话语赢得了议院长时间的掌声。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【17】"}, {"n": 20, "t": "法国卢浮宫博物馆馆长警告，如果无法获得足够的资金对这座设施老旧且超负荷运转的博物馆进行全面翻修升级，卢浮宫将面临不得不向公众关闭", "b": "无法获得足够的资金对这座设施老旧且超负荷运转的博物馆进行全面翻修升级，卢浮宫将面临不得不向公众关闭的风险。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【20】"}, {"n": 23, "t": "根据 \u003c华尔街日报> 今天报道，Zacharia于2011年毕业于美国Pepperdine University法学院，随后参加", "b": "Zacharia于2011年毕业于美国Pepperdine University法学院，随后参加加利福尼亚州律师资格考试，但未能通过。同年夏天，她随丈夫前往中国北京，在知名的中伦律师事务所国际业务部门工作，主要参与跨境交易协议起草及客户沟通。\n尽管没有查到她在美国取得律师执照的记录，Zacharia多年来仍在Fox News等电视节目中自称律师，还曾担任川普盟友Richard Grenell创办的非营利组织Fix California的总法律顾问。川普宣布任命她为白宫新闻秘书时，也明确称她是一名律师。\n10月13日，记者追问她究竟在哪个州通过律师资格考试，Zacharia却回答：“我搬到中国的时候。”她随后强调，自己曾具备适当资格从事国际交易法律业务。\n知情人士解释，Zacharia在中伦的工作属于国际法律顾问性质，不需要取得中国或美国律师执照，正式法律意见由中国执业律师负责。白宫则强调，她并非受聘处理法律事务，并力挺其专业能力。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【23】"}, {"n": 27, "t": "我被伊朗的书店给震撼到了，什叶派穆斯林也在阅读中国耽美文学，还有各种全球最热的lgbtq+作品，包括诸如《天官赐福》《魔道祖师》", "b": "派穆斯林也在阅读中国耽美文学，还有各种全球最热的lgbtq+作品，包括诸如《天官赐福》《魔道祖师》《The Long Game》之类的，从英国少年纯爱，到美国冰球男男，再到中国古风耽美。在同性性行为违法的伊朗，墨香铜臭的男男爱情小说正堂而皇之地摆在街头书架上。\n@雷韵ly:是的，我们经常觉得如果一个政府限制某些自由，那么生活在那个社会的人们也必然至少内化了这些限制。但人有私密的思想和欲望，这些东西是不可能整齐划一地排列在某些意识形态之下的。书籍，幻想，好奇心，私下的反叛，还有与遥远世界的相遇，所有这一切都塑造着人的内心世界。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【27】"}], "tech": [{"n": 1, "t": "知情人士透露，首批上线的功能包含 Genmoji 自定义表情、通知摘要、写作工具以及从照片中移除特定元素等功能，即坊间俗称的「跑", "b": "含 Genmoji 自定义表情、通知摘要、写作工具以及从照片中移除特定元素等功能，即坊间俗称的「跑马灯」版本，而非 WWDC26 中发布的 Siri AI。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【1】"}, {"n": 2, "t": "一个国际研究团队发现，疑似来自中国的失控人工智能（AI）代理从腾讯云沙盒环境中越狱，试图入侵阿里旗下高德地图的系统，进一步加剧了", "b": "中国的失控人工智能（AI）代理从腾讯云沙盒环境中越狱，试图入侵阿里旗下高德地图的系统，进一步加剧了外界对于科技公司可能失去对AI控制的担忧。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【2】"}, {"n": 21, "t": "微软 XBOX 反应还挺快，看到最近大量逆向游戏的案例，就选择了拥抱，成立 XBOX LABS，一个由游戏创作者、工程师和科学家", "b": "ASHA®                                                             Gos\n@asha shar\n人 翻译自英语         ©\n今天我们将成立XBOX LABS (             ) 。以下是我发给团队的备忘\n录:\nBB,\n第一款电子游戏诞生于大约 75 年前。从那时起，行业经历了繁荣与低谷，\n但每年都有更多优秀的游戏可玩、更多设备可供游玩，最重要的是，玩家人\n数比以往任何时候都要多。这种增长帮助 XBOX 成就了今天的模样，而我们\n也反过来塑造了这个行业，从将硬盘引入游戏机和通过 Xbox Live 实现在线\n游戏，到 Game Pass 和云游戏，再到那些将数百万玩家聚在一起的系列作\n品。\n最近几周，我们看到游戏被迅速反编译并重建，以运行在原本从未设计支持\n的硬件上。Windows PC 版本已被移植到 Apple Silicon 上运行，或通过\nWebAssembly 和 WebGPU 移植到浏览器中运行，后者如今已接近全球\n90% 的浏览器支持。或许更令人惊讶的是，我们看到世界上许多最受欢迎\n的游戏已被改编成另一个游戏的源代码。\n这些实验挑战了我们行业长期以来的假设: 软件与硬件之间的束缚、创作与\n游玩之间的界限，以及人们发现和体验游戏的方式。虽然很难预测游戏的未\n来，但很容易看到让优秀游戏更容", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【21】"}, {"n": 22, "t": "美国八个州组成的跨党派联盟星期三（10月14日）向全国多地法院对OpenAI发起联合诉讼，指控OpenAI旗下的生成式人工智能（", "b": "三（10月14日）向全国多地法院对OpenAI发起联合诉讼，指控OpenAI旗下的生成式人工智能（AI）程序ChatGPT给当地居民造成实际伤害，甚至诱导包括青少年在内的用户自残或伤害他人。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【22】"}, {"n": 24, "t": "别慌，别人更惨", "b": "11:30\n《\nGey 11:26\n5)\n5\n大小    eee\n韩股暴跌8% 今年以来第十次触发熔\n断机制\n格隆汇10月15日 | 韩国KOSPI指数跌超8%触发熔\n断机制，交易暂停20分钟。这是韩国股市今年以\n来第十次触发熔断机制。\n自选~\n8 回 KOSDAQ Kosdaq Composite Index 757.81 -8.02%     a\nae se ac sm [ema -) 1 mR\nau\nom\n韩国综合指数\nKOSPI200 index\nosra00\njoe          Mi\neg            we\n=.             Ws\nONS\nPed\n2026-10-15\n一 te\nse\n外\nHowden compo\n\\\n最折价 Cd Om woe 8 4 ay > Oend\n(8) @ s# 内 we 4时 BK mK ORK\nom\n887.                      500%\n1258000                      ~\nme                      sah\nio                      5\nossoo\nED\n—_                      8.50%\noe ae\n—\n6.75万 阅读\neoe\n2. 说说你的看法", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【24】"}], "cult": []}}, {"date": "20261016", "label": "10月 arshield）卫星系统，相关指令直接来自美国白宫内部。\n\n路透社引述消息人士报道，美国战争部领导层此前收到通知，要求调慢面向乌克兰战区的星盾服务速度。\n\n消息人士没有说明白宫内由谁作出决定，也未透露由谁负责执行。美国战争部是星盾服务的最大客户。相关限制影响了乌军的#无人机#作战及前线行动。\nFoxNews首席国家安全记者报道：\n🛰️ Musk不承认“乌军使用星链，突然受限”与自己有任何关系，称“国防部的账号，由他们控制”\n美国、乌克兰官员已确认：没有继续受限，速度正在恢复\n路透社独家报道： 要求限制使用的命令，来自白宫，由国防部执行 \n乌军星链遭限速，美共和党议员警告：若政府机构参与，将削减其经费\n据《华尔街日报》10月14日报道，美国共和党籍众议员布莱恩・菲茨帕特里克警告，如果查明是美国政府限制了乌克兰军方的卫星通信，国会将采取行动，包括削减相关联邦机构的经费。他说，这是\"一个大问题\"，\"如果我们开始让乌克兰断联，必有后果，记住我的话\"，\"机构不履行职责，就别想拿到经费\"。\n\n乌方称，10月13日至14日，乌军使用的军用版星链终端\"星盾\"在毫无预警的情况下被设置了速度上限：终端移动速度超过约160公里/小时，连接就会中断。中程打击无人机和拦截无人机首当其冲，乌克兰总统办公室顾问别斯克列斯特诺夫称，\"多项任务因此失败\"。\n\n乌克兰驻美国大使馆临时代办西耶尼克当天紧急致信美国国会议员，警告这将让俄罗斯占据优势，也会削弱乌方拦截俄军对平民空袭的能力。当天晚间服务趋于稳定，但速度上限仍在。乌克兰国防部表示，正与合作伙伴和SpaceX谈判，以避免再出现突然限制。\n\n谁下令限速，目前没有定论。马斯克在社交平台X上表示，\"星盾\"归美国政府所有和控制，\"任何速度或使用限制都由美军、最终由总统决定\"。白宫拒绝回答相关问题，SpaceX不予置评，克里姆林宫称不掌握相关情况。\n\n乌方多名人士认为，这与特朗普要求基辅停止打击俄罗斯炼油厂有关。乌克兰议会外事委员会主席梅列日科称，此举\"看起来像是在勒索\"；但乌方没有提供直接证据。\n\n10月14日，众议院跨党派\"乌克兰党团\"的四位联合主席，民主党籍的卡普特、奎格利和共和党籍的菲茨帕特里克、威尔逊，联名对美方可能停止对乌情报共享并限制星链的报道表示\"深切关注\"。菲茨帕特里克此前还表示，将推动众议院强制表决，阻止购买俄罗斯石油。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【8】"}, {"n": 9, "t": "#乌克兰#与重要盟友#美国#再现裂痕，乌总统#泽连斯基#已下令恢复对#俄罗斯#炼油厂的打击行动，结束应美国总统#特朗普#呼吁而实", "b": "现裂痕，乌总统#泽连斯基#已下令恢复对#俄罗斯#炼油厂的打击行动，结束应美国总统#特朗普#呼吁而实施的“能源停火”。\n【乌克兰据报耗尽“爱国者”拦截弹 防空能力告急】知情人士称，#乌克兰#军方手中的美制“爱国者”防空拦截导弹已彻底耗尽。在俄军最新一轮弹道导弹袭击中，因缺乏拦截弹，几乎所有导弹均突防成功，乌克兰防空防线严重告急。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【9】"}, {"n": 10, "t": "美国有线电视新闻网（CNN）周四（10月15日）引述#美国#官员的话报道，美军已制定攻击伊朗的计划，一旦总统#特朗普#下令重启战", "b": "四（10月15日）引述#美国#官员的话报道，美军已制定攻击伊朗的计划，一旦总统#特朗普#下令重启战斗，可能动用包括俗称炸弹之母的GBU-43/B大型空爆弹，来轰炸伊朗的能源和核设施。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【10】"}, {"n": 11, "t": "#国际货币基金组织#（#IMF#）周四（10月15日）发表亚太区域经济展望报告，预计#亚太#经济增长将在今年和明年放缓，并警告美", "b": "#）周四（10月15日）发表亚太区域经济展望报告，预计#亚太#经济增长将在今年和明年放缓，并警告美伊战争引发的能源冲击、#人工智能#（#AI#）投资的调整和全球债券收益率高涨的外溢风险已提高。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【11】"}, {"n 措施，将助长莫斯科继续攻击乌克兰，", "b": "特朗普在制裁和对俄罗斯商品征收关税原定生效前几天，就决定豁免相关措施，将助长莫斯科继续攻击乌克兰，并担心美国接下来可能进一步放宽对俄制裁。\n泽连斯基说，特朗普最新的决定助长俄罗斯总统普京的气焰。“这只会让他们更加得意，更加想继续杀人。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【14】"}, {"n": 15, "t": "据《纽约时报》报道，南卡罗来纳州共和党参议员达琳・格雷厄姆周六谨慎地批评特朗普，称其将俄罗斯排除在制裁法之外。该制裁法由她已故的", "b": "州共和党参议员达琳・格雷厄姆周六谨慎地批评特朗普，称其将俄罗斯排除在制裁法之外。该制裁法由她已故的哥哥林赛倡导并以他的名字命名。\n\n格雷厄姆女士在一次竞选活动中告诉记者：“就我个人而言，我会选择向俄罗斯施压，要求其结束战争并降低汽油价格。因为我不信任普京，也不信任俄罗斯。”\n\n这使达琳与特朗普短暂决裂，可能会让她陷入尴尬的境地。达琳于7月被任命接替去世的哥哥，而她正在总统的支持下竞选完整任期。\n\n达琳担任参议员时间不长，立法记录不多。但她将自己在制裁方案中的作用视为自己最重要的成就之一。\n\n“我为《林赛・格雷厄姆制裁俄罗斯和伊朗法案》的通过感到无比自豪，”达琳本周在一次辩论中说道。“该法案赋予总统一些工具，如果他选择通过经济制裁来结束战争，就可以使用这些工具。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【15】"}, {"n": 16, "t": "美国财政部星期五（10月16日）公布的数据显示，尽管总统特朗普曾承诺削减政府开支，但美国2026财年的预算赤字总额扩大至1.99", "b": "）公布的数据显示，尽管总统特朗普曾承诺削减政府开支，但美国2026财年的预算赤字总额扩大至1.99万亿美元，较前一年的1.78万亿美元增加12%，创下自2021年以来的最高纪录。\n推高支出的一个主要原因是美国政府负债沉重导致利息负担飙升。美国政府今年8月债务总额突破40万亿美元，导致过去一个财年支付的债务利息剧增1440亿美元，达到创纪录的1.36万亿美元。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【16】"}, {"n": 19, "t": "我认为，从根本上说，他是一个关心他所理解的俄罗斯利益的人。他尊重总统的一个原因是，他认识到总统关心美国人民的利益。”", "b": "心他所理解的俄罗斯利益的人。他尊重总统的一个原因是，他认识到总统关心美国人民的利益。”\n最新消息： 尽管特朗普到处鼓吹赞美美国经济，称其为“黄金时代”，但副总统JD Vance还是承认美国经济正在恶化：\n“虽然这个国家并没有在两年内崩溃。但是我们现在确实很艰难。\n尽管我很想把一切都归咎于拜登，但现实是，巨额债务压力(40万亿美元)，巨额利息负担(年度利息支出约 1万亿至1.36万亿美元)，巨额财政赤字(2万亿美元)。表明我们正深陷泥潭，举步维艰。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【19】"}, {"n": 25, "t": "美国媒体现在有报道说，川普打算近期开除赫格塞思，让他背发动伊朗战争的黑锅", "b": "近期开除赫格塞思，让他背发动伊朗战争的黑锅", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【25】"}, {"n": 26, "t": "美国还是不是“为了自由、不惜代价”？", "b": "价”？\n我们是否已把权钱置于自由之上？\n俄乌之间的选择，给出最清晰的答案\n抛弃乌克兰，就是抛弃自由\n最终，我们自己的自由，也会失去", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【26】"}], "tech": [{"n": 4, "t": "事实上，陈广宇的第一次出圈发生在今年3月。当时，月之暗面Kimi发布技术报告《Attention Residuals》，对大模型", "b": "在今年3月。当时，月之暗面Kimi发布技术报告《Attention Residuals》，对大模型十年没有变化的核心结构残差连接行重新设计，这实现了OpenAI联合创始人Ilya Sutskever曾提出过的设想：把按时间先后顺序处理数据的LSTM网络“旋转90度”。用了这套新方法后，模型在计算时根据需要，自由决定去提取前面哪一层的信息。\n论文发出后，马斯克马上点评“让人印象深刻”，前OpenAI研究科学家Andrej Karpathy表示该研究真正践行了“Attention is All You Need”的理念，推理之父、前OpenAI研究副总裁Jerry Tworek也表示“深度学习2.0来了”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【4】"}, {"n": 11, "t": "13万买的比特币，现在6万了", "b": "13万买的比特币，现在6万了。\n1200的黄金，现在800了。\n32买的白银，现在14了。\n130万买的楼房， ESOS To Gay\n50万买的BBA，现在20多了。\n只有20多娶的老婆，现在0考\n了 3                                                  681\n@\n217\n2026 @ 10/15 © Thu                    te\n念@卢旭宁                          53", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【11】"}, {"n": 18, "t": "印尼气象、气候与地球物理局高级官员古斯万托星期五（10月16日）说，卫星图像显示，笼罩加里曼丹和苏门答腊的烟霾已蔓延至万丹省、西", "b": "官员古斯万托星期五（10月16日）说，卫星图像显示，笼罩加里曼丹和苏门答腊的烟霾已蔓延至万丹省、西爪哇省和雅加达，但尚不清楚这些烟雾是否已对地面空气质量造成影响。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【18】"}], "cult": [{"n": 8, "t": "张水华夺西安马拉松冠军，她以突破“230”的成绩，打破赛会纪录，奖金10万元", "b": "他打破了两小时30分大关的天线 *\n@张水华 - 21分钟前                             \u003c\n西马夺冠! 刷新个人PB，打破西马赛会纪录。        &\n421952, PoE, GeReek.. RAY", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【8】"}, {"n": 24, "t": "纳指10040年历史数据核查", "b": "纳指100 40年历史数据核查\n过去40年，纳指每年最大跌多少?\n以每个自然年的日收盘价计算“妖值 随后谷值\"的最大回向\n1966—2025 | SERNA}, THESE ere\n1986\n-18.0%\n12.0%\n2003                             2005\n-13.1%                                                                 -12.3%\n2007                             2009\n-11.5%                                                                 -18.6%\n2011             2012             2013\n16.1%             11.9%             6.0%\n2015             2016             2017\n-14.2%                         12.2%                           4.9%\n2019                           2020                           2021\n11.1%", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=1 <script>
var DATA = JSON.parse(document.getElementById('daily-data').textContent);
var DAYS = DATA.days;
var CATS = [
  {id:'econ', mark:'一', name:'经济与民生', sub:'消费 · 就业 · 楼市 · 社保 · 产业', nc:'var(--blue)', soft:'var(--blue-soft)'},
  {id:'soc', mark:'二', name:'社会与健康', sub:'法治 · 教育 · 医疗 · 食品安全', nc:'var(--green)', soft:'var(--green-soft)'},
  {id:'intl', mark:'三', name:'国际', sub:'中美 · 中东 · 俄乌 · 欧洲 · 亚洲', nc:'var(--red)', soft:'var(--red-soft)'},
  {id:'tech', mark:'四', name:'科技与财经', sub:'AI · 大模型 · 航天 · 芯片 · 股市', nc:'var(--purple)', soft:'var(--purple-soft)'},
  {id:'cult', mark:'五', name:'文化娱乐', sub:'影视 · 音乐 · 体育 · 人物 · 段子', nc:'var(--amber)', soft:'var(--amber-soft)'}
];
var WD = {0:'周日',1:'周一',2:'周二',3:'周三',4:'周四',5:'周五',6:'周六'};
var cur = DAYS[DAYS.length - 1].date;

function dayOf(dateStr){
  var y = +dateStr.slice(0,4), m = +dateStr.slice(4,6), d = +dateStr.slice(6,8);
  return WD[new Date(y, m-1, d).getDay()];
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderDay(dateStr){
  cur = dateStr;
  var day = null;
  for (var i=0;i<DAYS.length;i++){ if (DAYS[i].date === dateStr){ day = DAYS[i]; break; } }
  if (!day) return;
  document.getElementById('hd-date').textContent = '每日图卦 · ' + day.label + '（' + day.week + '）';
  document.getElementById('hd-title').textContent = day.title || '喷嚏图卦';
  var total = 0;
  CATS.forEach(function(c){ total += day.cats[c.id].length; });
  document.getElementById('hd-sub').textContent = day.label + ' · ' + total + ' 条 · 五类标签：经济与民生 / 社会与健康 / 国际 / 科技与财经 / 文化娱乐';
  var nav = '';
  CATS.forEach(function(c){
    nav += '<a href="#' + c.id + '" style="--nc:' + c.nc + '"><i></i>' + c.name + '</a>';
  });
  nav += '<a href="#top" class="to-top">回到顶部 ↑</a>';
  document.getElementById('nav-inner').innerHTML = nav;
  var panels = '';
  CATS.forEach(function(c, ci){
    var items = day.cats[c.id];
    panels += '<section class="panel" id="' + c.id + '" style="--sec:' + c.nc + ';--sec-soft:' + c.soft + '">'
      + '<div class="panel-head"><div class="panel-mark">' + c.mark + '</div>'
      + '<div class="panel-title">' + c.name + '<span>' + c.sub + ' · ' + items.length + ' 条</span></div></div>'
      + '<div class="panel-line"></div><div class="items">';
    items.forEach(function(it, i2){
      var wd = dayOf(dateStr);
      var full = items.length === 1 ? ' full' : '';
      var pcl = it.b.length > 90 ? 'clamp' : 'full';
      panels += '<article class="item' + full + '" data-ci="' + ci + '" data-i="' + i2 + '" title="点击查看全文"><div><div class="item-head">'
        + '<div class="src src-' + ['sun','mon','tue','wed','thu','fri','sat'][new Date(+dateStr.slice(0,4), +dateStr.slice(4,6)-1, +dateStr.slice(6,8)).getDay()] + '">' + wd + ' · ' + (it.n < 10 ? '0' : '') + it.n + '</div>'
        + '<a class="src-link" href="' + it.href + '" target="_blank" rel="noopener">来源</a></div>'
        + '<h3>' + esc(it.t) + '</h3><p class="' + pcl + '">' + esc(it.b.replace(/\s+/g,' ')) + '</p></div></article>';
    });
    panels += '</div></section>';
  });
  document.getElementById('panels').innerHTML = panels;
  // 检测正文是否超出 6 行 → 标记"点击查看全文"
  var itemsEls = document.querySelectorAll('.item p.clamp');
  for (var i=0;i<itemsEls.length;i++){
    var p = itemsEls[i];
    if (p.scrollHeight > p.clientHeight + 2){
      var art = p.closest('.item');
      art.classList.add('has-more');
    } else {
      p.className = 'full';
    }
  }
  bindModal();
  var btns = document.querySelectorAll('.day-btn');
  for (var i=0;i<btns.length;i++){
    btns[i].className = btns[i].getAttribute('data-date') === dateStr ? 'day-btn active' : 'day-btn';
  }
  var links = '';
  DAYS.forEach(function(d){
    links += '<div><span class="src">' + d.label + '</span><a href="https://www.dapenti.com/blog/more.asp?name=xilei&id=' + d.id + '" target="_blank" rel="noopener" title="' + esc(d.title) + '">' + esc(d.title) + '</a></div>';
  });
  document.getElementById('footer-links').innerHTML = links;
  document.getElementById('footer-note').textContent = '喷嚏图卦 · ' + DAYS[0].label + ' – ' + DAYS[DAYS.length-1].label + ' 日报 · ' + DAYS.length + ' 期 · 五主题分类 · 每日 18:00 自动更新';
  history.replaceState(null, '', '#' + dateStr);
}

function showDay(dateStr){ renderDay(dateStr); document.getElementById('top').scrollIntoView({behavior:'smooth'}); }

var curCat = '', curItem = null;
function bindModal(){
  var arts = document.querySelectorAll('.item');
  for (var i=0;i<arts.length;i++){
    arts[i].onclick = function(e){
      if (e.target.closest('.src-link')){ return; }
      var ci = +this.getAttribute('data-ci'), ii = +this.getAttribute('data-i');
      var it = DAYS.filter(function(d){ return d.date === cur; })[0].cats[CATS[ci].id][ii];
      openModal(CATS[ci], it, cur);
    };
  }
}
function openModal(cat, it, dateStr){
  var day = DAYS.filter(function(d){ return d.date === dateStr; })[0];
  document.getElementById('modal-tag').textContent = day.label + '（' + day.week + '） · ' + cat.name + ' · 序号 ' + it.n;
  document.getElementById('modal-title').textContent = it.t;
  document.getElementById('modal-body-text').textContent = it.b;
  document.getElementById('modal-src').innerHTML = '原文：<a href="' + it.href + '" target="_blank" rel="noopener">打开喷嚏网原文</a>';
  document.getElementById('modal-mask').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('modal-mask').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-mask').addEventListener('click', function(e){
  if (e.target === this){ closeModal(); }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ closeModal(); } });

window.addEventListener('hashchange', function(){
  var h = location.hash.slice(1);
  if (h && h.length === 8 && DAYS.some(function(d){ return d.date === h; })){ renderDay(h); }
});

renderDay(cur);
</script>

</body>
