最近关于社保的争议很大，我有几点\nHEIN:\n第一，社保缴纳基数应与实际工资一\n致，或者，应降社保最低缴纳基数和\n城市的最低工资一致，而非按照虚高\n的最低缴纳基数缴纳，特别是中小企\n业职员、灵活就业者应该如此。\n现在的社保基数太高、太贵了，老百\n姓社保负担太重，交不起了; 企业用\n人负担也重，特别是现金流薄弱一点\n的中小企业，不敢招人、用不起\nAo\n比如我们这，最低工资为2540元一\n月，但最低社保基数为7270元，相\nERX.\n一个人即使工资只有五干，也要按七\n千多缴，扣掉社保个税等，到手的可\n支配资金更少了，拿什么来消费和人生\n活? 这无论对个人生活，还是对社会\n经济发展、鼓励促进消费，都是不利\n的。\n职工每月至少要交2000多，灵活就\n业社保最低也要交2000多，没有工\n稳定工作、稳定收入、收入不高的\n人，根本承受不住。\n特别是，灵活就业者，数量本来就庞\n大，工资收入本来就不稳定、也不\n高，对高昂的灵活就业社保真的望而\n却步，交几个月可以，长期交几十年\n真交不起。\n对于灵活就业者的最低社保基数，应\n该降低到当地最低工资标准，减轻灵\n活就业者负担，或者设置由低到高多\n个档次，一两百、五六百、七八百、\n一和干多、两千多这样，让灵活就业者\n都可以根据收入情况自主选择交多\n少、交什么档位。\n第二，中小企业是吸纳就业人员", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【26】"}], "soc": [{"n": 3, "t": "库克、李彦宏、马化腾登上新闻联播，参加清华经管学院顾问委员会 2026 年会。", "b": "白发戴眼镜男性高管坐会议桌前，深色西装白衬衫黑领带，桌上摆麦克风矿泉水，背景木饰墙面（新闻联播配图）。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【3】"}, {"n": 4, "t": "#警方调查炸串摊主被差评后轻生#近日，四川宜宾高县一女摊主被顾客差评后跳河轻生，引发关注。死者家属向@中国新闻周刊介绍，33岁的", "b": "#近日，四川宜宾高县一女摊主被顾客差评后跳河轻生，引发关注。死者家属向@中国新闻周刊介绍，33岁的胡女士原本在当地摆摊卖炸串炸洋芋，10月6日，她接待了一位女顾客，对方因对菜量不满，在多平台发布差评。\n这位顾客在社交平台上发文称：“避雷某某铜锅洋芋，老板娘玩不起，嫌菜堆高了就不给加土豆。10块钱一份的炸菜，堆得多了就不让夹菜了。我买一份肯定要吃饱啊，玩不起开什么店子呢？后面直接就不给加土豆了，两份都没有加土豆，一脸高傲的样子，搞得好像谁欠你一样。” 随后，在相关贴文评论区出现了大量针对摊主的差评，胡女士曾在评论区回复解释。\n10月13日，胡女士的丈夫告诉@中国新闻周刊，该顾客购买的10元炸菜为自选模式，有20余种菜品任选，装满一筐后，再视情况给顾客添加炸土豆条，“我们是菜（夹）多了土豆就少，（菜）分量特别多的情况下，（土豆条）就加不了，我们都会给客户说的。” 胡女士曾公开表示，提供给该顾客的“两份炸菜份量对得起天地良心”。\n胡女士留下遗言称：“这两天我经历了在我心中的网暴，吃炸菜说没有加土豆，下面一些评论拥上来，有说服务差的，有说味道不好吃的。” 其坦言小摊经营压力大，“我每天睡觉不超过6小时，最后换来这样的避雷视频”。\n其丈夫表示，夫妻二人摆摊4年多以来，已积累了一些老客户，突然蜂拥而至的差评在当地传开了，“可能她心里就有这个包袱了”，家人也一直宽慰胡女士对此事“不要过度在意”。10月9日，胡女士还嘱咐丈夫把新买的土豆放到库房，怎料不久便发生了悲剧。\n10月13日，宜宾高县庆符镇政府工作人员告诉@中国新闻周刊，此事警方正在调查，镇政府配合相关工作。高县公安局政治处工作人员表示，事发后已第一时间处置，目前正在联合处理此事。\n胡女士去世后，有网友转而质疑该顾客言行，其曾在个人社交账号发文回应：“我清楚大家的惋惜与悲痛心情，我同样深感遗憾。但我发布的仅仅是本人真实的消费体验评价，无任何恶意、无任何煽动、无任何捏造事实。我觉得我不该因为一场意外悲剧被无限追责、被全网审判。” 目前，该内容已不可见。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【4】"}, {"n": 5, "t": "湖南省长暗访检查溶洞", "b": "委副书记、省长毛伟明以“四不两\n直\"方式，赴株洲市暗访检查溶洞污\n染问题排查整治和安全生产工作\nae KMS O\n省长暗访溶洞，随机拨打管护责任人\n电话", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【5】"}, {"n": 6, "t": "内地为什么要传这样的假消息", "b": "am730 @ .关注\nPe 1小时 .四\n李嘉诚最新一张露面照片，精神饱满思吏电动代步避\nNy\n#李嘉诚 #长和 #am730", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【6】"}, {"n": 7, "t": "受害者从8月开始出现手指麻木、双腿无力、失眠等症状，并发现办公室咖啡机冲泡的茶水味道异常。其妻子和大学教授随后展开调查，从咖啡机", "b": "双腿无力、失眠等症状，并发现办公室咖啡机冲泡的茶水味道异常。其妻子和大学教授随后展开调查，从咖啡机残留水中提取出63毫克含有丙烯酰胺的白色粉末。\n警方安装监控后发现，Wang曾翻动受害者办公桌、逐页拍摄其研究笔记，并用自己杯中的液体冲洗对方的杯子。调查还发现，Wang涉嫌去年夏天两次通过eBay购买丙烯酰胺，事后要求平台删除账户。\n受害者正在研究利用细菌将RNA送入人体细胞的新技术，涉及癌症、神经系统疾病和遗传疾病治疗，相关成果正在申请专利。指导教授Mark Gomelsky表示，Wang此前博士论文答辩失败，可能因此嫉妒成绩优异的受害者。\n10月5日，Wang接受警方询问，声称自己多年未使用丙烯酰胺。次日，她在洛杉矶国际机场准备返回中国时被捕，随身携带多台笔记本电脑、外置存储设备及研究文件。\nWang目前面临最高10年监禁及1万美元罚款，怀俄明州法官已将保释金提高至150万美元。受害者目前仍有左手失去知觉、注意力难以集中、容易疲劳等神经损伤症状，能否完全康复尚不确定。\n另外，目前没有证据证实Wang投毒的目的是窃取研究成果，嫉妒或科研竞争也尚未被司法机关认定为作案动机。相关指控仍有待法院审理。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【7】"}, {"n": 9, "t": "风险解除", "b": "我们中出了一个叛徒", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【9】"}, {"n": 18, "t": "由于厄尔尼诺现象导致河水暴涨，恐有泛滥的风险，阿根廷当局周一（10月12日）临时关闭了游客前往伊瓜苏瀑布（Iguazu Fall", "b": "恐有泛滥的风险，阿根廷当局周一（10月12日）临时关闭了游客前往伊瓜苏瀑布（Iguazu Falls）的通道。\n伊瓜苏国家公园说，周一伊瓜苏河流量破每秒1万2000立方米，达到正常平均流量的六倍以上。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【18】"}, {"n": 25, "t": "Apple Watch国行可以开通睡眠呼吸暂停了", "b": "可能出现睡眠\n呼吸暂停", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【25】"}], "intl": [{"n": 10, "t": "海事官员星期三（10月14日）证实，过去24小时内，两艘商船在霍尔木兹海峡附近遭弹体击中后沉没。随着近10天来这个关键水道的袭击", "b": "证实，过去24小时内，两艘商船在霍尔木兹海峡附近遭弹体击中后沉没。随着近10天来这个关键水道的袭击事件剧增，全球能源与航运安全再度引发高度担忧。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【10】"}, {"n": 11, "t": "伊朗据称正采用新战术来打击途经霍尔木兹海峡的船只，目标是让油价继续高企，从而打击美国总统特朗普和共和党在11月初中期选举的的选情", "b": "霍尔木兹海峡的船只，目标是让油价继续高企，从而打击美国总统特朗普和共和党在11月初中期选举的的选情。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【11】"}, {"n": 12, "t": "星链的使用，突然增加限制，乌军事先没有得到任何通知\n\r\n不能进攻、不能预警，而俄军已连续两天加紧摧毁乌能源设施\n\r\n乌克兰全社会", "b": "事先没有得到任何通知\n\n不能进攻、不能预警，而俄军已连续两天加紧摧毁乌能源设施\n\n乌克兰全社会的情绪是沮丧和愤怒，普遍认为这是Trump政府通过切断情报和星链，逼迫乌投降 \n乌克兰总统科技顾问称，美国科技巨头马斯克的SpaceX公司，在没有预告的情况下对处于移动状态的“星链”（Starlink）终端进行了网速限制，导致乌军多项军事任务中断，对俄罗斯空袭的防御能力降低。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【12】"}, {"n": 13, "t": "美国联邦检察官说，当局破获一个涉嫌利用虚假身份，让朝鲜人在美国企业从事远程资讯科技工作非法牟利的计划，两人遭逮捕，并查扣超过18", "b": "涉嫌利用虚假身份，让朝鲜人在美国企业从事远程资讯科技工作非法牟利的计划，两人遭逮捕，并查扣超过180台电脑。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【13】"}, {"n": 14, "t": "特朗普星期三（10月14日）在社媒发文说，格陵兰岛正准备展开“大规模”油气及矿产勘探。不过，他没有透露勘探计划的具体细节。", "b": "社媒发文说，格陵兰岛正准备展开“大规模”油气及矿产勘探。不过，他没有透露勘探计划的具体细节。\n他声称：“有专家指出，格陵兰岛容易开采的石油资源，远远超过世界上几乎任何其他地方。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【14】"}, {"n": 15, "t": "美国国会中期选举逼近，尽管预测显示共和党在众议院的选情比参议院严峻，但美国总统特朗普承认，共和党要保住参众两院控制权所面临的挑战", "b": "显示共和党在众议院的选情比参议院严峻，但美国总统特朗普承认，共和党要保住参众两院控制权所面临的挑战同样艰巨。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【15】"}, {"n": 16, "t": "美国联邦地区法官凯利（Timothy Kelly）星期二（10月13日）颁布“初步禁令”（preliminary injunct", "b": "thy Kelly）星期二（10月13日）颁布“初步禁令”（preliminary injunction）裁决，延续他9月24日发出的紧急命令，允许CNN、MS NOW和政治新闻网站Politico的记者继续进入白宫采访，直至法院作出最终裁决，除非上诉法院推翻禁令。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【16】"}, {"n": 17, "t": "“我不怀念欧洲的俄罗斯坦克。”", "b": "她呼吁继续支持乌克兰，并警告说，乌克兰的投降不会带来和平，而是会导致领土占领和苏联帝国主义的回归。\n“投降不是和平。\n“我不怀念那些碾压布拉格和布达佩斯起义的俄罗斯坦克。\n“我也不怀念柏林墙，”\n她的话语赢得了议院长时间的掌声。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【17】"}, {"n": 20, "t": "法国卢浮宫博物馆馆长警告，如果无法获得足够的资金对这座设施老旧且超负荷运转的博物馆进行全面翻修升级，卢浮宫将面临不得不向公众关闭", "b": "无法获得足够的资金对这座设施老旧且超负荷运转的博物馆进行全面翻修升级，卢浮宫将面临不得不向公众关闭的风险。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【20】"}, {"n": 23, "t": "根据 \u003c华尔街日报> 今天报道，Zacharia于2011年毕业于美国Pepperdine University法学院，随后参加", "b": "Zacharia于2011年毕业于美国Pepperdine University法学院，随后参加加利福尼亚州律师资格考试，但未能通过。同年夏天，她随丈夫前往中国北京，在知名的中伦律师事务所国际业务部门工作，主要参与跨境交易协议起草及客户沟通。\n尽管没有查到她在美国取得律师执照的记录，Zacharia多年来仍在Fox News等电视节目中自称律师，还曾担任川普盟友Richard Grenell创办的非营利组织Fix California的总法律顾问。川普宣布任命她为白宫新闻秘书时，也明确称她是一名律师。\n10月13日，记者追问她究竟在哪个州通过律师资格考试，Zacharia却回答：“我搬到中国的时候。”她随后强调，自己曾具备适当资格从事国际交易法律业务。\n知情人士解释，Zacharia在中伦的工作属于国际法律顾问性质，不需要取得中国或美国律师执照，正式法律意见由中国执业律师负责。白宫则强调，她并非受聘处理法律事务，并力挺其专业能力。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【23】"}, {"n": 27, "t": "我被伊朗的书店给震撼到了，什叶派穆斯林也在阅读中国耽美文学，还有各种全球最热的lgbtq+作品，包括诸如《天官赐福》《魔道祖师》", "b": "派穆斯林也在阅读中国耽美文学，还有各种全球最热的lgbtq+作品，包括诸如《天官赐福》《魔道祖师》《The Long Game》之类的，从英国少年纯爱，到美国冰球男男，再到中国古风耽美。在同性性行为违法的伊朗，墨香铜臭的男男爱情小说正堂而皇之地摆在街头书架上。\n@雷韵ly:是的，我们经常觉得如果一个政府限制某些自由，那么生活在那个社会的人们也必然至少内化了这些限制。但人有私密的思想和欲望，这些东西是不可能整齐划一地排列在某些意识形态之下的。书籍，幻想，好奇心，私下的反叛，还有与遥远世界的相遇，所有这一切都塑造着人的内心世界。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【27】"}], "tech": [{"n": 1, "t": "知情人士透露，首批上线的功能包含 Genmoji 自定义表情、通知摘要、写作工具以及从照片中移除特定元素等功能，即坊间俗称的「跑", "b": "含 Genmoji 自定义表情、通知摘要、写作工具以及从照片中移除特定元素等功能，即坊间俗称的「跑马灯」版本，而非 WWDC26 中发布的 Siri AI。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【1】"}, {"n": 2, "t": "一个国际研究团队发现，疑似来自中国的失控人工智能（AI）代理从腾讯云沙盒环境中越狱，试图入侵阿里旗下高德地图的系统，进一步加剧了", "b": "中国的失控人工智能（AI）代理从腾讯云沙盒环境中越狱，试图入侵阿里旗下高德地图的系统，进一步加剧了外界对于科技公司可能失去对AI控制的担忧。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【2】"}, {"n": 21, "t": "微软 XBOX 反应还挺快，看到最近大量逆向游戏的案例，就选择了拥抱，成立 XBOX LABS，一个由游戏创作者、工程师和科学家", "b": "ASHA®                                                             Gos\n@asha shar\n人 翻译自英语         ©\n今天我们将成立XBOX LABS (             ) 。以下是我发给团队的备忘\n录:\nBB,\n第一款电子游戏诞生于大约 75 年前。从那时起，行业经历了繁荣与低谷，\n但每年都有更多优秀的游戏可玩、更多设备可供游玩，最重要的是，玩家人\n数比以往任何时候都要多。这种增长帮助 XBOX 成就了今天的模样，而我们\n也反过来塑造了这个行业，从将硬盘引入游戏机和通过 Xbox Live 实现在线\n游戏，到 Game Pass 和云游戏，再到那些将数百万玩家聚在一起的系列作\n品。\n最近几周，我们看到游戏被迅速反编译并重建，以运行在原本从未设计支持\n的硬件上。Windows PC 版本已被移植到 Apple Silicon 上运行，或通过\nWebAssembly 和 WebGPU 移植到浏览器中运行，后者如今已接近全球\n90% 的浏览器支持。或许更令人惊讶的是，我们看到世界上许多最受欢迎\n的游戏已被改编成另一个游戏的源代码。\n这些实验挑战了我们行业长期以来的假设: 软件与硬件之间的束缚、创作与\n游玩之间的界限，以及人们发现和体验游戏的方式。虽然很难预测游戏的未\n来，但很容易看到让优秀游戏更容", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【21】"}, {"n": 22, "t": "美国八个州组成的跨党派联盟星期三（10月14日）向全国多地法院对OpenAI发起联合诉讼，指控OpenAI旗下的生成式人工智能（", "b": "三（10月14日）向全国多地法院对OpenAI发起联合诉讼，指控OpenAI旗下的生成式人工智能（AI）程序ChatGPT给当地居民造成实际伤害，甚至诱导包括青少年在内的用户自残或伤害他人。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【22】"}, {"n": 24, "t": "别慌，别人更惨", "b": "11:30\n《\nGey 11:26\n5)\n5\n大小    eee\n韩股暴跌8% 今年以来第十次触发熔\n断机制\n格隆汇10月15日 | 韩国KOSPI指数跌超8%触发熔\n断机制，交易暂停20分钟。这是韩国股市今年以\n来第十次触发熔断机制。\n自选~\n8 回 KOSDAQ Kosdaq Composite Index 757.81 -8.02%     a\nae se ac sm [ema -) 1 mR\nau\nom\n韩国综合指数\nKOSPI200 index\nosra00\njoe          Mi\neg            we\n=.             Ws\nONS\nPed\n2026-10-15\n一 te\nse\n外\nHowden compo\n\\\n最折价 Cd Om woe 8 4 ay > Oend\n(8) @ s# 内 we 4时 BK mK ORK\nom\n887.                      500%\n1258000                      ~\nme                      sah\nio                      5\nossoo\nED\n—_                      8.50%\noe ae\n—\n6.75万 阅读\neoe\n2. 说说你的看法", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196158#:~:text=【24】"}], "cult": []}}, {"date": "20261016", "label": "10月16日", "week": "周五", "id": "196177", "title": "现在看到的最利国利民的AI应用", "cats": {"econ": [{"n": 3, "t": "- 停止补贴后，全行业日均订单也稳定比开打之前多了5000万单；", "b": "也稳定比开打之前多了5000万单；\n- 淘宝闪购和美团的单量占比从当初的2:7变成了现在的4:6左右，京东抢下来的那个1又快没了；\n- 即便骑手规模回落，相比开打前仍多出了200万骑手，大部分都是自行接单的众包，跟站点签劳动合同的全职骑手数量反而在下降；\n- 肯德基、必胜客、达美乐等西式快餐的外卖订单占比已经被拉升到了全店一半以上；\n- 海底捞上半年营收增长16亿，其中10亿来自外卖，但净利润只多了940万，利润率连1%都不到；\n- 在中国，送外卖的单均收入已经低于东南亚、巴西等市场，同时，相比一年前，骑手的配送速度甚至又缩短了5分钟，效率完胜。\nsource：晚点小数据", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【3】"}, {"n": 7, "t": "【】深圳发布通告：11月1日起，深圳全市范围内机动车禁鸣喇叭，有效期5年。首次罚300元，三次后罚500元。", "b": "深圳全市范围内机动车禁鸣喇叭，有效期5年。首次罚300元，三次后罚500元。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【7】"}, {"n": 14, "t": "aaHAYMANCAPITALNANAGEI", "b": "aaHAYMANCAPITALNANAGEI\netl imagine losing a third of your money in a nation that\ngrown its GDP 500 percent.\n;  想象一下，在一   个GDP增长7500%的国家，  你损失了三分之", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【14】"}, {"n": 16, "t": "不能说一模一样，只能说几乎相同", "b": "&\nMichal Dokoupil @raztubyl.11小时       x\n幻 翻译自 捷克语\n中国汽车制造商已经进入了一个奇特的阶\n段。它们不再抄袭西方，而是开始互相抄\n袭。这一点在大牌高端\">SUV上表现得尤为\n明显，在巴黎车展上大约有七款这样的车\n型。从外观上还能勉强分辨 但内饰简直一\n模一样。\n它们全都搭载着外观完全相同的基于\nAndroid的软件，界面布局和功能也一模一\n样。仪表盘和中控台的设计完全相同，配置\neR, BOHR HAE Me\n复制粘贴，按钮和功能完全一致，而且它们\n都配备了相似的车顶屏幕 (只有Aito有投影\n仪) 。每辆车里都有完全一样的冰箱，温度\n范围相同，所有车门都通过同样笨拙的自动\n门系统开关。\n我之前试驾过其中几款，它们的动力系统和\n驾驶特性也几乎没有区别。很明显，这些车\n是按照表格和委员会的要求，在最短时间内\n用相同供应商的零件拼凑出来的。它们之间\n的差异甚至比我们经常批评的Stellantis车\n型还要小。\n这种情况在其他级别车型上也同样存在，我\n指的是那些彼此没有任何关联的中国汽车制\n造商的产品。它们大多拥有令人印象深亿的\n技术，但完全缺乏个性和原创性。 6\n它们的成功来说已经足够了，因为这\n是按照表格数据来采购的。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【16】"}], "soc": [{"n": 1, "t": "世界卫生组织专家建议，在有助于提高接种率的前提下，各国可考虑为低至4岁的女童开展人乳头瘤病毒（HPV）疫苗常规接种。", "b": "提高接种率的前提下，各国可考虑为低至4岁的女童开展人乳头瘤病毒（HPV）疫苗常规接种。\n根据世卫免疫战略咨询专家组（SAGE）主席斯科特，目前约有165个国家将HPV疫苗纳入国家免疫规划，但全球HPV疫苗接种率仅为33%，远低于90%的目标。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【1】"}, {"n": 2, "t": "据央视新闻，针对网络反映的“尊界V800汽车刹车踏板支架断裂问题”，工业和信息化部、中央网信办、市场监管总局高度重视，在前期调查", "b": "界V800汽车刹车踏板支架断裂问题”，工业和信息化部、中央网信办、市场监管总局高度重视，在前期调查工作基础上，成立联合调查组开展核查，并依法依规处理。有关情况将及时公布。\n余承东就“联合调查”表态：正义可能会迟到，但永远不会缺席", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【2】"}, {"n": 4, "t": "“七千多名退休职工，一年领走九亿元养老金”。近日，一组关于武汉大学离退休教职工人数及养老金总额在互联网上不胫而走，并引发热议。", "b": "亿元养老金”。近日，一组关于武汉大学离退休教职工人数及养老金总额在互联网上不胫而走，并引发热议。\n这组数据并非由武汉大学官方披露，而是自媒体结合该校退休人员人数，乘以平均每名退休人员每月1万元，再乘以12个月得出的年度总额。\n经财新核实，武汉大学离退休教职工人数有“七千多名”属实。据武汉大学离退休工作处2025年1月的消息，目前学校共有离退休教职工7424名。而“九亿元养老金”没有得到官方证实。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【4】"}, {"n": 5, "t": "来源:天河报四川日报", "b": "来源:天河报四川日报\n成都市市场监管局通报时配制酒中非法添庆两地那\n该成分功能类似 “PEEP, WBS 252.0857 EK...\nSib ath alee a oe oe Oo\n838 4481    447     291\n@ @庄时利和", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【5】"}, {"n": 18, "t": "再也不怕刹车踩断了", "b": "#Roadster 量产#网友鬼才啊", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【18】"}, {"n": 19, "t": "别这样算，再算下去，人类连唯一的节能优势都没了", "b": "& David @ @DavidSHolz .14小时                                   Bw\n人 翻译自英语 显示原文\n假设一个前沿模型是 GB300 NVL72 上的 10T MoE。那大约是每 token 5 焦\n耳，或者在人类思考速度下约 50 W，而我们的大脑是 20 W。电网的能源成本\n是 0.08 美元/千瓦时，吃米饭是 0.50 美元/千瓦时。所以从每思想的能源角度\n来看，目前我们和前沿模型竟然出奇地相似!\nO24          也145          @ 1,943        ha 145         As\n| Elon Musk @ BE Gm\n» @elonmusk\nO 翻译自英语 显示原文 ©\n有趣\n评价此翻译: © OD\n上午10:08 . 20264F10 A128 -7.45 查看", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【19】"}], "intl": [{"n": 6, "t": "2026年全球AI净利润约6370亿美元，其中，约3140亿美元流向美国，占比49%;2230亿美元流向韩国，占比35%;470", "b": "70亿美元，其中，约3140亿美元流向美国，占比49%;2230亿美元流向韩国，占比35%;470亿美元流向中国台湾，占比7.4%;260亿美元流向中国大陆，占比4.1%;142亿美元流向日本，占比2.2%;137亿美元流向欧洲，占比2.1%。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【6】"}, {"n": 8, "t": "多名#美国#及西方官员称，限制#乌克兰#在战场通信与无人机作战中使用的星盾（Starshield）卫星系统，相关指令直接来自美国", "b": "#乌克兰#在战场通信与无人机作战中使用的星盾（Starshield）卫星系统，相关指令直接来自美国白宫内部。\n\n路透社引述消息人士报道，美国战争部领导层此前收到通知，要求调慢面向乌克兰战区的星盾服务速度。\n\n消息人士没有说明白宫内由谁作出决定，也未透露由谁负责执行。美国战争部是星盾服务的最大客户。相关限制影响了乌军的#无人机#作战及前线行动。\nFoxNews首席国家安全记者报道：\n🛰️ Musk不承认“乌军使用星链，突然受限”与自己有任何关系，称“国防部的账号，由他们控制”\n美国、乌克兰官员已确认：没有继续受限，速度正在恢复\n路透社独家报道： 要求限制使用的命令，来自白宫，由国防部执行 \n乌军星链遭限速，美共和党议员警告：若政府机构参与，将削减其经费\n据《华尔街日报》10月14日报道，美国共和党籍众议员布莱恩・菲茨帕特里克警告，如果查明是美国政府限制了乌克兰军方的卫星通信，国会将采取行动，包括削减相关联邦机构的经费。他说，这是\"一个大问题\"，\"如果我们开始让乌克兰断联，必有后果，记住我的话\"，\"机构不履行职责，就别想拿到经费\"。\n\n乌方称，10月13日至14日，乌军使用的军用版星链终端\"星盾\"在毫无预警的情况下被设置了速度上限：终端移动速度超过约160公里/小时，连接就会中断。中程打击无人机和拦截无人机首当其冲，乌克兰总统办公室顾问别斯克列斯特诺夫称，\"多项任务因此失败\"。\n\n乌克兰驻美国大使馆临时代办西耶尼克当天紧急致信美国国会议员，警告这将让俄罗斯占据优势，也会削弱乌方拦截俄军对平民空袭的能力。当天晚间服务趋于稳定，但速度上限仍在。乌克兰国防部表示，正与合作伙伴和SpaceX谈判，以避免再出现突然限制。\n\n谁下令限速，目前没有定论。马斯克在社交平台X上表示，\"星盾\"归美国政府所有和控制，\"任何速度或使用限制都由美军、最终由总统决定\"。白宫拒绝回答相关问题，SpaceX不予置评，克里姆林宫称不掌握相关情况。\n\n乌方多名人士认为，这与特朗普要求基辅停止打击俄罗斯炼油厂有关。乌克兰议会外事委员会主席梅列日科称，此举\"看起来像是在勒索\"；但乌方没有提供直接证据。\n\n10月14日，众议院跨党派\"乌克兰党团\"的四位联合主席，民主党籍的卡普特、奎格利和共和党籍的菲茨帕特里克、威尔逊，联名对美方可能停止对乌情报共享并限制星链的报道表示\"深切关注\"。菲茨帕特里克此前还表示，将推动众议院强制表决，阻止购买俄罗斯石油。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【8】"}, {"n": 9, "t": "#乌克兰#与重要盟友#美国#再现裂痕，乌总统#泽连斯基#已下令恢复对#俄罗斯#炼油厂的打击行动，结束应美国总统#特朗普#呼吁而实", "b": "现裂痕，乌总统#泽连斯基#已下令恢复对#俄罗斯#炼油厂的打击行动，结束应美国总统#特朗普#呼吁而实施的“能源停火”。\n【乌克兰据报耗尽“爱国者”拦截弹 防空能力告急】知情人士称，#乌克兰#军方手中的美制“爱国者”防空拦截导弹已彻底耗尽。在俄军最新一轮弹道导弹袭击中，因缺乏拦截弹，几乎所有导弹均突防成功，乌克兰防空防线严重告急。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【9】"}, {"n": 10, "t": "美国有线电视新闻网（CNN）周四（10月15日）引述#美国#官员的话报道，美军已制定攻击伊朗的计划，一旦总统#特朗普#下令重启战", "b": "四（10月15日）引述#美国#官员的话报道，美军已制定攻击伊朗的计划，一旦总统#特朗普#下令重启战斗，可能动用包括俗称炸弹之母的GBU-43/B大型空爆弹，来轰炸伊朗的能源和核设施。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【10】"}, {"n": 11, "t": "#国际货币基金组织#（#IMF#）周四（10月15日）发表亚太区域经济展望报告，预计#亚太#经济增长将在今年和明年放缓，并警告美", "b": "#）周四（10月15日）发表亚太区域经济展望报告，预计#亚太#经济增长将在今年和明年放缓，并警告美伊战争引发的能源冲击、#人工智能#（#AI#）投资的调整和全球债券收益率高涨的外溢风险已提高。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【11】"}, {"n": 12, "t": "#美国#俄勒冈州一所小学星期四（10月15日）发生严重#枪击案#，造成包括三名儿童和一名成年人在内共四人死亡，另有至少两人重伤送", "b": "（10月15日）发生严重#枪击案#，造成包括三名儿童和一名成年人在内共四人死亡，另有至少两人重伤送医。涉案枪手已被当场击毙。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【12】"}, {"n": 13, "t": "#美国#总统#特朗普#星期四（10月15日）在社媒发文说，因2009年得克萨斯州胡德堡军事基地枪击案被判死刑的哈桑（Nidal ", "b": "10月15日）在社媒发文说，因2009年得克萨斯州胡德堡军事基地枪击案被判死刑的哈桑（Nidal Hasan），“仍将按计划被枪决”，但处决过程不会进行直播。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【13】"}, {"n": 17, "t": "从做生意的角度讲", "b": "二  @lazy_Hemis\nSJ Show translation\n从做生意的角度讲，不知道美国政府和SpaceX的\n作为是否损害了SpaceX本身及其他美国军火商在\n欧洲的潜在市场。\n星链和星盾原本凭借在乌克兰的出色表现做了一\n次完美的广告，如果美国的态度是维持对盟友的\n支持，诱导欧洲盟友也引进星盾，那么SpaceX成\n为未来最大的军火商之一都并非不可能。\n然而搞限速这种小动作，等于是把东西卖给客户\n后通过后门要挟 (波兰政府是在乌星链的最大付\n款方) ，这在任何一个国家的国防部门看来都将\n是不可接受的。\n欧洲必然会寻求替代方案，不仅是星链星盾，还\n会波及F-35、爱国者等传统尖端武器。谁也不会\n希望自己花大价钱买了东西却还要被供应商随时\n拿捏。那么可以想见，接下来对于达索、萨博等\n欧洲军工将是一波利好，而波音、洛马们不知会\n不会加川普的娘。\n限速的权限究竟是在马斯克还是白宫，已经不重\n要了，其对欧洲盟友造成的信任危机是难以弥补\n的，马斯克第一时间甩锅和白宫，看来他也不想彻\nRAR WHA.", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【17】"}], "tech": [{"n": 15, "t": "现在ai应用场景比较大就是写代码和生产视频，前者美国的模型更好，即便国内的很多写代码也是用美国的两家，后者国内的模型更好", "b": "中文在线称，中国55%的token 消耗指向\nAl短剧，如何看待这一现象?\n知乎. 689 个回答 - 1330 个关注 》\n十关注 PED\n人 18 人听过\n美国AI有六成token*都用在编程和办公自动化上\n面，说明美国都是人人内卷的工贼。中国人五成\n五用在短剧娱乐上，说明中国人拥有绝佳的松弛\n2026-10-13 08:17 - 美国", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【15】"}, {"n": 20, "t": "这个商业模式太好了，现在看到的最利国利民的AI应用。国内有没有人搞一下？太有前途了。 笑死了。", "b": "‘Super Niu @ @super Nius - 22h                            Gun\n卧槽笑死我了，这家公司建议立刻引进国内! !\n让几千万个Al假扮大区大妈主动被骗子骗…\n全天候接诈骗电话、回钓鱼短信。\n它们唯一的任务就是: 装偿、噶嘻、拖时间\n然后套出骗子的银行卡号、加密钱包和假网站，最后打包卖给银行和电信公司\n250 万次对话，硬生生浪费了骗子 17 年 的青春，甚至这家公司8月拿了815万\nFrom techcrunch.com\nOa           iss          © 902          tht 48K          Ast", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【20】"}], "cult": [{"n": 21, "t": "扎铁了老心！", "b": "12:56 @ …                              Sal\n\u003c oR mexen       ( 关注 ) >\n有没有哪部电视剧是用配角名字命名的?\n#电视剧#剧名#配角\n昨天 10:03 云南                              © 不喜欢\n共1733 条评论 三\na    让大家听到你的声音              a &\n大超\n人民的名义\n1小时前 天津 回复                   0974 ©\n2 说点什么.      OC 544 Ly 4 1733", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196177#:~:text=【21】"}]}}, {"date": "20261017", "label": "10月17日", "week": "周六", "id": "196191", "title": "个人是养老第一责任人", "cats": {"econ": [{"n": 4, "t": "经济日报：懂车帝作为抖音集团旗下的汽车信息与交易服务平台，一边对车企产品展开测评，一边又靠车企和经销商广告投放、线索导流获利。这", "b": "下的汽车信息与交易服务平台，一边对车企产品展开测评，一边又靠车企和经销商广告投放、线索导流获利。这样的商业模式，本质上集“裁判员”和“运动员”于一身，存在利益冲突，很难建立公信力。如果任其滥用非标极限测试，将测评“武器化”，今天受打击的是某个品牌，明天受打击的将是一家企业，最终受伤害 s://www.dapenti.com/blog/more.asp?name=xilei&id=196191#:~:text=【18】"}], "cult": []}}, {"date": "20261018", "label": "10月18日", "week": "周日", "id": "196199", "title": "社保服务进万家", "cats": {"econ": [{"n": 1, "t": "2023年7月一揽子化债措施推出后，城投债“网红城市”柳州所在的广西是12个化债重点省份之一，也是第一个申请央行应急流动性贷款工", "b": "出后，城投债“网红城市”柳州所在的广西是12个化债重点省份之一，也是第一个申请央行应急流动性贷款工具的省份。近日官方披露，2025年柳州债务规模较2023年底下降18%，柳州是如何化债的？\n2024年9月至2025年10月担任柳州市委书记的广西自治区统战部部长谭丕创，近日在《学习与研究》杂志上撰文称，柳州市穷尽一切手段、排除一切困难化解债务风险，毫不手软打击金融犯罪，一体推动市本级债务、市属融资平台金融债务规模和平均利率持续下降，债券、非标规模持续压减。据他披露，2025年柳州债务规模较2023年底下降18%，金融市场对柳州的信心不断提升。\n“很多地方政府都有债务，如果负债规模与当地经济发展、财力水平相匹配，能正常还债的，债务风险就在可控范围内。” 谭丕创称，化解债务风险，不是一下子把债务还清，而是要透过现象看本质，精准找出风险点，分类施策、靶向排雷，确保风险发现在早、处置在小，牢牢掌握化债工作主动权。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【1】"}, {"n": 2, "t": "“社保服务进万家”从口号到行动！", "b": "粤TV 报道：汕头公交改造为社保服务站，制服女工作人员在车厢内讲解，画面字幕“从人找政策变成政策找人”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【2】"}, {"n": 3, "t": "在《经济日报》原文评论区，这是目前点赞最多的精选留言。", "b": "RR BK                       1073 5\n无论懂车帝的测试资格如何，那几\n辆车刹车支架为什么会断车企应该\n有明确的回答，而不是顾左右而言\n他。如果怀疑懂车帝做了手脚，那\n该报警就报警。如果确实车有问\n题，该召回召回，那里那么多员员\n牌牌。做为一个负责任的企业，出\n问题不可怕，可怕的是甩锅推责。\nBF ARO\n“刹车门”不只拷问质量安全", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【3】"}, {"n": 6, "t": "既然是恶意，就应该找到他们，安排工作缴纳社保", "b": "人      =\nj  有\n二                                          A\nay           .\nj              25:29岁的失业率达到7.5%\nal   Se\n—       XN\nAT WEAN\n—\nS\n|\nsa\n=h\n(.\n~", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【6】"}, {"n": 7, "t": "近日，海关总署进出口食品安全局关注到澳大利亚药品管理局（TGA）发布通告称，2批次“SWISSE”品牌“Beauty Skin ", "b": "关注到澳大利亚药品管理局（TGA）发布通告称，2批次“SWISSE”品牌“Beauty Skin Regeneration+”产品被检出铅含量超出标准限值，企业将召回相关产品。目前，国内暂未发现涉事产品通过一般贸易渠道进口。\n蓝鲸记者发现，“Swisse Beauty Skin Regeneration+”目前在电商平台的代购渠道有售，单瓶售价约170元。不过在Swisse官方旗舰店，记者并未找到同款产品，只有一款相似的产品“DUAL Skin Regeneration”在售。客服告诉蓝鲸记者，该款抗糖丸之前店里有售，但目前已经下架。\n就铅超标问题，记者咨询官方客服，客服回应称，澳大利亚 TGA 评估结论称：这部分额外铅，仅相当于普通人日常膳食铅摄入的 伦・科恩主演的冒险喜剧舞台剧《The Popinjay Cavalier》定于明年3月在伦敦凤凰剧院开演，并计划在6月13日闭幕。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【22】"}, {"n": 23, "t": "一名家长，在停车场看到枪手打碎门玻璃、进入教学楼，立即从自己的车取出手枪，跑进楼里，听到枪声，找到枪手", "b": "门玻璃、进入教学楼，立即从自己的车取出手枪，跑进楼里，听到枪声，找到枪手\n一名老师，用手机砸到枪手，然后试图夺枪，正扭打在一起，家长赶到，朝枪手射击\n枪手当场死亡，学生已死三名、老师已死一名\n家长的行为，救了很多人的命\n他三十六岁，两个女儿在这所学校，有合法持枪证", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【23】"}, {"n": 26, "t": "今何在 · 不论哪国车刹车能被“恶意”踩断我都不会买的 倒是有些人的态度会因为它是国产和外国车而倒转吗？信任就去买 不信就不买 ", "b": "不论哪国车刹车能被“恶意”踩断我都不会买的 倒是有些人的态度会因为它是国产和外国车而倒转吗？信任就去买 不信就不买 但你信任你自己却不买让别人去买就不对了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【26】"}], "intl": [{"n": 12, "t": "俄罗斯总统普京星期五（10月16日）说，俄罗斯正在乌克兰境内靠近俄乌边界划设安全区，并强调在未来与基辅举行的任何和平谈判中，这一", "b": "6日）说，俄罗斯正在乌克兰境内靠近俄乌边界划设安全区，并强调在未来与基辅举行的任何和平谈判中，这一安排都不容谈判。\n普京也重申，完全夺取顿涅茨克是俄罗斯的主要目标之一，并指乌军目前只控制顿涅茨克东部略多于10%的区域。\n在普京展现强硬立场之际，美乌外交关系陷入严峻危机。美国总统星期五签署一项行政命令，豁免多项原定未来几天生效的对俄制裁和关税措施。特朗普在行政命令中称，豁免这些措施符合美国的国家利益。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【12】"}, {"n": 13, "t": "美国中央司令部声称，伊朗经历九个月的战争和美国的经济封锁后已陷入财务困顿，长期获德黑兰支持的黎巴嫩真主党、加沙地带哈马斯和伊拉克", "b": "个月的战争和美国的经济封锁后已陷入财务困顿，长期获德黑兰支持的黎巴嫩真主党、加沙地带哈马斯和伊拉克什叶派民兵等代理人组织，如今甚至须要反向汇款，救济以往的金主。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【13】"}, {"n": 14, "t": "乌克兰总统泽连斯基说，美国总统特朗普在制裁和对俄罗斯商品征收关税原定生效前几天，就决定豁免相关措施，将助长莫斯科继续攻击乌克兰，", "b": "特朗普在制裁和对俄罗斯商品征收关税原定生效前几天，就决定豁免相关措施，将助长莫斯科继续攻击乌克兰，并担心美国接下来可能进一步放宽对俄制裁。\n泽连斯基说，特朗普最新的决定助长俄罗斯总统普京的气焰。“这只会让他们更加得意，更加想继续杀人。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196199#:~:text=【14】"}, {"n": 15, "t": "据《纽约时报》报道，南卡罗来纳州共和党参议员达琳・格雷厄姆周六谨慎地批评特朗普，称其将俄罗斯排除在制裁法之外。该制裁法由她已故的", "b": "州共和党参议员达琳・格雷厄姆周六谨慎地批评特朗普，称其将俄罗斯排除在制裁法之外。该制裁法由她已故的哥哥林赛倡导并以他的名字命名。\n\n格雷厄姆女士在一次竞选活动中告诉记者：“就我个人而言，我会选择向俄罗斯施压，要求其结束战争并降低汽油价格。因为我不信任普京，也不信任俄罗斯。”\n\n这使达琳与特朗普短暂决裂，可能会让她陷入尴尬的境地。达琳于7月被任命接替去世的哥哥，而她正在总统的支持下竞选完整任期。\n\n达琳担任参议员时间不长，立法记录不多。但她将自己在制裁方案中的作用视为自己最重要的成就之一。\n\n“我为《林赛・格雷厄 ": "《2026年9月份社会消费品零售总额主要数据》，包含9月单月以及1―9月累计的社会消费品零售情况。", "b": "售总额主要数据》，包含9月单月以及1―9月累计的社会消费品零售情况。\n其中有几个值得关注的数字：\n社会消费品零售总额：9月为42,433亿元，同比增长1.1%。\n餐饮收入：9月4,603亿元，同比增长2.1%。\n商品零售额：9月37,830亿元，同比增长1.0%。\n汽车类零售额：9月3,641亿元，同比下降21.2%，降幅非常明显。\n通讯器材类：同比增长31.1%，表现突出。\n金银珠宝类：同比下降9.6%。\n限额以上单位商品零售额：同比下降2.5%，弱于整体商品零售增速。\n一个值得深入讨论的现象是：整体消费仍在增长，但增长幅度较低，而且不同消费品类之间出现明显分化。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【2】"}, {"n": 4, "t": "各单位注意了，员工自愿放弃社保：无效。", "b": "自愿放弃无效，单位欠缴社保最高罚3倍!\n新规将施行\ndug, ABB", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【4】"}, {"n": 7, "t": "我记得以前医保谈判宣传案例的时候都突出砍价水平，当时还有个词叫灵魂砍价，现在企业报低价成反面典型了，风向变得快。", "b": "候都突出砍价水平，当时还有个词叫灵魂砍价，现在企业报低价成反面典型了，风向变得快。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【7】"}, {"n": 11, "t": "你是怎么看待年轻人活在当下不交社保", "b": "你是怎么看待年轻人活在当下不交社保\n的?\n知平 . 1,926 个回答 . 3111 个关注 》\n¥\né) 花昔音 ©               +关注 宵\n544 人赞同了该回答 》                        A3 Amit\n“先生您好，您这边消费1.8w。”\n“不是，我就吃了碗有子面”\n“是的先生，上一桌消费了17988 ，但是他\n们逃单\n7", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【11】"}, {"n": 20, "t": "斯里兰卡能源部长卡鲁纳蒂拉卡（Anura Karunathilaka）说，这场大停电的具体原因仍在调查中，但工程师怀疑，太阳能发", "b": "Anura Karunathilaka）说，这场大停电的具体原因仍在调查中，但工程师怀疑，太阳能发电量可能超出了当时的实际用电需求，导致电网失衡跳闸。\n当局当天多次呼吁屋顶太阳能系统业主，切断系统与电网的连接以协助稳定电网后，供电系统才得以恢复运作。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【20】"}, {"n": 27, "t": "就叫熊太行也行", "b": "这就是《我的大叔》里那个胡同的大叔们，过去都是大企业的部长，现在都在干保洁、小吃店、送货……只有踢球的时候才能凑起来叙旧。还宽慰主角家老太太说，上大学带来的工作只有二十年，大家都一样，早晚都要干体力活的。 \n \n \n四个一线城市新房售价同比下降0.5%，北京数据拖累明显，新房售价跌2.7%。广州和深圳分别降1.1%和1.0%，上海上涨2.8%。二手房北京降幅达到2.5%，广州和深圳分别下降2.9%和1.5%，上海上涨0.8%。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【27】"}], "soc": [{"n": 3, "t": "10月15日，中朝新鸭绿江大桥正式开通。", "b": "中朝新鸭绿江大桥开通仪式现场：白色桥塔拉索、红毯列队，大屏显示中朝国旗，2024年10月15日。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【3】"}, {"n": 5, "t": "山东一“仙人跳”团伙被诉：", "b": "山东一“仙人跳”团伙被诉: 女局长被敲诈\n19万，三受害人曾被采取刑事措施\nagg Sa\n一个以00\"后为主要成员、包括多名在校大学生在内的犯罪团伙 ，在短短一年多时间\n内，先后实施\"仙人跳'38起，吉诈得手155万余元。其中，有三人因识破敲诈拒不支\n付钱款 “仙人跳'团伙成员报警后，该三名受害人被采取刑事强制措施。\n山东省泰安市泰山区检察院起诉书显示 ,为加强对成员的控制，生于2001年的主犯\n陈某在敲诈得款后，!以洗钱 为由将犯罪所得资金集中统一支配。同时，陈某还伙同\n他人向部分成员提供\"放贷 或\"借款”，以此捆绑并驱使该部分成员持续实施犯罪。\n期间，陈某为成员支付住宿、餐饮、整容、酒吧消费等费用，展示其经济实力\n达到激励与控制成员的双重目的，逐步形成以陈某为纠集者的13人恶势力犯\n伙。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【5】"}, {"n": 8, "t": "10月14日报道，安徽合肥，人大本科、港中文硕士，在北京媒体和大厂拿过20万元年薪，罗颖（化名）辞职回合肥，考编上岸成了一所大专", "b": "大本科、港中文硕士，在北京媒体和大厂拿过20万元年薪，罗颖（化名）辞职回合肥，考编上岸成了一所大专的老师，到手月薪九千元。她把自己的经历发到社交账号，评论两极分化。罗颖告诉@九派新闻，她觉得大家可能过度强调了学历的重要性，它也许会是工作的敲门砖，但它只能保证人生的下限，“你有一个不错的学历，就可能拥有更多的机会、平台、资源，大概率不会过得太差，而最终的路怎么走，走得多远，还是看自己的选择和个人能力。”学历终究只是学习能力的证明，不能定义全部。”罗颖说，自己经历过媒体、大厂，最后选择做老师，“这不是‘退而求其次’或者‘想通了要躺平’，是在试过很多种可能性之后，找到的一条适合自己且让我有热情的道路。”她表示，这份工作有劣势，最明显的是薪资，其次是人际关系比企业要复杂，但优势也是实实在在的：稳定、有寒暑假、有自己的时间、工作的意义更清晰。她表示，考了什么大学就应该去找一个什么类型的工作，这是社会对人们的期待，最重要的是要问清自己的答案，知道自己内心真正想要什么，这需要有稳定的内核。遵从内心的想法，然后对自己的选择负责。\n \n罗颖坦言，在北京有一种感觉，「那么多灯火亮着，我始终不属于这里。」", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【8】"}, {"n": 10, "t": "警方提示", "b": "警方 提示\n凡是让你\"先交钱、后返利”的，都是\n诈骗。\n乌鲁木齐公安 @\n“先交钱、后返利”? 都是诈骗!", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【10】"}, {"n": 19, "t": "加州在上个月首次记录到长鳍大眼鲷（longfin bigeye），也首次迎来海龟筑巢产卵。而黄腹海蛇、鲸鲨、双髻鲨、飞鱼和蝠鲼等", "b": "鲷（longfin bigeye），也首次迎来海龟筑巢产卵。而黄腹海蛇、鲸鲨、双髻鲨、飞鱼和蝠鲼等热带海洋生物也在近海现身。在无人机和影像技术的普及下，加州海岸线正上演着一场日益清晰且令人惊叹的视觉盛宴。\n每隔数年发生一次的厄尔尼诺现象，将温暖的海水推向更北的水域，并随之带去热带物种。而在厄尔尼诺到来之前，加州也刚刚经历了持续的海洋热浪，以及一连串的东太平洋飓风。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【19】"}, {"n": 21, "t": "兽爷", "b": "欧式古典石质建筑夜间大火：塔楼倾斜坍塌、浓烟火焰冲天，多名 POLICE 警察背对镜头现场处置。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【21】"}, {"n": 26, "t": "“个人是养老第一责任人”，看到有的地方上在舆论场上这样宣扬，我觉得不合适。至少效果是不好的。\n\r\n养老当然首先是个人的事，是家庭", "b": "有的地方上在舆论场上这样宣扬，我觉得不合适。至少效果是不好的。\n\n养老当然首先是个人的事，是家庭的事，这是常识，不用教育大家就懂，中国人对此尤其懂。但国家和社会也有责任，特别是中国曾长期计划生育，当年一些地方还打出过“只生一个好，国家来养老”的宣传口号。事实上，面对中国步入老龄社会，国家和社会都在做出帮助少子独子老人安享晚年生活的巨大努力，比如很多城市大一点的社区都办起了社区食堂，政府有补助，食堂饭菜非常便宜，可以加很少的钱往家里送餐，帮助缓解了很多老人的吃饭问题，多数社区还主要针对老人不定期举办活动。这些都是实实在在的努力和帮助。我相信，山东各地也做了很多这样的工作。\n\n但是有的地方上发这样的视频，很生硬，让人感觉像是要甩责任，这与各地政府和社会的实际做法也不一致。不知道视频展现的发布会是否也说了很多其他的话，但做这样的切片拿到互联网上播放，给人的观感方向挺不舒服的，而且没有反映出当前社会围绕养老共同做出的努力。我怀疑，这是地方上小编缺少经验的发布会切片作品。\n各地还是应该在舆论场上多强调政府和社会组织对居民养老应当开展的工作，包括兜底的保障工作。这会给人温暖和踏实感。放心，中国老百姓不会真在养老问题上什么依赖官方组织的，大家都知道：更多得靠自己。\n \n \n“只生一个好，国家来养老”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【26】"}], "intl": [{"n": 12, "t": "法国多地星期六（10月17日）爆发大规模示威，原本数十万人举行和平参与游行，抗议生活成本持续上涨，以及公共服务日益恶化。", "b": "爆发大规模示威，原本数十万人举行和平参与游行，抗议生活成本持续上涨，以及公共服务日益恶化。\n 【马克龙谴责抗议冲突中“肆无忌惮”暴力行为】#法国#全国多座城市举行的大规模抗议演变为暴力事件后，总统#马克龙#在公开演讲中谴责这些肆无忌惮的暴力行为，并警告如有必要，政府会在未来几天禁止一些集会活动。\n马克龙在星期天（10月18日）晚间的电视公开演讲中做出上述表态。不过，他没有宣布进入紧急状态或实施宵禁等极端管制措施。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【12】"}, {"n": 13, "t": "#美国#总统#特朗普#再次为他与#俄罗斯#总统#普京#达成的美俄柴油供应协议辩护，指协议是为了避免将莫斯科推离和平谈判桌。", "b": "与#俄罗斯#总统#普京#达成的美俄柴油供应协议辩护，指协议是为了避免将莫斯科推离和平谈判桌。\n特朗普星期天（10月18日）也在社交媒体Truth Social发文，批评#乌克兰#总统#泽连斯基#借着欧洲盟友提供的军事援助，拖延这场已进入第五个年头的#俄乌战争#。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【13】"}, {"n": 14, "t": "#美国#总统#特朗普#公开表态，支持#以色列#总理#内坦亚胡#在即将举行的国会选举中争取连任，称他是美国所需要的合作伙伴。", "b": "支持#以色列#总理#内坦亚胡#在即将举行的国会选举中争取连任，称他是美国所需要的合作伙伴。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【14】"}, {"n": 15, "t": "距离#美国中期选举#不到三周，#共和党#受总统#特朗普#低迷的支持率及#美伊战争#带来的经济压力拖累，不仅#众议院#控制权岌岌可", "b": "#共和党#受总统#特朗普#低迷的支持率及#美伊战争#带来的经济压力拖累，不仅#众议院#控制权岌岌可危，连原本存有一线希望的#参议院#也面临失守风险。\n\n自今年2月底特朗普对#伊朗#开战以来，#美国#选民对经济形势日益严峻的失望和不满，已为共和党11月3日的选情奠定沉重基调。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196229#:~:text=【15】"}, {"n": 16, "t": "也门消息人士透露，阿联酋已同意重新介入也门冲突，恢复向也门南部部分政府部队提供资金，支持他们对抗胡塞武装。作为交换，沙特阿拉伯将", "b": "重新介入也门冲突，恢复向也门南部部分政府部队提供资金，支持他们对抗胡塞武装。作为交换，沙特阿拉伯将为这些反胡塞武装部队提供空中掩护。", "href": "https://www.dapenti.com/blog/more.asp?nam 剧之后的第四大全球性视听产品新业态。", "b": "国家广电总局: 中国微短剧成为\n第四大全球性视听新业态\nany\n0月20日 在广西北海举行的中国 一 东盟视听周期间\n国家广播电视总局发布\n《中国一东盟微短剧国际传播发展报告》\n报告显示 中国微短剧正成为继美国电影 日本动画\n韩国电视剧之后的第四大全球性视听产品新业态", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【5】"}, {"n": 12, "t": "素拉沙指出，赴泰国观光的普通游客不可能在街头随意被人强行绑上双手双腿押上车送往边境。“如果游客是真诚来泰国旅游，无意前往其他国家", "b": "客不可能在街头随意被人强行绑上双手双腿押上车送往边境。“如果游客是真诚来泰国旅游，无意前往其他国家，这种事情不太可能发生。”\n素拉沙解释，许多涉案人员往往在原籍国就已经与犯罪团伙建立联系，被高薪或虚假项目诱骗出境。他也说，这类安全问题似乎“只出现在中国游客”，来自其他国家的游客没有遭遇类似情况，这印证了相关人员是遭到针对性的诱骗。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【12】"}, {"n": 13, "t": "伊朗伊斯兰革命卫队旗下媒体星期二（10月20日）发表声明称，这两艘油轮试图经由霍尔木兹海峡南侧的一条“非法”航线通过时触碰水雷，", "b": "二（10月20日）发表声明称，这两艘油轮试图经由霍尔木兹海峡南侧的一条“非法”航线通过时触碰水雷，导致船只爆炸起火并被迫停航。\n声明警告称，试图穿越海峡内布设水雷区域属于“非法”行为，将导致“违规者”的资产被焚毁。若美方继续此类“恶意行径”，石油公司将面临更惨痛的代价。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【13】"}, {"n": 14, "t": "伊朗外长阿拉格齐星期二（10月20日）在一段电视采访中说，伊朗提出协助沙特阿拉伯与也门胡塞武装展开谈判、结束双方冲突，但至今尚未", "b": "20日）在一段电视采访中说，伊朗提出协助沙特阿拉伯与也门胡塞武装展开谈判、结束双方冲突，但至今尚未收到沙特或胡塞武装的回应。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【14】"}, {"n": 15, "t": "俄罗斯扩大对乌克兰能源基础设施的袭击范围，从东部和中部延伸至此前未遭攻击的西部地区，导致多地停电。", "b": "的袭击范围，从东部和中部延伸至此前未遭攻击的西部地区，导致多地停电。\n路透社报道，乌克兰能源部副部长涅克拉索夫星期二（10月20日）说，俄军持续蓄意且有系统地攻击乌克兰能源设施，最新袭击波及中部基洛沃格勒州（Kirovohrad）、西部利沃夫、日托米尔、罗夫诺（Rivne）、捷尔诺波尔（Ternopil）和赫梅利尼茨基州（Khmelnytsky），以及南部敖德萨州，造成部分地区停电。\n特朗普近期放宽对俄罗斯的制裁，并多次批评泽连斯基，导致美乌关系恶化。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【15】"}, {"n": 16, "t": "特朗普星期二（20日）敦促乌克兰通过达成协议结束战争，并称莫斯科希望尽快达成协议。他告诉记者：“乌克兰必须有意愿结束这场战争。”", "b": "兰通过达成协议结束战争，并称莫斯科希望尽快达成协议。他告诉记者：“乌克兰必须有意愿结束这场战争。”\n特朗普还暗示，俄罗斯在战场上占据上风，因为“俄罗斯是一台庞大的机器――它们只是不停地向前推进，而这正是它们一直在做的。它们已经占领了大片土地。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【16】"}, {"n": 17, "t": "美国总统特朗普面对支持率屡创新低的困局，试图将法国大规模示威浪潮与移民问题画上等号，借此捞取政治资本。他警告美国选民，除非共和党", "b": "低的困局，试图将法国大规模示威浪潮与移民问题画上等号，借此捞取政治资本。他警告美国选民，除非共和党在中期选举中获胜，否则法国骚乱的情景就会在美国上演。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【17】"}, {"n": 18, "t": "美国官员及知情人士称，是马斯克上星期下令对乌克兰依赖的“星链”（Starlink）卫星服务的军用版本实施限速。", "b": "上星期下令对乌克兰依赖的“星链”（Starlink）卫星服务的军用版本实施限速。\n马斯克上周曾说，无论是降低运行速度，还是限制卫星使用，相关决定都是由美国军方或总统作出的。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【18】"}, {"n": 19, "t": "轨道追踪数据显示，一颗俄罗斯卫星上周末移动至距离一颗支持乌克兰军方行动的欧洲商业卫星仅约100米处，引发外界对莫斯科太空活动的担", "b": "星上周末移动至距离一颗支持乌克兰军方行动的欧洲商业卫星仅约100米处，引发外界对莫斯科太空活动的担忧。\n俄罗斯卫星不仅接近了芬兰卫星，还刻意调整自身轨道，与对方的轨道高度吻合。\n这一事件引起太空专家关注。他们指出，如此近距离接近其他卫星，可能是为了检查、监视或干扰对方的卫星。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【19】"}, {"n": 20, "t": "欧盟委员会主席冯德莱恩星期二公布新的“北极战略”时说，俄罗斯正在北极重建军事存在，“当我们看到这个地区的主权、领土和维系安全的条", "b": "布新的“北极战略”时说，俄罗斯正在北极重建军事存在，“当我们看到这个地区的主权、领土和维系安全的条规已不能被视为理所当然，我们必须应对，改变我们的战略姿态”。\n她说：“北极是地缘政治板块正在碰撞的地区。而这里并不是其他人的疆域，而是欧盟的一部分”。欧盟27国中，丹麦、芬兰和瑞典都是北极圈国家。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【20】"}, {"n": 21, "t": "朝鲜威胁在韩朝边境增派战术打击力量，并考虑恢复对韩扩音器广播后，韩国军方星期二（10月20日）警告，若朝鲜进一步挑衅，将坚决反制", "b": "力量，并考虑恢复对韩扩音器广播后，韩国军方星期二（10月20日）警告，若朝鲜进一步挑衅，将坚决反制，不排除恢复对朝扩音器广播。\n这是自2000年以来，朝鲜首次主动预告可能恢复对韩扩音器广播。分析人士警告，双方持续军事对峙，增加边境擦枪走火的风险。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【21】"}, {"n": 23, "t": "英国哈里王子说，希望与父亲英国国王查尔斯三世及其他王室成员和解，修复多年来紧张的家庭关系。", "b": "国王查尔斯三世及其他王室成员和解，修复多年来紧张的家庭关系。\n现年42岁的哈里近日与妻子梅根及两名子女迁回英国。他接受《GQ》杂志访问时说：“世界上发生了这么多事情，最重要的是和解。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【23】"}, {"n": 24, "t": "日本已启动全球首个从火星圈采样返回的任务，这项任务或有助于解开太阳系与地球生命起源之谜。", "b": "返回的任务，这项任务或有助于解开太阳系与地球生命起源之谜。\n日本宇宙航空研究开发机构（JAXA）周二（10月20日）凌晨从鹿儿岛县种子岛宇宙中心发射了搭载火星卫星探测器（Martian Moons eXploration，简称MMX）的H3运载火箭。一个多小时后，JAXA宣布MMX成功与H3火箭分离，踏上飞往火星系统的征途。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【24】"}, {"n": 25, "t": "美国国务院8月10日发布的最新数据曾显示，自特朗普于2025年1月开启第二任期以来，政府已吊销超过17.5万份签证。", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id 含提前离职奖励。奔驰提供\n的最高补偿金额约为 50 万欧元 (现汇率约合 375.1 万元人\n民币) 。\n在补偿金的领取方式上，员工可以选择分期领取、一次性\n领取，也可以将部分款项转入公司养老金计划或直接保\n险，还可以组合使用上述方式。对于在年满 55 岁的员工，\n宝马还会在部分附加福利方面将其视为退休人员，包括新\n车和二手车购买相关的员工优惠。\n受离职补偿影响，约有 4 万名员工登录宝马内部人力资源\n门户查看自己能够获得的补偿金额，结果导致该系统在数\n小时内便因访问量过大而出现故障。宝马于次日修复了相\n关系统，但申请数量仍持续增加。如今公司决定暂时停止\n接收新申请，以便优先处理已经提交的申请。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196274#:~:text=【28】"}], "cult": []}}, {"date": "20261022", "label": "10月22日", "week": "周四", "id": "196294", "title": "天上不会掉馅饼，但地上总会长骗子", "cats": {"econ": [{"n": 8, "t": "之前看到的机场疯狂粉丝，是这么招聘来的？再加两个零我就去，要多疯狂有多疯狂。\n\r\n天上不会掉馅饼，但地上总会长骗子。", "b": "招聘来的？再加两个零我就去，要多疯狂有多疯狂。\n\n天上不会掉馅饼，但地上总会长骗子。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【8】"}, {"n": 9, "t": "扎心了，这就是很多人缴纳社保的最新现状。。。", "b": "@»                         关注\n好消息是，老板要给交社保了。但还有个坏消息，\n今天刚收到通知，老板说从下个月开始给我们缴纳\n社保，可工资会从5500元降到4000元，再扣掉个\n人应缴部分，到手可能就3500元了。这一下子就\n少了2000元啊，唉，日常开销都成问题了，该怎\n么办呀? 该怎么办才好呢? 现在找工作这么难，到\n底该如何是好呢? #社保# HER LRH", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【9】"}], "soc": [{"n": 2, "t": "缅北果敢老街市组织干部职工集中观看《缅北电诈覆灭纪实》《老街・向新而生》两部专题纪录片，开展专题观影警示教育，以反面案例警示与本", "b": "12:07                                      mS &\n\u003c\n缅北果敢老街组织集中观看《缅\n北电诈覆灭纪实》，并开展研讨\n交流\n中国侨网\n人7人 Al摘要\n侨闻天下知\n据“果敢之声\" \"消息，10 月14日以\n来，果敢老街市组织干部职工集中观\n看《缅北电诈覆灭纪实》《老街'向新\n而生》两部专题纪录片，开展专题观\n影警示教育，以反面案例警示与本土\n建设纪实相结合，引导全体人员深刻\n认清电诈犯罪带来的深层危害，珍异\n当前来之不易的稳定发展局面。\n=x        = ——      —_—mw\nitis 中国侨网   Heed\n51     240     16      1", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【2】"}, {"n": 4, "t": "红果短剧今天悄咪咪的发了条公告，今年年底前，会全面下线金币功能", "b": "18:12      全            咱     II 5G 人\n《\n关于红果短剧计划下线金币功能的公告\n红果短剧官方账号\nOO7A Al摘要\n亲爱的红果用户 :\n红果短剧计划分阶段下线金币功能: 预计自2026年\n11月1日起，不再向新用户提供金币功能; 2026年\n12 月底前，全面下线金币功能。具体计划如下:\n一、自2026年11月1日起，当天及之后新激活的用\n，将不再获得金币功能及相关入口。此前已在使\n用金币功能的用户，在这一阶段不受影响，可继续\n正常使用。\n、2026年12月 31日前，红果短剧将面向所有用\n户下线金币功能， 停止发放金币，具体安排请关注\nBAS.\n、您已获得的金币和现金余额权益不受影响。在\n币功能调整前，我们将通 局势为自身选举造势。\n特朗普近日在美国为共和党中期选举造势时，将法国骚乱归咎于移民、圣战分子及共产主义者。他星期二（20日）也公开赞扬法国极右翼领袖勒庞。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【16】"}, {"n": 17, "t": "印度尼西亚总统普拉博沃星期二（10月20日）迎来执政两周年纪念日，但多份最新民调显示他的民望已跌至就任以来的新低，全国多地更是爆", "b": "10月20日）迎来执政两周年纪念日，但多份最新民调显示他的民望已跌至就任以来的新低，全国多地更是爆发抗议示威集会。\n法新社报道，学生团体与人权组织在首都雅加达、爪哇岛的万隆与日惹、苏门答腊的北干巴鲁以及南苏拉威西省的望加锡等城市同时走上街头，抗议政府在应对林火和贪腐问题上的无能与迟缓。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【17】"}, {"n": 18, "t": "美国国务卿鲁比奥说，乌克兰能否使用星链服务，应由星链母公司SpaceX及其创办人马斯克决定，而非白宫。", "b": "使用星链服务，应由星链母公司SpaceX及其创办人马斯克决定，而非白宫。\n《华尔街日报》星期二（10月20日）报道，马斯克下令限速乌克兰使用星链军用版本。乌克兰依赖这项服务抵御俄罗斯的导弹袭击。\n美国国务卿卢比奥回应有关星链、星盾及马斯克决策的报道时表示，特朗普和美国政府从未要求改变相关系统，也无法指示私营公司如何使用自己的技术。\n卢比奥：“我知道这一点，但你提到的具体情况，我并不了解。不过，星链是一家私营公司。\n\n他们签有合同，合同规定了相关技术的使用方式。重要的是，我们不能命令私营公司做什么，或者不做什么。\n\n我可以明确告诉你，美国总统以及政府中的任何人，都从未要求对这个系统进行任何改变。我们已经反复说明过这一点。\n\n我不知道报道中具体说了什么，但事实就是如此。”\n\n记者：“你不能因为总统没有要求马斯克这么做，就断定他们没有讨论过这件事。”\n\n卢比奥：“我再说一遍，星链、星盾以及马斯克做出的决定，与总统没有任何关系。星链是一家私营公司，总统不管理这家公司，也不能命令这家公司做任何事情。\n\n据我所知，没有任何人事先知情，我也没有掌握任何人事先知情的信息。”\n\n记者：“但报道讨论的并不是有没有人事先知情。”\n\n卢比奥：“我告诉你，没有人事先知情。除此之外，即便有人事先知情，我们也无法控制一家私营公司如何决定使用自己的产品。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【18】"}, {"n": 21, "t": "Financial Times 独家报道：北约即将同意，乌克兰通过北约内部系统采购武器和装备，速度更快、费用更低", "b": "FT Exclusive: A new agreement could\nallow Kyiv to obtain weapons,\nammunition and military equipment\nfaster and more cheaply via Nato’s\ncentralised procurement agency\nft.trib.al/           Fc\n=,\nUkraine to buy military\nsupplies via Nato agency", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【21】"}, {"n": 23, "t": "一条在韩国釜山港口运河逗留超过一个月、吸引逾160万人前来围观的鲨鱼，经过两次救援失败后，终于在星期三被成功引导返回大海。", "b": "一个月、吸引逾160万人前来围观的鲨鱼，经过两次救援失败后，终于在星期三被成功引导返回大海。\n路透社报道，韩国海洋水产部星期三（10月21日）证实，这条被昵称为“小北港”（Bukangi）的鲨鱼已顺利游出釜山北港的狭窄水道，重返开放海域。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【23】"}, {"n": 24, "t": "全球集装箱吞吐量最大的港口", "b": "Los Angeles\n 这颗包含了地缘、技术与资本的“超级炸弹”，也随时可能带来巨大的震荡。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【19】"}, {"n": 20, "t": "Politico 10 月 20 日披露：众议院民主党人正在排兵布阵，若 11 月 3 日中期选举夺回众议院，就用委员会主席的传", "b": "0 日披露：众议院民主党人正在排兵布阵，若 11 月 3 日中期选举夺回众议院，就用委员会主席的传票权全面调查马斯克――目标包括他执掌 DOGE 的旧账（一位民主党议员称之为“原罪”）、其公司拿联邦合同的利益冲突（SpaceX 的 NASA 与国防合同），以及他在限制乌军星链接入一事中的角色。\n民主党众议员 Zoe Lofgren 说马斯克的“利益冲突多得惊人”，监督委员会成员 Greg Casar 直言马斯克“就在那份名单上”。目前预测普遍看好民主党至少拿下众议院。\n马斯克的底气和软肋是同一件事：钱。他是本选举周期共和党最大金主，7 月以来已砸下 2.76 亿美元（其中 1.58 亿给参议院领袖基金），正全力阻击民主党翻盘；但他同时又是联邦合同的大户，DOGE 期间主导裁撤近 30 万联邦雇员。\nFox Business 把这条帖子的标题定为《马斯克称将报复调查他的民主党人》――一方说这是选前恐吓选民的金主，一方说这是被政治追杀的企业家。真正决定这场仗打不打的，是 13 天后的众议院归属。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【20】"}, {"n": 22, "t": "这起诉讼的源头可追溯至轰动全球的“剑桥分析”数据丑闻。当地陪审团认定，Meta在数据隐私保护、打击虚假信息及遏制仇恨言论等举措上", "b": "的“剑桥分析”数据丑闻。当地陪审团认定，Meta在数据隐私保护、打击虚假信息及遏制仇恨言论等举措上严重误导了Facebook用户，违反该州不公平竞争及消费者保护法规近4400万次。\n法官此前一度开出高达2194亿美元的惊人罚单，随后核减至250亿美元；新墨西哥州总检察长直言，这是美国历史上针对单家公司开出的最大单笔罚单之一。按照该州法律，这笔罚款将全额注入当地教育基金。\n面对判决，Meta首席法务官强硬回应，称该裁决让公司几乎无法在当地开展业务，指责这实质上是在变相征收“言论税”，并明确表态将继续上诉。\n而就在判决公布前两个月，Meta才刚刚因Instagram算法致瘾、侵害青少年心理健康等指控，与全美52位州总检察长达成了180亿美元的巨额和解协议。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【22】"}, {"n": 29, "t": "段永平讲他2011年大举买入苹果股票的契机：", "b": "果股票的契机：\n「当时苹果的市值只有大约3000亿，但净现金有1000亿。当时一年已经赚到150-160亿美金了。我看到的是，苹果未来的利润一定会到500亿/年或者更多。当时苹果犯了一个小错，迟迟不肯推出打大屏手机，所以有大概三年的时间里苹果的股价都一直处于低位。我在这三年多的时间里，从计划投10%到最后投到了95%以上，几乎把手里所有的其他股票都换成了苹果。我绝对不是在赌哈，是真的理解这家公司的。这种机会不会经常来，但意识到这种机会的时候，能够下重注是非常重要的。」", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196294#:~:text=【29】"}], "cult": []}}, {"date": "20261023", "label": "10月23日", "week": "周五", "id": "196310", "title": "终身负责", "cats": {"econ": [{"n": 1, "t": "前三季度，全国一般公共预算收入172292亿元，同比增长5.1%。其中，全国税收收入140706亿元，同比增长6.1%；非税收入", "b": "172292亿元，同比增长5.1%。其中，全国税收收入140706亿元，同比增长6.1%；非税收入31586亿元，同比增长1.2%。分中央和地方看，中央一般公共预算收入76699亿元，同比增长8.3%；地方一般公共预算本级收入95593亿元，同比增长2.7%。", "href": "https://www.dapent ，我应该没机会再当面致谢了，容我在这里谢谢你曾经在各种时刻，带给我好好活下去的力量。愿你也一切安好。\n\n献上我的祝福。\n\n\n\n此前报道\n\n\n\n10月14日，国务院台办举行例行新闻发布会。\n\n中新社记者：台湾艺人蔡康永现身民进党台北市长参选人沈伯洋的竞选总部成立大会，请问对此有何评论？\n\n发言人陈斌华：台湾是中国领土不可分割的一部分，坚持一个中国原则是国际社会的普遍共识，也是两岸同胞共同的政治基础。“台独”顽固分子沈伯洋的所作所为人尽皆知，任何形式的“台独”分裂活动都是对中华民族根本利益的严重损害，我们都坚决反对。\n\n我们始终尊重和保障台湾同胞正当的言论与表达自由，但在大是大非问题上，没有任何模糊空间。维护统一、反对“台独”是全体中国人民的共同意志，任何人、任何势力都不能一边赚取大陆发展红利，一边与“台独”分裂势力勾连纠缠，做“两面人”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【5】"}, {"n": 8, "t": "多地幼儿园改为养老院", "b": "多地幼儿园改为养老院\n第一财经\n们 1.6万人\nAl摘要\n2026.10.25\n本文字数: 1408，阅读时长大约2 分钟\n作者 | 第一财经 this\n2025 年我国老年抚养比首次超过少儿\n根据国家统计局编著出版的《中国统\n计年鉴2026》，2025年全国0-14 岁\n人口 21276 万人，占总人口比重为\n15.1%; 65 岁及以上人口 22365 万\n人，上右总人口比重为15.9% 。2025\n年，全国总抚养比为45.1% ，其中少\n儿抚养比为22% ，老年抚养比为\n23.1% ，老年抚养比首次超过少儿抚\n养比。\n抚养比又称抚养系数，是指在人口当\n中非劳动年龄人口对劳动年龄人口数\n之比 (注: 这里所指劳动年龄人口为\n15-64岁群体) 。总抚养比就是少年\n儿童抚养比和老年人口抚养比相加之\n和。\n随着人口老龄化程度的不断加深，近\n年来我国老年抚养比持续上升。2016\n年，我国老年抚养比为15%，到2021\n年首次突破20% ，达20.8% 。2024\n年老年抚养比升至22.8% ，当年少儿\n抚养比为23% 、老年抚养比已经十分\n接近少儿抚养比。至2025年老年抚养\n比首次超过少儿抚养比。\n同时少子化和老龄化对很多行业和领\n域都产生了深刻影响。\n近年来人口结构的变化对教育领域产\n生了较大影响。\n在招生难的情况下，一些幼儿园在控\n在济南天桥区宝华街街道，一所运营\n30多年的民", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【8】"}, {"n": 10, "t": "我还说这个头哪像了，一看名字，确实", "b": "东汉时期的西红柿", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【10】"}, {"n": 15, "t": "#塞尔维亚#前总统#武契奇#星期天（10月25日）在首都贝尔格莱德竞选总部说，根据分层抽样结果，由学生团体推动的“学生名单－学生", "b": "期天（10月25日）在首都贝尔格莱德竞选总部说，根据分层抽样结果，由学生团体推动的“学生名单－学生获胜”预计将在国民议会250个席位中获得135至140席，而由塞尔维亚前进党主导的“亚历山大・武契奇－团结的塞尔维亚”选举名单预计获得约105席。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【15】"}, {"n": 16, "t": "#巴西#总统选举第二轮投票星期天结束。民调机构AtlasIntel首席执行官罗曼根据持续进行的计票结果预测，现任总统#卢拉#将击", "b": "天结束。民调机构AtlasIntel首席执行官罗曼根据持续进行的计票结果预测，现任总统#卢拉#将击败前总统#博索纳罗#之子弗拉维奥・博索纳罗，赢得连任。\n【博索纳罗之子拒绝承认巴西总统选举败选】#巴西#前总统#博索纳罗#之子弗拉维奥拒绝承认自己在总统选举第二轮投票中败选。另一方面，现任总统#卢拉#当地时间星期天（10月25日）晚发表讲话，宣布在当天举行的巴西总统选举第二轮投票中胜出，并称“这个国家不是任何人的后院”。", "href": "https://www.dapenti.c 造的”推翻。\n\r", "b": "能#（#AI#）做成以假乱真的视频；真实的录音录像，也能被当事人用一句“这是AI伪造的”推翻。\n\n距离11月3日#美国中期选举#只剩一周多，受访学者警告，虚假内容风险已不只在于误导选民，还可能令公众对真实的证据也产生怀疑，动摇政治问责所依赖的事实基础。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196372#:~:text=【12】"}], "cult": []}}, {"date": "20261027", "label": "10月27日", "week": "周二", "id": "196393", "title": "由于他的发言涉及到对中国和中国人民的伤害，我们不能进行翻译", "cats": {"econ": [{"n": 5, "t": "江苏面向0-3婴幼儿家庭发放健康服务消费券", "b": "江苏面向0-3婴幼儿家庭发放健康服\n务消费券\n江苏新闻 2026年10月26日 21:08 江苏\n们 听全文 Al摘要\n为贯彻落实省政府办公厅《关于紧抓当前提质增\n效推动经济持续向新向优向好发展的若干政策措\n施》，优化 一老一小\"服务水平，近日，江苏面\n向0-3岁婴幼儿家庭发放健康服务消费券。\n记者从江苏省卫生健康委获悉，消费券发放对象\n为2023年9月1日及以后出生的婴幼儿家庭，每张\n消费券面值100元，每消费满200元可使用1张，\n每名婴幼儿限使用3张消费券。消费券适用范围包\n括全日托、半日托的托育服务消费，以及婴幼儿\n喂养指导、运动感统训练”、能力发展促进、养育\n照护指导等婴幼儿早期发展服务消费。\n婴幼儿家长可通过登录*苏服办”\"APP或*苏银生\n江苏新闻@             Hao 局\n@ 59个朋友关注    赞 133    1 Ske\n一全:oh一一", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【5】"}, {"n": 22, "t": "兽爷 · 今年前九个月，地方政府土地出让收入1.61万亿，同比跌27.9%\n\r\n828新政后，明年会比今年更差", "b": "今年前九个月，地方政府土地出让收入1.61万亿，同比跌27.9%\n\n828新政后，明年会比今年更差\n \n全网都在问：姆巴佩到底说了什么？", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【22】"}], "soc": [{"n": 1, "t": "没药花园案件 · 今天听说一个让我震惊的消息。\n\r\n我大约在2019年就关注徽剑这个公众号了，24年他突然不更新了，甚至全部文章", "b": "今天听说一个让我震惊的消息。\n\n我大约在2019年就关注徽剑这个公众号了，24年他突然不更新了，甚至全部文章消失，我开始也没太留意。\n\n再后来，我偶然听说他被抓了，一直失联。\n\n\n\n那一年，他写文章首个揭露了柬埔寨大的电诈头目和黑帮头目刘忍。刘忍当年在明面上和陈志一样，是在柬埔寨的正经华商形象，自然不想被大陆自媒体公布真实行径和面目。刘忍通过中间人联系他，试图花钱让他删文章，他拒绝。\n\n此后徽剑被几个“警察”从停车场带走。\n\n\n\n当时普遍统一的说法是，刘忍在国内报警，控告他敲诈勒索和诽谤之类，他就被抓了。现在你问AI，也是这么说的。\n\n在那以后，他的人一直失联，公众号所有文章消失。\n\n前不久央视报道陈志、刘忍等人被抓回国，我还想这下可以还徽剑清白了吧，但怎么媒体还是联系不上他，公号还不发文章呢？\n\n\n\n但今天我才知道，原来徽剑已经被人杀害了！\n\n\n\n在一个停车场带走他的人，是三个伪装成警察的杀手。为首的赵冰在飞机上领到一个叫“少校”的人的任务：一百万绑架他、删掉文章并逼问提供信息的线人是谁。\n\n赵冰又纠集了几个人作案。\n\n他们跟踪他，趁他在一个大卖场下车从后备箱取东西时将他绑架。他们先在广东荒郊野外虐待拷问他，抢走手机，删掉文章。后把他手机交给少校派来拿的人。\n\n最后他们把人带到江西的山上殴打致死。尸体被抛在野外，后被村民发现。\n\n\n\n他被带走时可能有目击者看到穿假警服的人，再加上刘忍他们故意放假消息，从此以讹传讹，传成他涉嫌违法被警方拘捕。\n\n这些罪犯和他无冤无仇，这么做只为了一百万悬赏，五个人分别分到40万到10万不等。\n\n其中为首的赵冰被判死缓，其余13人有期徒刑。（徽剑父母的养子收了赵冰父母的50万，给所有人出了谅解书。）\n\n而在飞机上直接雇佣他们的“少校”（绰号泰哥）一直没被抓到，更别说证明少校背后主谋是谁。\n\n\n\n一直觉得国内很安全，没想到光天化日下公共场合也会发生这种事。监控什么都只能吓住那些怕死的罪犯，却防不住为了钱不要命的暴徒。\n\n国内管控严，相比其他国家够安全了，所以这一群人能在几天后就落网。要是放其他监控少的国家，我都怀疑能不能查清楚怎么回事。\n\n\n\n电诈这行的财富太惊人了，钱到了这个规模基本什么都能买到。只要有钱，不仅可以买到徽剑的车牌号和住址，在飞机群里可以买到国内的垃圾人干各种违法犯罪的事。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【1】"}, {"n": 2, "t": "中国婚恋第一股百合网的联合创始人，一代相亲大佬慕岩，在朋友圈贴出了自己的微信收款码。配文大意是：财产被无缘无故冻结，生活拮据，只", "b": "自从被无缘无故冻结财产，生活持据，\n朋友圈化缘后，很多朋友都进行了金钱\n的支持。也有些朋友分享了自己被无故\n历。还有 30 年前的老朋友，已经 204\n系，也因此重新联系上了，并相约在北\n茶，共叙 20 年以来各自人生的变化。\n本来一件坏事，因为友情力量的加持，\n愤而发起\n或精神上\n冻结的经\n没有联\n京一起喝\n逐渐变成", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【2】"}, {"n": 4, "t": "据南方日报，近日，多所大学发布相关通知，学校在职在编人员工资将通过数字人民币钱包发放。", "b": "相关通知，学校在职在编人员工资将通过数字人民币钱包发放。\n扬州大学财务处10月20日发布通知，接省财政厅预通知，自2026年11月起，学校在职在编人员（含人事代理）工资将通过数字人民币钱包发放，请相关人员根据自己目前的工资卡情况，于10月23日前完成数币钱包的开立与升级。\n南通大学财务处发布《关于做好数字人民币钱包开通及11月份工资数币发放工作的通知》：各位教职工：接省财政厅通知，自2026年11月起全校在编人员、人事代理人员工资将通过数币钱包发放。请相关人员于10月30日前完成数币钱包的开立与升级（工资、绩效分两张卡发放，两张均需开立）。\n江苏师范大学记财处发布《关于统计报送数币钱包信息的通知》：为贯彻落实国家关于推进数字人民币试点工作的部署要求，进一步优化工资发放流程、提升发放质效、保障资金运行安全，根据上级主管部门统一工作部署，我校将稳步推进在职人员工资数字人民币（以下简称“数币”）发放工作。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【4】"}, {"n": 7, "t": "中央广播电视总台相关方面证实，针对姆巴佩的涉华严重负面行为，央视已经从昨晚开始，全面叫停涉及西甲和姆巴佩的赛事播出，涉及姆巴佩的", "b": "针对姆巴佩的涉华严重负面行为，央视已经从昨晚开始，全面叫停涉及西甲和姆巴佩的赛事播出，涉及姆巴佩的广告也已全部下架。 (澎湃新闻)", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【7】"}, {"n": 7, "t": "老徐时评 · 姆巴佩到底说了什么，让这么多中国的合作伙伴解除合同了？网上找了半天没找到，看来不是简单的言论，肯定涉及到政治或者外", "b": "姆巴佩到底说了什么，让这么多中国的合作伙伴解除合同了？网上找了半天没找到，看来不是简单的言论，肯定涉及到政治或者外交层面了，严重到已经不能再传播了。姆巴佩在中国应该是完了，别想再从中国挣钱了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196393#:~:text=【7】"}, {"n": 8, "t": "广电总局发布新规：要求有线电视实现开机看全屏直播功能，不得播放开机广告，设立免费专区，11月27日起施行。", "b": "有线广播电视运营服务提供者应当在\n有线广播电视交互界面首页设立免费\n专区，对优质免费内容进行重点推\n荐，精简收费栏目数量，明示节目收\n费信息，规范应用专区运营和订购支\n付管理。\nwll, 每日经济新闻 ©\n广电总局发布新规: 要求有线电视实\n现开   CATS.forEach(function(c, ci){
    var items = day.cats[c.id];
    panels += '<section class="panel" id="' + c.id + '" style="--sec:' + c.nc + ';--sec-soft:' + c.soft + '">'
      + '<div class="panel-head"><div class="panel-mark">' + c.mark + '</div>'
      + '<div class="panel-title">' + c.name + '<span>' + c.sub + ' · ' + items.length + ' 条</span></div></div>'
      + '<div class="panel-line"></div><div class="items">';
    items.forEach(function(it, i2){
      var wd = dayOf(dateStr);
      var full = items.length === 1 ? ' full' : '';
      var pcl = it.b.length > 90 ? 'clamp' : 'full';
      panels += '<article class="item' + full + '" data-ci="' + ci + '" data-i="' + i2 + '" title="点击查看全文"><div><div class="item-head">'
        + '<div class="src src-' + ['sun','mon','tue','wed','thu','fri','sat'][new Date(+dateStr.slice(0,4), +dateStr.slice(4,6)-1, +dateStr.slice(6,8)).getDay()] + '">' + wd + ' · ' + (it.n < 10 ? '0' : '') + it.n + '</div>'
        + '<a class="src-link" href="' + it.href + '" target="_blank" rel="noopener">来源</a></div>'
        + '<h3>' + esc(it.t) + '</h3><p class="' + pcl + '">' + esc(it.b.replace(/\s+/g,' ')) + '</p></div></article>';
    });
    panels += '</div></section>';
  });
  document.getElementById('panels').innerHTML = panels;
  // 检测正文是否超出 6 行 → 标记"点击查看全文"
  var itemsEls = document.querySelectorAll('.item p.clamp');
  for (var i=0;i<itemsEls.length;i++){
    var p = itemsEls[i];
    if (p.scrollHeight > p.clientHeight + 2){
      var art = p.closest('.item');
      art.classList.add('has-more');
    } else {
      p.className = 'full';
    }
  }
  bindModal();
  var btns = document.querySelectorAll('.day-btn');
  for (var i=0;i<btns.length;i++){
    btns[i].className = btns[i].getAttribute('data-date') === dateStr ? 'day-btn active' : 'day-btn';
  }
  var links = '';
  DAYS.forEach(function(d){
    links += '<div><span class="src">' + d.label + '</span><a href="https://www.dapenti.com/blog/more.asp?name=xilei&id=' + d.id + '" target="_blank" rel="noopener" title="' + esc(d.title) + '">' + esc(d.title) + '</a></div>';
  });
  document.getElementById('footer-links').innerHTML = links;
  document.getElementById('footer-note').textContent = '喷嚏图卦 · 最近30天日报 · ' + DAYS.length + ' 期 · 五主题分类 · 每日 18:00 自动更新';
  history.replaceState(null, '', '#' + dateStr);
}

function showDay(dateStr){ renderDay(dateStr); document.getElementById('top').scrollIntoView({behavior:'smooth'}); }

var curCat = '', curItem = null;
function bindModal(){
  var arts = document.querySelectorAll('.item');
  for (var i=0;i<arts.length;i++){
    arts[i].onclick = function(e){
      if (e.target.closest('.src-link')){ return; }
      var ci = +this.getAttribute('data-ci'), ii = +this.getAttribute('data-i');
      var it = DAYS.filter(function(d){ return d.date === cur; })[0].cats[CATS[ci].id][ii];
      openModal(CATS[ci], it, cur);
    };
  }
}
function openModal(cat, it, dateStr){
  var day = DAYS.filter(function(d){ return d.date === dateStr; })[0];
  document.getElementById('modal-tag').textContent = day.label + '（' + day.week + '） · ' + cat.name + ' · 序号 ' + it.n;
  document.getElementById('modal-title').textContent = it.t;
  document.getElementById('modal-body-text').textContent = it.b;
  document.getElementById('modal-src').innerHTML = '原文：<a href="' + it.href + '" target="_blank" rel="noopener">打开喷嚏网原文</a>';
  document.getElementById('modal-mask').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('modal-mask').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-mask').addEventListener('click', function(e){
  if (e.target === this){ closeModal(); }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ closeModal(); } });

window.addEventListener('hashchange', function(){
  var h = location.hash.slice(1);
  if (h && h.length === 8 && DAYS.some(function(d){ return d.date === h; })){ renderDay(h); }
});

renderDay(cur);
</script>
