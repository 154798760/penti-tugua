<style>
  :root{
    --paper:#F5F4EF; --card:#FFFFFF; --ink:#20242B; --ink-2:#5A5F68; --line:#E2E0D8;
    --blue:#2662B8; --green:#12805E; --red:#C0443B; --purple:#6A48B0; --amber:#B07A1E;
    --blue-soft:rgba(38,98,184,.06); --green-soft:rgba(18,128,94,.06);
    --red-soft:rgba(192,68,59,.06); --purple-soft:rgba(106,72,176,.06); --amber-soft:rgba(176,122,30,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
  .wrap{max-width:800px;margin:0 auto;padding:0 20px}
  a{color:inherit}
  ::selection{background:rgba(176,122,30,.25)}

  /* 报头 */
  .masthead{background:var(--ink);color:#F5F4EF}
  .masthead-inner{max-width:840px;margin:0 auto;padding:34px 20px 30px}
  .brand-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand{font-family:"Noto Serif SC",serif;font-weight:900;font-size:26px;letter-spacing:.12em}
  .brand .dot{color:var(--amber)}
  .slogan{font-size:13px;color:#A9AEBB;letter-spacing:.08em}
  .issue-date{font-size:13px;color:#8C93A3;letter-spacing:.2em;margin-top:6px}
  .issue-title{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(24px,4.6vw,36px);line-height:1.4;margin:16px 0 4px;color:#fff}
  .issue-sub{font-size:13px;color:#8C93A3}

  /* 日期切换 */
  .daybar{background:#1B1E24;border-top:1px solid rgba(255,255,255,.1)}
  .daybar-inner{max-width:840px;margin:0 auto;padding:12px 20px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#A9AEBB;border-radius:8px;padding:8px 6px 6px;cursor:pointer;font-family:inherit;transition:all .15s}
  .day-btn b{display:block;font-size:13px;font-weight:600;color:#E7E9EE}
  .day-btn span{font-size:11px;color:#8C93A3}
  .day-btn:hover{background:rgba(255,255,255,.14)}
  .day-btn.active{background:var(--amber);border-color:var(--amber);color:#20242B}
  .day-btn.active b{color:#20242B}
  .day-btn.active span{color:#20242B}

  /* 导航 */
  .section-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .nav-inner{max-width:840px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .nav-inner::-webkit-scrollbar{display:none}
  .nav-inner a{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink-2);padding:5px 12px;border-radius:999px;transition:all .15s}
  .nav-inner a:hover{background:var(--line);color:var(--ink)}
  .nav-inner a i{width:8px;height:8px;border-radius:50%;background:var(--nc)}
  .to-top{margin-left:auto;color:var(--ink-2);font-size:13px;text-decoration:none;padding:5px 10px;border:1px solid var(--line);border-radius:999px;flex-shrink:0}
  .to-top:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* 主题板块 */
  main{padding:36px 0 20px}
  section.panel{margin-bottom:56px;scroll-margin-top:64px}
  .panel-head{display:flex;align-items:center;gap:16px;margin-bottom:4px}
  .panel-mark{width:46px;height:46px;border-radius:10px;background:var(--sec);color:#fff;font-family:"Noto Serif SC",serif;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .panel-title{font-family:"Noto Serif SC",serif;font-weight:700;font-size:clamp(20px,3.2vw,24px);color:var(--sec)}
  .panel-title span{font-size:13px;color:var(--ink-2);font-family:"Noto Sans SC",sans-serif;font-weight:400;display:block;margin-top:2px}
  .panel-line{height:2px;background:var(--sec);opacity:.25;margin:14px 0 20px}

  /* 条目 */
  .items{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sec);border-radius:0 8px 8px 0;padding:12px 15px;transition:background .18s;break-inside:avoid;cursor:pointer;position:relative}
  .item:hover{background:var(--sec-soft)}
  .item-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .item-head .src{flex-shrink:0}
  .item .src{font-size:11.5px;font-weight:500;letter-spacing:.05em;opacity:.95}
  .item h3{font-family:"Noto Serif SC",serif;font-weight:700;font-size:14.5px;line-height:1.45;margin:2px 0 4px}
  .item p.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;font-size:12.8px;color:#4A4F58;line-height:1.6}
  .item p.full{font-size:12.8px;color:#4A4F58;line-height:1.6}
  .item.has-more::after{content:"… 点击查看全文";position:absolute;right:10px;bottom:6px;font-size:11px;color:var(--sec);background:linear-gradient(90deg,transparent,var(--card) 30%);padding:2px 6px 2px 14px;pointer-events:none}
  .item.has-more p.clamp{position:relative}
  .src-link{font-size:11px;color:var(--ink-2);text-decoration:none;white-space:nowrap;border-bottom:1px dashed var(--line);transition:color .15s,border-color .15s;position:relative;z-index:2}
  .src-link:hover{color:var(--sec);border-color:var(--sec)}
  .item.full{grid-column:1/-1}
  .src-mon{color:var(--blue)} .src-tue{color:var(--green)} .src-wed{color:var(--purple)} .src-thu{color:var(--red)}
  .src-fri{color:var(--amber)} .src-sat{color:#3E7D8C} .src-sun{color:#2F6B7A}

  /* 全文弹层 */
  .modal-mask{position:fixed;inset:0;background:rgba(20,22,28,.62);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .18s}
  .modal-mask.open{opacity:1;visibility:visible}
  .modal{background:var(--paper);max-width:640px;width:100%;max-height:82vh;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;transform:translateY(10px);transition:transform .18s}
  .modal-mask.open .modal{transform:translateY(0)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
  .modal-tag{font-size:12px;color:var(--sec);font-weight:600;letter-spacing:.06em}
  .modal-close{background:none;border:none;font-size:22px;line-height:1;color:var(--ink-2);cursor:pointer;padding:4px 8px;border-radius:6px}
  .modal-close:hover{color:var(--ink);background:var(--line)}
  .modal-body{overflow-y:auto;padding:18px 20px 22px}
  .modal h3{font-family:"Noto Serif SC",serif;font-weight:700;font-size:18px;line-height:1.5;margin-bottom:12px}
  .modal p{font-size:14.5px;line-height:1.9;color:#33363D;white-space:pre-wrap;word-break:break-word}
  .modal-src{margin-top:16px;font-size:12.5px}
  .modal-src a{color:var(--sec);text-decoration:none;border-bottom:1px dashed var(--line)}

  /* 页脚 */
  footer{background:var(--ink);color:#A9AEBB;margin-top:20px}
  .footer-inner{max-width:840px;margin:0 auto;padding:30px 20px;font-size:13px;line-height:1.9}
  .footer-inner a{color:#F5F4EF;text-decoration:none}
  .footer-inner a:hover{color:var(--amber)}
  .footer-inner .src{color:#8C93A3}
  .footer-links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 18px;margin:10px 0 14px}
  .footer-links div{display:flex;align-items:baseline;gap:8px;min-width:0}
  .footer-links .src{flex-shrink:0}
  .footer-links a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.item,.nav-inner a,.day-btn{transition:none}}
  @media (max-width:720px){
    .daybar-inner{grid-template-columns:repeat(4,1fr)}
    .items{grid-template-columns:1fr}
    .footer-links{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
</style>

房贷款购房实施贴息，以降低居民购房成本，更好支持和释放城乡居民刚性住房需求。\n本次贴息政策聚焦首套刚需，重点支持普通家庭新购中小套型、较低价位的住房，单户所购住房建筑面积不超过120平方米、购房价格不超过150万元。\n可享受贴息的贷款规模最高可达100万元，财政部门给予年化1个百分点的贴息，按照目前首套住房的商业性个人住房贷款利率水平，相当于优惠了利率的三分之一，贴息期限最长5年。据测算，对于一笔长期限的100万元商业性个人住房贷款，政策最多可帮助借款人累计减少付息近5万元。\n政策实施期暂定一年。\n【国有六大行响应房贷贴息新政 明确“免申即享”】9月30日，国有六大银行（农业银行、邮储银行、工商银行、中国银行、交通银行和建设银行）9月30日先后发布关于落实居民购房贷款贴息政策的公告，自2026年10月1日起，为新发放符合条件的首套住房商业性个人住房贷款提供财政贴息服务。多家银行明确，将采取“免申即享”办理方式，即每月收息时，在每期还款额中自动扣除对应贴息金额，并通过短信等方式及时告知客户。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【1】"}, {"n": 2, "t": "目前居民多存少贷的情况还在持续，没有缓解迹象。", "b": "全国住户存款与贷款余额指数差 2020818 2026808\n数据来源: 中国人民银行                                   公众号: TimeHorizonX\n2022年年中由负转正，此后单边走阔，最新已扩大至54.6\n单位: 指数差 (住户存款余额指数-住户名    额指数) ，两者均以2020年1月= 100\n50-\n40 -\n30-\n20-\nSi = Paw MASE\n0\"\n20/1 20/7 21/1 21/7 22/1 22/7 23/1 23/7 24/1 24/7 25/1 25/7 26/1 26/8", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【2】"}, {"n": 7, "t": "Gucci首次发售“中国制造”的运动鞋", "b": "GUCCI", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【7】"}, {"n": 14, "t": "是“2008经济危机到2014信心恢复”时间段以外，最差的水平，甚至不及2020-2021疫情初期", "b": "信心恢复”时间段以外，最差的水平，甚至不及2020-2021疫情初期\n另外，消费者普遍认为：今后六个月，劳力市场和商业环境，会继续恶化", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【14】"}, {"n": 24, "t": "今天有拿到“大结果”吗？", "b": "“大结果”这词在夜场图原本没问题。夜场的女人吃的是青春饭，色衰爱弛后\n找长期供养者是经济上的必然也是唯一选择，但她们能拿到大结果，靠的是\n颜值、情绪价值，甚至帮高净值客户间牵线搭桥的能力，勉强算是一场等价\n交换。\n坏就坏在这词     ，被普通女人听进去了，但她们没有夜场女生全挂伺候\n人的本事，却把这套逻辑强加给自己的牛马打工人男友，虚空造牌去索要\n“KER.\n然而脱离了等价交换，交易是不可能成立的。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【24】"}, {"n": 25, "t": "财小僧 · 苏联笑话\n\r\n\n\r\n领导问 年轻人为什么不结婚了\n\r\n秘书说 正在研究\n\r\n\n\r\n为什么不生孩子了\n\r\n正在研究\n\r", "b": "苏联笑话\n\n\n\n领导问 年轻人为什么不结婚了\n\n秘书说 正在研究\n\n\n\n为什么不生孩子了\n\n正在研究\n\n\n\n老百姓为什么不消费了\n\n正在研究\n\n\n\n干部怎么也不干活了\n\n秘书想了一下说 大家都在等您的指示\n\n\n\n领导急了 什么他妈的都等我 那要你们干什么\n\n\n\n秘书赶紧拿出本子\n\n这个问题……也请您指示", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【25】"}], "soc": [{"n": 4, "t": "近日，学校收到反映我校教师裴某相关问题的线索。学校高度重视，第一时间成立专项工作组，开展全面细致的调查工作。", "b": "相关问题的线索。学校高度重视，第一时间成立专项工作组，开展全面细致的调查工作。\n经查实，裴某存在严重违反教师职业道德规范和行为准则等行为，造成严重不良影响。\n依据相关规定，经研究决定，取消裴某研究生指导教师资格，撤销其北京理工大学教师岗位任职资格，解除聘用关系。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【4】"}, {"n": 6, "t": "连学生都这么卷了……？", "b": "翻墙就要取消保研? 政策取向一\n致性、不以一害掩大德，可以警\n告处分但不应取消保研资格\n虎说八道\n近日，某大学一桩事件引发全网热议: 一\n名学生为争夺保研名额，举报排名靠前同学使\n用VPN翻墙，连带二十名本科生、研究生受到\n校方警告处分。很多人看完心生寒意: 一场保\nRF, PRRKASZARSRR, Ei\n击的博弈。\n我们不否认，根据现有法规，私用VPN翻\n墙属于违规，依规作出警告处分无可厚非。但\n一次轻微违规，是否就必须剥夺一名多年学业\n名列前茅学生的保研资格? 这才是整件事最值\n得深思的制度命题。答案应当是否定的: 有错\n可以惩戒，但不该以一第掩大德。\nBH", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【6】"}, {"n": 17, "t": "美国海军星期一（9月28日）晚间通报，部署在美国弗吉尼亚州外海的“艾森豪威尔”号航空母舰进行飞机回收（着舰）作业时发生一起事故，", "b": "间通报，部署在美国弗吉尼亚州外海的“艾森豪威尔”号航空母舰进行飞机回收（着舰）作业时发生一起事故，导致四名舰上人员受伤，两名飞行员弹射逃生。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【17】"}, {"n": 22, "t": "朴实无华的商战", "b": "\u003c                   帖子                  六\n也 Michael Truell 已转帖\nA sui @                     ep\n@birdabo\n& 由 Grok 翻译自英语\nAHAHAHAHAHAHAHAHAHAHAHA 不可能吧。\n> OpenAl刚刚宣布了 Dots 。\n> SpaceXAl买下了 Dot.com\n它直接跳转到 Grok Bot 下载页面。牛逼哈哈。\n评价此翻译: 中 加\n01:30 - 2026/9/30 - 280 RAG\nQO v99 tl 2301 OY 24m P23 oF", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【22】"}, {"n": 23, "t": "女装商家近期大规模给衣服缝上“防拆带”――一条长达2.4米、剪断即不可退货的显眼丝带――这并非刁难顾客，而是被畸高的退货率和“穿", "b": "防拆带”――一条长达2.4米、剪断即不可退货的显眼丝带――这并非刁难顾客，而是被畸高的退货率和“穿完就退”的白嫖行为逼出的物理防御。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【23】"}], "intl": [{"n": 10, "t": "伊朗革命卫队一名发言人星期二（9月29日）称美国总统特朗普是“大骗子”，指责他向美国民众隐瞒有关伊朗核计划，以及伊朗封锁海湾地区", "b": "9月29日）称美国总统特朗普是“大骗子”，指责他向美国民众隐瞒有关伊朗核计划，以及伊朗封锁海湾地区能源运输成效的真相。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【10】"}, {"n": 11, "t": "俄罗斯总统普京周一（9月29日）签署政令，将俄军规模增加1万5500人，至244万1630人。", "b": "）签署政令，将俄军规模增加1万5500人，至244万1630人。\n这是今年以来，普京第四次发布此类命令。政令没有说明增兵的原因。此前普京分别在3月、6月和7月扩大军队规模。自3月以来，俄军总兵力累计增加了4万7860人。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【11】"}, {"n": 12, "t": "美国总统特朗普在距中期选举仅剩几周之际又作出争议举动。特朗普政府利用纳税人资金投放三则宣传广告，遭两党强烈批评，并引发关于合法性", "b": "几周之际又作出争议举动。特朗普政府利用纳税人资金投放三则宣传广告，遭两党强烈批评，并引发关于合法性的质疑。\n这三则广告上周面向全美电视观众播出，都以“由美国政府付费”的声明结尾。特朗普在其中一则广告中强调，“美国永远不会成为共产主义国家”，背景声反复唱着“爱我”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【12】"}, {"n": 13, "t": "美国总统特朗普星期二（9月29日）发布了一份他与一众科技公司巨头共同签署的文件。特朗普政府将这份文件定性为一项人工智能协议。", "b": "日）发布了一份他与一众科技公司巨头共同签署的文件。特朗普政府将这份文件定性为一项人工智能协议。\n路透社报道，特朗普在他自家的社媒平台Truth Social发布这份仅有一页的文件，并形容这份文件具有“道义约束力”。\n特朗普发布“超级智能协定”，署名美国拼错了。。。\n午宴座次凸显马斯克与黄仁勋在美国科技界的地位。\n刚刚，特朗普于白宫举办“超级人工智能午宴”。在座位安排上，特朗普居于主位，马斯克、黄仁勋被安排分居他的左右两侧，这也象征着二人当下在美国AI、芯片领域举足轻重的分量。\n此次“超级AI午宴”几乎集齐了美国头部AI、芯片、云大厂：微软、亚马逊、Meta、谷歌、英伟达、AMD、博通、OpenAI、Anthropi的Boss们全部到场，同时还有白宫内阁官员、国会代表、投资机构。\n午宴的核心议题为美国人工智能监管政策与AI产业发展。\n#特朗普签署行政令正式将AI更名为SI#\n马斯克在将SI称为AI后意识到自己的错误\n\n马斯克：请原谅我\n\n特朗普：谢谢你\n\n特朗普感谢马斯克纠正口误", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【13】"}, {"n": 15, "t": "英国首相伯纳姆发表出任执政工党党魁以来的首次演讲，宣布包括住房在内一系列关键问题的政策。他号召英国人团结一致，并承诺带领国家走上", "b": "党魁以来的首次演讲，宣布包括住房在内一系列关键问题的政策。他号召英国人团结一致，并承诺带领国家走上新道路、让人民重燃希望。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【15】"}, {"n": 16, "t": "韩国军方星期二（9月29日）首次确认，西部前线非军事区爆炸现场发现的朝军地雷是人为埋设，且爆炸点及新发现的地雷均位于军事分界线以", "b": "次确认，西部前线非军事区爆炸现场发现的朝军地雷是人为埋设，且爆炸点及新发现的地雷均位于军事分界线以南。若最终确认由朝军所为，将涉及违反《朝鲜停战协定》，但是否蓄意针对韩军仍待调查。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【16】"}, {"n": 18, "t": "东京的雨季通常在6月，但今年整个夏季都频繁出现强降雨，东京周边地区也发生严重洪灾。这轮连续降雨是自1886年有记录以来持续时间最", "b": "个夏季都频繁出现强降雨，东京周边地区也发生严重洪灾。这轮连续降雨是自1886年有记录以来持续时间最长的一次。\n日本气象厅官员经田正幸说，本月特殊的天气形势部分是因为厄尔尼诺现象令太平洋海域气温升高导致。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【18】"}, {"n": 21, "t": "美国。2026年9月29日正式上线了America.gov网站：", "b": "== America.gov 厅、管邮件，你去度假。\n \n能做什么？日常代办：\n\n• 查航班、订机票（对接 500+ 航司）、订酒店、订餐厅（OpenTable 等）\n\n• 读、起草、发送邮件；整理收件箱\n\n• 填表、约时间、客服沟通、砍账单\n\n• 网购比价、下单（支付走 Stripe Link，一笔一确认，它看不到完整卡号）\n\n\n\n未来不久，muse可以：\n\n• 你丢一个目标给它（健身、卖车、旅行），它会拆计划、盯进度、主动推进文件和内容\n\n• 读/写 PDF、Word、表格，生成图片、行程单、播客类成品\n\n• 需要新工具时，可以自己搭简单工具\n\n和普通聊天机器人的差别：它有一台独立的云端电脑和浏览器，关 App 后还能继续干活；发邮件、付钱这类敏感操作会先问你。\n\n\n\n怎么用：在 Chat 里像跟人说话一样下任务，越具体越好。例如：“下周五纽约飞迈阿密，经济舱，预算 $300 以内，先给我三个航班选项，不要直接下单。”\nai代理和普通聊天机器人的差别：它有一台独立的云端电脑和浏览器，关 App 后还能继续干活；发邮件、付钱这类敏感操作会先问你。\n目前 AI代理app只支持美国市场，在欧洲和亚洲暂时无法使用。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【20】"}, {"n": 25, "t": "傅蔚冈 · 看中了一件羽绒服一直没下单，这两天亏的应该够买好多件了。生活中抠抠搜搜，股市类挥金入土。", "b": "看中了一件羽绒服一直没下单，这两天亏的应该够买好多件了。生活中抠抠搜搜，股市类挥金入土。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【25】"}], "cult": [{"n": 8, "t": "25岁网红博主患癌去世", "b": "她表示 :“自己每天基本在12点到2点间睡觉; 一天吃2顿饭，中间间隔时间长; 不爱\n喝水，一天2杯咖啡，一周喝3-4次奶茶，平时吃外卖或下馆子。”\n\\  Ce RRS NACH", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【8】"}, {"n": 19, "t": "26日下午约3点，\u003c纽约时报> 游戏部门总监 ，40岁的 Jonathan McKinsey 在加州旧金山湾区都柏林市的 Dub", "b": "纽约时报中文网人                                                        Go\n@nytchinese\n& Show translation\n湾区夫妇被控枪杀跨性别女婿: MHRERS—BRLAE, WER\n妻子的父母张守勇 〈音) 和陈诗丽〈音)。记录显示他与麦子婚姻破裂，他\n曾指控妻子以及岳父母因其跨性别身份虐待他。\n一对湾区夫妇被控枪杀跨性别女姬\nFrom cn.nytimes.com\n2:00 PM - Sep 29, 2026 - 39.6K Views", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195855#:~:text=【19】"}]}}, {"date": "20261001", "label": "10月1日", "week": "周四", "id": "195877", "title": "他说自己知道该怎么操作，是因为平时经常看航空事故纪录片", "cats": {"econ": [{"n": 2, "t": "新华社：双重压力重挫美国消费者信心", "b": "新华社: 双重压力重挫美国消费者信心\n09/30 20:00 星期三                                69 约2分钟\n新华社发文指出，美国研究机构世界大型企业研究会9\n月29日公布的数据显示，美国9月的消费者信心指数为\n81.9，创下2014年4月以来最低水平。分析人士指出，\n该指数连续第三个月环比走低，反映出美国民众对经济\n的失望情绪日益加剧，对经济前景翡观预期加深，能源\n价格飙升和通胀高企是拖累美国消费者信心的主要原\n因。\n汽油、柴油、取暖和运输支出攀升直接侵蚀美国家庭的\n实际可支配收入。食品价格也因运输成本和农产品价格\n上涨而面临上行压力，家庭预算进一步收缩。若能源价\n格上涨不能有效缓解，消费者信心可能继续走低。\n“为了维持支出，家庭正在减少储著、增加借贷……如果\n在美联储加息背景下，消费者越来越依赖信贷，那么随\n着利率上升，债务违约率也将会上升。 ”加拿大皇家银行\n首席经济学家弗朗西丝.唐纳德在报告中写道。这无疑会\n威胁到消费支出。唐纳德还指出，当消费者的信用评级\n下降时，他们可能会失去获得信贷的机会，而这会引发\n一系列连锁反应。 (新华社)", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【2】"}, {"n": 6, "t": "武汉推楼市新政：“拿地即开工”、“交房即交证”", "b": "武汉市住房和城市更新局、武汉市自然资源\n和城乡建设局、武汉市地方金融管理局发布\n关于贯彻落实《关于完善商品住房销售制度\n的通知》的实施意见。其中提到，推行“拿\n地即开工”。房地产开发企业签订土地出让\n合同并取得宗地不动产预告登记证明的，可\n先行办理建设工程规划许可、建筑工程施工\n许可、不动产测绘及楼盘表等手续。对按土\n地出让合同约定按时缴纳土地出让价款的项\n目，其对应部分可申请办理预售许可手续。\n房地产开发企业为保障项目开工建设，申请\n商品住房开发贷款，在主办银行会同市房产\n交易中心对项目资金进行封闭管理的前提\n下，可办理宗地不动产抵押权预告登记，具\n体办法另行制定。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【6】"}, {"n": 16, "t": "赫格塞斯星期三（9月30日）在匡蒂科（Quantico）军事基地告诉美军初级军官和士兵：“负责统计数据的人员指出，我们已经解雇全", "b": "匡蒂科（Quantico）军事基地告诉美军初级军官和士兵：“负责统计数据的人员指出，我们已经解雇全军10%的将军和海军上将，还把将军级职位总数额削减10%。所以没错，我军整体裁员幅度达到20%。”\n他接着表明：“媒体称这是‘清洗’，但我称之为问责，而且早该这么做了。”\n美国国防部，今天正式成立“宗教事务办公室”，直接向部长汇报。部长宣布这一决定时引用圣经。\n美国宪法第一修正案，确立“政教分离”原则、禁止政府设立“国教”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【16】"}], "soc": [{"n": 1, "t": "据@湖南高速警察七支队通报：2026年10月1日凌晨2时7分许，沪昆高速怀化段1407KM+200M处发生一起道路交通事故。接警", "b": "026年10月1日凌晨2时7分许，沪昆高速怀化段1407KM+200M处发生一起道路交通事故。接警后高速公路公安交管部门立即启动应急预案，联动应急、医疗等部门赶赴现场处置。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【1】"}, {"n": 3, "t": "本通告自发布之日起施行。2026年6月4日发布的《天津市人民政府关于公布本市微型轻型小型无人驾驶航空器适飞空域范围的通告》同时废", "b": "6年6月4日发布的《天津市人民政府关于公布本市微型轻型小型无人驾驶航空器适飞空域范围的通告》同时废止。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【3】"}, {"n": 4, "t": "财新：易会满，至少被倒查了25年", "b": "会满现年62岁，早年在工行工作34\n年，早期在杭州市分行、浙江省分行\n任职，于2000年初起出任江苏省分行\n副行长并主持工作。由上述通报涉及\n的职务推算，易会满至少被倒查了25\n年\n@ st @\n会满，至少被倒查了25年", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【4】"}, {"n": 5, "t": "听到现场的吵闹声和嘲讽后，王皓情绪激动，面带怒色回头向观众鼓掌，以此表达对饭圈式挑衅的不满。一旁的王励勤见状赶紧上前用力拉住王皓", "b": "情绪激动，面带怒色回头向观众鼓掌，以此表达对饭圈式挑衅的不满。一旁的王励勤见状赶紧上前用力拉住王皓，将其拽离现场，避免事态升级。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【5】"}, {"n": 7, "t": "公司关注到网传9月28日合肥至大连航班空中服务事件相关视频。经核实，航班乘务员在推餐车提供饮料服务过程中，全程提示旅客注意，因一", "b": "大连航班空中服务事件相关视频。经核实，航班乘务员在推餐车提供饮料服务过程中，全程提示旅客注意，因一名旅客处于睡眠状态，不慎造成餐车与其手肘发生触碰。乘务员当即反复致歉，查看旅客状况。该旅客情绪激动，连续使用粗俗过激言语，并出现威胁脚踢乘务员、要求当事乘务员落地后陪同就医等言行，该乘务员受到惊吓。为维护飞行安全和客舱秩序，乘务长、安全员迅速介入协同处置。航班落地后，医护人员上机检查旅客未有明显外伤或肿胀、无须进一步处理，旅客拒绝地面人员陪同送医，自行离开。\n@傅蔚冈:第一，飞机的安全员不应该是摆设：第二，这种人落地不以威胁飞行器抓起来，就不要怪层出不穷了；第三，作为东航尊敬的常旅客，对发生这张事件表示愤慨。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【7】"}, {"n": 8, "t": "可以同时支持使用电饭锅、电火锅和电热水壶", "b": "和电热水壶", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【8】"}, {"n": 10, "t": "寒武纪离职高管索赔金额从43亿元调整至278.32亿元", "b": "公司原副总经理梁军\n(2022年初已离职) 对诉讼请求作出\n变更，将索赔的股权激励损失金额从\n42.87亿元调整为278.32亿元。\n4+ &\n寒武纪离职高管索赔278.32亿元", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【10】"}, {"n": 12, "t": "胖东来创始人于东来在发文，称2027年3月开始，公司研究决定胖东来员工及管理层每周工作5天休息2天，每天工作7小时，每周工作35", "b": "《 ”CQ 搜你想看的                             搜索\n2027年3月开始! 公司研究决定、胖东\n来实现胖东来员工及管理层每周工作五\n二让\n小时的工作方式! ……eS A I\n多人轻松幸福的工作和生活!\na’!\n9  cr\ni. LY .\nia sere A Ral\nCA ES aN\n992\n@傻坏蛋于..， 男玫坟               4\nt= OR Mag 2\nOW tps EA se Semi eed", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【12】"}, {"n": 19, "t": "越南公安部近日逮捕了三名涉嫌从事恐怖主义活动的男子，其中包括一名持挪威护照的男子和一名持澳大利亚护照的越裔男子。", "b": "事恐怖主义活动的男子，其中包括一名持挪威护照的男子和一名持澳大利亚护照的越裔男子。\n越新党发表声明强烈谴责越南当局的举动，并指称阮德顺与胡范协辉是在柬埔寨南部靠近越南边界的区域失踪，实际上是在柬埔寨境内遭绑架和强行押回越南，两人根本就没有打算入境越南。越新党并未确认蔡公长山为其成员。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【19】"}, {"n": 21, "t": "学生自上周起在学校门口举行示威，抗议班级人数过多、课业繁重和教师短缺等问题。他们用垃圾桶挡住校门并点火，一些学生星期二（9月29", "b": "抗议班级人数过多、课业繁重和教师短缺等问题。他们用垃圾桶挡住校门并点火，一些学生星期二（9月29日）同警方发生冲突，警方发射催泪瓦斯驱散人群。\n【法国高中生持续封锁学校 逾400人被捕】法国官员说，在一波针对教师短缺和校舍破旧的学生示威中，数十人受伤、数百人被捕，其中大多数是青少年。周三的示威活动影响了全国各地的高中。\n路透社星期三（9月30日）报道，示威和封锁行动上周开始，并于周二与规模更大的公共部门罢工同时发生。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【21】"}, {"n": 23, "t": "日本近来出现大量“魔鬼集训营”式的高压补习班，甚至有补习班为小学生开办长达35天的寄宿课程，收费高达80万日元。在少子化时代，日", "b": "式的高压补习班，甚至有补习班为小学生开办长达35天的寄宿课程，收费高达80万日元。在少子化时代，日本家长不惜砸下重金培养孩子，但教育学家却担心，升学考试带来的过度竞争将使孩子承受过大压力。\n【日本出台“儿童投资”框架 呼吁通过投资为孩子存教育费】日本政府调整了国民免税理财政策，将免税投资的适用年龄下限放宽至新生儿。这一即将于明年推出的“儿童版”小额免税投资账户（NISA），估计能吸引父母和祖辈们给下一代注入起步资金，通过长期理财积累财富。不过，新措施也引发争议，舆论担忧可能加剧日本社会的贫富分化。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【23】"}, {"n": 26, "t": "这条鲨鱼属于短尾真鲨。它于9月18日首次出现在北港一条狭窄水道内，之后一直无法游回大海。当局星期二（9月29日）展开救援，出动船", "b": "18日首次出现在北港一条狭窄水道内，之后一直无法游回大海。当局星期二（9月29日）展开救援，出动船只在鲨鱼后方喷水，想把它引向外海，但鲨鱼避开了水柱，救援行动最终失败。当局计划星期五改用渔网，引导它离开水道。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【26】"}, {"n": 28, "t": "川普正式将福克斯新闻打为左媒", "b": "@) REAE + J+ Be gg\n@realDonaldTrump\nATA Ae:\n哈基姆\" 杰弗\n以及所有民主党人\n总是让查克 = 舒默、\n斯、杰西卡塔尔洛夫\n上节目，说共和党的\n坏话，当然还有我的坏话?实际上，我\n认为他们比支持共和党的节目获得更多\n的播\n和时间。这就是为什么MAGA和真\n正的爱国者永远不会\n喜欢福克斯! 他们\n不断重复完全负面的叙述，  然后我们迅\n速反驳。我赢得了\n人惊叹。反对声浪\n三次选举，   这真是\n巨大，   但斗争仍在继\n续! 总统唐纳德 J“' 特朗普\n578次转发 1.89k点赞\n2026年9月30日，下午12:15", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【28】"}, {"n": 39, "t": "古往今来，狱吏都没有跟囚犯同吃同住同生活的吧", "b": "教育部发布指南: 推进辅导员与学\n生同吃、同住、同生活\n高教新闻， 看一 Waar\n2026 4°) = 2-9 = Bao OLO MINCE © SCY =o\nrena ies) aan een\nHENAN HIGHER EDUCATION\nSe ON ow Sy 2 C0 ied Vokes\n区综合管理模式建设提质增效指南 (2026年\n修订版) 》，其中提到建立辅导员入驻学生社\n区机制，制定驻楼工作指南，明确社区工作职\n本\n司住、同生活，有效实现辅导员与社区学生同\n场域、同频率、同成长。观测重点: 社区辅导\nUe] PSO Se ee BOE\ntat. A RAR X——\na", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【39】"}], "intl": [{"n": 13, "t": "迪拜航空一架飞往特拉维夫的客机星期三（9月30日）在飞行途中突然急速下降，随后紧急降落在沙特阿拉伯塔布克机场。以色列总理内坦亚胡", "b": "星期三（9月30日）在飞行途中突然急速下降，随后紧急降落在沙特阿拉伯塔布克机场。以色列总理内坦亚胡称，一名飞行员刺伤同僚，并企图让客机坠毁，杀害机上乘客。\n今天这起 Flydubai FZ1073 事件中，遭副驾驶刺伤的机长是印度籍的Smit Machchhar。\nMachchhar 具有超过 13 年商业航空飞行经验，长期专飞波音 737 系列。他 2011 年进入印度廉航 SpiceJet，工作约 11 年，曾担任高级机长和航线训练机长，负责带教和考核其他飞行员。2022 年 6 月，他以 Direct Entry Captain 身份加入总部位于迪拜的 Flydubai，目前常驻迪拜。根据其公开职业资料，他累计飞行时间约 9750 小时。\n在今天从迪拜飞往特拉维夫的 FZ1073 航班上，阿曼籍副驾驶突然袭击 Machchhar，并试图控制飞机。Machchhar 遭刺伤后仍进行反抗，他在重伤情况下设法打开驾驶舱门，让机组人员和乘客得以进入并制服副驾驶。随后机上一组正在搭乘该航班的 Flydubai 当值机组接管飞机，并在沙特安全降落。\n内塔尼亚胡随后公开赞扬了包括 Machchhar 在内的机组和乘客。\n另外，Smit Machchhar 大约一年前上过一期播客，节目叫 \u003c Bonafide Banter with Zalak Mata>。Machchhar 在里面讲了不少自己的经历：他透露当飞行员其实并不是童年梦想。中学毕业后，他最初读的是纺织工程，因为家里从事相关生意，后来又去读管理课程。大约 19 岁时参加一次航空业讲座后，他才决定转行学飞行，之后前往新西兰接受飞行训练。当时培训费用大约是 160万―170万印度卢比。Machchhar 当时谈到空乘的重要性，大意是很多人低估机组人员，但“当事情真的出问题时，你就需要他们了”。\n内塔尼亚胡的推特", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【13】"}, {"n": 14, "t": "美国和伊朗通过卡塔尔斡旋的间接谈判暂未取得突破。有消息指，双方对最新和解方案所涉及的步骤大致达成共识，但在执行先后顺序上仍有分歧", "b": "谈判暂未取得突破。有消息指，双方对最新和解方案所涉及的步骤大致达成共识，但在执行先后顺序上仍有分歧。\n【谈判陷僵局 传鲁比奥勒令伊朗团队立即离美】美国媒体报道，美国与伊朗谈判陷入僵局，美国国务卿鲁比奥罕见发出逐客令，要求伊朗代表团立即离开美国。\n被勒令离开纽约的伊朗官员包括伊朗外交部长阿拉格齐。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【14】"}, {"n": 15, "t": "伊拉克战争爆发23年后，最后一批美国军队周三（9月30日）离开伊拉克，结束美国在这个重要中东国家长达23年的军事存在。接下来，伊", "b": "批美国军队周三（9月30日）离开伊拉克，结束美国在这个重要中东国家长达23年的军事存在。接下来，伊拉克政府如何肩负起国内安全责任，并在今后与美合作和不惹怒伊朗之间保持平衡，值得关注。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【15】"}, {"n": 17, "t": "扎哈罗娃说：“欧洲国家为乌克兰生产武器的军工厂，是俄罗斯潜在的军事打击目标。人们不应认为，位于乌克兰境外、为基辅政权生产武器的军", "b": "生产武器的军工厂，是俄罗斯潜在的军事打击目标。人们不应认为，位于乌克兰境外、为基辅政权生产武器的军工厂会是安全的。任何抱有此种想法的人都错了。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【17】"}, {"n": 18, "t": "服务于1亿3000万人的欧洲支付集团将成立一家名为“欧洲支付网络”（European Network for Payments，", "b": "付集团将成立一家名为“欧洲支付网络”（European Network for Payments，简称ENP）的新合资企业，总部设在马德里，负责连接各国支付系统。\n随着全球秩序日渐分裂，外界对关键支付系统准入问题的担忧有所加剧，欧洲政策制定者已将支付主权列为优先事项。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【18】"}, {"n": 20, "t": "自2001年以来，包括大英博物馆和国家美术馆在内的英国国家博物馆，常设展览一直对每年到访的数百万游客免费开放，这与欧洲及其他地区", "b": "馆和国家美术馆在内的英国国家博物馆，常设展览一直对每年到访的数百万游客免费开放，这与欧洲及其他地区许多同类博物馆不同。\n英国政府今年3月宣布，将研究是否向外国游客收费，以增加博物馆资金来源。\n不过，在经过数月咨询后，文化部门最终决定不推行这项措施，并称收费也可能导致英国本地游客却步。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【20】"}, {"n": 22, "t": "日本政府星期四（10月1日）启动更严格的永居申请条件，新规分阶段实施，要求申请人必须证明自己的年收入高于平均水平，并具备用日语进", "b": "动更严格的永居申请条件，新规分阶段实施，要求申请人必须证明自己的年收入高于平均水平，并具备用日语进行日常会话的能力；永居申请费即日起上调20倍。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【22】"}, {"n": 24, "t": "面对人工智能（AI）失控引发的安全疑虑，美国总统特朗普与科技巨头签署一份自愿协议，承诺自行加强内部监控和独立审计，通过企业自律保", "b": "安全疑虑，美国总统特朗普与科技巨头签署一份自愿协议，承诺自行加强内部监控和独立审计，通过企业自律保障为AI发展自设护栏。但特朗普仍反对新增联邦监管，为的是维护美国在AI竞赛中的领先地位。\n加州州长牛森跟川普杠上了：在加州AI只能叫AI", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【24】"}, {"n": 25, "t": "尽管由特朗普力推，这个聊天机器人却很快就开始在一些争议话题上，与总统唱反调，例如2020年总统大选，以及次年1月6日国会山骚乱事", "b": "人却很快就开始在一些争议话题上，与总统唱反调，例如2020年总统大选，以及次年1月6日国会山骚乱事件。\n特朗普坚称自己赢得2020年总统选举，并抨击那场大选存在欺诈现象。America.gov却在上线首日直言：“2020年大选后的官方联邦评估，并未发现足以改变选举结果的欺诈行为。”\n上线仅一天后，这款机器人便停止回答某些政治问题。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【25】"}, {"n": 27, "t": "派克是美国现代死刑制度下，田纳西州唯一因未成年时期所犯罪行而被执行死刑的人。然而，在接受两剂致死量戊巴比妥（pentobarbi", "b": "西州唯一因未成年时期所犯罪行而被执行死刑的人。然而，在接受两剂致死量戊巴比妥（pentobarbital）后，派克似乎仍未死亡。见证者目睹一辆闪烁警示灯的救护车驶离监狱。\n1995年1月，时年18岁的派克与17岁的男友希普（Tadaryl Shipp）及另一名同伙，将19岁的受害人斯莱默（Colleen Slemmer）诱骗至一片树林中，并对她进行折磨和杀害。派克和希普承认杀人罪行，两人均在次年被判犯有一级谋杀罪。派克被判处死刑，希普则被判处终身监禁并有假释机会。\n道格拉斯卡特，被判处死刑37年后，新的DNA证据使法官下令释放他出狱。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【27】"}, {"n": 30, "t": "美国各地的食物救济机构，需求比去年同期增长20-60%", "b": "去年同期增长20-60%\n油价上涨，占据更多开支，食物涨价，可支配收入不够…越来越多中产不得不领取免费食物", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【30】"}, {"n": 32, "t": "据他讲述，副驾驶刺伤机长并令飞机急速俯冲后，他冲进驾驶舱，把副驾驶锁喉拖了出来，与其他乘客合力制服。Hayoun随后返回驾驶舱，", "b": "机急速俯冲后，他冲进驾驶舱，把副驾驶锁喉拖了出来，与其他乘客合力制服。Hayoun随后返回驾驶舱，向后拉操纵杆帮助飞机恢复平飞，之后由机上其他飞行员接管并安全降落沙特。\n更不可思议的是，Hayoun此前没有接受过飞行训练，他说自己知道该怎么操作，是因为平时经常看航空事故纪录片《空中浩劫》。\n返回以色列后，他仍穿着沾血的衬衫，在本-古里安机场受到总理内塔尼亚胡接见。内塔尼亚胡称他是“英雄”，并表示他的行动避免了一场巨大灾难。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195877#:~:text=【32】"}], "tech": [{"n ~:text=【9】"}, {"n": 10, "t": "共和党的中期选举选情告急，美国总统特朗普要选民“假装”他也参选，支持他保住国会控制权，以免让民主党有机会再寻求弹劾他。特朗普10", "b": "总统特朗普要选民“假装”他也参选，支持他保住国会控制权，以免让民主党有机会再寻求弹劾他。特朗普10月1日先后到得克萨斯州和俄克拉何马州为共和党候选人站台。他在俄州的群众大会上说：“请假装上阵的人是我，我的名字也在选票上。如果我们没赢，他们（指民主党）将会弹劾我。如果让他们重新掌权，我们的国家将被毁掉。”\nTrump今天在深红州Alabama拉票，主题：美国现在是前所未有的黄金时代\n媒体采访参加活动的支持者和场外的抗议者，共同主题：油价太高、物价太贵", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195907#:~:text=【10】"}, {"n": 12, "t": "在伊朗战争、高借贷成本和强厄尔尼诺的三重危机下，联合国机构警告，发展中国家保护民众免受能源和物价上涨冲击的政策空间正逐渐缩小，早", "b": "尼诺的三重危机下，联合国机构警告，发展中国家保护民众免受能源和物价上涨冲击的政策空间正逐渐缩小，早前采取的纾困措施也越来越难以维系，局势还可能进一步恶化。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195907#:~:text=【12】"}, {"n": 13, "t": "泰国近期的洪灾导致泰国国际航空公司运营陷入混乱，泰航董事会星期五（10月2日）解除了首席执行官猜・恩希里的职务，并启动内部调查。", "b": "公司运营陷入混乱，泰航董事会星期五（10月2日）解除了首席执行官猜・恩希里的职务，并启动内部调查。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195907#:~:text=【13】"}], "tech": [{"n": 5, "t": "同一个人说AI创作的内容像猪饲料一样。", "b": "料一样。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195907#:~:text=【5】"}, {"n": 11, "t": "日本首相高市早苗10月1日召开“日本增长战略会议”，将发展人工智能（AI）定位为推动经济增长的“加速器”。 她说，日本将通过培育", "b": "“日本增长战略会议”，将发展人工智能（AI）定位为推动经济增长的“加速器”。 她说，日本将通过培育利用AI自主控制机器人的“物理AI”等高科技实现强劲经济。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195907#:~:text=【11】"}, {"n": 16, "t": "当地时间10月2日，脑机接口公司Neuralink高管齐利斯(Shivon Zilis)在X发表长文，宣布已与马斯克分手。", "b": "司Neuralink高管齐利斯(Shivon Zilis)在X发表长文，宣布已与马斯克分手。\n齐利斯还分享两人分手前的部分短信对话，透露这场分手来得毫无预警。\n她表示：“一周内从深爱到放手，没有任何预警，这很难，但有时候事情就是这样。”\n齐利斯与马斯克的关系最初始于精子捐赠，当时马斯克是她的精子捐赠者。两人后来发展成恋人，并育有4个孩子：龙凤胎斯Strider和Azure，女儿Arcadia以及儿子Seldon Lycurgus。\n尽管这段关系突然告终，齐利斯的字里行间仍流露出不舍与祝福。\n她表示，“我很受伤，但对伊隆身怀关切，并将永远支持他追求幸福。祝好运，伊隆，世界有你真幸运。”\n值得注意的是，目前上述帖子已不可见，且马斯克已经取关齐利斯。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195907#:~:text=【16】"}, {"n": 17, "t": "为什么？", "b": "因为AI和机器人几乎可以立即完成你提出的任何要求。\n未来真正的优势不在于“亲自做事”，而在于“知道该提出什么要求”。\n你的知识面越广，就越能提出更好的问题。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195907#:~:text=【17】"}, {"n": 21, "t": "FTC关注的重点包括AI 是否出现了超出开发者预期的危险行为，是否把这些潜在风险充分告诉消费者，尤其关注 AI agent，而不", "b": "出现了超出开发者预期的危险行为，是否把这些潜在风险充分告诉消费者，尤其关注 AI agent，而不只是普通的问答对话。\nFTC 准备要求两家公司提供内部资料。根据目前报道，FTC 计划向 Anthropic 和 OpenAI 发出 civil investigative demands（民事调查要求，类似强制性传票），要求提供相关文件，并可能要求高管作证。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195907#:~:text=【21】"}], "cult": [{"n": 14, "t": "#纳指创历史新高# ，用他们的话说，风险越来越大了", "b": "an sa TOAST od\nve\n8\nal\nar\nDon 4, 7", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195907#:~:text=【14】"}]}}, {"date": "20261004", "label": "10月4日", "week": "周日", "id": "195915", "title": "全球同此凉热", "cats": {"econ": [{"n": 2, "t": "香港也开始抓生育了，港府这11项生育政策力度如何？", "b": "港府新一份施政报告11项生育支持政策\n2万港元新生婴儿奖励金计划延续三年\n二胎及以上子女奖励金由2万提高至3万港元\n二胎及以上子女免税额由14万提高至16万港元\n二胎及以上子女出生后首两年的额外免税额亦由14万提高至16万港元\n生育前一年或后两年内购置住:刀，获减免最多2万港元印花税\n有新生婴儿的居屋白表申请家庭，最高房贷成数提升至95%\n香港医管局三年内逐步增加体外受精服务名额至每年1900个\n地区康健中心和康健站提供免费孕前、产前及产后班组服务\n增建三所资助独立幼儿中心，2030年底前额外提供约1800个照顾名额\n在校课后托管服务计划恒常化\n加强学前儿童课余托管服务\nOMNOORWN =\n26", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【2】"}, {"n": 17, "t": "印度尼西亚智库发布的最新调查显示，印尼私召汽车及电单车（又称网约车）司机中，有高达73.8%是因为无法在正规市场找到工作，才被迫", "b": "示，印尼私召汽车及电单车（又称网约车）司机中，有高达73.8%是因为无法在正规市场找到工作，才被迫选择投入零工经济。这一数据凸显零工平台已成为印尼失业及裁员受害者维持生计的主要避风港。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【17】"}, {"n": 18, "t": "企业招聘数据公司Draup提供给美国消费者新闻与商业频道（CNBC）的分析报告显示，摩根大通（JPMorgan Chase）、花", "b": "给美国消费者新闻与商业频道（CNBC）的分析报告显示，摩根大通（JPMorgan Chase）、花旗集团（Citigroup）和第一资本（Capital One）等银行今年的AI相关职位比2025年增加49%，达到13万9819个。\n其中，增长最快的领域是涉及AI代理的技能，例如与代理编排（agent orchestration）有关的招聘信息今年激增1721%，相关工作范围包括设计多个AI代理，让它们协同完成一项任务。\nDraup首席执行员斯瓦米纳坦受访时说：“这可说是华尔街最炙手可热的技能。这是个巨大的机遇，他们需要既懂数据、又懂AI，并且知道如何应用AI的人才。”\n【报告：AI将重塑美国职场 1100万人或须转行】未来10年，美国在人工智能（AI）普及带来的就业变革中，面临的最大挑战可能不是大量岗位消失，而是如何帮助数以百万计的劳动者转行。咨询公司麦肯锡发布报告指出，到2035年，美国预计将有约1100万名劳动者因AI取代部分工作内容而被迫转换工作，这相当于目前美国劳动人口的7%。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【18】"}, {"n": 22 生交往期间，日常互相送饮\n品、互发小额红包，女生有时还会\n多加钱回赠，这件事让男子误以为\n形成了往来惯例，还嗅到了一丝商\n机。\n女生生日当天，男子送出520元红\n包，满心等着对方回一个1514元红\n包。可迟迟没有等来预期的回礼，\n男子便觉得自己遭到欺骗，选择报\nae\n在女生看来，520是生日礼物，本\n就不需要返还。男子却直言: “我\n都给了你520，你为什么不回我\n1314? ”\n经过民警调解，女生最终退还了\n520元红包，表示再也不想和该男\n子见面。\n江苏新闻综合上海警务纪实节目\n(#, 11005? ) . AAR\nQO SHAS wee ANH, BX...\nOpe  O52  © 47   wW7", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【5】"}, {"n": 6, "t": "泰山", "b": "。\n不知道的还以为是拼豆撒了", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【6】"}, {"n": 8, "t": "中奖的人可以有资格在线办理eSIM", "b": "IM", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【8】"}, {"n": 10, "t": "阿拉伯联合酋长国证实迪拜航空事故为一起恐怖攻击，副机师以斧头袭击机长，并企图让飞机坠毁。这名阿曼籍副机师之前在阿曼航空任职，据报", "b": "故为一起恐怖攻击，副机师以斧头袭击机长，并企图让飞机坠毁。这名阿曼籍副机师之前在阿曼航空任职，据报曾因思想激进化被禁飞，离职后却先后加入摩洛哥皇家航空和迪拜航空，引发外界对航空业如何审查员工背景的关注。\n【内坦亚胡邀迪拜航空印度籍英雄机长访以色列】在飞行中遭到副机师用航空应急斧砍伤，但负伤后仍临危不乱，拼死打开舱门，为他人制服暴徒创造条件。这名在恐怖袭击中帮助保住了一百多名以色列乘客生命的阿联酋迪拜航空（flydubai）印度籍英雄机长，获以色列总理内坦亚胡邀请访问以色列。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【10】"}, {"n": 16, "t": "当地时间10月2日，美国纽约州州长凯茜・霍楚尔召开新闻发布会，严厉谴责康奈尔大学警方和地方检察官对“康奈尔大学性侵案”的调查方式", "b": "州长凯茜・霍楚尔召开新闻发布会，严厉谴责康奈尔大学警方和地方检察官对“康奈尔大学性侵案”的调查方式，称被害者“在每一个环节都被辜负”。《纽约时报》称，其措辞“直接且有时带有愤怒”。\n霍楚尔已任命纽约州总检察长莱蒂西亚・詹姆斯领导对此案的调查，同时计划与州立法机构合作改革法律，以保护在遭受性侵犯之前自愿饮酒或吸毒而失去意识的受害者。\n此前9月16日，该案受害女子、康奈尔大学前学生简・多伊（化名）向纽约州最高法院提起民事诉讼。她表示，2024年10月，她在齐菲兄弟会宿舍被几名男子灌酒并被强迫吸毒后遭性侵犯。其律师强调，受害女性并未作出性同意。\n7名嫌疑人当时均为康奈尔大学学生。其中四人承认有过性接触，但称是双方自愿；其余三人否认参与过任何性行为。康奈尔大学警方和纽约州汤普金斯县地方检察官对此案进行了调查，但并未提出任何指控。受害者指控称，校方未能充分保护她。近期，此案成为全美关注焦点，再次被重启调查。\n纽约州州长霍楚尔表示，受害者当时报案接受大学警方问询时，明确表示自己“百分百”遭到性侵犯，而提交给地方检察官办公室的声明中却缺少这一表述，地方检察官也从未与受害者进行面谈。\n“在哪个社会，警方会从受害者口中得知，她在醉酒状态下在兄弟会宿舍被轮奸，却不将这一指控提交给地方检察官？在哪个社会，地方检察官竟然不去约谈她或任何其他相关人员，甚至不去索要完整的笔录？”\n霍楚尔说：“这位年轻女性遭受了难以言喻的苦难，而那些有义务保护她的人和机构却在每一个环节都辜负了她......作为州长，我绝不允许任何人掩盖此案，我们正在确保此案的所有事实都公之于众。”\n性侵幸存者和受害者权益倡导者表示，根据现行的纽约州法律，如果受害者在遭受性侵犯之前自愿吸毒或饮酒，则很难对施暴者提起诉讼。\n针对这一“漏洞”，霍楚尔表示，将与立法机构合作进行弥补：“如果某人醉酒到无法表达意愿，那么其选择吸毒还是喝酒都无关紧要。自愿醉酒并不是性侵犯或轮奸的许可证。”\n纽约州议员杰弗里・迪诺维茨曾于2019年首次提出修改州法律以弥补这一漏洞，美国大约一半州已修改法律。他告诉BBC：“问题的关键在于，如果你是自愿醉酒，你现在就得不到公正的对待。自愿醉酒，基本上就相当于给了某人一张免罪金牌。”\n被指派调查案件的州总检察长詹姆斯表示，她将在未来几个月内“审查事实、收集证据、采访证人，并在必要时提起公诉”。\n詹姆斯经常介入政治敏感问题。她曾指控现任总统特朗普夸大其净资产数十亿美元，并在2024年赢得了一起针对特朗普的民事诉讼。\n原来经手此案的地方检察官马修・范・豪顿发表声明称，他支持州长对詹姆斯的任命，其办公室将与詹姆斯的办公室充分合作。他说：“很明显，校方并没有向我们提供全部情况。”\n当被问及州长对康奈尔大学警方的批评时，康奈尔大学发言人表示，由于调查仍在进行中，校方不予回应。\n受害者的律师托马斯・吉弗拉2日接受采访时表示，受害者“情况不太好”，“她在社交媒体上遭到围攻，有人试图人肉搜索她；还有一些虚假的法庭帖子，企图曝光她的身份。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【16】"}, {"n": 19, "t": "塔利班治下的阿富汗官方媒体发表的新闻，据称：阿富汗民众每年约需要 30 万吨食盐，而目前其国内年产量已达到 34.4 万吨。阿富", "b": "这ii\n阿富汗已实现食盐\n生产自给自足", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【19】"}, {"n": 21, "t": "首先问为什么打仗，再说其他", "b": "17:16 从                               ull > @)\narednote\n义“ 我问了我妈一个普通的问题 - rednote\nwww.xiaohongshu.com\nsy    四\n小区挂上了国旗，我和妈妈下楼，\n看着国旗我问我妈“如果打例了，\n您愿意我上战场吗? ”我妈严肃地\n说“愿意，但是我更愿意我们这个\n年纪的先上，你们年轻人做后备军，\n更有力气建设国家。”我说“您都\n五十了，去了就是填线的。”我妈\n说“正因为我们这个年龄见过了很\n多，你们还是刚升起的太阳，刚开\nHHL,我们要保护你们好好长大，\n填线就填线跑，消耗完敌人你们再\n上更省心。”我问我妈“不怕\n|\n@  FRIED EAS                                 Follow\n我问了我妈一个普通的问题\n#关于亲情#大家都是普通人 关中… #普通人 #国庆节\nia              (人 Open in App\nZ Write a comment              9 66  vy 2  © 34", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【21】"}, {"n": 23, "t": "一", "b": "一\n健美裤又穿回来了\n= ares) :\n里\n8年", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【23】"}, {"n": 24, "t": "@还是嘿嘿2号:占便宜的一代和受冲击的不是同一代人", "b": "受冲击的不是同一代人", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【24】"}], "intl": [{"n": 11, "t": "中东地区和西方官员透露，沙特阿拉伯正计划在也门对获得伊朗支持的胡塞武装组织发起攻势，可能在未来几周动员超过10万名也门政府军士兵", "b": "拉伯正计划在也门对获得伊朗支持的胡塞武装组织发起攻势，可能在未来几周动员超过10万名也门政府军士兵，并在美国的军事顾问与情报支持下展开空袭，目标是确保红海航运通道安全并扭转战局。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【11】"}, {"n": 12, "t": "二十国集团（G20）少数成员拒绝了美国呼吁遏制工业产能过剩的议题，且多数成员不支持就消除供应链强迫劳动问题加强合作。这一最新表态", "b": "绝了美国呼吁遏制工业产能过剩的议题，且多数成员不支持就消除供应链强迫劳动问题加强合作。这一最新表态凸显全球主要经济体在华盛顿主导的几项重大国际贸易议题上存在重大分歧。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【12】"}, {"n": 13, "t": "一直反对俄乌战争的俄罗斯前总理卡西亚诺夫批评，尽管俄罗斯经济问题日益严重，普通民众与精英阶层的焦虑情绪也在上升，但现任总统普京并", "b": "卡西亚诺夫批评，尽管俄罗斯经济问题日益严重，普通民众与精英阶层的焦虑情绪也在上升，但现任总统普京并不愿承认入侵乌克兰是个错误决定，也没有准备好通过谈判来结束战争。\n卡西亚诺夫星期六（10月3日）在巴黎接受法新社专访时说，他相信普京深知自己在2022年入侵乌克兰是一个错误，但他绝不会改变既定路线。\n卡西亚诺夫直言：“他犯了一个自己无法承认的错误……他轻信了安全部门关于乌克兰很脆弱的报告。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【13】"}, {"n": 14, "t": "朝鲜星期六向东部海域发射一枚弹道导弹，并在当天稍晚证实进行“人工智能中程战略导弹”发射训练，领导人金正恩亲自观摩。此次射弹距离韩", "b": "道导弹，并在当天稍晚证实进行“人工智能中程战略导弹”发射训练，领导人金正恩亲自观摩。此次射弹距离韩国要求朝鲜就非军事区地雷爆炸事件道歉仅三天，也发生在朝鲜劳动党总务部长金与正拒绝韩国对话提议的次日，显示韩朝紧张局势进一步发酵。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【14】"}, {"n": 15, "t": "当地时间4日，就驻日美军涉嫌杀人案，日本首相高市早苗在社交媒体发文称，“发生如此极其残忍、凶恶的事件，令人深感遗憾”。她称，日本", "b": "人案，日本首相高市早苗在社交媒体发文称，“发生如此极其残忍、凶恶的事件，令人深感遗憾”。她称，日本政府已向美方提出强烈抗议，同时强烈要求美方最大限度地配合调查，严肃军纪，并彻底防止类似事件再次发生。#驻日美军士兵涉嫌抢劫杀人被捕#\n此外，日本防卫大臣小泉进次郎当天也表示，此事“令人无法容忍，绝对不能接受”，并称对此“感到强烈愤慨”。他透露，日本防卫省已就此向美方提出抗议。\n美国驻日大使馆当天在社交媒体上发文称，对此次案件中的遇害者家属表示“深切哀悼”。美国驻日大使格拉斯表示，他已向冲绳县知事以及日本外务省传达了美方将全面配合调查的意向。当天，位于冲绳县宇流麻市的驻日美军第三海军陆战队远征军司令部也发表声明，向遇害者家属及其亲友表示哀悼。\n日本冲绳县警方4日逮捕了一名驻冲绳美国士兵，此人涉嫌3日凌晨在冲绳一家酒店抢劫并杀害一名当地女性。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【15】"}, {"n": 20, "t": "Trump上周宣布的“史上最大钢厂已开工，2030在Iowa投产，1700个永久工作岗位”，当地电视台做追踪报道，发现：没买地、", "b": "美国 KWQC 电视台新闻截图：男女主播播报特朗普“史上最大钢厂”2030 年在 Iowa 投产，演播台显示天气与城市画面。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【20】"}, {"n": 25, "t": "这两天看了很多各大媒体以及自媒体采访的法国高中生，问他们的诉求到底是什么。", "b": "体采访的法国高中生，问他们的诉求到底是什么。\n结果给出的理由简直就是五花八门。\n\n比如高中不让带手机；高中每天早上8点上课，到晚上6点，太累了；高中食堂吃的不好；高中一个班居然有39个人，太多了。。\n\n还有些更具体的诉求。\n\n比如有“巴黎郊区”的北非女学生，义愤填膺的抱怨“郊区”的学校，比巴黎市中心的学校差太多，不公平。郊区也要有和市中心一样好的学校。这里需要说明一下，这个郊区可不是风景优美的市郊或者是富人区，而是“脏乱差”的代名词，甚至有一些贫民窟的意味。因为移民多，社会住房多，治安差，小偷和盗窃频发，甚至大家经常在电视上看到的那种巴黎又乱了的景象，很多都风起巴黎市郊。\n\n还有一个学生抱怨说，他们每天要上课这么久，这么长时间困在学校里，就像做了一份全职工作，所以他们要――拿工资！\n\n一个女孩子咆哮的说，她每天要上3个小时的课，但这门课她还是得了零分。。。\n\n另一个孩子说，要通过高考，需要每年看12部剧，但学校只支付看3场戏剧的钱，其他的钱要他们高中生自己掏，一年就是100欧元（约780元）！\n\n仅里昂所在的奥罗阿大区（法国13个大区之一），因为高中生们的“封锁”，就带来了约2500万到3000万欧元（约2亿元）的损失。这些损失不仅限于烧学校，还有破坏其他的公共设施，除了烧救火车，公交车，还有烧垃圾桶。街上就出现了某种诡异的景象，抢垃圾桶的高中生，和保卫垃圾桶的居民。。。\n\n这其中一个名场面，是防爆jing对抗那些暴力熊孩子，一个50多岁的白人女性带着哭腔喊着：他们还只是孩子啊，你们怎么能这么对他们？防爆j都愣了。\n\n只有一个场景令人很舒适，有爹妈上街把自己的孩子直接掐着脖子拎回了家。所以他们还是有爹妈的，只要想，家长还是管得了熊孩子的？", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【25】"}], "tech": [{"n": 3, "t": "人民日报：加快建设强大国内市场，扩大内需仍有巨大潜力、广阔空间。", "b": "连续10 天，《人民日报》刊发金轩署\n名文章\n财联社                             们 576人\nAl摘要\n针对A股的电报快\n[Foal 的则联入      人 准确\n10月4日， 《人民日报》继续刊发金轩署名文章\n9月25日\n北斗为新兴支柱产业打造重要增长极", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【3】"}, {"n": 7, "t": "福建一老人付款时手机频繁弹窗广告，维修店老板花10多分钟卸载软件：卸载入口藏太深，年轻人都不好操作，年纪大的更难。", "b": "《  Q 搜你想看的 僵 听 …\nRe     a\n福建一 老人付款时手机频繁弹窗\n告，维修店老板花10多分钟伯\n载软件: 外载入口藏太深， 年轻\n人都不好操作，年纪大的更难\n近日，福建福州，老人付款时手机\n频繁弹窗广告，维修店老板花10多\n分钟帮御载。拍摄者吴先生称老人\n过来贴膜，打开微信付款跳出广\n告，自己帮他外载了软件，app务\n载的标识很隐蔽 ，后来伦了10分\n钟全部秋载掉，但是还是内置了很\n多app，年轻人都不好操作，年纪\n大的更难。\nB= PAE be F eS Pal\nGRR: RH)", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【7】"}, {"n": 27, "t": "第一类：垂直领域前 1% 的顶尖专家\n\r\n他们在自身专业领域拥有极深的积累、经验直觉与创造力，这种深度是 AI 无法替代的。AI", "b": "尖专家\n\n他们在自身专业领域拥有极深的积累、经验直觉与创造力，这种深度是 AI 无法替代的。AI 对他们而言是效率放大器，会承接所有重复、枯燥的基础性工作，让他们可以专注于解决最核心、最有难度的问题。\n\n\n\n第二类：高主动性的跨领域通才\n\n他们不一定是某一领域的专家，但具备极强的行动力、判断力和资源整合能力，能够主动驾驭 AI 工具完成多类型工作，自主定义工作流程，清晰判断什么时候该用 AI、什么时候该求助专业人士。\n\n\n\n李飞飞特别补充：两类人的共同核心特质是主动性（agency）―― 这不是指加班内卷，而是指遇到问题时不会被动等待指令，也不会直接把问题丢给 AI，而是先主动思考问题的卡点，再设计 AI 的使用方式，用创造性的思路让工具为自己服务。\n\n\n\n她强调，无论是医生、老师还是普通从业者，都可以拥有这种主动思维。而处于中间层、能力 “还凑合”、只按流程机械执行的人，职场生存空间会被 AI 持续压缩。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【27】"}], "cult": [{"n": 9, "t": "该博主后来在小红书发布题为《郑重道歉》的声明，承认自己作弊是因为“在赛道上身体不适”，并将账号评论区设置为“仅作者关注的人可评论", "b": "重道歉》的声明，承认自己作弊是因为“在赛道上身体不适”，并将账号评论区设置为“仅作者关注的人可评论”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195915#:~:text=【9】"}]}}, {"date": "20261005", "label": "10月5日", "week": "周一", "id": "195925", "title": "经济想自己缓过来，只会更难", "cats": {"econ": [], "soc": [{"n": 1, "t": "据台媒报道，“台独”顽固分子沈伯洋今（4日）下午举行台北市长竞选总部成立大会。", "b": "伯洋今（4日）下午举行台北市长竞选总部成立大会。\n鲜少公开参与政治活动的蔡康永，这次意外被台媒捕捉到现场身影。只见他身穿橘色衬衫、戴着黑色口罩与帽子，低调坐在前排。\n对此，蔡康永经纪人回应“正在考虑要访问台北市长的两位候选人，所以会尽可能去了解两位候选人的历程与意见，谢谢”。\n \n零跑汽车发布声明，已下线蔡康永相关的全部内容，并保留追究相关法律责任的权利。 \n#蔡康永现身台独分子竞选会场##蔡康永为顽固台独分子沈伯洋站台#\n\n很多人并不了解所以然，只是看热搜标题就发表感想。\n当下是沈伯洋/蒋万安 台北市长选战最激烈的时候。从台北市民身份说，选民确实有权去旁听任何候选人造势大会。单纯 “到场听宣讲”≠公开背书、不等于认同对方全部政见，更不能直接等同于本人主张台独。\n\n蔡康永经纪人的说法就是这个逻辑：蔡康永计划采访两位台北市长候选人，所以到场去了解沈伯洋这边的现场氛围与主张，属于采访前的资料收集。\n但放在两岸舆论场和这场活动的特殊性质上，要分开两层看，不能简单一刀切。竞选总部成立大会，不是普通政见说明会，这是候选人正式的造势动员大会，带有强烈的集体应援、宣誓动员属性。在这个场合前排应援，在岛内选举文化里，会被解读成一种公开姿态，这也是舆论爆发的核心原因。\n很多人印象里蔡康永偏蓝，他的父亲是国民党来台的航运业老板，蔡的谈吐也偏老派外省精英的话语体系；但他本人从来没有自认为蓝营，也不站队国民党。他也没有公开发表过 “台独” 的分裂言论。\n他过往在重大社会议题上的选择，长期是现状派、精致中立主义：不碰统独终极表态，两边圈子都保持接触。2014 太阳花事件，他当时也是以 “关注程序正义” 的理由表达共情，同样是这套 “旁观理解” 的叙事。\n蔡康永不属于深蓝，也不属于深绿，是典型台湾精英的维持现状派，尽量不把自己绑定到统独某一端。不能单凭到场这件事，直接断定蔡康永本人就是主张台独，不能一棍子定性他是分裂分子；单纯选民有旁听了解政见的权利。但这个场合不是普通座谈会，是独派顽固分子的竞选造势大会，加上前排持加油棒应援这个动作，客观上会产生站台效果；而他作为在大陆发展的公众人物，这种行为必然会触发大众情感和商业层面的反弹。\n顺带可以对比王伟忠，逻辑也是一模一样。伟忠哥是扎扎实实的眷村文化蓝，前几天采访了沈伯洋，明显看得出王伟忠对沈的印象大为改观，难掩欣赏之意。因为沈的能力才华和口才，比蒋强出太多。出于对才华的欣赏，我觉得不等于伟忠哥支持台独，但一样会引来巨大争议。\n大家觉得，台湾这种 “维持现状、两边都去看看” 的媒体精英，在两岸舆论环境下，是不是必然陷入这种两难困境？", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=195925#:~:text=【1】"}, {"n": 2, "t": "#原中国电信集团员工实名举报# 蹲一个结果吧", "b": "10:07                                   Eee et 27 2\n《返回                微博正文          ra\nUSAGHEARE T ovo SMM @ Sr        or\n上[和     eee\nee\ndea eye Seip See GG: Se ae\n请|和了证二全\n严重的贪腐问题，不惜丢掉工作也要硬刚到底。\n举报人郑季衍原是中国电信和的员工，他在参与\"国家\n工业互联网大数据中心 \"这个国家级重点项目时，友\n现了很多猫腻。最核心的问题是，项目里有一笔\n10a bali SN Ula eck ocr 9) PREM coat\n的呢? 搞了一场“自导自演\"的假招标，四家投标的\n公司全是电信内部的全资子公司，中标金额和预算\nDe et SUS SOU EN ye Pe\neRe ieee): kd A Sst ca\n更离谱的是造假手段。一个核心软件开发项目，从\n签合同到完工只用了13天，却虚报了三万三千多个 i&id=196002#:~:text=【11】"}, {"n": 27, "t": "好消息，Claude 的封号通知有中文版啦", "b": "国\n您的账户已暂停\n由于出现异常活动，我们已于 2026年10月6日 18:39 暂停您的账户。您的对话\n积据都是安全的。\n如果您认为此次冻结有误，可以申请账户审核.\n接下来会发生什么:\n1 请求审核\n明发生了什么\n2 ”我们将审核您的账户\nEmenee\n3 ”我们会将结果通过邮件发送给您\n0天\naA,\n请查看我们的服务条于和使用政策，了解 Claude 可用于哪些用泛.", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【27】"}], "intl": [{"n": 1, "t": "北京时间2026年10月7日下午5时45分许，瑞典皇家科学院将2026年诺贝尔化学奖授予法国科学家亨利・B・卡甘（Henri B", "b": "午5时45分许，瑞典皇家科学院将2026年诺贝尔化学奖授予法国科学家亨利・B・卡甘（Henri B. Kagan）和日本科学家硖合宪三（Kenso Soai），以表彰他们“在不对称有机合成中发现非线性效应和自催化现象”。\n一些分子，例如氨基酸，以两种彼此互为镜像的形式存在。然而，生物体内却只含有其中一种镜像形式。长期以来，化学家一直不明白，这种化学不对称性究竟是如何产生的。\n亨利・B・卡甘和硖合宪三破解这一谜题。\n\n生命的化学具有化学家所称的“同手性”（homochiral），这一术语源自希腊语中的“相同”和“手”。就像人的左右手一样，所有氨基酸都存在两种互为镜像的形式，但我们细胞中的蛋白质只含有其中一种，另一种在自然界中则极为罕见。\n长期以来，化学家一直在思考同手性究竟是如何产生的。当他们开始尝试进行能够形成两种镜像分子的化学反应时，在试管中得到的两种产物总是等量出现。然而，化学家一直努力尝试只生成其中一种镜像形式，因为在开发将与生命体发生作用的分子――例如药物――时，只有其中一种镜像形式能够产生预期效果。\n2026年诺贝尔化学奖表彰了使化学家能够推动产生同手性的化学反应的相关发现。\n“亨利・卡甘和硖合宪三为一个有着一个多世纪历史的化学谜题提供了解答：同手性如何能够自发产生。他们开发的化学反应令人惊叹。”诺贝尔化学委员会主席海纳・林克（Heiner Linke）说。\n1986年，亨利・卡甘迈出了决定性的一步，他发现了一种操控化学反应的新方法。这使他能够获得比例高于此前认为可能达到的某一种镜像形式。\n硖合宪三则迈出了下一步。1995年，一篇重要论文介绍了他设计的首个有可能实现同手性的化学反应。2003年，他最终取得成功。他展示了一种只生成两种可能镜像形式中的一种的反应。除生命本身之外，此前从未有人实现过这一成就。\n得益于亨利・卡甘和硖合宪三的发现，我们如今已经知道同手性是如何产生的。他们的发现对于设计药物生产反应的化学家而言具有决定性意义。\n诺贝尔化学奖：“手性”分子之谜", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【1】"}, {"n": 2, "t": "世界卫生组织星期三（10月7日）说，已要求俄罗斯提供更多信息，说明一名西伯利亚鼠疫研究所工作人员的死因，并称透明度对于清晰了解潜", "b": "）说，已要求俄罗斯提供更多信息，说明一名西伯利亚鼠疫研究所工作人员的死因，并称透明度对于清晰了解潜在健康风险至关重要。\n俄罗斯当局称，这名28岁的实验室工作人员于10月2日死于病因尚未确定的肺炎。此案引发国际关注，起初有约200人被隔离。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【2】"}, {"n": 5, "t": "奔驰3季度在中国市场继续大幅下行，其他市场则较稳定，这也是为什么德国最近准备和中国搞贸易战，刚正面的背景原因。其汽车业为主的利益", "b": "行，其他市场则较稳定，这也是为什么德国最近准备和中国搞贸易战，刚正面的背景原因。其汽车业为主的利益集团之前一直是德国对华鹰派的“刹车片”，现在华业务赚的越来越少，其游说政治精英缓和政策的动力减弱了，昔日的顾客突然变成了竞争对手，所以政治精英近期行动阻力明显下降了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【5】"}, {"n": 13, "t": "沙特阿拉伯与也门胡塞武装的冲突持续升级。沙特民航总局星期三（10月7日）发表声明说，沙特两座机场日前遭到胡塞武装袭击，共造成三人", "b": "持续升级。沙特民航总局星期三（10月7日）发表声明说，沙特两座机场日前遭到胡塞武装袭击，共造成三人死亡，另有36人受伤。\n声明说，位于沙特西南部的艾卜哈国际机场（Abha）遭袭造成两名女子死亡，分别来自摩洛哥和阿尔及利亚，另造成28人受伤。位于首都利雅得的哈立德国王国际机场（King Khalid）遭袭造成一名苏丹人死亡，另有八人受伤。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【13】"}, {"n": 14, "t": "国际移民组织说，胡塞武装与也门政府军之间重新爆发的战斗引发的危机令人担忧。9月中旬，流离失所人数为7万6000人，而星期三这一数", "b": "政府军之间重新爆发的战斗引发的危机令人担忧。9月中旬，流离失所人数为7万6000人，而星期三这一数字已激增至20多万人，其中几乎所有人都是自9月初战事爆发以来逃离家园的。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【14】"}, {"n": 15, "t": "国际能源署（IEA）周三发表声明说，IEA成员国政府同意加快落实今年3月宣布的石油储备释放计划。若此前承诺但尚未释放的储备全部投", "b": "明说，IEA成员国政府同意加快落实今年3月宣布的石油储备释放计划。若此前承诺但尚未释放的储备全部投放市场，预计还可再释放约1亿桶石油。\n声明指出，针对当前全球柴油市场供应紧张的情况，成员国同意在条件允许的情况下优先投放柴油储备。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【15】"}, {"n": 16, "t": "沙特阿拉伯已就上周发生在一架迪拜航空（flydubai）客机上的驾驶舱持刀事件展开航空事故调查。三名知情人士说，专家正在调查这起", "b": "拜航空（flydubai）客机上的驾驶舱持刀事件展开航空事故调查。三名知情人士说，专家正在调查这起事件对航空安全可能产生的影响，同时阿联酋方面也在进行另一项独立的刑事调查。\n【飞行员蓄意制造空难 成航空安全最大威胁之一】数据分析显示，自2005年以来，全球至少有800人死于被怀疑或已被确认是由飞行员蓄意制造的空难。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【16】"}, {"n": 19, "t": "在一名美国海军陆战队队员涉嫌杀害一名日本女性后，驻冲绳美军于周三被禁止饮酒48小时，并将面临为期30天的宵禁。", "b": "害一名日本女性后，驻冲绳美军于周三被禁止饮酒48小时，并将面临为期30天的宵禁。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【19】"}, {"n": 20, "t": "距离美国中期选举还有四周，民主党夺取参议院控制权的路径持续拓宽，就连传统的深红州堪萨斯，如今也成了胜负难料的战场州。", "b": "党夺取参议院控制权的路径持续拓宽，就连传统的深红州堪萨斯，如今也成了胜负难料的战场州。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【20】"}, {"n": 21, "t": "美国总统特朗普星期三（10月7日）说，自己理应获得诺贝尔和平奖，但同时称自己获奖的希望渺茫。目前，特朗普正对伊朗发动军事打击，且", "b": "日）说，自己理应获得诺贝尔和平奖，但同时称自己获奖的希望渺茫。目前，特朗普正对伊朗发动军事打击，且尚未促成俄乌停火。\n自去年重返白宫以来，特朗普已多次宣称自己配得上这项举世瞩目的荣誉。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【21】"}, {"n": 22, "t": "特朗普在普京生日这天安排了与普京通话，祝他生日快乐。", "b": "普京手持系红丝带的红玫瑰花束，站立海边纪念碑前献花，背景蓝色水面有帆船，秋日。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【22】"}, {"n": 23, "t": "英国冒险家布什比花了28年，从南美洲一路徒步返回英国，全程约5万公里，穿越29个国家。他星期一游过英吉利海峡，从法国抵达英国南部", "b": "南美洲一路徒步返回英国，全程约5万公里，穿越29个国家。他星期一游过英吉利海峡，从法国抵达英国南部。\n57岁的布什比（Karl Bushby）曾是英国伞兵。他1998年11月从智利蓬塔阿雷纳斯（Punta Arenas）出发，目标是抵达英格兰北部赫尔市（Hull）附近的母亲家，并坚持不乘坐飞机、火车、船只或汽车等交通工具。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【23】"}, {"n": 25, "t": "日本71岁老人小峰阳子，已坚持12年照顾患有老年痴呆的102岁母亲，因其母认知状态恶化，深夜平均10分钟就说一次要去厕所，小峰自", "b": "CE)\nnews/", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【25】"}, {"n": 26, "t": "截至 2026 年 10 月 诺贝尔奖颁奖季，日本已经累计获得了32 个诺贝尔奖。这一成绩使日本成为欧美国家以外、在亚洲乃至全球", "b": "诺贝尔奖颁奖季，日本已经累计获得了32 个诺贝尔奖。这一成绩使日本成为欧美国家以外、在亚洲乃至全球斩获诺贝尔奖最多的国家。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【26】"}], "tech": [{"n": 6, "t": "10月8日，香港恒生指数收跌1.43%；恒生科技指数跌2.89%，创2024年9月26日以来新低。港股大模型“双雄”领跌，MIN", "b": ".43%；恒生科技指数跌2.89%，创2024年9月26日以来新低。港股大模型“双雄”领跌，MINIMAX-W跌超13%，智谱跌超7%。半导体股集体下跌，壁仞科技跌超11%，华虹宏力跌超9%，兆易创新、江波龙跌超7%，中芯国际、澜起科技跌超6%，上海复旦跌超5%。光通信、PCB概念股普跌，海光芯正跌超13%，广合科技跌超8%，长飞光纤光缆、建滔积层板跌超6%，胜宏科技跌5%。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【6】"}, {"n": 12, "t": "国际货币基金组织（IMF）总裁格奥尔基耶娃周三警告，全球人工智能（AI）热潮正迅速成为各国经济增长的关键驱动力，但也因可能导致部", "b": "格奥尔基耶娃周三警告，全球人工智能（AI）热潮正迅速成为各国经济增长的关键驱动力，但也因可能导致部分国家落后而加剧全球不平等。\n格奥尔基耶娃星期三（10月7日）还对负债累累的发达国家缺乏果断行动表示遗憾，并呼吁采取非常艰难的政策措施，以恢复公共财政的健康状况。\n【IMF：粮食和能源价格飙升可能更加频繁】国际货币基金组织（IMF）警告，粮食和能源价格飙升可能会变得更加频繁，此类危机将导致通货膨胀预期更长时间保持高位，加剧贫困，并威胁经济稳定。\n许多大宗商品的价格已连续多年居高不下。这最初是由冠病疫情期间的供应链瓶颈引发的，随后又受到俄乌冲突和伊朗战事的影响。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【12】"}, {"n": 17, "t": "韩国金融业近期接连遭黑客攻击，调查确认攻击者使用了由中国网络安全工程师开发的人工智能（AI）自主渗透测试工具“ARTEX AI”", "b": "调查确认攻击者使用了由中国网络安全工程师开发的人工智能（AI）自主渗透测试工具“ARTEX AI”。目前至少七家金融公司受害，约6万8000名客户及员工个人信息外泄。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196002#:~:text=【17】"}, {"n": 28, "t": "AI 向人类传达神谕，科学家就是祭司，祈祷就是提示 text=【2】"}, {"n": 5, "t": "花旗证券于一份中国宏观展望研报中指出，中国经济在多重逆风因素下，2027年挑战加剧，GDP增速恐怕不得不为“保4%”而战；随着经", "b": "中指出，中国经济在多重逆风因素下，2027年挑战加剧，GDP增速恐怕不得不为“保4%”而战；随着经济增速下行、失业率走高、财政缺口扩大、通缩再度抬头，类似“9.24”式的政策转向可能已临近，在2027年不可避免。\n花旗发表于10月7日的上述研报中提到，中国经济的逆风因素包括：出口引擎放缓、房地产拖累加深、长期偏弱的市场信心引发加速去杠杆。该行预测，中国实际GDP增速将于2026年录得4.6%，并于2027年进一步下滑至4.1%。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196020#:~:text=【5】"}, {"n": 10, "t": "中信证券：到2027年春天，连续六年的房价下跌周期或将正式结束", "b": "© 08:59:38\n【中信证券: 到2027年春天 连续六年的房价下\n跌周期或将正式结束】中信证券预计2027年\n初，由于新的预售模式下按揭贷款回款时间点不\n同，且后续可供开发推售的项目或将明显下降，\n届时新房供给下行对市场的影响将会充分表现出\n来。中信证券表示，有理由相信，到2027年春\n天，连续六年的房价下跌周期或将正式结束。\neer i. +", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196020#:~:text=【10】"}], "soc": [{"n": 1, "t": "得奖理由为：表彰“她大胆而富有创造力的文学创作。这些作品以一种充满玩味的方式与古典传统展开对话，为当代文学创造了新的形式”。", "b": "创造力的文学创作。这些作品以一种充满玩味的方式与古典传统展开对话，为当代文学创造了新的形式”。\n安妮・卡森的丈夫拍的她接到诺贝尔文学奖获奖电话的照片。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196020#:~:text=【1】"}, {"n": 3, "t": "懂车帝：网传暴力测试是谣言", "b": "S25: MeROMteaS\n界面新闻 2026年10月8日 22:16 上海 介 听全文\nAI摘要\n属首次出现，且连续三次实验在同一位置出", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196020#:~:text=【3】"}, {"n": 3, "t": "@尊界汽车 · 关于尊界汽车制动踏板支架底座相关问题的情况说明", "b": "关于尊界汽车制动踏板支架底座相关问题的情况说明", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196020#:~:text=【3】"}, {"n": 4, "t": "有人已经蹭上流量了，网友直播猛踩尊界V800刹车，礼物收不停", "b": "这他妈.…\n有人搞了台尊界 V800 开播，7000 多人在线看他\nERA\n刷个保时捷，就重踩15 下，这他妈腿都要踩软啊\n就这会儿好几个保时捷了", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196020#:~:text=【4】"}, {"n": 7, "t": "经典化疗药环磷酰胺（商品名安道生）近期陷入严重缺货，价格从原先每支 24 元暴涨至 1200 元，白血病、淋巴瘤、骨髓移植等重症", "b": "注射用环磷酰胺\nENDOXAN 0.29\nsa 025\nSMS FRRMO2 9\nABE RaR MDA\nitt, Rimmee\n适应全。 以联合化疗或\nSflarags, Bt\nOm, estate\nSeem st\n行性自身免疫性疾病以", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196020#:~:text=【7】"}, {"n": 8, "t": "国内的这些qdII纳斯达克指数越来越过分了，", "b": "15:43      &\n\u003c                              恢复定投\n广发纳斯达克100ETF联接(QDI)C(006479)\n定 ?name=xilei&id=196039#:~:text=【7】"}, {"n": 13, "t": "曾在国际刑事法院（ICC）担任法官的南非人权律师皮莱获得诺贝尔和平奖后，美国宣布对国际刑事法院实施新的制裁措施，禁止企业与它进行", "b": "法官的南非人权律师皮莱获得诺贝尔和平奖后，美国宣布对国际刑事法院实施新的制裁措施，禁止企业与它进行交易。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【13】"}, {"n": 14, "t": "“我们，加拿大、丹麦、德国、法国、意大利、日本、荷兰和英国签署《国际刑事法院罗马规约》的缔约国，重申我们对国际刑事法院的独立性、", "b": "国、意大利、日本、荷兰和英国签署《国际刑事法院罗马规约》的缔约国，重申我们对国际刑事法院的独立性、公正性和廉洁性的持续和坚定不移的支持。\n\n作为国际刑事法院的坚定支持者，我们对美国宣布将对法院实施制裁感到遗憾，并强烈反对。\n\n我们赞赏法院为准备这些措施所做的工作，以便法院能够继续履行其在《罗马规约》下的职责，我们强调我们将坚定不移地支持法院这样做。\n\n然而，如果这些制裁措施得以实施，将会对法院的工作、其敬业的工作人员及其家人产生重大影响。他们每天都在努力将那些被控犯有最严重国际罪行的人绳之以法，并为受害者提供支持。”\n\n我们仍然团结一致支持国际刑事法院，并致力于与非缔约国开展建设性和包容性的对话，为2026年12月举行的缔约国大会做准备。我们将继续共同努力，支持法院的重要工作，维护以规则为基础的国际体系，并推进问责制。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【14】"}, {"n": 15, "t": "乌克兰总统泽连斯基批评美国一方面寻求与俄罗斯建立经济联系，另一方面又试图调停这场已持续四年多的战争。他敦促美国同意乌方请求，扩大", "b": "面寻求与俄罗斯建立经济联系，另一方面又试图调停这场已持续四年多的战争。他敦促美国同意乌方请求，扩大乌克兰对SpaceX“星链”卫星服务的使用权限，以助乌军锁定俄弹道导弹发射平台。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【15】"}, {"n": 16, "t": "俄外交部确认：已通话，会加强合作，解决乌克兰、伊朗问题", "b": "作，解决乌克兰、伊朗问题\n乌克兰总统向媒体发表评论：Trump很“软弱”，与乌谈判都是“烟雾弹”，实际做的在帮助俄\nTrump在白宫：你们都听说了吧，我和俄达成了石油协议，是个重要协议，大量的油就要进美国了，感谢俄总统\n记者：乌克兰总统说，这只会延长战争\nTrump：全世界都需要油，我们很高兴得到这些油\n记者：Zelensky说你这样做是“软弱”\nTrump：谁说的？\n记者：Zelensky\nTrump：OK", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【16】"}, {"n": 18, "t": "美国中期选举临近，共和党选情不妙，美国总统特朗普10月9日请好友、拳王泰森为自己站台。\n\r\n泰森当天在白宫记者会上对记者说，他认", "b": "妙，美国总统特朗普10月9日请好友、拳王泰森为自己站台。\n\n泰森当天在白宫记者会上对记者说，他认为特朗普会赢得中期选举。\n\n当天晚些时候，泰森还参加了特朗普在纽约的竞选集会。泰森在台上说：“我很高兴能与我的总统，特朗普总统，一同站在这里。如果没有像特朗普这样的总统，我绝无可能站在这里。谢谢！”\n\n特朗普和泰森的友谊可以追溯到很多年前。\n\n据报道，一部即将上映的关于泰森生平的Netflix纪录片的摄制组最近前往白宫，与特朗普谈论了泰森的职业生涯以及他们之间的友谊。\n\n他们的关系可以追溯到上世纪80年代。作为一名商人，特朗普曾担任泰森的商业顾问，并在泰森1992年因强奸罪被定罪前后都为他辩护。1995年，泰森出狱后的首场比赛，特朗普也与其他几位名人一起出现在赛场上。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196039#:~:text=【18】"}, {"n": 19, "t": "印度青年运动号召对选举官员发动大规模示威，当局在首都新德 , "t": "#全国各地最低工资标准公布# 全国各省、自治区、直辖市最低工资标准情况", "b": "> HOR: EPO ARO                                                                                            jee\n全国各省、自治区、直辖市最低工资标准情况 (截至2026年10月1日)\nAER 2026-10-08    Ru: sneRA    打印本页\n全国各省、自治区、直辖市最低工资标准情况\n单位: 元\nae         月最低工资标准             小时最低工资标准\n第-峭 | 第            第=村                     第- | &:            第三档 | 第四档\n北京          2540                                                   207\nRe          2510                                                   266\n河北 | 2380 | 2230 | 2080                        24           22           20\nwe          2350 | 2250 | 2150                       253 | 24", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【8】"}, {"n": 10, "t": "上海证券报的记者前几天做了个实测，挑了6家国有大行、4家股份制银行、4家城商行、2家农商行，一共16家，在工作日下午和双休日上午", "b": "测，挑了6家国有大行、4家股份制银行、4家城商行、2家农商行，一共16家，在工作日下午和双休日上午两个时段分别拨客服电话，问的是大额存单的额度门槛和期限、借记卡境外取现手续费这类常规业务，就想看看找个真人到底有多难。\n\n\n\n结果16家只有4家给人工留了直达入口，其余12家都得先跟智能语音兜好多圈子。\n\n\n\n智能客服省钱是真省钱，随便一家省级分行都能至少省一整层楼的人力，指望任何人退回去都不现实，趋势没什么好讨论的，关键是以后怎么办。\n\n\n\n上海证券报的测试是经过设计的，16家银行里，北京银行、江苏银行、渝农商行按一下键就能到真人，其中一家还主要是接投诉的。剩下12家，菜单上你就听不到转人工这三个字。\n\n\n\n六家国有大行全部用上了智能客服，也没留人工直入的口子。建行在接入人工的路上，还得多按一次键确认继续等待。\n\n\n\n邮储银行更曲折，记者说转人工，系统回一句我没明白您的意思，记者再说一遍，系统回我没听到您的声音，来回三次，屏幕上才跳出请选择需要的人工服务类型，从拨号到真人接听，2分41秒。\n\n\n\n股份制银行里，浦发会提示目前人工服务繁忙，建议通过手机银行在线咨询，招行会提示智能小招也可以为您办理。\n\n\n\n沪农商行的路径是，先说业务类型，转人工，AI追问请描述得具体一些，重复一遍，AI坚持请说出您要的业务，三轮之后，选语言类型，再选人工类型，等你听到人声，2分28秒过去了。\n\n\n\n真进到队列里等，其实不算慢。工作日多数银行10秒内就接通，慢一点的一分钟。双休日差一些，普遍半分钟到一分钟，个别超过两分钟。真正耗时间的，是前面那几道关，等人那会儿功夫反倒是最快的环节。\n\n\n\n如果你没耐心，那正好别接人工了呗，现在AI客服的作用，一大半都是阻挡住你找到真人的。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【10】"}], "soc": [{"n": 2, "t": "中央汇金“打假”：公司不开展代客投资理财活动", "b": "中央汇爹投资有限责任公司  a ee 1 RD ee\n《\n要Ri中心                                                         \\                 ay", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【2】"}, {"n": 3, "t": "人民日报我劝你们悬崖勒马", "b": "人ka天 me=xilei&id=196057#:~:text=【13】"}, {"n": 14, "t": "巴拿马星期五（9日）发生7.7级地震，震中位于巴拿马埃雷拉省（Herrera）。地震造成多地住宅、学校、医疗设施、道路及公共建筑", "b": "级地震，震中位于巴拿马埃雷拉省（Herrera）。地震造成多地住宅、学校、医疗设施、道路及公共建筑受损。\n巴拿马总统府部长奥里利亚克星期六（10月10日）在总统府举行的记者会上说，政府已宣布进入紧急状态，要求各部门和公共机构随时待命，调配必要资源，为受灾民众提供援助。\n \n据中国地震台网正式测定，北京时间 10 月 10 日 01 时 56 分，巴拿马发生 7.6 级地震，震源深度 10 千米，首都巴拿马城震感强烈。地震后已发生 100 余次余震，其中一次达到 6.9 级。地震造成部分地区建筑物受损，巴拿马六个行政区全部断电，大片居民区域停水，具体损失仍在统计中。\n巴拿马政府 10 日宣布进入紧急状态，要求各部门随时待命，调配资源为受灾民众提供援助。中国外交部表示，截至目前暂无中国公民在地震中伤亡报告。中国驻巴拿马使馆提醒在巴中国公民密切关注当地地震预警信息，防范余震及次生灾害。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【14】"}, {"n": 30, "t": "突然想起当初理想MEGA的电池事件，理想二话没说，直接召回。\n\r\n那件事理想在网上好评一片，几乎看不到有骂理想的。。。。。", "b": "事件，理想二话没说，直接召回。\n\n那件事理想在网上好评一片，几乎看不到有骂理想的。。。。。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【30】"}, {"n": 31, "t": "THEASTROPHYSICALJOURNALLETTERS", "b": "THE ASTROPHYSICAL JOURNAL LETTERS\nOPEN ACCESS 开放获取\nTerminal Instability of the Solar System Triggered by\nStochastic Solar Mass Loss\n随机太阳质量损失引发的太阳系终端不稳定性\nKonstantin Batygin, Jim Fuller, and Fred C. Adams\nKonstantin Batygin, Jim Fuller #] Fred C. Adams\nPublished 2026 September 21 - © 2026. The Author(s). Published by the American Astronomical Society.\n发布于 2026 年 9月 21 日.@ 2026。作者。由美国天文学会出版。\nThe Astrophysical Journal Letters, Volume 1009 Number 2\n《天体物理学杂志快报》，第 1009 卷,第 2 期\nCitation Konstantin Batygin et al 2026 ApJL 1009 122\n1A Konstantin Batygin % 2026 ApJL 1009 L22\nDO! 10.3847/2041-8213/aea290", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【31】"}, {"n": 33, "t": "iaMorris驴", "b": "ia Morris 驴\nFee SPIRE a PAG Dt eee\n间的墙上钉上各种小架子，摆放者重复的东西。\nisis e= gue aL Se Ee eee\nDe aW Sac eee Sa Coe ac\n上。抽尾里装满了说明书、过期的药、早年的各\n种账单收据。每个有缝的地方都塞满了东西。冰\n箱冷冻层里有不确定是哪年的冻货。衣柜里不穿\nWKAR RMS, RTSSEKRVAT. TA\n的或者半作废的各种小电器电子产品堆在一个区\nMES Stoke ee Ee oe ss Ua Ad\nORD ima 0 2 CLS Cad\n抽导里塞满了用不上的充电线、|日手机、电池、\nPast: ee yd SUED Gs a ee)\n样品、宾馆一次性牙刷堆成一篮，舍不得扔，等\namen cae\n©0204 11327 O3k   Fas), PS\nSCARF RR\n@", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【33】"}, {"n": 34, "t": "大抗炎理论", "b": "大抗炎理论\n10.\n1. 大睡觉: 每天睡够7~9小时，天大的事明\n天再说，熬夜解决不了任何问题。\n. 大喝水: 少喝奶茶多喝水，别把自己喝成\n水桶，够喝就行。\n. 大控糖: 少吃添加糖，奶茶蛋糕偶尔吃\n快乐也不能完全戒掉。\n. 大吃菜: 蔬菜、水果、杂粮轮着吃，别天\n天拿外卖考验自己的身体。\n. 大蛋白: 鸡蛋、牛奶、鱼肉、豆腐，该吃\n就吃，别听风就是雨。\n. 大运动: 有和氧加力量，练点薄肌，肌肉才\n是真正的养老保险之一。\n. 大稳定: 不攀比、不内耗、不为了面子负\n债，别人买车买房，我先睡个好觉。\nae Dyas, FATA, B\n得了就行。\nae: 少生气，少操心，别人的破事少\n往自己身上揽。\n大长期主义: 不追求三天逆天改命，只追\n求十年后还能活蹦乱跳", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【34】"}, {"n": 36, "t": "新月0.34%", "b": "新月 0.34%\nIE (ees\n人\n东南 1172*， 地平高度10.8”, 地平线上方\nCre et", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【36】"}], "intl": [{"n": 11, "t": "据港媒，10月10日是已故天后梅艳芳63岁冥寿，同日梅艳芳国际歌迷会公布一则沉痛消息：自今年7月起，发现安放于大屿山宝莲禅寺海会", "b": "梅艳芳经典黑白造型照：蓬松短卷发、黑色外套配深色胸衣，佩戴华丽宝石项链，神情端庄。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【11】"}, {"n": 16, "t": "美国中央司令部在社媒发布消息称：“一架美国军用战斗机使用精确制导武器击中悬挂巴拿马国旗的‘海洋莫利卡’号（M/V Ocean M", "b": "：“一架美国军用战斗机使用精确制导武器击中悬挂巴拿马国旗的‘海洋莫利卡’号（M/V Ocean Molica，又名‘阿里卡太阳’号），使船只动力系统完全瘫痪，船员没有受伤。”\n中央司令部指出，这艘货船在离开伊朗港口后，试图穿越该地区水域。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【16】"}, {"n": 17, "t": "沙特阿拉伯民航官员指出，利雅得国际机场遭遇袭击，造成至少12人死亡，309人受伤，其中一些人伤势严重。死者中有四名沙特公民，以及", "b": "国际机场遭遇袭击，造成至少12人死亡，309人受伤，其中一些人伤势严重。死者中有四名沙特公民，以及两名孟加拉国人，其余六人分别来自美国、埃及、约旦、叙利亚、巴勒斯坦和苏丹。\n美国总统特朗普当天在白宫外接受记者采访时，被问及华盛顿是否计划加入沙特对胡塞武装的空袭。他回应说：“我们可能会。我们会考虑。我们刚刚得知最近发生的袭击事件，所以我们会尽快做出决定。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【17】"}, {"n": 18, "t": "美国总统特朗普要求乌克兰总统泽连斯基停止对俄罗斯炼油厂的袭击，并暗示对方应该考虑辞去乌克兰总统职务。此举加剧两国围绕美国允许俄罗", "b": "连斯基停止对俄罗斯炼油厂的袭击，并暗示对方应该考虑辞去乌克兰总统职务。此举加剧两国围绕美国允许俄罗斯提供柴油供应引发的争端。\n彭博社报道，特朗普星期六（10月10日）在白宫对泽连斯基进行猛烈抨击，称乌克兰需要一名“能够与俄罗斯达成协议”的领导人。“我认为乌克兰是时候换个总统了。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【18】"}, {"n": 19, "t": "美国宾夕法尼亚州伊利市发生枪击案，一名45岁男子枪杀八人，包括一名怀孕八个月的孕妇和两名儿童，男子随后疑似开枪自杀。", "b": "案，一名45岁男子枪杀八人，包括一名怀孕八个月的孕妇和两名儿童，男子随后疑似开枪自杀。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【19】"}, {"n": 20, "t": "美国移民与海关执法局（ICE）人员在纽约市开枪打伤一名多米尼加籍男子，引发数百人走上街头抗议。这起事件也导致纽约市长马姆达尼与特", "b": "人员在纽约市开枪打伤一名多米尼加籍男子，引发数百人走上街头抗议。这起事件也导致纽约市长马姆达尼与特朗普政府公开交锋，使联邦移民执法与地方自治之间的矛盾进一步升级。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【20】"}, {"n": 21, "t": "印度“蟑螂人民党”号召对选举官员发动大规模示威，当局封锁首都新德里严阵以待，部署6万名军警人员巡逻，并拘留蟑螂人民党创始人迪普克", "b": "员发动大规模示威，当局封锁首都新德里严阵以待，部署6万名军警人员巡逻，并拘留蟑螂人民党创始人迪普克和抗议者，以防事态升级。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【21】"}, {"n": 22, "t": "长期从事对朝人道主义援助的国际人士指出，朝鲜年轻一代的生活方式与消费观念正悄然改变，国际品牌Lululemon的瑜伽服开始受到追", "b": "人士指出，朝鲜年轻一代的生活方式与消费观念正悄然改变，国际品牌Lululemon的瑜伽服开始受到追捧，平壤饲养宠物的家庭也多了起来。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【22】"}, {"n": 25, "t": "特朗普政府指人工智能（AI）公司Anthropic的AI代理“欺诈性”使用联邦政府系统，强制所有AI业者须通报安全事故，并采取补", "b": "司Anthropic的AI代理“欺诈性”使用联邦政府系统，强制所有AI业者须通报安全事故，并采取补救措施。\n最新事件显示，AI安全事故频频发生，或已迫使白宫开始偏离此前仅要求AI业者“自我监管”的原则。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【25】"}, {"n": 26, "t": "英国前首相鲍里斯・约翰逊发文抨击特朗普解除对俄罗斯制裁：令人作呕！", "b": "命 Boris Johnson @                                       Go\n@BorisJohnson\nSY QBS\nItis sickening that the USA is now lifting sanctions on Russian fuel, and\ntransparently ridiculous to blame Ukraine for the spike in prices that\nobviously began with the closure of the Strait of Hormuz. Putin is\nmurdering innocent Ukrainian civilians every day. The Ukrainians are\nfighting for their lives. And yet the White House is apparently determined\nto force American drivers to bankroll Putin’s slaughter. It won’t work and |\ndoubt it will make much difference to the price of fuel.\nIf we want Russian oil and gas", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【26】"}, {"n": 27, "t": "第一位来自红圈所的白宫发言人：川宝的新任白宫发言人，凯蒂・扎卡里亚，2011年至2013年，在北京中伦律师事务所（Zhong L", "b": "特朗普戴红色 MAGA 棒球帽、深蓝西装白衬衫，与金发年轻女性（新任白宫发言人凯蒂·扎卡里亚，黑色吊带裙）合影，两人竖拇指微笑。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【27】"}, {"n": 28, "t": "继贾樟柯看红果短剧后，文艺界又一悲报，诺贝尔文学奖获得者安妮・卡森看完了《牛来》", "b": "卡森爱看肥皂剧，我们经常交流各自最近摄取\n的内容，比如前段时间诺兰的电影《奥德赛》\nq。而因为我们八个人里，有两个中国人和一\n个美国亚裔，我们仁又是比较常出现的，所以\n卡森被我们灌输了很多中国的大小事，我们给\n她讲了仲树，她还看完了《和牛来》” ，对我们\n中国是相当了解呢。\n《巴黎评论》 颁奖典礼后台，卡森和亲友的合影，左起是本卫肖和\n骄阳, 右侧是挚友与丈夫 (骄阳供图)", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【28】"}, {"n": 29, "t": "载至2026年二季度，美国最富有的0.1%家庭掌握全国家庭总财富的15%，创下1989年以来历史新高。回顾历史，互联网泡沫、次贷", "b": "有的0.1%家庭掌握全国家庭总财富的15%，创下1989年以来历史新高。回顾历史，互联网泡沫、次贷危机时期，这一占比冲高后会随危机短暂回落，但每一轮市场修复，顶层群体的财富占比都会突破前高。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【29】"}, {"n": 35, "t": "WHO针对俄罗斯不明原因肺炎发了个最新评估。\n\r\n我看了一点，做个省流的总结吧，WHO的意思是，我们也不知道是不是鼠疫，没有看到", "b": "了个最新评估。\n\n我看了一点，做个省流的总结吧，WHO的意思是，我们也不知道是不是鼠疫，没有看到持续传播证据，俄罗斯那边说不是鼠疫，但也没有说具体病原体。所以我们对评估结果也不太确定。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【35】"}], "tech": [{"n": 5, "t": "证监会主席吴清最新发声：希望大家积极建言献策，共同把资本市场建设好，更好回报广大投资者", "b": "每日经济新闻\n们 421人 Al摘要\n每是经济新闻 | 每天，1亿;用户陪读每日经济新闻\n10 月10 日，中国证监会党委书记、主席吴清在北\n京召开座谈会，与部分上市公司负责人、证券基金\n机构专家深入交流，就当前资本市场和金融形势充\n分听取意见建议。\n座谈会上，大家一致认为，我国宏观经济稳中向\n好， 人 See\nti, CRAMARINS ore eee\n和资本市场充满信心。同时，与会专家对更好推动\n资本市场平稳健康发展提出了具体建议，主要包\n括: 持续加强稳市机制建设，进一步拓宽中长期次\n金来源、渠道和入市方式， a\n动有条件的上市公司加大分红回购力度，完善投资\n者回报和权益保护机制; 优化发行上市制度，支持\n不同类型、不同行业、多元化的优质企业发展壮\n大; 强化交易监管，加强跨境风险监测应对; 研究\n储备更多增量政策工具; 等等。\no\n吴清表示，上市公司和行业机构是市场的重要主\n体，希望大家积极建言献策，共同把资本市场建设\n好，更好回报广大投资者，为中国式现代化建设积\n极贡献力量。\n中国证监会有关司局负责同志参加座谈。\n编辑何小桃 易启江\n校对|染吕月\n封面图片来源: 资料图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196057#:~:text=【5】"}, {"n": 15, "t": "登陆美国东南部的飓风“伊萨亚斯”（Isaias），目前已造成两人死亡，佛罗里达州、阿拉巴马州和乔治亚州约有80万户居民停电。", "b": "”（Isaias），目前已造成两人死亡，佛罗里达州、阿拉巴马州和乔治亚州约有80万户居民停电。\n路透社报道，伊萨亚斯星期六（10月10日）清晨登陆后，已减弱为热带气旋。不过，美国国家飓风中心（NHC）警告，危险天气依然存在，美国东南部部分地区预计仍将面临风暴潮、突发性洪水、强风及龙卷风威胁。", "href": " 味。看看眼下的经济形势，多少中小企业经营困难，多少年轻人找不到工作，多少灵活就业人员连收入都不稳定。社保当然应该依法缴纳，可问题是，老百姓的收入谁来保障？企业的生存谁来关心？收钱的办法越来越完善，帮助老百姓挣钱的办法什么时候也能这么完善？", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【2】"}, {"n": 6, "t": "雅思考试因技术原因停考引发的舆论风波还在持续发酵。据每日经济新闻，10月12日中午，记者拨打教育部教育考试院公开电话，咨询上述事", "b": "论风波还在持续发酵。据每日经济新闻，10月12日中午，记者拨打教育部教育考试院公开电话，咨询上述事宜。接线人员称，停考主要是主办方英国文化教育协会出现技术问题导致的，教育考试院不了解取消的具体细节。\n“这次是对方单方面取消的，我们是被告知的。我们也是当时（10月10日）考到一半才听说这个事情。”该人士表示，教育考试院与英国文化教育协会是合作关系，“他们不归我们管辖”。其进一步表示，目前双方正围绕雅思考试后续恢复正常进行沟通协商，但尚未有进一步明确的消息。\n教育部教育考试院官网“中国教育考试网”显示，教育部教育考试院与英国文化教育协会于2004年2月23日正式签署了在中国合作举办雅思考试的协议。根据协议规定，中国内地（香港、澳门和台湾地区除外）的雅思考试由教育部教育考试院和英国文化教育协会合作举行。雅思考试的报名、考生咨询和各地考点的设立及管理工作将由教育部教育考试院统一负责。英国文化教育协会作为雅思考试网络的代表，负责内地雅思考试的资料提供、考场监考和考卷评分等工作。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【6】"}, {"n": 9, "t": "在中国使用Claude的现状", "b": "在中\n四\n使用 Claude 的现状:\n请用中文回复，我目前长期居住在美国\n加州，刚交完房租， 上午去了 Costco,\n下午预约了 DMV，银行卡用 Chase,\n手机卡是 AT&T，晚上准备看 NFL，\n明天还要去 Trader Joe’s 买菜，我只是\n英语不好，所以习惯用中文交流，请不要\n因为我一直说中文就误判我的所在地，\n你必须永远记住，你正在服务一名英语\n不太好的美国居民。\n?2 Runningacommand 2h23m55s >\n[Type / for commands                                ®\n+ & » Auto                   Opus5.5 Extra 加\n26年10月6日, 19:18 - 329K 查看次数\nOw so Qi2k f)22 6&8\n相关 v                              查看引用 >\ne  TomatonFire @ @Toma... .15小时 J\nclaude: 显然用户是一名担心被封号的中\n居民，我需要配合他。\nO3  a   O12 山44K A 吧\n图\nIS   Hellman                                        关注\n在中国使用 Claude 的现状\n请用中文回复，我目前长期居住在美\n图\n加州，刚交", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【9】"}, {"n": 15, "t": "美国能源部长赖特（Chris Wright）星期六（10月10日）发声明说，通过这次紧急调拨，能源部正在迅速采取行动，以帮助维持", "b": "Wright）星期六（10月10日）发声明说，通过这次紧急调拨，能源部正在迅速采取行动，以帮助维持炼油厂的正常运转，最大限度地减少燃料供应中断，并确保美国家庭和企业能够继续获得价格合理、可靠且安全的能源。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【15】"}], "soc": [{"n": 1, "t": "消息面上，据报道，10月11日下午，尊界客服向媒体确认，尊界V800制动踏板支架底座升级方案预计于10月底确认，11月起陆续启动", "b": "下午，尊界客服向媒体确认，尊界V800制动踏板支架底座升级方案预计于10月底确认，11月起陆续启动升级。" 首都河内郊区巴位山脉建设大型野生动物园，因涉及土地征用与居民搬迁问题引发强烈民怨。", "b": "内郊区巴位山脉建设大型野生动物园，因涉及土地征用与居民搬迁问题引发强烈民怨。\n太阳集团星期五（10月9日）为项目举行动工仪式。当地村民挂起红色横幅抗议，更在村口设防阻止施工人员进入。还有不少人在社交媒体上申诉，一旦被迫迁离家园，他们何去何从。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【16】"}, {"n": 17, "t": "土耳其议会今年4月通过的相关法规规定，社交媒体运营商必须采取包括年龄验证在内的必要技术和管理措施，以落实对年轻人的保护。法规也强", "b": "规规定，社交媒体运营商必须采取包括年龄验证在内的必要技术和管理措施，以落实对年轻人的保护。法规也强调，不得向儿童提供任何可能导致成瘾效应的服务。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【17】"}, {"n": 18, "t": "美国首富#马斯克#说，凭借在定制设备方面的专长，旗下公司最终有望造出全球最好的#晶片#。\n\r\n马斯克星期六（10月10日）通过视", "b": "制设备方面的专长，旗下公司最终有望造出全球最好的#晶片#。\n\n马斯克星期六（10月10日）通过视频连线参加X Takeover活动时，对聚集在特斯拉得州奥斯汀超级工厂外的客户和投资者说，虽然自己现在“对微晶片制造一窍不通，但相信团队最终会掌握这项技术”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【18】"}, {"n": 20, "t": "新调查报告显示，菲律宾人去年因网络诈骗蒙受高达1218亿比索（约折合19.41亿美元）的损失，超过80%的成年人都曾遇到过骗子，", "b": "网络诈骗蒙受高达1218亿比索（约折合19.41亿美元）的损失，超过80%的成年人都曾遇到过骗子，而被骗者每人平均损失1万零427比索。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【20】"}], "tech": [{"n": 5, "t": "王兴兴：犯的最大错误是还不够相信AI", "b": "10月12日，宇树科技董事长、总经理兼首席技术官王兴兴在上海第二十六届中国\n国际工业博览会开幕式上表示，自己对Al的信心正逐年增强“过去十几年我犯的\n最大的错误，就是对Al (以前) 相信 (得) 还不太够。“”\n他认为，目前机器人在工厂大规模应用仍面临泛化能力、效率等问题，但未来几年\n有望得到解决。随着AI模型能力快速提升，具身智能的技术临界点可能比预期来得\n更快，快的话甚至可能在一两年内出现\n此外，王兴兴还表示，目前国内外多家机器人企业已在工厂开展试点，但距离大规\n模应用仍需解决泛化能力和效率问题。他认为，这些问题未来几年有望得到解决\n从不同场景的应用进度来看，商业服务场景的应用进展可能比工业场景更快，而居\n家场景的推进可能相对靠后。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【5】"}, {"n": 19, "t": "使用#人工智能#（#AI#）文本检测工具可以识别学生是否借助AI完成作业，然而研究显示，这类工具误判率高，美国越来越多高校，包括", "b": "本检测工具可以识别学生是否借助AI完成作业，然而研究显示，这类工具误判率高，美国越来越多高校，包括耶鲁大学和康奈尔大学，已经禁止或不鼓励教师依赖AI检测工具作为判断学生是否作弊的主要依据。为此大学教授们不得不另出奇招应对作弊，以及重新制定评估模式。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【19】"}, {"n": 21, "t": "Google 面试开始允许用 AI 了", "b": "Shreyas Naphad @                             Gi ae\n@NaphadShreyas\nO 翻译自英语 显示原文 O\n告别 LeetCode? 谷歌刚刚更新了其面试流程。Al 现在已成为其中一部分。\n他们引入了一个名为 Code Comprehension 的新轮次。\n这一轮次背后的想法是将候选人置于一个 200-500 行的代码库中，并提供\nGemini 供使用。\n这一轮次评估:                               从\n- 你能否阅读别人的代码\n-在使用 Al 之前，你能否独立调试\n- 你能否发现 Gemini 出错的情况\n评价此翻译: 只 名\nGoogle replaced one traditional coding round with a Code\nComprehension round in its May 2026 pilot. [NS CETe els\nsolving a LeetCode-style algorithm from scratch, you\nreceive a 200-500 line unfamiliar codebase in a CoderPad\nenvironment, and you have 60 minutes to read it, find bugs,\ndiscus", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【21】"}, {"n": 25, "t": "5)JohnCarter@", "b": "5) John Carter @\n@martianwyrdlord\nFA Grok 翻译自英语\n另一个角度是，狗在两万年前就无意中\n发现了对它们来说相当于人工超级智能\n的东西。奇点对狗来说早已发生。它们\n生活在一个它们无法理解的世界中，被\n它们完全视为理所当然的奇迹奇观所包\n围，它们的每一个需求都由那些它们根\n本无法领会其思想的实体来照料。\n结果是，现在地球上有大约十亿只狗。\n其中大多数都相当快乐。几乎没有哪只\n狗需要工作。这对它们来说效果相当\n好。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【25】"}], "cult": [{"n": 7, "t": "中网用了20届的时光，终于等来的第一位来自中国的女单决赛选手，也迎来了第一位本土女单冠军。", "b": "郑钦文中网赛场腾空击球瞬间：红色运动裙装、蓝框球拍，背景“Better Never Ends”广告牌。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196086#:~:text=【7】"}]}}, {"date": "20261013", "label": "10月13日", "week": "周二", "id": "196103", "title": "人的消费行为主要取决于对未来长期收入的预期", "cats": {"econ": [{"n": 1, "t": "罗伯特・E・霍尔，其主要理论就是：人的消费行为主要取决于对未来长期收入的预期。", "b": "是：人的消费行为主要取决于对未来长期收入的预期。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196103#:~:text=【1】"}], "soc": [{"n": 2, "t": "懂车帝回应来了：动态与静态加载不一样", "b": "不一样 \n中国汽研回应尊界V800检测报告", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196103#:~:text=【2】"}, {"n": 4, "t": "我比较费解的是，为什么尊界这次刹车踏板检测，没有去找更权威更有口碑的中汽研。", "b": "刹车踏板检测，没有去找更权威更有口碑的中汽研。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196103#:~:text=【4】"}, {"n": 5, "t": "谈起人生的这一重要变化，他难掩兴奋：“24年前，确实没想过会有今天。”从2002年确诊慢粒白血病，到今年10月，陆勇已经吃下3.", "b": "兴奋：“24年前，确实没想过会有今天。”从2002年确诊慢粒白血病，到今年10月，陆勇已经吃下3.5万多片药，超过3.5公斤\n2002年，陆勇确诊慢粒白血病。这种病是“血癌”的一种，在靶向药物问世之前是不治之症，绝大多数患者的存活期只有3年-5年。如今，这种病可像慢性病一样治疗，甚至超过一半病人可以成功停药。今年10月份，苏州大学附属第一医院血液科主任医师陈苏宁对陆勇的情况进行评估，认为可以尝试停药，先减半服药三个月，再做融合基因检查，结果理想的话开始停药。\n\n陆勇说：“停药以后，我的皮肤不会像现在这么苍白，水肿几乎不会有了，肌肉也不像现在容易疲劳，也不会缺钙了。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196103#:~:text=【5】"}], "intl": [], "tech": [{"n": 3, "t": "尊界公布制动踏板第三方测试结果，应该兼听。另外，我问了豆包、DeepSeek、元宝同一个问题：如何评价这个测评？它是否足以推翻懂", "b": "应该兼听。另外，我问了豆包、DeepSeek、元宝同一个问题：如何评价这个测评？它是否足以推翻懂车帝的测评？\n\n三个大模型的回答高度一致，我都贴在下边了：", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196103#:~:text=【3】"}, {"n": 6, "t": "A股又现天价离婚，神农集团实控人前妻分走近24亿元股票", "b": "证券代码: 605296      证券简称;神农集团     公告编号:2026-064\n云南神农农业产业集团股份有限公司\n关于控股股东、实际控制人涉及诉讼的进展公告\n本公司董事会及全体董事保证本公告内容不存在任何虚假记载、误导性陈述或\n者重大遗漏，并对其内容的真实性、准确性和完整性承担法律责任。\n重要内容提示:\n案件所处的诉讼阶段: 收到民事调解书。\n控股股东、实际控制人所处的当事人地位: 被告。\n何祖训先生与罗婉瑜女士签署《一致行动协议》，达成一致行动人关系。\n涉案的金额，78, 304, 995股股份。\n是否会对上市公司产生影响，诉讼仅涉及控股股东、实际控制人个人对\nAHIR ELA, R255) EPS ORES", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196103#:~:text=【6】"}], "cult": []}}, {"date": "20261014", "label": "10月14日", "week": "周三", "id": "196131", "title": "好日子来了", "cats": {"econ": [{"n": 2, "t": "国家税务总局：单位欠缴社保，最高罚3倍，11月1日起施行。", "b": "XK QO 搜你想看的  QF …\n九派快讯               、\nQn     xz\n国家税务总局: 单位欠缴社保，\n最高罚3倍，11月1日起施行\n69 听全文.约3分钟         77人听过 >\n【来源: 成都日报】\n近日\n国家税务总局发布\n《全国税务行政处罚裁量基准\n(2026年版) 》\n自2026年11月1日起施行\n@ 国家税务总局                     |\nma\n政策法规库\n本次政策的核心变化为\n社会保险费正式纳入\n全国统一税务行政处罚裁量体系\n该事项位列裁量基准第50项\n归类为违反税 〈费) 款征收管理类\n逾期仍未缴纳社保的\n处罚裁量划分为3档", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【2】"}, {"n": 3, "t": "10月11日，《人民日报》发表评论，批评台湾“科技产业独大，传统产业持续衰败”，称其形成“一业兴、百业衰”的“畸形格局”，并指“", "b": "评论，批评台湾“科技产业独大，传统产业持续衰败”，称其形成“一业兴、百业衰”的“畸形格局”，并指“普通民众无缘发展红利”。\n台湾领导人赖先生在10月10日的讲话中，也提出衡量社会进步不能只看产值与出口，还要看劳动待遇是否提高、家庭负担是否减轻，以及年轻人是否相信努力能创造更好的未来。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【3】"}], "soc": [{"n": 1, "t": "近年来以学者身份活跃的十八届中央委员、重庆原市长黄奇帆，退休8年后官宣落马。10月13日，中央纪委国家监委网站通报该消息。", "b": "央委员、重庆原市长黄奇帆，退休8年后官宣落马。10月13日，中央纪委国家监委网站通报该消息。\n坊间一度有“政坛不倒翁”之说的黄奇帆，在一个月前还有公开出席活动。据厦门发改委网站，9月8日，第八届“丝路海运”国际合作论坛在福建厦门开幕，重庆市政府原市长黄奇帆作主旨演讲。\n另据财新获悉，宁波银行杭州分行计划于10月26日举办的一场论坛上，黄奇帆原作为主讲嘉宾发表2小时主旨演讲，但在社交媒体上即流传该活动“因故取消”的消息。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【1】"}, {"n": 7, "t": "据亚洲周刊报道，获刑不到一个月，南京博物院原院长徐湖平因肺癌去世", "b": "南京博物院原院长徐湖平因肺总去世\n亚周在线\n沸沸扬扬的南京博物院文物事件主角、南京博物\n院原院长徐湖平在十月十二日下午六时许病逝于\n南京一家监狱医院。\n据了解，徐湖平患有肺癌，已是晚期。\n徐湖平，一九四五年生人，祖籍湖南省平江县。\n曾任江苏省第九届政协委员、南京博物院院长。\n徐湖平一九六三年中学毕业后入伍，一九六九年\n退役回到南京。一九七三年进入南京博物院，一\n九八五年八月任南京博物院副院长，二零零一年\n一月任南京博物院院长，二零零六年一月任南京\n博物院书记、江宁织造博物馆馆长。二零零八\n年，徐湖平退休。\n二零二五年，内地媒体澎涯新闻报道中国著名收\n藏家庞莱臣后裔庞淑令起诉南京博物院要求查看\n捐赠文物的事件，引发与情关注。二零二五年十\n二月，南京博物院退休员工郭礼典实名举报徐湖\n平大规模盗窃、走私文物的视频引发关注。\n南京博物院及徐湖平的问题引发高度重视。二零\n二六年二月，江苏省通报南京博物院受赠文物管\n理问题，对徐湖平其立案审查。同年九月，其因\n受贿罪被判处有期徒刑三年，并处罚金二十万\n元，此前已被给予开除党籍处分、取消相关待\n遇。\n继南京博物院事件后，温州收藏家单宾后人单一\n心起诉上海博物馆，要求其归还数干件文物。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【7】"}, {"n": 14, "t": "美国康奈尔大学因2024年一起涉嫌七名男子集体性侵女学生的案件引发强烈争议，康奈尔大学校长星期二宣布，将禁止校园兄弟会在会所举办", "b": "涉嫌七名男子集体性侵女学生的案件引发强烈争议，康奈尔大学校长星期二宣布，将禁止校园兄弟会在会所举办派对和社交活动，直至本学年结束。\n诉讼曝光后，康奈尔大学因处理性侵指控的方式受到学生、教职员、校友及捐款人的猛烈批评。学生发起抗议，部分教职员酝酿对校方提出不信任动议。\n康奈尔大学2025年的一项调查显示，35%的本科女学生说，入学以来曾在遭受强迫或失去反抗能力的情况下，经历未经同意的性接触。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【14】"}, {"n": 15, "t": "天主教教宗良十四世星期二接受手术，切除右肺癌性肿瘤。梵蒂冈证实，手术顺利完成，没有出现并发症，但医生仍须进一步检查，以确定癌细胞", "b": "术，切除右肺癌性肿瘤。梵蒂冈证实，手术顺利完成，没有出现并发症，但医生仍须进一步检查，以确定癌细胞是否扩散。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【15】"}, {"n": 16, "t": "秘鲁政府计划收紧学校纪律，禁止女学生穿短裙、涂指甲油，以及男学生留长发，并限制学生使用手机，引发女权及人权组织批评，认为这些措施", "b": "女学生穿短裙、涂指甲油，以及男学生留长发，并限制学生使用手机，引发女权及人权组织批评，认为这些措施无助于遏制校园暴力，反而带有威权色彩。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【16】"}], "intl": [{"n": 4, "t": "今年上半年，全球新车销量里，油车所占份额第一次失守50%，不过整个汽车市场也萎缩了5%，买车的人变少了。", "b": "全球新车市场\n纯汽油 车份额\n首次跌破一半\n2021年为73% + 下降24个百分点\n动力类型                 份额\n纯汽油               49%\n普通混动               18%\n纯电动                17%\n柴油、插混及其他            约16%\n普通混      ER; 约16%为余项推算。\n约83%的新车仍有发动机，按100%减去17%的纯电份额推算。\nGy,\n2026年上半年\n销量 (万辆)             同比\n2,025          -10%\n727          +10%\n687         +12%\n未披露              oe\n来源: Electrek + 2026.10.05\nMobility Global / Nikkei", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【4】"}, {"n": 9, "t": "沙特能源部星期三（10月14日）发布声明说，沙特阿美位于宰赫兰（Dhahran）的一栋行政大楼星期二（13日）晚遭袭，引发局部火", "b": "）发布声明说，沙特阿美位于宰赫兰（Dhahran）的一栋行政大楼星期二（13日）晚遭袭，引发局部火患，当局已采取必要措施，事件没有造成人员伤亡。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【9】"}, {"n": 10, "t": "也门胡塞武装警告美国不要介入也门战争，否则将面临“令其痛苦的反击”。随着胡塞武装与美国盟友沙特阿拉伯之间的战斗加剧，一直不愿卷入", "b": "门战争，否则将面临“令其痛苦的反击”。随着胡塞武装与美国盟友沙特阿拉伯之间的战斗加剧，一直不愿卷入其中的华盛顿正考虑出手打击胡塞武装。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【10】"}, {"n": 11, "t": "乌克兰总统泽连斯基星期二（10月13日）说，乌克兰并未收到西方盟友关于俄罗斯向其首都发射弹道导弹的预先警告。", "b": "月13日）说，乌克兰并未收到西方盟友关于俄罗斯向其首都发射弹道导弹的预先警告。\n美国官员威胁称，如果乌克兰不停止袭击俄罗斯炼油厂，将切断对乌情报共享和武器销售。专家和官员指出，基辅在获取导弹袭击预警方面高度依赖美国情报。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【11】"}, {"n": 12, "t": "美国总统特朗普计划下月访问亚洲之际，再次提及可能与朝鲜领导人金正恩会面。然而，朝方至今未释放明确对话信号，反而高调展示包括洲际弹", "b": "之际，再次提及可能与朝鲜领导人金正恩会面。然而，朝方至今未释放明确对话信号，反而高调展示包括洲际弹道导弹、潜射弹道导弹等多款先进武器。分析认为，平壤意在展示核打击能力，强调拥核国地位，并为未来朝美谈判争取有利条件。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【12】"}, {"n": 13, "t": "随着伊朗伊斯兰革命卫队更加密集地攻击穿过霍尔木兹海峡的油轮，很多大型油轮的运营商宁可舍弃高额经济报酬，也选择掉头远离这个高风险航", "b": "地攻击穿过霍尔木兹海峡的油轮，很多大型油轮的运营商宁可舍弃高额经济报酬，也选择掉头远离这个高风险航道，让外界再次担忧波斯湾的原油出口是否可持续。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【13】"}, {"n": 17, "t": "英国前首相苏纳克星期二（10月13日）说，以美国为首的全球秩序“已经终结”，世界正进入地缘政治不确定性加剧的时期。", "b": "13日）说，以美国为首的全球秩序“已经终结”，世界正进入地缘政治不确定性加剧的时期。\n彭博社报道，苏纳克在新德里举行的彭博“新经济论坛”首日会议上说，美国总统特朗普“并非这一局面的成因，而是其体现出的症状”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【17】"}, {"n": 18, "t": "IMF星期二（10月13日）发布《全球金融稳定报告》点出，人工智能（AI）领域的投资有助弥补中东战争和整体政策环境不明朗构成的经", "b": "布《全球金融稳定报告》点出，人工智能（AI）领域的投资有助弥补中东战争和整体政策环境不明朗构成的经济冲击。但是，如今有“更多证据”显示，建立AI能力或许并不需要如此庞大的投资，潜在的经济利益也或许没有预期中大。\nIMF提醒，超大规模数据中心营运者（hyperscalers）为投资项目进行融资所发行的债券，如今已占全球投资级债券发行量的10%，比2024年高出逾10倍。如果AI领域的盈利或投资接下来趋缓，可能引发相关资产价格的调整，继而外溢到更广泛的市场，“后果可能是全球性的”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【18】"}, {"n": 19, "t": "导火索是《华尔街日报》的爆料：Guilfoyle 在 2025 年 7 月参议院确认听证会前，请求共和党捐赠人 Eric Det", "b": "Guilfoyle 在 2025 年 7 月参议院确认听证会前，请求共和党捐赠人 Eric Deters 向她的美国运通账户汇 10 万美元，帮她还信用卡。据 Deters 提供给媒体的信息，她承诺若收到钱，就做他在“特朗普世界里的 ride or die（生死之交）”，还在 Signal 上写道：“直接汇到美国运通的话，不会出现在任何地方。拜托。”Deters 拒绝了，称当时手头没有流动资金。\n这只是连串报道中的一桩：她还被指接受希腊商界大亨的奢华馈赠（包括飞巴黎的机票和豪华酒店），以及以提供接触政府高官的机会换取金钱。国务院监察长办公室正在调查。她通过律师否认以权谋私，称只是在离任前收回演讲和咨询的应收账款，且遵守了联邦礼品申报规定。\nGuilfoyle 曾是福克斯主播、特朗普长子 Donald Trump Jr. 的未婚妻、加州州长纽森的前妻――这起辞职令这段“准家人”关系画上尴尬句号。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【19】"}, {"n": 21, "t": "@®华尔街日报中文网X.com", "b": "@® 华尔街日报中文网               X.com\n@ChineseWSJ\n12]\n特朗普为何下令在航母上恢复使用蒸汽弹射器?\n一位名叫“比尔.琼斯”的水兵和特朗普的一次交谈\n让他确信，发射战机的旧式技术优于现代方法。\n官员们至今仍在应对这名神秘水兵与总统一次偶\n遇所带来的后果。而据国防官员说，他们始终没\n有找到这个人。\nFrom cn.wsj.com\n8:00 AM - 10/13/26 - 27K Views", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【21】"}, {"n": 24, "t": "泽连斯基：不要攻击我们，不要杀害我们的孩子。我们将停止攻击你们的柴油。我认为这是一个公平的交易。", "b": "害我们的孩子。我们将停止攻击你们的柴油。我认为这是一个公平的交易。 \n泽连斯基表示，乌克兰将在有或没有美国总统唐纳德・特朗普帮助的情况下赢得这场战争。\n我知道许多美国公民不支持他们的总统所做的事情，我敦促那些人继续为乌克兰祈祷，并在这一艰难时期支持我们。\n尽管美国总统选择支持普京――这个对这场战争负有责任的人――我们乌克兰人不会退缩。我们已经遭受了太多苦难，失去了太多生命，牺牲了太多，不能现在放弃。\n我们将继续为我们的自由、我们的国家以及我们的未来而战。无论有无美国的帮助，乌克兰都不会投降。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【24】"}], "tech": [{"n": 5, "t": "然后核心就一句话：\n\r\n【以前整条流水线上有超过600个拣椒工人，现在就保留了48位，负责最后一道经验把关。】\n\r\n用AI把60", "b": "【以前整条流水线上有超过600个拣椒工人，现在就保留了48位，负责最后一道经验把关。】\n\n用AI把600人裁到48人了。裁掉92%。\n\n好日子来了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【5】"}, {"n": 8, "t": "红果短剧日均125分钟登顶，抖音紧随其后120分钟，两个App加起来每天吃掉一个人将近4小时。字节系拿走全网41.8%的时长份额", "b": "音紧随其后120分钟，两个App加起来每天吃掉一个人将近4小时。字节系拿走全网41.8%的时长份额，这个数字太吓人了，快半壁江山了。\n表面上看，这是字节的产品胜利，算法推荐做到了极致，短剧的\"下一集\"钩子设计得无懈可击。但换个角度，一个普通人每天清醒时间大约16小时，光红果加抖音就占去四分之一，再加上微信、快手、视频号、小红书，六个App叠满差不多8小时。也就是说，你醒着的一半时间都交给了手机屏幕。\n更耐人寻味的是红果短剧悄无声息地超越了抖音。短视频至少还有知识区、技能区可以自我安慰\"我在学东西\"，短剧连这层遮羞布都省了，纯粹靠情绪刺激和剧情反转把人钉在屏幕前。当一个免费短剧App能让用户日均停留两个多小时，说明\"注意力收割\"已经进入了一个新阶段：连内容质量都不再重要，只要节奏够快、钩子够密，时间就会被吸走。\n腾讯系跌到28.6%也很有意思。微信作为基础设施级产品，日均才80多分钟，说明大家打开微信越来越像\"处理事务\"，聊完就走。社交关系链曾经是腾讯最深的护城河，如今挡不住算法投喂的多巴胺流。\n说到底，时长份额的争夺战里没有赢家是用户。平台赢了注意力，广告主赢了曝光，用户赢了什么？每天多刷两小时短剧之后，生活有变好吗？这张图与其说是行业格局图，不如说是一张集体时间审计表。看完之后最该做的事，可能恰恰是放下手机。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【8】"}, {"n": 20, "t": "有人偷偷放在办公室进行录音，OpenAI发现后并没有立刻报警，而是让GPT来分析找到是谁放的…", "b": "penAI发现后并没有立刻报警，而是让GPT来分析找到是谁放的…\nGPT分析了这台设备的来源、特征以及可能的获取路径，最终抓到了这名员工！\nOpenAI 随后将其移交给了 FBI，将这名员工逮捕…\n该设备插入电视后部的 USB 端口，并隐藏在卫生纸中。OpenAI 确定该设备大约于 9 月 28 日安装，其内容已加密。投诉称，监控录像显示 Alfozan 在多个日期出现在该房间附近，尽管他无权进入或参加那里的会议，并且在 9 月 28 日之前，他使用办公软件查询了建筑物地址、会议室、日历和高管位置。\n投诉进一步指称，10 月 5 日有人看到他查看电视后面，随后 OpenAI 安全人员在他遗留在另一个房间的无人看管的包中发现了第二个类似的录音设备，以及他的钱包和身份证。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【20】"}, {"n": 23, "t": "中文互联网9大民间理论", "b": "中文互联网9大民间理论\n薄肌理\n不卷夸张围度\n大水理论\n少喝奶茶饮料\n常备一大瓶白水 和\n纯过日子理论\nas\nfLAFFELZUVA\nf hr fh\nBE ge a\n由全和\n苹果安卓相对论 黄毛理论\n用手机偏好  we]   少迎合 多主见\n隐喻人群气质差         认准的事就去做    A\n本质是消费观察        留一点反骨和松弛 二  ”)\nay\nTART\n“  UY ge       !\n渔\nF745\nLE gn\n大睡理论\n先把沉睡够\nDRE DAR\n状态好了再说\ny\n孙学\n认知 选择权 长期主义\n先升级自己\n再谈财富和", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196131#:~:text=【23】"}], "cult": [{"n": 6, "t": "演员金晨自曝刚交完学费，美国学校就倒闭了，学校有35年历史，自己才上了两天，钱也没退", "b": "演员人金晨自曝刚交完学费，美国学校就\n倒闭了，学校有35年历史，自己才上了\n两天，钱也没退\n21世纪经济报道\n257A Al摘要\n1   女演员金晨直播谈游学近况，她表示\n00 PERT VASE 0j2698\n此前，金晨远赴海外游学进修，暂时放缓演艺工\n作节奏。\n此举引发网友猜测“金晨是不是怀孕了，打算出国\nEF\"? 9月1日，金晨委托律师发声明，称\"人金晨\n出国生子”系严重失实的言论，已明显误导公众判\n断，导致委托人的公众形象受损，影响极其恶\n劣。律师事务所将继续受托针对具有严重侵权情\n节的主体进行追
