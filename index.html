有正反馈，做的不好有负反馈。\n\n当年怎么把他选上去的人，现在就怎么把他选下来，当年选他，是为了发泄自己对民主党的不满，一旦选上，他就成为不满的对象了。\n\n只能说选票是个好东西，在社会治理方面真是无本万利。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【1】"}, {"n": 13, "t": "《给阿公的战书》", "b": "—_-\"\n请 我理解了半天，又理解了半天\n两个男生，潮汕独子\n(前面有6个姐姐)\nand\n山东长子(九代单传+\n刚考上公) 想在一起\nBAABASS\n06844 ©422 Gis7 2,390\na 拍成电影可以横扫欧洲三大电影节了\n@43840 Qu D2 6o2", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【13】"}, {"n": 14, "t": "当地时间11月3日，美国举行中期选举，最新计票结果显示，民主党同时获得了国会参众两院的控制权。美国总统特朗普向民主党发出祝贺。\n", "b": "期选举，最新计票结果显示，民主党同时获得了国会参众两院的控制权。美国总统特朗普向民主党发出祝贺。\n\n特朗普在接受哥伦比亚广播公司（CBS）新闻频道的电话采访中，祝贺民主党人在中期选举中获胜。特朗普说：“我向民主党人表示祝贺，并期待与你们合作，为我们国家的利益而努力。”\n面对美国中期选举民主党大幅领先基本锁定胜局的情况，#特朗普#表示：“我没有出现在选票上，如果我在，我们会以压倒性优势获胜！”\n\n然而他在接受媒体采访时又说：“我完全愿意接受这些结果，我们会与民主党人合作，而且我们期待与他们合作。我们或许能找到解决办法。” \n中期选举结果估计对川普很不利，川普对福克斯新闻都破口大骂", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【14】"}, {"n": 15, "t": "当地时间11月3日，美国正在进行中期选举计票，据美国独立选举分析机构Decision Desk HQ预测，民主党将夺回对众议院的", "b": "行中期选举计票，据美国独立选举分析机构Decision Desk HQ预测，民主党将夺回对众议院的控制权，结束长达四年的少数党地位。\n《国会山报》称，这一变化将对明年美国政府的运作产生直接影响，阻碍现任总统特朗普的立法议程，众议院和特朗普政府未来可能将就移民执法、政府支出、全球关税和伊朗战争等问题发生更多冲突。\n民主党誓言要对特朗普及其核心圈子展开一系列详尽的调查，其中包括爱泼斯坦丑闻、驱逐移民暴力事件以及特朗普不断增长的个人和家庭财务状况。\n民主党的胜利将使民主党人哈基姆・杰弗里斯成为美国历史上第一位黑人众议长。杰弗里斯在中期选举前夕说：“新一届国会将向全国民众承诺，从第一天起，我们将追究所有骗子的责任。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【15】"}, {"n": 16, "t": "美国媒体预测，民主党人波特姆斯在中期选举中当选佐治亚州州长，成为美国历史上首位黑人女性州长。", "b": "在中期选举中当选佐治亚州州长，成为美国历史上首位黑人女性州长。\n美国有线电视新闻网（CNN）和美国全国广播公司（NBC News）都预测，波特姆斯（Keisha Lance Bottoms）在星期二（11月3日）的中期选举中，击败共和党对手杰克逊（Rick Jackson），赢得佐治亚州州长职位。\n她的胜选也意味着，佐治亚州州长一职在由共和党掌控20多年后，重新回到民主党手中。这对总统特朗普而言是一次打击。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【16】"}, {"n": 17, "t": "欧洲至少九个国家的超市疑遭网络攻击，比利时、爱沙尼亚、芬兰、爱尔兰、意大利、卢森堡、荷兰、葡萄牙和瑞典的超市称他们的制冷系统出现", "b": "攻击，比利时、爱沙尼亚、芬兰、爱尔兰、意大利、卢森堡、荷兰、葡萄牙和瑞典的超市称他们的制冷系统出现故障，温度在夜间升高，迫使部分零售商丢弃食品。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【17】"}, {"n": 18, "t": "朝鲜劳动党总务部长金与正罕见就美国指控朝鲜黑客窃取63亿美元加密资产发表谈话，斥责有关指控是“严重政治挑衅”，并警告将重新审视美", "b": "美国指控朝鲜黑客窃取63亿美元加密资产发表谈话，斥责有关指控是“严重政治挑衅”，并警告将重新审视美国的敌对态度。分析认为，金与正亲自回应，既意在阻止国际社会进一步施压，也可能借此向华盛顿传递外交信号。\n尽管金与正高调否认朝鲜涉案，英国《金融时报》3日报道，涉案的黑客正通过拆分转账、兑换币种及去中心化金融（DeFi）平台等方式，展开复杂洗钱行动。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【18】"}, {"n": 19, "t": "布什比最初估算这段路程大约需要五年才能走完，但他深知这并不现实。“我们猜测需要12年多，而且是多出不少。但我们做梦也没想到，竟然", "b": "五年才能走完，但他深知这并不现实。“我们猜测需要12年多，而且是多出不少。但我们做梦也没想到，竟然是28年。”\n布什比的旅途纵贯南美洲、北美洲、亚洲、欧洲，他穿越丛林、荒漠与极地冰原，也踏过白令海峡冰面，并先后横渡里海、英吉利海峡，以纯人力方式完成跨洲跨国行进。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【19】"}, {"n": 20, "t": "日本北海道海边近日出现一座特别的电话亭，里面的黑色转盘电话没有连接任何线路，却能让失去亲人的民众拨出思念，向逝者倾诉未说出口的话", "b": "的电话亭，里面的黑色转盘电话没有连接任何线路，却能让失去亲人的民众拨出思念，向逝者倾诉未说出口的话。\n这座名为“海之电话”（Umi no Denwa）的电话亭，星期天（11月1日）在北海道罗臼町启用，主要供2022年知床半岛观光船沉没事故的遇难者家属使用。那场事故造成20名乘客和船员死亡，另有六人至今下落不明。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【20】"}, {"n": 22, "t": "民主党人Keisha Lance Bottoms（凯莎・兰斯・博特姆斯，前亚特兰大市长）击败了共和党候选人Rick Jackso", "b": "e Bottoms（凯莎・兰斯・博特姆斯，前亚特兰大市长）击败了共和党候选人Rick Jackson，当选佐治亚州第84任州长。\n一百多年前这地方还是美国棉花种植园核心区，黑人女性基本只能在种植园里伺候人，《乱世佳人》里那种端茶倒水、端屎端尿的角色就是写的佐治亚。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【22】"}, {"n": 25, "t": "2/3犹太裔美国人投给了民主党", "b": "Political Polls @ @PpollingNumbers .1小时\noe  O 翻译自 Ris\n最新 - 犹太选民\n@ 民主党67%\n@ 共和党32%\n出口民调 - NBC\nO 175     人记 741      QD 4273 hy 32万\n@ MissyB\n六 @UltraMAGAMissy\nGO 由 Grok 翻译自英语\n货。我们为什么要为他们而战?\n评价此翻译: Ol\n10:02 - 2026/11/4 - 1629 (RES", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【25】"}, {"n": 28, "t": "他强调：这在美国是常态，一百年来，总统任上第一次中期选举，本党都会输得很惨", "b": "来，总统任上第一次中期选举，本党都会输得很惨", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196556#:~:text=【28】"}, {"n": 29, "t": "德桑蒂斯：这些共和党人中的一些人说：“哦，嗯，汽油，别担心。这没什么大不了的。”或者他们试图把责任推给拜登。不，不。听着，我们必", "b": "人说：“哦，嗯，汽油，别担心。这没什么大不了的。”或者他们试图把责任推给拜登。不，不。听 =xilei&id=196580#:~:text=【3】"}, {"n": 4, "t": "为操盘团伙介绍公募接盘锁仓，知名券商原首席策略分析师获刑", "b": "近日，《华夏时报》记者独家获悉，中泰证券研究所原首席策略分析师陈龙，因犯\n非国家工作人员受贿罪、对非国家工作人员行贿罪，已被判处有期徒刑三年九个\n月。\n知情人士透赶，2020年4月和7月，陈龙作为中间人，先后为两个不同操盘团伙介绍\n公募机构接坦锁仓新天然气 ( 603393.SH ) 、台华新材 ( 603055.SH ) 股票，非法\n获利共计110万元，并向基金经理行贿。\n2023年6月20日，涉新天然气股价操纵案，上海市浦东新区人民法院认定陈龙犯非\n国家工作人员受贿罪，判处有期徒刑三年三个月。2025年12月，涉台华新材股价操\n纵案，嘉兴市中级人民法院认定陈龙犯对非国家工作人员行贿罪，判处有期徒刑九\n个月，与前徘并罚决定执行有期徒刑三年九个月。\n陈龙刑期止于2026年1月30日，目前已恢复自由。2026年11月4日 ，《华夏时报》记\n者致电陈龙寻求置评，他表示自己现在处于失业状态，思绪很乱，不知道讲什么。\n中泰证券向记者回应称，陈龙相关事项属个人行为，与公司无关。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【4】"}, {"n": 5, "t": "最近发言言辞激烈被公司批评了", "b": "@拌音集团李亮 O\n最近发言言套激烈被公司批评了。\n红果的发展，离不开社会各界的建议和批评，我们一直欢迎重视大家的批评与建议，也\n正因此，红果的内容质量才会不断提升，涌现出包括《家里家外》、《法官的荣烃》、\n(EBS) . CBRE) . (HDS). (BENE). GRAB\nSDORGESHA) . (HEED). (—MARKID . (BEEN. (Ee\n了腿》、《危楼之上》、《贝家花园的秘密》、《怒刺》等等大量服务社会的优质作品，\n有些作品已经上架十几季，用户预约系列剧|     R威。红果app 内用户预约追剧已经\n成为最主要的分发多辑，用户通过收藏，预约等越来越容易找到自己喜欢的剧去追。\n给大家介绍一下《持械入宋》背后的*非专业\"制作团队，该团队成员分散广东、安徽、\n湖北、河:等地，全部线上协作，多为莫职起步，成员背景全是草根: 宝妈 (常因接孩\n子乍不上会以) 、网约车司机、做批发生意的、开小货车送货的、普通公司职员，无专\n业编剧、主创非影视科班出身，是一部“群众创作\"的作品。ai技术正让各行各业，成干\n上万民间高手成为\"爆款剧 的导演。\n短剧才刚刚起步，会有很多不足，平台会不断吸收外界意见，共同促进健康发展。短剧\n在海外也大受欢迎，也期待早日出现超越好莱坞的大制作。 收起\n5小时前                         Y% 164 团 218 办 94", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【5】"}, {"n": 7, "t": "“我考不成公了啊”，男子诈骗十万余元，被抓时距国考仅剩37天，家中存放大量考公书籍", "b": "《\n“我考不成公了啊”，男子诈骗\n十万余元，被抓时距国考仅剩\n37天，家中存放大量考公书籍\n第一财经\n们 34人 Al摘要\n据巴州公安，近日，四川巴中市巴州\n区警方接到报警，一名男子以“寄拍”\n为名，通过社交软件骗取受害者 3000\n元押金。同时查明，嫌疑人通过相同\n借口骗取十余名受害者缴纳押金，涉\n案金额高达十万余元。\n(        es»\nQeuzeo DP OD\n99 876 26     11", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【7】"}, {"n": 11, "t": "普通交警，身价竟上千万。公务员的招生广告", "b": "河南一个普通交警，身价竟上千万\n周口市公安局交警支队考试中心，一个普通的\n科目二考官李某，干了三  =, HEA GYESIT\n近干万。\n他不是什么支队长，也不是分局领导，就是个\n负责考试的一线交警。可三年里，他私下违规\n办理轰驶证5800多份，收的钱从每人2000\n到2500不等。除了这些明面上的贿赂，家里\n还有大笔说不清来源的财产。法院一算，房产\n加上其他资产，将近1190万，去掉工资和已\n退的部分，剩下800多万 dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【13】"}, {"n": 14, "t": "美国总统特朗普说，尽管伊朗战争拖累共和党选情、痛失国会控制权，但他坚信这场战事依然完全值得。", "b": "拖累共和党选情、痛失国会控制权，但他坚信这场战事依然完全值得。\n特朗普星期三（11月4日）在华盛顿面对媒体询问时说：“关于伊朗，我们必须采取行动，而且我们仍在继续这么做。”\n他坚称，为了阻止德黑兰拥有核武器，这场战事不可避免。“就这场战争而言，我所做的决定不会有任何改变。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【14】"}, {"n": 15, "t": "美国中期选举结果揭晓，共和党遭遇惨重挫败。面对国会选情崩盘，共和党内部迅速出现问责声浪，并集中指向战争部长赫格塞斯。", "b": "遇惨重挫败。面对国会选情崩盘，共和党内部迅速出现问责声浪，并集中指向战争部长赫格塞斯。\n美国有线电视新闻网（CNN）引述国会消息人士报道，众议院最快将于下周复会时，就弹劾这位五角大楼一把手的动议举行全院表决。\n本次选举被共和党内部战略人士定性为“2008年级别的严重失利”，不仅痛失多处关键席位，更重挫该党未来数年的立法主导权。外界普遍认为，对伊朗军事行动直接冲击民调底线，通胀压力与中东战事久拖不决，引发选民强烈的反弹情绪。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【15】"}, {"n": 16, "t": "民主党在美国中期选举中全面收复参众两院失地，终结了行政与立法机关由单一党派把持的格局。由于不满白宫在未获授权下涉足海外冲突并推行", "b": "参众两院失地，终结了行政与立法机关由单一党派把持的格局。由于不满白宫在未获授权下涉足海外冲突并推行单边制裁，据路透社梳理， 新一届国会多数党计划自明年1月起，围绕五大核心领域全面重塑美国外交政策走向。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【16】"}, {"n": 17, "t": "美国中期选举结果出炉，共和党大败。对此，日本政府内部虽有“早有预料”的冷静看法，但也传出不安的声音，并正密切关注特朗普政权的后续", "b": "败。对此，日本政府内部虽有“早有预料”的冷静看法，但也传出不安的声音，并正密切关注特朗普政权的后续动向。有报道透露，目前高市政府最关心的，是特朗普总统在即将于中国举行的亚太经合组织（APEC）会议上将扮演何种角色，以及他会否为转移国内政局混乱的视线，而大打“中俄牌”。\n要求匿名的一位日本前外长做出严峻评估，认为此次败选“不仅会导致特朗普丧失号召力，美国在国际社会的影响力恐怕也会随之下降”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【17】"}, {"n": 18, "t": "面对民间舆论的强烈反弹与伦理质疑，越南政府星期一（11月2日）正式撤回一项允许15岁至17岁未成年人在逝世后捐赠器官的争议性立法", "b": "疑，越南政府星期一（11月2日）正式撤回一项允许15岁至17岁未成年人在逝世后捐赠器官的争议性立法草案。\n越南官员说，政府拟修订2006年制定的器官及组织捐赠法，以增加可供器官移植的来源，同时保障捐赠者权益。据当地媒体报道，越南自1992年起实施合法肾脏移植，迄今每年器官移植案例居东南亚之冠，但绝大多数器官来自活体捐赠者，遗体器官捐赠仍相对有限。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【18】"}, {"n": 19, "t": "两艘🇷🇺油轮，由于原定🇺🇸港口和公司不敢接、怕日后招来麻烦，已改道地中海", "b": "和公司不敢接、怕日后招来麻烦，已改道地中海\n第三艘，正驶向纽约，也有可能掉头去巴西\n新泽西州长警告港口码头：接俄油违法\n没有美国企业愿意冒险尝试", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【19】"}, {"n": 21, "t": "洛杉矶选出第一位社会主义者市长。                                关注\n@Forbes\nS 显示翻译\nDid Musk Delete His 'Vote Red Today!’ Post? Grok\nSays Yes After Major Republican Losses\ngo.forbes.com/g9gOyW\n有\n03:35 - 2026/11/5 -61F 次查看\n© 54     aim     QO 748    内 25\nob", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196580#:~:text=【23】"}], "cult": []}}, {"date": "20261106", "label": "11月6日", "week": "周五", "id": "196604", "title": "只要我们停止开发大模型，中国大模型也会停止进步的", "cats": {"econ": [{"n": 5, "t": "11月5日，在国家医保局举办的医保钱包2.0版媒体解读会上，针对网络舆论关注的“居民医保参保人数七连降、减少8300万”的说法，", "b": "医保钱包2.0版媒体解读会上，针对网络舆论关注的“居民医保参保人数七连降、减少8300万”的说法，国家医疗保障局规划财务和法规司副司长张晨光解释，居民医保参保人数下降有多方面原因：一是治理重复参保，2019-2024年全国从居民医保口径剔除重复参保等无效数据约2500万人；二是居民医保转向职工医保，2019-2025年职工医保人数从3.1亿增至3.89亿、净增约6000万，很大部分由居民医保转入；三是常住人口减少，2021年全国人口达峰后连续三年下降。张晨光表示，2025年起居民医保参保人数下降与人口总量变化趋势相符，也与参保结构优化相适应。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【5】"}, {"n": 8, "t": "实验猴，涨至26万一只", "b": "另一家广州养殖企业给出的食蟹猴初\n步报价，则达到25万一26万元/只。\n记者询问目前食蟹猴、恒河猴两种实\n验猴的价格时，该企业工作人员表\n示, “两种猴子的价格差很多”，其中\n食蟹猴预计已经达到25万一26万元/\n只，恒河猴则在15万元/只左右。\n不过，有价格并不意味着一定有货。\n‘C) 财联社 ©\n实验猴，涨至26万一只", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【8】"}, {"n": 15, "t": "#贷款买房故事竟是编的# ，还被写进了教科书？", "b": "方言\n1北京人 BEBE AT)\n第940位受访者", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【15】"}, {"n": 21, "t": "新西兰国家统计局星期三（11月4日）公布的最新数据显示，截至9月的第三季度，新西兰失业率从上一季度的5.5%攀升至5.7%，创下", "b": "4日）公布的最新数据显示，截至9月的第三季度，新西兰失业率从上一季度的5.5%攀升至5.7%，创下2015年以来的11年最高纪录。同期就业人数环比萎缩0.1%。这一表现显著逊于市场及新西兰央行此前维持在5.5%的预期。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【21】"}, {"n": 28, "t": "民主党已经在计划，取消Trump对加拿大新征的关税，尤其在密歇根、缅因、阿拉斯加等与加拿大贸易活跃的州，有足够共和党支持，有可能", "b": "Democrats Are Hatching a Plan to\nReverse Trump’s Canada Tariffs\nIn states such as Michigan, Maine and\nAlaska, peeling back the tariffs also\nhas drawn support from some\nRepublicans\nFrom wsj.com", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【28】"}, {"n": 36, "t": "消费不好的原因找到了", "b": "人们开始怀念煤老板了个\n当年人人都骂煤老板为富不仁，钱来得太容易\n但煤老板发财以后，又是买房又是买车\n连KTV、饭店、司机、保姆，甚至情人都能跟着发财\n现在倒好，煤老板不行了，轮到科技新贵登场。\n这些人身价几十亿、几百亿美元\n穿着同一件T恤，吃着工作餐，平常没什么开销\n钱一分不往外流，却热衷搞什么离岸信托\n最大的消费，可能是买显卡、建数据中心\n以前一个煤老板发大财，一批人跟着发小财\n现在一家巨头赚钱，转手就流进另一家巨头\nAl造出了吓人的财富，但对普通人没有喻毛线用\n工作岗位没多出来，消费也没多出来。\n煤老板至少会多请几个保姆、阿姨\n科技新贵特么的，连三姐都想换成机器人", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【36】"}], "soc": [{"n": 2, "t": "2026年11月4日凌晨5时许，陕西省商南县城区发生一起刑事案件，致3人死亡、2名出警人员受伤。犯罪嫌疑人孙某军（男，41岁，商", "b": "陕西省商南县城区发生一起刑事案件，致3人死亡、2名出警人员受伤。犯罪嫌疑人孙某军（男，41岁，商南县十里坪镇人）作案后逃离现场。案件发生后，陕西省市县公安机关全力侦查搜捕，11月6日10时许，在县城外深山一废弃房屋中发现孙某军尸体。经勘验，系自杀身亡。目前，案件正在进一步侦办中。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【2】"}, {"n": 3, "t": "被撤销全国政协委员资格两天后，女高官余艳红官宣落马。11月6日，中央纪委国家监委网站发布消息称，国家卫生健康委员会原党组成员，国", "b": "女高官余艳红官宣落马。11月6日，中央纪委国家监委网站发布消息称，国家卫生健康委员会原党组成员，国家中医药管理局原党组书记、局长余艳红涉嫌严重违纪违法，主动投案，目前正接受中央纪委国家监委纪律审查和监察调查。\n至此，2026年中央纪委国家监委已公布58名中管干部落马的消息。此外，余艳红还是中共二十大以来继李微微、赵金云、刘慧、王莉霞、乌兰、王峻、张世平、包惠、俞小平、鲁昕之后被查的第11名女高官。\n今年2月27日，余艳红被免去国家中医药管理局局长职务。\n公开信息显示，余艳红现年64岁（1962年10月生），湖南邵阳人，1978年9月考入衡阳医学院（南华大学前身之一）医疗系医疗专业，1983年8月毕业后成为衡阳医学院第二附属医院妇产科医师，两年后的1985年8月又考上湖南医科大学（中南大学前身之一）医疗系妇产科学专业硕士研究生。1988年8月硕士毕业后，余艳红进入第一军医大学第一附属医院（2004年更名为南方医科大学附属南方医院）工作，从妇产科医师逐步晋升为主任。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【3】"}, {"n": 4, "t": "11月5日，最高法院、最高检察院联合发布六起依法惩治新型、隐性职务犯罪典型案例。财新检索比对发现，其中不具名披露的案例三“张某某", "b": "院联合发布六起依法惩治新型、隐性职务犯罪典型案例。财新检索比对发现，其中不具名披露的案例三“张某某受贿、利用影响力受贿案”，被告人职务、任职经历、涉案金额、审理法院以及起诉和宣判时间等，均与早前通报的中国光大银行原党委副书记、副行长张华宇受贿、利用影响力受贿案吻合。\n张华宇曾在退休前夕辞职，中央纪委国家监委曾在“双开”的通报中称他是“提前筑巢”“逃逸式辞职”腐败的典型。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【4】"}, {"n": 7, "t": "蔚来李斌再次警告：车重增加两成 路面损耗增至2.07倍", "b": "【蔚来李斌再次警告: 车重增加两成 路面损耗\n增至2.07倍】11月5日，在2026世界互联网大会\n:乌镇咖荟:汽车夜话论坛上，蔚来创始人、董寻\n长、CEO李斌与吉利控股集团董事长李书福同\n台对话，这是双方9月28日达成充换电全面战略\n合作后的首次公开对话。这次对话议题集中于动\n力电池寿命与补能路线，在此期间，李试再度谈\n及整车重量问题。", "href": "https://www.dapenti.c  "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【35】"}, {"n": 37, "t": "@开心鸭 · @珠��大寨主", "b": "三十年前落户休斯顿的家族长辈曾经谆谆教导我“民主制度就是最不坏的制度，即使一帮混蛋在一起投票也不会选出最大的混蛋当领袖”，现在他正在怒斥德州来了太多“外人”才变蓝了，他们根本不该有投票权。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【37】"}], "intl": [{"n": 18, "t": "美国总统特朗普星期四（11月5日）声称，美国即将与俄罗斯就乌克兰问题乃至“整个欧洲”达成一项重大协议。", "b": "日）声称，美国即将与俄罗斯就乌克兰问题乃至“整个欧洲”达成一项重大协议。\n美国第一夫人梅拉妮亚此前在白宫主持一场史无前例的会议，促成俄罗斯与乌克兰两国官员面对面会谈。特朗普随后更透露，自己在白宫临时闭门会见了俄罗斯总统普京的特使德米特列耶夫（Kirill Dmitriev），但并未会见同在白宫的乌克兰代表。\n特朗普此番言论与举动，立即加剧了基辅与欧洲盟友对华盛顿可能向克里姆林宫妥协、削减在欧洲驻军并扩大俄罗斯地缘影响力的深层忧虑。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【18】"}, {"n": 19, "t": "据印尼多家媒体报道，警方星期一（11月2日）披露，自9月下旬以来已接获五起报案，累计确认至少58名印尼公民沦为受害人，涉案者甚至", "b": "（11月2日）披露，自9月下旬以来已接获五起报案，累计确认至少58名印尼公民沦为受害人，涉案者甚至包含退役国民军军人和警察。警方已在多地逮捕包括两名俄罗斯籍和一名乌克兰籍在内的13名犯罪嫌疑人，另有一人在逃。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【19】"}, {"n": 20, "t": "主打终身环游世界的美国奥德赛号游轮因燃油资金耗尽将约200名长住乘客遗弃在柬埔寨后，已于星期三（11月4日）凌晨悄然离开柬埔寨西", "b": "游轮因燃油资金耗尽将约200名长住乘客遗弃在柬埔寨后，已于星期三（11月4日）凌晨悄然离开柬埔寨西哈努克港，部分航海追踪网站显示此船正开往新加坡。\n西哈努克省旅游局向媒体证实，游轮启航时未搭载任何乘客，船上仅有约50名船员。目前仍有约100名受影响乘客滞留在柬埔寨，其余乘客和大部分船员则大多已搭乘航班飞往本区域其他国家。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【20】"}, {"n": 22, "t": "随着地缘政治局势日益紧张，美国、日本、澳大利亚和印度组成的“四方安全对话”（Quad）近年密集举行联合操演。自星期四（11月5日", "b": "、日本、澳大利亚和印度组成的“四方安全对话”（Quad）近年密集举行联合操演。自星期四（11月5日）起，四国在东京以东海域展开一连八天、代号为“马拉巴尔”（Malabar）的联合军演，以维护“自由的印太区域”为首要目标。\n“马拉巴尔”军演始于1992年，创立之初以海上救援及联合反恐为主，随后规模不断扩大，并向联合作战演训迈进。日本于2007年首度参与，而今年的演习则在美日两军共同驻扎的横须贺军港拉开序幕。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【22】"}, {"n": 25, "t": "美国总统特朗普所属的共和党在周二（11月3日）的中期选举中惨败后，欧洲极右翼政治人物纷纷开始与他保持距离，但他们大多避免直接批评", "b": "二（11月3日）的中期选举中惨败后，欧洲极右翼政治人物纷纷开始与他保持距离，但他们大多避免直接批评特朗普本人。\n2024年特朗普赢得第二个总统任期后，欧洲极右翼领导人曾大力宣扬他们与特朗普在意识形态上的紧密联系，当中一些人之后还访问了华盛顿，并获得共和党大金主、亿万富豪马斯克的支持。但随着共和党在选举中遭受重挫，他们的立场有了明显的改变。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【25】"}, {"n": 26, "t": "在共和党中期选举惨败后，外媒传美国国务卿鲁比奥将要辞职并备战下届总统选举。对此，鲁比奥当地时间11月5日予以否认，并表示将会为特", "b": "美国国务卿鲁比奥将要辞职并备战下届总统选举。对此，鲁比奥当地时间11月5日予以否认，并表示将会为特朗普工作到其总统任期结束。\nRubio：没打算辞职，不知道谣言是哪传出来的，很喜欢现在的工作，会一直做到任期结束…不想谈2028，如果Vance决定竞选总统，会第一个出来支持他", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【26】"}, {"n": 32, "t": "发现一个反贼！就是美国大使馆", "b": "10:04         als @\n美国驻华大使馆                                U.S. Embassy Beijing\njee WHITE HOUSE\nBikes:\n我们必须让美国始终伟大有\n信仰。自由。自由权。\n留  BEricO\nOamicn.e TO FO OD\n2952 8751 1065 1680", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【32】"}, {"n": 34, "t": "CNN：美国参议院外交关系委员会要求马斯克保留有关乌克兰“星链”被限制的文件，以备可能展开的调查。", "b": "会要求马斯克保留有关乌克兰“星链”被限制的文件，以备可能展开的调查。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【34】"}], "tech": [{"n": 1, "t": "美国中期选举结果引发对人工智能（AI）扩张降温的极度恐慌，触发华尔街科技股星期四（11月5日）遭遇近两年来最惨烈的单日抛售狂潮。", "b": "（AI）扩张降温的极度恐慌，触发华尔街科技股星期四（11月5日）遭遇近两年来最惨烈的单日抛售狂潮。以科技股为主的纳斯达克综合指数重挫逾5.5%，市值单日蒸发约2.5万亿美元，包括苹果、英伟达与特斯拉在内的“科技七巨头”，单日市值累计损失高达1万亿美元。\n标普500指数星期四闭市下跌4.3%，创下2025年4月以来的最大单日跌幅；道琼斯工业平均指数也大跌超过3.4%，悉数抹平了选后的全部涨幅。作为避险资产的美国10年期国债收益率则应声滑落至4.83%，创下9月以来的新低。\n川普痛心疾首", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【1】"}, {"n": 6, "t": "第一财经：韩红爱心基金会，三季度月捐收入下滑超40%", "b": "韩红爱心基金会，三季度月捐收入\n下滑超40%\n第一财经 202    13 上海 们285人\nAI摘要\n近日，据韩红爱心慈善基金会官方账号，基金会\n公布2026年1-9月月捐数据。\n数据详情显示，1-9月韩红基金会\"月捐收入超\n4.33亿元，支出超1.6亿元。数据还披露了1-6月\n月捐收入超3.33亿元，1-3月月捐收入超1.65亿\nToo\n从月捐收入看，2026年三季度，韩红基金会月捐\n收入较一、二季度出现明显下滑，跌幅超40% 。\n此前报道: PRWLROKMBRSSRARA", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【6】"}, {"n": 9, "t": "但斌：“AI时代就此落幕”概率极小", "b": "但试 Wap                       A\n26:  6 08:13 366 iPhone 17 Pro Max\n发布于     8\n一觉醒来，美股一片*\"血雨腥风\"，市场似乎在提前计价\n民主党这份《禁止人工超级智能法案》草案 。\n但以常识判断，这类法案真正落地的概率其实很低。问\n了在美国的朋友，他的看法如下: “这更多是标题党。\n国议员每年会抛出成千上万份议案，绝大多数最终都无\n法通过，提案和生效立法完全是两回事。\n个开放的社会，本就如同自由市场，各类观点都可以\n拿出来公开辩论、充分竞争，最终交由事实、罗辑与实\n践去检验…”\n此次的下跌，冲击感起比当年贸易战来袭的时候。彼时\n很多人觉得美国完了，现在不少声音又觉得AlI完了。可\n以承认这是一次阶段性的冲击，但就此判定Al时代就此\n落幕，我认为概率极小。\n放到投资上，核心就是分清议题炒作和确定性政策落\n地。Al长期的产业趋势，不会被一份激进提案轻易改\n写; 只是市场短期情绪，总是容易被抓人眼球的消息牵\n动。\n备注: 本文只是一点对投资的感悟，不构成投资建议，\nABM, MIA. AM, MAIC. AR\n资、加杠杆。适度分散投资也很重要。\n和违规处昼开比非法研究核器! 美\nGRERMMMMAIE: TAB\nSM2O% MMR, ALAA NANT,", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【9】"}, {"n": 13, "t": "大概率是真的", "b": "3亿播放只分两万\n美元，短剧出海的\n降本神话已翻篇\n10月22日，一篇行业报道把AI短剧出海的分\n账数字摆到了桌面上。\niH\n工坊CEO邓成业提到，万次播放收丛从约\n30美元， 又降到几美元。更刺眼的是另一个案例 :\n一个海外国队拿到3亿播放量，收入约2万美元，随\n后国队解散。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【13】"}, {"n": 17, "t": "李睿-lrmax:这纪念品完成度一般，非要打分的话，九十几吧", "b": "度一般，非要打分的话，九十几吧", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【17】"}, {"n": 24, "t": "塔拉里科周三接受 CNN 采访时被问到是否会接马斯克的电话，他回答：“就像我说的，我会跟任何人合作。”这位民主党人周二以约 59", "b": "时被问到是否会接马斯克的电话，他回答：“就像我说的，我会跟任何人合作。”这位民主党人周二以约 59% 对 39% 的得票击败共和党对手肯・帕克斯顿，赢得得州参议员席位；马斯克的大手笔投入最终未能阻止得州翻蓝。\n塔拉里科的这番表态最早出现在上周日 NBC 的一档采访中，当时胜负尚未揭晓。他的原话是：“在马斯克开始花 2 亿美元对付我、开始对联邦政府搞鲁莽裁员之前，我一直是他的粉丝。我是 SpaceX 和特斯拉的大粉丝。他是一位伟大的商业领袖、企业家和创新者，我希望他专注于这些事。但我不喜欢他试图买下得州这个参议员席位，不喜欢他用财富影响我们的政治体制。界限就划在这里。”他同时强调，在科技与创新领域，“只要对得州有利，我就会跟他合作”。\n马斯克近年已把 SpaceX 和特斯拉的总部都迁到了得州，星舰基地与超级工厂雇佣着成千上万得州人，一位得州参议员与他结下死仇，于州于己都没有好处。\n值得注意的是，塔拉里科的橄榄枝并不只伸向马斯克――他在同一场采访中还说，当选后的第一件事就是与在电视上骂他是“怪胎”的泰德・克鲁兹坐下来谈谈，甚至开玩笑说要送克鲁兹一件印着“我是塔拉怪胎”的 T 恤。从牧师、教师出身的塔拉里科一路走来主打的就是弥合分歧的形象，而这次胜选后的连番示好，正在把这种姿态变成他在参议院的招牌。\n \n中期选举进行时，马斯克持续疯狂攻击德州参议员竞选者Talarico。Talarico在德州胜选之后，马斯克把骂他的几十条帖子全部删掉了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【24】"}, {"n": 30, "t": "刚刚当选美国历史上首位穆斯林联邦参议员的 Abdul El-Sayed 声称：美国应该全面暂停前沿 AI 研发，不必太担心中国追", "b": "邦参议员的 Abdul El-Sayed 声称：美国应该全面暂停前沿 AI 研发，不必太担心中国追上来。\nSayed表示，中国AI只是美国AI的模仿和抄袭者，就像是被快艇拖着的划水者。美国快，中国进步也会很快，美国停止开发前沿大模型了，中国也会停止自动停止进步的。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【30】"}], "cult": [{"n": 12, "t": "近日，演员黄渤在接受采访称长时间接不到好戏，就会有疲劳感#黄渤说已经很久没接到好戏#。今年几乎已经没戏了，又想到有多少人工作是为", "b": "间接不到好戏，就会有疲劳感#黄渤说已经很久没接到好戏#。今年几乎已经没戏了，又想到有多少人工作是为了果腹，而自己从事自己喜欢的职业，又有什么好抱怨的。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【12】"}, {"n": 27, "t": "1963年，他凭借导演首作获得威尼斯电影节好评，此后却长期与审查制度发生冲突。其最具争议的作品《罗马帝国艳情史》因制片方擅自修改", "b": "威尼斯电影节好评，此后却长期与审查制度发生冲突。其最具争议的作品《罗马帝国艳情史》因制片方擅自修改影片并加入额外成人内容，引发了持续多年的创作权纠纷。巴拉斯的职业生涯横跨欧洲实验电影、历史情色史诗与女性欲性解放。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196604#:~:text=【27】"}]}}, {"date": "20261107", "label": "11月7日", "week": "周六", "id": "196614", "title": "让我提醒你几件事，叛徒", "cats": {"econ": [{"n": 5, "t": "企业主动提前还贷1800万，钱打进账户后，银行却以“内部层层审批”为由，拖近两月才扣，多收10万的利息，法院：超出时间的计息，全", "b": "企业主动提前还贷1800万，钱打进账\n户后，银行却以“内部层层审批”为由，\n拖近两月才扣，多收10万的利息，法\n院: 超出时间的计息，全额返还\n齐鲁晚报             们 25人\nAl摘要\n企业主动还钱，钱都打进账户了，银行以需要内部层\n层审批\"为由一直未予扣划。近日，武汉市江汉区人民\n法院就该案作出生效判决: 某银行在超出合理审批期限\n外多计收的10万余元利息需全额返还涉事企业。\nBANRARAT (8, FRBBAS)) 是一家扎根\n武汉的高新技术企业，这家主营软件开发的专精特新企\n业，常年为能源、通信和领域的600余家客户提供数字技\n术服务，经营一直保持稳健态势。\n2023年10月，刘训公司与某银行签订《小企业授信\n务额度借款合同》，约定借款额度2800万元，用于业\n务资金周转。借期最长为一年，年利率为3.4% ，提前\n还款须经贷款人审批。2024年10月至11月，该公司提\n取全部2800万元借款额度，某银行依约共分16笔将贷\n款发放到位，期限均为一年。\n2025年下半年，随着项目回款集中到账，讲讲公司现\n金流变得宽裕，管理层第一时间就想到了提前归还部分\n“第一次提前还款的流程特别顺畅，我们达成共识后当\n天便把资金转进去，第二天银行就完成了扣收。”赛讲\n公司相关负责人表示。\n正是基于这次顺利的合作体验，双方很快敲定了剩余\n1800 万元贷款本息于8月提前结清的方案。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【5】"}, {"n": 11, "t": "11块买套房", "b": "浙江一男子花11元拍走黑龙江准岗一套60多平房屋，拍卖公司: 买\n家还需支付2000元左右契税，不是法拍房，房屋市价4万多\n您关心的 。\n就是江苏新闻关注的\n11月5日，一套位于黑龙江礁元的房产在拍卖平台以11元拍出，引发关注。\n11月5日，拍卖公司刘经理告诉记者，这套房子原价4万多元，是平台搞的\"双十一活动，\n除了11元的购房费用，买家还需要支付两千元左右的契税，再无其他费用。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【11】"}, {"n": 24, "t": "日本卫生劳动部星期五（11月6日）公布的最新数据显示，9月份名义工资同比大幅攀升4.6%，创下近30年的最大增幅。", "b": "日）公布的最新数据显示，9月份名义工资同比大幅攀升4.6%，创下近30年的最大增幅。\n强劲的薪金增长数据进一步印证日本正逐步摆脱长达数十年的通缩与工资停滞怪圈。市场普遍预期，这将为日本中央银行于12月上调基准利率铺平道路。\n据彭博社报道，官方统计显示，日本9月份基本工资增长3.7%；在剔除花红、加班费及样本扭曲因素后，全职员工的工资更录得3.1%的创纪录涨幅。此外，扣除房租影响后的实际现金收入同比增2.2%，较8月份修正后的1.6%增幅进一步提速，远超经济师此前预估的1.3%。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【24】"}], "soc": [{"n": 1, "t": "#多方回应保定一在建大桥坍塌#11月7日，有多位网友在短视频平台发布消息，称河北省保定市南三环沧榆高速段的高架桥发生垮塌，现场疑", "b": "11月7日，有多位网友在短视频平台发布消息，称河北省保定市南三环沧榆高速段的高架桥发生垮塌，现场疑有人员受伤。\n视频显示，通车的路段上方有桁架桥坍塌到路面，桥体钢结构发生变形，现场可见有车辆受损，其中一辆红色货车车头变形严重，路面散落碎片，道路通行受阻。\n视频拍摄者称事发地为河北省保定市南三环沧榆高速段，倒塌的桥体钢结构为正在建设的南三环，现场疑有人受伤。\n11月7日13时许，新黄河记者致电辖区交警大队，工作人员表示，目前高速路段还没有通车，桥还在路上塌着，在等吊车处理。保定市应急管理局工作人员表示，刚发生的事情，工作人员已前往现场处置，是否有人员受伤还在核查中。\n公开信息显示，南三环作为保定市重点民生工程、城市路网提质升级核心项目，南三环项目起点位于南二环与东三环交叉处，途经莲池区、清苑区，终点对接西三环南延路段。该路全长21.8公里，按照双向六车道一级公路标准建设。项目采用分段建设模式，其中莲池区段2.1公里，清苑区段19.7公里，全线涵盖道路、桥梁、绿化、交安、照明等配套工程，建成后将极大完善保定南部主干路网体系。截至11月5日，南三环还在建设中，全线贯通已进入倒计时。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【1】"}, {"n": 4, "t": "5名子女2001年约定每月给父母20元赡养费，20多年后已难维持，年过七旬的老夫妻起诉要求“涨价”；法院：子女每人每年支付700", "b": "5名子女2001年约定每月给父母20元购\n养费，20多年后已难维持，年过七旬的\n老夫妻起诉要求“涨价”; AR: 子女每\n人每年支付7000元\n成都日报 202    7       QREX\nAl摘要\n一纸分家协议定下每月20元购养费，时隔二十余年，\n物价、医疗支出早已今非车比。\n近日，一起购养纠纷在四川广安法院宣判: 一对年过\n七旬的老夫妻，因早年约定的峰养费用难以维持生活\n就医所需，将五名子女诉至法庭。广安法院在尊重原\n有家庭约定的基础上，结合现实情况上调购养费，以\n司法力量守护孝老美德。\n王某某、夏某某夫妇今年均已七十有余，一共养育五\n个子女。早在2001年，一家人签下分家协议，约定四\n个儿子每人每月给付购养费20元。\n寺光流转二十余载，二老年岁渐长，常年饱受慢性病\n困扰，日常用药、就医开销不断增加。伴随着物价持\n续上涨，当年定下的购养费早已不足以支撑基本生\n活\n五名子女虽都具备赂养能力，却就购养费标准无法达\n成一致，无奈之下，二老走上法庭。\n承办法官审理后认为，当年的分家协议出自一家人真\n实意愿，应当予以尊重，但购养义务并非一成不变。\n购养费标准应当结合老人实际需求、健康状况、当地\n生活水平以及子女经济条件动态调整，不能固守多年\n前的旧约定。\n综合各项因素，广安法院依法作出判决，五名子女自\n2025年起，每人每年向两位老人支付购养费七干余\n元。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【4】"}, {"n": 7, "t": "招老师不发工资，还要求全日制普通院校本科以上学历，学校提供跟岗位及教育教学资源，无薪酬待遇…… 校方：考虑不周全，已停止招募，未", "b": "11月4日，山西省太原市万柏林区育华小学发布招\n募跟岗教师信息，引发关注。招聘信息显示，该岗\n位从社会招募，无薪酬，食宿需自理。\n潇湘晨报晨视频记者注意到，招募信息显示，跟岗\n教师岗从社会招募人员，并非在校生实习项目。被\n招募者需取得本科及以上毕业证、学位证，拥有小\n学及以上教师资格证等证书，日常参与备课、磨\n课、班级管理、课后服务、校园活动组织等工作，\n招聘岗位涉及语文、数学、英语等。\n小      主要工作内容\n参与备课、听课、磨课、试教、作\n业批改、班级管理、课后服务、校园活\n动组织等教育教学相关工作。\nws\ny           待遇与保障\n无薪酬待遇。\n2.跟岗期间须遵守学校各项管理制度。\n5 。\n但由于他年龄偏大，被嫌弃“不好转手卖掉”，当成搭售赠品流转。到了园区后他被逼背数百页诈骗话术，不愿配合就遭受殴打。好在他学过四年中医，靠给园区老板把脉看病，才减少了皮肉之苦。\n最终，他姐姐赶往泰国多方奔走求助，联系使领馆和当地警方，同时借助网络舆论施压，最终花费三十多万通过救援队赔付给园区，刘修洪才被园区释放。\n@蘸盐:回国也不一定安全。建议管住嘴巴，少揭批电诈。要不然被跨境盒出住址和生活轨迹，被跨境买凶定点清除了，凶手最多判个死缓，“他不过是把你踢晕抛弃野外，你自己高血压也要负次要责任”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【3】"}, {"n": 14, "t": "美国总统特朗普在美俄乌三方会谈临近之际会见俄总统特使德米特里耶夫，并称解决俄乌战争的相关协议有望很快达成，而且可能涵盖整个欧洲。", "b": "临近之际会见俄总统特使德米特里耶夫，并称解决俄乌战争的相关协议有望很快达成，而且可能涵盖整个欧洲。德米特里耶夫早前在白宫参加由美国第一夫人梅拉尼娅主持的会议，俄乌两国代表罕见面对面会谈；之后，特朗普临时闭门会见德米特里耶夫，但并未与同在白宫的乌方代表会面。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【14】"}, {"n": 15, "t": "美国民主党在中期选举大获全胜，过去两年受益于特朗普政府支持的人工智能产业，恐将面临更严格的监管。其中，数据中心扩建计划首当其冲，", "b": "过去两年受益于特朗普政府支持的人工智能产业，恐将面临更严格的监管。其中，数据中心扩建计划首当其冲，全美约一半的拟议扩建规模可能受到更严厉的审查。据彭博社报道，原本被科技企业视为投资理想地点的得克萨斯州和俄亥俄州，在这次中期选举后均将由民主党州长主政。随着民众日益担忧数据中心大量耗水耗电、推高电费，新任州长可能收紧审批，甚至暂停新项目建设。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【15】"}, {"n": 16, "t": "美国民主党正筹划在明年掌控国会后，推动撤销特朗普政府的部分关税措施，首个目标是取消对加拿大商品加征的关税。", "b": "后，推动撤销特朗普政府的部分关税措施，首个目标是取消对加拿大商品加征的关税。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【16】"}, {"n": 17, "t": "美国共和党在中期选举中痛失国会两院控制权后，党内随即掀起互相指责的浪潮，而矛头主要指向特朗普政府。总统特朗普的盟友和政治策略师纷", "b": "两院控制权后，党内随即掀起互相指责的浪潮，而矛头主要指向特朗普政府。总统特朗普的盟友和政治策略师纷纷呼吁他改组白宫人事并重整纪律，同时放弃伊朗战争和关税等被认为导致了此次惨败的政策。\n资深共和党策略师费赫里形容，本届中期选举结果对特朗普来说是巨大的灾难。费赫里告诉路透社：“他需要彻底整顿白宫。从现在开始的每一天，他会越来越像跛脚鸭。”\n一些党内元老也公开抨击共和党。得克萨斯州参议员科宁在《华尔街日报》发表评论，批评共和党犯下一连串原本可避免的政治错误，包括支持丑闻缠身的帕克斯顿在初选中挑战他，并最终代表共和党竞选得州参议员。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【17】"}, {"n": 18, "t": "中期选举大败后川总开铡的第一人是自己的幕僚长苏珊苏茜・怀尔斯。继任者是斯蒂芬・米勒，他是少数仍在位的一任幕僚，也是一号亲信。此前", "b": "是自己的幕僚长苏珊苏茜・怀尔斯。继任者是斯蒂芬・米勒，他是少数仍在位的一任幕僚，也是一号亲信。此前下台的国安部长曾公开表示她都是按川总和米勒的指示做事。\n白宫最后一个正常人苏西怀尔斯也走了，更加右翼极端的米勒当上了白宫大总管", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【18】"}, {"n": 19, "t": "原先表明会接受中期选举结果的美国总统特朗普改口，转而抨击选举舞弊。但随着民主党的胜利势头持续扩大，多数评论认为特朗普即使不接受选", "b": "国总统特朗普改口，转而抨击选举舞弊。但随着民主党的胜利势头持续扩大，多数评论认为特朗普即使不接受选举结果，也无法掀起波澜或逆转局面。目前，连密西西比州都出现民主党可能赢得参议院席位的爆冷情况。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【19】"}, {"n": 20, "t": "美国因田纳西州死刑犯Christa Pike处决失败，使死刑问题再度受到关注之际，加州州长纽森（Gavin Newsom）5日宣", "b": "ta Pike处决失败，使死刑问题再度受到关注之际，加州州长纽森（Gavin Newsom）5日宣布对该州所有死刑犯全面减刑，将548名死囚的刑期改为终身监禁且不得假释。#加州对所有死刑犯减刑#\nCNN报道，正考虑角逐2028年白宫大位的纽森在一封致加州居民的公开信中表示，「我今天的决定是在我身为民选官员，公开反对国家实施死刑近30年后做出。」加州是全美死刑犯人数最多的州，上次执行至今已经过20年，纽森早在近8年前宣布暂停执行死刑。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【20】"}, {"n": 21, "t": "世界卫生组织估计，全球有四分之一11至17岁的青少年几乎不进行任何体育活动，每周运动时间甚至不足一小时。世卫警告，这会显著增加健", "b": "一11至17岁的青少年几乎不进行任何体育活动，每周运动时间甚至不足一小时。世卫警告，这会显著增加健康风险。\n世卫星期三（11月4日）在《柳叶刀全球健康》发表的研究报告，汇集140个国家和地区的数百项人口调查，涉及超过320万名青少年。\n每四名11至17岁的青少年中就有一人说，在过去一周内没有任何一天达到活跃标准，即进行至少60分钟中等至高强度的体育活动。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【21】"}, {"n": 22, "t": "驻日本冲绳美军星期五（11月6日）宣布，将对全体驻冲绳美军人员实施的宵禁措施延长一个月，直至12月7日，延长措施适用于低军衔军人", "b": "日）宣布，将对全体驻冲绳美军人员实施的宵禁措施延长一个月，直至12月7日，延长措施适用于低军衔军人。\n今年10月初，冲绳县那霸市发生一起美军士兵涉嫌抢劫杀害一名日本女性的案件，涉事美军士兵随后被警方逮捕。事件发生后，驻冲绳美军宣布，从10月9日起实施为期30天的宵禁，并加强对军事基地出入口的监控。\n共同社报道，根据宵禁规定，所有驻冲绳美军人员不得在每日零时至凌晨5时外出。然而，在宵禁措施生效期内的10月31日凌晨，一名美国海军陆战队士兵因涉嫌酒后驾车被逮捕。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【22】"}, {"n": 23, "t": "美国总统特朗普推动的巨型凯旋门计划，星期四（11月5日）获国家首都规划委员会以8票对4票通过，但一名联邦法官星期五（6日）凌晨随", "b": "计划，星期四（11月5日）获国家首都规划委员会以8票对4票通过，但一名联邦法官星期五（6日）凌晨随即颁令，禁止政府在14天内动工。\n凯旋门高76米，拟建于弗吉尼亚州阿灵顿国家公墓的附近。建成后，凯旋门将比不包括基座的自由女神像高出约30米。\n反对者认为，这座拱门规模过于庞大，与周边天际线格格不入，也会破坏首都地区多处地标之间经过精心设计的视线景观，尤其是林肯纪念堂与阿灵顿国家公墓之间的视线。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【23】"}, {"n": 25, "t": "布林肯在中期选举结果出来后，这位前国务卿在社交账号上写了一段话。他说，“美国人在国际上怎么行事，最终会原封不动地落到自家餐桌上。", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【25】"}, {"n": 28, "t": "美国科技行业持续流失就业岗位：上个月整体就业人数减少了9000人，过去一年累计减少了7.3万人。岗位减少的状况已接近2024年科", "b": "400 否认干扰与公司有关。其客服人员直称，公司正常在爱奇艺平台上投放广告，至于如何操作这个广告，则并不清楚，因此建议咨询平台方。\n而随着事件发酵，奇异果客服回应声称，会员在广告方面的特权主要是减免观看点播内容前的部分贴片广告，此次出现的内容属于“弹幕广告”，不包含在会员广告权益内。该客服表示，平台会管控商业弹幕出现的数量和频率，后续将持续优化产品体验，如果用户遇到上述广告，可按遥控器返回键、拖动进度条或进行屏蔽操作。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【6】"}, {"n": 8, "t": "张艺谋导演认为AI等新技术带来的一个最明显的改变就是─技术平权，AI等新技术让普通人动手拍一部电影变得容易。", "b": "的一个最明显的改变就是─技术平权，AI等新技术让普通人动手拍一部电影变得容易。\n短视频/短剧/AI漫剧对观众的精力争抢很厉害，张艺谋导演在出行途中飞机场/高铁火车站经常能看到大姐一直在刷短视频/短剧/AI漫剧，所以新一代的导演面临的挑战也很现实，如何用电影争夺观众的精力，是坚持“手搓”拍电影还是用AI制作长片。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196614#:~:text=【8】"}]}}, {"date": "20261108", "label": "11月8日", "week": "周日", "id": "196623", "title": "星空与圆月是公平的，它会一直陪着抬头望见月亮的人", "cats": {"econ": [{"n": 10, "t": "你在哪个格子呢？", "b": "一同房房租占收入(% )\n你的城市，把你放在哪个格子里\n100 个城市.月薪和房租一交叉，分成四种活法\n咬牙硬撑          | 给房东打工\naR £5000 - 15         ‘I >5000- Wal >15%-17 98\nao \u003c9: 2088       ;\n少\nao            “00            5000            000\n月可支配收入(元/月)\n|B 5000-9 :15% 26 98", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【10】"}, {"n": 21, "t": "日本首相高市早苗在年初众议院选战中承诺的食品消费税减税方案，星期五（11月6日）终于在众院获得通过。法案的核心内容是，从2027", "b": "战中承诺的食品消费税减税方案，星期五（11月6日）终于在众院获得通过。法案的核心内容是，从2027年4月起，两年内将食品消费税率从目前的8%降至1%。政府也计划为中低收入受雇者提供补助金配套，以缓解通胀带来的生活压力。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【21】"}, {"n": 22, "t": "“黄金时代”是骗局", "b": "40%\nUS real GDP growth\n3.5% |\n3.0% | 2.9%        3.0%                         Goldman Sachs\nEconomics forecast\n25%                                           2.3%        2.4%\nS         e\n2.0%                             ea |  | 2.2%\n18%                                 Con en us\n1.0%\n0.5%                                                     |\n0.0%                                                     -\n2023        2024        2025        2026        2027\nSource: Bloomberg, Goldman Sachs Global Investment Research", "href": "https://www.dapenti.com/blog/more.asp?name= 元（约2565万新元），征集有关伊朗核计划的情报。与此同时，美军对伊朗发动新一轮军事打击。\n美军中央司令部在社交媒体平台X发文说，任何人若提供有关伊朗核设施、设备和科研人员等的情报，除了可获得高额奖金，也可获得重新安置，以确保人身安全。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【15】"}, {"n": 16, "t": "临近中期选举时，特朗普的支持率跌至执政以来的个人低点，并接近历任美国总统的最低水平，这使他对自己的政治与宣传团队感到不满。一名知", "b": "跌至执政以来的个人低点，并接近历任美国总统的最低水平，这使他对自己的政治与宣传团队感到不满。一名知情人士透露，特朗普已声言，随着民主党重新掌握国会权力，白宫须采取更具进攻性的姿态。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【16】"}, {"n": 17, "t": "白宫国家经济委员会主任哈塞特星期五（11月6日）接受彭博电视访问时说，特朗普政府的经济政策奏效，无须改变。他认为，民主党在选举中", "b": "期五（11月6日）接受彭博电视访问时说，特朗普政府的经济政策奏效，无须改变。他认为，民主党在选举中获胜并不表示选民否定特朗普的供给侧政策，这些措施让12万美国民众投入到新厂房的建设。\n哈塞特说，特朗普确实担心“他凝聚的正面动力如今可能被取得更大权力的民主党翻转”。但他相信，民主党人“要推翻创造出强劲就业市场的各个伟大政策将困难重重，因为总统将行使否决权”。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【17】"}, {"n": 18, "t": "当地时间11月7日，美国总统特朗普宣布，他已邀请美国终极格斗冠军赛（UFC）总裁达纳・怀特担任白宫新闻秘书一职。知情人士透露，怀", "b": "朗普宣布，他已邀请美国终极格斗冠军赛（UFC）总裁达纳・怀特担任白宫新闻秘书一职。知情人士透露，怀特拒绝了特朗普的邀请。\n“我很高兴地宣布，伟大的达纳・怀特，一位斗士，已被邀请担任美国新闻秘书一职。”特朗普社交媒体平台“真实社交”上发文写道。\n据美国有线电视新闻网（CNN）报道，特朗普助手称，特朗普此举只是在开玩笑。但消息发布之际，特朗普仍在寻找新的新闻秘书。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【18】"}, {"n": 19, "t": "美国民主党在中期选举中大胜，年轻选民的支持成为关键，也带动社交媒体兴起“千禧世代乐观主义”怀旧潮，让人回想起2008年奥巴马当选", "b": "轻选民的支持成为关键，也带动社交媒体兴起“千禧世代乐观主义”怀旧潮，让人回想起2008年奥巴马当选总统时的乐观氛围。\n法新社报道，紧身牛仔裤、猫头鹰项链等都是2000年代末至2010年代初的流行文化象征。如今，相关怀旧视频和贴文在社交媒体广泛传播，部分浏览量达数十万次。\n对目前18岁至29岁的Z世代而言，星期二（11月3日）的选举胜利，让他们首次感受到上一代千禧世代在2008年奥巴马当选美国总统时的兴奋情绪。\n两个世代都在美国深陷海外冲突、国内经济前景不明朗的背景下参与政治，而年轻选民也在两次选举中扮演关键角色。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【19】"}, {"n": 20, "t": "欧洲多地周五（11月6日）再接获连环炸弹恐吓，爱尔兰、英国和保加利亚的媒体机构也收到威胁电邮，显示恐吓目标可能正从民航领域扩大至", "b": "获连环炸弹恐吓，爱尔兰、英国和保加利亚的媒体机构也收到威胁电邮，显示恐吓目标可能正从民航领域扩大至其他领域 。\n往返里斯本、罗马、布拉格和索菲亚等地的11趟航班日前受到炸弹威胁，部分客机被破改道降落，匈牙利更出动战斗机护航。涉事飞机均已降落，当局至今未发现任何爆炸装置，也无人受伤。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【20】"}, {"n": 23, "t": "本月起，韩国国会正式启动明年度预算审议，文化体育观光部长官崔辉永将引入暂称“青年文化体育通行证”作为政府草案的“核心课题”加以提", "b": "预算审议，文化体育观光部长官崔辉永将引入暂称“青年文化体育通行证”作为政府草案的“核心课题”加以提及。\n据政界2日消息，崔长官前一天通过题为《文化现场的声音，将努力纳入明年度预算》的Facebook文章介绍称：“这是一项旨在扩大经济困难青年群体享受文化的机会，帮助青年成长为能动性文化消费主体的制度。”\n崔长官特别强调：“将从明年起每年向19~34岁所有青年发放补贴，首都圈居民10万韩元、非首都圈15万韩元，可用于演出、展览、电影、图书等文化领域以及体育观赛”，“同时加强各文化艺术领域的创作与制作支持，帮助艺术家更频繁地登上舞台，并细致反映旨在缩小地区间文化差距的各类定制化项目。”\n崔长官还表示：“明年预算案中投入最大力度的部分是构建‘艺术人社会安全网’。”他说明称：“为使自由职业艺术人也能享有与普通职场人水平相当的稳固安全网，相关预算从今年的345亿韩元大幅增至明年的966亿韩元”，“具体而言，工伤保险支持对象从今年的4400人大幅扩大至3.9万人，保险费支持比例也从50%提高至全额（100%）。”\n接着他表示：“国民年金支持对象和综合健康体检支持范围也将扩大，艺术人生活稳定资金和全租资金贷款预算也一并增加。”\n崔长官表示：“还准备了用于进一步推动风靡全球的K文化全球扩散的预算”，“将以文化艺术政策咨询委员会传达的现场迫切声音为指南针，为让艺术人、创作者以及全体国民都真正需要的明年度预算在国会获得通过而竭尽全力。”\n此前，文体部于9月3日编制并向国会提交了总规模9.6345万亿韩元的2027年度预算案，其中包括内容政策金融2.2万亿韩元、青年文化体育通行证7925亿韩元等。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【23】"}, {"n": 24, "t": "一名朝鲜脱北者称，自己17岁抵达韩国后，", "b": "一名朝鲜脱北者称，自己17岁抵达韩国后，\n第一次接触自由，竟然一度想回朝鲜。\n“他们给我做了分班测试，我发现自己需要\n和7岁的小孩一起学习。我甚至不知道什么\n是大洲，也不知道非洲在哪里。”\n在韩国的适应中心，她从零开始学习使用\nATM、乘公交车、坐电梯。\n“我真的以为，ATM里面有人在把钱递给\n你。当你去购物时，有10条不同的裤子可以\n选择。而在朝鲜，是政权蔡你作决定。自由\n很难。我当时甚至想，只要有最基本的食物\n吃，我就愿意回朝鲜。”\nRogan 惊讶地问她为什么。\n“因为我不习惯思考。思考对我来说很难。\n我以前从来不需要自己思考。你就不能直接\n告诉我该做什么吗?”因为我非常擅长服从命\n> ”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【24】"}, {"n": 25, "t": "特朗普政府官员斯蒂芬・米勒的舅舅大卫・格洛瑟接受美国有线电视新闻网采访时，批评米勒在移民问题上虚伪。他指出，米勒家族正是依靠亲属", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【25】"}, {"n": 27, "t": "少谈点主义，多谈点民生", "b": "RAR Oo           X.com\neee ©ChineseWSJ\nShow translation\nHAE RUS 在这场对特朗普构成重大挫败的中期\n选举中，民主党赢得了国会两院控制权、过半数\n州的州长职位等诸多胜利。在此过程中，该党做\n到了多年来一直难以做到的一点: 统一竞选主\n张，聚焦生活成本问题。\nFrom cn.wsj.com", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【27】"}], "tech": [{"n": 5, "t": "这款神奇的戒指名为Brainkey即沃智能指环，微信小店相关链接显示其价格为2699元，相关简介中写道该戒指可“重塑平衡本能，脑", "b": "ey即沃智能指环，微信小店相关链接显示其价格为2699元，相关简介中写道该戒指可“重塑平衡本能，脑科学研究转化高级复合微磁材料，辅助前庭系统平衡感知和神经信号传导，助力身体平衡协调表现”。不过该产品被不少人质疑缺乏科学依据。猎豹移动董事长傅盛发视频公开质疑该指环，并称“江湖骗术层出不穷”。\n 00%", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【31】"}, {"n": 31, "t": "骑桶人 · 《持械入宋》也不准用真实朝代名了。", "b": "《持械入宋》也不准用真实朝代名了。\n不准用真实地名、人名、朝代名，以及使用各种网络用语替代一些禁用字，这是真正的历史虚无和文化虚无主义。这是大问题，大家想一下，再过二十年，三十年，五十年，还有人能弄明白这些代称和隐语的本义吗？更不用说一两百年了。当代人所创造的文化将无法进入文化史中，无法成为中华文明的一部分，而当代史也将因为语言的错位和难解而消散。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196623#:~:text=【31】"}]}}, {"date": "20261109", "label": "11月9日", "week": "周一", "id": "196653", "title": "她不一样，她懂显卡", "cats": {"econ": [{"n": 2, "t": "经国务院批准，自2026年11月10日13时01分起，在2个月内继续暂停实施24%的对美加征关税税率，保留10%的对美加征关税税", "b": "中华人民共和国财政部                       关税司\nMinistry of Finance of the People's Republic of China                                     [人力公主)\nOm: 首页>政策布下和六伯\n国务院关税税则委员会关于调整对原产于美国的进口商品加征关税措施的公告\n税委会公告2026年第6号\nNGS SMELT EAMONN, RAE 《中华人民共和国关税法》、世中华人民共和国竹关法》》、世中华人民\n共和国对外贸易法》等和健生灿和国际法基本原则，经国务院批准，自2026年11月10日 NO, HT 《国务院关种税风委员会\n关于对原产于美国的进口商品加征关税的公告》《笠委会公告2025年第4号 ) AEM. Ee ARREST MOORE\n对美加征关税税幸，保留10的对美加征关税税车.\nRae\n20205 1S", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【2】"}, {"n": 3, "t": "2026年10月，中国CPI同比0.7%，预期0.8%，前值0.9%;中国PPI同比5.7%，预期5.4%，前值5%。PPI和C", "b": "比0.7%，预期0.8%，前值0.9%;中国PPI同比5.7%，预期5.4%，前值5%。PPI和CPI剪刀差为5%，较上月扩大了0.9个百分点。\nPPI创近几年新高，加上人民币升值，用更高的价格出口到海外市场，赚取更多外汇，今年贸易顺差要突破历史新高了。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【3】"}, {"n": 5, "t": "云南省代省长刘奇凡，到企业现场征集工作建议和需求清单：各级政府要积极主动向企业请教、请企业支招", "b": "23:21                          Pa\n\u003c\n云南省代省长刘奇几，到企业现\n场征集工作建议和需求清单: 各\n级政府要积极主动向企业请教、\n请企业支招\n政事儿\n们 18人 Al摘要", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【5】"}, {"n": 6, "t": "中国启动对3万座寺庙财务大检查", "b": "中国启动对3万座寺庙财务大\n检查\n十关注\n一场覆盖全国3.35万座寺院、9000余座道\n观的财务大检查已全面铺开，矛头直指缠\n绕宗教场所多年的商业化。\n这不是一次例行的账目核对，而是一次对\n“寺庙究竟是道场还是生意\"的大追查。\n企业或个人承包经营寺庙、以分红提成方\n式介入场所运作、将宗教场所打包进商业\n资产，这些行为在法规层面早已被禁\n但在地方执行端，监管的放松曾为资本留\n下了余地。\n此次检查明确要求，已承包的必须清退，\n上市融资的通道必须切断。与之同步收紧\n的，是场所内部的财务透明度，年收入达\n到一定规模的场所须引入第三方审计，功\n德箱与电子收款统一归口，住持亲属不得\n参与经营，收支须定期向信众公示。\n打开网易新闻 查看更多图片 >\n检查不仅查账，还查教职人员的对外投资\n与持股情况、社交媒体账号背后的商业关\n联。\n当一位僧人的身份同时到加上公司股权持\n有者和网络意见领袖的角色时，宗教身份\n与商业身份的边界便已模糊到无法自我澄\n3s\nIB o\n将这条链条上的每一个节点建档留痕，意\n味着治理的对象从孤立的场所账目，扩展\n到了以信仰为资源、以人情与股权为纽带\n的隐性利益网络。\n推动这场检查的力量，来自积累多年的公\n众不满与治理滞后之间的落差。\n名山古刹被承包后僧人沦为\"员工”、头香\n拍出天价、假僧假道拦路敛财，这些现象\n反复消耗着信众的善意。\n信众捐出一百元是出于自愿的护持，被诱\n导扫", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【6】"}, {"n": 9, "t": "据21世纪经济报道消息，11月5日至10日，第九届中国国际进口博览会在上海举行。会上，一系列重磅科技亮相。上海微电子装备集团携自", "b": "5日至10日，第九届中国国际进口博览会在上海举行。会上，一系列重磅科技亮相。上海微电子装备集团携自主研发的新一代前道干式扫描投影光刻机SSC800、SSB800（模型）亮相中国馆，展示我国前道光刻装备自主化的阶段性成果。据悉，目前国产前道干式光刻机成像性能已与国际同类领先产品水平相当，套刻精度、生产效率紧密追赶国际标杆。在售的SSC800系列KrF与SSB800系列I-line机型，基于自研双工件台平台，均搭载国产自主大NA物镜，关键曝光成像指标对标国际标杆。SSC800整体性能跻身行业第一梯队。基于全栈自主可控技术底座，关键零部件国产化率突破90%，已实现定型与规模化量产，填补国内空白。多台设备已在国内头部逻辑、存储量产线长期稳定运行，累计支持产线流片超千万片，设备有效运行率超92%。（21世纪经济报道）", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【9】"}, {"n": 22, "t": "Cybertruck 居然这就停产了，特斯拉要把产能让给无人驾驶出租车Cybercab。这款曾被寄予年销25万辆期望的皮卡，实际", "b": "» @elonmusk\nq  | Elon Musk @ B                            订阅 )\nS FA Grok 翻译自英语\n特斯拉将于明年年中左右在德克萨斯超级工厂逐步减\n少Cybertruck的生产，以腾出空间增加Cybercab的生\nine\n评价此翻译: ob FD\n10:30 - 2026/11/6 .287万 次查看", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【22】"}, {"n": 29, "t": "黄仁勋当时还有一个「私心」，这是他在和Lex Fridman吃饭时说的，上大学时自己经济比较拮据，所以经常蹭Lori Mills", "b": "是他在和Lex Fridman吃饭时说的，上大学时自己经济比较拮据，所以经常蹭Lori Mills的生活费打游戏⋯⋯\n他俩在毕业5年后结婚，还一起进了一家3D绘图公司，但在生了孩子之后，因为找不到合适的托管，Lori Mills就离职当了全职家庭主妇，后来就是黄仁勋创办英伟达的故事了。\nLori Mills早年曾给自己设定过一张人生计划表――「22岁工作、25岁结婚、30岁生孩子」――她也差不多实现了这个愿望，当然结婚40年后丈夫劈腿这个计划很显然没被考虑进去过。\n根据信托安排，黄仁勋所持英伟达股份绝大部分都是夫妻共同持有，所以如果离婚都不需要涉及到分割财产，她在字面意思上就是800多亿美金的资产身价，可以直接空降全球女性富豪榜Top 3。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【29】"}], "soc": [{"n": 1, "t": "记者从山西省相关部门获悉，山西太原市迎泽区柳巷街道豪生国际公寓火灾已致14人死亡。11月8日16时59分，该公寓发生火灾。", "b": "太原市迎泽区柳巷街道豪生国际公寓火灾已致14人死亡。11月8日16时59分，该公寓发生火灾。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【1】"}, {"n": 7, "t": "北京励骏酒店停业，改为养老院。", "b": "又一家北京的五星级酒店倒闭。\n北京励骏酒店宣告停业，改为养老院。很多外地的朋友\n可能不入\n道励骏酒店有多厉害。\n这家励骏酒店，是北京奥运会接待外宾的酒店，地处长\n安街北例\n黎欧式风格。妥受的豪华五星级酒店，为什么倒闭了\nNe? 原因\n很多。\n现在这栋楼被平安人寿拿下了，用于做高端养老院。你\n有没有发现，这是皇城根最\n近有北京\n要的地段，附近的资源极\n说明养老特别看重周边的配套资源。金宝街附\n各大医院、各大高端医疗。可惜了，励骏酒店\n刚建成 18 年，就宣告破产了。\n@ 地点\n北京励骏酒\n=p}", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【7】"}, {"n": 10, "t": "近段时间，一位来自江苏的90后村医在网上发了一张医院的宣传标语，在网上引发热议。该标语写道：“如果你有任何不满意，请不要骂老村医", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【10】"}, {"n": 12, "t": "据看看新闻11月9日消息，张雪机车在米兰展出，机油盖、水箱盖、油箱盖，能拆的全被薅走了，零件被偷，连油箱锁、后视镜都没放过。", "b": "机车在米兰展出，机油盖、水箱盖、油箱盖，能拆的全被薅走了，零件被偷，连油箱锁、后视镜都没放过。\n张雪之前还提醒别的中国展商：“你要注意下，周末两天的时候0元购很多，像你这种没带锁的，可能一下就给你摸走了。”\n两个月前，张雪团队的大巴还在意大利被偷，6名成员的背包被盗，1人护照丢失，连车手签名照也丢了，报警至今没有回应。\n从大巴到展车，张雪团队在意大利接连被偷。网友感慨：还是国内治安好，素质高。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【12】"}, {"n": 19, "t": "柬埔寨加紧打击电信网络诈骗活动，在过去一年多的时间里，取缔了972个据点，并遣返2万3760名涉案外籍人员。", "b": "在过去一年多的时间里，取缔了972个据点，并遣返2万3760名涉案外籍人员。\n新华社报道，柬埔寨打击网络诈骗委员会星期六（11月7日）发文告，宣布上述在2025年7月至今年10月间的打击电诈成果。\n在这些大规模执法行动中，当局吊销了18家赌场的营业执照，并暂停另外10家赌场的执照。共有5032名嫌犯被起诉，目前处于审前羁押状态。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【19】"}, {"n": 23, "t": "戈培尔来了", "b": "Wi  ex                      STEPHEN MILLER\nDEPUTY CHIEF FOR POLICY AND HOMELAND SECURITY ADVISOR", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【23】"}, {"n": 26, "t": "她不一样，她懂显卡", "b": "小黄到底哪里好\n看了小黄照片，长相平平呀，怎么就拿下黄仁勋\n呢?\n我们看看她的经历 :\n1) 4年媒体。\n她简历上写着在湖南卫视、央视当过记者，攒了约4\n年媒体资历。后来湖南卫视回应没听过这个人。但\n它的功能很明确，   个高认可度的身份，拿到进\n入下一个圈子的叙事资本。\n2) 金融8年。\n她转进金融业后，先后做了汇丰私人银行总裁助\n理、某证券业务线副总裁、上海和照投资执行董\n事。私行助理让她近距离看富豪怎么运作，券商副\n总裁给了她正式身份，私募执行董事则让她开始直\n接础资本配置。8年下来，她掌握了金融圈的语言和\n人脉。\n3) 在私募阶段，她挂上了上海和四投资执行董事兼\n基金经理的头衔，并开始沾半导体和Al的边。外媒也\n质疑过: 她并没有半导体背景，却能快速进入这个\n行业担任高管。但这一步的意义在于，她把自己从\n泛金融的人，变成了芯片圈里的人。\n4) 她最终落脚在新加坡数据中心公司Megaspeed，\n担任董事总经理 (Managing Director) ，前后大约\n8个月。Megaspeed是英伟达在东南亚的大买家\n一，2024年6月到2026年2月，其马来西亚关联公司\n采购了至少48亿美元含英伟达芯片的设备。她不需\n要制造偶遇，作为英伟达头部客户的决策层，她天\n然就有商务理由跟英伟达管理层打交道。\n5) 台北国际电脑展期间，她在酒吧跟科技业高层聚\n会，当场放话“我能把Jens", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【26】"}, {"n": 30, "t": "纽约客这期封面牛逼了", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【30】"}], "intl": [{"n": 8, "t": "当地时间11月6日，欧盟委员会初步认定，TikTok推荐机制因让用户“越刷越想刷”而违反《数字服务法案》（DSA），除非TikT", "b": "初步认定，TikTok推荐机制因让用户“越刷越想刷”而违反《数字服务法案》（DSA），除非TikTok母公司字节跳动能够解决该问题，否则TikTok明年或将面临最高可达其全球年营收总额约6%的罚款。\n欧盟称，TikTok的推荐系统存在所谓的“兔子洞效应”（rabbit‑hole effect），通过持续推送同质化内容，用户越来越深陷其中、难以脱身。欧盟称，用户与某一类内容互动越多，TikTok一级入口“推荐”（For You）就会推送越多同类内容。\n欧盟的初步调查结果表明，算法设计在形成“兔子洞效应”时可能起到重要作用，“该算法利用用户互动行为信息，例如观看、点赞视频，为用户推送个性化内容。”\n欧盟举例，如果用户无休止地刷到伤感、孤独、身材外貌这类易诱发负面情绪的内容，该机制就会带来危害，对用户心理健康造成负面影响，弱势成年群体与未成年人（vulnerable adults and minors）尤其容易受到伤害，包括加重忧虑情绪、身材焦虑、降低自信，或是加剧已有的进食障碍与心理疾病。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【8】"}, {"n": 15, "t": "美国总统特朗普回应英伟达首席执行长黄仁勋涉及婚外情及外国情报机构疑云时说，黄仁勋是个“好人”，但他尚未与黄仁勋讨论有关指控。路透", "b": "行长黄仁勋涉及婚外情及外国情报机构疑云时说，黄仁勋是个“好人”，但他尚未与黄仁勋讨论有关指控。路透社报道，特朗普星期天（11月8日）说：“我没有和他谈过这件事。我只知道他是个好人，但你永远不知道究竟发生什么。我希望一切都好。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【15】"}, {"n": 16, "t": "美国国会尚未换届，总统特朗普已先发制人，指控即将接掌国会两院的民主党人涉嫌“敲诈”，并下令司法部展开调查。同时，他提拔主导强硬移", "b": "先发制人，指控即将接掌国会两院的民主党人涉嫌“敲诈”，并下令司法部展开调查。同时，他提拔主导强硬移民政策的米勒出任白宫幕僚长，也招致两党议员猛烈抨击。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【16】"}, {"n": 17, "t": "彭博社报道，俄罗斯官方机密数据遭黑客窃取，显示自2022年2月全面入侵乌克兰以来，俄方已有近40万人在战争中丧生，远高于俄罗斯政", "b": "遭黑客窃取，显示自2022年2月全面入侵乌克兰以来，俄方已有近40万人在战争中丧生，远高于俄罗斯政府公开承认的数字。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【17】"}, {"n": 18, "t": "以色列国会共有120席，组成多数政府须取得至少61席。", "b": "数政府须取得至少61席。\n根据选举结果，内坦亚胡领导的利库德集团赢得27席，是国会最大单一政党，但其联盟仅取得53席，未达过半门槛。\n埃森科特领导的正直党则赢得21席，成为第二大党。他所属的四党联盟横跨中左翼至右翼阵营，共取得48席。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【18】"}, {"n": 21, "t": "饱受物价上涨、学贷沉重与就业压力困扰的美国年轻选民，在本届中期选举中大幅转向民主党。美联社选民调查显示，与2024年总统大选比较", "b": "力困扰的美国年轻选民，在本届中期选举中大幅转向民主党。美联社选民调查显示，与2024年总统大选比较，18至29岁选民本次中期选举向众议院民主党候选人倾斜的幅度超过20个百分点，居各年龄段选民之首；曾在两年前把总统特朗普送回白宫的青年，部分改投民主党，部分放弃投票。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【21】"}], "tech": [{"n": 4, "t": "“所谓中国间谍的论调纯属捕风捉影，污蔑抹黑。”", "b": "11月9日，外交部发言人郭嘉昆主持\n例行记者会。法新社记者提问，英伟\n达CEO黄仁勋周日承认与一名女子存\n在婚外情，英伟达已对黄仁勋启动调\n查。此前，美国官员称该女子为中国\n情报机构工作。中国外交部能否就此\n事作出回应?” 这起事件是否会影响下\n周中美元首在深圳的会晤?\n对此，郭嘉昆表示: “我们此前已就\n此作出回应，所谓中国间谍的论调纯\n有外媒记者追问，这是否意味着中国\n外交部否认该女子为中国情报机构工\n作的报道?\n“所谓中国间谍的论调纯属捕风提\n影，污荐抹黑。”郭嘉昆说。\nH\n”\nANS)\n美官员称与黄仁勋婚外情女子为中\n情报机构工作，外交部回应", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【4】"}, {"n": 14, "t": "当地时间11月8日，英伟达CEO黄仁勋发布一封公司内部信，承认出轨并向妻子和家人道歉。他同时表示，愿意配合有关“国家安全问题”的", "b": "O黄仁勋发布一封公司内部信，承认出轨并向妻子和家人道歉。他同时表示，愿意配合有关“国家安全问题”的调查。英伟达董事会发布声明表示，正在调查是否有外国情报机构以黄仁勋为目标，并表达对黄仁勋的信任。\n美媒此前报道称，黄仁勋与新加坡数据中心公司Megaspeed International的前高管Alice Huang有婚外情。黄仁勋上个月接受采访时称，他与这位女士的互动是正常的商业来往，“一切都完全正常，没有任何异常之处”。\n黄仁勋声明全文：\n我欠我的家人以及你们所有人一个道歉。我对我的妻子不忠，我的行为伤害了她和我们的孩子。我的所作所为没有任何借口，我深感抱歉。\n在我的一生中，我的家人给予了我爱和支持，他们理应得到我的诚实和忠诚。然而，我却辜负了他们，破坏了我们共同建立的生活。我愿为我的所作所为和造成的伤害承担全部责任，并接受随之而来的批评。\n致我的妻子和家人：我爱你们。我知道道歉无法弥补我所犯下的错，我希望我们的家庭能够愈合，也希望随着时间的推移，我能重新赢得你们的信任。\n致我在英伟达的同事们，包括那些与我共事数十年的伙伴们、董事会成员、合作伙伴以及全球各地的股东们：你们值得我做得更好。领导英伟达是我毕生的荣幸，我的责任是为你们服务，不辜负你们的信任，但我辜负了这份责任。我将全力以赴，努力重新赢得你们的信任。\n针对新闻报道中提出的国家安全问题，英伟达董事会已启动独立调查。我支持这项调查，并将全力配合。我热爱我的国家和公司，我致力于保护英伟达并维护美国的国家安全，我为自己身为美国人而感到自豪和感恩。\n我的家人无需为我的选择承担任何责任，我本人对此负责。请尊重他们的隐私。\n英伟达董事会声明全文：\n鉴于近期有报道称英伟达首席执行官黄仁勋成为外国情报机构的目标，英伟达董事会决定启动一项独立调查。一个由独立董事组成的委员会将在外部独立律师的协助下监督此次调查。\n董事会将美国国家和经济安全置于首位，这对于英伟达及其股东的利益至关重要。尽管董事会没有理由相信国家安全或英伟达的机密信息遭到泄露，但董事会的调查将审查所有可用信息。黄仁勋全力支持此次审查，并承诺予以配合。董事会对黄仁勋及其领导团队充满信心，并将在适当的时候提供进一步的最新信息。\n英伟达美股夜盘跌近6%", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196653#:~:text=【14】"}, {"n": 20, "t": "全球人工智 porcontage points (pts).\n2000 WB 2026\n@ wors                       -Asp SE india                        -aalpte\n2000 IE 340x                   2000 557x\nED 02                         2 ED 20\n2 united kingdom        -25.4pts united states          22.8 pts\n2000 ND 30.2%                 2000 NE 30.6%\nso Be                              2 ND 10x\n© Japan                                 于 cermany", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【6】"}, {"n": 12, "t": "俄罗斯与乌克兰经美国斡旋，于阿联酋首都阿布扎比展开新一轮会谈，这是美俄乌三方自今年2月以来的首次会晤。美国呼吁俄乌与欧洲之间建立", "b": "联酋首都阿布扎比展开新一轮会谈，这是美俄乌三方自今年2月以来的首次会晤。美国呼吁俄乌与欧洲之间建立新的安全架构，以结束战争，实现长期和平。\n俄方此前表明，不希望欧洲参与阿布扎比会谈。法国则强调，若不解决欧洲安全问题，乌克兰就不可能实现持久和平，而解决这个问题需要欧洲各方参与。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【12】"}, {"n": 13, "t": "德国总理默茨星期二（11月10日）说，所有欧盟成员国都必须支持乌克兰，对基辅的支持不能被削弱。", "b": "日）说，所有欧盟成员国都必须支持乌克兰，对基辅的支持不能被削弱。\n路透社报道，默茨希望从2028年开始实施的新一轮欧盟预算能够重点增加国防开支、提升竞争力，同时确保所有欧盟成员国都支持乌克兰。去年，多个成员国不给乌克兰提供一笔新的贷款。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【13】"}, {"n": 14, "t": "美国众议院共和党人采取一致行动，投票反对针对战争部长赫格塞斯的弹劾努力。", "b": "投票反对针对战争部长赫格塞斯的弹劾努力。\n综合路透社和法新社报道，众议院星期二（11月10日）以211票赞成、204票反对的结果，将赫格塞斯弹劾动议移交给由共和党掌控的众议院司法委员会审议。\n【赫格塞斯抨击对其弹劾是“一场闹剧”】这是赫格塞斯自今年5月以来首次在五角大楼举行新闻发布会。他说，此前针对美国总统特朗普的弹劾尝试均以失败告终，并补充说：“这一次也会失败。”\n他还说：“这不是爱国主义，而是蓄意破坏。”\n谈及美伊战争，赫格塞斯说：“我支持我们开展的每一项军事行动。我为执行这些行动感到自豪，而且如果有需要，我明天还会再次这样做。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【14】"}, {"n": 15, "t": "美国总统特朗普说，联邦调查局正对英伟达首席执行官黄仁勋婚外情事件展开调查。美国国会两党议员要求获得更多相关信息，以评估这起间谍疑", "b": "对英伟达首席执行官黄仁勋婚外情事件展开调查。美国国会两党议员要求获得更多相关信息，以评估这起间谍疑云对国家安全可能构成的威胁。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【15】"}, {"n": 16, "t": "日本在二战末期曾遭受广岛和长崎原子弹轰炸之害，战后出于和平主义立场出台了“无核三原则”，即不拥有、不制造、不引进核武器。然而，日", "b": "原子弹轰炸之害，战后出于和平主义立场出台了“无核三原则”，即不拥有、不制造、不引进核武器。然而，日本执政联盟自民党与日本维新会于星期二（11月10日）召开会议，在商讨年底修订《国家安全保障战略》时，以周边核威慑等安保形势日益严峻为由，讨论松绑三原则。\n消息指出，自民党虽对全面松绑持慎重态度，但正考虑在“例外情况”下放宽“不引进”原则，即允许搭载核巡航导弹的美国核动力潜艇入驻。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【16】"}, {"n": 17, "t": "正在日本访问的越南国家主席苏林星期一（11月9日）同日本首相高市早苗举行会谈。双方签署核能合作备忘录，计划于2040年后在越南建", "b": "星期一（11月9日）同日本首相高市早苗举行会谈。双方签署核能合作备忘录，计划于2040年后在越南建设新一代核反应堆。到时，越南将成为东南亚首个采用日本核能技术的国家。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【17】"}, {"n": 22, "t": "尽管美国总统特朗普此前表态愿意接受中期选举的结果，但共和党惨败失去国会两院控制权后，他改口再次抛出并无根据的“选举舞弊”指控。", "b": "接受中期选举的结果，但共和党惨败失去国会两院控制权后，他改口再次抛出并无根据的“选举舞弊”指控。\n他写道：“有一些提前投票的‘灌票’数量庞大到根本没法赢，不管多少人出来投票都没用。全都是机器在搞鬼，机器可比选民重要多了！”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【22】"}], "tech": [{"n": 2, "t": "数据显示，这家公司的财务规模在2024年出现巨大变化，总资产短时间内暴增。超速国际曾是英伟达的客户。这家公司此前因涉嫌协助中国获", "b": "2024年出现巨大变化，总资产短时间内暴增。超速国际曾是英伟达的客户。这家公司此前因涉嫌协助中国获取受美国出口管制的先进人工智能（AI）晶片，受到美国当局关注。\n彭博社星期二（11月10日）引述消息人士报道，新加坡警方曾扣留黄乐问话，并限制她离开新加坡。\n黄乐（Alice Huang）是谁？她老公又是谁？ 据《财新网》的报道，黄乐是黄仁勋的绯闻对象，黄乐的老公叫康伟，二人共同主导和熙投资；康伟因涉操纵上市股票被上海公安采取刑事强制措施。\n《财新网》 今天报导指出，黄乐于2008年步入金融行业，先后任职汇丰（香港）私人银行部、中信证券金融市场管理委员会证券金融业务线担任初级职位，履历不显。转折发生于2015年11月，30岁出头的黄乐摇身一变成为「和熙投资」的内核股东、高层，职业生涯自此推开了另一扇大门。\n2025年初，黄乐与康伟向中国投资人寻求投资，计划在东南亚兴建一座大型数据中心，两人保证「绝对有办法拿到辉达（Nvidia）绘图处理器（GPU）」，还说阿里巴巴也是该计划的客户之一。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【2】"}, {"n": 18, "t": "Anthropic 拟发行 825,000,000 股A类普通股。其中新发行 801,351,354 股，部分现有股东出售 23", "b": "25,000,000 股A类普通股。其中新发行 801,351,354 股，部分现有股东出售 23,648,646 股。\n预计本次公开发行价格区间为每股 70 美元至 78 美元，最高将募集 644 亿美元，IPO 的目标估值最高为 1.02 万亿美元，低于此前市场预期。\nAnthropic 还将通过一项独立的私募配售交易，向谷歌、英伟达、AMD、博通、美光科技、微软和台积电等基石投资者募集 260 亿美元。\n计入基石投资后，Anthropic此次发行的募资总额最高将达 904 亿美元。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【18】"}, {"n": 19, "t": "挪威驻巴西利亚大使馆星期一（11月9日）宣布，挪威将向巴西亚马逊基金捐赠约3亿5000万雷亚尔（约8140万新元），以肯定全球最", "b": "1月9日）宣布，挪威将向巴西亚马逊基金捐赠约3亿5000万雷亚尔（约8140万新元），以肯定全球最大雨林亚马逊雨林的森林砍伐率出现“历史性下降”。\n路透社报道，巴西国家空间研究院上个月公布的数据显示，截至今年7月的12个月内，亚马逊雨林的森林砍伐面积降至有记录以来的最低水平。\n挪威大使馆在声明中说，这笔捐款是基于巴西取得的成果，也进一步巩固了两国的长期合作关系。\n挪威气候与环境部长奥斯兰在声明中说：“巴西取得的成果令人瞩目，不仅对巴西，对全世界也具有重要意义。”", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【19】"}, {"n": 24, "t": "感觉比绿卡严格", "b": "DY Anthropic 改白名单制: 中国大陆及港澳不在名单\n内，11 月 12 日生效\nAnthropic 发布《支持地区政策》，将产品可用范围改\n为白名单制: Claude.ai、Claude Code、Cowork、\nAPI，以及经云平台和授权经销商提供的 Claude 模型，\n仅在名单所列的 185 个国家和地区可用，未列入者一\n律不支持。\n政策的三条禁止比名单本身更严: 人身处不支持地区\n时使用即违规，包括支持地区公司的员工出差; 在不\n支持地区注册或设总部的实体及其人员使用违规，不\n论人是否在支持地区;被不支持地区主体直接或间接\n多数持股或控制的公司，其人员同样违规。\n名单含中国台湾，乌克兰则排除克里米亚、顿涅茨克、赫尔松、?3\n卢甘斯克、扎波罗热五个地区; 中国大陆、香港、澳门均不在\n列。但伊拉克、利比亚、索马里、苏丹、巴勒斯坦等国在列，可\n见它并非照抄美国制裁名单，而是 Anthropic 自身的合规口径;\n属地和附属地随母国计入，如波多黎各按美国处理。      入\n侈@差评君", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【24】"}, {"n": 25, "t": "Anthropic路演PPT里最值得看的就是这张“AI能力扩展曲线”图，展示 AI 在任务复杂度和时间跨度上的快速进步，也说明智", "b": "最值得看的就是这张“AI能力扩展曲线”图，展示 AI 在任务复杂度和时间跨度上的快速进步，也说明智能推向前沿，并覆盖高价值、高影响领域。\n1）从24年的相对基础的能力：如查找事实、修bug、图像识别；\n\n2）到25年-26年的代码重构、多步工作流、深度研究、自主编程、智能体工作流、自动化风险分析、安全漏洞评估、监管申报起草、保护关键开源软件）等。\n\n3）现在以致未来进入更高阶、更长周期、更接近真实世界影响的任务包括：工业设计与工艺验证、自主网络防御、药物发现、先进疾病检测与诊断、自主软件开发、机器人系统与物理自动化、个性化教育、专家级金融与法律建议、供应链自动化。\n为什么说这这张图最值得看，因为它意味着AI进入的应用场景越多、说明采用是在不断扩散，自然商业化也在进一步加速。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【25】"}, {"n": 26, "t": "截至目前，英伟达（NVIDIA）CEO黄仁勋的妻子洛莉・黄（Lori Huang）并未针对近期婚外情风波发表任何正式的公开声明，", "b": "私生活进入公容视野，今天，     简短地\n打破:       默。我的丈夫背叛了我，他在\n公开前告诉了我，我感谢他，至少给了我\n这点尊重。但无论道歉多诬公开， 都无法\n让信任一夜恢复，即便信任还有可能，修\n复也只能私下慢慢来有人间我 : 是否相\n信那些针对黄女士的指控 ? 我不知道真\n相，电视上发表评论的人也是。国家安全\nFale > QAR > WE A Ba\n理，而不是专栏作家。黄仁动必须完整回\n答每个问题，诚实作答，不找藉口。我不\n会加入对黄女士的残酷围攻，她究竟做过\n什么 ? 没做过什么 ? 应该由证据认定，而\n不是新闻标题。给英传达的每一位同事，\n你们创造了非凡的成就，一个人的过错，\n不会贬低你们的付出，请继续做下去 ! 我\n们的婚姻能否继续，由黄仁动、孩子们和\n我来决定，这不该交给民调决定。我只有\n一个请求，请给我的家人时间和私人空间\n来悲伤，去思考和做决定\nStatement from Jensen\nHuang's wife, Lori, about her\nhusband’s cheating!!\nga) AUR eee 四 作\n20 «64", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【26】"}, {"n": 29, "t": "张雪改口，53号冠军车拍卖款不再捐给韩红基金会：", "b": "张雪改口，53号冠军车拍卖秋不再捐给韩红\n基金会: 发生了一些事，我内心是有质疑\n的; 此前曾许诺“拍卖冠军赛车捐给韩红基\n£2\"\nQ amir                           关注\n张雪改口了 | 冠军车拍卖款不再捐给韩红基金会。张雪11月10日发视频宣布将\n在22日的嘉年华活动中， 拍卖53号冠军赛车。“所有款项我们全部用于资助中国\n小车手成长。”\n他还解释 ,“之前我有许诺过就是把我们真实的赛车拍卖，用于捐款给某某营善\n基金会，但是后面发生了一些事情，其实我内心是有些质疑的。”\n年5月，张雪曾公开说将拍卖德比斯驾驶的53号车，所得款项将捐给韩红基金\nyd >", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【29】"}], "cult": [{"n": 27, "t": "情况就是这么一个情况�r(��_�濉�)�q", "b": "你是说在世界上所有经典名著、音乐、电影几\n乎都唾手可得的现在，结果人们最终选择了持\n音跟红果吗?\n26年11月10日, 0:04 . 129K 查看次数\nGDitee 1133 Sa2sk 内lo &", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【27】"}, {"n": 28, "t": "@Super滚筒:《阿嬷》票房20亿豆瓣9.3，《密档》票房2000万豆瓣6.7，然后他得了最佳导演，金鸡奖的含金量嗷", "b": "@M大王叫我来巡山:也不是第一回了\n@sven_shi:确实也是很典型的小圈子。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【28】"}, {"n": 31, "t": "《可能的爱》中，赵汝贞饰演的纪录片导演嫁给富有的丈夫，却想保有独立的创作身份。李沧东在最近一次访谈中说，自己拍电影同样离不开资本", "b": "录片导演嫁给富有的丈夫，却想保有独立的创作身份。李沧东在最近一次访谈中说，自己拍电影同样离不开资本，这次合作网飞就是例子。他觉得自己和这个角色就像彼此映照的镜子，都在依靠资金的同时努力保住自己发创作的机会。他还透露，自己曾有几次想拍纪录片，但最终都没有拍成。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196693#:~:text=【31】"}]}}, {"date": "20261112", "label": "11月12日", "week": "周四", "id": "196707", "title": "黄仁勋再传婚外情，英伟达董事会拟将其罢免", "cats": {"econ": [{"n": 8, "t": "离岸信托征税的同时，网店查税也没拉下", "b": "没拉下", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【8】"}, {"n": 9, "t": "腾讯把司庆日办成了裁员预告这事儿闹得还挺大的，鹅厂终于打算清理那些把公司当成养老院的人了吗⋯⋯", "b": "儿闹得还挺大的，鹅厂终于打算清理那些把公司当成养老院的人了吗⋯⋯", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【9】"}, {"n": 20, "t": "战争期间，超过80座能源设施遭到袭击，主要位于科威特、卡塔尔和巴林，其中三分之一遭受严重破坏。", "b": "到袭击，主要位于科威特、卡塔尔和巴林，其中三分之一遭受严重破坏。\n除了能源基础设施遭受破坏，战争也冲击旅游业和房地产等其他领域，导致这些行业未来数年的增长放缓。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【20】"}, {"n": 25, "t": "给大家讲个笑话", "b": "给大家讲个笑话\n为了防止大家焦虑，给大家讲个笑话，2019年160\n万买的房子，现在同户型挂牌价30多万，银行贷款\n还有100万萝萝轴\nQ 猜你想搜 朗基香颂天府\n22 说点什么   GD 4932 Ly 1333) 1431", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【25】"}, {"n": 28, "t": "吸取了WTO的教训，每一条都是有针对性的", "b": "第五次申请加入CPTPP\nCPTPP全称是\n全面进步与跨太平洋伙伴关系协定\nWTO解散了 WTO的时代结束了\nCPTPP是WTO的升级款\nCPTPP的加入要求更严格更严谨\n加入这个贸易组织有2000多项条款\n加入CPTPP的条件:\n1 . 工会独立 与政府脱钩\n2 . 不对国企企业进行任何补贴和扶持\n国企 民企 私企公平竞争\n3. 外资服务器可留在本国\n4. 公务员财产公开\n加入CPTPP的要求:\n1 . 稳定和透明的政治体制\n2. 开放且自由的经济环境\n3. 具备长远的市场潜力值\n4. 良好的劳工生活工作权益\n5 . 其余会员国的一致同意", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【28】"}], "soc": [{"n": 5, "t": "11月11日，记者获悉，中国共产党党员，原四川长虹电子集团有限公司党委书记、董事局主席倪润峰同志因病医治无效，于2026年11月", "b": "产党党员，原四川长虹电子集团有限公司党委书记、董事局主席倪润峰同志因病医治无效，于2026年11月11日15时55分在绵阳市中心医院逝世，享年82岁。\n倪润峰，男，汉族，中共党员，1944年2月出生，山东荣成人。他将长虹打造成“中国彩电大王”，为中国彩电业走向世界奠定了良好基础。在他的带领下，长虹率先在国内掌握机芯技术、多功能遥控等彩电核心技术，推动了中国大屏幕彩电的普及，打破了外资品牌对中国彩电市场的垄断。（四川日报）", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【5】"}, {"n": 6, "t": "首都医科大学一名学生被电信诈骗180万", "b": "x    &  Hema                            关注\n首都医科大学一学生被电诈180万\n近日，首都医科大学面向全体师生发布了一则反诈通报，\n通报显示该校一名学生章遇冒充公检法形式的电信网络诈\n骗，线上线下累计转付近180万元。经警方紧急止付拦截\n37万元，实际损失142万余元。#反诈开学第一课 HAR #\n社会 OARS #大学生 #首都医科大学 HED\n共 34 条评论\n&  momo\nta有180万为什么要学医啊\n49分钟前 北京\n1or D5          @osies", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【6】"}, {"n": 7, "t": "近期，部分比亚迪“大唐”车主在网络上反映，车辆疑似存在前后轮辋装反的问题。11月11日，比亚迪发表致歉声明，确认部分车辆轮辋错装", "b": "网络上反映，车辆疑似存在前后轮辋装反的问题。11月11日，比亚迪发表致歉声明，确认部分车辆轮辋错装。\n用户担忧上述问题会带来安全隐患。比亚迪称，经专项检测，错装不影响车辆操控，无行驶安全风险。比亚迪提出，将为这部分车辆安排免费检测并对轮辋进行调换，期间会为车主提供代步车或交通费用补偿，相关车辆将重新起算整车质保。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【7】"}, {"n": 10, "t": "唉，亚洲父母", "b": "当亚洲小孩向亚洲父母报成绩:\n前三名以外\n第一名不代表什么\n你现在不能骄做更不能自满\n更重要的是你下次还能不能\nDHARBR—?  fiaww leet\nBisse\n= “Bae E aT                                   Pee eras\n- BF:\n7:\n- 准备进厂吧", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【10】"}], "intl": [{"n": 1, "t": "中共中央政治局委员、外交部长王毅11日同美国国务卿鲁比奥通电话。双方就中美关系及两国元首互动深入交换意见，通话是积极和建设性的。", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【1】"}, {"n": 2, "t": "中国驻美国大使谢锋10日晚表示，近年来，中国、美国和世界发生了重大深刻变化，两国关系也经历波折起伏，但中美关系互利共赢的本质特征", "b": "配图", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【2】"}, {"n": 11, "t": "西方情报机构评估，尽管经历数月空袭，伊朗目前每月仍能制造约50枚弹道导弹，大概是战前产能的一半。", "b": "空袭，伊朗目前每月仍能制造约50枚弹道导弹，大概是战前产能的一半。\n彭博社报道，自战争初期以来，美国一直声称伊朗武器库存和重建能力已遭到严重削弱。美国战争部长赫格塞斯星期二（11月10日）在讲话中重申，伊朗80%的工业基础已被摧毁。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【11】"}, {"n": 12, "t": "伊朗最高国家安全委员会秘书雷扎伊指出，伊朗不会让一点浓缩铀运出境，若美国对伊朗发动新的打击，必将招致后果。", "b": "伊指出，伊朗不会让一点浓缩铀运出境，若美国对伊朗发动新的打击，必将招致后果。\n雷扎伊星期三（11月11日）在接受黎巴嫩亲伊朗的“广场”电视台（Al Mayadeen TV）采访时称，伊方已告知俄罗斯，浓缩铀将留在伊朗境内供自己使用。伊朗需要用浓缩铀设计以核能为动力的船舶和潜艇。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【12】"}, {"n": 13, "t": "美国斡旋的俄罗斯和乌克兰第二天谈判已结束，乌方称有望在年底前达成冲突解决方案，俄方也称双方在一些问题上达成共识。", "b": "谈判已结束，乌方称有望在年底前达成冲突解决方案，俄方也称双方在一些问题上达成共识。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【13】"}, {"n": 14, "t": "白宫法律顾问沙夫（Will Scharf）致信众议院监督委员会准主席、民主党籍众议员加西亚（Robert Garcia），指责民", "b": "charf）致信众议院监督委员会准主席、民主党籍众议员加西亚（Robert Garcia），指责民主党人企图利用国会调查程序恐吓并骚扰政府官员。信中指，任何旨在阻挠行政官员履职、或意在恐吓施压的滥权调查，都可能越界构成犯罪。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【14】"}, {"n": 15, "t": "西班牙最大的两个工会劳工总联盟（UGT）和工人委员会（CCOO）支持星期三（11月11日）的罢工，两个工会合计代表超过100万名", "b": "（UGT）和工人委员会（CCOO）支持星期三（11月11日）的罢工，两个工会合计代表超过100万名工人。此外，因租金上涨和驱逐租客问题而感到愤怒的租户协会也参与其中。\n这是西班牙自2012年欧元区债务危机期间，工人为反对紧缩措施而罢工以来，首次举行全国大罢工。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【15】"}, {"n": 16, "t": "在英伟达首席执行官黄仁勋深陷“间谍门”婚外情丑闻并传出恐遭董事会罢免之际，美国参议院两名民主党高层要求特朗普政府妥善保存所有涉及", "b": "间谍门”婚外情丑闻并传出恐遭董事会罢免之际，美国参议院两名民主党高层要求特朗普政府妥善保存所有涉及英伟达对华晶片出口及黄仁勋相关事件的记录，显示国会正为启动深入调查铺路。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【16】"}, {"n": 17, "t": "沙特阿拉伯向石油输出国组织报告称，沙特上个月原油产量增长26%，升至战争爆发前以来的最高水平。沙特引领地区原油产量复苏，而供应回", "b": "称，沙特上个月原油产量增长26%，升至战争爆发前以来的最高水平。沙特引领地区原油产量复苏，而供应回升正推动油价走低。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【17】"}, {"n": 18, "t": "韩国持续面对低生育率冲击，明年小学新生人数预计首次跌破30万人，创历史新低。", "b": "小学新生人数预计首次跌破30万人，创历史新低。\n随着2020年冠病疫情期间出生的“冠病宝宝”陆续入学，各地学校合并、关闭的速度料将加快。教育界担忧，废校潮可能进一步加剧地方人口流失，形成恶性循环。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【18】"}, {"n": 19, "t": "这是近期欧洲各地遭遇的一系列威胁和网络攻击事件中的最新一起，此前受影响的目标包括超市、血库、空中交通系统和电视台。", "b": "胁和网络攻击事件中的最新一起，此前受影响的目标包括超市、血库、空中交通系统和电视台。\n法国星期二（10日）召见伊朗大使，指德黑兰发动一场网络攻击，导致上周数百家超市的冷藏设备瘫痪。伊朗外交部则驳斥这些指控，称“毫无根据且充满敌意”，并否认伊朗革命卫队参与这些攻击。\n一些欧洲官员也担心，这些虚假威胁可能是某种“混合型”破坏行动的一部分。许多人将此类行动归咎于俄罗斯，认为是俄罗斯针对那些向乌克兰提供援助的国家。莫斯科则否认与此事有关。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【19】"}, {"n": 21, "t": "当时不是都在传川普不会离开白宫，会发动暴力抵抗拜登入主白宫就职。但实际刚刚相反，川普虽然指责拜登窃取了选举，那是明面上的，实际刚", "b": "会发动暴力抵抗拜登入主白宫就职。但实际刚刚相反，川普虽然指责拜登窃取了选举，那是明面上的，实际刚刚相反，川普是个美国人，他知道美国的文化和传统。\n拜登写道：「但他却在这里用温暖的语气送上祝福，听起来就像个老朋友。」\n川普对他说：「乔，你知道吗？要不是政治，我相信我们会是好朋友。」\n这封信使用川普招牌的黑色签字笔，写在白宫信纸上。川普在信中没有批评拜登，也没有挑战选举结果，反而以近乎诗意的笔调，写下他在白宫工作的经验，对拜登给予肯定并献上祝福。\n来看看这封信的原文怎么写的：\n\n\n\n『亲爱的乔：\n每天来椭圆形办公室上班，是超乎想像的福分。每一面墙、每一座雕像、每一幅美丽的画作，以及这个神奇地方的每个角落，都回荡着历史。每一道楼梯、每一条走廊、每一扇门，都通往另一扇门、另一段记忆，也通往美国光辉故事中的另一个转折点。\n我希望你每天都花点时间，好好想想自己身在何处，以及在你之前的那些人，那些形塑人类历史进程的巨人。你现在有机会选择自己在历史上的地位，我知道你会忠于自己，也忠于美国人民。\n许多总统来来去去，只是以共和党人或民主党人的身分执政。他们大多没有改变历史，只是被历史无情的浪潮推着走。这不会发生在你身上，因为我知道你多么爱美国人民。\n你不仅与过去相连，肩上还承载着整个国家的希望与梦想。这个事实的分量永远不会离开你，它是你每个决定的锚。\n你的力量、你最深的能量泉源，来自你知道有千千万万的人依靠着你。他们的抱负与期望，就是你在这里的原因，有这么多人期盼你成功。\n愿上帝保佑你和吉儿，愿上帝保佑美国！\n诚挚的，\n唐纳 』", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【21】"}], "tech": [{"n": 3, "t": "英伟达首席执行官黄仁勋因被揭发涉及两段婚外情，且其中一名对象疑似为中国间谍，公司董事会正准备将他罢免。", "b": "涉及两段婚外情，且其中一名对象疑似为中国间谍，公司董事会正准备将他罢免。\n英伟达董事会最快将于当地时间星期三（11月11日）召开会议，商讨并决定黄仁勋的去留。\n【涉间谍案传闻后 黄仁勋再被曝与直属副总裁发生婚外情】据《纽约时报》等多家媒体报道，英伟达（Nvidia）首席执行官黄仁勋在陷入涉华间谍案风波后，又被曝出曾与该公司一名直接向其汇报的高级管理人员存在不正当关系。\n多名英伟达前员工透露，涉事高管为48岁的英伟达医疗健康业务副总裁金伯利・鲍威尔（Kimberly Powell）。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【3】"}, {"n": 4, "t": "将英伟达首席执行官黄仁勋介绍给其婚外情对象黄乐的，竟是与黄仁勋相识十年的中国商人康伟，而康伟正是黄乐的丈夫。", "b": "其婚外情对象黄乐的，竟是与黄仁勋相识十年的中国商人康伟，而康伟正是黄乐的丈夫。\n知情人士透露，在长达两年的时间里，康伟似乎不仅默许了妻子与黄仁勋的恋情，甚至还公开谈论两人的亲密关系。康伟有时还会半开玩笑地向商业伙伴介绍，称妻子是黄仁勋的私人助理。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【4】"}, {"n": 22, "t": "Wow！今早看纽约时报重磅，黄仁勋还有另一段婚外情！和他自己公司下属………难怪他公开信写的是承认自己“unfaithful to", "b": "仁勋还有另一段婚外情！和他自己公司下属………难怪他公开信写的是承认自己“unfaithful to my wife”，而不是具体的某一段。毕竟，十次一百次也是unfaithful🤪\n\n提炼一下要点：\n\n1. 黄仁勋被曝另一段婚外情：据5名前英伟达员工透露，黄仁勋还曾与英伟达医疗健康业务副总裁 Kimberly Powell 发展婚外关系。这段关系此前从未被媒体报道。\n\n2. 双方均已婚，存在上下级关系：黄仁勋现年63岁，Powell现年48岁，两人各自都有婚姻。Powell是黄仁勋的下属，涉及企业管理中的利益冲突及职场行为规范问题。\n\n3. 酒店亲密视频曝光：今年3月英伟达在圣何塞举行年度开发者大会期间，两人被目击在附近一家酒店举止亲密。一名旁观者用手机拍下视频，但《纽约时报》尚未看到该视频。\n\n4. 安保人员试图控制视频外流：据知情人士透露，黄仁勋的安保人员发现有人拍摄后，将对方带到一旁，并提出让其签署保密协议（NDA）。\n\n5. Powell在英伟达身居要职：她2008年加入英伟达，2016年晋升为高级总监，2017年底成为医疗健康业务副总裁，负责推动英伟达芯片技术在医疗、高等教育等领域的应用。\n\n6. 公司内部早已流传相关传闻：5名消息人士称，黄仁勋与Powell的关系在英伟达内部一直有人讨论。\n\n7. 英伟达已启动调查：在黄仁勋承认此前与另一名女性有婚外情后，英伟达董事会本月委托知名律师事务所 Wachtell, Lipton, Rosen & Katz 展开调查。\n\n8.黄仁勋拒绝回应新爆料：记者周三电话询问他与Powell的关系时，他表示：「我认为你不应该直接找我谈这件事。」随后挂断电话。英伟达未发表评论，Powell也暂未回应。\n\n9.类似高管丑闻并非个例：报道提及英特尔前CEO Brian Krzanich曾因承认与员工有婚外关系而于2018年辞职；麦当劳前CEO Steve Easterbrook则因违反公司规定，与多名员工发生关系，于2019年被解职。", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【22】"}, {"n": 23, "t": "因为出轨丑闻，英伟达CEO黄仁勋或遭公司董事会罢免。有网友呼吁美国富豪马斯克雇佣黄仁勋，马斯克回应说：“那将是我的荣幸。”", "b": "4   zerohedge @ @zerohedge- 2h                xX\nElon please hire Jensen\ni 350K\nElon Musk @ X                              X.com\nr        @elonmusk\nThat would be an honor\n5:22 PM - 11/11/26 - 32K Vi@ess", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【23】"}, {"n": 24, "t": "英伟达公司内部气氛\"令人沉重\"。许多在公司任职多年的老员工长期将黄仁勋视为近乎无懈可击的精神偶像与引路人，眼下正难以接受这一现实", "b": "据CNBC11日援引知情人士透露，黄\n仁勋于周一返回英伟达位于加利福尼\n亚州圣克拉拉的总部，主持了与高层\n管理人员的例行晨会。\n据报道，黄仁勋在会议伊始就提及出\n轨一事，向员工表达赤意，随后迅速\n将议程转向日常业务 ，全程未开放提\n问环节。周二，他同样在办公室出\n现，继续参加各项会议一一此时距公\n司季度财报发布仅剩一周。\n员工向CNBC形容公司内部气氛\"令人\n沉重\"。多名员工对CNBC表示感到震\n惊。知情人士还透露，许多在公司任\n由多年的老员工长期将黄仁勋视为近\n乎无懈可击的精神偶像与引路人，眼\n下正难以接受这一现实。\n外情曝光后黄位|", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【24】"}, {"n": 26, "t": "07:44aul全国王)", "b": "07:44                       aul 全 国王)\n\u003c\n共 黄仁勋或被罢免! 英伟达回调是布局机会?\nt% Q  ay\n黄仁勋再曝新婚外情，董事会据悉准备\n罢免! 英伟达盘后大跌8%\n华尔街见闻13分钟前\n英伟达(NVDA.US)                              173.730\n1.5倍做空NVDA ETF-.… (NVDS.US)             25.600\n2倍做多NVDA ETF-T-... (NVDX.US)              11 460\n@ 4分钟\n42.87% 曙\n444%\n全\n黄仁勋与公司医疗业务副总裁Kimberly Powell存在婚\n外情，两人均已婚，并有目击者被要求签署保密协\n议。消息经《纽约时报》披露后，英伟达美股盘后跌\n3%; 随后《华尔街日报》报道董事会\nE筹划将其解\n职，股价进一步重挫傅8%。AMD、博通盘后则上涨\n约3%。\n英伟达CEO黄仁勋正面临新一轮个人行为方面的质\n疑，报道称公司董事会正筹划将其解职，这一消息\n令全球最重要的人工智能芯片供应商面临潜在的领\n导层剧变。\n11月11日美股盘后，据《纽约时报》援引五名曾在英\n人汪汪人THn册1 LR RHEE Ast hth\n22\no Size                  加|\ne 8B             5\n自选", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【26】"}, {"n": 27, "t": "年内辞职或被罢免的概率，81%\n\r\n年内离婚的概率，18%\n\r\n年内被批捕的概率，5%\n\r\n年内入职新公司的概率，12%\n\r\n年", "b": "年内离婚的概率，18%\n\n年内被批捕的概率，5%\n\n年内入职新公司的概率，12%\n\n年内入职SpaceX的概率，8%\n\n\n\n还有关于英伟达下一任CEO人选（2年内）的开盘：\n\n\n\n开发出Cuda的英伟达副总裁Ian Buck，25%\n\n英伟达首席财务官Colette Kress，22%\n\n黄仁勋（不下台），17%\n\n现担任Arm公司CEO的Rene Haas，3%\n\n英伟达销售负责人Jay Puri，3%\n\n英伟达首席技术官Michael Kagan，2%\n\n英伟达供应链负责人Debora Shoquist，2%\n\n现担任AMD公司CEO的苏姿丰，2%\n\n黄仁勋的女儿MadisonnHuang，2%\n\n黄仁勋的女婿Nico Caprez，1%\n\n黄仁勋的儿子Spencer Huang，1%\n今天全球股市下跌原因之一找到了…", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【27】"}, {"n": 29, "t": "梁斌penny", "b": "今天听说某大厂要大规模裁员，我判断裁员是不可避免的，市场上程序员的需求会压缩到目前的五分之一，大概5个码农能留1个，大厂自动化程度高，可能更惨。确实不需要那么多码农了，AI code都太强大了。\n\n我儿子高中班都开始学work buddy了，许愿式写代码，写游戏了，心想事成都不依赖码农了。。\n \n网友：绝大多数积极配合，想知道是哪小部分不配合", "href": "https://www.dapenti.com/blog/more.asp?name=xilei&id=196707#:~:text=【29】"}], "cult": []}}]}</script>

</header>

<div class="daybar">
  <div class="daybar-inner">
<button class="day-btn" data-date="20261106" onclick="showDay('20261106')"><b>11月6日</b><span>周五</span></button>
<button class="day-btn" data-date="20261107" onclick="showDay('20261107')"><b>11月7日</b><span>周六</span></button>
<button class="day-btn" data-date="20261108" onclick="showDay('20261108')"><b>11月8日</b><span>周日</span></button>
<button class="day-btn" data-date="20261109" onclick="showDay('20261109')"><b>11月9日</b><span>周一</span></button>
<button class="day-btn" data-date="20261110" onclick="showDay('20261110')"><b>11月10日</b><span>周二</span></button>
<button class="day-btn" data-date="20261111" onclick="showDay('20261111')"><b>11月11日</b><span>周三</span></button>
<button class="day-btn active" data-date="20261112" onclick="showDay('20261112')"><b>11月12日</b><span>周四</span></button>
  </div>
</div>

<nav class="section-nav" aria-label="主题导航">
  <div class="nav-inner" id="nav-inner"></div>
</nav>

<main class="wrap" id="top">
  <div id="panels"></div>
</main>

<div class="modal-mask" id="modal-mask" role="dialog" aria-modal="true" aria-label="条目全文">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-tag" id="modal-tag"></div>
      <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
      <h3 id="modal-title"></h3>
      <p id="modal-body-text"></p>
      <div class="modal-src" id="modal-src"></div>
    </div>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <p>本页内容整理自喷嚏网·喷嚏图卦栏目原文（标题与摘要为转述，原文为准），点击条目"来源"可打开当日原文并定位到该条。顶部可切换最近 7 天，底部可直达最近 30 天，每日 18:00 自动更新。</p>
    <div class="footer-links" id="footer-links"></div>
    <p style="margin-top:10px;color:#8C93A3" id="footer-note"></p>
  </div>
</footer>

<script>
var DATA = JSON.parse(document.getElementById('daily-data').textContent);
var DAYS = DATA.days;
var CATS = [
  {id:'econ', mark:'一', name:'经济与民生', sub:'消费 · 就业 · 楼市 · 社保 · 产业', nc:'var(--blue)', soft:'var(--blue-soft)'},
  {id:'soc', mark:'二', name:'社会与健康', sub:'法治 · 教育 · 医疗 · 食品安全', nc:'var(--green)', soft:'var(--green-soft)'},
  {id:'intl', mark:'三', name:'国际', sub:'中美 · 中东 · 俄乌 · 欧洲 · 亚洲', nc:'var(--red)', soft:'var(--red-soft)'},
  {id:'tech', mark:'四', name:'科技与财经', sub:'AI · 大模型 · 航天 · 芯片 · 股市', nc:'var(--purple)', soft:'var(--purple-soft)'},
  {id:'cult', mark:'五', name:'文化娱乐', sub:'影视 · 音乐 · 体育 · 人物 · 段子', nc:'var(--amber)', soft:'var(--amber-soft)'}
];
var WD = {0:'周日',1:'周一',2:'周二',3:'周三',4:'周四',5:'周五',6:'周六'};
var cur = DAYS[DAYS.length - 1].date;

function dayOf(dateStr){
  var y = +dateStr.slice(0,4), m = +dateStr.slice(4,6), d = +dateStr.slice(6,8);
  return WD[new Date(y, m-1, d).getDay()];
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderDay(dateStr){
  cur = dateStr;
  var day = null;
  for (var i=0;i<DAYS.length;i++){ if (DAYS[i].date === dateStr){ day = DAYS[i]; break; } }
  if (!day) return;
  document.getElementById('hd-date').textContent = '每日图卦 · ' + day.label + '（' + day.week + '）';
  document.getElementById('hd-title').textContent = day.title || '喷嚏图卦';
  var total = 0;
  CATS.forEach(function(c){ total += day.cats[c.id].length; });
  document.getElementById('hd-sub').textContent = day.label + ' · ' + total + ' 条 · 五类标签：经济与民生 / 社会与健康 / 国际 / 科技与财经 / 文化娱乐';
  var nav = '';
  CATS.forEach(function(c){
    nav += '<a href="#' + c.id + '" style="--nc:' + c.nc + '"><i></i>' + c.name + '</a>';
  });
  nav += '<a href="#top" class="to-top">回到顶部 ↑</a>';
  document.getElementById('nav-inner').innerHTML = nav;
  var panels = '';
  CATS.forEach(function(c, ci){
    var items = day.cats[c.id];
    panels += '<section class="panel" id="' + c.id + '" style="--sec:' + c.nc + ';--sec-soft:' + c.soft + '">'
      + '<div class="panel-head"><div class="panel-mark">' + c.mark + '</div>'
      + '<div class="panel-title">' + c.name + '<span>' + c.sub + ' · ' + items.length + ' 条</span></div></div>'
      + '<div class="panel-line"></div><div class="items">';
    items.forEach(function(it, i2){
      var wd = dayOf(dateStr);
      var full = items.length === 1 ? ' full' : '';
      var pcl = it.b.length > 90 ? 'clamp' : 'full';
      panels += '<article class="item' + full + '" data-ci="' + ci + '" data-i="' + i2 + '" title="点击查看全文"><div><div class="item-head">'
        + '<div class="src src-' + ['sun','mon','tue','wed','thu','fri','sat'][new Date(+dateStr.slice(0,4), +dateStr.slice(4,6)-1, +dateStr.slice(6,8)).getDay()] + '">' + wd + ' · ' + (it.n < 10 ? '0' : '') + it.n + '</div>'
        + '<a class="src-link" href="' + it.href + '" target="_blank" rel="noopener">来源</a></div>'
        + '<h3>' + esc(it.t) + '</h3><p class="' + pcl + '">' + esc(it.b.replace(/\s+/g,' ')) + '</p></div></article>';
    });
    panels += '</div></section>';
  });
  document.getElementById('panels').innerHTML = panels;
  // 检测正文是否超出 6 行 → 标记"点击查看全文"
  var itemsEls = document.querySelectorAll('.item p.clamp');
  for (var i=0;i<itemsEls.length;i++){
    var p = itemsEls[i];
    if (p.scrollHeight > p.clientHeight + 2){
      var art = p.closest('.item');
      art.classList.add('has-more');
    } else {
      p.className = 'full';
    }
  }
  bindModal();
  var btns = document.querySelectorAll('.day-btn');
  for (var i=0;i<btns.length;i++){
    btns[i].className = btns[i].getAttribute('data-date') === dateStr ? 'day-btn active' : 'day-btn';
  }
  var links = '';
  DAYS.forEach(function(d){
    links += '<div><span class="src">' + d.label + '</span><a href="https://www.dapenti.com/blog/more.asp?name=xilei&id=' + d.id + '" target="_blank" rel="noopener" title="' + esc(d.title) + '">' + esc(d.title) + '</a></div>';
  });
  document.getElementById('footer-links').innerHTML = links;
  document.getElementById('footer-note').textContent = '喷嚏图卦 · 最近30天日报 · ' + DAYS.length + ' 期 · 五主题分类 · 每日 18:00 自动更新';
  history.replaceState(null, '', '#' + dateStr);
}

function showDay(dateStr){ renderDay(dateStr); document.getElementById('top').scrollIntoView({behavior:'smooth'}); }

var curCat = '', curItem = null;
function bindModal(){
  var arts = document.querySelectorAll('.item');
  for (var i=0;i<arts.length;i++){
    arts[i].onclick = function(e){
      if (e.target.closest('.src-link')){ return; }
      var ci = +this.getAttribute('data-ci'), ii = +this.getAttribute('data-i');
      var it = DAYS.filter(function(d){ return d.date === cur; })[0].cats[CATS[ci].id][ii];
      openModal(CATS[ci], it, cur);
    };
  }
}
function openModal(cat, it, dateStr){
  var day = DAYS.filter(function(d){ return d.date === dateStr; })[0];
  document.getElementById('modal-tag').textContent = day.label + '（' + day.week + '） · ' + cat.name + ' · 序号 ' + it.n;
  document.getElementById('modal-title').textContent = it.t;
  document.getElementById('modal-body-text').textContent = it.b;
  document.getElementById('modal-src').innerHTML = '原文：<a href="' + it.href + '" target="_blank" rel="noopener">打开喷嚏网原文</a>';
  document.getElementById('modal-mask').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('modal-mask').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-mask').addEventListener('click', function(e){
  if (e.target === this){ closeModal(); }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ closeModal(); } });

window.addEventListener('hashchange', function(){
  var h = location.hash.slice(1);
  if (h && h.length === 8 && DAYS.some(function(d){ return d.date === h; })){ renderDay(h); }
});

renderDay(cur);
</script>

</body>
</html>
